<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Big Trip</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#7fb8e0;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0;}

  #sub{position:fixed;top:33px;left:0;right:0;text-align:center;font-size:14px;font-weight:bold;color:#fff5c0;pointer-events:none;text-shadow:0 1px 3px #000;z-index:4;}

  #start .big{font-size:52px;}
  #over{background:#000a;display:none;}

  #start button:active,#over button:active{transform:translateY(3px);box-shadow:0 2px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="hud">🗺️ <span id="n">Book</span></div>
<div id="sub"></div>
<canvas id="c"></canvas>
<div id="start"><div class="big">📋✈️🏀</div><h1>MO Big Trip</h1><p>Pick a hotel to book, ride the plane there, drive to the game at Van Nuys Rec Center on Vanowen — then win it with 3 shots! The whole family and Arff come along.</p><button id="go">▶ START THE TRIP</button></div>
<div id="over"><h1 id="ot">🏆 GAME TIME!</h1><p id="om"></p><button id="rs">▶ Trip Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var STEPS=[
    {n:'1 · Book',  sub:'📋 Pick a hotel to book!',         cont:'BOOK IT ▶'},
    {n:'2 · Fly',   sub:'✈️ Fly to the hotel!',            cont:'LAND ▶'},
    {n:'3 · Hotel', sub:'🏨 Checked in — great stay!',      cont:'GO TO THE GAME ▶'},
    {n:'4 · Drive', sub:'🚗 Drive to Van Nuys Rec Center',  cont:'ARRIVE ▶'},
    {n:'5 · GAME',  sub:'🏀 Van Nuys Rec Center · Vanowen', cont:''}
  ];
  var CARDS=[{e:'🏖️',n:'Beach'},{e:'🏔️',n:'Mountain'},{e:'🏙️',n:'City'}];
  var ACTS=[{e:'🍔',n:'EAT'},{e:'🏊',n:'SWIM'},{e:'🏃',n:'RUN'}];
  var ph, pr, tt, sparks, booked, gShots, gScore, mx, mdir, shooting, ball, cheer, msg, aDone, curAct, actT;
  function setStep(){ document.getElementById('n').textContent=STEPS[ph].n; document.getElementById('sub').textContent=STEPS[ph].sub; }
  function reset(){ ph=0; pr=0; tt=0; sparks=[]; booked=-1; gShots=3; gScore=0; mx=0; mdir=1; shooting=false; ball=null; cheer=0; msg=''; aDone=[false,false,false]; curAct=-1; actT=0; setStep();
    document.getElementById('over').style.display='none'; document.getElementById('start').style.display='none'; }
  function pt(ev){ var t0=ev.changedTouches?ev.changedTouches[0]:ev; var r=cv.getBoundingClientRect(); return {x:t0.clientX-r.left,y:t0.clientY-r.top}; }
  function cardRect(i){ var cw=W*0.26, gap=W*0.04, tot=cw*3+gap*2, x0=(W-tot)/2; return {x:x0+i*(cw+gap), y:H*0.36, w:cw, h:H*0.22}; }
  function actRect(i){ var cw=W*0.27, gap=W*0.03, tot=cw*3+gap*2, x0=(W-tot)/2; return {x:x0+i*(cw+gap), y:H*0.77, w:cw, h:H*0.10}; }
  function goRect(){ return {x:(W-W*0.56)/2, y:H*0.895, w:W*0.56, h:H*0.075}; }
  function allAct(){ return aDone[0]&&aDone[1]&&aDone[2]; }
  function tap(p){ if(ph<4){
      if(ph===0){ for(var i=0;i<3;i++){ var c=cardRect(i); if(p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h){ booked=i; document.getElementById('sub').textContent='📋 Booked the '+CARDS[i].n+' hotel!'; beep(560+i*80,0.06); return; } } }
      if(ph===2){ for(var ai=0;ai<3;ai++){ var a=actRect(ai); if(p.x>=a.x&&p.x<=a.x+a.w&&p.y>=a.y&&p.y<=a.y+a.h){ if(!aDone[ai]){ aDone[ai]=true; curAct=ai; actT=0; beep(560+ai*90,0.07); for(var k=0;k<12;k++)sparks.push({x:a.x+a.w/2,y:a.y,vx:(Math.random()-0.5)*6,vy:-1-Math.random()*4,life:26,c:['#ffe27a','#8fe0ff','#fff','#8fffcf'][k%4]}); } return; } }
        if(allAct()){ var gr=goRect(); if(p.x>=gr.x&&p.x<=gr.x+gr.w&&p.y>=gr.y&&p.y<=gr.y+gr.h){ ph++; pr=0; setStep(); } } return; }
      if(pr>=1 && (ph!==0 || booked>=0)){ ph++; pr=0; setStep(); }
      else if(ph!==0 || booked>=0){ pr=1; }
      return; }
    // ph 4: game — shoot
    if(!shooting && gShots>0){ shoot(mx); } }
  cv.addEventListener('touchstart',function(e){ tap(pt(e)); e.preventDefault(); },{passive:false});
  cv.addEventListener('mousedown',function(e){ tap(pt(e)); });
  function shoot(p){ shooting=true; var perfect=Math.abs(p-0.70)<0.05, made=Math.abs(p-0.70)<0.14; var h=hoopPos();
    ball={x:W*0.24, y:H*0.66-Math.min(H*0.13,74)*0.5, t:0, sx:W*0.24, sy:H*0.66-Math.min(H*0.13,74)*0.5, ex:made?h.x:h.x+(p>0.7?h.r*2:-h.r*1.7), ey:made?h.y+2:h.y+h.r*1.1, arc:H*0.34+(0.7-p)*H*0.12, made:made, perfect:perfect, resolved:false }; beep(300+p*400,0.08); }
  function resolve(){ gShots--; if(ball.made){ gScore++; cheer=24; var h=hoopPos(); for(var i=0;i<18;i++)sparks.push({x:h.x,y:h.y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7-1,life:28,c:['#ffe27a','#ff8a3a','#fff','#8fffcf'][i%4]}); msg=ball.perfect?'✨ SWISH!':'🏀 SCORE!'; beep(760,0.08); setTimeout(function(){beep(1040,0.09);},70); } else { msg='😬 Clank!'; beep(150,0.16,'sawtooth'); }
    if(gShots<=0){ setTimeout(win,1000); } else { setTimeout(function(){ shooting=false; ball=null; msg=''; }, 700); } }
  function win(){ var stars=gScore; document.getElementById('ot').innerHTML=(gScore>=2?'🏆 MVP!':'🎉 GAME!')+' '+gScore+'/3';
    document.getElementById('om').textContent='Booked it, flew there, drove to Van Nuys Rec Center and swished '+gScore+' of 3! '+'⭐'.repeat(Math.max(1,stars));
    document.getElementById('over').style.display='flex'; if(gScore>=2 && window.MO_MVP)window.MO_MVP(); }
  function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function box(x,y,w,h,c,r){ ctx.fillStyle=c; if(r){ rr(x,y,w,h,r); ctx.fill(); } else { ctx.fillRect(x,y,w,h); } }
  function shadow(x,y,w){ ctx.save(); ctx.globalAlpha=0.18; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(x,y,w,w*0.28,0,0,6.29); ctx.fill(); ctx.restore(); }

  function person(px,by,ph2,shirt,hair,name){ shadow(px,by,ph2*0.28); var hipY=by-ph2*0.42, shY=by-ph2*0.72, hr=ph2*0.17, hcy=by-ph2*0.90;
    ctx.lineCap='round'; ctx.strokeStyle='#3a3550'; ctx.lineWidth=ph2*0.10;
    ctx.beginPath(); ctx.moveTo(px-ph2*0.11,hipY); ctx.lineTo(px-ph2*0.11,by); ctx.moveTo(px+ph2*0.11,hipY); ctx.lineTo(px+ph2*0.11,by); ctx.stroke();
    ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.ellipse(px-ph2*0.11,by,ph2*0.10,ph2*0.05,0,0,6.29); ctx.fill(); ctx.beginPath(); ctx.ellipse(px+ph2*0.11,by,ph2*0.10,ph2*0.05,0,0,6.29); ctx.fill();
    ctx.fillStyle=shirt; rr(px-ph2*0.21,shY,ph2*0.42,hipY-shY+ph2*0.05,ph2*0.10); ctx.fill();
    ctx.strokeStyle=shirt; ctx.lineWidth=ph2*0.11; ctx.beginPath(); ctx.moveTo(px-ph2*0.20,shY+ph2*0.05); ctx.lineTo(px-ph2*0.31,shY+ph2*0.30); ctx.moveTo(px+ph2*0.20,shY+ph2*0.05); ctx.lineTo(px+ph2*0.31,shY+ph2*0.30); ctx.stroke();
    ctx.fillStyle='#f3c9a0'; ctx.beginPath(); ctx.arc(px-ph2*0.31,shY+ph2*0.32,ph2*0.055,0,6.29); ctx.fill(); ctx.beginPath(); ctx.arc(px+ph2*0.31,shY+ph2*0.32,ph2*0.055,0,6.29); ctx.fill();
    ctx.fillStyle='#f3c9a0'; ctx.beginPath(); ctx.arc(px,hcy,hr,0,6.29); ctx.fill();
    ctx.fillStyle=hair; ctx.beginPath(); ctx.arc(px,hcy-hr*0.14,hr*1.02,Math.PI*1.02,Math.PI*1.98); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(px-hr*0.36,hcy+hr*0.05,hr*0.13,0,6.29); ctx.fill(); ctx.beginPath(); ctx.arc(px+hr*0.36,hcy+hr*0.05,hr*0.13,0,6.29); ctx.fill();
    ctx.strokeStyle='#b5453a'; ctx.lineWidth=Math.max(1,ph2*0.025); ctx.beginPath(); ctx.arc(px,hcy+hr*0.18,hr*0.42,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    if(name){ ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#2a2a1a'; ctx.font='bold '+Math.max(9,ph2*0.15)+'px Trebuchet MS'; ctx.fillText(name,px,by+ph2*0.16); } }
  function dog(px,by,dh,name){ shadow(px,by,dh*0.35); ctx.save(); var wag=Math.sin(tt*9)*0.5; ctx.lineCap='round'; ctx.strokeStyle='#f0efe9'; ctx.lineWidth=dh*0.13;
    for(var i=0;i<4;i++){ var lx=px-dh*0.30+i*dh*0.20; ctx.beginPath(); ctx.moveTo(lx,by-dh*0.28); ctx.lineTo(lx,by); ctx.stroke(); }
    ctx.fillStyle='#fff'; ctx.strokeStyle='#e6e6e0'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(px,by-dh*0.42,dh*0.42,dh*0.27,0,0,6.29); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=dh*0.12; ctx.beginPath(); ctx.moveTo(px-dh*0.42,by-dh*0.50); ctx.lineTo(px-dh*0.58,by-dh*0.64-wag*dh*0.2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px+dh*0.44,by-dh*0.55,dh*0.23,0,6.29); ctx.fill();
    ctx.fillStyle='#efeee8'; ctx.beginPath(); ctx.ellipse(px+dh*0.36,by-dh*0.66,dh*0.09,dh*0.16,0.4,0,6.29); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(px+dh*0.46,by-dh*0.58,dh*0.045,0,6.29); ctx.fill();
    ctx.fillStyle='#3a2a2a'; ctx.beginPath(); ctx.arc(px+dh*0.63,by-dh*0.53,dh*0.05,0,6.29); ctx.fill();
    ctx.strokeStyle='#e0453a'; ctx.lineWidth=dh*0.07; ctx.beginPath(); ctx.moveTo(px+dh*0.30,by-dh*0.44); ctx.lineTo(px+dh*0.46,by-dh*0.40); ctx.stroke();
    if(name){ ctx.textAlign='center'; ctx.fillStyle='#2a2a1a'; ctx.font='bold '+Math.max(9,dh*0.15)+'px Trebuchet MS'; ctx.fillText(name,px+dh*0.1,by+dh*0.16); } ctx.restore(); }
  function fam(cx,by,u,bnc){ bnc=bnc||0; person(cx-u*0.75,by-bnc,u,'#3a6ea5','#2a2a2a','Daddy'); person(cx-u*0.05,by-bnc,u*0.94,'#d06a95','#5a2f14','Mommy'); person(cx+u*0.55,by-bnc,u*0.66,'#e0a030','#3a2412','Me'); dog(cx+u*1.15,by-bnc,u*0.72,'Arff'); }
  function miniPlayer(x,by,s,shirt){ shadow(x,by,s*0.30); ctx.lineCap='round'; ctx.strokeStyle='#3a3550'; ctx.lineWidth=s*0.11; ctx.beginPath(); ctx.moveTo(x-s*0.12,by-s*0.4); ctx.lineTo(x-s*0.12,by); ctx.moveTo(x+s*0.12,by-s*0.4); ctx.lineTo(x+s*0.12,by); ctx.stroke(); ctx.fillStyle=shirt; rr(x-s*0.22,by-s*0.74,s*0.44,s*0.38,s*0.1); ctx.fill(); ctx.fillStyle='#f3c9a0'; ctx.beginPath(); ctx.arc(x,by-s*0.88,s*0.18,0,6.29); ctx.fill(); ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.arc(x,by-s*1.0,s*0.19,Math.PI,0); ctx.fill(); }
  function drawBench(x,by,cA,cB){ var s=Math.min(H*0.052,30); box(x-s*1.25,by-s*0.15,s*2.5,s*0.28,'#8a5a3a',4); box(x-s*1.2,by+s*0.1,s*0.18,s*0.4,'#6a4a2a'); box(x+s,by+s*0.1,s*0.18,s*0.4,'#6a4a2a'); miniPlayer(x-s*0.6,by-s*0.15,s,cA); miniPlayer(x+s*0.6,by-s*0.15,s,cB); ctx.fillStyle='#fff'; ctx.font='bold 10px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('BENCH',x,by+s*0.65); }
  function sky(){ var s=ctx.createLinearGradient(0,0,0,H); s.addColorStop(0,'#9fe0ff'); s.addColorStop(1,'#e8f6ff'); ctx.fillStyle=s; ctx.fillRect(0,0,W,H); ctx.fillStyle='#fff2a0'; ctx.beginPath(); ctx.arc(W*0.84,H*0.13,20,0,6.29); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.55)'; for(var i=0;i<5;i++){ var cx2=((i*W*0.28)-tt*(6+i*2))%(W+140); if(cx2<-140)cx2+=W+140; ctx.beginPath(); ctx.ellipse(cx2,H*0.10+i*22,42-i*3,14,0,0,6.29); ctx.fill(); } }
  function ground(col){ ctx.fillStyle=col||'#8fd07a'; ctx.fillRect(0,H*0.72,W,H*0.28); }
  function stepDots(){ var n=5, r=5, gap=18, x0=W/2-(n-1)*gap/2; for(var i=0;i<n;i++){ ctx.beginPath(); ctx.arc(x0+i*gap,H*0.075,i===ph?r+1:r-1,0,6.29); ctx.fillStyle=i<ph?'#8fffa8':(i===ph?'#ffd23f':'rgba(255,255,255,0.5)'); ctx.fill(); } }
  function contBtn(txt){ var bob=Math.sin(tt*2)*3, bw=W*0.56,bx=(W-bw)/2,by=H*0.90+bob; box(bx,by,bw,H*0.075,'#f0b429',16); box(bx,by,bw,H*0.05,'#ffe07a',16); ctx.fillStyle='#5a3a00'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 19px Trebuchet MS'; ctx.fillText(txt,W/2,by+H*0.037); }
  function drawCar(cx,cy,s){ ctx.save(); ctx.translate(cx,cy); shadow(0,s*0.42,s*0.6);
    box(-s*0.55,-s*0.06,s*1.10,s*0.40,'#ff5a5a',s*0.12); box(-s*0.30,-s*0.34,s*0.58,s*0.30,'#e84a4a',s*0.10);
    box(-s*0.26,-s*0.30,s*0.24,s*0.22,'#bfeaff',s*0.05); box(s*0.03,-s*0.30,s*0.22,s*0.22,'#bfeaff',s*0.05);
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=(s*0.17)+'px sans-serif'; ctx.fillText('👦',-s*0.14,-s*0.19); ctx.fillText('🐶',s*0.13,-s*0.19);
    box(-s*0.55,s*0.12,s*1.10,s*0.05,'#ffd23f'); ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.arc(-s*0.30,s*0.34,s*0.15,0,6.29); ctx.arc(s*0.32,s*0.34,s*0.15,0,6.29); ctx.fill(); ctx.fillStyle='#cfd6dd'; ctx.beginPath(); ctx.arc(-s*0.30,s*0.34,s*0.07,0,6.29); ctx.arc(s*0.32,s*0.34,s*0.07,0,6.29); ctx.fill();
    ctx.restore(); }
  function draw(){ tt+=0.05; if(typeof ph==='undefined'){ requestAnimationFrame(draw); return; }
    if(pr<1) pr+=0.012;
    if(ph===0){ sky(); ground('#c8b48a'); box(0,0,W,H*0.72,'#eaf2fb'); ctx.fillStyle='#cfe0ee'; ctx.fillRect(0,H*0.66,W,H*0.06);
      ctx.fillStyle='#2a3a5a'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 17px Trebuchet MS'; ctx.fillText('✈️ BOOK YOUR HOTEL',W/2,H*0.30);
      for(var i=0;i<3;i++){ var c=cardRect(i); var sel=(booked===i); box(c.x,c.y,c.w,c.h, sel?'#fff3cf':'#ffffff',12); ctx.strokeStyle=sel?'#f0b429':'#cfd6dd'; ctx.lineWidth=sel?4:2; rr(c.x,c.y,c.w,c.h,12); ctx.stroke();
        ctx.font=Math.min(c.w*0.5,40)+'px sans-serif'; ctx.fillText(CARDS[i].e,c.x+c.w/2,c.y+c.h*0.42); ctx.fillStyle='#2a3a5a'; ctx.font='bold 13px Trebuchet MS'; ctx.fillText(CARDS[i].n,c.x+c.w/2,c.y+c.h*0.78);
        if(sel){ ctx.fillStyle='#2ec46a'; ctx.beginPath(); ctx.arc(c.x+c.w-12,c.y+12,10,0,6.29); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 12px Trebuchet MS'; ctx.fillText('✓',c.x+c.w-12,c.y+13); } }
      fam(W*0.5,H*0.70,Math.min(H*0.12,66));
      if(booked<0){ ctx.fillStyle='#3a5a8a'; ctx.font='bold 13px Trebuchet MS'; ctx.fillText('👆 Tap a hotel to book',W/2,H*0.615); }
    } else if(ph===1){ sky(); var px=(-0.2+pr*1.1)*W;
      ctx.save(); ctx.translate(px,H*0.40+Math.sin(tt*2)*6); ctx.rotate(-0.05);
      shadow(0,60,80); ctx.fillStyle='#eef2f8'; rr(-72,-16,152,32,16); ctx.fill(); ctx.fillStyle='#3a86e0'; rr(-72,-4,152,10,5); ctx.fill();
      ctx.fillStyle='#cfe0ee'; ctx.beginPath(); ctx.moveTo(60,-14); ctx.lineTo(86,-42); ctx.lineTo(72,-14); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#8a939f'; ctx.beginPath(); ctx.moveTo(-10,10); ctx.lineTo(-42,42); ctx.lineTo(22,12); ctx.closePath(); ctx.fill();
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='15px sans-serif'; ctx.fillText('👨',-40,-2); ctx.fillText('👩',-18,-2); ctx.fillText('👦',4,-2); ctx.fillText('🐶',26,-2);
      ctx.restore(); ground('#7fc0e0'); ctx.fillStyle='#6fb0d0'; for(var wv=0;wv<W;wv+=40){ ctx.beginPath(); ctx.arc(wv+(tt*10%40),H*0.80,6,Math.PI,0); ctx.fill(); }
    } else if(ph===2){ var fy=H*0.70;
      var gg=ctx.createLinearGradient(0,0,0,fy); gg.addColorStop(0,'#cfe0f2'); gg.addColorStop(1,'#9fb8d4'); ctx.fillStyle=gg; ctx.fillRect(0,0,W,fy);
      ctx.fillStyle='#b58f6a'; ctx.fillRect(0,fy,W,H-fy);
      box(W*0.62,H*0.15,W*0.28,H*0.16,'#bfe4f4',8); ctx.strokeStyle='#fff'; ctx.lineWidth=4; rr(W*0.62,H*0.15,W*0.28,H*0.16,8); ctx.stroke();
