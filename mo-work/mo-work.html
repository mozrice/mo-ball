<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🧰 MO WORK</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#14110a;color:#fdf6e7;font-family:'Trebuchet MS',Verdana,sans-serif;overflow:hidden;}
  #wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:8px;}
  .namebtn{display:block;margin:6px auto 2px;background:linear-gradient(#ffd24a,#f0a52b);color:#4a2f08;font-weight:bold;border:none;border-radius:14px;padding:9px 22px;font-size:16px;font-family:inherit;box-shadow:0 4px 0 #0006;text-decoration:none;}
  h1{margin:2px 0;font-size:20px;color:#ffcf4a;text-shadow:0 2px 0 #0007;}
  #steps{font-size:13px;color:#ffe4a8;margin:2px 0 6px;font-weight:bold;}
  canvas{background:#e7dcc4;border-radius:16px;box-shadow:0 8px 24px #0009;touch-action:none;max-width:100%;height:auto;}
  #nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .nb{background:#3a2c12;border:2px solid #7a5a24;color:#ffe9c4;font-weight:bold;font-size:14px;padding:8px 14px;border-radius:12px;font-family:inherit;text-decoration:none;}
</style>
</head>
<body>
<div id="wrap">
  <a class="namebtn" href="../index.html">🏠 MO ARCADE</a>
  <h1>🧰 MO WORK</h1>
  <div id="steps">Do house jobs and earn coins!</div>
  <canvas id="cv" width="440" height="620"></canvas>
  <div id="nav">
    <a class="nb" href="../index.html">← Back</a>
    <a class="nb" href="../mo-home.html">🏠 MO Home</a>
    <a class="nb" href="../games.html">🎮 All Games</a>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById("cv"), cx=cv.getContext("2d"), steps=document.getElementById("steps");
  var W=cv.width, H=cv.height, t=0;
  var coins=0, best=0, hard=false, houseClean=25; try{ coins=parseInt(localStorage.getItem("mowork_coins")||"0",10)||0; best=parseInt(localStorage.getItem("mowork_best")||"0",10)||0; hard=localStorage.getItem("mowork_hard")==="1"; var hc=localStorage.getItem("mowork_houseclean"); if(hc!==null)houseClean=parseFloat(hc)||25; }catch(e){}
  function save(){ try{ localStorage.setItem("mowork_coins",String(coins)); localStorage.setItem("mowork_best",String(best)); localStorage.setItem("mowork_hard",hard?"1":"0"); localStorage.setItem("mowork_houseclean",String(houseClean)); }catch(e){} }

  var AC=null; function beep(f,d,ty){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),ga=AC.createGain(); o.frequency.value=f;o.type=ty||"square";o.connect(ga);ga.connect(AC.destination);ga.gain.value=.05;o.start();ga.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08)); }catch(e){} }
  function ding(){ beep(720,.08); setTimeout(function(){beep(960,.1);},80); }
  function rr(x,y,w,h,r){ cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath(); }
  function text(s,x,y,sz,c,al){ cx.fillStyle=c||"#fff";cx.font="bold "+sz+"px Trebuchet MS,sans-serif";cx.textAlign=al||"center";cx.textBaseline="middle";cx.fillText(s,x,y); }
  function emo(ch,x,y,s){ cx.font=s+"px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(ch,x,y); }
  function btn(label,y,c){ cx.fillStyle=c||"#7bd07b"; rr(W/2-120,y,240,52,14); cx.fill(); text(label,W/2,y+26,18,"#06280f"); }

  // FX
  var parts=[],floats=[],conf=[],shake=0;
  function burst(x,y,c,n){ n=n||9; for(var i=0;i<n;i++){ var a=Math.random()*6.28,s=2+Math.random()*3; parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c:c,r:2+Math.random()*2}); } }
  function floatUp(s,x,y,c){ floats.push({s:s,x:x,y:y,life:1,c:c||"#fff"}); }
  function confetti(){ for(var i=0;i<26;i++){ conf.push({x:Math.random()*W,y:-10-Math.random()*50,vy:1.8+Math.random()*2.4,vx:Math.random()*2-1,r:3+Math.random()*4,c:["#ff5a7a","#ffd23f","#5ad0a0","#5aa0ff","#c77aff"][i%5],rot:Math.random()*6,vr:Math.random()*0.3-0.15}); } }
  function updFX(){ for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.03; if(p.life<=0)parts.splice(i,1);} for(var j=floats.length-1;j>=0;j--){ var f=floats[j]; f.y-=1; f.life-=0.02; if(f.life<=0)floats.splice(j,1);} for(var k=conf.length-1;k>=0;k--){ var c=conf[k]; c.y+=c.vy;c.x+=c.vx;c.rot+=c.vr; if(c.y>H+20)conf.splice(k,1);} if(shake>0.3)shake*=0.85; }
  function coinShower(){ for(var i=0;i<16;i++){ parts.push({x:Math.random()*W,y:-10-Math.random()*50,vx:Math.random()*2-1,vy:2+Math.random()*2.4,life:1.5,c:"#ffd24a",r:9,coin:true}); } }
  function renFX(){ parts.forEach(function(p){ cx.globalAlpha=Math.max(0,Math.min(1,p.life)); if(p.coin){ emo("💰",p.x,p.y,p.r*2); } else { cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); } }); cx.globalAlpha=1; floats.forEach(function(f){ cx.globalAlpha=Math.max(0,f.life); cx.fillStyle=f.c; cx.strokeStyle="#00000055"; cx.lineWidth=3; cx.font="bold 18px Trebuchet MS,sans-serif"; cx.textAlign="center"; cx.textBaseline="middle"; cx.strokeText(f.s,f.x,f.y); cx.fillText(f.s,f.x,f.y); }); cx.globalAlpha=1; conf.forEach(function(c){ cx.save(); cx.translate(c.x,c.y); cx.rotate(c.rot); cx.fillStyle=c.c; cx.fillRect(-c.r/2,-c.r/2,c.r,c.r*1.6); cx.restore(); }); }

  var RANKS=[[0,"Rookie 🧢"],[60,"Helper 🧹"],[160,"Handy 🔧"],[320,"Pro 🛠️"],[600,"Master 🏆"]];
  function rank(){ var r=RANKS[0][1]; for(var i=0;i<RANKS.length;i++){ if(coins>=RANKS[i][0])r=RANKS[i][1]; } return r; }

  var ROOMS=[["Kitchen","#f0e6cf","#d8b98a"],["Living Room","#e9dcc0","#b98c5a"],["Bedroom","#e7d6e6","#c8a06a"],["Bathroom","#cfe6ee","#bcd0d6"],["Kids' Room","#e6efd0","#c8a06a"],["Backyard","#cfeecf","#7cc46a"],["Garage","#dad6cc","#9a9a9a"],["Office","#dfe6ea","#b98c5a"],["Dining Room","#efdcc8","#b98c5a"],["Hallway","#e6ddc8","#c8a06a"]];
  function label(s){ steps.textContent=s; }
  function go(n){ parts=[];floats=[];conf=[];shake=0; scene=n; if(S[n].init)S[n].init(); }
  var scene="title", g={}, ptr={x:W/2,y:0,down:false}, job=null, earned=0, jobsDone=0;

  function newJob(){ var TY=["clean","fix","place","paint","bulb","build","wipe","move","glass","tv","cords","console","robot","doorbell","fire","vent","water","rug","petdoor","attic","coldrug"]; var ty=TY[Math.floor(Math.random()*TY.length)]; var rm=ROOMS[Math.floor(Math.random()*ROOMS.length)];
    var sub=null; if(ty==="build"){ sub=["doghouse","swingset","grill"][Math.floor(Math.random()*3)]; }
    var titles={clean:"🧹 Clean the "+rm[0], fix:"🔧 Fix things in the "+rm[0], place:"🛋️ Furnish the "+rm[0], paint:"🎨 Paint the "+rm[0], bulb:"💡 Change the "+rm[0]+" light", build:(sub==="doghouse"?"🏠 Build a doghouse":sub==="swingset"?"🛝 Build a swing set":"🔥 Build a grill"), wipe:"🪞 Wipe the "+rm[0]+" mirror", move:"📦 Move the dresser · "+rm[0], glass:"🪟 Wash the greenhouse panels", tv:"📺 Set up the new TV · "+rm[0], cords:"🔌 Untangle the cords · "+rm[0], console:"🎮 Set up the game console", robot:"🤖 Robot vacuum · "+rm[0], doorbell:"🔔 Install the video doorbell", fire:"🧯 Fire extinguisher check · "+rm[0], vent:"🌬️ Clean the AC vents · "+rm[0], water:"🪴 Water the thirsty plants · "+rm[0], rug:"🧼 Steam-clean the rug · "+rm[0], petdoor:"🐕 Install the pet door", attic:"🕸️ Clear the attic cobwebs", coldrug:"🧶 Add a rug to the cold floor · "+rm[0]};
    job={type:ty,room:rm,title:titles[ty]}; go("board"); }
  function room(){ var rm=job.room; cx.fillStyle=rm[1]; cx.fillRect(0,54,W,H); cx.fillStyle=rm[2]; cx.fillRect(0,H*0.66,W,H); cx.fillStyle="rgba(0,0,0,.06)"; for(var i=0;i<W;i+=44)cx.fillRect(i,H*0.66,2,H); }
  function hud(){ cx.fillStyle="rgba(0,0,0,.5)"; cx.fillRect(0,0,W,50); emo("💰",26,26,22); text(String(coins),46,26,18,"#ffd24a","left"); if(hard){ cx.fillStyle="#c0392b"; rr(92,15,52,18,5); cx.fill(); text("HARD",118,25,11,"#fff"); } text(job?job.title:"",W-14,15,13,"#fff","right"); }
  function drawWorker(x,y){ cx.fillStyle="#f6c9a0"; cx.fillRect(x-10,y+2,3,9); cx.fillRect(x+7,y+2,3,9); // arms
    cx.fillStyle="#2b5aa0"; rr(x-7,y-2,14,16,3); cx.fill(); // overalls
    cx.fillStyle="#5a3a1e"; cx.fillRect(x-5,y+14,4,7); cx.fillRect(x+2,y+14,4,7); // legs
    cx.fillStyle="#f6c9a0"; cx.beginPath(); cx.arc(x,y-9,7,0,7); cx.fill(); // head
    cx.fillStyle="#ffd24a"; cx.beginPath(); cx.arc(x,y-11,7.5,Math.PI,2*Math.PI); cx.fill(); cx.fillRect(x-8,y-11,16,2); // hard hat
    cx.fillStyle="#222"; cx.beginPath(); cx.arc(x+2,y-9,1.3,0,7); cx.fill(); }
  function drawVac(x,y,moving){ cx.fillStyle="rgba(0,0,0,.15)"; cx.beginPath(); cx.ellipse(x,y+22,17,5,0,0,7); cx.fill();
    cx.fillStyle="#c0392b"; rr(x-22,y-8,12,22,3); cx.fill(); cx.fillStyle="#8a2a1e"; cx.fillRect(x-22,y-8,12,4);
    cx.strokeStyle="#444"; cx.lineWidth=3; cx.beginPath(); cx.moveTo(x-16,y-2); cx.quadraticCurveTo(x+8,y-6,x+11,y+14); cx.stroke();
    cx.fillStyle="#3a3f45"; cx.beginPath(); cx.moveTo(x+6,y+12); cx.lineTo(x+16,y+12); cx.lineTo(x+20,y+24); cx.lineTo(x+2,y+24); cx.closePath(); cx.fill();
    drawWorker(x,y-6);
    if(moving){ cx.strokeStyle="rgba(120,180,220,.7)"; cx.lineWidth=1.5; for(var i=0;i<3;i++){ cx.beginPath(); cx.arc(x+11,y+24,5+i*3,-2.5,-0.7); cx.stroke(); } } }

  var S={};

  var TOOLEMO=["🔧","🔨","🪛","🎨","🧹","💡","🪜","🧰"];
  S.title={ init:function(){ label("Welcome to MO WORK! Earn coins."); if(Math.random()<1)for(var i=0;i<3;i++)burst(Math.random()*W,H*0.3,"#ffd24a",4); },
    render:function(){ cx.fillStyle="#e7dcc4"; cx.fillRect(0,0,W,H);
      cx.fillStyle="#caa15a"; cx.fillRect(0,H*0.6,W,H);
      // drifting tools in the background
      cx.globalAlpha=0.5; for(var i=0;i<TOOLEMO.length;i++){ var tx=((i*90 + t*0.6)% (W+80))-40; var ty=H*0.12+((i*57)%140)+Math.sin(t*0.04+i)*8; emo(TOOLEMO[i],tx,ty,24); } cx.globalAlpha=1;
      // bobbing toolbox with sparkle
      var by=H*0.26+Math.sin(t*0.06)*6; emo("🧰",W/2,by,72);
      if(t%20===0)burst(W/2+(Math.random()*80-40),by-20,"#fff2a8",3);
      var ts=34+Math.sin(t*0.1)*2; text("MO WORK",W/2,H*0.44,ts,"#5a3a12");
      text("Clean, fix, furnish & paint houses",W/2,H*0.51,15,"#6a4a1a");
      text("Finish jobs to earn 💰 and rank up!",W/2,H*0.56,14,"#6a4a1a");
      cx.fillStyle="#fff8e8"; rr(W/2-110,H*0.6,220,34,10); cx.fill(); cx.strokeStyle="#e0b64a"; cx.lineWidth=2; rr(W/2-110,H*0.6,220,34,10); cx.stroke();
      emo("💰",W/2-72,H*0.617,18); text(coins+"  •  "+rank(),W/2+8,H*0.617,15,"#5a3a12");
      cx.fillStyle=hard?"#e0857a":"#cdbd9a"; rr(W/2-96,H*0.645,192,26,10); cx.fill(); cx.strokeStyle="#00000022"; cx.lineWidth=2; rr(W/2-96,H*0.645,192,26,10); cx.stroke(); text((hard?"🔥 HARD MODE":"😊 NORMAL")+" · tap to switch",W/2,H*0.645+13,12,"#3a2410");
      var pulse=Math.sin(t*0.12)*4; cx.fillStyle="#7bd07b"; rr(W/2-120-pulse/2,H*0.71-pulse/2,240+pulse,48+pulse,14); cx.fill(); text("▶ START WORK",W/2,H*0.71+24,18,"#06280f");
      cx.fillStyle="#b58ae0"; rr(W/2-120,H*0.83,240,46,13); cx.fill(); cx.strokeStyle="#8a5ad0"; cx.lineWidth=2; rr(W/2-120,H*0.83,240,46,13); cx.stroke(); text("🏠 PLAY AT HOME",W/2,H*0.83+23,17,"#2a1540"); },
    tap:function(){ if(ptr.y>H*0.64 && ptr.y<H*0.685 && Math.abs(ptr.x-W/2)<96){ hard=!hard; save(); beep(hard?300:520,.09); return; }
      if(ptr.y>H*0.83 && ptr.y<H*0.83+46 && Math.abs(ptr.x-W/2)<120){ ding(); go("home"); return; }
      ding(); newJob(); } };

  S.board={ init:function(){ label(job.title); },
    render:function(){ cx.fillStyle="#e7dcc4"; cx.fillRect(0,0,W,H); hud();
      cx.fillStyle="#fff8e8"; rr(W/2-150,H*0.2,300,H*0.42,18); cx.fill(); cx.strokeStyle="#e0b64a"; cx.lineWidth=4; rr(W/2-150,H*0.2,300,H*0.42,18); cx.stroke();
      text("NEW JOB",W/2,H*0.26,16,"#b07a2a");
      var ic={clean:"🧹",fix:"🔧",place:"🛋️",paint:"🎨",bulb:"💡",build:"🔨",wipe:"🪞",move:"📦",glass:"🪟",tv:"📺",cords:"🔌",console:"🎮",robot:"🤖",doorbell:"🔔",fire:"🧯",vent:"🌬️",water:"🪴",rug:"🧼",petdoor:"🐕",attic:"🕸️",coldrug:"🧶"}[job.type]; emo(ic,W/2,H*0.35,48);
      text(job.title,W/2,H*0.45,19,"#4a2f08");
      var desc={clean:"Tap every mess to clean it up!",fix:"Fix it with the right moves!",place:"Walk it over with the joystick, then drop it!",paint:"Roll paint over the whole wall!",bulb:"Climb the ladder, then pull the old bulb!",build:"Drag each part in, then hammer it together!",wipe:"Wipe every smudge off the mirror!",move:"Carefully slide the dresser to its spot!",glass:"Squeegee all the grime off the glass!",tv:"Plug it in, connect it, then power on!",cords:"Tap every tangle to untangle the cords!",console:"Set it up — then play a game at home!",robot:"Drive the robot vacuum over all the dirt!",doorbell:"Mount it, then press to test the camera!",fire:"Spray the extinguisher to put out the flames!",vent:"Brush the dust off every vent slat!",water:"Water every droopy plant!",rug:"Steam-clean every stain out of the rug!",petdoor:"Fit the pet door, then let the pet through!",attic:"Sweep every cobweb out of the attic!",coldrug:"Place the rug, then drag to unroll it!"}[job.type];
      text(desc,W/2,H*0.52,14,"#6a4a1a");
      emo("💰",W/2-30,H*0.575,18); text("+ pay when done",W/2+10,H*0.575,13,"#8a6a2a");
      btn("▶ START JOB",H*0.68); },
    tap:function(){ ding(); go(job.type); } };

  // ---------- CLEAN ----------
  var MESS=[["💧",0],["✨",0],["🍪",0],["🧦",0],["🕸️",0],["🗑️",0]];
  S.clean={ init:function(){ g={dx:W/2,dy:H*0.42,dirt:[],tmax:(hard?520:640),time:(hard?520:640),joy:{on:false,kx:0,ky:0},jb:{x:74,y:H-64,r:38}}; var n=(hard?9:6)+Math.floor(Math.random()*3); for(var i=0;i<n;i++){ g.dirt.push({x:40+Math.random()*(W-80),y:96+Math.random()*(H-240),e:MESS[Math.floor(Math.random()*MESS.length)][0],done:false}); } g.total=n; label("Use the joystick to vacuum the dirt! 🕹️"); },
    _joy:function(){ var jb=g.jb; var dx=ptr.x-jb.x, dy=ptr.y-jb.y, d=Math.hypot(dx,dy)||1; var m=Math.min(jb.r,d); g.joy.kx=dx/d*m; g.joy.ky=dy/d*m; },
    update:function(){ if(g.time>0)g.time--; var sp=hard?3.7:3.3; g.dx+=g.joy.kx/38*sp; g.dy+=g.joy.ky/38*sp; g.dx=Math.max(30,Math.min(W-30,g.dx)); g.dy=Math.max(80,Math.min(H-120,g.dy));
      var moving=Math.hypot(g.joy.kx,g.joy.ky)>6, left=0;
      for(var i=0;i<g.dirt.length;i++){ var d=g.dirt[i]; if(d.done)continue; left++; if(Math.hypot(d.x-g.dx,d.y-(g.dy+12))<26){ d.done=true; beep(520+Math.random()*140,.05); burst(d.x,d.y,"#cdb890",7); floatUp("✨",d.x,d.y-8,"#fff"); } }
      if(moving && t%7===0)beep(110,.03,"sawtooth");
      if(left===0 && !done)finish(12+Math.ceil(g.time/40)); },
    render:function(){ room(); hud();
      var left=0; g.dirt.forEach(function(d){ if(!d.done){ left++; emo(d.e,d.x,d.y,26); } });
      drawVac(g.dx,g.dy, Math.hypot(g.joy.kx,g.joy.ky)>6);
      text(left+" dirt left",W/2,H-30,16,"#4a2f08");
      cx.fillStyle="#00000022"; rr(W/2-90,70,180,9,4); cx.fill(); cx.fillStyle="#5ab0e0"; rr(W/2-90,70,180*(g.time/g.tmax),9,4); cx.fill();
      var jb=g.jb; cx.fillStyle="rgba(0,0,0,.16)"; cx.beginPath(); cx.arc(jb.x,jb.y,jb.r,0,7); cx.fill(); cx.strokeStyle="rgba(255,255,255,.55)"; cx.lineWidth=2; cx.beginPath(); cx.arc(jb.x,jb.y,jb.r,0,7); cx.stroke();
      cx.fillStyle="#3a2c12"; cx.beginPath(); cx.arc(jb.x+g.joy.kx,jb.y+g.joy.ky,17,0,7); cx.fill(); cx.fillStyle="#ffd24a"; cx.beginPath(); cx.arc(jb.x+g.joy.kx,jb.y+g.joy.ky,7,0,7); cx.fill();
      if(!g.joy.on && t%40<22)emo("🕹️",jb.x,jb.y-1,20); },
    down:function(){ var jb=g.jb; if(Math.hypot(ptr.x-jb.x,ptr.y-jb.y)<jb.r+34){ g.joy.on=true; this._joy(); } },
    drag:function(){ if(g.joy.on)this._joy(); },
    up:function(){ g.joy.on=false; g.joy.kx=0; g.joy.ky=0; } };

  // ---------- FIX ----------
  var BROKEN=[["Leaky Sink","🚰","wrench"],["Dead Bulb","💡","bulb"],["Wall Crack","🕳️","patch"],["Squeaky Door","🚪","oil"],["Loose Screw","🔩","screw"],["Dripping Tap","🚿","wrench"]];
  var TOOLBTN=[["🔧","wrench"],["💡","bulb"],["🩹","patch"],["🛢️","oil"],["🪛","screw"]];
  var FIXJ=[
    {act:"hammer", nm:"Loose Boards", e:"🪵", tip:"Tap each nail to hammer it in!"},
    {act:"wrench", nm:"Leaky Pipe", e:"🚰", tip:"Drag in circles to tighten the bolt!"},
    {act:"plunge", nm:"Clogged Drain", e:"🚽", tip:"Drag up & down to plunge it!"},
    {act:"wrench", nm:"Wobbly Chair", e:"🪑", tip:"Drag in circles to screw it tight!"},
    {act:"plunge", nm:"Stuck Sink", e:"🚿", tip:"Pump up & down to clear it!"},
    {act:"hammer", nm:"Popped Floor", e:"🪵", tip:"Hammer every nail flat!"}
  ];
  S.fix={ init:function(){ g={j:FIXJ[Math.floor(Math.random()*FIXJ.length)], nails:0, hammer:0, turn:0, ang:null, a0:0, pumps:0, plY:null, wasUp:true, iy:H*0.6};
      g.needN=hard?4:3; g.needTurn=hard?14:9.5; g.needPump=hard?7:5; label("Fix it! "+g.j.tip); },
    update:function(){ if(g.hammer>0)g.hammer--; },
    render:function(){ room(); hud(); var j=g.j;
      cx.fillStyle="#fff8e8"; rr(W/2-82,H*0.19,164,150,16); cx.fill(); cx.strokeStyle="#c8a06a"; cx.lineWidth=3; rr(W/2-82,H*0.19,164,150,16); cx.stroke();
      emo(j.e,W/2,H*0.28,50); text(j.nm,W/2,H*0.4,16,"#4a2f08");
      text(j.tip,W/2,H-38,14,"#4a2f08");
      if(j.act==="hammer"){ var ny=g.iy;

      if(ptr.x>W-104 && ptr.y<150){ if(!g.ball)g.ball={tt:0}; beep(500,.06); return; }
      if(Math.hypot(ptr.x-W*0.3, ptr.y-H*0.42)<82){ g.tvOn=!g.tvOn; beep(g.tvOn?620:300,.08); return; }
      if(Math.hypot(ptr.x-(W-70), ptr.y-(H-92))<44){ g.arf=26; beep(520,.07); setTimeout(function(){beep(380,.1);},80); burst(W-70,H-108,"#ff6a8a",6); return; } } };

  // ---------- PAYOUT ----------
  var done=false;
  var rankUp=false, dispCoins=0, flashA=0, streakBonus=0;
  function finish(pay){ if(done)return; done=true; if(hard)pay=Math.round(pay*1.5); var CLEANJOBS={clean:1,wipe:1,glass:1,vent:1,rug:1,attic:1,fire:1,robot:1,cords:1,coldrug:1}; houseClean=Math.min(100, houseClean+((job&&CLEANJOBS[job.type])?6:3)); var before=rank(); jobsDone++; streakBonus=(jobsDone%5===0)?8:0; earned=pay+streakBonus; dispCoins=coins; coins+=earned; if(coins>best){best=coins;} rankUp=(rank()!==before); flashA=0.85; save(); ding(); go("payout"); }
  S.payout={ init:function(){ done=false; confetti(); coinShower(); if(rankUp){ setTimeout(function(){ ding(); },200); } label("Job done! 💰 +"+earned); },
    _r:function(){ if(dispCoins<coins){ dispCoins=Math.min(coins, dispCoins+Math.max(1,Math.ceil((coins-dispCoins)*0.25))); } },
    render:function(){ this._r(); cx.fillStyle="#e7dcc4"; cx.fillRect(0,0,W,H); hud();
      if(t%38===0){ confetti(); if(t%76===0)coinShower(); }
      cx.fillStyle="#fff8e8"; rr(W/2-150,H*0.2,300,H*0.44,18); cx.fill(); cx.strokeStyle="#e0b64a"; cx.lineWidth=4; rr(W/2-150,H*0.2,300,H*0.44,18); cx.stroke();
      var pop=1+Math.sin(t*0.12)*0.06; text("✅ JOB DONE!",W/2,H*0.28,24*pop,"#3a8a3a");
      emo("💰",W/2-40,H*0.38,32); text("+"+earned+" coins",W/2+18,H*0.38,22,"#b07a2a");
      if(streakBonus>0) text("🔥 +"+streakBonus+" streak bonus!",W/2,H*0.44,13,"#c0392b");
      text("Total: "+dispCoins+" 💰",W/2,H*0.5,18,"#4a2f08");
      if(rankUp){ var g2=Math.abs(Math.sin(t*0.14)); cx.fillStyle="rgba(255,210,74,"+(0.35+g2*0.4)+")"; rr(W/2-130,H*0.535,260,30,10); cx.fill(); text("⭐ RANK UP! "+rank(),W/2,H*0.55,16,"#5a3a12"); }
      else { text("Rank: "+rank(),W/2,H*0.55,16,"#6a4a1a"); }
      var pulse=Math.sin(t*0.12)*3; cx.fillStyle="#7bd07b"; rr(W/2-120-pulse/2,H*0.7-pulse/2,240+pulse,52+pulse,14); cx.fill(); text("▶ NEXT JOB",W/2,H*0.7+26,18,"#06280f"); },
    tap:function(){ ding(); newJob(); } };

  // input
  function pos(e){ var r=cv.getBoundingClientRect(), sx=cv.width/r.width, sy=cv.height/r.height; var a=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:(a.clientX-r.left)*sx, y:(a.clientY-r.top)*sy}; }
  function down(e){ e.preventDefault(); var p=pos(e); ptr.x=p.x;ptr.y=p.y;ptr.down=true; var s=S[scene]; if(s.down)s.down(); if(s.tap)s.tap(); }
  function move(e){ e.preventDefault(); var p=pos(e); ptr.x=p.x;ptr.y=p.y; var s=S[scene]; if(ptr.down&&s.drag)s.drag(); }
  function up(e){ e.preventDefault(); ptr.down=false; var s=S[scene]; if(s.up)s.up(); }
  cv.addEventListener("mousedown",down); cv.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
  cv.addEventListener("touchstart",down,{passive:false}); cv.addEventListener("touchmove",move,{passive:false}); cv.addEventListener("touchend",up,{passive:false});

  function loop(){ t++; var s=S[scene]; if(s.update)s.update(); updFX();
    cx.save(); if(shake>0.4){ cx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake); }
    s.render(); renFX(); cx.restore();
    if(flashA>0.02){ cx.fillStyle="rgba(255,255,255,"+flashA.toFixed(3)+")"; cx.fillRect(0,0,W,H); flashA*=0.86; } else { flashA=0; }
    requestAnimationFrame(loop); }
  loop();
})();
