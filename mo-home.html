  var LYRICS=['M-O, MO on the go!','Dribble dribble, watch me glow!','Shoot the ball, swish, here we go!','Me and my family steal the show!','Arff my puppy loves me so!','Bounce it high and never slow!','MO MO, hear the crowd go!','Home sweet home, watch me grow!','MO is an all star, watch him shine!','All star player, one of a kind!','Number one, all of the time!','MO the all star, feeling so fine!','Jump so high I touch the sky!','All star dreams, aim up high!','Crossover, blow right by!','MO the all star, my oh my!'];
  var li=0, banner=null, gen=0;

  function stepFn(){ var s=step%16; tone(BASS[s],0.17,'square',0.05); tone(LEAD[s],0.16,'triangle',0.05); if(s%4===0)drum(true); if(s===4||s===12)drum(false); step++; }
  function toggle(){ on=!on; var b=document.getElementById('moMusicBtn'); if(on){ ensure(); step=0; li=0; gen++; if(timer)clearInterval(timer); timer=setInterval(stepFn,125); try{ if(window.speechSynthesis)window.speechSynthesis.cancel(); }catch(e){} singNext(gen); if(b){ b.textContent='🎶 THEME ON'; b.style.borderColor='#7bff9e'; } } else { gen++; if(timer)clearInterval(timer); if(banner)banner.style.opacity='0'; try{ if(window.speechSynthesis)window.speechSynthesis.cancel(); }catch(e){} if(b){ b.textContent='🎵 MO THEME'; b.style.borderColor='#ff6ad5'; } } }
