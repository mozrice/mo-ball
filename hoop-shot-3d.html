<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a22;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f4f7f9; }
  #title { position: absolute; top: 10px; width: 100%; text-align: center;
    font-size: 20px; letter-spacing: 4px; text-transform: uppercase; color: #7fb2c9; }
  #score { position: absolute; top: 40px; width: 100%; text-align: center;
    font-size: 40px; font-weight: bold; color: #ffcf5c; }
  #stats { position: absolute; top: 58px; left: 16px; font-size: 14px;
    letter-spacing: 1px; color: #9fc0d0; }
  #fouls { position: absolute; top: 78px; left: 16px; font-size: 14px;
    letter-spacing: 1px; color: #9fc0d0; }
  #dogscore { position: absolute; top: 78px; left: 16px; font-size: 14px;
    letter-spacing: 1px; color: #f0a58f; }
  #msg { position: absolute; top: 92px; width: 100%; text-align: center;
    font-size: 22px; font-weight: bold; letter-spacing: 2px; color: #ffcf5c;
    text-transform: uppercase; opacity: 0; transition: opacity .1s; }
  #hint { position: absolute; bottom: 96px; width: 100%; text-align: center;
    font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #9fc0d0; }
  /* power meter */
  #meter { position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%);
    width: 280px; height: 22px; border-radius: 6px; background: #0e1a22;
    border: 2px solid #5b6b76; overflow: hidden; }
  #green { position: absolute; top: 0; height: 100%; background: #2f7d4f; }
  #fill  { position: absolute; top: 0; left: 0; height: 100%; width: 0; background: #ffcf5c; }
  /* buttons */
  .btn { pointer-events: auto; position: absolute; font: inherit; font-size: 14px;
    font-weight: bold; letter-spacing: 2px; text-transform: uppercase; padding: 9px 18px;
    border-radius: 999px; border: none; background: #ff8b2c; color: #2a1200; cursor: pointer;
    box-shadow: 0 4px 0 #b85c12; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b85c12; }
  #backBtn { top: 12px; left: 12px; background: #1b2f3c; color: #9fc0d0;
    border: 2px solid #2f4a5c; box-shadow: none; }
  #musicBtn { top: 12px; right: 12px; background: #1b2f3c; color: #9fc0d0;
    border: 2px solid #2f4a5c; box-shadow: none; }
  #verBtn { top: 12px; right: 108px; background: #1b2f3c; color: #ffcf5c;
    border: 2px solid #b8922a; box-shadow: none; }
  #viewBtn { top: 12px; left: 92px; background: #1b2f3c; color: #9fc0d0;
    border: 2px solid #2f4a5c; box-shadow: none; }
  #nameBtn { top: 12px; left: 178px; background: #1b2f3c; color: #9fc0d0;
    border: 2px solid #2f4a5c; box-shadow: none; }
  #shootBtn { bottom: 10px; left: 50%; transform: translateX(-50%); }
  #toBtn { bottom: 10px; left: 12px; background: #7fd0ff; color: #082430; box-shadow: 0 4px 0 #3f7f9f; }
  #modeBtn { bottom: 10px; right: 12px; background: #6bd18a; color: #06280f; box-shadow: 0 4px 0 #3a8f56; }
  #rebBtn { bottom: 58px; right: 12px; background: #f6c945; color: #3a2a00; box-shadow: 0 4px 0 #b8922a; }
  #dunkBtn { bottom: 106px; right: 12px; background: #ff5a3c; color: #fff2ee; box-shadow: 0 4px 0 #b83a26; }
  #stealBtn { bottom: 154px; right: 12px; background: #4fd0c0; color: #06322c; box-shadow: 0 4px 0 #2f8f83; }
  #dblBtn { bottom: 154px; left: 12px; background: #9b8cff; color: #14103a; box-shadow: 0 4px 0 #6a5cc0; }
  #blockBtn { bottom: 58px; left: 12px; background: #ef8f7a; color: #3a0c00; box-shadow: 0 4px 0 #b85a49; }
  #fourDBtn { bottom: 106px; left: 12px; background: #c89bf0; color: #2a0c40; box-shadow: 0 4px 0 #8a5fb0; }
  #halfBtn { display: none; bottom: 200px; left: 50%; transform: translateX(-50%);
    font-size: 18px; padding: 14px 30px; background: #6bd18a; color: #06280f; box-shadow: 0 5px 0 #3a8f56; }
  #halfBtn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 2px 0 #3a8f56; }
  #buyBtn { pointer-events: auto; position: absolute; top: 120px; left: 16px; font: inherit;
    font-size: 12px; font-weight: bold; letter-spacing: 1px; padding: 5px 12px; border-radius: 999px;
    border: none; background: #ffd84a; color: #3a2a00; box-shadow: 0 3px 0 #b8922a; cursor: pointer; }
  #buyBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8922a; }
  /* move-the-shooter D-pad (for touch screens; keyboard arrows/WASD also work) */
  .pad { pointer-events: auto; position: absolute; width: 46px; height: 46px; border-radius: 12px;
    background: rgba(120,150,170,0.28); border: 2px solid rgba(210,228,240,0.45); color: #eaf2f7;
    font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none; }
  .pad:active { background: rgba(140,175,200,0.55); }
  #pad-up { left: 56px; bottom: 250px; }
  #pad-down { left: 56px; bottom: 150px; }
  #pad-left { left: 10px; bottom: 200px; }
  #pad-right { left: 102px; bottom: 200px; }
  #gclock { position: absolute; top: 44px; right: 18px; font-size: 30px; font-weight: bold;
    letter-spacing: 1px; color: #cfe0ea; }
  #gclock.low { color: #e5533d; }
  #clock { position: absolute; top: 82px; right: 18px; font-size: 26px; font-weight: bold;
    letter-spacing: 1px; color: #ff8b2c; }
  #clock.low { color: #e5533d; }
  #coins { position: absolute; top: 98px; left: 16px; font-size: 17px; font-weight: bold;
    letter-spacing: 1px; color: #ffd84a; }
  #coins.pop { animation: coinpop 0.4s ease-out; }
  @keyframes coinpop { 0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);} }
</style>

<body>

<script src="three.min.js"></script>
<script>
(function () {
  const T = window.THREE;
  if (!T) { document.body.innerHTML = "<p style='color:#fff;padding:20px'>3D engine did not load. Open this through the Hoop Shot server (start-game.cmd) or refresh.</p>"; return; }

  // ---- renderer / scene / camera ----
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new T.Scene();
  scene.background = new T.Color(0x12232e);
  scene.fog = new T.Fog(0x12232e, 18, 34);

  const camera = new T.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(6.2, 5.2, 9.5);   // elevated corner view: both hoops in frame
  camera.lookAt(0, 1.9, -1);

  // ---- camera views you can flip between with the View button ----
  const VIEWS = [
    { name: "COURTSIDE", pos: [8.5, 7.4, 13.5], look: [0, 3.0, -2.5], drift: true },
    { name: "BEHIND",    pos: [0, 4.6, 10.5],  look: [0, 2.2, -4] },
    { name: "TOP DOWN",  pos: [0, 17, 1.6],    look: [0, 0, 0.6] },
    { name: "HOOP CAM",  pos: [0.2, 4.2, -1.6],look: [0, 3, -5.6] },
    { name: "SIDELINE",  pos: [14.5, 6.5, 1.5], look: [0, 1.6, 0.5] }
  ];
  let viewIdx = 0;

  // ---- lights ----
  const hemi = new T.HemisphereLight(0xbfe0f0, 0x2a5060, 0.9); scene.add(hemi);
  const sun = new T.DirectionalLight(0xffffff, 1.0);
  sun.position.set(4, 10, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
  sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
  sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -4;
  scene.add(sun);

  // ---- pro-style court ----
  const HOOP_Z = -5.6, RIM_Y = 3.05, RIM_R = 0.34;
  let scoreR = 0.52;           // how forgiving the "went in" test is (bigger on free throws)
  const THREE_R = 4.6;
  const NEAR_HOOP = 7.4;

  // dark arena floor, then the polished wood court on top
  const arena = new T.Mesh(new T.BoxGeometry(40, 0.3, 46),
    new T.MeshStandardMaterial({ color: 0x0c151c, roughness: 1 }));
  arena.position.set(0, -0.32, 0); arena.receiveShadow = true; scene.add(arena);
  const floor = new T.Mesh(new T.BoxGeometry(13.4, 0.4, 18.5),
    new T.MeshStandardMaterial({ color: 0xd6934a, roughness: 0.45, metalness: 0.05 }));
  floor.position.set(0, -0.2, 0.9); floor.receiveShadow = true; scene.add(floor);

  // white paint lines
  const lineMat = new T.MeshStandardMaterial({ color: 0xf5ecda, roughness: 0.6 });
  function ln(x, z, w, d) {
    const m = new T.Mesh(new T.BoxGeometry(w, 0.02, d), lineMat);
    m.position.set(x, 0.015, z); scene.add(m);
  }
  function ring(x, z, rIn, rOut) {
    const m = new T.Mesh(new T.RingGeometry(rIn, rOut, 64), lineMat);
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.015, z); scene.add(m);
  }
  function ringArc(x, z, r, dir) {
    const m = new T.Mesh(new T.RingGeometry(r - 0.07, r + 0.07, 64, 1, 0, Math.PI), lineMat);
    m.rotation.x = dir * Math.PI / 2; m.position.set(x, 0.015, z); scene.add(m);
  }

  const BASE_FAR = HOOP_Z - 1.3, BASE_NEAR = NEAR_HOOP + 1.3, MIDZ = (HOOP_Z + NEAR_HOOP) / 2;
  const HALF_W = 6.0;
  // boundary
  ln(-HALF_W, MIDZ, 0.1, BASE_NEAR - BASE_FAR); ln(HALF_W, MIDZ, 0.1, BASE_NEAR - BASE_FAR);
  ln(0, BASE_FAR, HALF_W * 2, 0.1); ln(0, BASE_NEAR, HALF_W * 2, 0.1);
  // half-court line + centre circle
  ln(0, MIDZ, HALF_W * 2, 0.1);
  ring(0, MIDZ, 1.72, 1.82);

  // everything at one end: painted key, free-throw line + circle, 3-pt line, restricted area
  function buildEnd(z0, dir) {
    const baseZ = z0 - dir * 1.3, ftZ = z0 + dir * 5.0;
    const midKey = (baseZ + ftZ) / 2, keyLen = Math.abs(ftZ - baseZ);
    const paint = new T.Mesh(new T.BoxGeometry(3.6, 0.02, keyLen),
      new T.MeshStandardMaterial({ color: 0x2c6f97, roughness: 0.7 }));
    paint.position.set(0, 0.01, midKey); scene.add(paint);
    ln(-1.8, midKey, 0.09, keyLen); ln(1.8, midKey, 0.09, keyLen);
    ln(0, ftZ, 3.72, 0.09);
    ring(0, ftZ, 1.72, 1.82);
    ringArc(0, z0, THREE_R, dir);
    ln(-THREE_R, z0 - dir * 0.65, 0.09, 1.3); ln(THREE_R, z0 - dir * 0.65, 0.09, 1.3);
    ringArc(0, z0, 1.25, dir);      // restricted-area arc under the rim
  }
  buildEnd(HOOP_Z, 1);
  buildEnd(NEAR_HOOP, -1);

  // arena back wall (stands)
  const wall = new T.Mesh(new T.BoxGeometry(38, 20, 0.4),
    new T.MeshStandardMaterial({ color: 0x14232e, roughness: 1 }));
  wall.position.set(0, 9, BASE_FAR - 1.6); wall.receiveShadow = true; scene.add(wall);

  // ===================== 🏟️ 2K STADIUM: crowd, LED ring, jumbotron, spotlights =====================
  const CROWD_COLS = [0xc94b4b, 0x4b7fc9, 0xe0b64b, 0x54a86a, 0xa05ec9, 0xd68a3c, 0xcfd4da, 0xff8a3c, 0x5ab5ff];
  let crowdParts = [], crowdBase = [], crowdTotal = 0, crowdHype = 0, ledMats = [], arenaLights = [], jumboCanvas = null, jumboCtx = null, jumboTex = null, jumboLast = "", jumboGroup = null, flashPool = [];
  const SKIN_COLS = [0xf1c9a5, 0xe0a878, 0xc68642, 0x8d5524, 0xffe0bd, 0xd9a066];
  let teamName = (localStorage.getItem("hoopTeam") || "MORGAN").slice(0, 12).toUpperCase();
  (function buildStadium() {
    const BZ1 = BASE_FAR - 1.2, BZ2 = BASE_NEAR + 1.2, MZ = (BZ1 + BZ2) / 2, LZ = BZ2 - BZ1;
    // tiered dark stands, sloped up and outward on all four sides
    const standMat = new T.MeshStandardMaterial({ color: 0x0e1a24, roughness: 1 });
    [[-9.6, 0.42], [9.6, -0.42]].forEach(function (s) { const st = new T.Mesh(new T.BoxGeometry(7, 10, LZ + 8), standMat); st.position.set(s[0], 3.4, MZ); st.rotation.z = s[1]; st.receiveShadow = true; scene.add(st); });
    [[BZ1 - 3.4, 0.42], [BZ2 + 3.4, -0.42]].forEach(function (s) { const st = new T.Mesh(new T.BoxGeometry(26, 10, 7), standMat); st.position.set(0, 3.4, s[0]); st.rotation.x = s[1]; st.receiveShadow = true; scene.add(st); });
    const ROWS = 9, STEP = 0.74, OUT = 0.72;
    // ---- pro tiered SEATS: a colored seat-step per row on every side ----
    const seatMat = [new T.MeshStandardMaterial({ color: 0x1c3a5e, roughness: 0.85 }), new T.MeshStandardMaterial({ color: 0x24507a, roughness: 0.85 })];
    for (let row = 0; row < ROWS; row++) {
      const sy = 1.05 + row * STEP, out = row * OUT, m = seatMat[row % 2], sideLen = LZ + 2 + 2 * out, endW = 17 + 2 * out;
      const sl = new T.Mesh(new T.BoxGeometry(0.62, 0.34, sideLen), m); sl.position.set(-7.9 - out, sy, MZ); sl.receiveShadow = true; scene.add(sl);
      const sr = new T.Mesh(new T.BoxGeometry(0.62, 0.34, sideLen), m); sr.position.set(7.9 + out, sy, MZ); sr.receiveShadow = true; scene.add(sr);
      const sf = new T.Mesh(new T.BoxGeometry(endW, 0.34, 0.62), m); sf.position.set(0, sy, BZ1 - 0.8 - out); sf.receiveShadow = true; scene.add(sf);
      const sn = new T.Mesh(new T.BoxGeometry(endW, 0.34, 0.62), m); sn.position.set(0, sy, BZ2 + 0.8 + out); sn.receiveShadow = true; scene.add(sn);
    }
    // ---- FANS: each is a little person = torso (team color) + head (skin) sitting in a seat ----
    const pos = [];
    for (let row = 0; row < ROWS; row++) {
      const y = 1.45 + row * STEP, out = row * OUT;
      for (let z = BZ1 - out; z <= BZ2 + out; z += 0.52) { pos.push([-7.9 - out, y, z]); pos.push([7.9 + out, y, z]); }
      for (let x = -7.9 - out; x <= 7.9 + out; x += 0.52) { pos.push([x, y, BZ1 - 0.8 - out]); pos.push([x, y, BZ2 + 0.8 + out]); }
    }
    crowdTotal = pos.length;
    const bodies = new T.InstancedMesh(new T.BoxGeometry(0.3, 0.46, 0.26), new T.MeshStandardMaterial({ roughness: 0.85 }), crowdTotal);
    const heads = new T.InstancedMesh(new T.SphereGeometry(0.15, 8, 8), new T.MeshStandardMaterial({ roughness: 0.8 }), crowdTotal);
    bodies.userData.yOff = 0; heads.userData.yOff = 0.4;
    const dm = new T.Object3D();
    for (let i = 0; i < crowdTotal; i++) {
      crowdBase.push(pos[i]);
      dm.position.set(pos[i][0], pos[i][1], pos[i][2]); dm.updateMatrix(); bodies.setMatrixAt(i, dm.matrix);
      dm.position.set(pos[i][0], pos[i][1] + 0.4, pos[i][2]); dm.updateMatrix(); heads.setMatrixAt(i, dm.matrix);
      bodies.setColorAt(i, new T.Color(CROWD_COLS[(i * 7) % CROWD_COLS.length]));
      heads.setColorAt(i, new T.Color(SKIN_COLS[(i * 5) % SKIN_COLS.length]));
    }
    bodies.instanceMatrix.needsUpdate = true; heads.instanceMatrix.needsUpdate = true;
    if (bodies.instanceColor) bodies.instanceColor.needsUpdate = true; if (heads.instanceColor) heads.instanceColor.needsUpdate = true;
    scene.add(bodies); scene.add(heads); crowdParts = [bodies, heads];
    // LED signage ring around the court
    function led(w, h, d, x, y, z) { const m = new T.MeshStandardMaterial({ color: 0x0a1420, emissive: 0x3aa0ff, emissiveIntensity: 1.3, roughness: 0.4 }); ledMats.push(m); const b = new T.Mesh(new T.BoxGeometry(w, h, d), m); b.position.set(x, y, z); scene.add(b); }
    led(HALF_W * 2 + 1.2, 0.55, 0.26, 0, 0.5, BZ1 + 0.1); led(HALF_W * 2 + 1.2, 0.55, 0.26, 0, 0.5, BZ2 - 0.1);
    led(0.26, 0.55, LZ, -HALF_W - 0.7, 0.5, MZ); led(0.26, 0.55, LZ, HALF_W + 0.7, 0.5, MZ);
    // JUMBOTRON hanging over center court
    const jum = new T.Group(); jum.position.set(0, 7.6, MZ); scene.add(jum); jumboGroup = jum;
    jum.add(new T.Mesh(new T.BoxGeometry(2.6, 0.25, 2.6), new T.MeshStandardMaterial({ color: 0x222, roughness: 1 })).translateY(0.85));
    jum.add(new T.Mesh(new T.BoxGeometry(2.6, 1.5, 2.6), new T.MeshStandardMaterial({ color: 0x0a0f14, roughness: 1 })));
    jumboCanvas = document.createElement("canvas"); jumboCanvas.width = 256; jumboCanvas.height = 128; jumboCtx = jumboCanvas.getContext("2d");
    jumboTex = new T.CanvasTexture(jumboCanvas);
    const scMat = new T.MeshBasicMaterial({ map: jumboTex });
    [[0, 1.31, 0], [0, -1.31, Math.PI], [1.31, 0, Math.PI / 2], [-1.31, 0, -Math.PI / 2]].forEach(function (s) { const sc = new T.Mesh(new T.PlaneGeometry(2.3, 1.25), scMat); sc.position.set(s[0], 0, s[1]); sc.rotation.y = s[2]; jum.add(sc); });
    // arena spotlights (colored glow up high)
    [[-7, 11, -4, 0xff6a6a], [7, 11, -4, 0x6a8aff], [0, 12, 8, 0xffffff]].forEach(function (L) { const pl = new T.PointLight(L[3], 0.45, 46); pl.position.set(L[0], L[1], L[2]); scene.add(pl); arenaLights.push(pl); });
    // 🏀 CENTER-COURT LOGO (a painted disc with "MO BALL")
    const lc = document.createElement("canvas"); lc.width = 256; lc.height = 256; const lx = lc.getContext("2d");
    lx.fillStyle = "#e07a2a"; lx.beginPath(); lx.arc(128, 128, 120, 0, 7); lx.fill();
    lx.strokeStyle = "#fff"; lx.lineWidth = 10; lx.beginPath(); lx.arc(128, 128, 120, 0, 7); lx.stroke();
    lx.fillStyle = "#111"; lx.beginPath(); lx.arc(128, 110, 46, 0, 7); lx.fill();
    lx.strokeStyle = "#fff"; lx.lineWidth = 4; lx.beginPath(); lx.moveTo(82, 110); lx.lineTo(174, 110); lx.moveTo(128, 64); lx.lineTo(128, 156); lx.stroke();
    lx.fillStyle = "#fff"; lx.font = "bold 44px sans-serif"; lx.textAlign = "center"; lx.fillText("MO BALL", 128, 210);
    const logoTex = new T.CanvasTexture(lc);
    const logo = new T.Mesh(new T.CircleGeometry(1.5, 48), new T.MeshStandardMaterial({ map: logoTex, roughness: 0.7 }));
    logo.rotation.x = -Math.PI / 2; logo.position.set(0, 0.02, MZ); scene.add(logo);
    // 🏆 CHAMPIONSHIP BANNERS hanging from the rafters over the far stand
    const bcols = [0xffcf5c, 0x3aa0ff, 0xd23b3b, 0x6bd18a, 0xc07aff];
    for (let i = 0; i < 5; i++) {
      const bn = new T.Mesh(new T.PlaneGeometry(1.3, 2.2), new T.MeshBasicMaterial({ color: bcols[i], side: T.DoubleSide }));

  // One small fixed physics step. Sub-stepping keeps the rim/floor checks
  // accurate no matter the frame rate.
  function stepBall(h) {
    const prevY = ball.position.y;
    vel.y -= G * h;
    ball.position.addScaledVector(vel, h);
    // dropping through the rim?
    if (!scored && vel.y < 0 && prevY > RIM_Y && ball.position.y <= RIM_Y) {
      const dx = ball.position.x - shotRim.x, dz = ball.position.z - shotRim.z;
      if (dx * dx + dz * dz < scoreR * scoreR) {
        scored = true;
        vel.x *= 0.2; vel.z *= 0.2; vel.y *= 0.5;
        if (shotForDogs) {
          dogScore += 2; if (dogScoreEl) dogScoreEl.textContent = "Puppies: " + dogScore;
          flash("PUPPIES SCORE! +2", "#e5533d"); ding(300, 0); ding(240, 0.12); rumble();
        } else {
          const pts = shotIsFT ? 1 : ((Math.hypot(HANDS.x, HANDS.z - HOOP_Z) > THREE_R) ? 3 : 2);
          score += pts; scoreEl.textContent = score;
          makes++; updateStats();
          flash((isDunk ? "SLAM DUNK! +" : "SWISH! +") + pts, "#ffcf5c"); swishSound();
          crowdCheer(isDunk || pts === 3); rumble();   // 4D: the arena erupts (big roar for a dunk or three)
          isDunk = false;
          addCoins(30);                     // 30 cents for every basket you make
        }
      }
    }
    // floor
    if (ball.position.y <= 0.16) {
      ball.position.y = 0.16;
      if (bounces < 2 && Math.abs(vel.y) > 1.2) { vel.y = -vel.y * 0.5; vel.x *= 0.6; vel.z *= 0.6; bounces++; }
      else { vel.set(0, 0, 0); if (state !== "dead") { state = "dead"; deadT = 0; if (!scored) flash("MISS", "#e5533d"); onShotEnd(); } }
    }
    // room walls
    if (Math.abs(ball.position.x) > 6.5) vel.x *= -0.4;
    if (ball.position.z < HOOP_Z - 1.2) vel.z *= -0.4;
    if (ball.position.z > NEAR_Z + 1.2) vel.z *= -0.4;   // wall behind the puppies' hoop
  }

  let actx = null, musicOn = true, musicTimer = null, musicStep = 0;

    o.type = "triangle"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);

  let crowdOn = true;

  function getNoise() {
    if (noiseBuf || !actx) return noiseBuf;
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  }
  // a crowd cheer: filtered noise that swells up like a roar (bigger = louder/longer)
  function crowdCheer(big) {
    crowdHype = big ? 1.0 : 0.55;                 // fans leap out of their seats (visual, even if audio is off)
    if (!actx || !crowdOn) return;
    const t = actx.currentTime, dur = big ? 2.2 : 1.4, peak = big ? 0.5 : 0.32;
    const src = actx.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.6;
    const g = actx.createGain();
    src.connect(bp); bp.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.25);      // roar swells up
    g.gain.linearRampToValueAtTime(peak * 0.8, t + dur * 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur); // then dies down
    bp.frequency.linearRampToValueAtTime(1500, t + 0.4);

  }

  const COIN_VALUE = 0.30;       // each coin is worth 30 cents

  // ---- main loop ----
  let last = performance.now();
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;

    // move the shooter, then keep the ball in his hands
    moveShooter(dt, now);
    updateHands();

    // time out countdown -> then everyone goes back to playing
    if (timeOut) {
      timeOutT -= dt;
      // once a puppy reaches its bowl it dips its head down to eat + drink (nom nom)
      for (const d of dogs) {
        const dd = Math.hypot(d.position.x - d.userData.tx, d.position.z - d.userData.tz);
        d.rotation.x = (dd < 0.35) ? 0.4 + Math.abs(Math.sin(now / 90)) * 0.3 : 0;
      }
      const s = Math.max(0, Math.ceil(timeOutT));
      hintEl.textContent = "TIME OUT · 0:" + (s < 10 ? "0" + s : s) + " · tap Resume to play";
      if (timeOutT <= 0) endTimeout();
    }

    // 10-minute game clock (game mode only; pauses on time outs, halftime, and when it's over)
    if (mode === "game" && !timeOut && !gameOver3d && !halftime) {
      gameClock -= dt;
      if (gameClock <= 0) {
        if (quarter < 4) {
          // end of a quarter -> next one, scores carry over
          quarter++; gameClock = 600; shotClock = 24;
          resetBall();
          if (quarter === 3) {
            // start of the 3rd quarter = 2nd half -> HALFTIME break, clock stops
            halftime = true; halftimeClock = 900;         // 15-minute halftime break
            halfBtn.style.display = "block";               // show the Back to Play button
            flash("HALFTIME!", "#7fd0ff"); ding(523, 0); ding(392, 0.16);
          } else {
            flash("QUARTER " + quarter + "!", "#7fd0ff"); ding(660, 0); ding(880, 0.12);
          }
        } else {
          // end of the 4th quarter -> the whole game is over
          gameClock = 0; gameOver3d = true;
          const win = score > dogScore ? "YOU WIN! 🏀" : (score < dogScore ? "PUPPIES WIN!" : "IT'S A TIE!");
          flash("FINAL! " + win, score >= dogScore ? "#ffcf5c" : "#e5533d");
          hintEl.textContent = "GAME OVER · You " + score + " · Puppies " + dogScore + " · tap Practice then Play again";
          ding(660, 0); ding(520, 0.15); ding(400, 0.3);
          if (score > dogScore) { crowdCheer(true); rumble(); }   // 4D: crowd goes wild if you win
        }
      }
    }
    // halftime break: a 15-minute countdown; tap Shoot to start the 2nd half early
    if (halftime && mode === "game" && !gameOver3d) {
      halftimeClock -= dt;
      const hs = Math.max(0, Math.ceil(halftimeClock));
      hintEl.textContent = "HALFTIME · You " + score + " · Puppies " + dogScore +
        " · " + Math.floor(hs / 60) + ":" + (hs % 60 < 10 ? "0" : "") + (hs % 60) + " · tap Back to Play to start now";
      if (halftimeClock <= 0) startSecondHalf();
    }
    if (gclockEl) {
      if (halftime) {
        const hs = Math.max(0, Math.ceil(halftimeClock));
        gclockEl.textContent = "HT " + Math.floor(hs / 60) + ":" + (hs % 60 < 10 ? "0" : "") + (hs % 60);
        gclockEl.className = "low";
      }
      else {
        const gs = Math.max(0, Math.ceil(gameClock));
        gclockEl.textContent = "Q" + quarter + " " + Math.floor(gs / 60) + ":" + (gs % 60 < 10 ? "0" : "") + (gs % 60);
        gclockEl.className = gs <= 60 ? "low" : "";       // last minute goes red
      }
    }

    // 24-second shot clock: counts down all through the possession (pauses only on
    // time outs / free throws / halftime / game over). Resets to 24 on every shot you take.
    if (mode === "game" && !timeOut && !gameOver3d && !halftime && freeThrows === 0) {
      shotClock -= dt;
      if (shotClock <= 0) {
        shotClock = 24;
        // ran out with the ball still in your hands -> shot-clock violation, turnover
        if (state === "held" && !charging) {
          flash("SHOT CLOCK! 24", "#e5533d"); ding(1500, 0); ding(1100, 0.14);
          resetBall();
        }
      }
    }
    if (clockEl) clockEl.classList.toggle("low", shotClock <= 5);
    if (clockEl) clockEl.textContent = "0:" + (Math.ceil(Math.max(0, shotClock)) < 10 ? "0" : "") + Math.ceil(Math.max(0, shotClock));

    // meter
    if (charging) {
      power += dir * METER_SPEED * dt;
      if (power >= 1) { power = 1; dir = -1; }
      if (power <= 0) { power = 0; dir = 1; }
      fillEl.style.width = (power * METER_W) + "px";
    }

    // ball
    if (state === "flying") {
      const steps = Math.max(1, Math.ceil(dt / 0.004));   // fixed small sub-steps
      const h = dt / steps;
      for (let i = 0; i < steps && state === "flying"; i++) stepBall(h);
      ball.rotation.x += vel.z * dt * 2; ball.rotation.z -= vel.x * dt * 2;
    } else if (state === "dead") {
      deadT += dt;
      if (freeThrows > 0) { resetBall(); }        // go to the line for the free throw
      else if (mode === "practice") { if (deadT > 1.0) resetBall(); }   // ball comes right back to you
      else if (shotForDogs) { if (deadT > 0.7) { flash("YOUR BALL", "#ffcf5c"); resetBall(); } }  // after a puppy shot, back to you
      else { if (!reboundAssigned && !timeOut) assignRebounder(); if (deadT > 7) resetBall(); }
    } else if (state === "dogcarry") {
      // the puppy dribbles the loose ball up to its own hoop, then pulls up and shoots
      if (dogCarrier) {
        const dx = DOG_SHOOT_SPOT.x - dogCarrier.position.x, dz = DOG_SHOOT_SPOT.z - dogCarrier.position.z;
        const dd = Math.hypot(dx, dz);
        if (dd > 0.3) {
          const step = Math.min(dd, 3.4 * dt);
          dogCarrier.position.x += dx / dd * step; dogCarrier.position.z += dz / dd * step;
          dogCarrier.rotation.y = Math.atan2(dx, dz);
          dogCarrier.position.y = Math.abs(Math.sin(now / 90)) * 0.06;
          const bb = Math.abs(Math.sin(now / 130));
          ball.position.set(dogCarrier.position.x, 0.16 + bb * 0.5, dogCarrier.position.z + 0.28);
        } else { dogShoot(); }
      } else { resetBall(); }
    } else if (state === "dunk") {
      // SLAM DUNK: jump up to the rim (rise), hang on it while the ball slams through (hold), drop back
      dunkT += dt;
      if (dunkT < DUNK_RISE) {
        const e = 1 - (1 - dunkT / DUNK_RISE) * (1 - dunkT / DUNK_RISE);   // ease out
        player.position.lerpVectors(_dunkStart, DUNK_HANG, e);
        player.rotation.y = 0; player.rotation.x = 0;
        for (const a of playerArms) { a.rotation.z = -a.userData.side * 2.5 * e; a.position.y = 1.0 + 0.4 * e; }
        ball.position.set(player.position.x, player.position.y + 1.5, player.position.z - 0.2);
      } else if (dunkT < DUNK_RISE + DUNK_HOLD) {
        player.position.set(DUNK_HANG.x, DUNK_HANG.y + Math.sin(now / 90) * 0.05, DUNK_HANG.z);   // hang + sway
        for (const a of playerArms) { a.rotation.z = -a.userData.side * 2.5; a.position.y = 1.4; }
        if (!dunkScored) {
          dunkScored = true;
          score += 2; scoreEl.textContent = score; makes++; attempts++; updateStats(); addCoins(30);
          flash("SLAM DUNK! +2", "#ffcf5c"); swishSound(); crowdCheer(true); rumble();
        }
        const bt = (dunkT - DUNK_RISE) / DUNK_HOLD;                       // ball slams down through the net
        ball.position.set(DUNK_HANG.x, Math.max(0.16, RIM_Y - bt * 3.2), HOOP_Z + 0.34);
      } else if (dunkT < DUNK_RISE + DUNK_HOLD + DUNK_DROP) {
        const e = (dunkT - DUNK_RISE - DUNK_HOLD) / DUNK_DROP;
        player.position.lerpVectors(DUNK_HANG, DUNK_LAND, e * e);
        for (const a of playerArms) { a.rotation.z = -a.userData.side * 2.5 * (1 - e); a.position.y = 1.4 - 0.4 * e; }
      } else {
        for (const a of playerArms) { a.rotation.z = 0; a.position.y = 1.0; }   // arms back to sides
        player.position.y = 0; player.rotation.x = 0;
        state = "held"; resetBall();
      }
    } else {
      // hold the ball to shoot; on free throws you keep it; otherwise the team passes it
      if (charging || freeThrows > 0 || timeOut || mode === "practice") {
        ball.position.copy(HANDS);
      } else if (passWait > 0) {
        // whoever holds the ball dribbles it (bounces it) before passing
        passWait -= dt; handOf(passIdx, _hA);
        const bb = Math.abs(Math.sin(now / 1000 * Math.PI * 3));   // 0=floor, 1=hand
        ball.position.set(_hA.x, 0.16 + (_hA.y - 0.16) * bb, _hA.z);
      } else {
        passT += dt / 0.5;                       // ~half a second per pass
        if (passT >= 1) {
          passIdx = passNext; passNext = (passIdx + 1) % passGroups.length;
          passT = 0; passWait = 0.35; handOf(passIdx, _hA); ball.position.copy(_hA);
        } else {
          handOf(passIdx, _hA); handOf(passNext, _hB);
          ball.position.lerpVectors(_hA, _hB, passT);
          ball.position.y += Math.sin(passT * Math.PI) * 0.7;   // a little arc
        }
      }
    }

    // little player jump + arms up on release/defense idle
    if (player.userData.jump) {
      player.userData.jump -= dt;
      player.position.y = Math.max(0, Math.sin(Math.max(0, player.userData.jump) * 6) * 0.35);
      if (player.userData.jump <= 0) { player.userData.jump = 0; player.position.y = 0; }
    }
    // teammates and puppies roam the court (and chase loose balls to rebound)
    if (mode === "game") for (let i = 0; i < movers.length; i++) {
      const g = movers[i];
      if (g !== dogCarrier) moveChar(g, dt, now);
      // play out a punch (puncher leans in) or a recoil (victim gets knocked back)
      if (g.userData.punch > 0) {
        g.userData.punch -= dt;
        g.rotation.x = -0.6 * Math.sin(Math.max(0, g.userData.punch) / 0.35 * Math.PI);
        g.position.x += (g.userData.pdx || 0) * dt * 1.2; g.position.z += (g.userData.pdz || 0) * dt * 1.2;
        if (g.userData.punch <= 0) g.rotation.x = 0;
      } else if (g.userData.recoil > 0) {
        g.userData.recoil -= dt;
        g.rotation.x = 0.8 * (Math.max(0, g.userData.recoil) / 0.4);
        g.position.x += (g.userData.rdx || 0) * dt * 2.2; g.position.z += (g.userData.rdz || 0) * dt * 2.2;
        if (g.userData.recoil <= 0) g.rotation.x = 0;
      }
    }

    // PUNCH FOUL: two players run into each other and one throws a punch -> free throws
    foulCooldown -= dt;
    if (foulCooldown <= 0 && !timeOut && freeThrows === 0 && mode === "game" && state !== "dogcarry") {
      let a = null, b = null;
      for (let i = 0; i < movers.length && !a; i++)
        for (let j = i + 1; j < movers.length && !a; j++) {
          const m = movers[i], n = movers[j];
          if (Math.hypot(m.position.x - n.position.x, m.position.z - n.position.z) < 0.8) { a = m; b = n; }
        }
      if (a) {
        // direction from the puncher (a) toward the victim (b)
        let dx = (b.position.x - a.position.x) || 0.1, dz = (b.position.z - a.position.z) || 0.1;
        const d = Math.hypot(dx, dz); dx /= d; dz /= d;
        a.userData.punch = 0.35; a.userData.pdx = dx; a.userData.pdz = dz;      // jab forward
        b.userData.recoil = 0.4; b.userData.rdx = dx; b.userData.rdz = dz;      // knocked back
        newTarget(a); newTarget(b);
        ding(180, 0); ding(150, 0.12);                                          // a low "POW"
        // it draws a foul: 2 easy free throws if the ball is in your hands
        if (state === "held" && !charging) { freeThrows += 2; flash("PUNCH FOUL! 2 SHOTS", "#ff5a3c"); updateFT(); }
        else flash("PUNCH FOUL!", "#ff5a3c");
        foulCooldown = 3.0;
      }
    }

    // message fade
    if (msgT > 0) { msgT -= dt; if (msgT <= 0) msgEl.style.opacity = 0; }

    // 🏟️ stadium life: fans sway in their seats (and leap up when they cheer) + live jumbotron
    if (crowdParts.length) {
      if (crowdHype > 0) crowdHype -= dt * 0.6;
      const cd = tick._cd || (tick._cd = new T.Object3D());
      crowdParts.forEach(function (m) {
        const yo = m.userData.yOff || 0;
        for (let i = 0; i < m.count; i++) {
          const p = crowdBase[i];
          const jump = crowdHype > 0 ? Math.abs(Math.sin(now * 0.02 + i)) * crowdHype * 0.6 : 0;
          cd.position.set(p[0], p[1] + yo + Math.sin(now * 0.004 + i * 0.6) * 0.1 + jump, p[2]); cd.updateMatrix();
          m.setMatrixAt(i, cd.matrix);
        }
        m.instanceMatrix.needsUpdate = true;
      });
      // 📸 camera flashes pop around the stands during a big cheer
      if (crowdHype > 0.25 && crowdBase.length) {
        for (let k = 0; k < flashPool.length; k++) {
          if (Math.random() < 0.25) { const p = crowdBase[Math.floor(Math.random() * crowdBase.length)]; flashPool[k].position.set(p[0], p[1] + 0.5, p[2]); flashPool[k].visible = true; }
          else flashPool[k].visible = false;
        }
      } else { for (let k = 0; k < flashPool.length; k++) flashPool[k].visible = false; }
    }
    updateJumbo();
    if (jumboGroup) jumboGroup.visible = (viewIdx !== 2);   // don't block the top-down view

    // camera: use the chosen view (courtside gets a gentle drift for a 3D feel)
    const V = VIEWS[viewIdx];
    camera.position.set(V.pos[0] + (V.drift ? Math.sin(now / 4000) * 0.7 : 0), V.pos[1], V.pos[2]);
    camera.lookAt(V.look[0], V.look[1], V.look[2]);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  applyEdition3();              // apply the saved 2K edition (arena look + shot difficulty)
  applyMode("practice");        // start free in Practice; tap Play 2v2 (30 coins) for a game
  requestAnimationFrame(tick);

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
