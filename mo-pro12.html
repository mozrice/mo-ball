<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Pro 12</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#3a1a6a 0%,#1c0e38 60%,#0c0620 100%);}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }

var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.2,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function good(){ bp(880,0.1,'triangle',0.2); setTimeout(function(){bp(1250,0.09,'triangle',0.16);},55); }
function bad(){ bp(150,0.15,'square',0.15); }
function win(){ bp(660,0.12,'triangle',0.2); setTimeout(function(){bp(990,0.12,'triangle',0.2);},110); setTimeout(function(){bp(1320,0.16,'triangle',0.2);},230); }
function whoosh(){ bp(420,0.12,'sine',0.15); setTimeout(function(){bp(260,0.1,'sine',0.11);},50); }
function swish(){ bp(900,0.11,'triangle',0.2); setTimeout(function(){bp(1350,0.12,'triangle',0.16);},65); }
function click(){ bp(520,0.05,'square',0.13); }

var coins=0;
var GAMES=[
 {k:'buckets',n:'Buckets',e:'🏀',c:'#e0563b'},
 {k:'runner',n:'Runner',e:'🏃',c:'#39b56a'},
 {k:'dunkoff',n:'Dunk Off',e:'💪',c:'#e0863a'},
 {k:'penalty',n:'Penalty',e:'⚽',c:'#2f9e57'},
 {k:'endzone',n:'End Zone',e:'🏈',c:'#b5741f'},
 {k:'space',n:'Space Dash',e:'🚀',c:'#7d4fd0'},
 {k:'catch',n:'Catch',e:'🧺',c:'#d9a400'},
 {k:'goalie',n:'Goalie',e:'🥅',c:'#3a90c8'},
 {k:'beat',n:'Beat',e:'🎵',c:'#8b4fd0'},
 {k:'tower',n:'Tower',e:'🧱',c:'#c07a2a'},
 {k:'racer',n:'Racer',e:'🏎️',c:'#d9004a'},
 {k:'boss',n:'Boss Fight',e:'🐉',c:'#c0392b'}
];

// ===== controls =====
var JB={x:66,y:H-58,r:44}, AB={x:W-56,y:H-56,r:40}, BB={x:W-116,y:H-94,r:32};
var joyId=null,joyX=0,joyY=0,aId=null,bId=null;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+8; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
var menuBtn={x:34,y:26,r:20};
cv.addEventListener('pointerdown',function(e){ var p=pt(e);
  if(ac()&&ac().state==='suspended')ac().resume();
  if(scr==='play' && inC(p,menuBtn)){ toMenu(); return; }
  if(inC(p,BB)){ bId=e.pointerId; onB(); return; }
  if(inC(p,AB)){ aId=e.pointerId; onA(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; return; }
  if(scr==='menu'){ menuTap(p); } else if(scr==='over'){ scr='menu'; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; if(e.pointerId===bId)bId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

// ===== framework =====
var scr='menu', sel=0, stepCd=0, cur=null, g={}, score=0, tLeft=0, over={};
function menuStep(v){ if(stepCd>0)return; var c=sel%3, r=Math.floor(sel/3), moved=false;
  if(v.x>0.5&&c<2){sel++;moved=true;} else if(v.x<-0.5&&c>0){sel--;moved=true;}
  else if(v.y>0.5&&r<3){sel+=3;moved=true;} else if(v.y<-0.5&&r>0){sel-=3;moved=true;}
  if(moved){ stepCd=0.18; click(); } }
function menuTap(p){ var gw=(W-40)/3, gh=110; for(var i=0;i<12;i++){ var cxx=20+(i%3)*gw, cyy=90+Math.floor(i/3)*gh; if(p.x>cxx&&p.x<cxx+gw-8&&p.y>cyy&&p.y<cyy+gh-8){ sel=i; startGame(i); return; } } }
function startGame(i){ cur=GAMES[i]; scr='play'; score=0; g={}; initGame(); last=performance.now(); }
function toMenu(){ scr='menu'; }
function endGame(){ scr='over'; over={name:cur.n,score:score}; coins+=score; win(); }
function onA(){ if(scr==='menu'){ startGame(sel); return; } if(scr==='over'){ scr='menu'; return; } if(scr==='play')gA(); }
function onB(){ if(scr==='play')gB(); else if(scr==='over')scr='menu'; }

// ===== shared draw =====
function drawMo(x,y,s,col){ s=s||1; col=col||'#e0563b'; cx.save(); cx.translate(x,y); cx.scale(s,s);
  cx.fillStyle='#2a2440'; cx.fillRect(-12,22,10,26); cx.fillRect(2,22,10,26); cx.fillStyle='#fff'; cx.fillRect(-13,46,11,7); cx.fillRect(2,46,11,7);
  cx.fillStyle=col; rr(-17,-6,34,34,7); cx.fill();
  cx.strokeStyle='#8a5a34'; cx.lineWidth=7; cx.lineCap='round'; cx.beginPath(); cx.moveTo(-14,2); cx.lineTo(-22,20); cx.moveTo(14,2); cx.lineTo(22,20); cx.stroke();
  cx.fillStyle='#8a5a34'; cx.beginPath(); cx.arc(0,-24,15,0,7); cx.fill(); cx.fillStyle=col; cx.fillRect(-15,-31,30,6);
  cx.fillStyle='#201810'; cx.beginPath(); cx.arc(0,-33,15,Math.PI,0); cx.fill();
  cx.fillStyle='#fff'; cx.beginPath(); cx.arc(-5,-23,2.6,0,7); cx.arc(5,-23,2.6,0,7); cx.fill(); cx.fillStyle='#201008'; cx.beginPath(); cx.arc(-5,-23,1.3,0,7); cx.arc(5,-23,1.3,0,7); cx.fill();
  cx.restore(); }
function shade(hex,f){ var n=parseInt(hex.slice(1),16),r=(n>>16)&255,gg=(n>>8)&255,b=n&255; return 'rgb('+Math.round(r*f)+','+Math.round(gg*f)+','+Math.round(b*f)+')'; }
function drawControls(showA,showB,la,lb){ var v=jv();
  cx.fillStyle='rgba(255,255,255,.12)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill();
  cx.fillStyle='rgba(255,255,255,.42)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill();
  if(showA){ cx.fillStyle=aId!==null?'#ffd23f':'rgba(255,210,63,.9)'; cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle='#2a1400'; cx.font='bold 20px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('A',AB.x,AB.y); cx.textBaseline='alphabetic'; if(la){cx.fillStyle='#ffd23f';cx.font='bold 9px Trebuchet MS';cx.fillText(la,AB.x,AB.y+AB.r+11);} }
  if(showB){ cx.fillStyle=bId!==null?'#ff5ad0':'#c14fe0'; cx.beginPath(); cx.arc(BB.x,BB.y,BB.r,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 17px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('B',BB.x,BB.y); cx.textBaseline='alphabetic'; if(lb){cx.fillStyle='#e6b0ff';cx.font='bold 9px Trebuchet MS';cx.fillText(lb,BB.x,BB.y+BB.r+10);} }
}
function drawHUD(extra){ cx.fillStyle='rgba(10,4,26,.6)'; rr(58,10,W-66,32,10); cx.fill();
  cx.fillStyle='#ffd23f'; cx.font='bold 13px Trebuchet MS'; cx.textAlign='left'; cx.fillText(cur.e+' '+cur.n,66,31);
  cx.textAlign='right'; cx.fillStyle='#fff'; cx.fillText('⭐ '+score,W-16,31);
  if(extra){ cx.textAlign='center'; cx.fillStyle='#7fd0ff'; cx.fillText(extra,W/2+8,31); }
  // menu button
  cx.fillStyle='#ffd23f'; cx.beginPath(); cx.arc(menuBtn.x,menuBtn.y,menuBtn.r,0,7); cx.fill(); cx.fillStyle='#2a1400'; cx.font='bold 15px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('◀',menuBtn.x,menuBtn.y); cx.textBaseline='alphabetic'; }

// ===== per-game init/update/draw/A/B =====
function initGame(){ tLeft=30; var k=cur.k;
  if(k==='buckets'){ g.px=W/2; g.tx=W/2; g.dir=1; g.tw=54; g.ball=null; g.meter=0; g.mdir=1; g.gf=0; }
  else if(k==='runner'){ g.py=H-120; g.vy=0; g.onG=true; g.obs=[]; g.coins=[]; g.sp=0; g.lives=3; g.dist=0; tLeft=null; }
  else if(k==='dunkoff'){ g.meter=0; g.mdir=1; g.tries=6; g.hit=0; tLeft=null; }
  else if(k==='penalty'){ g.aim=W/2; g.adir=1; g.power=0; g.pdir=1; g.phase='aim'; g.shots=5; g.gk=W/2; g.ball=null; tLeft=null; }
  else if(k==='endzone'){ g.px=W/2; g.py=H-120; g.def=[]; g.sp=0; g.td=0; }
  else if(k==='space'){ g.px=W/2; g.py=H*0.5; g.rocks=[]; g.sp=0; g.lives=3; }
  else if(k==='catch'){ g.bx=W/2; g.items=[]; g.sp=0; }
  else if(k==='goalie'){ g.px=W/2; g.shots=[]; g.sp=0; g.lives=5; }
  else if(k==='beat'){ g.notes=[]; g.sp=0; g.hy=H-150; }
  else if(k==='tower'){ g.tower=[{x:130,w:140}]; g.speed=150; g.blk={x:0,w:140,dir:1}; tLeft=null; }
  else if(k==='racer'){ g.lane=1; g.cars=[]; g.coins=[]; g.sp=0; g.spd=220; g.lives=3; g.dist=0; tLeft=null; }
  else if(k==='boss'){ g.px=W/2; g.hp=12; g.bx=W/2; g.bdir=1; g.balls=[]; g.myb=null; g.sp=0; g.lives=3; g.flash=0; tLeft=null; }
}
function gA(){ var k=cur.k;
  if(k==='buckets'){ if(!g.ball){ var z=[0.62,0.86]; var green=g.meter>=z[0]&&g.meter<=z[1]; g.ball={x:g.px,y:H-180,vy:-10,make:green}; whoosh(); if(green){score+=2;g.gf=0.8;setTimeout(swish,140);}else setTimeout(function(){bp(240,0.12,'square',0.12);},140);} }
  else if(k==='runner'){ if(g.onG){ g.vy=-430; g.onG=false; bp(600,0.09,'square',0.15);} }
  else if(k==='dunkoff'){ if(g.tries>0){ g.tries--; var gd=g.meter>0.66&&g.meter<0.9; if(gd){score+=2;g.hit++;good();}else bad(); if(g.tries<=0)endGame(); } }
  else if(k==='penalty'){ if(g.phase==='aim'){ g.phase='power'; } else if(g.phase==='power'){ shootPenalty(); } }
  else if(k==='beat'){ var best=-1,bd=999; for(var i=0;i<g.notes.length;i++){ if(g.notes[i].hit)continue; var d=Math.abs(g.notes[i].y-g.hy); if(d<bd){bd=d;best=i;} } if(best>=0&&bd<34){g.notes[best].hit=1;score++;good();}else bp(220,0.08,'square',0.12); }
  else if(k==='tower'){ var top=g.tower[g.tower.length-1],b=g.blk,L=Math.max(top.x,b.x),R=Math.min(top.x+top.w,b.x+b.w),ov=R-L; if(ov<=4){bad();endGame();return;} g.tower.push({x:L,w:ov}); score++; good(); g.speed+=8; g.blk={x:0,w:ov,dir:1}; }
  else if(k==='boss'){ if(!g.myb){ g.myb={x:g.px,y:H-160,vy:-9}; whoosh(); } }
}
function gB(){ /* B reserved per game (unused / boost) */ if(cur.k==='racer'){ } }
function shootPenalty(){ var target=g.aim; g.ball={x:W/2,y:H-140,tx:target,ty:150,t:0}; var caught=Math.abs(target-g.gk)<44; g.ball.make=!caught && g.power>0.35; whoosh(); g.phase='fly'; setTimeout(function(){ if(g.ball){ if(g.ball.make){score+=1;setTimeout(swish,120);}else bad(); } g.shots--; g.ball=null; g.gk=60+Math.random()*(W-120); g.phase='aim'; if(g.shots<=0)endGame(); },700); }

function upd(dt){ if(stepCd>0)stepCd-=dt; var v=jv(); var k=cur.k;
  if(tLeft!==null){ tLeft-=dt; if(tLeft<=0){ tLeft=0; endGame(); return; } }
  if(k==='buckets'){ g.px=clamp(g.px+v.x*230*dt,30,W-30); g.tx+=g.dir*80*dt; if(g.tx>W-70){g.tx=W-70;g.dir=-1;} if(g.tx<70){g.tx=70;g.dir=1;} g.meter+=g.mdir*1.5*dt; if(g.meter>1){g.meter=1;g.mdir=-1;} if(g.meter<0){g.meter=0;g.mdir=1;} if(g.gf>0)g.gf-=dt; if(g.ball){ g.ball.y+=g.ball.vy; g.ball.vy+=0.1; if(g.ball.y<150||g.ball.y>H)g.ball=null; } }
  else if(k==='runner'){ g.vy+=1350*dt; g.py+=g.vy*dt; if(g.py>=H-120){g.py=H-120;g.vy=0;g.onG=true;} g.dist+=90*dt; g.sp-=dt; if(g.sp<=0){ if(Math.random()<0.6)g.obs.push({x:W+20,type:Math.random()<0.5?'cone':'gap'}); else g.coins.push({x:W+20,y:H-160-Math.random()*80}); g.sp=0.5+Math.random()*0.4; }
    for(var i=g.obs.length-1;i>=0;i--){ var o=g.obs[i]; o.x-=180*dt; if(o.x<70&&o.x>30&&g.py>H-150){ g.lives--; bad(); o.x=-99; if(g.lives<=0){endGame();return;} } if(o.x<-30)g.obs.splice(i,1); }
    for(var i=g.coins.length-1;i>=0;i--){ var co=g.coins[i]; co.x-=180*dt; if(Math.hypot(co.x-50,co.y-g.py)<28){score++;good();g.coins.splice(i,1);} else if(co.x<-20)g.coins.splice(i,1); } }
  else if(k==='dunkoff'){ g.meter+=g.mdir*1.2*dt; if(g.meter>1){g.meter=1;g.mdir=-1;} if(g.meter<0){g.meter=0;g.mdir=1;} }
  else if(k==='penalty'){ if(g.phase==='aim'){ g.aim+=g.adir*160*dt; if(g.aim>W-70){g.aim=W-70;g.adir=-1;} if(g.aim<70){g.aim=70;g.adir=1;} } else if(g.phase==='power'){ g.power+=g.pdir*1.3*dt; if(g.power>1){g.power=1;g.pdir=-1;} if(g.power<0){g.power=0;g.pdir=1;} } if(g.ball&&g.phase==='fly'){ g.ball.t+=dt*1.4; g.ball.x=g.ball.x+(g.ball.tx-g.ball.x)*0.2; g.ball.y=g.ball.y+(g.ball.ty-g.ball.y)*0.2; } }
  else if(k==='endzone'){ g.px=clamp(g.px+v.x*240*dt,24,W-24); g.py=clamp(g.py+v.y*220*dt,120,H-110); g.sp-=dt; if(g.sp<=0){ g.def.push({x:24+Math.random()*(W-48),y:-20,vy:120+Math.random()*90,vx:(Math.random()-0.5)*60}); g.sp=0.5+Math.random()*0.3; }
    for(var i=g.def.length-1;i>=0;i--){ var d=g.def[i]; d.y+=d.vy*dt; d.x+=d.vx*dt; if(Math.hypot(d.x-g.px,d.y-g.py)<28){ bad(); g.px=W/2; g.py=H-120; } else if(d.y>H+20)g.def.splice(i,1); }
    if(g.py<=125){ score+=1; g.td++; good(); g.px=W/2; g.py=H-120; g.def=[]; } }
  else if(k==='space'){ g.px=clamp(g.px+v.x*240*dt,20,W-20); g.py=clamp(g.py+v.y*220*dt,110,H-110); g.sp-=dt; if(g.sp<=0){ g.rocks.push({x:20+Math.random()*(W-40),y:-20,vy:150+Math.random()*110,bad:Math.random()<0.55}); g.sp=0.4+Math.random()*0.3; }
    for(var i=g.rocks.length-1;i>=0;i--){ var rk=g.rocks[i]; rk.y+=rk.vy*dt; if(Math.hypot(rk.x-g.px,rk.y-g.py)<28){ if(rk.bad){g.lives--;bad();if(g.lives<=0){endGame();return;}}else{score++;good();} g.rocks.splice(i,1);} else if(rk.y>H+20)g.rocks.splice(i,1); } }
  else if(k==='catch'){ g.bx=clamp(g.bx+v.x*250*dt,30,W-30); g.sp-=dt; if(g.sp<=0){ g.items.push({x:30+Math.random()*(W-60),y:-20,vy:130+Math.random()*90,bad:Math.random()<0.22}); g.sp=0.55+Math.random()*0.35; }
    for(var i=g.items.length-1;i>=0;i--){ var it=g.items[i]; it.y+=it.vy*dt; if(it.y>H-120&&it.y<H-80&&Math.abs(it.x-g.bx)<40){ if(it.bad){score=Math.max(0,score-2);bad();}else{score++;good();} g.items.splice(i,1);} else if(it.y>H+20)g.items.splice(i,1); } }
  else if(k==='goalie'){ g.px=clamp(g.px+v.x*260*dt,40,W-40); g.sp-=dt; if(g.sp<=0){ g.shots.push({x:40+Math.random()*(W-80),y:-20,vy:200+Math.random()*120}); g.sp=0.6+Math.random()*0.4; }
    for(var i=g.shots.length-1;i>=0;i--){ var s=g.shots[i]; s.y+=s.vy*dt; if(s.y>H-130&&s.y<H-90){ if(Math.abs(s.x-g.px)<42){score++;good();}else{g.lives--;bad();if(g.lives<=0){endGame();return;}} g.shots.splice(i,1);} else if(s.y>H)g.shots.splice(i,1); } }
  else if(k==='beat'){ g.sp-=dt; if(g.sp<=0){ g.notes.push({x:W/2,y:-10,vy:210,hit:0}); g.sp=0.6; } for(var i=g.notes.length-1;i>=0;i--){ var nt=g.notes[i]; nt.y+=nt.vy*dt; if(nt.y>g.hy+46)g.notes.splice(i,1); } }
  else if(k==='tower'){ var b=g.blk; b.x+=b.dir*g.speed*dt; if(b.x+b.w>W){b.x=W-b.w;b.dir=-1;} if(b.x<0){b.x=0;b.dir=1;} }
  else if(k==='racer'){ if(v.x>0.5&&g.lane<2&&stepCd<=0){g.lane++;stepCd=0.16;click();} if(v.x<-0.5&&g.lane>0&&stepCd<=0){g.lane--;stepCd=0.16;click();} g.dist+=g.spd*dt; g.spd+=6*dt; g.sp-=dt; if(g.sp<=0){ var ln=Math.floor(Math.random()*3); if(Math.random()<0.7)g.cars.push({lane:ln,y:-40}); else g.coins.push({lane:ln,y:-40}); g.sp=0.5+Math.random()*0.35; }
    var lx=[W/2-80,W/2,W/2+80]; var pyv=H-130;
    for(var i=g.cars.length-1;i>=0;i--){ var c=g.cars[i]; c.y+=g.spd*dt; if(c.lane===g.lane&&Math.abs(c.y-pyv)<38){ g.lives--; bad(); c.y=9999; if(g.lives<=0){endGame();return;} } if(c.y>H+40)g.cars.splice(i,1); }
    for(var i=g.coins.length-1;i>=0;i--){ var co=g.coins[i]; co.y+=g.spd*dt; if(co.lane===g.lane&&Math.abs(co.y-pyv)<34){score++;good();g.coins.splice(i,1);} else if(co.y>H+40)g.coins.splice(i,1); } }
