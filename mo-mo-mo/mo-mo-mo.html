<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO MO MO</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c1a10;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#123018;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
function inR(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.value=f; g.gain.value=v||0.15; g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.1)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.1)+0.02); }
function bonkS(){ bp(700,0.05,'square',0.13); setTimeout(function(){bp(1000,0.06,'triangle',0.12);},40); }
function barkS(){ bp(320,0.09,'square',0.12); setTimeout(function(){bp(240,0.1,'square',0.1);},70); }
function goldS(){ [0,70,150,260].forEach(function(t,i){ setTimeout(function(){bp([700,950,1200,1600][i],0.12,'triangle',0.14);},t); }); }
function boomS(){ bp(150,0.3,'sawtooth',0.16); }
function buzzer(){ bp(170,0.5,'sawtooth',0.15); }

var XS=[110,200,290], YS=[250,370,490], HRX=52, HRY=26;
var holes=[]; for(var r=0;r<3;r++)for(var c=0;c<3;c++)holes.push({x:XS[c],y:YS[r],up:0,type:null,t:0,anim:0,hit:0});
var scene='title', score=0, coins=0, combo=0, best=0, timeLeft=45, spawnCd=0.6;
try{best=parseInt(localStorage.getItem('moMoMoBest'))||0;}catch(e){}
var pops=[], conf=[], shake=0, msg='', msgT=0;
var PLAYBTN={x:W/2-90,y:H/2+64,w:180,h:60};

function showMsg(t){ msg=t; msgT=1.1; }
function reset(){ score=0;coins=0;combo=0;timeLeft=45;spawnCd=0.5; holes.forEach(function(h){h.up=0;h.type=null;h.anim=0;h.hit=0;}); pops=[];conf=[]; }
function start(){ reset(); scene='play'; }
function pop(x,y,e){ pops.push({x:x,y:y,t:0.8,e:e}); }
function spawnConf(x,y){ for(var i=0;i<34;i++)conf.push({x:x,y:y,vx:(Math.random()-0.5)*240,vy:-120-Math.random()*160,c:['#ffd23f','#ff7ac0','#5ad1ff','#9dff6a'][(Math.random()*4)|0],r:Math.random()*6}); }
function spawn(){ var free=[]; for(var i=0;i<9;i++)if(!holes[i].up)free.push(i); if(!free.length)return; var h=holes[free[(Math.random()*free.length)|0]];
  var rnd=Math.random(); h.type= rnd<0.16?'bomb':(rnd<0.30?'arff':(rnd<0.36?'gold':'mo')); h.up=1; h.anim=0; h.hit=0; var fast=Math.max(0.55,1.3-(45-timeLeft)*0.02); h.t=fast+Math.random()*0.5; }
function whack(h){ if(!h.up||h.hit)return; h.hit=1;
  if(h.type==='bomb'){ combo=0; score=Math.max(0,score-2); boomS(); shake=0.4; pop(h.x,h.y-30,'💥 -2'); h.up=0.6; }
  else { var pts= h.type==='arff'?3:(h.type==='gold'?5:1); combo++; var mult=1+Math.floor(combo/5); score+=pts*mult; coins+=pts*mult; if(h.type==='arff'){barkS(); pop(h.x,h.y-30,'🐾 +'+(pts*mult));} else if(h.type==='gold'){goldS(); spawnConf(h.x,h.y); pop(h.x,h.y-30,'⭐ +'+(pts*mult));} else {bonkS(); pop(h.x,h.y-30,'+'+(pts*mult));} if(combo>=3&&combo%3===0)pop(h.x,h.y-50,'COMBO x'+combo); h.up=0.5; }
}
function gameOver(){ scene='over'; if(score>best){best=score;try{localStorage.setItem('moMoMoBest',best);}catch(e){}} buzzer(); }

cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(scene==='title'){ if(inR(p,PLAYBTN)) start(); return; }
  if(scene==='over'){ if(inR(p,PLAYBTN)) start(); return; }
  for(var i=0;i<9;i++){ var h=holes[i]; if(h.up===1 && !h.hit){ var dx=(p.x-h.x)/(HRX+10), dy=(p.y-(h.y-20))/(HRY+34); if(dx*dx+dy*dy<1.1){ whack(h); return; } } }
});

function upd(dt){ if(msgT>0)msgT-=dt; if(shake>0)shake-=dt;
  for(var i=pops.length-1;i>=0;i--){ pops[i].t-=dt; pops[i].y-=26*dt; if(pops[i].t<=0)pops.splice(i,1); }
  for(var ci=conf.length-1;ci>=0;ci--){ var c=conf[ci]; c.vy+=520*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.r+=dt*6; if(c.y>H+20)conf.splice(ci,1); }
  holes.forEach(function(h){ if(h.anim<1)h.anim=Math.min(1,h.anim+dt*6); });
  if(scene!=='play')return;
  timeLeft-=dt; if(timeLeft<=0){ timeLeft=0; gameOver(); return; }
  holes.forEach(function(h){ if(h.up===1){ h.t-=dt; if(h.t<=0){ h.up=0.4; } } else if(h.up>0){ h.up-=dt*2.2; if(h.up<0)h.up=0; if(h.up===0){h.type=null;h.hit=0;h.anim=0;} } });
  spawnCd-=dt; var upCount=holes.filter(function(h){return h.up===1;}).length; if(spawnCd<=0 && upCount<4){ spawn(); spawnCd=Math.max(0.35,0.8-(45-timeLeft)*0.01); }
}

function drawMoHead(x,y,s){ cx.save(); cx.translate(x,y); cx.scale(s,s); cx.fillStyle='#e0563b'; rr(-16,4,32,20,7); cx.fill(); cx.fillStyle='#a9743e'; cx.beginPath(); cx.arc(0,-6,15,0,7); cx.fill(); cx.fillStyle='#3a2a1a'; cx.beginPath(); cx.arc(0,-13,15,Math.PI,0); cx.fill(); cx.fillStyle='#fff'; cx.beginPath(); cx.arc(-5,-5,2.4,0,7); cx.arc(5,-5,2.4,0,7); cx.fill(); cx.fillStyle='#20242c'; cx.beginPath(); cx.arc(-5,-5,1.1,0,7); cx.arc(5,-5,1.1,0,7); cx.fill(); cx.strokeStyle='#7a3a2a'; cx.lineWidth=1.5; cx.beginPath(); cx.arc(0,2,5,0.1,Math.PI-0.1); cx.stroke(); cx.restore(); }
function draw(){
  var sk=shake>0?(Math.random()-0.5)*7:0; cx.save(); cx.translate(sk,sk);
  if(scene==='title'){ drawTitle(); cx.restore(); return; }
  var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#7ac85a'); g.addColorStop(1,'#3a8a3a'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  cx.fillStyle='#6cbb4e'; for(var gx=0;gx<W;gx+=18)cx.fillRect(gx,90,3,H-90);
  // header
  cx.fillStyle='rgba(10,26,14,.85)'; rr(8,8,W-16,44,10); cx.fill();
  cx.fillStyle='#ffd23f'; cx.font='bold 20px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🔨 MO MO MO',14,26); cx.fillStyle='#fff'; cx.font='bold 11px Trebuchet MS'; cx.fillText('🪙 '+coins+(combo>=3?'   🔥x'+combo:''),14,44);
  cx.textAlign='center'; cx.fillStyle='#fff'; cx.font='bold 20px Trebuchet MS'; cx.fillText(score,W/2,32); cx.font='bold 18px Trebuchet MS'; cx.fillText('⏱ '+Math.ceil(timeLeft),W/2,50);
  cx.textAlign='right'; cx.fillStyle='#fff'; cx.font='bold 12px Trebuchet MS'; cx.fillText('🏆 '+best,W-14,32);
  // holes + characters
  holes.forEach(function(h){ cx.fillStyle='rgba(20,40,20,.55)'; cx.beginPath(); cx.ellipse(h.x,h.y,HRX,HRY,0,0,7); cx.fill(); cx.fillStyle='#5a3a22'; cx.beginPath(); cx.ellipse(h.x,h.y,HRX-6,HRY-6,0,0,7); cx.fill();
    if(h.up>0 && h.type){ var rise = (h.up===1? h.anim : h.up) ; var yy=h.y-6-rise*40; cx.save(); cx.beginPath(); cx.rect(h.x-HRX,0,HRX*2,h.y+2); cx.clip();
      if(h.type==='mo') drawMoHead(h.x,yy, h.hit?0.85:1);
      else if(h.type==='arff') emoji('🐕',h.x,yy-6,40);
      else if(h.type==='bomb') emoji('💣',h.x,yy-4,38);
      else if(h.type==='gold'){ emoji('👑',h.x,yy-22,20); drawMoHead(h.x,yy,1); }
      if(h.hit && h.type!=='bomb') emoji('💫',h.x+16,yy-18,18);
      cx.restore();
    }
    // hole front lip
    cx.strokeStyle='rgba(20,40,20,.5)'; cx.lineWidth=4; cx.beginPath(); cx.ellipse(h.x,h.y,HRX,HRY,0,0.15,Math.PI-0.15); cx.stroke();
  });
  pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.3); if(/\+|COMBO|💥/.test(p.e)){ cx.fillStyle=p.e.indexOf('💥')>=0?'#ff8a6a':'#ffd23f'; cx.font='bold 16px Trebuchet MS'; cx.textAlign='center'; cx.fillText(p.e,p.x,p.y);} else emoji(p.e,p.x,p.y,18); cx.globalAlpha=1; });
  conf.forEach(function(c){ cx.save(); cx.translate(c.x,c.y); cx.rotate(c.r); cx.fillStyle=c.c; cx.fillRect(-4,-4,8,8); cx.restore(); });
  cx.fillStyle='rgba(255,255,255,.85)'; cx.font='bold 12px Trebuchet MS'; cx.textAlign='center'; cx.fillText('Tap the Mos & Arff! 🐕  Don\'t tap the 💣',W/2,H-16);
  if(scene==='over'){ drawOver(); }
  cx.restore();
}
function drawOver(){ cx.fillStyle='rgba(6,16,8,.8)'; cx.fillRect(0,0,W,H); cx.textAlign='center'; emoji('🔨',W/2,150,54);
  cx.fillStyle='#ffd23f'; cx.font='bold 30px Trebuchet MS'; cx.fillText('TIME! ⏰',W/2,225);
  cx.fillStyle='#fff'; cx.font='bold 20px Trebuchet MS'; cx.fillText('Score '+score+'   🪙 '+coins,W/2,262);
  cx.fillStyle= score>=best?'#9dff6a':'rgba(255,255,255,.8)'; cx.font='bold 14px Trebuchet MS'; cx.fillText(score>=best?'🏆 NEW BEST!':'🏆 Best: '+best,W/2,290);
  cx.fillStyle='#39c46a'; rr(PLAYBTN.x,PLAYBTN.y,PLAYBTN.w,PLAYBTN.h,18); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 24px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('▶ PLAY AGAIN',W/2,PLAYBTN.y+PLAYBTN.h/2); cx.textBaseline='alphabetic'; }
function drawTitle(){ var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#3aa85a'); g.addColorStop(1,'#0c1a10'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  cx.textAlign='center'; drawMoHead(W/2-70,150,1.6); drawMoHead(W/2,140,2); drawMoHead(W/2+70,150,1.6);
  cx.fillStyle='#ffd23f'; cx.font='bold 46px Trebuchet MS'; cx.fillText('MO MO MO',W/2,H/2-30);
  cx.fillStyle='rgba(255,255,255,.9)'; cx.font='12px Trebuchet MS'; cx.fillText('Tap the Mos as they pop up! 🐕 Arff = +3, 👑 = +5.',W/2,H/2); cx.fillText('Don\'t tap the 💣 bombs! Combos give bonus points.',W/2,H/2+18);
  cx.fillStyle='#39c46a'; rr(PLAYBTN.x,PLAYBTN.y,PLAYBTN.w,PLAYBTN.h,18); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 26px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('▶ PLAY',W/2,PLAYBTN.y+PLAYBTN.h/2); cx.textBaseline='alphabetic';
  if(best>0){ cx.fillStyle='rgba(255,255,255,.8)'; cx.font='11px Trebuchet MS'; cx.fillText('🏆 Best: '+best,W/2,H-28); }
}
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window._MM={ get scene(){return scene;}, get score(){return score;}, get coins(){return coins;}, get combo(){return combo;}, get best(){return best;}, get time(){return timeLeft;}, start:function(){start();}, setTime:function(t){timeLeft=t;}, forceUp:function(i,ty){ holes[i].type=ty; holes[i].up=1; holes[i].anim=1; holes[i].hit=0; holes[i].t=5; }, tap:function(i){ whack(holes[i]); }, get holes(){return 9;} };
})();
</script>
</body>
</html>
