<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Trampoline Bounce</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#7ec8ff;font-family:'Trebuchet MS',system-ui,sans-serif;color:#134;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:20px;font-weight:bold;color:#1a5a9a;pointer-events:none;}
  a.back{position:fixed;top:8px;left:10px;color:#1a5a9a;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0007;color:#fff;}
  #over h1{font-size:32px;color:#ffd23f;margin:0 0 6px;} button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🤸 <span id="sc">0</span>m &nbsp; 🏆<span id="hi">0</span></div>
<canvas id="c"></canvas>
<div id="over"><h1>🤸 GAME OVER</h1><p>Height <span id="fin">0</span>m • Best <span id="best">0</span></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var HK='moTrampHi'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var mo,pads,height,camY,running,last,score,best;
  document.getElementById('hi').textContent=getHi();
  function reset(){ mo={x:W/2,y:H-140,vx:0,vy:0,r:22}; pads=[]; camY=0; height=0; score=0; running=true; last=0; pads.push({x:W/2,y:H-90,w:120,broken:false}); for(var i=1;i<14;i++)pads.push({x:40+Math.random()*(W-80),y:H-90-i*90,w:70+Math.random()*50,spring:Math.random()<0.2,broken:false}); document.getElementById('sc').textContent=0; document.getElementById('over').style.display='none'; }
  function tilt(e){ var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); var x=t0.clientX-r.left; mo.vx=(x-mo.x)*0.08; }
  var drag=false;
  cv.addEventListener('touchstart',function(e){drag=true;tilt(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',function(e){if(drag)tilt(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',function(){drag=false;});
  cv.addEventListener('mousedown',function(e){drag=true;tilt(e);});
  window.addEventListener('mousemove',function(e){if(drag)tilt(e);});
  window.addEventListener('mouseup',function(){drag=false;});
  window.addEventListener('keydown',function(e){ if(e.key==='ArrowLeft')mo.vx=-6; if(e.key==='ArrowRight')mo.vx=6; });
  function loop(ts){ if(!running)return; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts;
    mo.vy+=0.4*dt; mo.y+=mo.vy*dt; mo.x+=mo.vx*dt; mo.vx*=0.98; if(mo.x<mo.r){mo.x=mo.r;mo.vx*=-0.5;} if(mo.x>W-mo.r){mo.x=W-mo.r;mo.vx*=-0.5;}
    if(mo.vy>0){ for(var i=0;i<pads.length;i++){ var p=pads[i]; if(p.broken)continue; if(mo.y+mo.r>p.y-camY&&mo.y+mo.r<p.y-camY+22&&Math.abs(mo.x-p.x)<p.w/2){ mo.vy=p.spring?-16:-11.5; beep(p.spring?900:600,0.08); break; } } }
    // scroll up when mo above middle
    if(mo.y<H*0.42){ var d=H*0.42-mo.y; camY-=d; mo.y+=d; height+=d; }
    score=Math.floor(height/40); document.getElementById('sc').textContent=score;
    // recycle pads that fall below
    for(var i=0;i<pads.length;i++){ if(pads[i].y-camY>H+40){ pads[i].y-= (14*90); pads[i].x=40+Math.random()*(W-80); pads[i].w=70+Math.random()*50; pads[i].spring=Math.random()<0.2; } }
    if(mo.y-camY>H+40){ over(); return; }
    draw(); requestAnimationFrame(loop); }
  function draw(){ ctx.fillStyle='#7ec8ff'; ctx.fillRect(0,0,W,H);
    ctx.font='24px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; for(var c=0;c<3;c++){ ctx.fillText('☁️',(c*W/3+40+ (camY*0.1)%W +W)%W, 60+c*40); }
    for(var i=0;i<pads.length;i++){ var p=pads[i]; var y=p.y-camY; if(y<-30||y>H+30)continue; ctx.fillStyle=p.spring?'#ff6ad5':'#2ad17a'; ctx.fillRect(p.x-p.w/2,y,p.w,14); ctx.fillStyle='#0003'; ctx.fillRect(p.x-p.w/2,y+11,p.w,3); if(p.spring){ ctx.font='16px sans-serif'; ctx.fillText('⬆️',p.x,y-10); } }
    ctx.font='40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(mo.vy<0?'🤸':'🧍',mo.x,mo.y); }
  function over(){ running=false; if(score>getHi()){ setHi(score); } document.getElementById('hi').textContent=getHi(); document.getElementById('fin').textContent=score; document.getElementById('best').textContent=getHi(); document.getElementById('over').style.display='flex'; beep(150,0.2); }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); requestAnimationFrame(loop); };
  reset(); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
