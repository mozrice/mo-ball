<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MO 2K26 — MyCareer</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0e18;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;}
  canvas{display:block;width:100%;height:100%;}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;overflow:auto;z-index:6;background:#0a0e18f6;}
  .screen.on{display:flex;}
  h1{font-size:34px;margin:6px 0 2px;color:#ffd23f;text-shadow:0 3px 0 #0008,0 0 18px #ff9500;letter-spacing:1px;}
  .sub{font-size:13px;color:#8fc0ff;letter-spacing:2px;font-weight:bold;margin-bottom:6px;}
  /* player card */
  #pcard{width:250px;border-radius:16px;padding:14px;background:linear-gradient(160deg,#2a3d6a,#141c33);border:3px solid #ffd23f;box-shadow:0 6px 18px #000a;position:relative;margin:4px 0;}
  #pcard.leg{background:linear-gradient(160deg,#7a5a1a,#3a2a08);border-color:#ffe680;}
  #ovr{position:absolute;top:10px;left:14px;text-align:center;} #ovr .n{font-size:40px;font-weight:bold;color:#ffd23f;line-height:1;} #ovr .l{font-size:11px;color:#9fd0ff;font-weight:bold;}
  #pface{font-size:60px;margin-top:6px;} #pname{font-size:22px;font-weight:bold;} #prank{font-size:14px;color:#ffd23f;font-weight:bold;margin-top:2px;}
  #badges{margin-top:6px;font-size:20px;min-height:26px;letter-spacing:2px;}
  .stats{display:flex;gap:14px;justify-content:center;margin:6px 0;font-size:13px;color:#cfe0ff;}
  .stats b{color:#fff;font-size:16px;display:block;}
  .btn{margin-top:10px;background:linear-gradient(#ff9f43,#f0722a);border:none;color:#fff;font-weight:bold;font-size:20px;padding:12px 26px;border-radius:14px;box-shadow:0 5px 0 #b4541a;font-family:inherit;}
  .btn.blue{background:linear-gradient(#43a6ff,#2a6ff0);box-shadow:0 5px 0 #1a4bb4;}
  .btn.sm{font-size:15px;padding:9px 16px;}
  /* upgrade rows */
  .attr{width:280px;display:flex;align-items:center;gap:8px;margin:5px 0;background:#131a2e;border-radius:12px;padding:8px 10px;}
  .attr .an{width:78px;font-size:13px;font-weight:bold;text-align:left;}
  .bar{flex:1;height:14px;background:#0008;border-radius:8px;overflow:hidden;border:1px solid #ffffff22;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#43c6ff,#7bff9e);}
  .attr .av{width:26px;font-weight:bold;color:#ffd23f;}
  .plus{width:34px;height:34px;border-radius:8px;border:none;background:#2ad17a;color:#053;font-size:20px;font-weight:bold;font-family:inherit;}
  .plus:disabled{background:#444;color:#888;}
  #sp{font-size:16px;color:#ffd23f;font-weight:bold;margin:6px;}
  /* in-game hud */
  #ghud{position:fixed;top:10px;left:0;right:0;display:none;justify-content:center;gap:8px;pointer-events:none;font-weight:bold;text-shadow:0 2px 0 #0007;z-index:5;}
  #ghud .pill{background:#0008;border-radius:20px;padding:6px 12px;font-size:15px;}
  #gmsg{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:34px;font-weight:bold;color:#ffd23f;text-shadow:0 3px 0 #0008,0 0 18px #ffae00;pointer-events:none;opacity:0;transition:opacity .1s;z-index:5;}
  #ghint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:14px;color:#cfe0ff;pointer-events:none;z-index:5;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ghud"><div class="pill">🔵 MO <span id="gyou">0</span></div><div class="pill">Poss <span id="gposs">1</span>/7</div><div class="pill">🔴 <span id="gopp">0</span></div></div>
<div id="gmsg"></div>
<div id="ghint">HOLD to fill, RELEASE on GREEN 🟩!</div>

<!-- HUB -->
<div class="screen on" id="hub">
  <h1>🏀 MyCareer</h1>
  <div class="sub">MO 2K26</div>
  <div id="pcard">
    <div id="ovr"><div class="n" id="ovrN">65</div><div class="l">OVR</div></div>
    <div id="pface">🏀</div>
    <div id="pname">MO</div>
    <div id="prank">ROOKIE</div>
    <div id="badges"></div>
  </div>
  <div class="stats">
    <div>GP<b id="sGP">0</b></div><div>PTS<b id="sPTS">0</b></div><div>Wins<b id="sW">0</b></div><div>Best<b id="sBest">0</b></div>
  </div>
  <button class="btn" id="playBtn">▶ PLAY GAME</button>
  <button class="btn blue sm" id="upBtn">⭐ UPGRADE <span id="spBadge"></span></button>
  <button class="btn sm" id="resetBtn" style="background:#333;box-shadow:0 5px 0 #111;">↺ New Career</button>
</div>

<!-- UPGRADE -->
<div class="screen" id="upgrade">
  <h1>⭐ Upgrade</h1>
  <div id="sp">Skill Points: 0</div>
  <div class="attr"><div class="an">🎯 Shooting</div><div class="bar"><i id="b_sh"></i></div><div class="av" id="v_sh">60</div><button class="plus" data-a="sh">+</button></div>
  <div class="attr"><div class="an">🏹 Range</div><div class="bar"><i id="b_rg"></i></div><div class="av" id="v_rg">55</div><button class="plus" data-a="rg">+</button></div>
  <div class="attr"><div class="an">🤾 Handle</div><div class="bar"><i id="b_hd"></i></div><div class="av" id="v_hd">55</div><button class="plus" data-a="hd">+</button></div>
  <div class="attr"><div class="an">🔨 Dunk</div><div class="bar"><i id="b_dk"></i></div><div class="av" id="v_dk">60</div><button class="plus" data-a="dk">+</button></div>
  <div style="font-size:13px;color:#8fc0ff;margin-top:6px;">Higher ratings = bigger green, better shots, more dunks!</div>
  <button class="btn" id="upDone">DONE</button>
</div>

<!-- POSTGAME -->
<div class="screen" id="post">
  <h1 id="postT">🏀 GAME OVER</h1>
  <div id="postBox" style="font-size:19px;text-align:center;line-height:1.7;"></div>
  <button class="btn" id="postDone">CONTINUE</button>
</div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1,GY=0,T=40,G=0.4,GC=0.84;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); GY=H*0.8; }
  addEventListener('resize',resize); resize();
  function beep(f,d,t,v){ try{var a=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());var o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.05;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1));o.stop(a.currentTime+(d||0.1)+0.02);}catch(e){} }
  function cheer(){ beep(523,0.1,'square',0.05); setTimeout(function(){beep(659,0.1,'square',0.05);},80); setTimeout(function(){beep(784,0.16,'square',0.05);},160); }
  // ---- career save ----
  var car; function loadCar(){ try{ car=JSON.parse(localStorage.getItem('mo2k_career')||'null'); }catch(e){} if(!car||!car.attr){ car={ attr:{sh:60,rg:55,hd:55,dk:60}, sp:0, gp:0, pts:0, wins:0, best:0, badges:[] }; } }
  function saveCar(){ try{ localStorage.setItem('mo2k_career',JSON.stringify(car)); }catch(e){} }
  loadCar();
  function ovr(){ var a=car.attr; return Math.round((a.sh+a.rg+a.hd+a.dk)/4); }
  function rank(o){ if(o>=96)return['🐐 LEGEND','leg']; if(o>=92)return['👑 MVP','leg']; if(o>=86)return['💫 SUPERSTAR','']; if(o>=80)return['🌟 ALL-STAR','']; if(o>=75)return['⭐ STARTER','']; if(o>=70)return['🏀 ROTATION','']; return['🏀 ROOKIE','']; }
  var BADGES=[ {id:'sharp',emo:'🎯',need:function(){return car.attr.sh>=80;},name:'Sharpshooter'},
    {id:'deadeye',emo:'🏹',need:function(){return car.attr.rg>=80;},name:'Deadeye'},
    {id:'handles',emo:'🤾',need:function(){return car.attr.hd>=80;},name:'Ankle Snatcher'},
    {id:'poster',emo:'🔨',need:function(){return car.attr.dk>=85;},name:'Poster'},
    {id:'allstar',emo:'🌟',need:function(){return ovr()>=80;},name:'All-Star'},
    {id:'mvp',emo:'👑',need:function(){return ovr()>=92;},name:'MVP'},
    {id:'bucket',emo:'🪣',need:function(){return car.pts>=100;},name:'Bucket Getter'},
    {id:'champ',emo:'🏆',need:function(){return car.wins>=5;},name:'Champion'} ];
  function checkBadges(){ var earned=[]; for(var i=0;i<BADGES.length;i++){ if(BADGES[i].need()&&car.badges.indexOf(BADGES[i].id)<0){ car.badges.push(BADGES[i].id); earned.push(BADGES[i]); } } return earned; }
  // ---- screens ----
  function show(id){ ['hub','upgrade','post'].forEach(function(s){ document.getElementById(s).classList.toggle('on',s===id); }); document.getElementById('ghud').style.display = (id==='game')?'flex':'none'; }
  function showGame(){ ['hub','upgrade','post'].forEach(function(s){ document.getElementById(s).classList.remove('on'); }); document.getElementById('ghud').style.display='flex'; }
  function renderHub(){ var o=ovr(); document.getElementById('ovrN').textContent=o; var rk=rank(o); document.getElementById('prank').textContent=rk[0]; document.getElementById('pcard').className=rk[1]?'leg':'';
    document.getElementById('sGP').textContent=car.gp; document.getElementById('sPTS').textContent=car.pts; document.getElementById('sW').textContent=car.wins; document.getElementById('sBest').textContent=car.best;
    document.getElementById('spBadge').textContent=car.sp>0?('('+car.sp+')'):'';
    var bd=''; for(var i=0;i<car.badges.length;i++){ var b=BADGES.filter(function(x){return x.id===car.badges[i];})[0]; if(b)bd+=b.emo; } document.getElementById('badges').textContent=bd||'— no badges yet —'; }
  function renderUpgrade(){ document.getElementById('sp').textContent='Skill Points: '+car.sp; var a=car.attr;
    [['sh'],['rg'],['hd'],['dk']].forEach(function(x){ var k=x[0]; document.getElementById('v_'+k).textContent=a[k]; document.getElementById('b_'+k).style.width=a[k]+'%'; });
    var btns=document.querySelectorAll('.plus'); for(var i=0;i<btns.length;i++){ var k=btns[i].getAttribute('data-a'); btns[i].disabled=(car.sp<=0||a[k]>=99); } }
  document.getElementById('playBtn').onclick=function(){ if(beep.ac&&beep.ac.state==='suspended')beep.ac.resume(); startGame(); };
  document.getElementById('upBtn').onclick=function(){ show('upgrade'); renderUpgrade(); };
  document.getElementById('upDone').onclick=function(){ saveCar(); show('hub'); renderHub(); };
  document.getElementById('resetBtn').onclick=function(){ if(confirm && !confirm('Start a brand new career?'))return; localStorage.removeItem('mo2k_career'); loadCar(); renderHub(); };
  var plusBtns=document.querySelectorAll('.plus'); for(var i=0;i<plusBtns.length;i++){ plusBtns[i].onclick=function(){ var k=this.getAttribute('data-a'); if(car.sp>0&&car.attr[k]<99){ car.attr[k]++; car.sp--; beep(600,0.05,'square',0.04); var e=checkBadges(); renderUpgrade(); } }; }
  document.getElementById('postDone').onclick=function(){ saveCar(); show('hub'); renderHub(); };
  // ---- game ----
  var game=null, holding=false, meter=0, ball=null, msgT=0, running=false;
  function startGame(){ game={poss:0,POSS:7,you:0,opp:0,mate:0,made:0}; running=true; holding=false; meter=0; msgT=0; showGame(); updHud(); newPoss(); }
  function updHud(){ document.getElementById('gyou').textContent=game.you+game.mate; document.getElementById('gopp').textContent=game.opp; document.getElementById('gposs').textContent=Math.min(game.poss+1,game.POSS); }
  function newPoss(){ var r=Math.random(); var type=r<0.25?'layup':(r<0.6?'mid':'three'); var dx=(Math.random()-0.5)*W*0.5;
    var contest=Math.max(0,Math.random()*1.0-(car.attr.hd-55)/120); contest=Math.max(0,Math.min(1,contest));
    ball={x:W/2+dx,y:GY-16,vx:0,vy:0,flying:false,spin:0,frame:0,green:false,type:type,contest:contest}; holding=false; meter=0;
    document.getElementById('ghint').textContent = type==='layup'?'Drive! HOLD & release on GREEN 🟩 (layup +2)':type==='three'?'Deep 3! HOLD & release on GREEN 🟩 (+3)':'Mid-range! HOLD & release on GREEN 🟩 (+2)'; }
  function gwFor(){ var a=car.attr; var base=0.05+a.sh/100*0.09; if(ball.type==='three') base-=(1-a.rg/100)*0.06; if(ball.type==='layup') base=0.09+a.dk/100*0.09; return Math.max(0.035, base-ball.contest*0.06); }
  function startHold(){ if(!running||!ball||ball.flying||holding)return; holding=true; meter=0; }
  function release(){ if(!holding)return; holding=false; var off=meter-GC; var made=Math.abs(off)<gwFor(); if(ball.type==='layup'&&!made){ made=Math.random()<(0.5+car.attr.dk/100*0.4-ball.contest*0.3); }
    var perfectVy=(H*0.26-ball.y-0.5*G*T*T)/T; var pf=1+off*1.4; ball.vy=perfectVy*pf; ball.vx=(W/2-ball.x)/T; ball.flying=true; ball.frame=0; ball.green=made; ball._pts=(ball.type==='three')?3:2; ball._dunk=(ball.type==='layup'&&made&&ball.contest<0.3&&Math.random()<0.6); beep(made?520:300,0.1,'sine',0.05); }
  cv.addEventListener('mousedown',startHold); addEventListener('mouseup',release);
  cv.addEventListener('touchstart',function(e){startHold();e.preventDefault();},{passive:false}); addEventListener('touchend',function(e){release();},{passive:false});
  addEventListener('keydown',function(e){ if(e.key===' ')startHold(); }); addEventListener('keyup',function(e){ if(e.key===' ')release(); });
  function gmsg(m,col){ if(!m)return; var e=document.getElementById('gmsg'); e.textContent=m; e.style.color=col||'#ffd23f'; e.style.opacity=1; msgT=1.1; }
  function afterShot(made){ if(made){ game.you+=ball._pts; game.made++; gmsg(ball._dunk?'🔨 POSTER! +2':(ball.green?(ball._pts===3?'🟩 THREE! +3':'🟩 BUCKET! +'+ball._pts):'🏀 +'+ball._pts), '#7bff9e'); beep(660,0.1,'square',0.05); }
    else gmsg('❌ Miss','#ffb0b0');
    // sim rest of possession (teammate + opponent)
    if(Math.random()<0.32) game.mate+=2;
    var oppBase=0.45+ (ovr()<75?0.06:0) - car.attr.hd/100*0.12; if(Math.random()<Math.max(0.28,oppBase)) game.opp += (Math.random()<0.25?3:2);
    updHud(); game.poss++;
    if(game.poss>=game.POSS){ setTimeout(endGame,700); return; }
    setTimeout(function(){ if(running)newPoss(); },650); }
  function endGame(){ running=false; var youTot=game.you+game.mate, win=youTot>game.opp;
    car.gp++; car.pts+=game.you; if(game.you>car.best)car.best=game.you; if(win)car.wins++;
    var earned=2+Math.floor(game.you/4)+(win?3:0); car.sp+=earned;
    var newBadges=checkBadges(); saveCar();
    document.getElementById('postT').textContent=win?'🏆 WIN!':'😤 LOSS';
    var bx='Final: <b>'+youTot+' – '+game.opp+'</b><br>Your points: <b>'+game.you+'</b><br>+<b>'+earned+'</b> Skill Points ⭐';
    if(newBadges.length){ bx+='<br><br>NEW BADGE'+(newBadges.length>1?'S':'')+':<br>'+newBadges.map(function(b){return b.emo+' '+b.name;}).join('<br>'); }
    var o=ovr(); bx+='<br><br>OVR: <b>'+o+'</b> — '+rank(o)[0];
    document.getElementById('postBox').innerHTML=bx; show('post'); if(win)cheer(); else beep(200,0.2,'sawtooth',0.05); }
  function update(dt){ if(!running||!ball)return;
    if(holding){ meter+=0.02*dt; if(meter>=1){ meter=1; release(); } }
    if(ball.flying){ ball.frame+=dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt; ball.vy+=G*dt; ball.spin+=0.3*dt;
      if(ball.frame>=T){ var hy=H*0.26; var made=ball.green||Math.abs(ball.y-hy)<16; ball.flying=false; afterShot(made); return; }
      if(ball.y>GY+30){ ball.flying=false; afterShot(false); } }
    if(msgT>0){ msgT-=0.02*dt; if(msgT<=0)document.getElementById('gmsg').style.opacity=0; }
  }
  function render(){ if(!game){ return; }
    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#182a55'); g.addColorStop(1,'#0a1020'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    var hoop={x:W/2,y:H*0.26,r:22};
    ctx.fillStyle='#c98a44'; ctx.fillRect(0,GY,W,H-GY);
    ctx.strokeStyle='#fff8'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(hoop.x,GY,Math.min(W*0.42,GY-hoop.y-10),Math.PI,6.29,false); ctx.stroke();
    ctx.fillStyle='#8a94a0'; ctx.fillRect(hoop.x-4,hoop.y-44,8,-28);
    ctx.fillStyle='#eef3f7'; ctx.fillRect(hoop.x-28,hoop.y-44,56,10); ctx.strokeStyle='#c0392b'; ctx.lineWidth=3; ctx.strokeRect(hoop.x-28,hoop.y-44,56,10);
    ctx.strokeStyle='#ff7b00'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(hoop.x,hoop.y,hoop.r,7,0,0,6.29); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.4; for(var n=0;n<7;n++){ var an=n/7*6.28; ctx.beginPath(); ctx.moveTo(hoop.x+Math.cos(an)*hoop.r,hoop.y+Math.sin(an)*7); ctx.lineTo(hoop.x+Math.cos(an)*hoop.r*0.5,hoop.y+18); ctx.stroke(); }
    if(ball){ // defender if contested
      if(ball.contest>0.4&&!ball.flying){ ctx.save(); ctx.translate(ball.x+(ball.x<W/2?36:-36),ball.y-6); ctx.fillStyle='#e0453a'; roundRect(-12,-14,24,28,7); ctx.fill(); ctx.fillStyle='#f6c48a'; ctx.beginPath(); ctx.arc(0,-22,9,0,6.29); ctx.fill(); ctx.strokeStyle='#e0453a'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-9,-6); ctx.lineTo(-16,-26); ctx.moveTo(9,-6); ctx.lineTo(16,-26); ctx.stroke(); ctx.restore(); }
      // MO
      ctx.save(); ctx.translate(ball.x,ball.y+8); ctx.fillStyle='#1a6fd0'; roundRect(-13,-14,26,28,8); ctx.fill(); ctx.fillStyle='#f6c48a'; ctx.beginPath(); ctx.arc(0,-22,10,0,6.29); ctx.fill(); ctx.fillStyle='#2a2018'; ctx.beginPath(); ctx.arc(0,-25,10,Math.PI,6.29); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('MO',0,-1); ctx.restore();
      drawBall(ball.x,ball.y);
      if(holding||(!ball.flying)) drawMeter();
    }
  }
  function drawMeter(){ if(ball.flying)return; var mx=ball.x+30; if(mx>W-40)mx=ball.x-48; var my=ball.y-150,mh=140,mw=17,gw=gwFor();
    ctx.fillStyle='#000a'; roundRect(mx,my,mw,mh,9); ctx.fill();
    var gy1=my+mh*(1-(GC+gw)), gy2=my+mh*(1-(GC-gw)); ctx.fillStyle='#37d06a'; ctx.fillRect(mx+2,gy1,mw-4,gy2-gy1);
    ctx.fillStyle=holding?'#ffd23f':'#888'; ctx.fillRect(mx+2,my+mh*(1-meter),mw-4,mh*meter);
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; roundRect(mx,my,mw,mh,9); ctx.stroke();
    if(!holding){ ctx.fillStyle='#fff'; ctx.font='bold 11px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('HOLD',mx+mw/2,my+mh+16); } }
  function drawBall(x,y){ var r=12; ctx.save(); ctx.translate(x,y); ctx.rotate(ball.spin);
    var grd=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.2,0,0,r); grd.addColorStop(0,'#ffb15c'); grd.addColorStop(1,'#e0701f'); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,0,r,0,6.29); ctx.fill();
    ctx.strokeStyle='#7a3d10'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(0,0,r,0,6.29); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.moveTo(0,-r); ctx.lineTo(0,r); ctx.stroke(); ctx.restore(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  var last=0;
  function loop(ts){ if(!last)last=ts; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts; if(running)update(dt); if(game&&document.getElementById('ghud').style.display==='flex')render(); requestAnimationFrame(loop); }
  renderHub(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
