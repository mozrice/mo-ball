function showMsg(t){ msg=t; msgT=2.0; }

function enterBuild(){ scene='build'; loadBuild((Math.random()*BUILDS.length)|0); showMsg('Build a '+cur.name+' to earn 💰!'); bark(); }
function start(){ scene='city'; battling=false; coins=0; CITY.forEach(function(b,i){ b.lvl = i<2?1:0; }); compVal=0; compCd=9; timeLeft=ROUND; trash=[]; trashCd=4; result=null; arff.x=250; arff.y=430; mo.x=200; mo.y=420; showMsg('Walk around! 🕹  BUILD 💰, REMODEL, then 🆚 BATTLE or 🏟 STADIUM'); }
function startBattle(){ scene='city'; battling=true; result=null; timeLeft=ROUND; compVal=0; compCd=9; trash=[]; trashCd=4; showMsg('BATTLE ON! Best city before time runs out wins! 🆚💻'); bark(); }
function enterStadium(){ scene='stadium'; showMsg(''); }
function pickSport(k){ for(var i=0;i<SPORTS.length;i++)if(SPORTS[i].k===k)sport=SPORTS[i]; sScore=0; sShots=0; mSpeed=0.9; sFx=0; newAim(); scene='sport'; }
function newAim(){ var w=0.13+Math.random()*0.09; gzA=0.08+Math.random()*(0.84-w); gzB=gzA+w; mMark=0; mDir=1; }
function sShoot(){ if(scene!=='sport'||!sport)return; var hit=(mMark>=gzA&&mMark<=gzB); sShots++; if(hit){ sScore++; coins+=3; sFx=0.5; sMsg='SCORE! 🎉'; sMsgT=0.8; cash(); mSpeed=Math.min(1.9,mSpeed+0.1); } else { sMsg='Miss!'; sMsgT=0.7; nope(); } if(sScore>=sport.goal){ var bonus=15+sScore*4; coins+=bonus; scene='city'; showMsg('🏟 '+sport.n+' WIN! +💰'+bonus+' earned!'); winSnd(); spawnConf(200,300); sport=null; } else newAim(); }
function spawnConf(x,y){ for(var i=0;i<70;i++)confetti.push({x:x||W/2,y:y||H/2,vx:(Math.random()-0.5)*280,vy:-150-Math.random()*210,c:['#ffd23f','#ff7ac0','#5ad1ff','#9dff6a','#ff9a3f'][(Math.random()*5)|0],r:Math.random()*6}); }

// ---- city economy + VS ----
function remodelCost(b){ return 20+b.lvl*20; }
function cityValue(){ var s=0; CITY.forEach(function(b){s+=b.lvl;}); return s; }
function cityMax(){ return CITY.length*CMAX; }
function yourScore(){ return Math.max(0, cityValue()-trash.length); }
function cityBtnRect(i){ var c=CELLS[i]; return {x:c.x-46,y:c.y+50,w:92,h:26}; }
function cityBodyRect(i){ var c=CELLS[i]; return {x:c.x-46,y:c.y-46,w:92,h:92}; }
function doRemodel(i){ if(result!==null)return; var b=CITY[i]; if(b.lvl>=CMAX){ nope(); showMsg(b.n+' is already fancy! ⭐'); return; } var cost=remodelCost(b); if(coins<cost){ nope(); showMsg('Need 💰'+cost+' — go BUILD to earn it!'); return; } coins-=cost; b.lvl++; cash(); nailFx.push({x:CELLS[i].x,y:CELLS[i].y-8,t:0.5,e:'⭐'}); spawnConf(CELLS[i].x,CELLS[i].y); showMsg(b.n+' remodeled! ⭐'); }
function nearestTrash(){ var b=null,bd=1e9; for(var i=0;i<trash.length;i++){ var d=Math.hypot(arff.x-trash[i].x,arff.y-trash[i].y); if(d<bd){bd=d;b=trash[i];} } return b; }
function compLvls(){ var a=[0,0,0,0,0,0]; for(var k=0;k<compVal;k++)a[k%6]++; return a; }
function endRound(){ result = yourScore()>=compVal ? 'win':'lose'; if(result==='win'){ vsWins++; try{localStorage.setItem('moArffVS',vsWins);}catch(e){} winSnd(); spawnConf(200,300); } else { nope(); } }

// ---- build minigame ----
function trayList(){ var a=[]; for(var i=0;i<cur.blocks.length;i++)if(!cur.blocks[i].placed)a.push(cur.blocks[i]); return a; }
function chipRect(idx){ var col=idx%5, row=(idx/5)|0; return {x:TRAYX+8+col*(TRAYW-16)/5, y:TRAYY+12+row*42, w:(TRAYW-16)/5-6, h:36}; }
function placePiece(b){ if(b.placed)return; b.placed=true; placed++; hammer(); mo.ham=0.45; arff.hop=0.5; nailFx.push({x:b[0],y:b[1],t:0.5}); var near=Math.hypot(mo.x-b[0],mo.y-b[1])<64; showMsg(near?'🔨 Nailed it, right by Mo!':'🔨 Nailed in!'); if(placed>=cur.blocks.length) complete(); }
function complete(){ lastPay=10+cur.blocks.length*4; coins+=lastPay; celebrateT=2.1; winSnd(); spawnConf(200,300); }
