<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Water Balloon Toss</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#8fd0ff;font-family:'Trebuchet MS',system-ui,sans-serif;color:#134;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#0a4a8a;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:19px;font-weight:bold;color:#0a4a8a;pointer-events:none;}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0007;color:#fff;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;} button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
  #tip{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#0a4a8a;font-size:15px;pointer-events:none;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">💦 <span id="sc">0</span> &nbsp; ⏱️<span id="t">30</span>s &nbsp; 🏆<span id="hi">0</span></div>
<canvas id="c"></canvas>
<div id="tip">👆 Tap a target to splash it with a water balloon!</div>
<div id="over"><h1>💦 TIME!</h1><p id="msg"></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var HK='moWBHi'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var targets,balloons,score,time,running,last,spawnT,splashes;
  document.getElementById('hi').textContent=getHi();
  function reset(){ targets=[]; balloons=[]; splashes=[]; score=0; time=30; running=true; last=0; spawnT=0; document.getElementById('sc').textContent=0; document.getElementById('t').textContent=30; document.getElementById('over').style.display='none'; }
  function spawn(){ var friend=Math.random()<0.22; targets.push({x:-30,y:H*0.3+Math.random()*H*0.4,vx:1+Math.random()*1.8,e:friend?'👵':['🧑','🧒','👦','👧','🐶'][Math.floor(Math.random()*5)],friend:friend,hit:0}); }
  function toss(e){ if(!running)return; var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); var tx=t0.clientX-r.left,ty=t0.clientY-r.top; balloons.push({x:W/2,y:H-30,tx:tx,ty:ty,t:0}); beep(400,0.05); }
  cv.addEventListener('touchstart',function(e){toss(e);e.preventDefault();},{passive:false});
  cv.addEventListener('mousedown',function(e){toss(e);});
  function loop(ts){ if(!running)return; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts;
    time-=dt/60; if(time<=0){ time=0; over(); } document.getElementById('t').textContent=Math.ceil(time);
    spawnT-=dt; if(spawnT<=0){ spawn(); spawnT=42; }
    for(var i=targets.length-1;i>=0;i--){ var g=targets[i]; g.x+=g.vx*dt; if(g.hit>0){ g.hit--; if(g.hit===0)targets.splice(i,1); continue; } if(g.x>W+30)targets.splice(i,1); }
    for(var b=balloons.length-1;b>=0;b--){ var bl=balloons[b]; bl.t+=0.06*dt; if(bl.t>=1){ var bx=bl.tx,by=bl.ty; splashes.push({x:bx,y:by,life:16}); var hit=false; for(var j=0;j<targets.length;j++){ var g2=targets[j]; if(g2.hit>0)continue; if(Math.hypot(g2.x-bx,g2.y-by)<30){ g2.hit=10; if(g2.friend){ score=Math.max(0,score-2); } else { score++; } document.getElementById('sc').textContent=score; hit=true; break; } } beep(hit?760:300,0.06); balloons.splice(b,1); } }
    for(var s=splashes.length-1;s>=0;s--){ splashes[s].life--; if(splashes[s].life<=0)splashes.splice(s,1); }
    draw(); requestAnimationFrame(loop); }
  function draw(){ ctx.fillStyle='#8fd0ff'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#6ab04a'; ctx.fillRect(0,H-40,W,40);
    for(var i=0;i<targets.length;i++){ var g=targets[i]; ctx.font=(g.hit>0?'40px':'32px')+' sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(g.hit>0?'💦':g.e,g.x,g.y); if(g.friend&&g.hit===0){ ctx.font='14px sans-serif'; ctx.fillText('🚫',g.x,g.y-26); } }
    for(var b=0;b<balloons.length;b++){ var bl=balloons[b]; var e=bl.t; var x=bl.x+(bl.tx-bl.x)*e, y=bl.y+(bl.ty-bl.y)*e-Math.sin(e*Math.PI)*100; ctx.font='24px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💧',x,y); }
    for(var s=0;s<splashes.length;s++){ ctx.globalAlpha=splashes[s].life/16; ctx.font='34px sans-serif'; ctx.fillText('💦',splashes[s].x,splashes[s].y); ctx.globalAlpha=1; }
    ctx.font='40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🧒',W/2,H-24); }
  function over(){ running=false; if(score>getHi()){ setHi(score); } document.getElementById('hi').textContent=getHi(); document.getElementById('msg').textContent='You splashed '+score+' targets! Best '+getHi(); document.getElementById('over').style.display='flex'; }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.04; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); requestAnimationFrame(loop); };
  reset(); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
