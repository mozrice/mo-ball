<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>City Builder</title>
<style>

</style>

<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function tap(){ bp(300,0.06,'square',0.12); } function buildS(){ bp(520,0.07,'triangle',0.16); setTimeout(function(){bp(780,0.09,'triangle',0.16);},70); } function no(){ bp(200,0.1,'square',0.1); } function fanfare(){ [660,880,990,1180].forEach(function(f,i){ setTimeout(function(){ bp(f,0.14,'triangle',0.16); },i*120); }); }

var JB={x:66,y:H-58,r:44}, AB={x:W-58,y:H-60,r:46};
var joyId=null,joyX=0,joyY=0,aId=null;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+10; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(won){ if(p.x>PB.x-PB.w/2&&p.x<PB.x+PB.w/2&&p.y>PB.y-PB.h/2&&p.y<PB.y+PB.h/2){ buildS(); restart(); } return; }
  if(inC(p,AB)){ aId=e.pointerId; doAction(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

var mo={x:W/2,y:H-170,step:0}, dir=1, lastdx=0;
var BUILDS=[
 {k:'house',  e:'🏠', n:'a House',    c:'#e0a060', x:74,  y:150},
 {k:'shop',   e:'🏪', n:'a Shop',     c:'#e0633a', x:326, y:150},
 {k:'school', e:'🏫', n:'the School', c:'#e0b040', x:74,  y:300},
 {k:'hosp',   e:'🏥', n:'the Hospital',c:'#f0f0f0', x:326, y:300},
 {k:'lib',    e:'📖', n:'the Library', c:'#8a63d2', x:200, y:235},
 {k:'office', e:'🏢', n:'an Office',  c:'#3a6ea8', x:200, y:375},
 {k:'park',   e:'🌳', n:'the Park',   c:'#3a9a4a', x:92,  y:455},
 {k:'court',  e:'🏀', n:'the Court',  c:'#e0823a', x:312, y:455},
 {k:'roads',  e:'🚧', n:'the Roads',  c:'#777',    x:200, y:H-210}
];
BUILDS.forEach(function(b){ b.built=false; b.pop=0; });
var OFFICE_STEPS=['Laid the foundation','Built floor 1','Built floor 2','Built floor 3','Built floor 4','Built floor 5','Built the roof','Put up the sign','Added rooftop lights'];
for(var _oi=0;_oi<BUILDS.length;_oi++) if(BUILDS[_oi].k==='office'){ BUILDS[_oi].steps=OFFICE_STEPS; BUILDS[_oi].stage=0; }
var phase='clear', debris=[], DEBRIS=['🗑️','🛢️','🪨','🛒','🚧','🪵'];
function genDebris(){ debris=[]; for(var i=0;i<6;i++){ debris.push({e:DEBRIS[i], x:44+Math.random()*(W-88), y:124+Math.random()*(H-300), gone:false}); } }
var level=1,MAXLV=10,built=0,complete=false,coins=0,won=false,msg='🏗️ Level 1 — drive around and CLEAR the lots first!',msgT=3.8,pops=[],t=0;
var PB={x:W/2,y:H*0.66,w:200,h:62};
function d(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function moveTo(o,tx,ty,sp){ var dx=tx-o.x, dy=ty-o.y, m=Math.hypot(dx,dy); if(m<1)return; o.x+=dx/m*Math.min(sp,m); o.y+=dy/m*Math.min(sp,m); }
function showMsg(x){ msg=x; msgT=1.9; }
function clearLeft(){ var n=0; for(var i=0;i<debris.length;i++) if(!debris[i].gone) n++; return n; }
function nearestDebris(){ var best=null,bd=50; for(var i=0;i<debris.length;i++){ var dd=debris[i]; if(dd.gone)continue; var m=d(mo,dd); if(m<bd){ bd=m; best=dd; } } return best; }
function nearestUnbuilt(){ var best=null,bd=56; for(var i=0;i<BUILDS.length;i++){ var b=BUILDS[i]; if(b.built)continue; var dd=d(mo,b); if(dd<bd){ bd=dd; best=b; } } return best; }
function newLevel(){ built=0; complete=false; phase='clear'; BUILDS.forEach(function(b){ b.built=false; b.pop=0; if(b.steps)b.stage=0; }); genDebris(); mo.x=W/2; mo.y=H-170; }
function doAction(){ if(won) return;
  if(phase==='clear'){ var dd=nearestDebris(); if(!dd){ showMsg('✨ Lots are clear — now build!'); return; }
    dd.gone=true; tap(); for(var i=0;i<8;i++) pops.push({x:dd.x,y:dd.y,vx:(Math.random()-0.5)*120,vy:-Math.random()*120-30,t:0.6,e:['💨','✨'][i%2]});
    if(clearLeft()<=0){ phase='build'; fanfare(); showMsg('✨ Lots flattened & cleared! Now BUILD the city! 🏗️'); } else showMsg('🚚 Hauled off the junk! '+clearLeft()+' lot'+(clearLeft()===1?'':'s')+' left'); return; }
  if(phase==='explore'){ openCity(); return; }
  if(built<BUILDS.length){ var b=nearestUnbuilt(); if(!b){ showMsg('🚗 Drive onto a glowing spot, then press BUILD!'); no(); return; }
    if(b.steps){ b.stage=(b.stage||0)+1; buildS(); for(var j=0;j<6;j++) pops.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*110,vy:-Math.random()*110-30,t:0.5,e:['🔨','✨'][j%2]});
      if(b.stage>=b.steps.length){ b.built=true; b.pop=1; built++; for(var k2=0;k2<14;k2++) pops.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*160,vy:-Math.random()*160-40,t:0.7,e:['⭐','✨','🎉'][k2%3]});
        if(built>=BUILDS.length){ complete=true; fanfare(); showMsg('🎉 City '+level+' built! Press 🚶 GO IN to walk around!'); } else showMsg('🎉 Finished '+b.n+'!'); }
      else showMsg('🔨 '+b.steps[b.stage-1]+' ('+b.stage+'/'+b.steps.length+')'); return; }
    b.built=true; b.pop=1; built++; buildS(); for(var i=0;i<14;i++) pops.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*160,vy:-Math.random()*160-40,t:0.7,e:['⭐','✨','🔨','🎉'][i%4]});
    if(built>=BUILDS.length){ complete=true; fanfare(); showMsg('🎉 City '+level+' built! Press 🚶 GO IN to walk around!'); } else showMsg('🔨 Built '+b.n+'! ('+built+'/'+BUILDS.length+')');
  } else { phase='explore'; mo.x=W/2; mo.y=H*0.5; showMsg('🚶 Walk around your city! Press 💰 OPEN when done.'); }
}
function openCity(){ var price=20+level*10; coins+=price; buildS(); for(var i=0;i<30;i++) pops.push({x:W/2,y:H/2,vx:(Math.random()-0.5)*260,vy:-Math.random()*260-40,t:1.1,e:['🪙','⭐','🎉','✨'][i%4]});
  if(level>=MAXLV){ won=true; complete=true; fanfare(); setTimeout(fanfare,500); return; }
  level++; newLevel(); showMsg('💰 City opened for 🪙 '+price+'! Level '+level+' — clear the new lots!'); }
function restart(){ level=1; coins=0; won=false; pops=[]; newLevel(); showMsg('🏗️ Level 1 — clear the lots, then build!'); }
function upd(dt){ t+=dt; if(msgT>0)msgT-=dt;
  var v=jv(); var mv=Math.hypot(v.x,v.y); if(mv>0.15){ mo.x=clamp(mo.x+v.x*165*dt,24,W-24); mo.y=clamp(mo.y+v.y*165*dt,108,H-150); mo.step+=dt*10; lastdx=v.x; if(v.x<-0.1)dir=-1; else if(v.x>0.1)dir=1; }
  for(var i=0;i<BUILDS.length;i++){ if(BUILDS[i].pop>0) BUILDS[i].pop-=dt*1.6; }
  for(var i=pops.length-1;i>=0;i--){ var p=pops[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=380*dt; p.t-=dt; if(p.t<=0)pops.splice(i,1); }
}
function drawTruck(x,y){ var roll=mo.step, bob=Math.sin(mo.step*2)*1.2; cx.save(); cx.translate(x,y+bob); cx.save(); cx.scale(dir,1);
  cx.fillStyle='#222'; cx.beginPath(); cx.arc(-12,15,10,0,7); cx.fill(); cx.beginPath(); cx.arc(13,17,7,0,7); cx.fill();
  cx.fillStyle='#ffd23f'; cx.beginPath(); cx.arc(-12,15,4,0,7); cx.fill();
  cx.strokeStyle='#555'; cx.lineWidth=2; cx.save(); cx.translate(-12,15); cx.rotate(roll); for(var k=0;k<4;k++){ cx.rotate(Math.PI/2); cx.beginPath(); cx.moveTo(0,0); cx.lineTo(9,0); cx.stroke(); } cx.restore();
  cx.fillStyle='#f0a81a'; rr(-20,-2,28,16,3); cx.fill(); rr(4,-10,14,16,3); cx.fill();
  cx.fillStyle='#bfe6ff'; rr(6,-8,10,8,2); cx.fill();
  cx.fillStyle='#333'; cx.fillRect(-20,-2,28,3);
  cx.restore();
  cx.fillStyle='#8a5a34'; cx.beginPath(); cx.arc(0,-14,7,0,7); cx.fill(); cx.fillStyle='#ffd23f'; cx.fillRect(-6,-22,12,5);
  cx.restore();
}
function drawTower(b){ var x=b.x,y=b.y, st=b.built?OFFICE_STEPS.length:(b.stage||0), near=nearestUnbuilt()===b;
  if(st===0){ cx.save(); cx.globalAlpha=near?0.55+Math.sin(t*6)*0.25:0.3; cx.strokeStyle='#fff'; cx.lineWidth=2; cx.setLineDash([6,6]); cx.beginPath(); cx.arc(x,y,30,0,7); cx.stroke(); cx.setLineDash([]); emoji('🏢',x,y,28); cx.restore(); if(near){ cx.fillStyle='#fff'; cx.font='bold 10px Trebuchet MS'; cx.textAlign='center'; cx.fillText('BUILD TOWER',x,y+40); } return; }
  var floors=clamp(st-1,0,5), fw=38, fh=11, baseY=y+22;
  cx.fillStyle='#8a8a8a'; cx.fillRect(x-fw/2-2, baseY, fw+4, 5);
  for(var f=0;f<floors;f++){ var fy=baseY-fh*(f+1); cx.fillStyle=(f%2?'#3a6ea8':'#4a7eb8'); cx.fillRect(x-fw/2,fy,fw,fh-1); cx.fillStyle='#bfe6ff'; for(var w=0;w<3;w++) cx.fillRect(x-fw/2+5+w*12,fy+3,7,5); }
  var topY=baseY-fh*floors;
  if(st>=7){ cx.fillStyle='#2a4a6a'; cx.fillRect(x-fw/2-3, topY-6, fw+6, 6); }
  if(st>=8){ cx.fillStyle='#ffd23f'; rr(x-14,topY-18,28,11,2); cx.fill(); cx.fillStyle='#5a3d00'; cx.font='bold 8px Trebuchet MS'; cx.textAlign='center'; cx.fillText('MO',x,topY-10); }
  if(st>=9){ cx.fillStyle=(Math.sin(t*6)>0?'#ffe27a':'#ff7a1a'); cx.beginPath(); cx.arc(x,topY-22,3,0,7); cx.fill(); }
  if(b.built){ cx.fillStyle='#fff'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.fillText('✓',x+22,y-20); }
  else if(near){ cx.fillStyle='#fff'; cx.font='bold 10px Trebuchet MS'; cx.textAlign='center'; cx.fillText('BUILD ('+(b.stage||0)+'/'+OFFICE_STEPS.length+')',x,y+42); }
}
function drawPiece(b){
  if(b.k==='office'){ drawTower(b); return; }
  if(!b.built){ var near=nearestUnbuilt()===b; cx.save(); cx.globalAlpha=near?0.55+Math.sin(t*6)*0.25:0.3;
    cx.strokeStyle='#fff'; cx.lineWidth=2; cx.setLineDash([6,6]); cx.beginPath(); cx.arc(b.x,b.y,30,0,7); cx.stroke(); cx.setLineDash([]); emoji(b.e,b.x,b.y,28); cx.restore();
    if(near){ cx.fillStyle='#fff'; cx.font='bold 10px Trebuchet MS'; cx.textAlign='center'; cx.fillText('BUILD HERE',b.x,b.y+40); } return; }
  var s=b.pop>0?1+Math.sin((1-b.pop)*Math.PI)*0.25:1; cx.save(); cx.translate(b.x,b.y); cx.scale(s,s);
  if(b.k==='park'){ cx.fillStyle='#3a9a4a'; cx.beginPath(); cx.arc(0,4,26,0,7); cx.fill(); emoji('🌳',0,-2,22); }
  else if(b.k==='court'){ cx.fillStyle='#e0823a'; rr(-26,-14,52,34,4); cx.fill(); cx.strokeStyle='#fff'; cx.lineWidth=1.5; cx.strokeRect(-26,-14,52,34); emoji('🏀',0,3,16); }
  else if(b.k==='roads'){ emoji('🚧',0,0,24); }
  else { cx.fillStyle=b.c; rr(-22,-16,44,36,4); cx.fill(); cx.fillStyle='rgba(0,0,0,.15)'; cx.fillRect(-22,-16,44,7);
    cx.fillStyle='#bfe6ff'; for(var wy=0;wy<2;wy++)for(var wx=0;wx<3;wx++) cx.fillRect(-16+wx*12,-6+wy*12,8,8); emoji(b.e,0,-24,16); }
  cx.restore();
  cx.fillStyle='#fff'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.fillText('✓',b.x+22,b.y-20);
}
function roadsBuilt(){ for(var i=0;i<BUILDS.length;i++) if(BUILDS[i].k==='roads') return BUILDS[i].built; return false; }
function draw(){
  // city ground: green lots with gray street grid
  cx.fillStyle='#7ec04c'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#8a929c'; cx.fillRect(0,H*0.5-16,W,32); cx.fillRect(W/2-16,100,32,H-250);
  cx.strokeStyle='rgba(255,255,255,.5)'; cx.setLineDash([10,10]); cx.lineWidth=2; cx.beginPath(); cx.moveTo(0,H*0.5); cx.lineTo(W,H*0.5); cx.moveTo(W/2,100); cx.lineTo(W/2,H-150); cx.stroke(); cx.setLineDash([]);
  if(roadsBuilt()){ cx.fillStyle='#8a929c'; cx.fillRect(10,96,W-20,10); cx.fillRect(10,H-156,W-20,10); cx.fillRect(10,96,10,H-250); cx.fillRect(W-20,96,10,H-250); }
  if(phase==='clear'){ for(var i=0;i<debris.length;i++){ var dd=debris[i]; if(dd.gone)continue; var near=nearestDebris()===dd; cx.save(); if(near){ cx.globalAlpha=0.7+Math.sin(t*6)*0.3; cx.strokeStyle='#fff'; cx.lineWidth=2; cx.setLineDash([5,5]); cx.beginPath(); cx.arc(dd.x,dd.y,24,0,7); cx.stroke(); cx.setLineDash([]); } emoji(dd.e,dd.x,dd.y,24); cx.restore(); if(near){ cx.fillStyle='#fff'; cx.font='bold 10px Trebuchet MS'; cx.textAlign='center'; cx.fillText('CLEAR',dd.x,dd.y+32); } } }
  else { if(phase==='build'&&!complete){ cx.save(); cx.setLineDash([12,8]); cx.lineWidth=3; cx.strokeStyle='#ffd23f'; cx.strokeRect(24,118,W-48,H-310); cx.setLineDash([]); for(var fp=24;fp<=W-24;fp+=48){ cx.fillStyle='#f0a81a'; cx.fillRect(fp-2,114,4,10); cx.fillRect(fp-2,H-196,4,10); } cx.restore(); }
    for(var i=0;i<BUILDS.length;i++) drawPiece(BUILDS[i]);
    if(phase==='explore'){ var cz=['🧑','👩','🧒','🐕']; for(var ci=0;ci<cz.length;ci++){ var cxp=W*(0.2+ci*0.2)+Math.sin(t*1.3+ci*2)*22, cyp=H*0.5+Math.cos(t*1.1+ci)*18; emoji(cz[ci],cxp,cyp,18); } } }
  drawTruck(mo.x,mo.y);
  pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.5); emoji(p.e,p.x,p.y,18); cx.globalAlpha=1; });
  cx.fillStyle='rgba(10,20,30,.55)'; rr(8,8,W-16,32,10); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 12px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🏙️ Level '+level+'/'+MAXLV,14,30); cx.textAlign='center'; cx.fillStyle='#ffe6b0'; cx.fillText(phase==='clear'?('🧹 clear '+clearLeft()):('🏗️ '+built+'/'+BUILDS.length),W/2,30); cx.textAlign='right'; cx.fillStyle='#ffd23f'; cx.fillText('🪙 '+coins,W-14,30);
  if(msgT>0){ cx.globalAlpha=Math.min(1,msgT*1.4); cx.textAlign='center'; cx.fillStyle='#fff'; cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=4; cx.font='bold '+(complete?18:15)+'px Trebuchet MS'; cx.strokeText(msg,W/2,70); cx.fillText(msg,W/2,70); cx.globalAlpha=1; }
  var v=jv(); cx.fillStyle='rgba(255,255,255,.16)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill(); cx.fillStyle='rgba(0,0,0,.4)';cx.font='bold 10px Trebuchet MS';cx.textAlign='center';cx.fillText('DRIVE',JB.x,JB.y+JB.r+12);
  var complete2=(phase==='build'&&built>=BUILDS.length); var sellMode=(complete2||phase==='explore'); var lbl=phase==='clear'?'CLEAR':(phase==='explore'?'💰OPEN':(complete2?'🚶GO IN':'BUILD')); cx.fillStyle=sellMode?'#39c46a':(aId!==null?'#ffd23f':'rgba(255,210,63,.95)'); cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle=sellMode?'#fff':'#2a1400'; cx.font='bold 15px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(lbl,AB.x,AB.y); cx.textBaseline='alphabetic';
  if(won){ cx.fillStyle='rgba(8,20,20,0.82)'; cx.fillRect(0,0,W,H); cx.textAlign='center';
    cx.fillStyle='#ffd23f'; cx.font='bold 32px Trebuchet MS'; cx.fillText('🎉 YOU WIN! 🎉',W/2,H*0.30);
    cx.fillStyle='#fff'; cx.font='bold 16px Trebuchet MS'; cx.fillText('You built & opened all '+MAXLV+' cities!',W/2,H*0.40);
    cx.fillStyle='#ffe6b0'; cx.font='bold 22px Trebuchet MS'; cx.fillText('🪙 TOTAL: '+coins+' coins',W/2,H*0.49);
    cx.fillStyle='#2ec46a'; rr(PB.x-PB.w/2,PB.y-PB.h/2,PB.w,PB.h,14); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 22px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('▶ PLAY AGAIN',PB.x,PB.y); cx.textBaseline='alphabetic';
    pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.5); emoji(p.e,p.x,p.y,18); cx.globalAlpha=1; }); }
}
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
genDebris();
requestAnimationFrame(frame);
window._CB={ get built(){return built;}, get total(){return BUILDS.length;}, get level(){return level;}, get coins(){return coins;}, get won(){return won;}, get phase(){return phase;}, get clearLeft(){return clearLeft();}, atDebris:function(){ for(var i=0;i<debris.length;i++) if(!debris[i].gone){ mo.x=debris[i].x; mo.y=debris[i].y; return; } }, atBuild:function(i){ mo.x=BUILDS[i].x; mo.y=BUILDS[i].y; }, act:function(){doAction();}, restart:function(){restart();} };
})();
</script>
