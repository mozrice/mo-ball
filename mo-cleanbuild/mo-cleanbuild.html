<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Pool Build with Arff</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#2a2036;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;opacity:.9;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;text-shadow:0 1px 3px #000;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:17px;font-weight:bold;color:#fff;pointer-events:none;text-shadow:0 1px 4px #000;}
  #sub{position:fixed;top:33px;left:0;right:0;text-align:center;font-size:14px;font-weight:bold;color:#ffe08a;pointer-events:none;text-shadow:0 1px 3px #000;}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;text-align:center;padding:20px;}
  #start{background:linear-gradient(#8fd0f0,#c8b0e0 60%,#a07850);}
  #start h1{color:#3a2a4a;font-size:25px;margin:0 0 6px;} #start p{color:#4a3a5a;font-size:15px;margin:4px;max-width:330px;}
  #start .big{font-size:58px;}
  #over{background:#000a;display:none;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;text-shadow:0 2px 0 #b47a1a;} #over p{font-size:17px;margin:3px;}
  #start button,#over button{margin-top:16px;background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
  #start button:active,#over button:active{transform:translateY(3px);box-shadow:0 2px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="hud"></div>
<div id="sub"></div>
<canvas id="c"></canvas>
<div id="start"><div class="big">&#127946;&#128021;</div><h1>MO Pool Build with Arff</h1><p>The backyard is a mess! First tap all the mess to CLEAN it up. Then tap the glowing spots to BUILD an awesome pool for Arff!</p><button id="go">&#9654; PLAY</button></div>
<div id="over"><h1 id="otitle">&#127881; ALL DONE!</h1><p id="omsg"></p><button id="rs">&#9654; Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var MESS=['🍂','🪵','🗑️','🕸️','🥤','🍂','🪨','📦','🍌','🧃','🩴','🪺'];
  var BUILD=[
    {e:'🪜',nx:0.26,ny:0.44},{e:'🛝',nx:0.74,ny:0.40},{e:'🛟',nx:0.50,ny:0.56},
    {e:'⛱️',nx:0.14,ny:0.62},{e:'🌴',nx:0.88,ny:0.58},{e:'🤿',nx:0.40,ny:0.72},
    {e:'🏐',nx:0.60,ny:0.50},
    {e:'🏖️',nx:0.20,ny:0.80},{e:'🏖️',nx:0.34,ny:0.85},
    {e:'🪴',nx:0.66,ny:0.82},{e:'🌺',nx:0.78,ny:0.74},{e:'🌵',nx:0.10,ny:0.44}
  ];
  var phase, messes, builds, cleaned, builtN, running, arff, pops, tt, sparks;
  var HK='moCleanBuildHi';
  function reset(){ phase='clean'; running=true; pops=[]; sparks=[]; tt=0; cleaned=0; builtN=0;
    messes=[]; var N=12; for(var i=0;i<N;i++){ messes.push({e:MESS[i%MESS.length], x:40+Math.random()*(W-80), y:H*0.24+Math.random()*(H*0.60), ph:Math.random()*6.28, gone:false, sz:34}); }
    builds=BUILD.map(function(b){ return {e:b.e, x:b.nx*W, y:b.ny*H, done:false, sz:0}; });
    arff={x:W*0.5,y:H*0.8,tx:W*0.5,ty:H*0.8,bob:0,say:0,sayT:0,face:1};
    document.getElementById('over').style.display='none'; document.getElementById('start').style.display='none';
    updHud(); document.getElementById('sub').textContent='🧹 Tap the mess to clean up the backyard!';
  }
  function updHud(){ if(phase==='clean'){ document.getElementById('hud').innerHTML='🧹 Cleaned '+cleaned+'/'+messes.length; } else { document.getElementById('hud').innerHTML='🏗️ Built '+builtN+'/'+builds.length; } }
  function arffTo(x,y){ arff.tx=x; arff.ty=y; arff.say=1; arff.sayT=50; }
  function pop(x,y,txt,col){ pops.push({x:x,y:y,txt:txt,col:col,life:34}); }
  function spark(x,y,col){ for(var i=0;i<10;i++)sparks.push({x:x,y:y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:20,c:col}); }
  function tap(e){ if(!running)return; var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); var x=t0.clientX-r.left,y=t0.clientY-r.top;
    if(phase==='clean'){ for(var i=0;i<messes.length;i++){ var m=messes[i]; if(!m.gone && Math.hypot(m.x-x,m.y-y)<28){ m.gone=true; cleaned++; arffTo(m.x,m.y); pop(m.x,m.y,'✨ clean!','#8fffa8'); spark(m.x,m.y,'#8fe0ff'); beep(600+cleaned*20,0.06); updHud(); if(cleaned>=messes.length){ toBuild(); } return; } } }
    else if(phase==='build'){ for(var j=0;j<builds.length;j++){ var b=builds[j]; if(!b.done && Math.hypot(b.x-x,b.y-y)<30){ b.done=true; b.sz=1; builtN++; arffTo(b.x,b.y); pop(b.x,b.y,'🔨 built!','#ffd23f'); beep(520+builtN*24,0.07); setTimeout(function(){beep(780,0.06);},70); updHud(); if(builtN>=builds.length){ win(); } return; } } }
  }
  function toBuild(){ phase='build'; updHud(); document.getElementById('sub').textContent='🏊 All clean! Now tap the glowing spots to BUILD the pool!'; beep(900,0.12); }
  function win(){ running=false; document.getElementById('otitle').innerHTML='🎉 ALL DONE! 🎉'; document.getElementById('omsg').textContent='You cleaned up AND built an awesome pool! Arff jumps in! 🐶🏊💦'; document.getElementById('over').style.display='flex'; document.getElementById('sub').textContent='🐶 Arff says thank you!'; if(window.MO_MVP)window.MO_MVP(); }
  cv.addEventListener('touchstart',function(e){ tap(e); e.preventDefault(); },{passive:false});
  cv.addEventListener('mousedown',function(e){ tap(e); });
  function draw(){ tt+=0.05;
    // sky + grassy backyard
    var sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#8fd0f0'); sky.addColorStop(0.28,'#bfe8c0'); sky.addColorStop(1,'#6fb84a'); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    // sun
    ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(W-38,44,18,0,6.29); ctx.fill();
    // pool (only after cleaning, water fills in during build)
    var cx=W*0.5, cy=H*0.56, rw=W*0.32, rh=H*0.15;
    // deck
    ctx.fillStyle='#e0d0a8'; ctx.beginPath(); ctx.ellipse(cx,cy,rw+26,rh+22,0,0,6.29); ctx.fill();
    // water fills as you build
    var fillAmt=(phase==='build')?Math.min(1,0.35+builtN/builds.length*0.65):(phase==='clean'?0.18:1);
    var wg=ctx.createLinearGradient(0,cy-rh,0,cy+rh); wg.addColorStop(0,'#5ec8f0'); wg.addColorStop(1,'#2a8fd0'); ctx.fillStyle=wg; ctx.beginPath(); ctx.ellipse(cx,cy,rw,rh,0,0,6.29); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; for(var rp=0;rp<3;rp++){ ctx.beginPath(); ctx.ellipse(cx,cy+Math.sin(tt+rp)*3,rw*(0.5+rp*0.16),rh*(0.5+rp*0.16),0,0,6.29); ctx.stroke(); }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // build ghosts / builds
    if(phase==='build'||phase==='clean'){
      for(var j=0;j<builds.length;j++){ var b=builds[j];
        if(b.done){ if(b.sz<1)b.sz=Math.min(1,b.sz+0.1); var s=42*b.sz*(b.sz>0.98?1:1.1); ctx.font=s+'px sans-serif'; ctx.fillText(b.e,b.x,b.y); }
        else if(phase==='build'){ var pulse=0.5+0.3*Math.sin(tt*5); ctx.save(); ctx.globalAlpha=pulse; ctx.strokeStyle='#ffd23f'; ctx.setLineDash([6,4]); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(b.x,b.y,26,0,6.29); ctx.stroke(); ctx.globalAlpha=pulse*0.7; ctx.font='30px sans-serif'; ctx.fillText(b.e,b.x,b.y); ctx.restore(); }
      }
    }
    // messes
    if(phase==='clean'){ for(var i=0;i<messes.length;i++){ var m=messes[i]; if(m.gone)continue; var wob=Math.sin(tt*3+m.ph)*3; ctx.font=m.sz+'px sans-serif'; ctx.fillText(m.e,m.x,m.y+wob); } }
    // sparks
    for(var s=sparks.length-1;s>=0;s--){ var sp=sparks[s]; sp.x+=sp.vx; sp.y+=sp.vy; sp.life--; if(sp.life<=0){sparks.splice(s,1);continue;} ctx.globalAlpha=sp.life/20; ctx.fillStyle=sp.c; ctx.fillRect(sp.x,sp.y,3,3); ctx.globalAlpha=1; }
    // Arff the puppy
    if(arff){ arff.x+=(arff.tx-arff.x)*0.08; arff.y+=(arff.ty-arff.y)*0.08; if(arff.tx<arff.x-1)arff.face=-1; else if(arff.tx>arff.x+1)arff.face=1; arff.bob+=0.2;
      var by=Math.abs(Math.sin(arff.bob))*4;
      ctx.save(); ctx.translate(arff.x,arff.y-by); ctx.scale(arff.face,1); ctx.font='40px sans-serif'; ctx.fillText('🐶',0,0); ctx.restore();
      // name tag
      ctx.fillStyle='#fff'; ctx.font='bold 11px Trebuchet MS'; ctx.fillText('Arff',arff.x,arff.y+24);
      if(arff.sayT>0){ arff.sayT--; ctx.fillStyle='#fff'; ctx.strokeStyle='#c8355a'; ctx.lineWidth=2; var bw=54,bh=22,bx=arff.x+18,byy=arff.y-40; ctx.beginPath(); ctx.roundRect?ctx.roundRect(bx,byy,bw,bh,8):ctx.rect(bx,byy,bw,bh); ctx.fill(); ctx.stroke(); ctx.fillStyle='#c8355a'; ctx.font='bold 13px Trebuchet MS'; ctx.fillText('Arff!',bx+bw/2,byy+bh/2); }
    }
    // pops
    for(var p=pops.length-1;p>=0;p--){ var pp=pops[p]; pp.y-=1; pp.life--; if(pp.life<=0){pops.splice(p,1);continue;} ctx.globalAlpha=Math.min(1,pp.life/22); ctx.fillStyle=pp.col; ctx.font='bold 16px Trebuchet MS'; ctx.fillText(pp.txt,pp.x,pp.y); ctx.globalAlpha=1; }
    requestAnimationFrame(draw);
  }
  var ac; function beep(f,d,ty){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.type=ty||'square'; o.connect(g); g.connect(ac.destination); g.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('go').onclick=function(){ reset(); };
  document.getElementById('rs').onclick=function(){ reset(); };
  // init (safe before PLAY)
  phase='clean'; messes=[]; builds=[]; pops=[]; sparks=[]; running=false; arff=null; tt=0; cleaned=0; builtN=0;
  requestAnimationFrame(draw);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
