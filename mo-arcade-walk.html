<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MO Arcade Walk</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;touch-action:none;}
 canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
 #hud{position:fixed;inset:0;pointer-events:none;}
 #title{position:absolute;top:8px;width:100%;text-align:center;font-size:17px;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:0 0 10px #e05aff,0 2px 5px #000;}
 #hint{position:absolute;top:32px;width:100%;text-align:center;font-size:12px;color:#e6c8ff;text-shadow:0 1px 4px #000;padding:0 8px;}
 #playBtn{display:none;pointer-events:auto;position:absolute;bottom:24%;left:50%;transform:translateX(-50%);font:inherit;font-weight:bold;font-size:17px;padding:14px 26px;border-radius:999px;border:none;background:#6bd18a;color:#06280f;box-shadow:0 5px 0 #3a8f56;cursor:pointer;letter-spacing:1px;}
 #playBtn:active{transform:translate(-50%,3px);}
 #gf{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;z-index:20;background:#0c0620;}
 #searchBtn{position:fixed;top:8px;right:10px;z-index:15;pointer-events:auto;font:inherit;font-weight:bold;font-size:13px;padding:8px 14px;border-radius:999px;border:none;background:#7fd0ff;color:#08303f;box-shadow:0 4px 0 #3f7f9f;cursor:pointer;}
 #searchOv{display:none;position:fixed;inset:0;z-index:30;background:rgba(8,4,22,.95);flex-direction:column;align-items:center;padding:18px;}
 #searchInput{width:min(92vw,420px);font:inherit;font-size:18px;padding:12px 16px;border-radius:14px;border:2px solid #7fd0ff;background:#1a1030;color:#fff;outline:none;}
 #searchList{width:min(92vw,420px);flex:1;overflow:auto;margin-top:10px;}
 .sr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:16px;font-weight:bold;padding:11px 12px;border:none;border-bottom:1px solid rgba(255,255,255,.12);background:transparent;color:#fff;cursor:pointer;}
 .sr .se{font-size:24px;} .sr:active{background:rgba(255,255,255,.1);}
 #searchClose{margin-top:8px;font:inherit;font-weight:bold;padding:9px 18px;border-radius:999px;border:none;background:#e0785a;color:#fff;box-shadow:0 4px 0 #a84e34;cursor:pointer;}
 #exitBtn{display:none;position:fixed;top:8px;left:10px;z-index:25;font:inherit;font-weight:bold;font-size:13px;padding:8px 14px;border-radius:999px;border:none;background:#e0785a;color:#fff;box-shadow:0 4px 0 #a84e34;cursor:pointer;text-transform:uppercase;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
 <div id="title">MO Arcade</div>
 <div id="hint">Walk to a machine and tap PLAY!</div>
 <button id="playBtn">▶ Play</button>
</div>
<iframe id="gf" src="about:blank"></iframe>
<button id="exitBtn">◀ Arcade</button>
<button id="searchBtn">🔎 Search</button>
<div id="searchOv"><input id="searchInput" placeholder="Search games..." autocomplete="off"><div id="searchList"></div><button id="searchClose">Close</button></div>
<script>
var cv=document.getElementById('cv'), cx=cv.getContext('2d'), W=0,H=0;
function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; } window.addEventListener('resize',resize); resize();
var playBtn=document.getElementById('playBtn'), hint=document.getElementById('hint'), gf=document.getElementById('gf'), exitBtn=document.getElementById('exitBtn');


// ===== world (big room, camera follows Mo) =====
var Wld=900, Hld=2680;
var COLR=['#ff8b2c','#6bd18a','#e0568a','#7fd0ff','#ffd23f','#c79cff'];
var LIST=[
 ['Arff Hoops','🏀','mo-arff-arcade.html#baller'],['Arff Kick','⚽','mo-arff-arcade.html#kick'],['Bone Claw','🦴','mo-arff-arcade.html#claw'],
 ['Skee-Ball','🎳','mo-arff-arcade.html#skee'],['Tap-a-Paw','🐾','mo-arff-arcade.html#tap'],['Prize Wheel','🎡','mo-arff-arcade.html#wheel'],
 ['Feed Arff','🍖','mo-arff-arcade.html#feed'],['Bubble Pop','🫧','mo-arff-arcade.html#bubble'],['Whack Squirrel','🐿️','mo-arff-arcade.html#whack'],
 ['Memory Match','🃏','mo-arff-arcade.html#memory'],['Copy Paw','🎵','mo-arff-arcade.html#copy'],['Bone Sling','🎯','mo-arff-arcade.html#sling'],
 ['Bone Stack','🦴','mo-arff-arcade.html#stack'],['Balloon Darts','🎈','mo-arff-arcade.html#darts'],['Fast Paws','⚡','mo-arff-arcade.html#reaction'],
 ['MO Hotel','🏨','mo-hotel.html',1],['MO Subway','🚇','mo-subway.html',1],['MO Decorate','🛋️','mo-decorate.html',1],['MO Playhouse','🏠','mo-playhouse.html',1],['Arff School','🎓','mo-arff-school.html',1],
 ['MO Fix & Flip','🔨','mo-fix-flip-3d.html'],['MO City','🏙️','mo-city-3d.html'],['MO House','🏡','mo-house-3d.html'],['MO Driving','🚗','mo-driving.html'],['MO Move','📦','mo-move.html'],
 ['MO Party','🎉','mo-party.html'],['MO Pig Homes','🐷','mo-pig-homes.html'],['MO Stay','🛏️','mo-stay.html'],['MO Wedding','💒','mo-wedding.html'],['MO Rover','🐕','mo-rover.html']
];
var COLS=[180,450,720]; var ROWS=[]; for(var _r=0;_r<10;_r++)ROWS.push(190+_r*250);
var CABS=LIST.map(function(g,i){ return {name:g[0],e:g[1],url:g[2],x:COLS[i%3],y:ROWS[(i/3)|0],col:COLR[i%6],big:!!g[3]}; });
var mo={x:450,y:2560}, arff={x:410,y:2580};
var joy={active:false,cx:0,cy:0,dx:0,dy:0,id:-1};
var nearCab=null, camX=0, camY=0;

function pos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',function(e){ var p=pos(e); if(p.y>H*0.45){ joy.active=true; joy.cx=p.x; joy.cy=p.y; joy.dx=0; joy.dy=0; joy.id=e.pointerId; } });
cv.addEventListener('pointermove',function(e){ if(joy.active&&e.pointerId===joy.id){ var p=pos(e); joy.dx=p.x-joy.cx; joy.dy=p.y-joy.cy; } });
cv.addEventListener('pointerup',function(e){ if(e.pointerId===joy.id){ joy.active=false; joy.dx=joy.dy=0; } });
cv.addEventListener('pointercancel',function(){ joy.active=false; joy.dx=joy.dy=0; });

playBtn.onclick=function(){ if(!nearCab)return; openGame(nearCab); };
exitBtn.onclick=function(){ gf.style.display='none'; exitBtn.style.display='none'; gf.src='about:blank'; };
function openGame(cab){ gf.src=cab.url; gf.style.display='block'; exitBtn.style.display='block'; }
// ===== search =====
var searchBtn=document.getElementById('searchBtn'), searchOv=document.getElementById('searchOv'), searchInput=document.getElementById('searchInput'), searchList=document.getElementById('searchList');
function buildSearch(q){ q=(q||'').toLowerCase(); searchList.innerHTML=''; CABS.forEach(function(c){ if(q&&c.name.toLowerCase().indexOf(q)<0)return; var b=document.createElement('button'); b.className='sr'; b.innerHTML='<span class="se">'+c.e+'</span><span>'+c.name+(c.big?' ⭐':'')+'</span>'; b.onclick=function(){ searchOv.style.display='none'; mo.x=c.x; mo.y=Math.min(Hld-70,c.y+150); openGame(c); }; searchList.appendChild(b); }); }
searchBtn.onclick=function(){ searchOv.style.display='flex'; searchInput.value=''; buildSearch(''); searchInput.focus(); };
searchInput.addEventListener('input',function(){ buildSearch(searchInput.value); });
document.getElementById('searchClose').onclick=function(){ searchOv.style.display='none'; };

function update(){
 if(joy.active){ var d=Math.hypot(joy.dx,joy.dy); if(d>8){ var sp=Math.min(1,d/60)*6; mo.x=Math.max(60,Math.min(Wld-60,mo.x+joy.dx/d*sp)); mo.y=Math.max(120,Math.min(Hld-70,mo.y+joy.dy/d*sp)); } }
 arff.x+=((mo.x-42)-arff.x)*0.12; arff.y+=((mo.y+20)-arff.y)*0.12;
 camX=Math.max(0,Math.min(Math.max(0,Wld-W), mo.x-W/2)); camY=Math.max(0,Math.min(Math.max(0,Hld-H), mo.y-H/2));
 nearCab=null; var best=1e9; CABS.forEach(function(c){ var dd=Math.hypot(c.x-mo.x,c.y-mo.y); if(dd<120&&dd<best){best=dd;nearCab=c;} });
 playBtn.style.display=nearCab?'block':'none'; if(nearCab)playBtn.textContent='▶ Play '+nearCab.name;
 hint.textContent=nearCab?('Tap PLAY for '+nearCab.name+'!'):'Walk around — step up to a machine!';
}
function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function draw(){ cx.fillStyle='#160a2e'; cx.fillRect(0,0,W,H);
 cx.save(); cx.translate(-camX,-camY);
 // neon grid floor
 cx.strokeStyle='rgba(160,60,255,.16)'; cx.lineWidth=1; for(var gx=0;gx<=Wld;gx+=45){ cx.beginPath(); cx.moveTo(gx,0); cx.lineTo(gx,Hld); cx.stroke(); } for(var gy=0;gy<=Hld;gy+=45){ cx.beginPath(); cx.moveTo(0,gy); cx.lineTo(Wld,gy); cx.stroke(); }
 // cabinets
 CABS.forEach(function(c){ var w=88,h=112; cx.save(); cx.translate(c.x,c.y);
  cx.fillStyle=c.col; roundRect(-w/2,-h/2,w,h,12); cx.fill();
  cx.fillStyle='#0d0a16'; roundRect(-w/2+9,-h/2+12,w-18,h*0.4,7); cx.fill();
  cx.font='30px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(c.e,0,-h*0.16); cx.textBaseline='alphabetic';
  cx.fillStyle='#2a1c40'; roundRect(-w/2+12,h*0.06,w-24,h*0.3,6); cx.fill();
  cx.fillStyle='rgba(255,255,255,.9)'; cx.font='bold 12px Trebuchet MS'; cx.fillText(c.name,0,h/2+16);
  if(c.big){ cx.fillStyle='#ffd23f'; cx.font='14px serif'; cx.textAlign='center'; cx.fillText('\u2b50',0,-h/2-8); }
  if(nearCab===c){ cx.strokeStyle='#ffd23f'; cx.lineWidth=5; roundRect(-w/2-5,-h/2-5,w+10,h+10,14); cx.stroke(); }
  cx.restore(); });
 // Arff (fluffy white Maltipoo)
 var ax=arff.x, ay=arff.y; cx.fillStyle='#ffffff'; [[0,0,15],[-10,-3,9],[10,-3,9],[-7,8,9],[7,8,9],[0,-10,9]].forEach(function(o){ cx.beginPath(); cx.arc(ax+o[0],ay+o[1],o[2],0,7); cx.fill(); });
 cx.fillStyle='#f1f4f8'; cx.beginPath(); cx.ellipse(ax-14,ay-1,5,10,-0.3,0,7); cx.ellipse(ax+14,ay-1,5,10,0.3,0,7); cx.fill();
 cx.fillStyle='#20263a'; cx.beginPath(); cx.arc(ax-4,ay-2,2.2,0,7); cx.arc(ax+4,ay-2,2.2,0,7); cx.fill(); cx.fillStyle='#2a2a2a'; cx.beginPath(); cx.arc(ax,ay+3,2.8,0,7); cx.fill();
 cx.strokeStyle='#ff7ab0'; cx.lineWidth=4; cx.beginPath(); cx.arc(ax,ay+7,11,0.2,Math.PI-0.2); cx.stroke();
 // Mo (brown skin, orange shirt, red headband)
 var mx=mo.x,my=mo.y; cx.fillStyle='#ff8c1a'; cx.beginPath(); cx.arc(mx,my,20,0,7); cx.fill(); cx.fillStyle='#8a5a34'; cx.beginPath(); cx.arc(mx,my-15,13,0,7); cx.fill(); cx.fillStyle='#2a1808'; cx.beginPath(); cx.arc(mx,my-19,13,Math.PI,0); cx.fill(); cx.strokeStyle='#e23b3b'; cx.lineWidth=4; cx.beginPath(); cx.arc(mx,my-16,13,Math.PI,0); cx.stroke(); cx.fillStyle='#20263a'; cx.beginPath(); cx.arc(mx-4,my-14,2.2,0,7); cx.arc(mx+4,my-14,2.2,0,7); cx.fill();
 cx.restore();
 // joystick (screen-fixed)
 if(joy.active){ cx.strokeStyle='rgba(255,255,255,.3)'; cx.lineWidth=3; cx.beginPath(); cx.arc(joy.cx,joy.cy,46,0,7); cx.stroke(); var kx=joy.cx+Math.max(-40,Math.min(40,joy.dx)), ky=joy.cy+Math.max(-40,Math.min(40,joy.dy)); cx.fillStyle='rgba(127,208,255,.85)'; cx.beginPath(); cx.arc(kx,ky,22,0,7); cx.fill(); }
 else { cx.fillStyle='rgba(255,255,255,.08)'; cx.beginPath(); cx.arc(62,H-72,42,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.45)'; cx.font='11px Trebuchet MS'; cx.textAlign='center'; cx.fillText('WALK',62,H-68); }
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
