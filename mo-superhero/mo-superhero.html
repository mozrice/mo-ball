<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Hero</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#5a7abf;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(30,40,90,.6);}
  #obox{background:#fff;color:#222;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#e2342f;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#e2342f;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="over"><div id="obox"><h1>🦸 MO Hero</h1><div id="omsg">Drag Super MO to fly!<br>Catch falling people before they land!</div><button id="go">SAVE THE CITY</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  var playing=false, score=0, lives=3, best=+(localStorage.getItem('moHeroBest')||0);
  var hx=0,hy=0,tx=0,ty=0, people=[], t=0;
  function reset(){ hx=W/2; hy=H*0.5; tx=W/2; ty=H*0.5; people=[]; score=0; lives=3; t=0; }
  function ac(){ try{ return ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function loop(){ t++;
    var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#7a9ad8'); g.addColorStop(1,'#cfe0ff'); x.fillStyle=g; x.fillRect(0,0,W,H);
    // city skyline
    for(var b=0;b<9;b++){ var bh=H*(0.2+((b*53)%40)/100*0.28); x.fillStyle=['#4a5a7a','#5a6a8a','#3a4a6a'][b%3]; x.fillRect(b*W*0.12,H-bh,W*0.11,bh); for(var w=0;w<5;w++){ x.fillStyle=(b+w)%2?'#ffe07a':'#3a4a6a'; x.fillRect(b*W*0.12+6,H-bh+10+w*16,5,7); } }
    x.fillStyle='#3a4a6a'; x.fillRect(0,H-16,W,16);
    hx+=(tx-hx)*0.22; hy+=(ty-hy)*0.22;
    if(playing){ if(t%Math.max(30,64-Math.floor(score/20))===0)people.push({x:40+Math.random()*(W-80),y:-20,v:2+Math.random()*2+score*0.006,saved:false,sy:0}); }
    for(var i=people.length-1;i>=0;i--){ var p=people[i];
      if(p.saved){ p.sy-=8; p.x+=(W/2-p.x)*0.05; if(p.sy<-H){ people.splice(i,1); continue; } drawPerson(p.x,hy+p.sy+30,true); continue; }
      p.y+=p.v;
      if(Math.hypot(p.x-hx,p.y-hy)<40){ score+=5; beep(1100); p.saved=true; p.sy=0; continue; }
      if(p.y>H-24){ lives--; beep(180); people.splice(i,1); if(lives<=0){ playing=false; over(); } continue; }
      drawPerson(p.x,p.y,false);
      // parachute-ish flail
    }
    hero(hx,hy);
    x.fillStyle='#fff'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='left'; x.fillText('🦸 '+score, 14, 40);
    x.textAlign='center'; x.fillText('❤️'.repeat(Math.max(0,lives)), W/2, 40);
    x.textAlign='right'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('Best '+best, W-14, 36);
    requestAnimationFrame(loop);
  }
  function drawPerson(px,py,safe){ x.save(); x.translate(px,py); x.fillStyle='#f4c9a0'; x.beginPath(); x.arc(0,-8,7,0,7); x.fill(); x.fillStyle=safe?'#7bcf7b':'#e0803a'; rr(-6,-2,12,16,4); x.fill(); x.strokeStyle=safe?'#7bcf7b':'#e0803a'; x.lineWidth=3; x.lineCap='round'; var w=safe?-10:10; x.beginPath(); x.moveTo(-5,2); x.lineTo(-9,-6-w*0.4); x.moveTo(5,2); x.lineTo(9,-6-w*0.4); x.stroke(); x.restore(); }
  function hero(cx,cy){ x.save(); x.translate(cx,cy);
    x.fillStyle='#e2342f'; x.beginPath(); x.moveTo(-6,-6); x.quadraticCurveTo(-30,0,-24,20); x.quadraticCurveTo(-10,10,-6,10); x.fill(); // cape
    x.fillStyle='#2a6fd0'; rr(-13,-8,26,30,8); x.fill(); // body
    x.fillStyle='#e2342f'; x.beginPath(); x.moveTo(0,-4); x.lineTo(6,6); x.lineTo(0,14); x.lineTo(-6,6); x.fill(); // chest emblem
    x.fillStyle='#f4c9a0'; x.beginPath(); x.arc(0,-18,11,0,7); x.fill(); // head
    x.fillStyle='#3a2a1a'; x.beginPath(); x.arc(0,-22,10,Math.PI,0); x.fill();
    x.strokeStyle='#2a6fd0'; x.lineWidth=5; x.lineCap='round'; x.beginPath(); x.moveTo(10,-2); x.lineTo(24,-14); x.stroke(); // arm forward
    x.fillStyle='#fff'; x.font='900 9px Trebuchet MS'; x.textAlign='center'; x.fillText('MO',0,4); x.restore(); }
  function rr(a,b,c,d,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+c,b,a+c,b+d,r); x.arcTo(a+c,b+d,a,b+d,r); x.arcTo(a,b+d,a,b,r); x.arcTo(a,b,a+c,b,r); x.closePath(); }
  function over(){ beep(160,0.3); if(score>best){ best=score; try{localStorage.setItem('moHeroBest',score);}catch(e){} }
    document.getElementById('omsg').innerHTML='You saved <b>'+score+'</b>!<br>Best: '+best; document.getElementById('go').textContent='SAVE AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  var down=false; function set(cx,cy){ tx=Math.max(20,Math.min(W-20,cx)); ty=Math.max(20,Math.min(H-40,cy)); }
  cv.addEventListener('pointerdown',function(e){ down=true; set(e.clientX,e.clientY); }); cv.addEventListener('pointermove',function(e){ if(down)set(e.clientX,e.clientY); }); addEventListener('pointerup',function(){ down=false; });
  document.getElementById('over').style.display='flex'; loop();
})();
</script>
</body></html>
