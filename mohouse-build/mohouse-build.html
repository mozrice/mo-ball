<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mo House Designer</title>
<meta name="theme-color" content="#1b2f3c">
<style>
  html, body { margin: 0; height: 100%; background: #12222c;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; color: #eaf2f7; }
  #wrap { max-width: 1200px; margin: 0 auto; padding: 8px 10px 24px; text-align: center; }
  h1 { margin: 8px 0 2px; font-size: 25px; letter-spacing: 3px; color: #ffcf5c; text-transform: uppercase; }
  #hint { font-size: 13px; letter-spacing: 1px; color: #9fc0d0; margin-bottom: 6px; min-height: 16px; }
  #coins { font-size: 17px; font-weight: bold; letter-spacing: 1px; color: #ffcf5c; margin: 2px 0 2px; }
  #value { font-size: 13px; font-weight: bold; letter-spacing: 1px; color: #9fdcc0; margin-bottom: 6px; min-height: 15px; }
  canvas { width: min(98vw, 1120px); height: auto; border-radius: 12px;
    box-shadow: 0 12px 34px rgba(0,0,0,.5); cursor: crosshair; touch-action: none; background: #bfe6f5; }
  #views, #rooms { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 10px 0 4px; }
  #rooms { margin: 4px 0; }
  .vbtn, .rtab { font: inherit; font-size: 14px; font-weight: bold; letter-spacing: 1px; padding: 8px 15px;
    border-radius: 999px; border: 2px solid #2f4a5c; background: #1b2f3c; color: #dfeaf1; cursor: pointer; }
  .rtab { font-size: 13px; padding: 6px 13px; }
  .vbtn.sel, .rtab.sel { background: #274155; border-color: #ffcf5c; color: #ffcf5c; }
  .petin { font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 999px; border: 2px solid #2f4a5c; background: #10202a; color: #eaf2f7; width: 140px; }
  .petin::placeholder { color: #6f8a9a; }
  .baby { font-size: 13px; color: #cfe6f2; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .baby input { width: 16px; height: 16px; }
  .hidden { display: none !important; }
  #shop { position: fixed; inset: 0; background: rgba(6,14,20,.78); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #shopBox { background: #16303f; border: 2px solid #2f4a5c; border-radius: 16px; max-width: 860px; width: 100%; max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #shopHead { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #2f4a5c; color: #ffcf5c; font-weight: bold; font-size: 18px; letter-spacing: 1px; }
  #shopClose { font: inherit; font-size: 18px; font-weight: bold; background: #ef8f7a; color: #3a0c00; border: none; border-radius: 999px; width: 34px; height: 34px; cursor: pointer; }
  #shopGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding: 16px; overflow-y: auto; }
  .scard { background: #223b4c; border: 2px solid #2f4a5c; border-radius: 12px; padding: 8px 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #eaf2f7; font: inherit; }
  .scard:hover { border-color: #7fb2c9; }
  .scard.sel { border-color: #ffcf5c; box-shadow: 0 0 0 2px #ffcf5c inset; }
  .sthumb { width: 54px; height: 54px; border-radius: 8px; }
  .sname { font-size: 12px; font-weight: bold; }
  .sprice { font-size: 12px; color: #ffcf5c; }
  .stylabel { color: #9fc0d0; font-size: 13px; letter-spacing: 1px; margin-left: 8px; }
  .sbtn { font: inherit; font-size: 13px; font-weight: bold; padding: 7px 13px; border-radius: 999px;
    border: 2px solid #3a5a72; background: #223b4c; color: #cfe6f2; cursor: pointer; }
  .sbtn:active { transform: translateY(2px); }
  #palette { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 8px 0; }
  .tool { display: flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
    border: 2px solid #2f4a5c; background: #1b2f3c; color: #dfeaf1; font: inherit; font-size: 13px;
    font-weight: bold; letter-spacing: .3px; cursor: pointer; }
  .tool .sw { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(0,0,0,.3); }
  .tool .pr { color: #ffcf5c; font-size: 12px; }
  .tool.sel { border-color: #ffcf5c; background: #274155; box-shadow: 0 0 0 2px #ffcf5c inset; }
  #colors { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; min-height: 4px; margin: 2px 0 4px; }
  .cgroup { display: flex; align-items: center; gap: 6px; }
  .clabel { color: #9fc0d0; font-size: 13px; font-weight: bold; letter-spacing: .5px; }
  .cswatch { width: 26px; height: 26px; border-radius: 7px; border: 2px solid #2f4a5c; cursor: pointer; padding: 0; }
  .cswatch.sel { border-color: #ffcf5c; box-shadow: 0 0 0 2px #ffcf5c; }
  #actions { display: flex; gap: 9px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 14px; font-weight: bold; letter-spacing: 1px; padding: 9px 18px;
    border-radius: 999px; border: none; cursor: pointer; }
  #sellBtn { background: #ffcf5c; color: #3a2a00; box-shadow: 0 4px 0 #c79a2a; }
  #restartBtn { background: #c9b6ff; color: #1c0d3a; box-shadow: 0 4px 0 #8f77cc; }
  #newBtn { background: #8fd3ff; color: #06283a; box-shadow: 0 4px 0 #4f97c7; }
  #fillBtn { background: #f6c945; color: #3a2a00; box-shadow: 0 4px 0 #b8922a; }
  #saveBtn { background: #6bd18a; color: #06280f; box-shadow: 0 4px 0 #3a8f56; }
  #clearBtn { background: #ef8f7a; color: #3a0c00; box-shadow: 0 4px 0 #b85a49; }
  .btn:active { transform: translateY(3px); }
  #msg { height: 20px; font-size: 15px; font-weight: bold; letter-spacing: 1px; color: #6bd18a; margin-top: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🏠 Mo House Designer</h1>
  <div id="hint">Pick a block, then tap or drag to build your house and yard.</div>
  <div id="coins">🪙 Coins: 0</div>
  <div id="value"></div>
  <canvas id="c" width="1040" height="640"></canvas>

  <div id="views">
    <button id="outBtn" class="vbtn sel">🏠 Outside</button>
    <button id="inBtn" class="vbtn">🛋️ Inside</button>
    <button id="tourBtn" class="vbtn">🎥 Tour</button>
    <button id="dayBtn" class="vbtn">🌙 Night</button>
    <button id="shopBtn" class="vbtn">🛒 Shop</button>
    <button id="photoBtn" class="vbtn">📸 Photo</button>
    <input id="petName" class="petin" maxlength="12" placeholder="🏷️ name a pet">
    <label class="baby"><input type="checkbox" id="babyChk"> 🍼 baby</label>
    <span class="stylabel">Styles:</span>
    <button class="sbtn" data-style="cottage">🏡 Cottage</button>
    <button class="sbtn" data-style="modern">🏢 Modern</button>
    <button class="sbtn" data-style="mansion">🏰 Mansion</button>
    <button class="sbtn" data-style="cabin">🛖 Cabin</button>
  </div>
  <div id="rooms"></div>

  <div id="palette"></div>
  <div id="colors"></div>
  <div id="actions">
    <button id="sellBtn" class="btn">💰 Sell House</button>
    <button id="restartBtn" class="btn">🔄 Restart</button>
    <button id="newBtn" class="btn">New Lot</button>
    <button id="fillBtn" class="btn">Fill Grass</button>
    <button id="saveBtn" class="btn">Save</button>
    <button id="clearBtn" class="btn">Clear</button>
  </div>
  <div id="msg"></div>
</div>

<div id="shop" class="hidden">
  <div id="shopBox">
    <div id="shopHead"><span>🛒 Shop — tap something to pick it</span><button id="shopClose">✕</button></div>
    <div id="shopGrid"></div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById("c");
  let ctx = canvas.getContext("2d");
  const COLS = 26, ROWS = 16, S = 40;              // 1040 x 640
  const stat = document.createElement("canvas"); stat.width = 1040; stat.height = 640;
  const sctx = stat.getContext("2d");
  let night = false, frameCount = 0;
  const petList = [];
  canvas.width = COLS * S; canvas.height = ROWS * S;
  const FLOOR_ROW = 11;                             // interior floor starts here

  // ---- outside tools ----
  const TOOLS_OUT = [
    { id: "brick",  name: "Brick",   col: "#a54a2a" },
    { id: "wood",   name: "Wood",    col: "#b3712f" },
    { id: "white",  name: "Siding",  col: "#f4f1ea" },
    { id: "roof",   name: "Roof",    col: "#48555f" },
    { id: "roof2",  name: "Peak",    col: "#48555f" },
    { id: "window", name: "Window",  col: "#8fc3e6" },
    { id: "door",   name: "Door",    col: "#7a4b25" },
    { id: "garage", name: "Garage",  col: "#d3d8dd" },
    { id: "grass",  name: "Grass",   col: "#4bbf5a" },
    { id: "tree",   name: "Tree",    col: "#2e8b40" },
    { id: "hedge",  name: "Hedge",   col: "#3a9e4e" },
    { id: "flower", name: "Flower",  col: "#ff6fae" },
    { id: "fence",  name: "Fence",   col: "#f2f2f2" },
    { id: "mailbox",name: "Mailbox", col: "#4a6b8a" },
    { id: "lamp",   name: "Lamp",    col: "#ffd257" },
    { id: "car",    name: "Car",     col: "#d23b3b" },
    { id: "drive",  name: "Driveway",col: "#55606a" },
    { id: "pool",   name: "🏊 Pool",  col: "#38b6ff" },
    { id: "hottub", name: "♨️ Hot Tub",col: "#8a5a2f" },
    { id: "water",  name: "Water",   col: "#2fa3e0" },
    { id: "stone",  name: "Path",    col: "#9aa2aa" },
    { id: "sun",    name: "Sun",     col: "#ffd93b" },
    { id: "cloud",  name: "Cloud",   col: "#ffffff" },
    { id: "erase",  name: "Erase",   col: "#12222c" }
  ];
  // ---- inside tools (furniture shop, each has a price) ----
  const TOOLS_IN = [
    { id: "rug",     name: "Rug",      col: "#c85b6b", price: 4 },
    { id: "sofa",    name: "Sofa",     col: "#7a8b99", price: 18 },
    { id: "tv",      name: "TV",       col: "#222a30", price: 22 },
    { id: "fireplace",name:"Fireplace",col: "#a54a2a", price: 24 },
    { id: "piano",   name: "Piano",    col: "#2a2f34", price: 30 },
    { id: "pooltable",name:"Pool Table",col: "#1f7a3f", price: 28 },
    { id: "gaming",  name: "Gaming",   col: "#3fa7ff", price: 30 },
    { id: "aquarium",name: "Fish Tank",col: "#50b4e6", price: 20 },
    { id: "table",   name: "Table",    col: "#b3712f", price: 10 },
    { id: "chair",   name: "Chair",    col: "#c88a4a", price: 6 },
    { id: "bookshelf",name:"Bookshelf",col: "#7a4b25", price: 14 },
    { id: "bed",     name: "Bed",      col: "#6fa8dc", price: 20 },
    { id: "bunkbed", name: "Bunk Bed", col: "#6fa8dc", price: 26 },
    { id: "dresser", name: "Dresser",  col: "#8a5a2f", price: 14 },
    { id: "lamp2",   name: "Lamp",     col: "#ffd257", price: 6 },
    { id: "fridge",  name: "Fridge",   col: "#e8edf2", price: 16 },
    { id: "stove",   name: "Stove",    col: "#dfe3e7", price: 16 },
    { id: "island",  name: "Island",   col: "#e8edf2", price: 18 },
    { id: "counter", name: "Counter",  col: "#e8edf2", price: 10 },
    { id: "sink",    name: "Sink",     col: "#9fb0bd", price: 8 },
    { id: "toilet",  name: "Toilet",   col: "#ffffff", price: 10 },
    { id: "bath",    name: "Bath",     col: "#dfe9f2", price: 16 },
    { id: "shower",  name: "Shower",   col: "#bee6f5", price: 18 },
    { id: "plant",   name: "Plant",    col: "#3a9e4e", price: 5 },
    { id: "window",  name: "Window",   col: "#8fc3e6", price: 8 },
    { id: "door",    name: "Door",     col: "#7a4b25", price: 6 },
    { id: "move",    name: "✋ Move",   col: "#ffd257" },
    { id: "erase",   name: "Sell back", col: "#efe7db" }
  ];
  // ---- pets (can go inside or out in the yard) ----
  const PETS = [
    { id: "dog",     name: "🐕 Dog",    col: "#b5793f", price: 12 },
    { id: "cat",     name: "🐈 Cat",    col: "#9aa0a6", price: 12 },
    { id: "puppy",   name: "🐶 Puppy",  col: "#d8a15a", price: 10 },
    { id: "rabbit",  name: "🐰 Rabbit", col: "#eaeaea", price: 10 },
    { id: "bird",    name: "🐦 Bird",   col: "#f6c945", price: 8 },
    { id: "hamster", name: "🐹 Hamster",col: "#e0b070", price: 8 },
    { id: "turtle",  name: "🐢 Turtle", col: "#3a9e4e", price: 10 },
    { id: "snake",   name: "🐍 Snake",  col: "#5ab552", price: 10 },
    { id: "parrot",  name: "🦜 Parrot", col: "#d23b3b", price: 14 },
    { id: "frog",    name: "🐸 Frog",   col: "#4bbf5a", price: 8 },
    { id: "fishpet", name: "🐟 Fish",   col: "#8fd3ff", price: 10 },
    { id: "horse",   name: "🐴 Horse",  col: "#7a4b25", price: 20 }
  ];
  PETS.forEach(function (pt) { TOOLS_OUT.splice(TOOLS_OUT.length - 1, 0, pt); });   // before Erase
  PETS.forEach(function (pt) { TOOLS_IN.splice(TOOLS_IN.length - 2, 0, pt); });     // before Move / Sell back
  TOOLS_OUT.splice(TOOLS_OUT.length - 1, 0, { id: "play", name: "🖐️ Play", col: "#ffd257" });
  TOOLS_IN.splice(TOOLS_IN.length - 2, 0, { id: "play", name: "🖐️ Play", col: "#ffd257" });
  TOOLS_OUT.splice(TOOLS_OUT.length - 1, 0, { id: "feed", name: "🍖 Feed", col: "#d2691e" });
  TOOLS_IN.splice(TOOLS_IN.length - 2, 0, { id: "feed", name: "🍖 Feed", col: "#d2691e" });
  const PET_IDS = {}; PETS.forEach(function (p) { PET_IDS[p.id] = 1; });
  const PRICE = {}; TOOLS_IN.forEach(function (t) { if (t.price) PRICE[t.id] = t.price; });
  let tool = "white", view = "out";

  // ---- colors / materials ----
  const GROUP = { white: "wall", roof: "roof", roof2: "roof", door: "door" };
  const SWATCHES = {
    wall: ["#f4f1ea", "#b8cfe0", "#cfd4d8", "#cfe0c4", "#f3e6b0", "#f0d0dc", "#d8b48c"],
    roof: ["#48555f", "#b5423a", "#7a5230", "#3f6f9e", "#3f7a4e", "#2a2f34"],
    door: ["#7a4b25", "#b5423a", "#3f6f9e", "#2a2f34", "#e8e8e8", "#2f8f43"]
  };
  let curColor = { wall: "#f4f1ea", roof: "#48555f", door: "#7a4b25" };
  const ROOM_WALLS = ["#efe7db", "#e2ecf2", "#e9dfe9", "#dfeae0", "#f2e6cf", "#eadfe0"];
  const ROOM_FLOORS = ["#b9905a", "#caa06a", "#9c6b3f", "#c9cdd2", "#8a8f96", "#d8c9a8"];
  function baseId(v) { if (!v) return v; const i = v.indexOf("|"); return i > 0 ? v.slice(0, i) : v; }

  // ---- grids ----
  function blankGrid() { const g = []; for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill("")); return g; }
  function nonEmpty(g) { return g.some(function (row) { return row.some(function (c) { return c; }); }); }
  const ROOM_KEYS = ["living", "bedroom", "kitchen", "bathroom"];
  const ROOM_NAMES = { living: "🛋️ Living", bedroom: "🛏️ Bedroom", kitchen: "🍳 Kitchen", bathroom: "🛁 Bathroom" };
  let gridOut = blankGrid();
  let rooms = { living: blankGrid(), bedroom: blankGrid(), kitchen: blankGrid(), bathroom: blankGrid() };
  let roomColors = {
    living:   { wall: "#efe7db", floor: "#b9905a" },
    bedroom:  { wall: "#e2ecf2", floor: "#caa06a" },
    kitchen:  { wall: "#eef0e6", floor: "#c9cdd2" },
    bathroom: { wall: "#dfeaee", floor: "#c9cdd2" }
  };
  let roomKey = "living", grid = gridOut;

  // ---- house styles (wide, two-story) ----
  function ground(g) { for (let c = 0; c < COLS; c++) { g[15][c] = "grass"; g[14][c] = "grass"; } }
  function buildCottage(g) {
    ground(g);
    g[1][3] = "sun"; g[1][20] = "cloud"; g[1][21] = "cloud"; g[2][7] = "cloud";
    for (let r = 7; r <= 12; r++) for (let c = 9; c <= 17; c++) g[r][c] = "white";   // two floors
    for (let c = 9; c <= 17; c++) g[13][c] = "brick";                                // foundation
    for (let c = 9; c <= 17; c++) g[6][c] = "roof";
    for (let c = 10; c <= 16; c++) g[5][c] = "roof";
    g[4][12] = "roof2"; g[4][13] = "roof2"; g[4][14] = "roof2";
    g[5][17] = "brick"; g[4][17] = "brick";                                          // chimney
    [10, 12, 14, 16].forEach(function (cc) { g[8][cc] = "window"; });                // upper floor
    g[11][10] = "window"; g[11][16] = "window";                                      // lower floor
    g[11][13] = "door"; g[12][13] = "door";                                          // front door
    g[14][13] = "stone"; g[15][13] = "stone";
    g[13][4] = "tree"; g[13][22] = "tree"; g[13][6] = "hedge"; g[13][20] = "hedge";
    g[13][8] = "flower"; g[13][18] = "flower"; g[13][2] = "flower";
  }
  function buildModern(g) {
    ground(g);
    g[1][4] = "sun"; g[1][21] = "cloud"; g[1][22] = "cloud";
    for (let r = 7; r <= 12; r++) for (let c = 6; c <= 20; c++) g[r][c] = "white";
    for (let c = 6; c <= 20; c++) g[6][c] = "roof";                                  // flat roof
    for (let c = 6; c <= 20; c++) g[13][c] = "stone";                               // concrete base
    [8, 11].forEach(function (rr) { [7, 9, 11, 15, 17, 19].forEach(function (cc) { g[rr][cc] = "window"; }); });
    g[11][13] = "door"; g[12][13] = "door";
    g[11][19] = "garage"; g[12][19] = "garage";
    g[14][19] = "drive"; g[15][19] = "drive";
    g[13][4] = "hedge"; g[13][22] = "hedge"; g[13][3] = "lamp";
    g[14][13] = "stone"; g[15][13] = "stone";
  }
  function buildMansion(g) {
    ground(g);
    g[1][3] = "sun"; g[1][20] = "cloud"; g[1][21] = "cloud"; g[2][8] = "cloud";
    for (let r = 6; r <= 12; r++) for (let c = 5; c <= 21; c++) g[r][c] = "white";
    for (let c = 5; c <= 21; c++) g[13][c] = "brick";
    for (let c = 5; c <= 21; c++) g[5][c] = "roof";
    for (let c = 6; c <= 20; c++) g[4][c] = "roof";
    g[3][12] = "roof2"; g[3][13] = "roof2"; g[3][14] = "roof2";
    g[4][5] = "brick"; g[3][5] = "brick"; g[4][21] = "brick"; g[3][21] = "brick";
    [7, 9, 11].forEach(function (rr) { [6, 8, 10, 16, 18, 20].forEach(function (cc) { g[rr][cc] = "window"; }); });
    g[7][13] = "window"; g[9][13] = "window";
    g[11][12] = "door"; g[11][13] = "door"; g[12][12] = "door"; g[12][13] = "door";
    g[14][12] = "stone"; g[14][13] = "stone"; g[15][12] = "stone"; g[15][13] = "stone";
    g[13][3] = "tree"; g[13][23] = "tree"; g[13][7] = "hedge"; g[13][8] = "hedge"; g[13][18] = "hedge"; g[13][19] = "hedge";
  }
  function buildCabin(g) {
    ground(g);
    g[1][4] = "sun"; g[1][20] = "cloud"; g[2][7] = "cloud";
    for (let r = 8; r <= 12; r++) for (let c = 10; c <= 16; c++) g[r][c] = "wood";
    for (let c = 10; c <= 16; c++) g[13][c] = "stone";
    for (let c = 10; c <= 16; c++) g[7][c] = "roof";
    for (let c = 11; c <= 15; c++) g[6][c] = "roof";
    g[5][12] = "roof2"; g[5][13] = "roof2"; g[5][14] = "roof2";
    g[6][16] = "brick"; g[5][16] = "brick";
    g[9][11] = "window"; g[9][15] = "window"; g[11][11] = "window"; g[11][15] = "window";
    g[11][13] = "door"; g[12][13] = "door";
    g[13][3] = "tree"; g[13][5] = "tree"; g[13][7] = "tree"; g[13][19] = "tree"; g[13][21] = "tree"; g[13][23] = "tree";
    g[14][13] = "stone"; g[15][13] = "stone"; g[13][9] = "flower"; g[13][17] = "flower";
  }
  const STYLES = { cottage: buildCottage, modern: buildModern, mansion: buildMansion, cabin: buildCabin };

  // ---- load / save ----
  try {
    const raw = localStorage.getItem("moHouse");
    if (raw) {
      const s = JSON.parse(raw);
      if (Array.isArray(s)) gridOut = s;
      else {
        if (s.out) gridOut = s.out;
        if (s.rooms) ROOM_KEYS.forEach(function (k) { if (s.rooms[k]) rooms[k] = s.rooms[k]; });
        else if (s.in) rooms.living = s.in;               // migrate old single room

        if (s.roomColors) roomColors = s.roomColors;

  window.addEventListener("pointerup", function (e) {
    if (playing) { playing = false; if (playMoved < 12 && playDown) { const i = petAt(playDown.x, playDown.y); if (i >= 0) { petList[i].trick = 0.8; petList[i].hearts = Math.max(petList[i].hearts, 0.6); flash("✨ " + (petList[i].name || "Your pet") + " did a trick! ✨"); } } followTarget = null; return; }
    if (mover) { dropMove(e); return; } painting = false;
  });

  // ================= ANIMATION (walking pets) =================
  const PETDRAW = { dog: drawDog, cat: drawCat, puppy: drawPuppy, rabbit: drawRabbit, bird: drawBird, hamster: drawHamster, turtle: drawTurtle, snake: drawSnake, parrot: drawParrot, frog: drawFrog, fishpet: drawFishbowl, horse: drawHorse };
  function heart(cx, cy, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(cx, cy + r * 0.9); ctx.bezierCurveTo(cx + r, cy, cx + r * 0.6, cy - r, cx, cy - r * 0.4); ctx.bezierCurveTo(cx - r * 0.6, cy - r, cx - r, cy, cx, cy + r * 0.9); ctx.fill(); }
  function spark(cx, cy, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r * 0.3, cy - r * 0.3); ctx.lineTo(cx + r, cy); ctx.lineTo(cx + r * 0.3, cy + r * 0.3); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r * 0.3, cy + r * 0.3); ctx.lineTo(cx - r, cy); ctx.lineTo(cx - r * 0.3, cy - r * 0.3); ctx.closePath(); ctx.fill(); }
  function drawPetSprite(pt) {
    const px = pt.x, baseY = pt.baseY + Math.sin(pt.phase) * 2;
    let jump = 0, spin = 0;
    if (pt.trick > 0) { const ph = 1 - pt.trick / 0.8; jump = -Math.sin(ph * Math.PI) * 22; spin = Math.sin(ph * Math.PI * 2) * 0.6; }
    const py = baseY + jump;
    const g = (pt.grow == null ? 1 : pt.grow), sc = 1.45 * (0.5 + 0.5 * g);
    ctx.save();
    ctx.translate(px + S / 2, py + S - 2); ctx.rotate(spin); if (pt.dir < 0) ctx.scale(-1, 1); ctx.scale(sc, sc); ctx.translate(-(px + S / 2), -(py + S - 2));
    (PETDRAW[pt.type] || function () {})(px, py);
    ctx.restore();
    if (pt.name) {
      ctx.save(); ctx.font = "bold 12px Trebuchet MS, sans-serif"; ctx.textAlign = "center";
      const w = ctx.measureText(pt.name).width + 8;
      ctx.fillStyle = "rgba(0,0,0,.55)"; rr(px + S / 2 - w / 2, baseY - 20, w, 15, 5); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillText(pt.name, px + S / 2, baseY - 9); ctx.restore();
    }
    if (pt.hunger != null && pt.hunger < 0.6) {                 // hunger bar
      const bw = 26, bx = px + S / 2 - bw / 2, byy = baseY - 1;
      ctx.fillStyle = "rgba(0,0,0,.45)"; rr(bx - 1, byy - 1, bw + 2, 6, 3); ctx.fill();
      ctx.fillStyle = pt.hunger > 0.5 ? "#6bd18a" : (pt.hunger > 0.25 ? "#f6c945" : "#ef6b5a"); rr(bx, byy, bw * pt.hunger, 4, 2); ctx.fill();
      if (pt.hunger < 0.3 && Math.sin(pt.phase * 2) > 0) { heart(px + S / 2 - 6, byy - 10, 4, "#ef6b5a"); ctx.fillStyle = "#8a5a2f"; ctx.fillRect(px + S / 2 + 2, byy - 12, 6, 5); }
    }
    if (pt.hearts > 0) { for (let k = 0; k < 3; k++) { const hy = baseY - (1.1 - pt.hearts) * 26 - k * 7; heart(px + S / 2 + (k - 1) * 9, hy, 5, "rgba(255,90,120," + Math.min(1, pt.hearts) + ")"); } }
    if (pt.trick > 0) { const ph = 1 - pt.trick / 0.8; for (let k = 0; k < 4; k++) { const a = ph * 6 + k * 1.57; spark(px + S / 2 + Math.cos(a) * 20, baseY + S * 0.3 + Math.sin(a) * 16, 3, "rgba(255,220,90," + (1 - ph) + ")"); } }
  }
  function frame() {
    frameCount++;
    ctx.drawImage(stat, 0, 0);
    const sc = curScene(), band = petBand();
    petList.forEach(function (pt) {
      if (pt.scene !== sc) return;
      if (pt.grow == null) pt.grow = 1;
      if (pt.hunger == null) pt.hunger = 1;
      pt.hunger = Math.max(0, pt.hunger - 0.00012);
      if (pt.trick > 0) pt.trick = Math.max(0, pt.trick - 0.016);
      if (pt.hearts > 0) pt.hearts = Math.max(0, pt.hearts - 0.016);
      if (pt.grow < 1) { pt.grow = Math.min(1, pt.grow + 0.0035); if (pt.grow >= 1 && pt.baby && !pt.grown) { pt.grown = true; flash((pt.name || "Your pet") + " grew up! 🎉"); } }
      if (followTarget && pt.scene === sc) {                 // follow the finger
        const tx = followTarget.x - S / 2, dx = tx - pt.x;
        pt.dir = dx < 0 ? -1 : 1;
        pt.x += Math.max(-4.5, Math.min(4.5, dx * 0.16));
        const tyb = Math.max(band.top, Math.min(band.bot - S, followTarget.y - S / 2));
        pt.baseY += (tyb - pt.baseY) * 0.12;
        pt.phase += 0.32;
      } else {
        pt.x += pt.dir * pt.speed * 0.016;
        pt.phase += 0.12;
        if (frameCount % 7 === 0 && ((frameCount + pt.speed) % 53) < 2) pt.dir *= -1;
      }
      if (pt.x < 0) { pt.x = 0; pt.dir = 1; }
      if (pt.x > canvas.width - S) { pt.x = canvas.width - S; pt.dir = -1; }
      drawPetSprite(pt);
    });
    if (mover && moverHover) {                        // furniture being dragged
      const prev = grid[moverHover.r][moverHover.c]; grid[moverHover.r][moverHover.c] = mover.val;
      ctx.save(); ctx.globalAlpha = 0.7; cellContent(moverHover.c, moverHover.r); ctx.restore();
      grid[moverHover.r][moverHover.c] = prev;
    }
    requestAnimationFrame(frame);
  }

  // ================= UI =================
  const pal = document.getElementById("palette");
  function buildPalette() {
    const set = (view === "out") ? TOOLS_OUT : TOOLS_IN;
    if (!set.some(function (t) { return t.id === tool; })) tool = set[0].id;
    pal.innerHTML = "";
    set.forEach(function (t) {
      const b = document.createElement("button");
      b.className = "tool" + (t.id === tool ? " sel" : "");
      b.innerHTML = '<span class="sw" style="background:' + t.col + '"></span>' + t.name + (t.price ? ' <span class="pr">🪙' + t.price + '</span>' : '');
      b.addEventListener("click", function () {
        tool = t.id;
        document.querySelectorAll(".tool").forEach(function (x) { x.classList.remove("sel"); });
        b.classList.add("sel"); buildColors();
      });
      pal.appendChild(b);
    });
  }

  const colDiv = document.getElementById("colors");
  function addColorGroup(label, arr, current, onPick) {
    const wrap = document.createElement("div"); wrap.className = "cgroup";
    const lab = document.createElement("span"); lab.className = "clabel"; lab.textContent = label + ":"; wrap.appendChild(lab);
    arr.forEach(function (c) { const s = document.createElement("button"); s.className = "cswatch" + (c === current ? " sel" : ""); s.style.background = c; s.addEventListener("click", function () { onPick(c); }); wrap.appendChild(s); });
    colDiv.appendChild(wrap);
  }
  function buildColors() {
    colDiv.innerHTML = "";
    if (view === "in") {
      addColorGroup("Wall", ROOM_WALLS, roomColors[roomKey].wall, function (c) { roomColors[roomKey].wall = c; drawAll(); buildColors(); });
      addColorGroup("Floor", ROOM_FLOORS, roomColors[roomKey].floor, function (c) { roomColors[roomKey].floor = c; drawAll(); buildColors(); });
    } else {
      const grp = GROUP[tool];
      if (grp) addColorGroup(grp === "wall" ? "Wall color" : grp === "roof" ? "Roof color" : "Door color", SWATCHES[grp], curColor[grp], function (c) { curColor[grp] = c; buildColors(); });
    }
  }

  const roomsDiv = document.getElementById("rooms");
  function buildRoomTabs() {
    roomsDiv.style.display = (view === "in") ? "flex" : "none";
    roomsDiv.innerHTML = "";
    if (view !== "in") return;
    ROOM_KEYS.forEach(function (k) {
      const b = document.createElement("button");
      b.className = "rtab" + (k === roomKey ? " sel" : "");
      b.textContent = ROOM_NAMES[k];
      b.addEventListener("click", function () { roomKey = k; grid = rooms[roomKey]; buildRoomTabs(); buildColors(); drawAll(); updateValue(); });
      roomsDiv.appendChild(b);
    });
  }

  const outBtn = document.getElementById("outBtn"), inBtn = document.getElementById("inBtn");
  const fillBtn = document.getElementById("fillBtn"), sellBtn = document.getElementById("sellBtn"), newBtn = document.getElementById("newBtn");
  function updateView() {
    grid = (view === "out") ? gridOut : rooms[roomKey];
    outBtn.classList.toggle("sel", view === "out");
    inBtn.classList.toggle("sel", view === "in");
    fillBtn.style.display = (view === "out") ? "" : "none";
    sellBtn.style.display = (view === "out") ? "" : "none";
    newBtn.textContent = (view === "out") ? "New Lot" : "Empty Room";
    hint.textContent = (view === "out")
      ? "Pick a block, then tap or drag to build your house and yard."
      : "Buy furniture with coins and place it — switch rooms with the tabs above!";
    buildRoomTabs(); buildPalette(); buildColors(); drawAll(); updateValue();
  }
  const tourBtn = document.getElementById("tourBtn");
  let tourTimer = null;
  function stopTour() { if (tourTimer) { clearInterval(tourTimer); tourTimer = null; } tourBtn.textContent = "🎥 Tour"; tourBtn.classList.remove("sel"); }
  tourBtn.addEventListener("click", function () {
    if (tourTimer) { stopTour(); flash("Tour stopped"); return; }
    view = "in"; roomKey = ROOM_KEYS[0]; updateView();
    tourBtn.textContent = "⏹ Stop"; tourBtn.classList.add("sel");
    flash("🎥 Touring: " + ROOM_NAMES[roomKey]);
    let i = 0;
    tourTimer = setInterval(function () {
      i++;
      if (i >= ROOM_KEYS.length) { stopTour(); flash("Tour complete! 🎬"); return; }
      roomKey = ROOM_KEYS[i]; buildRoomTabs(); buildColors(); drawAll(); updateValue();
      flash("🎥 Touring: " + ROOM_NAMES[roomKey]);
    }, 1500);
  });
  outBtn.addEventListener("click", function () { stopTour(); view = "out"; updateView(); });
  inBtn.addEventListener("click", function () { stopTour(); view = "in"; updateView(); });
  const dayBtn = document.getElementById("dayBtn");
  dayBtn.textContent = night ? "☀️ Day" : "🌙 Night";
  dayBtn.addEventListener("click", function () { night = !night; dayBtn.textContent = night ? "☀️ Day" : "🌙 Night"; drawAll(); flash(night ? "Nighty-night! 🌙" : "Good morning! ☀️"); });

  // ---- shop popup with pictures ----
  const DRAWFN = {
    brick: drawBrick, wood: drawWood, white: function (x, y) { drawSiding(x, y); }, roof: function (x, y) { drawShingle(x, y); }, roof2: function (x, y) { drawPeak(x, y); }, window: drawWindow, door: function (x, y) { drawDoor(x, y); }, garage: drawGarage, grass: drawGrass, tree: drawTree, hedge: drawHedge, flower: drawFlower, fence: drawFence, mailbox: drawMailbox, lamp: drawLamp, car: drawCar, drive: drawDrive, pool: drawPool, hottub: drawHotTub, water: drawWater, stone: drawPaver, sun: drawSun, cloud: drawCloud,
    rug: drawRug, sofa: drawSofa, tv: drawTV, fireplace: drawFireplace, piano: drawPiano, pooltable: drawPoolTable, gaming: drawGaming, aquarium: drawAquarium, table: drawTable, chair: drawChair, bookshelf: drawBookshelf, bed: drawBed, bunkbed: drawBunk, dresser: drawDresser, lamp2: drawFloorLamp, fridge: drawFridge, stove: drawStove, island: drawIsland, counter: drawCounter, sink: drawSink, toilet: drawToilet, bath: drawBath, shower: drawShower, plant: drawPlant,
    dog: drawDog, cat: drawCat, puppy: drawPuppy, rabbit: drawRabbit, bird: drawBird, hamster: drawHamster, turtle: drawTurtle, snake: drawSnake, parrot: drawParrot, frog: drawFrog, fishpet: drawFishbowl, horse: drawHorse
  };
  function thumb(id) {
    const cv = document.createElement("canvas"); cv.width = 54; cv.height = 54; const t = cv.getContext("2d");
    t.fillStyle = "#31536a"; t.fillRect(0, 0, 54, 54);
    const save = ctx; ctx = t; t.save(); const s = 54 / S; t.translate(3, 3); t.scale(0.87 * s, 0.87 * s);
    try { const fn = DRAWFN[id]; if (fn) fn(0, 0); } catch (e) {}
    t.restore(); ctx = save; return cv.toDataURL();
  }
  const shop = document.getElementById("shop"), shopGrid = document.getElementById("shopGrid");
  function openShop() {
    shopGrid.innerHTML = "";
    const set = (view === "out") ? TOOLS_OUT : TOOLS_IN;
    set.forEach(function (t) {
      if (t.id === "erase" || t.id === "move" || t.id === "play") return;
      const card = document.createElement("button"); card.className = "scard" + (t.id === tool ? " sel" : "");
      const img = document.createElement("img"); img.className = "sthumb"; img.src = thumb(t.id);
      const nm = document.createElement("div"); nm.className = "sname"; nm.textContent = t.name;
      card.appendChild(img); card.appendChild(nm);
      if (t.price) { const pr = document.createElement("div"); pr.className = "sprice"; pr.textContent = "🪙" + t.price; card.appendChild(pr); }
      card.addEventListener("click", function () { tool = t.id; buildPalette(); buildColors(); shop.classList.add("hidden"); flash("Picked " + t.name); });
      shopGrid.appendChild(card);
    });
    shop.classList.remove("hidden");
  }
  document.getElementById("shopBtn").addEventListener("click", openShop);
  document.getElementById("shopClose").addEventListener("click", function () { shop.classList.add("hidden"); });
  shop.addEventListener("click", function (e) { if (e.target === shop) shop.classList.add("hidden"); });

  document.getElementById("photoBtn").addEventListener("click", function () {
    try { const a = document.createElement("a"); a.download = "mo-house.png"; a.href = canvas.toDataURL("image/png"); a.click(); flash("📸 Snapshot saved!"); }
    catch (e) { flash("Could not save photo"); }
  });
  document.querySelectorAll(".sbtn").forEach(function (b) {
    b.addEventListener("click", function () { gridOut = blankGrid(); STYLES[b.getAttribute("data-style")](gridOut); view = "out"; updateView(); flash(b.textContent.trim() + " loaded — now make it yours!"); });
  });

  // ---- sell ----
  function houseValue() {
    const worth = { white: 10, wood: 10, brick: 10, roof: 12, roof2: 12, window: 15, door: 20, garage: 18, tree: 5, hedge: 5, flower: 4, fence: 4, mailbox: 6, lamp: 6, car: 12, drive: 3, water: 8, stone: 3, grass: 0, sun: 4, cloud: 2 };
    let total = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const v = worth[baseId(gridOut[r][c])]; if (v) total += v; }
    ROOM_KEYS.forEach(function (k) { const g = rooms[k]; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const v = PRICE[baseId(g[r][c])]; if (v) total += v; } });
    petList.forEach(function (pt) { total += PRICE[pt.type] || 0; });
    return total;
  }
  sellBtn.addEventListener("click", function () {
    const value = houseValue();
    if (value < 30) { flash("Build a bigger house first, then sell it! 🔨"); return; }
    coins += value; saveCoins(); showCoins();
    flash("SOLD your house for " + value + " coins! 🤑");
    gridOut = blankGrid(); ground(gridOut);
    ROOM_KEYS.forEach(function (k) { rooms[k] = blankGrid(); });
    petList.length = 0;
    view = "out"; updateView();
  });
  function dropScenePets() { const sc = curScene(); for (let i = petList.length - 1; i >= 0; i--) if (petList[i].scene === sc) petList.splice(i, 1); }
  document.getElementById("restartBtn").addEventListener("click", function () {
    if (view === "out") { gridOut = blankGrid(); buildCottage(gridOut); } else { rooms[roomKey] = blankGrid(); }
    dropScenePets(); persist(); updateView(); flash(view === "out" ? "Back to the starter house! 🏠" : "Room emptied 🧹");
  });
  newBtn.addEventListener("click", function () {
    if (view === "out") { gridOut = blankGrid(); ground(gridOut); } else { rooms[roomKey] = blankGrid(); }
    dropScenePets(); updateView(); flash(view === "out" ? "Fresh lot — build a new house! 🏗️" : "Empty room — start decorating! 🪑");
  });
  fillBtn.addEventListener("click", function () { for (let c = 0; c < COLS; c++) { gridOut[ROWS - 1][c] = "grass"; gridOut[ROWS - 2][c] = "grass"; } drawAll(); flash("Grass filled 🌱"); });
  document.getElementById("saveBtn").addEventListener("click", function () { flash(persist() ? "Saved! ✅" : "Could not save"); });
  document.getElementById("clearBtn").addEventListener("click", function () { if (view === "out") gridOut = blankGrid(); else rooms[roomKey] = blankGrid(); dropScenePets(); updateView(); flash("Cleared"); });

  updateView();
  requestAnimationFrame(frame);
})();
</script>
</body>
