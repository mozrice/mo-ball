<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Jet Ski</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#1470b0;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#dff;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:19px;font-weight:bold;color:#fff;pointer-events:none;}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0008;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;} button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
  #tip{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#dff;font-size:15px;pointer-events:none;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🚤 <span id="sc">0</span>m &nbsp; 💍<span id="rings">0</span> &nbsp; 🏆<span id="hi">0</span></div>
<canvas id="c"></canvas>
<div id="tip">👆 Slide to steer • grab 💍 rings • dodge 🛟🪵</div>
<div id="over"><h1>💥 SPLASH!</h1><p id="msg"></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var HK='moJetHi'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var ski,things,dist,rings,running,last,spawnT,speed,wake;
  document.getElementById('hi').textContent=getHi();
  function reset(){ ski={x:W/2,y:H-110}; things=[]; dist=0; rings=0; running=true; last=0; spawnT=0; speed=4; wake=[]; document.getElementById('sc').textContent=0; document.getElementById('rings').textContent=0; document.getElementById('over').style.display='none'; }
  var drag=false;
  function move(e){ var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); ski.x=Math.max(24,Math.min(W-24,t0.clientX-r.left)); ski.y=Math.max(H*0.4,Math.min(H-24,t0.clientY-r.top)); }
  cv.addEventListener('touchstart',function(e){drag=true;move(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',function(e){if(drag)move(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',function(){drag=false;});
  cv.addEventListener('mousedown',function(e){drag=true;move(e);});
  window.addEventListener('mousemove',function(e){if(drag)move(e);});
  window.addEventListener('mouseup',function(){drag=false;});
  function spawn(){ var r=Math.random(); var t=r<0.5?'obs':'ring'; things.push({x:24+Math.random()*(W-48),y:-30,t:t,e:t==='ring'?'💍':(Math.random()<0.5?'🛟':'🪵')}); }
  function loop(ts){ if(!running)return; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts;
    speed=4+dist*0.004; dist+=speed*dt*0.1; document.getElementById('sc').textContent=Math.floor(dist);
    if(Math.random()<0.5)wake.push({x:ski.x,y:ski.y+18,life:20});
    spawnT-=dt; if(spawnT<=0){ spawn(); spawnT=Math.max(16,40-dist*0.02); }
    for(var i=things.length-1;i>=0;i--){ var o=things[i]; o.y+=speed*dt; if(Math.abs(o.x-ski.x)<28&&Math.abs(o.y-ski.y)<28){ if(o.t==='ring'){ rings++; dist+=15; document.getElementById('rings').textContent=rings; beep(820,0.07); things.splice(i,1); continue; } else { over(); return; } } if(o.y>H+30)things.splice(i,1); }
    for(var w=wake.length-1;w>=0;w--){ wake[w].life--; wake[w].y+=speed*dt; if(wake[w].life<=0)wake.splice(w,1); }
    draw(); requestAnimationFrame(loop); }
  function draw(){ ctx.fillStyle='#1470b0'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#ffffff22'; ctx.lineWidth=2; for(var y=0;y<H;y+=26){ ctx.beginPath(); for(var x=0;x<=W;x+=20)ctx.lineTo(x,(y+dist*4)%H+Math.sin((x+y)*0.05)*3); ctx.stroke(); }
    for(var w=0;w<wake.length;w++){ ctx.globalAlpha=wake[w].life/20*0.6; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(wake[w].x,wake[w].y,5,0,6.29); ctx.fill(); ctx.globalAlpha=1; }
    for(var i=0;i<things.length;i++){ ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(things[i].e,things[i].x,things[i].y); }
    ctx.font='36px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🚤',ski.x,ski.y); }
  function over(){ running=false; var sc=Math.floor(dist)+rings*15; if(sc>getHi()){ setHi(sc); } document.getElementById('hi').textContent=getHi(); document.getElementById('msg').textContent='Distance '+Math.floor(dist)+'m • 💍'+rings+' • Best '+getHi(); document.getElementById('over').style.display='flex'; beep(150,0.25); }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.04; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); requestAnimationFrame(loop); };
  reset(); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
