<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Ocean</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a4a7a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(5,40,70,.72);}
  #obox{background:#fff;color:#222;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#0a8ac0;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#0a9ad0;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="over"><div id="obox"><h1>🌊 MO Ocean</h1><div id="omsg">Drag to swim your submarine.<br>Grab treasure 💎, dodge the jellyfish!</div><button id="go">DIVE</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  var playing=false, score=0, best=+(localStorage.getItem('moOceanBest')||0);
  var sx=0,sy=0,tx=0,ty=0, treas=[], jelly=[], bub=[], t=0;
  for(var i=0;i<24;i++)bub.push({x:Math.random(),y:Math.random(),s:2+Math.random()*4,v:0.002+Math.random()*0.004});
  function reset(){ sx=W/2; sy=H/2; tx=W/2; ty=H/2; treas=[]; jelly=[]; score=0; t=0; }
  function ac(){ try{ return ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function loop(){ t++;
    var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2a90c8'); g.addColorStop(1,'#062a4a'); x.fillStyle=g; x.fillRect(0,0,W,H);
    for(var i=0;i<bub.length;i++){ var b=bub[i]; b.y-=b.v; if(b.y<0){b.y=1;b.x=Math.random();} x.fillStyle='rgba(255,255,255,0.25)'; x.beginPath(); x.arc(b.x*W,b.y*H,b.s,0,7); x.fill(); }
    // sea floor
    x.fillStyle='#c8a86a'; x.beginPath(); x.moveTo(0,H); x.lineTo(0,H-30); for(var fx=0;fx<=W;fx+=40)x.lineTo(fx,H-30-Math.sin(fx*0.05)*10); x.lineTo(W,H); x.fill();
    sx+=(tx-sx)*0.18; sy+=(ty-sy)*0.18;
    if(playing){ if(t%50===0)treas.push({x:Math.random()*W,y:-20,v:1.6}); if(t%42===0)jelly.push({x:Math.random()*W,y:-20,v:1.6+Math.random()*1.6,ph:Math.random()*6}); score++; }
    for(var j=treas.length-1;j>=0;j--){ var tr=treas[j]; tr.y+=tr.v; x.save(); x.translate(tr.x,tr.y); x.fillStyle='#3ad0e0'; x.beginPath(); x.moveTo(0,-12); x.lineTo(10,0); x.lineTo(0,12); x.lineTo(-10,0); x.closePath(); x.fill(); x.fillStyle='#bff4ff'; x.beginPath(); x.moveTo(0,-12); x.lineTo(4,-2); x.lineTo(-4,-2); x.fill(); x.restore();
      if(Math.hypot(tr.x-sx,tr.y-sy)<32){ score+=10; beep(1100); treas.splice(j,1); continue; } if(tr.y>H+20)treas.splice(j,1); }
    for(var k=jelly.length-1;k>=0;k--){ var je=jelly[k]; je.y+=je.v; je.ph+=0.1; x.save(); x.translate(je.x+Math.sin(je.ph)*10,je.y); x.fillStyle='rgba(230,120,200,0.85)'; x.beginPath(); x.arc(0,0,14,Math.PI,0); x.fill(); x.strokeStyle='rgba(230,120,200,0.7)'; x.lineWidth=2; for(var tt=-2;tt<=2;tt++){ x.beginPath(); x.moveTo(tt*5,0); x.lineTo(tt*5+Math.sin(je.ph+tt)*3,16); x.stroke(); } x.restore();
      var jyx=je.x+Math.sin(je.ph)*10; if(playing && Math.hypot(jyx-sx,je.y-sy)<28){ playing=false; over(); } if(je.y>H+30)jelly.splice(k,1); }
    // submarine
    x.save(); x.translate(sx,sy); x.fillStyle='#ffd23f'; x.beginPath(); x.ellipse(0,0,28,18,0,0,7); x.fill(); x.fillStyle='#e0b020'; x.fillRect(24,-5,10,10); x.fillStyle='#bfe3ff'; x.beginPath(); x.arc(-4,0,9,0,7); x.fill(); x.fillStyle='#e2342f'; x.fillRect(-8,-24,16,10); x.fillStyle='#fff'; x.font='900 11px Trebuchet MS'; x.textAlign='center'; x.fillText('MO',-4,3); x.restore();
    x.fillStyle='#fff'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='left'; x.fillText('💎 '+score, 14, 40);
    x.textAlign='right'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('Best '+best, W-14, 36);
    requestAnimationFrame(loop);
  }
  function over(){ beep(160,0.3); if(score>best){ best=score; try{localStorage.setItem('moOceanBest',score);}catch(e){} }
    document.getElementById('omsg').innerHTML='You scored <b>'+score+'</b>!<br>Best: '+best; document.getElementById('go').textContent='DIVE AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  var down=false; function set(cx,cy){ tx=Math.max(20,Math.min(W-20,cx)); ty=Math.max(20,Math.min(H-20,cy)); }
  cv.addEventListener('pointerdown',function(e){ down=true; set(e.clientX,e.clientY); }); cv.addEventListener('pointermove',function(e){ if(down)set(e.clientX,e.clientY); }); addEventListener('pointerup',function(){ down=false; });
  document.getElementById('over').style.display='flex'; loop();
})();
</script>
</body></html>
