<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Arff Bath Time</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#8ad0e8;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;opacity:.95;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;text-shadow:0 1px 3px #0006;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:18px;font-weight:bold;color:#fff;pointer-events:none;text-shadow:0 1px 4px #0007;z-index:4;}
  #sub{position:fixed;top:34px;left:0;right:0;text-align:center;font-size:14px;font-weight:bold;color:#fff;pointer-events:none;text-shadow:0 1px 3px #0007;z-index:4;}
  #tray{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 8px;background:#2a5a6ad9;border-top:3px solid #4a8aa0;z-index:6;}
  .item{position:relative;font-size:30px;background:#eaf6ff;border:3px solid #bfe0ee;border-radius:16px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #7aa8bc;}
  .item .lbl{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:#eaf6ff;font-weight:bold;}
  .item.done{opacity:.4;}
  .item.done::after{content:'✓';position:absolute;top:-6px;right:-6px;background:#2ec46a;color:#fff;font-size:15px;font-weight:bold;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .item:active{transform:translateY(3px);box-shadow:0 1px 0 #7aa8bc;}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;text-align:center;padding:20px;}
  #start{background:linear-gradient(#a0e0f0,#4a90b0);}
  #start h1{font-size:26px;margin:0 0 6px;text-shadow:0 2px 4px #0006;} #start p{font-size:15px;margin:4px;max-width:330px;}
  #start .big{font-size:60px;}
  #over{background:#000a;display:none;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;text-shadow:0 2px 0 #b47a1a;} #over p{font-size:17px;margin:3px;}
  #start button,#over button{margin-top:16px;background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
  #start button:active,#over button:active{transform:translateY(3px);box-shadow:0 2px 0 #b4801a;}
  #petbtn{position:fixed;top:6px;right:10px;z-index:9;background:#ffd23f;color:#5a3a00;border:none;font-family:inherit;font-weight:bold;font-size:14px;padding:8px 12px;border-radius:12px;box-shadow:0 3px 0 #b4801a;cursor:pointer;}
  #petbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<button id="petbtn">🐱 Wash Meow</button>
<div id="hud">🫧 <span id="n">0</span>/<span id="tot">0</span></div>
<div id="sub">Tap something — it goes on Arff!</div>
<canvas id="c"></canvas>
<div id="tray"></div>
<div id="start"><div class="big">🛁🐶</div><h1>MO Arff Bath Time</h1><p>Arff is in the big bath! Tap each thing on the tray and watch it go ON. Use them all to get squeaky clean! Tap the 🐱 button to wash Meow the gray cat instead!</p><button id="go">▶ START BATH</button></div>
<div id="over"><h1 id="ot">🎉 SQUEAKY CLEAN!</h1><p id="om"></p><button id="rs">▶ Bath Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var ITEMS=[
    {e:'💧',n:'Water',fx:'splash'},{e:'🚿',n:'Shower',fx:'splash'},{e:'🧴',n:'Shampoo',fx:'suds'},
    {e:'🧼',n:'Soap',fx:'suds'},{e:'🧽',n:'Scrub',fx:'scrub'},{e:'🪥',n:'Brush',fx:'scrub'},
    {e:'🫧',n:'Bubbles',fx:'bubbles'},{e:'🦆',n:'Ducky',fx:'duck'},{e:'🧸',n:'Toy',fx:'toy'},
    {e:'💛',n:'Love',fx:'hearts'},{e:'🌟',n:'Rinse',fx:'rinse'},{e:'🧻',n:'Towel',fx:'towel'},
    {e:'💨',n:'Blow Dry',fx:'dry'},{e:'💅',n:'Nails',fx:'sparkle'},{e:'🦴',n:'Treat',fx:'treat'}
  ];
  var used, running, arff, suds, bubbles, flyers, sparks, ducky, tt, hearts, ex, pet;
  var tray=document.getElementById('tray'); document.getElementById('tot').textContent=ITEMS.length;
  function arffPos(){ return {x:W*0.5, y:H*0.46}; }
  function buildTray(){ tray.innerHTML=''; ITEMS.forEach(function(it,i){ var b=document.createElement('button'); b.className='item'; b.innerHTML=it.e+'<span class="lbl">'+it.n+'</span>'; b.onclick=function(){ useItem(i,b); }; it.btn=b; tray.appendChild(b); }); }
  function reset(){ used=0; running=true; if(typeof pet==='undefined'||!pet)pet='arff'; arff={dirt:6,clean:false}; suds=[]; bubbles=[]; flyers=[]; sparks=[]; ducky=false; tt=0; hearts=[]; ex={toy:false,bow:false,treat:false,dry:false};
    ITEMS.forEach(function(it){ it.done=false; }); buildTray();
    document.getElementById('n').textContent=0; document.getElementById('over').style.display='none'; document.getElementById('start').style.display='none'; document.getElementById('sub').textContent='👇 Tap something — it goes on Arff!'; }
  function useItem(i,b){ if(!running)return; var it=ITEMS[i]; if(it.done)return; it.done=true; b.classList.add('done'); used++; document.getElementById('n').textContent=used;
    var r=b.getBoundingClientRect(), cr=cv.getBoundingClientRect(); var sx=r.left+r.width/2-cr.left, sy=r.top+r.height/2-cr.top; var ap=arffPos();
    flyers.push({e:it.e,x:sx,y:sy,tx:ap.x,ty:ap.y,fx:it.fx,t:0}); beep(600+used*30,0.06);
    document.getElementById('sub').textContent=it.n+' on Arff! '+ (ITEMS.length-used)+' left';
    if(used>=ITEMS.length){ setTimeout(function(){ if(used>=ITEMS.length&&running) win(); },700); } }
  function applyFx(fx,ap){
    if(fx==='suds'){ for(var i=0;i<10;i++)suds.push({x:ap.x+(Math.random()-0.5)*70,y:ap.y+(Math.random()-0.5)*50,r:8+Math.random()*10,life:9999}); if(arff.dirt>0)arff.dirt-=2; }
    else if(fx==='scrub'){ if(arff.dirt>0)arff.dirt-=3; for(var i=0;i<8;i++)sparks.push({x:ap.x+(Math.random()-0.5)*60,y:ap.y+(Math.random()-0.5)*40,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:22,c:'#fff'}); }
    else if(fx==='bubbles'){ for(var i=0;i<12;i++)bubbles.push({x:ap.x+(Math.random()-0.5)*90,y:ap.y+20,vy:-1-Math.random()*1.5,r:4+Math.random()*8,ph:Math.random()*6.28}); }
    else if(fx==='splash'){ for(var i=0;i<14;i++)sparks.push({x:ap.x+(Math.random()-0.5)*40,y:ap.y,vx:(Math.random()-0.5)*6,vy:-2-Math.random()*4,life:24,c:'#8fe0ff'}); if(arff.dirt>0)arff.dirt-=1; }
    else if(fx==='duck'){ ducky=true; }
    else if(fx==='rinse'){ arff.dirt=0; for(var i=0;i<20;i++)sparks.push({x:ap.x+(Math.random()-0.5)*90,y:ap.y+(Math.random()-0.5)*70,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:26,c:'#ffe27a'}); }
    else if(fx==='toy'){ ex.toy=true; }
    else if(fx==='hearts'){ for(var i=0;i<8;i++)hearts.push({x:ap.x+(Math.random()-0.5)*80,y:ap.y,vy:-1-Math.random()*1.5,ph:Math.random()*6.28,life:60}); }
    else if(fx==='towel'){ suds=[]; for(var i=0;i<12;i++)sparks.push({x:ap.x+(Math.random()-0.5)*90,y:ap.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:22,c:'#fff'}); }
    else if(fx==='dry'){ ex.dry=true; suds=[]; for(var i=0;i<16;i++)sparks.push({x:ap.x-90+i*10,y:ap.y+(Math.random()-0.5)*40,vx:3+Math.random()*3,vy:(Math.random()-0.5)*2,life:20,c:'#dff4ff'}); }
    else if(fx==='sparkle'){ for(var i=0;i<16;i++)sparks.push({x:ap.x+(Math.random()-0.5)*100,y:ap.y+(Math.random()-0.5)*80,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:26,c:'#ffd23f'}); }
    else if(fx==='treat'){ ex.treat=true; for(var i=0;i<6;i++)hearts.push({x:ap.x+(Math.random()-0.5)*40,y:ap.y,vy:-1-Math.random(),ph:Math.random()*6.28,life:50}); }
  }
  function win(){ running=false; arff.clean=true; arff.dirt=0; suds=[]; var ap=arffPos(); for(var i=0;i<40;i++)sparks.push({x:ap.x+(Math.random()-0.5)*120,y:ap.y+(Math.random()-0.5)*90,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:30,c:['#ffe27a','#8fe0ff','#fff','#ffb0e0'][i%4]});
    document.getElementById('ot').innerHTML='🎉 SQUEAKY CLEAN! 🎉'; document.getElementById('om').textContent=(pet==='cat')?'Meow the cat had a great bath and is so happy! 🐱💦':'Arff had a great bath and is so happy! 🐶💦'; document.getElementById('sub').textContent='✨ Arff is all clean!';
    setTimeout(function(){ document.getElementById('over').style.display='flex'; if(window.MO_MVP)window.MO_MVP(); },1100); }
  function draw(){ tt+=0.05; var ap=arffPos();
    // bathroom tiles
    ctx.fillStyle='#bfe8f4'; ctx.fillRect(0,0,W,H); ctx.strokeStyle='#a8d8e8'; ctx.lineWidth=1; for(var gx=0;gx<W;gx+=44){ ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H*0.7);ctx.stroke(); } for(var gy=0;gy<H*0.7;gy+=44){ ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke(); }
    ctx.fillStyle='#7ab0c4'; ctx.fillRect(0,H*0.7,W,H*0.3);
    // BIG bath tub
    var tw=Math.min(W*0.82,420), th=tw*0.5, tx=W*0.5, ty=H*0.52;
    ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(tx,ty+th*0.52,tw*0.5,th*0.16,0,0,6.29); ctx.fill();
    ctx.fillStyle='#ffffff'; rr(tx-tw/2,ty-th/2,tw,th,th*0.4); ctx.fill(); ctx.strokeStyle='#cfe6f0'; ctx.lineWidth=5; ctx.stroke();
    // water
    ctx.save(); rr(tx-tw/2+10,ty-th*0.18,tw-20,th*0.6,th*0.28); ctx.clip(); var wg=ctx.createLinearGradient(0,ty-th*0.2,0,ty+th*0.4); wg.addColorStop(0,'#7fd0f0'); wg.addColorStop(1,'#3a9fd0'); ctx.fillStyle=wg; ctx.fillRect(tx-tw/2,ty-th*0.2,tw,th); for(var i=0;i<3;i++){ ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(tx-tw/2,ty+Math.sin(tt*2+i)*4+i*8-6); ctx.bezierCurveTo(tx-tw/4,ty-6+i*8,tx+tw/4,ty+i*8,tx+tw/2,ty+Math.sin(tt*2+i)*4+i*8-6); ctx.stroke(); } ctx.restore();
    // Arff — a fluffy WHITE maltipoo — sitting in the tub (bobbing)
    var by=Math.sin(tt*2)*3; ctx.textAlign='center'; ctx.textBaseline='middle';
    var petS=Math.min(tw*0.30,84); if(pet==='cat') drawCat(tx, ty-th*0.06+by, petS); else drawArff(tx, ty-th*0.06+by, petS);
    // dirt spots on Arff
    if(!arff.clean){ ctx.fillStyle='rgba(120,90,50,0.7)'; for(var d=0;d<arff.dirt;d++){ var a=d*1.7; ctx.beginPath(); ctx.arc(tx+Math.cos(a)*tw*0.13, ty-th*0.05+by+Math.sin(a)*th*0.12, 6,0,6.29); ctx.fill(); } }
    // ducky + extra bath things around Arff
    if(ducky){ ctx.font=Math.min(34,tw*0.13)+'px sans-serif'; ctx.fillText('🦆',tx+tw*0.30,ty+th*0.05+Math.sin(tt*3)*3); }
    if(ex.toy){ ctx.font=Math.min(30,tw*0.12)+'px sans-serif'; ctx.fillText('🧸',tx-tw*0.32,ty+th*0.02+Math.sin(tt*2.5+1)*3); }
    if(ex.treat){ ctx.font=Math.min(28,tw*0.11)+'px sans-serif'; ctx.fillText('🦴',tx,ty+th*0.24+by); }
    if(ex.dry){ ctx.globalAlpha=0.35; ctx.fillStyle='#fff'; for(var q=0;q<6;q++){ ctx.beginPath(); ctx.arc(tx+(Math.random()-0.5)*tw*0.5, ty-th*0.05+by+(Math.random()-0.5)*th*0.4, 3+Math.random()*3,0,6.29); ctx.fill(); } ctx.globalAlpha=1; }
    // floating hearts
    for(var hI=hearts.length-1;hI>=0;hI--){ var ht=hearts[hI]; ht.y+=ht.vy; ht.x+=Math.sin(tt+ht.ph)*0.5; ht.life--; if(ht.life<=0){hearts.splice(hI,1);continue;} ctx.globalAlpha=Math.min(1,ht.life/30); ctx.font='20px sans-serif'; ctx.fillText('💛',ht.x,ht.y); ctx.globalAlpha=1; }
    // suds on Arff
    for(var s=0;s<suds.length;s++){ ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.beginPath(); ctx.arc(suds[s].x,suds[s].y+by,suds[s].r,0,6.29); ctx.fill(); }
    // bubbles rising
    for(var bI=bubbles.length-1;bI>=0;bI--){ var bu=bubbles[bI]; bu.y+=bu.vy; bu.x+=Math.sin(tt+bu.ph)*0.4; if(bu.y<H*0.1){bubbles.splice(bI,1);continue;} ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r,0,6.29); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fill(); }
    // flyers (item flying onto Arff)
    for(var f=flyers.length-1;f>=0;f--){ var fl=flyers[f]; fl.t+=0.06; fl.x+=(fl.tx-fl.x)*0.18; fl.y+=(fl.ty-fl.y)*0.18; ctx.font='34px sans-serif'; ctx.fillText(fl.e,fl.x,fl.y); if(Math.hypot(fl.tx-fl.x,fl.ty-fl.y)<8){ applyFx(fl.fx,ap); flyers.splice(f,1); } }
    // sparks
    for(var sp=sparks.length-1;sp>=0;sp--){ var k=sparks[sp]; k.x+=k.vx; k.y+=k.vy; k.vy+=0.15; k.life--; if(k.life<=0){sparks.splice(sp,1);continue;} ctx.globalAlpha=k.life/26; ctx.fillStyle=k.c; ctx.fillRect(k.x,k.y,3,3); ctx.globalAlpha=1; }
    requestAnimationFrame(draw); }
  function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function puff(cx,cy,r){ ctx.beginPath(); ctx.arc(cx,cy,r,0,6.29); ctx.fill(); }
  function drawArff(cx,cy,s){
    ctx.save(); ctx.translate(cx,cy);
    // ears (fluffy, slightly cream white)
    ctx.fillStyle='#f2f2ee'; ctx.strokeStyle='#dcdcd6'; ctx.lineWidth=2;
    puff(-s*0.62,-s*0.05,s*0.28); ctx.stroke(); puff(s*0.62,-s*0.05,s*0.28); ctx.stroke();
    // body fluff (in water)
    ctx.fillStyle='#ffffff'; puff(0,s*0.55,s*0.66); ctx.strokeStyle='#e6e6e0'; ctx.stroke();
    // head fluff — cluster of white puffs
    ctx.fillStyle='#ffffff'; ctx.strokeStyle='#e6e6e0'; ctx.lineWidth=2;
    var pf=[[-0.42,-0.2,0.34],[0.42,-0.2,0.34],[-0.2,-0.5,0.32],[0.2,-0.5,0.32],[0,-0.62,0.3],[-0.55,0.18,0.3],[0.55,0.18,0.3],[0,0.05,0.62]];
    for(var i=0;i<pf.length;i++){ puff(pf[i][0]*s,pf[i][1]*s,pf[i][2]*s); }
    for(var i=0;i<pf.length;i++){ ctx.beginPath(); ctx.arc(pf[i][0]*s,pf[i][1]*s,pf[i][2]*s,0,6.29); ctx.stroke(); }
    // face
    ctx.fillStyle='#2a2a2a';
    puff(-s*0.22,-s*0.02,s*0.075); puff(s*0.22,-s*0.02,s*0.075); // eyes
    // eye shine
    ctx.fillStyle='#fff'; puff(-s*0.20,-s*0.045,s*0.025); puff(s*0.24,-s*0.045,s*0.025);
    // nose
    ctx.fillStyle='#3a2a2a'; ctx.beginPath(); ctx.moveTo(0,s*0.14); ctx.lineTo(-s*0.09,s*0.06); ctx.lineTo(s*0.09,s*0.06); ctx.closePath(); ctx.fill();
    // mouth
    ctx.strokeStyle='#5a4a4a'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(0,s*0.14); ctx.lineTo(0,s*0.2); ctx.arc(-s*0.06,s*0.2,s*0.06,0,Math.PI); ctx.moveTo(0,s*0.2); ctx.arc(s*0.06,s*0.2,s*0.06,0,Math.PI); ctx.stroke();
    // tongue
    ctx.fillStyle='#ff9ab0'; rr(-s*0.05,s*0.22,s*0.1,s*0.12,s*0.05); ctx.fill();
    // rosy cheeks
    ctx.fillStyle='rgba(255,170,190,0.5)'; puff(-s*0.34,s*0.08,s*0.08); puff(s*0.34,s*0.08,s*0.08);
    // red COLLAR with gold bone tag
    ctx.fillStyle='#e0453a'; rr(-s*0.44,s*0.30,s*0.88,s*0.13,s*0.06); ctx.fill(); ctx.strokeStyle='#b5342a'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(0,s*0.46,s*0.085,0,6.29); ctx.fill(); ctx.strokeStyle='#c8a020'; ctx.lineWidth=2; ctx.stroke();
    ctx.font=(s*0.1)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🦴',0,s*0.46);
    ctx.restore();
  }
  function drawCat(cx,cy,s){
    ctx.save(); ctx.translate(cx,cy);
    ctx.fillStyle='#9a9aa2'; ctx.strokeStyle='#7a7a82'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-s*0.55,-s*0.30); ctx.lineTo(-s*0.30,-s*0.64); ctx.lineTo(-s*0.10,-s*0.32); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.55,-s*0.30); ctx.lineTo(s*0.30,-s*0.64); ctx.lineTo(s*0.10,-s*0.32); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f0b0c0'; ctx.beginPath(); ctx.moveTo(-s*0.42,-s*0.34); ctx.lineTo(-s*0.30,-s*0.54); ctx.lineTo(-s*0.18,-s*0.34); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s*0.42,-s*0.34); ctx.lineTo(s*0.30,-s*0.54); ctx.lineTo(s*0.18,-s*0.34); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#adadb5'; puff(0,s*0.55,s*0.60); ctx.strokeStyle='#8a8a92'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#bcbcc4'; ctx.strokeStyle='#8a8a92'; puff(0,-s*0.02,s*0.60); ctx.stroke();
    puff(-s*0.50,s*0.06,s*0.22); puff(s*0.50,s*0.06,s*0.22);
    ctx.fillStyle='#3ac06a'; puff(-s*0.22,-s*0.04,s*0.10); puff(s*0.22,-s*0.04,s*0.10);
    ctx.fillStyle='#1a1a1a'; ctx.save(); ctx.scale(0.5,1); puff(-s*0.44,-s*0.04,s*0.085); puff(s*0.44,-s*0.04,s*0.085); ctx.restore();
    ctx.fillStyle='#fff'; puff(-s*0.20,-s*0.08,s*0.03); puff(s*0.24,-s*0.08,s*0.03);
    ctx.fillStyle='#ff8aa0'; ctx.beginPath(); ctx.moveTo(0,s*0.13); ctx.lineTo(-s*0.07,s*0.05); ctx.lineTo(s*0.07,s*0.05); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#6a5a5a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,s*0.13); ctx.lineTo(0,s*0.19); ctx.arc(-s*0.06,s*0.19,s*0.06,0,Math.PI); ctx.moveTo(0,s*0.19); ctx.arc(s*0.06,s*0.19,s*0.06,0,Math.PI); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-s*0.12,s*0.06); ctx.lineTo(-s*0.56,s*0.0); ctx.moveTo(-s*0.12,s*0.10); ctx.lineTo(-s*0.57,s*0.13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.12,s*0.06); ctx.lineTo(s*0.56,s*0.0); ctx.moveTo(s*0.12,s*0.10); ctx.lineTo(s*0.57,s*0.13); ctx.stroke();
