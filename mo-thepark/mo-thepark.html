<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO The Park</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#173a1a;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.18,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function swish(){ bp(900,0.11,'triangle',0.2); setTimeout(function(){bp(1350,0.12,'triangle',0.16);},65); }
function whoosh(){ bp(420,0.1,'sine',0.14); }
function bark(){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); [0,0.12].forEach(function(o){ var os=a.createOscillator(),g=a.createGain(),bpf=a.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=900; os.type='sawtooth'; os.frequency.setValueAtTime(420,a.currentTime+o); os.frequency.exponentialRampToValueAtTime(190,a.currentTime+o+0.1); g.gain.setValueAtTime(0.26,a.currentTime+o); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+o+0.12); os.connect(bpf);bpf.connect(g);g.connect(a.destination); os.start(a.currentTime+o); os.stop(a.currentTime+o+0.13); }); }

// ===== controls =====
var JB={x:66,y:H-58,r:44}, AB={x:W-56,y:H-56,r:40}, BB={x:W-116,y:H-94,r:32};
var joyId=null,joyX=0,joyY=0,aId=null,bId=null;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+8; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(inC(p,BB)){ bId=e.pointerId; onB(); return; }
  if(inC(p,AB)){ aId=e.pointerId; onA(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; if(e.pointerId===bId)bId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

// ===== world =====
var RIM={x:W/2,y:118,w:26};
var mo={x:W/2,y:H-220,fx:0,fy:-1,step:0};
var arff={x:W/2-40,y:H-190,st:'follow'};
var ball={state:'held',x:0,y:0,vx:0,vy:0,t:0,make:false,tx:0,ty:0};
var baskets=0, fetches=0, msg='', msgT=0;
var flowers=[], trees=[[46,240],[W-46,250],[60,H-260],[W-60,H-250],[W/2-120,180],[W/2+120,180]];
for(var i=0;i<10;i++)flowers.push({x:40+Math.random()*(W-80),y:230+Math.random()*(H-420),c:['#ff6ab0','#ffd23f','#ff8a3a','#b06aff','#fff'][i%5]});
var butterflies=[{x:120,y:300,p:0},{x:280,y:420,p:2}];
var duck={x:70,y:H-120,p:0};
function showMsg(t){ msg=t; msgT=1.4; }

function inShootZone(){ return mo.y<340 && Math.abs(mo.x-RIM.x)<130; }
function onA(){ if(ball.state!=='held')return; if(!inShootZone()){ showMsg('Walk near the hoop! 🏀'); return; }
  ball.state='shot'; ball.t=0; ball.sx=mo.x; ball.sy=mo.y-24; ball.make=Math.abs(mo.x-RIM.x)<70?(Math.random()<0.85):(Math.random()<0.4); whoosh(); }
function onB(){ if(ball.state!=='held')return; // throw for Arff to fetch
  ball.state='thrown'; var d=140; ball.x=clamp(mo.x+mo.fx*d,30,W-30); ball.y=clamp(mo.y+mo.fy*d,200,H-150); ball.gx=ball.x; ball.gy=ball.y; ball.fromx=mo.x; ball.fromy=mo.y-24; ball.t=0; arff.st='fetch'; whoosh(); showMsg('Fetch, Arff! 🦴'); }

function upd(dt){ if(msgT>0)msgT-=dt;
  var v=jv(); var mv=Math.hypot(v.x,v.y);
  if(mv>0.15){ mo.x=clamp(mo.x+v.x*160*dt,36,W-36); mo.y=clamp(mo.y+v.y*160*dt,200,H-150); mo.fx=v.x/mv; mo.fy=v.y/mv; mo.step+=dt*10; }
  // arff behavior
  if(arff.st==='follow'){ var tx=mo.x-mo.fx*42-22, ty=mo.y-mo.fy*42; arff.x+=(tx-arff.x)*Math.min(1,6*dt); arff.y+=(ty-arff.y)*Math.min(1,6*dt); }
  else if(arff.st==='fetch'){ var dx=ball.gx-arff.x, dy=ball.gy-arff.y, d=Math.hypot(dx,dy)||1; arff.x+=dx/d*180*dt; arff.y+=dy/d*180*dt; if(d<16){ arff.st='return'; bark(); } }
  else if(arff.st==='return'){ var dx=mo.x-arff.x, dy=mo.y-arff.y, d=Math.hypot(dx,dy)||1; arff.x+=dx/d*180*dt; arff.y+=dy/d*180*dt; ball.x=arff.x; ball.y=arff.y-14; if(d<34){ arff.st='follow'; ball.state='held'; fetches++; bark(); showMsg('Good girl Arff! 🐾'); } }
  // ball
  if(ball.state==='held'){ if(arff.st!=='return'){ ball.x=mo.x+14; ball.y=mo.y-14; } }
  else if(ball.state==='shot'){ ball.t+=dt/0.7; var t=ball.t; var x=ball.sx+(RIM.x-ball.sx)*t; var arc=Math.sin(t*Math.PI)*90; var y=ball.sy+(RIM.y-ball.sy)*t-arc; ball.x=x; ball.y=y;
    if(t>=1){ if(ball.make){ baskets+=2; swish(); showMsg('SWISH! +2 🏀'); netW=1; } else { showMsg('So close!'); } ball.state='held'; } }
  else if(ball.state==='thrown'){ ball.t+=dt/0.4; var t=Math.min(1,ball.t); ball.x=ball.fromx+(ball.gx-ball.fromx)*t; ball.y=ball.fromy+(ball.gy-ball.fromy)*t-Math.sin(t*Math.PI)*40; }
  // ambient
  butterflies.forEach(function(bf){ bf.p+=dt; bf.x+=Math.cos(bf.p)*20*dt; bf.y+=Math.sin(bf.p*1.4)*16*dt; });
  duck.p+=dt*0.5; duck.x=70+Math.sin(duck.p)*22;
  if(netW>0)netW-=dt*2;
}
var netW=0;

// ===== draw =====
function drawMo(x,y){ var b=Math.sin(mo.step)*2; cx.save(); cx.translate(x,y);
  cx.fillStyle='#2a2a5a'; cx.fillRect(-9,16+b,7,18); cx.fillRect(2,16-b,7,18); cx.fillStyle='#fff'; cx.fillRect(-10,32+b,8,6); cx.fillRect(2,32-b,8,6);
  cx.fillStyle='#e0563b'; rr(-13,-6,26,26,6); cx.fill();
  cx.strokeStyle='#8a5a34'; cx.lineWidth=6; cx.lineCap='round'; cx.beginPath(); cx.moveTo(-11,0); cx.lineTo(-17,14); cx.moveTo(11,0); cx.lineTo(17,14); cx.stroke();
  cx.fillStyle='#8a5a34'; cx.beginPath(); cx.arc(0,-20,12,0,7); cx.fill(); cx.fillStyle='#e0563b'; cx.fillRect(-12,-26,24,5);
  cx.fillStyle='#201810'; cx.beginPath(); cx.arc(0,-27,12,Math.PI,0); cx.fill();
  cx.fillStyle='#fff'; cx.beginPath(); cx.arc(-4,-19,2.2,0,7); cx.arc(4,-19,2.2,0,7); cx.fill(); cx.fillStyle='#201008'; cx.beginPath(); cx.arc(-4,-19,1.1,0,7); cx.arc(4,-19,1.1,0,7); cx.fill();
  cx.restore(); }
function drawArff(x,y){ cx.save(); cx.translate(x,y);
  cx.fillStyle='#fff'; cx.beginPath(); cx.ellipse(0,0,16,11,0,0,7); cx.fill();
  cx.fillStyle='#fff'; cx.beginPath(); cx.arc(13,-6,9,0,7); cx.fill(); // head
  cx.fillStyle='#f0eae4'; cx.beginPath(); cx.ellipse(9,-13,4,7,0.3,0,7); cx.fill(); // ear
  cx.fillStyle='#2a2018'; cx.beginPath(); cx.arc(16,-7,1.8,0,7); cx.fill(); cx.beginPath(); cx.arc(19,-4,2,0,7); cx.fill(); // nose
  cx.fillStyle='#ff7ab0'; cx.beginPath(); cx.arc(0,4,3,0,7); cx.fill(); // collar dot
  cx.fillStyle='#fff'; cx.fillRect(-12,8,5,7); cx.fillRect(-2,8,5,7); cx.fillRect(8,8,5,7); // legs
  cx.fillStyle='#fff'; cx.beginPath(); cx.ellipse(-16,-4,6,4,0.6,0,7); cx.fill(); // tail
  cx.restore(); }
function draw(){ // grass
  var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#7ec850'); g.addColorStop(1,'#4ea63a'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // path
  cx.fillStyle='#d9c39a'; cx.beginPath(); cx.moveTo(W/2-40,H); cx.quadraticCurveTo(W/2+30,H/2,W/2-20,150); cx.lineTo(W/2+30,150); cx.quadraticCurveTo(W/2+80,H/2,W/2+40,H); cx.fill();
  // pond
  cx.fillStyle='#5ab0e0'; cx.beginPath(); cx.ellipse(66,H-120,52,34,0,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.3)'; cx.beginPath(); cx.ellipse(56,H-128,20,10,0,0,7); cx.fill();
  emoji('🦆',duck.x,duck.y,22);
  // flowers
  flowers.forEach(function(f){ cx.fillStyle=f.c; cx.beginPath(); cx.arc(f.x,f.y,4,0,7); cx.fill(); cx.fillStyle='#2f9e57'; cx.fillRect(f.x-1,f.y,2,7); });
  // bench
  emoji('🪑',W-70,H-300,30);
  // hoop: pole + backboard + rim + net
  cx.fillStyle='#7a5a3a'; cx.fillRect(RIM.x-4,RIM.y,8,120);
  cx.fillStyle='#fff'; rr(RIM.x-22,RIM.y-40,44,34,4); cx.fill(); cx.strokeStyle='#e0563b'; cx.lineWidth=3; cx.strokeRect(RIM.x-11,RIM.y-24,22,16);
  cx.strokeStyle='#e0563b'; cx.lineWidth=5; cx.beginPath(); cx.moveTo(RIM.x-RIM.w,RIM.y); cx.lineTo(RIM.x+RIM.w,RIM.y); cx.stroke();
  cx.strokeStyle='rgba(255,255,255,.85)'; cx.lineWidth=1.4; for(var i=0;i<6;i++){ var t=i/5; var tx=RIM.x-RIM.w+t*RIM.w*2; var bx=RIM.x-RIM.w*0.5+t*RIM.w+Math.sin(netW*6+i)*netW*3; cx.beginPath(); cx.moveTo(tx,RIM.y); cx.lineTo(bx,RIM.y+22); cx.stroke(); }
  // trees (draw behind-ish)
  trees.forEach(function(t){ emoji('🌳',t[0],t[1],44); });
  // shoot zone hint
  if(inShootZone() && ball.state==='held'){ cx.fillStyle='rgba(255,210,63,.25)'; cx.beginPath(); cx.ellipse(RIM.x,RIM.y+90,120,40,0,0,7); cx.fill(); }
  // characters (order by y for depth-ish)
  var ents=[{y:mo.y,f:function(){drawMo(mo.x,mo.y);}},{y:arff.y,f:function(){drawArff(arff.x,arff.y);}}];
  ents.sort(function(a,b){return a.y-b.y;}); ents.forEach(function(e){e.f();});
  // ball
  if(ball.state!=='held' || arff.st==='return'){ emoji('🏀',ball.x,ball.y,20); } else { emoji('🏀',mo.x+16,mo.y-8,16); }
  // butterflies
  butterflies.forEach(function(bf){ emoji('🦋',bf.x,bf.y,18); });
  // HUD
  cx.fillStyle='rgba(10,30,10,.55)'; rr(8,8,W-16,32,10); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 14px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🏞️ MO The Park',14,30);
  cx.textAlign='right'; cx.fillStyle='#ffd23f'; cx.fillText('🏀 '+baskets+'   🦴 '+fetches,W-14,30);
  if(msgT>0){ cx.globalAlpha=Math.min(1,msgT*1.5); cx.textAlign='center'; cx.fillStyle='#fff'; cx.font='bold 20px Trebuchet MS'; cx.fillText(msg,W/2,H/2-60); cx.globalAlpha=1; }
  // controls
  var v=jv(); cx.fillStyle='rgba(255,255,255,.14)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.45)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.6)';cx.font='bold 10px Trebuchet MS';cx.textAlign='center';cx.fillText('WALK',JB.x,JB.y+JB.r+12);
  cx.fillStyle=aId!==null?'#ffd23f':'rgba(255,210,63,.9)'; cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle='#2a1400'; cx.font='bold 20px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('A',AB.x,AB.y); cx.textBaseline='alphabetic'; cx.fillStyle='#ffd23f';cx.font='bold 9px Trebuchet MS';cx.fillText('SHOOT',AB.x,AB.y+AB.r+11);
  cx.fillStyle=bId!==null?'#ff5ad0':'#c14fe0'; cx.beginPath(); cx.arc(BB.x,BB.y,BB.r,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 17px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('B',BB.x,BB.y); cx.textBaseline='alphabetic'; cx.fillStyle='#e6b0ff';cx.font='bold 9px Trebuchet MS';cx.fillText('FETCH',BB.x,BB.y+BB.r+10);
}
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window._PK={ get baskets(){return baskets;}, get fetches(){return fetches;}, moveTo:function(x,y){mo.x=x;mo.y=y;}, a:function(){onA();}, b:function(){onB();}, get arff(){return arff.st;} };
})();
</script>
</body>
</html>
