<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Space Mission</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#05061a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(5,6,26,.72);}
  #obox{background:#12143a;border:3px solid #b06ae0;color:#fff;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#c99aff;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#b06ae0;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="over"><div id="obox"><h1>🚀 MO Space Mission</h1><div id="omsg">Drag to fly your ship anywhere.<br>Collect crystals 💎 around the planets, dodge asteroids!</div><button id="go">LAUNCH</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  var playing=false, score=0, fuel=0, best=+(localStorage.getItem('moSpaceMBest')||0);
  var sx=0,sy=0,tx=0,ty=0, crystals=[], rocks=[], planets=[], stars=[], t=0;
  for(var i=0;i<60;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*2+1});
  function reset(){ sx=W/2; sy=H*0.7; tx=sx; ty=sy; score=0; fuel=100*60; crystals=[]; rocks=[]; planets=[];
    for(var i=0;i<3;i++)planets.push({x:Math.random()*W,y:H*(0.15+i*0.22),r:W*(0.08+Math.random()*0.05),col:['#e0803a','#3aa0e0','#7bcf7b','#e0439a'][i%4]});
    for(var i=0;i<8;i++)addCrystal(); t=0; }
  function addCrystal(){ crystals.push({x:30+Math.random()*(W-60),y:30+Math.random()*(H-120),ph:Math.random()*6,got:false}); }
  function ac(){ try{ return ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function loop(){ t++;
    x.fillStyle='#05061a'; x.fillRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){ var s=stars[i]; x.fillStyle='rgba(255,255,255,'+(0.3+s.s*0.2)+')'; x.fillRect(s.x*W,s.y*H,s.s,s.s); }
    for(var i=0;i<planets.length;i++){ var pl=planets[i]; x.fillStyle=pl.col; x.beginPath(); x.arc(pl.x,pl.y,pl.r,0,7); x.fill(); x.fillStyle='rgba(0,0,0,0.15)'; x.beginPath(); x.arc(pl.x+pl.r*0.3,pl.y-pl.r*0.2,pl.r*0.5,0,7); x.fill(); }
    sx+=(tx-sx)*0.16; sy+=(ty-sy)*0.16;
    if(playing){ fuel--; if(fuel<=0){ playing=false; over(); }
      if(t%80===0 && crystals.filter(function(c){return !c.got;}).length<6)addCrystal();
      if(t%Math.max(40,80-Math.floor(score/5))===0){ var side=Math.random()<0.5; rocks.push({x:side?-30:W+30,y:Math.random()*H,vx:(side?1:-1)*(2+Math.random()*2.5+score*0.02),vy:(Math.random()-0.5)*2,r:14+Math.random()*14,rot:Math.random()*6}); }
    }
    for(var j=crystals.length-1;j>=0;j--){ var c=crystals[j]; if(c.got)continue; c.ph+=0.08; var yy=c.y+Math.sin(c.ph)*4;
      x.save(); x.translate(c.x,yy); x.fillStyle='#3ad0e0'; x.beginPath(); x.moveTo(0,-13); x.lineTo(10,0); x.lineTo(0,13); x.lineTo(-10,0); x.closePath(); x.fill(); x.fillStyle='#bff4ff'; x.beginPath(); x.moveTo(0,-13); x.lineTo(4,-2); x.lineTo(-4,-2); x.fill(); x.restore();
      if(Math.hypot(c.x-sx,yy-sy)<30){ c.got=true; score+=5; fuel=Math.min(120*60,fuel+8*60); beep(1100); } }
    for(var k=rocks.length-1;k>=0;k--){ var r=rocks[k]; r.x+=r.vx; r.y+=r.vy; r.rot+=0.05; x.save(); x.translate(r.x,r.y); x.rotate(r.rot); x.fillStyle='#8a7a6a'; x.beginPath(); for(var a=0;a<8;a++){ var an=a/8*6.283, rr2=r.r*(0.8+((a*37)%10)/25); x.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2);} x.closePath(); x.fill(); x.restore();
      if(playing && Math.hypot(r.x-sx,r.y-sy)<r.r+16){ playing=false; over(); } if(r.x<-60||r.x>W+60)rocks.splice(k,1); }
    // ship
    x.save(); x.translate(sx,sy); var ang=Math.atan2(ty-sy,tx-sx); x.rotate(ang+Math.PI/2);
    x.fillStyle='#ffb04a'; x.beginPath(); x.moveTo(-7,16); x.lineTo(0,16+14+Math.random()*8); x.lineTo(7,16); x.fill();
    x.fillStyle='#e2342f'; x.beginPath(); x.moveTo(0,-24); x.quadraticCurveTo(15,-6,12,16); x.lineTo(-12,16); x.quadraticCurveTo(-15,-6,0,-24); x.fill();
    x.fillStyle='#bfe3ff'; x.beginPath(); x.arc(0,-4,7,0,7); x.fill(); x.fillStyle='#e2342f'; x.beginPath(); x.moveTo(-12,16); x.lineTo(-20,26); x.lineTo(-12,26); x.fill(); x.beginPath(); x.moveTo(12,16); x.lineTo(20,26); x.lineTo(12,26); x.fill(); x.restore();
    x.fillStyle='#fff'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='left'; x.fillText('💎 '+score, 14, 40);
    // fuel bar
    x.fillStyle='#333'; x.fillRect(W*0.3,20,W*0.4,12); x.fillStyle=fuel<20*60?'#e2342f':'#3ad05a'; x.fillRect(W*0.3,20,W*0.4*Math.max(0,fuel/(120*60)),12); x.fillStyle='#fff'; x.font='900 12px Trebuchet MS'; x.textAlign='center'; x.fillText('FUEL',W*0.5,30);
    x.textAlign='right'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('Best '+best, W-14, 36);
    requestAnimationFrame(loop);
  }
  function over(){ beep(160,0.4); if(score>best){ best=score; try{localStorage.setItem('moSpaceMBest',score);}catch(e){} }
    document.getElementById('omsg').innerHTML='You collected <b>'+score+'</b> crystals!<br>Best: '+best; document.getElementById('go').textContent='LAUNCH AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  var down=false; function set(cx,cy){ tx=Math.max(20,Math.min(W-20,cx)); ty=Math.max(20,Math.min(H-20,cy)); }
  cv.addEventListener('pointerdown',function(e){ down=true; set(e.clientX,e.clientY); }); cv.addEventListener('pointermove',function(e){ if(down)set(e.clientX,e.clientY); }); addEventListener('pointerup',function(){ down=false; });
  document.getElementById('over').style.display='flex'; loop();
})();
</script>
</body></html>
