<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Dog Farm</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#3a7a2a;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
 a.back{position:fixed;top:8px;left:10px;color:#fff;opacity:.95;text-decoration:none;font-size:13px;z-index:5;font-weight:bold;text-shadow:0 1px 3px #000;}
</style>
</head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function woof(){ bp(430,0.1,'square',0.13); setTimeout(function(){bp(310,0.12,'square',0.11);},80); }
function care(){ bp(680,0.08,'triangle',0.16); setTimeout(function(){bp(940,0.09,'triangle',0.16);},70); }
function no(){ bp(200,0.1,'square',0.1); }
function fanfare(){ [660,880,990,1180].forEach(function(f,i){ setTimeout(function(){ bp(f,0.14,'triangle',0.16); },i*120); }); }

var JB={x:66,y:H-58,r:44}, AB={x:W-58,y:H-60,r:46};
var joyId=null,joyX=0,joyY=0,aId=null;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+10; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(won){ if(p.x>PB.x-PB.w/2&&p.x<PB.x+PB.w/2&&p.y>PB.y-PB.h/2&&p.y<PB.y+PB.h/2){ care(); restart(); } return; }
  if(inC(p,AB)){ aId=e.pointerId; doCare(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

var mo={x:W/2,y:H-168,step:0}, dir=1;
var NEEDS=[['feed','🍖','Fed'],['wash','🛁','Washed'],['play','🎾','Played with'],['vet','🩺','Vet-checked'],['water','💧','Watered'],['brush','✂️','Brushed']];
var COLORS=['#ffffff','#c9a46a','#8a5a34','#4a4a4a','#e6ddc8','#d8a860'];
var DOG_NAMES=['Biscuit','Rocky','Luna','Buddy','Daisy','Max','Bella','Cooper','Coco','Scout','Pepper','Ziggy','Mango','Olive'];
var dogs=[];
function makeDogs(){ dogs=[]; for(var i=0;i<8;i++){ dogs.push({x:40+Math.random()*(W-80), y:120+Math.random()*(H-300), tx:0,ty:0, wt:0, step:Math.random()*6, dir:Math.random()<0.5?1:-1, col:COLORS[i%COLORS.length], arff:i===0, name:i===0?'Arff':DOG_NAMES[Math.floor(Math.random()*DOG_NAMES.length)], need:null, bub:0, hearts:0, showName:0}); } }
var day=1, MAXDAY=10, coins=0, cared=0, QUOTA=8, won=false, needCd=0.5, msg='🐾 Run Mo to a dog that needs you, then press DO!', msgT=3.8, pops=[], t=0;
var PB={x:W/2,y:H*0.66,w:200,h:62};
function d(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function moveTo(o,tx,ty,sp){ var dx=tx-o.x, dy=ty-o.y, m=Math.hypot(dx,dy); if(m<1)return; o.x+=dx/m*Math.min(sp,m); o.y+=dy/m*Math.min(sp,m); if(dx<-0.5)o.dir=-1; else if(dx>0.5)o.dir=1; }
function showMsg(x){ msg=x; msgT=1.9; }
function giveNeed(){ var free=dogs.filter(function(dg){return !dg.need;}); if(!free.length) return; var dg=free[Math.floor(Math.random()*free.length)]; dg.need=NEEDS[Math.floor(Math.random()*NEEDS.length)]; dg.bub=0; }
function nearestNeedy(){ var best=null,bd=50; for(var i=0;i<dogs.length;i++){ var dg=dogs[i]; if(!dg.need)continue; var dd=d(mo,dg); if(dd<bd){ bd=dd; best=dg; } } return best; }
function newDay(){ cared=0; makeDogs(); mo.x=W/2; mo.y=H-168; for(var i=0;i<3;i++) giveNeed();
  // a new dog arrives at the gate to be welcomed (ideas 1-5)
  var nw=dogs[1]; nw.x=W/2; nw.y=86; nw.tx=W/2; nw.ty=130; nw.need=['welcome','👋','Welcomed']; nw.name=DOG_NAMES[Math.floor(Math.random()*DOG_NAMES.length)]; nw.isNew=true; }
function doCare(){ if(won) return; var dg=nearestNeedy();
  if(!dg){ showMsg('🐾 Find a dog with a bubble, run to it, then press DO!'); no(); return; }
  var isWelcome=dg.need[0]==='welcome', did=dg.need[2]; dg.need=null; dg.isNew=false; dg.hearts=1.4; dg.showName=2.2; cared++; coins+=(isWelcome?3:2); care(); woof();
  for(var i=0;i<12;i++) pops.push({x:dg.x,y:dg.y-16,vx:(Math.random()-0.5)*130,vy:-Math.random()*130-30,t:0.7,e:['💛','⭐','✨','🪙'][i%4]});
  if(cared>=QUOTA){ coins+=10; fanfare(); if(day>=MAXDAY){ won=true; return; } day++; newDay(); showMsg('🎉 Day '+(day-1)+' done! +10 🪙 — Day '+day+' at the dog farm!'); }
  else if(isWelcome){ showMsg('👋 Welcomed '+dg.name+' to the farm! ('+cared+'/'+QUOTA+')'); setTimeout(giveNeed,600); }
  else { showMsg('🐶 '+did+' '+dg.name+'! ('+cared+'/'+QUOTA+')'); setTimeout(giveNeed,600); }
}
function restart(){ day=1; coins=0; won=false; pops=[]; newDay(); showMsg('🐾 Care for the dogs — run to one that needs you!'); }
function upd(dt){ t+=dt; if(msgT>0)msgT-=dt;
  var v=jv(); var mv=Math.hypot(v.x,v.y); if(mv>0.15){ mo.x=clamp(mo.x+v.x*175*dt,22,W-22); mo.y=clamp(mo.y+v.y*175*dt,104,H-150); mo.step+=dt*11; if(v.x<-0.1)dir=-1; else if(v.x>0.1)dir=1; }
  // dogs roam & play (watch them!)
  for(var i=0;i<dogs.length;i++){ var dg=dogs[i]; dg.wt-=dt; if(dg.wt<=0){ dg.tx=40+Math.random()*(W-80); dg.ty=120+Math.random()*(H-300); dg.wt=1.5+Math.random()*2.5; } moveTo(dg,dg.tx,dg.ty,(dg.need?28:46)*dt); dg.step+=dt*(mv>0.1?0:8)+ (d(dg,{x:dg.tx,y:dg.ty})>4?dt*9:0); if(dg.bub<1)dg.bub+=dt*2; if(dg.hearts>0)dg.hearts-=dt; if(dg.showName>0)dg.showName-=dt; }
  // steady supply of needs
  needCd-=dt; if(needCd<=0){ if(dogs.filter(function(x){return x.need;}).length<4) giveNeed(); needCd=2.2+Math.random()*1.5; }
  for(var i=pops.length-1;i>=0;i--){ var p=pops[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=380*dt; p.t-=dt; if(p.t<=0)pops.splice(i,1); }
}
function drawDog(dg){ var x=dg.x,y=dg.y, bob=Math.sin(dg.step)*1.6; cx.save(); cx.translate(x,y+bob); cx.scale(dg.dir,1);
  cx.strokeStyle=dg.col; cx.lineWidth=4; cx.lineCap='round'; cx.beginPath(); cx.moveTo(-11,-2); cx.quadraticCurveTo(-19,-7,-16,-13+Math.sin(dg.step*2)*3); cx.stroke();
  var ls=Math.sin(dg.step)*2.5; cx.fillStyle=dg.col; cx.fillRect(-9,7+ls,4,8); cx.fillRect(5,7-ls,4,8);
  cx.fillStyle=dg.col; rr(-12,-7,24,15,7); cx.fill();
  cx.beginPath(); cx.arc(11,-7,9,0,7); cx.fill();
  cx.fillStyle=dg.col==='#ffffff'?'#e0e0e0':'rgba(0,0,0,0.18)'; cx.beginPath(); cx.ellipse(7,-14,3.5,6,-0.4,0,7); cx.fill();
  cx.fillStyle=dg.col; cx.beginPath(); cx.arc(18,-4,4,0,7); cx.fill(); cx.fillStyle='#2a1a12'; cx.beginPath(); cx.arc(20,-4,1.8,0,7); cx.fill();
  cx.fillStyle='#2a1a12'; cx.beginPath(); cx.arc(12,-9,1.6,0,7); cx.fill();
  cx.restore();
  if(dg.arff){ cx.fillStyle='#fff'; cx.font='bold 8px Trebuchet MS'; cx.textAlign='center'; cx.fillText('ARFF',x,y+bob+18); }
  else if(dg.showName>0){ cx.globalAlpha=Math.min(1,dg.showName); cx.fillStyle='#fff'; cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=3; cx.font='bold 10px Trebuchet MS'; cx.textAlign='center'; cx.strokeText(dg.name,x,y+bob+20); cx.fillText(dg.name,x,y+bob+20); cx.globalAlpha=1; }
  if(dg.hearts>0){ cx.globalAlpha=Math.min(1,dg.hearts); emoji('💛',x+10,y-18,13); cx.globalAlpha=1; }
  // need bubble
  if(dg.need){ var by=y-24-Math.sin(t*3)*2, near=nearestNeedy()===dg; cx.save(); cx.globalAlpha=Math.min(1,dg.bub); cx.fillStyle='#fff'; if(near){ cx.strokeStyle='#ffd23f'; cx.lineWidth=2.5; } rr(x-13,by-13,26,22,7); cx.fill(); if(near)cx.stroke(); cx.fillStyle='#fff'; cx.beginPath(); cx.moveTo(x-3,by+9); cx.lineTo(x+3,by+9); cx.lineTo(x,by+15); cx.fill(); cx.restore(); emoji(dg.need[1],x,by-2,15); }
}
function draw(){
  cx.fillStyle='#4ea63a'; cx.fillRect(0,0,W,H); cx.fillStyle='#43992f'; for(var y=0;y<H;y+=28)for(var x=(y/28%2)*28;x<W;x+=56)cx.fillRect(x,y,28,14);
  // Mo's dog farm sign + Mo's house + a couple dog houses
  cx.fillStyle='#8a5a2e'; rr(W/2-80,48,160,22,6); cx.fill(); cx.fillStyle='#ffd23f'; cx.font='bold 13px Trebuchet MS'; cx.textAlign='center'; cx.fillText("🐾 MO'S DOG FARM",W/2,63);
  emoji('🏠',46,96,26); emoji('🏠',W-46,96,26);
  // dogs (sorted by y for depth)
  var ds=dogs.slice().sort(function(a,b){return a.y-b.y;});
  for(var i=0;i<ds.length;i++) drawDog(ds[i]);
  // Mo the caretaker
  (function(){ var b=Math.sin(mo.step)*2; cx.save(); cx.translate(mo.x,mo.y); cx.save(); cx.scale(dir,1);
    cx.fillStyle='#2a2a50'; cx.fillRect(-7,14+b,6,14); cx.fillRect(2,14-b,6,14);
    cx.fillStyle='#3a86e0'; rr(-11,-6,22,22,6); cx.fill();
    cx.fillStyle='#8a5a34'; cx.beginPath(); cx.arc(0,-16,10,0,7); cx.fill();
    cx.fillStyle='#4a3020'; cx.beginPath(); cx.arc(0,-20,9,Math.PI,0); cx.fill();
    cx.fillStyle='#fff'; cx.beginPath(); cx.arc(-3.5,-15,2,0,7); cx.arc(3.5,-15,2,0,7); cx.fill(); cx.fillStyle='#201008'; cx.beginPath(); cx.arc(-3.5,-15,1,0,7); cx.arc(3.5,-15,1,0,7); cx.fill();
    cx.restore(); cx.restore();
    cx.fillStyle='#fff'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.fillText('MO',mo.x,mo.y+b+30); })();
  // pops
  pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.5); emoji(p.e,p.x,p.y,16); cx.globalAlpha=1; });
  // HUD
  cx.fillStyle='rgba(10,30,10,.55)'; rr(8,8,W-16,32,10); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 12px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🐕 Day '+day+'/'+MAXDAY,14,30); cx.textAlign='center'; cx.fillStyle='#ffe6b0'; cx.fillText('🐾 '+cared+'/'+QUOTA+' cared',W/2,30); cx.textAlign='right'; cx.fillStyle='#ffd23f'; cx.fillText('🪙 '+coins,W-14,30);
  if(msgT>0){ cx.globalAlpha=Math.min(1,msgT*1.4); cx.textAlign='center'; cx.fillStyle='#fff'; cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=4; cx.font='bold 15px Trebuchet MS'; cx.strokeText(msg,W/2,H-176); cx.fillText(msg,W/2,H-176); cx.globalAlpha=1; }
  // controls
  var v=jv(); cx.fillStyle='rgba(255,255,255,.16)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill(); cx.fillStyle='rgba(0,0,0,.4)';cx.font='bold 10px Trebuchet MS';cx.textAlign='center';cx.fillText('RUN',JB.x,JB.y+JB.r+12);
  cx.fillStyle=aId!==null?'#ffd23f':'rgba(255,210,63,.95)'; cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle='#2a1400'; cx.font='bold 15px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('CARE',AB.x,AB.y); cx.textBaseline='alphabetic';
  if(won){ cx.fillStyle='rgba(8,20,8,0.82)'; cx.fillRect(0,0,W,H); cx.textAlign='center';
    cx.fillStyle='#ffd23f'; cx.font='bold 32px Trebuchet MS'; cx.fillText('🎉 YOU WIN! 🎉',W/2,H*0.30);
    cx.fillStyle='#fff'; cx.font='bold 16px Trebuchet MS'; cx.fillText('You cared for the dogs all '+MAXDAY+' days!',W/2,H*0.40);
    cx.fillStyle='#ffe6b0'; cx.font='bold 22px Trebuchet MS'; cx.fillText('🪙 TOTAL: '+coins+' coins',W/2,H*0.49);
    cx.fillStyle='#2ec46a'; rr(PB.x-PB.w/2,PB.y-PB.h/2,PB.w,PB.h,14); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 22px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('▶ PLAY AGAIN',PB.x,PB.y); cx.textBaseline='alphabetic';
    pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.5); emoji(p.e,p.x,p.y,18); cx.globalAlpha=1; }); }
}
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
newDay();
requestAnimationFrame(frame);
window._DF={ get day(){return day;}, get coins(){return coins;}, get cared(){return cared;}, get quota(){return QUOTA;}, get won(){return won;}, get needy(){return dogs.filter(function(x){return x.need;}).length;}, toNeedy:function(){ for(var i=0;i<dogs.length;i++) if(dogs[i].need){ mo.x=dogs[i].x; mo.y=dogs[i].y; return true; } return false; }, give:function(){giveNeed();}, act:function(){doCare();}, restart:function(){restart();} };
})();
</script>
