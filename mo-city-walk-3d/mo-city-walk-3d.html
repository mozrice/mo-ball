<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MO CITY 3D</title>
<style>
  html,body { margin:0; height:100%; background:#0a0e16; overflow:hidden; font-family:'Trebuchet MS',system-ui,sans-serif; }
  #stage { position:absolute; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; image-rendering:auto; }
  #hud { position:absolute; top:10px; left:12px; right:12px; z-index:3; display:flex; gap:10px; color:#fff; font-weight:bold; text-shadow:0 2px 3px #0009; pointer-events:none; }
  #hud .pill { background:linear-gradient(#22303ecc,#141c26cc); padding:6px 12px; border-radius:20px; border:1px solid #ffffff22; font-size:16px; }
  #here { margin-left:auto; }
  #fwd { position:absolute; right:24px; bottom:104px; }
  #bak { position:absolute; right:24px; bottom:22px; }
  #tl  { position:absolute; left:20px; bottom:60px; }
  #tr  { position:absolute; left:96px; bottom:60px; }
  .rb { z-index:4; width:70px; height:70px; border-radius:16px; border:none; font-size:26px; color:#04203f; background:linear-gradient(#bfe0ff,#6aa8e6); box-shadow:0 5px 0 #3f6f9e; cursor:pointer; }
  .rb:active { transform:translateY(4px); box-shadow:0 1px 0 #3f6f9e; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; z-index:6; background:#0a1018cc; }
  .overlay.hide { display:none; }
  .card { background:#22303eee; border:3px solid #7be0a0; border-radius:22px; padding:22px 26px; max-width:92%; color:#fff; box-shadow:0 20px 60px #000a; }
  .card h1 { margin:0 0 6px; font-size:28px; color:#a7f0c0; }
  .card p { margin:8px 0; line-height:1.35; }
  .big { margin-top:14px; padding:14px 28px; font-size:20px; font-weight:bold; background:linear-gradient(#ffe07a,#f0b429); color:#5a3d00; border:none; border-radius:14px; box-shadow:0 4px 0 #b8922a; cursor:pointer; }
  .big:active { transform:translateY(4px); box-shadow:0 1px 0 #b8922a; }
  #enterBtn { position:absolute; left:50%; transform:translateX(-50%); bottom:36px; z-index:5; display:none; padding:16px 34px; font-size:22px; font-weight:bold; border:none; border-radius:18px; background:linear-gradient(#9bf0b0,#3fbf6a); color:#04351a; box-shadow:0 6px 0 #2a824a; cursor:pointer; animation:entpulse 0.9s ease-in-out infinite; }
  #enterBtn.show { display:block; }
  #enterBtn:active { transform:translateX(-50%) translateY(4px); box-shadow:0 1px 0 #2a824a; }
  @keyframes entpulse { 0%,100%{ box-shadow:0 6px 0 #2a824a, 0 0 0 0 rgba(90,240,150,0.5); } 50%{ box-shadow:0 6px 0 #2a824a, 0 0 0 14px rgba(90,240,150,0); } }
  #iv { position:absolute; inset:0; z-index:5; display:none; pointer-events:none; }
  #iv.show { display:block; }
  #iv .ivb, #iv #ivExit, #iv #bathBtn, #iv #movieBtn, #iv #movieInput, #iv #funBtn { pointer-events:auto; }
  #movieBtn { position:absolute; left:50%; transform:translateX(-50%); bottom:30px; z-index:6; display:none; padding:12px 22px; font-size:16px; font-weight:bold; border:none; border-radius:16px; background:linear-gradient(#ffcf5a,#e88a2a); color:#3a2600; box-shadow:0 5px 0 #a85e12; cursor:pointer; }
  #movieBtn:active { transform:translateX(-50%) translateY(4px); box-shadow:0 1px 0 #a85e12; }
  #movieInput { position:absolute; left:50%; transform:translateX(-50%); bottom:92px; z-index:6; display:none; width:min(78%,360px); padding:11px 14px; font-size:15px; font-weight:bold; text-align:center; border:3px solid #ffcf5a; border-radius:14px; background:#12101c; color:#ffe; outline:none; }
  #movieInput::placeholder { color:#9a94a8; font-weight:normal; }
  #bathBtn { position:absolute; left:50%; transform:translateX(-50%); bottom:30px; z-index:6; display:none; padding:12px 22px; font-size:17px; font-weight:bold; border:none; border-radius:16px; background:linear-gradient(#7fd0ec,#2fa6c0); color:#043038; box-shadow:0 5px 0 #1f7a90; cursor:pointer; }
  #bathBtn:active { transform:translateX(-50%) translateY(4px); box-shadow:0 1px 0 #1f7a90; }
  .ivb { position:absolute; z-index:6; width:70px; height:70px; border-radius:16px; border:none; font-size:26px; color:#04203f; background:linear-gradient(#bfe0ff,#6aa8e6); box-shadow:0 5px 0 #3f6f9e; cursor:pointer; }
  .ivb:active { transform:translateY(4px); box-shadow:0 1px 0 #3f6f9e; }
  #ivUp { right:24px; bottom:104px; } #ivDn { right:24px; bottom:22px; }
  #ivExit { position:absolute; left:16px; bottom:26px; z-index:6; padding:12px 18px; border:none; border-radius:14px; font-size:17px; font-weight:bold; background:linear-gradient(#ffd07a,#f0a429); color:#5a3d00; box-shadow:0 4px 0 #b8822a; cursor:pointer; }
  #ivExit:active { transform:translateY(4px); box-shadow:0 1px 0 #b8822a; }
  body.inside .rb, body.inside #enterBtn, body.inside #driveBtn { display:none !important; }
  body.inroom #ivUp, body.inroom #ivDn { display:none !important; }
  #funBtn { position:absolute; left:50%; transform:translateX(-50%); bottom:92px; z-index:6; display:none; padding:12px 22px; font-size:16px; font-weight:bold; border:none; border-radius:16px; background:linear-gradient(#ffd07a,#e88a2a); color:#4a2a00; box-shadow:0 5px 0 #a85e12; cursor:pointer; }
  #funBtn:active { transform:translateX(-50%) translateY(4px); box-shadow:0 1px 0 #a85e12; }
  #musicBtn { position:absolute; top:46px; left:12px; z-index:5; padding:7px 14px; border-radius:20px; border:1px solid #ffffff33; background:linear-gradient(#3a2b6e,#241a4a); color:#fff; font-weight:bold; font-size:14px; cursor:pointer; box-shadow:0 3px 0 #1a1236; }
  #musicBtn:active { transform:translateY(3px); box-shadow:0 0 0 #1a1236; }
  #nightBtn { position:absolute; top:46px; left:170px; z-index:7; padding:7px 14px; border-radius:20px; border:1px solid #ffffff33; background:linear-gradient(#3a4a7a,#1a2440); color:#fff; font-weight:bold; font-size:14px; cursor:pointer; box-shadow:0 3px 0 #10162a; }
  #nightBtn:active { transform:translateY(3px); box-shadow:0 0 0 #10162a; }
  .actL { position:absolute; z-index:7; padding:7px 13px; border-radius:20px; border:1px solid #ffffff33; color:#fff; font-weight:bold; font-size:13px; cursor:pointer; box-shadow:0 3px 0 #0006; }
  .actL:active { transform:translateY(3px); box-shadow:0 0 0 #0006; }
  #flyBtn { top:82px; left:12px; background:linear-gradient(#e04a8a,#a02460); }
  #ballBtn { top:82px; left:104px; background:linear-gradient(#e88a2a,#b5591f); }
  #buildBtn { top:118px; left:12px; background:linear-gradient(#3aa657,#1f7a3a); }
  #copterBtn { top:118px; left:104px; background:linear-gradient(#4a90c8,#2560a0); }
  #petBtn { top:154px; left:12px; background:linear-gradient(#a06fd0,#6a3aa0); }
  #placeBtn { position:absolute; left:50%; transform:translateX(-50%); bottom:96px; z-index:7; display:none; padding:13px 26px; border-radius:16px; border:none; font-size:18px; font-weight:bold; background:linear-gradient(#8ef0a8,#2fbf6a); color:#04351a; box-shadow:0 5px 0 #1f8a4a; cursor:pointer; }
  #placeBtn:active { transform:translateX(-50%) translateY(4px); box-shadow:0 1px 0 #1f8a4a; }
  body.inside #flyBtn, body.inside #ballBtn, body.inside #buildBtn, body.inside #placeBtn, body.inside #copterBtn, body.inside #petBtn { display:none !important; }
  #meBtn { position:absolute; top:46px; right:12px; z-index:7; padding:7px 14px; border-radius:20px; border:1px solid #ffffff33; background:linear-gradient(#f0a429,#c47a12); color:#3a2600; font-weight:bold; font-size:14px; cursor:pointer; box-shadow:0 3px 0 #8a5a10; }
  #meBtn:active { transform:translateY(3px); box-shadow:0 0 0 #8a5a10; }
  #driveBtn { position:absolute; top:82px; right:12px; z-index:7; padding:7px 14px; border-radius:20px; border:1px solid #ffffff33; background:linear-gradient(#e0453a,#a52a24); color:#fff; font-weight:bold; font-size:14px; cursor:pointer; box-shadow:0 3px 0 #7a1c18; }
  #driveBtn:active { transform:translateY(3px); box-shadow:0 0 0 #7a1c18; }
  #honkBtn { position:absolute; top:118px; right:12px; z-index:7; display:none; padding:7px 14px; border-radius:20px; border:1px solid #ffffff33; background:linear-gradient(#ffd93d,#e0a800); color:#4a3400; font-weight:bold; font-size:14px; cursor:pointer; box-shadow:0 3px 0 #a87e00; }
  #honkBtn:active { transform:translateY(3px); box-shadow:0 0 0 #a87e00; }
  body.inside #honkBtn { display:none !important; }
  #carBtn { position:absolute; top:154px; right:12px; z-index:7; display:none; padding:7px 14px; border-radius:20px; border:1px solid #ffffff33; background:linear-gradient(#5aa0e0,#2f6fb0); color:#fff; font-weight:bold; font-size:13px; cursor:pointer; box-shadow:0 3px 0 #1f4f80; }
  #boostBtn { position:absolute; top:190px; right:12px; z-index:7; display:none; padding:9px 16px; border-radius:20px; border:1px solid #ffffff44; background:linear-gradient(#8ef0a8,#2fbf6a); color:#04351a; font-weight:bold; font-size:15px; cursor:pointer; box-shadow:0 4px 0 #1f8a4a; }
  #carBtn:active,#boostBtn:active { transform:translateY(3px); box-shadow:0 0 0 #1f4f80; }
  body.inside #carBtn, body.inside #boostBtn { display:none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="pill" id="coins">🪙 0</div>
    <div class="pill" id="here">🏙️ MO CITY 3D</div>
  </div>
  <button class="rb" id="fwd">▲</button>
  <button class="rb" id="bak">▼</button>
  <button class="rb" id="tl">◀</button>
  <button class="rb" id="tr">▶</button>
  <button id="musicBtn">🎵 MUSIC: OFF</button>
  <button id="nightBtn">🌙 NIGHT</button>
  <button id="flyBtn" class="actL">🦸 FLY</button>
  <button id="ballBtn" class="actL">🏀 SHOOT</button>
  <button id="buildBtn" class="actL">🧱 BUILD</button>
  <button id="copterBtn" class="actL">🚁 COPTER</button>
  <button id="petBtn" class="actL">🐾 PET</button>
  <button id="placeBtn">🧱 PLACE BLOCK</button>
  <button id="meBtn">🤳 ME</button>
  <button id="driveBtn">🚗 DRIVE</button>
  <button id="honkBtn">📣 HONK</button>
  <button id="carBtn">🎨 RED RACER</button>
  <button id="boostBtn">⚡ BOOST</button>
  <button id="enterBtn">🚪 GO IN</button>
  <div id="iv">
    <button class="ivb" id="ivUp">▲</button>
    <button class="ivb" id="ivDn">▼</button>
    <button id="ivExit">⬅ GO OUTSIDE</button>
    <button id="bathBtn">🚽 BATHROOM</button>
    <button id="funBtn">🎉 HOTEL FUN</button>
    <button id="movieBtn">🎬 NEXT MOVIE</button>
    <input id="movieInput" type="text" maxlength="26" placeholder="✏️ type a movie… try 'baseball movie'!" />
  </div>
  <div class="overlay" id="startOv">
    <div class="card">
      <h1>🏙️ MO CITY 3D</h1>
      <p>Walk around your city in first-person 3D — go anywhere!</p>
      <p><b>▲</b> walk forward, <b>▼</b> back, <b>◀ ▶</b> turn (or <b>drag</b> to look). Wander the streets and grab the golden <b>🪙 coins</b>!</p>
      <button class="big" id="startBtn">▶ EXPLORE</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  var cv=document.getElementById("c"), ctx=cv.getContext("2d"), stage=document.getElementById("stage");
  var DPR=Math.min(1.5, window.devicePixelRatio||1);
  var W=0,H=0;
  function resize(){ W=stage.clientWidth; H=stage.clientHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener("resize",resize); resize();

  var AC=null; function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
  function beep(f,d,t,v){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.type=t||"sine"; o.frequency.value=f; g.gain.value=v||0.05; o.connect(g); g.connect(a.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1)); o.stop(a.currentTime+(d||0.1)+0.02); }
  // ---- background music (different tunes + button) ----
  var MUS={idx:0,step:0,timer:null,names:["🎵 MUSIC: OFF","🎵 CITY POP","🎵 CHILL VIBES","🎮 ARCADE","🕺 DISCO","👾 8-BIT","💫 DREAMY","🎉 PARTY"],
    tunes:[ [523,659,784,659, 587,698,880,698, 523,659,784,988, 880,784,659,587],
            [440,554,659,554, 494,587,740,587, 392,494,587,494, 440,523,659,523],
            [523,0,784,784, 659,0,523,659, 587,0,880,880, 784,659,587,0],
            [587,587,880,587, 784,784,988,784, 659,659,988,659, 880,784,659,587],
            [659,784,988,784, 880,1047,880,784, 659,523,659,784, 988,880,784,659],
            [392,523,659,523, 440,587,698,587, 349,440,523,440, 392,523,659,784],
            [784,988,784,1047, 880,1047,1175,988, 784,988,1319,1047, 988,880,784,659] ],
    tempos:[230, 300, 210, 200, 175, 320, 190] };
  function mnote(f,dur,type,v){ if(!f)return; var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.type=type||"triangle"; o.frequency.value=f; var t=a.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.05,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.03); }
  function musicStep(){ if(MUS.idx===0)return; var tune=MUS.tunes[MUS.idx-1], f=tune[MUS.step%tune.length];
    mnote(f,0.26,"triangle",0.05); if(MUS.step%4===0 && f) mnote(f/2,0.55,"sine",0.045);
    MUS.step++; MUS.timer=setTimeout(musicStep, MUS.tempos[MUS.idx-1]); }
  function musicSet(i){ MUS.idx=i; if(MUS.timer){ clearTimeout(MUS.timer); MUS.timer=null; }
    var btn=document.getElementById("musicBtn"); if(btn) btn.textContent=MUS.names[i];
    if(i>0){ ac(); MUS.step=0; musicStep(); } }
  function musicCycle(){ ac(); musicSet((MUS.idx+1)%MUS.names.length); }
  function coinSfx(){ beep(880,0.05,"square",0.06); setTimeout(function(){beep(1320,0.07,"square",0.06);},45); }
  function hsh(i){ return Math.abs(Math.sin(i*12.9898)*43758.5453)%1; }

  // ---- city grid map: 0 street, >0 building (color index) ----
  var MW=48, MH=48, grid=[], bh=[], props=[], potties=[], landmarks=[], tlights=[], lightGreenV=true;
  var BPAL=["#c98f5a","#8fa8c0","#c0708a","#9fb08a","#b0a878","#7f96b0","#c8a0d0","#a0b8a0"];
  var AWN=["#e0453a","#2f9e56","#3a86e0","#e08a2a","#8a63d2"];
  var CARCOL=["#d63b3b","#2f6fd0","#f2b705","#2fa66a","#e56b1f","#8a63d2","#e8e8ee","#2b2f36"];
  var MOVIENAMES=["BASKETBALL MOVIE 3","MO DUNK SQUAD","SLAM CITY","THE BUZZER BEATER","MO BALL: THE MOVIE","HOOP DREAMS 5","DUNK KINGS 2","FAMILY FASTBREAK"];
  function build(){ props=[]; for(var y=0;y<MH;y++){ grid[y]=[]; bh[y]=[]; for(var x=0;x<MW;x++){
      var street=(x%6<2)||(y%6<2); var border=(x===0||y===0||x===MW-1||y===MH-1);
      if(border){ grid[y][x]=1; bh[y][x]=2.4; } else if(street){ grid[y][x]=0; bh[y][x]=0; }
      else { grid[y][x]=2+(Math.floor(hsh(Math.floor(x/6)*7+Math.floor(y/6)*13)*BPAL.length));
        var tp=blockType(x,y); bh[y][x]= tp==="house"?(0.82+hsh(x*7+y*5)*0.32) : tp==="hotel"?(3.0+hsh(x*3+y*9)*1.7) : tp==="apartments"?(2.4+hsh(x*5+y*11)*1.3) : tp==="garage"?(0.78) : tp==="carshop"?(0.95) : (1.2+hsh(x*13.7+y*3.1)*1.3); } } }
    // street props (trees, lamps, people) along street edges
    for(var yy=2;yy<MH-2;yy++)for(var xx=2;xx<MW-2;xx++){ if(grid[yy][xx]!==0)continue;
      // place on street tiles that border a building
      var edge = grid[yy][xx-1]>1||grid[yy][xx+1]>1||grid[yy-1][xx]>1||grid[yy+1][xx]>1;
      if(edge && hsh(xx*7.7+yy*5.3)>0.82){ var r=hsh(xx*3+yy*9); var t=r<0.4?"tree":r<0.72?"lamp":"person";
        props.push({x:xx+0.5+(hsh(xx+yy)-0.5)*0.4, y:yy+0.5+(hsh(xx*2+yy)-0.5)*0.4, t:t, col:["#e0453a","#3a86e0","#37b06a","#ffb03a","#8a63d2"][Math.floor(hsh(xx*yy)*5)]}); } }
    // porta-potties along some sidewalks
    potties=[];
    for(var yp=2;yp<MH-2;yp++)for(var xp=2;xp<MW-2;xp++){ if(grid[yp][xp]!==0)continue;
      var pe=grid[yp][xp-1]>1||grid[yp][xp+1]>1||grid[yp-1][xp]>1||grid[yp+1][xp]>1;
      if(pe && hsh(xp*2.3+yp*1.9+9.1)>0.93){ potties.push({x:xp+0.5,y:yp+0.5}); } }
    // landmarks: Ferris wheel (amusement) + fountain (park), on open street spots
    landmarks=[{x:18.5,y:18.5,t:"ferris"},{x:24.5,y:24.5,t:"fountain"},{x:30.5,y:6.5,t:"ferris"},{x:12.5,y:30.5,t:"fountain"},{x:6.5,y:12.5,t:"fountain"}];
    // extra trees around each fountain for a "park" feel
    for(var lm=0;lm<landmarks.length;lm++){ if(landmarks[lm].t==="fountain"){ for(var tt=0;tt<5;tt++){ props.push({x:landmarks[lm].x+Math.cos(tt*1.3)*1.1, y:landmarks[lm].y+Math.sin(tt*1.3)*0.8+0.6, t:"tree", col:"#37b06a"}); } } }
    // traffic lights at some intersections (both x%6<2 and y%6<2 = crossing)
    tlights=[];
    for(var yl=6;yl<MH-4;yl+=6)for(var xl=6;xl<MW-4;xl+=6){ if(hsh(xl+yl*0.7)>0.5) tlights.push({x:xl+0.15,y:yl+0.15}); }
  }
  function bcolor(v){ return v===1?"#5a6472":BPAL[(v-2)%BPAL.length]; }
  function blockType(mx,my){ var r=hsh(Math.floor(mx/6)*7.13+Math.floor(my/6)*3.77+1.7); return r<0.70?"hotel":r<0.80?"apartments":r<0.90?"shop":"carshop"; }
  function floorsFor(tp){ return tp==="hotel"?1000000:tp==="apartments"?7:tp==="shop"?3:tp==="garage"?1:2; }
  function hasHall(tp){ return tp==="hotel"||tp==="apartments"; }
  build();

  var mode="start", coins, px, py, ang, fwd,bak,tl,tr, dragX, coinsList, zbuf=[], bob=0, walkPh=0, cars=[], peds=[], nearB=null, nearGrace=0, nearPotty=null, enterTarget=null, inside=null, showMe=false, driving=false, boostHeld=false, night=false, flying=false, building=false, streetBall=null, streetScore=0, talkT=0, talkMsg="", nearTalk=null, copter=false, rotor=0;
  var mission=null, missionT=0;
  var pet=null, petX=7.5, petY=1.0, petPh=0, petName="Sparky", petHeart=0;
  var PHRASES=["Hi Mo! 👋","Nice city!","Go MO! 🏀","Cool car! 🚗","Have a great day!","Wanna play ball?","Love this town!","You're awesome!","Watch out for cars!","To the hotel! 🏨"];
  var CARS=[{c:"#e0453a",n:"RED RACER"},{c:"#2f6fd0",n:"BLUE BOLT"},{c:"#f2b705",n:"GOLD FLASH"},{c:"#37b06a",n:"GREEN MACHINE"},{c:"#8a63d2",n:"PURPLE POWER"},{c:"#2b2f36",n:"NIGHT RIDER"},{c:"#eef0f4",n:"WHITE LIGHTNING"},{c:"#e88a2a",n:"ORANGE ZOOM"}], myCarIdx=0;
  function labelFor(tp){ return tp==="hotel"?"🏨 MO HOTEL":tp==="apartments"?"🏢 MO APARTMENTS":tp==="house"?"🏠 MO HOUSE":tp==="garage"?"🅿️ MO GARAGE":tp==="carshop"?"🚗 MO CAR SHOP":"🏬 MO SHOP"; }
  function reset(){ coins=0; px=7.5; py=1.0; ang=1.5708; fwd=bak=tl=tr=false; dragX=null; bob=0; walkPh=0; petX=px; petY=py; petHeart=0;
    coinsList=[]; for(var i=0;i<80;i++){ var x=Math.floor(Math.random()*MW), y=Math.floor(Math.random()*MH); if(grid[y][x]===0) coinsList.push({x:x+0.5,y:y+0.5,got:false}); }
    // traffic: cars drive along street corridors
    cars=[]; var lanes=[];
    for(var c=0;c<MW;c+=6){ lanes.push({axis:'v',fixed:c+0.35}); lanes.push({axis:'v',fixed:c+1.65}); }

    ctx.fillStyle="#2f7fc0"; ctx.beginPath(); ctx.arc(0,0,R*0.28,0,7); ctx.fill(); ctx.fillStyle="#fff"; ctx.font="bold 14px 'Trebuchet MS'"; ctx.textAlign="center"; ctx.fillText("MO",0,5);

    ctx.fillStyle="#e9b98a"; ctx.beginPath(); ctx.arc(-R,0,13,0,7); ctx.arc(R,0,13,0,7); ctx.fill();
    ctx.restore();
  }
  function drawSelf(){ var step=Math.sin(walkPh), cx=W/2;
    // soft shadow under you
    var shg=ctx.createRadialGradient(cx,H-6,4,cx,H-6,W*0.19); shg.addColorStop(0,"rgba(0,0,0,0.28)"); shg.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=shg; ctx.beginPath(); ctx.ellipse(cx,H-6,W*0.19,20,0,0,7); ctx.fill();
    drawLeg(cx-25, step*10, -1);   // left leg
    drawLeg(cx+25, -step*10, 1);   // right leg
    drawArm(cx-72, H+12, -0.22 - step*0.16); // left arm
    drawArm(cx+72, H+12,  0.22 + step*0.16); // right arm
  }
  function drawLeg(lx, off, side){
    // jeans with shading + seam
    var jg=ctx.createLinearGradient(lx-16,0,lx+16,0); jg.addColorStop(0,"#26406e"); jg.addColorStop(0.5,"#3a5fa0"); jg.addColorStop(1,"#24395f"); ctx.fillStyle=jg;
    ctx.fillRect(lx-16, H-92+off, 32, 74);
    ctx.strokeStyle="rgba(255,255,255,0.18)"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(lx-9,H-92+off); ctx.lineTo(lx-9,H-24+off); ctx.stroke(); // seam
    ctx.fillStyle="rgba(0,0,0,0.12)"; ctx.fillRect(lx-16, H-54+off, 32, 6); // knee crease
    // sneaker: sole, upper, stripe, laces
    var sy=H-26+off;
    ctx.fillStyle="#f4f4f6"; ctx.fillRect(lx-22, sy+8, 46, 7); // white sole
    ctx.fillStyle="#e0e2e6"; ctx.fillRect(lx-22, sy+13, 46, 3);
    ctx.fillStyle="#2f7fc0"; ctx.beginPath(); ctx.moveTo(lx-22,sy+8); ctx.lineTo(lx+24,sy+8); ctx.lineTo(lx+24,sy-2); ctx.quadraticCurveTo(lx+6,sy-8,lx-22,sy-4); ctx.fill(); // blue upper
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(lx-4,sy-6); ctx.lineTo(lx+22,sy-1); ctx.lineTo(lx+22,sy+8); ctx.lineTo(lx-2,sy+8); ctx.fill(); // toe cap
    ctx.strokeStyle="#d63b3b"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(lx-20,sy+2); ctx.lineTo(lx+8,sy+4); ctx.stroke(); // red stripe
    ctx.fillStyle="#333"; for(var l=0;l<3;l++){ ctx.fillRect(lx-14+l*7, sy-4, 5, 2); } // laces
  }
  function drawArm(ax, ay, rot){ ctx.save(); ctx.translate(ax, ay); ctx.rotate(rot);
    // MO blue sleeve with gradient + cuff
    var ag=ctx.createLinearGradient(-14,0,14,0); ag.addColorStop(0,"#2568a8"); ag.addColorStop(0.5,"#3a90d0"); ag.addColorStop(1,"#2568a8"); ctx.fillStyle=ag; ctx.fillRect(-14,-104,28,116);
    ctx.fillStyle="#1f5688"; ctx.fillRect(-14,-40,28,7); // cuff
    // forearm skin
    var kg=ctx.createLinearGradient(-12,0,12,0); kg.addColorStop(0,"#d99e6f"); kg.addColorStop(0.5,"#eec294"); kg.addColorStop(1,"#d99e6f"); ctx.fillStyle=kg; ctx.fillRect(-12,-40,24,20);
    // hand + fingers
    ctx.fillStyle="#eec294"; ctx.beginPath(); ctx.arc(0,-104,16,0,7); ctx.fill();
    ctx.fillStyle="#d99e6f"; for(var f=0;f<3;f++){ ctx.fillRect(-11+f*8,-118,6,10); } // fingers
    ctx.fillStyle="#e0b184"; ctx.fillRect(-16,-108,7,10); // thumb
    ctx.restore();
  }
  function drawMinimap(){ var s=3, mx=12, my=H-12-MH*s;
    ctx.save(); ctx.globalAlpha=0.8; ctx.fillStyle="#0a1018"; ctx.fillRect(mx-2,my-2,MW*s+4,MH*s+4);
    for(var y=0;y<MH;y++)for(var x=0;x<MW;x++){ ctx.fillStyle = grid[y][x]===0?"#39424e":"#7f8a96"; if(grid[y][x]!==0&&grid[y][x]!==1) ctx.fillStyle="#9a8a6a"; ctx.fillRect(mx+x*s,my+y*s,s,s); }
    ctx.fillStyle="#ffd93d"; for(var i=0;i<coinsList.length;i++){ if(!coinsList[i].got) ctx.fillRect(mx+coinsList[i].x*s-1,my+coinsList[i].y*s-1,2,2); }
    ctx.fillStyle="#2f7fc0"; ctx.beginPath(); ctx.arc(mx+px*s,my+py*s,3,0,7); ctx.fill();
    ctx.strokeStyle="#2f7fc0"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(mx+px*s,my+py*s); ctx.lineTo(mx+px*s+Math.cos(ang)*8,my+py*s+Math.sin(ang)*8); ctx.stroke();
    ctx.restore();
  }
  function shade(hex,f){ var n=parseInt(hex.slice(1),16),R=(n>>16)&255,G=(n>>8)&255,B=n&255; return "rgb("+Math.round(R*f)+","+Math.round(G*f)+","+Math.round(B*f)+")"; }

  mode="start";
  requestAnimationFrame(frame);
})();
</script>
