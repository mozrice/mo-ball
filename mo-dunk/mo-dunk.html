<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MO DUNK CONTEST</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#20143a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;font-weight:bold;text-shadow:0 2px 0 #0007;}
  .pill{background:#0008;border-radius:20px;padding:6px 14px;font-size:17px;}
  #act{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);width:220px;height:100px;border-radius:22px;background:linear-gradient(#ff9f43,#f0722a);border:none;color:#fff;font-weight:bold;font-size:24px;box-shadow:0 6px 0 #b4541a;}
  #act:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #b4541a;}
  #hint{position:fixed;bottom:134px;left:0;right:0;text-align:center;font-size:15px;color:#e7d6ff;pointer-events:none;text-shadow:0 1px 2px #000;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#20143add;text-align:center;}
  #over h1{font-size:38px;margin:0 0 6px;color:#ffd23f;} #over p{font-size:20px;margin:4px;}
  .btn{margin-top:16px;background:linear-gradient(#ff9f43,#f0722a);border:none;color:#fff;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;box-shadow:0 5px 0 #b4541a;font-family:inherit;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill">⭐ <span id="total">0</span></div>
  <div class="pill">🏀 Dunk <span id="round">1</span>/5</div>
</div>
<button id="act">TAP</button>
<div id="hint">TAP to run, TAP to jump on the power bar, TAP in the air to spin!</div>
<div id="over"><h1 id="ot">🏆 FINAL SCORE!</h1><p id="os"></p><button class="btn" id="again">Dunk Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1,GY=0,TRAMX=0,HOOPX=0,RIMY=0;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); GY=H*0.72; TRAMX=W*0.5; HOOPX=W*0.82; RIMY=GY-160; }
  addEventListener('resize',resize); resize();
  function beep(f,d,t,v){ try{var a=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());var o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.06;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1));o.stop(a.currentTime+(d||0.1)+0.02);}catch(e){} }
  function cheer(){ beep(523,0.12,'square',0.06); setTimeout(function(){beep(784,0.16,'square',0.06);},100); }
  var phase, mo, pw, pwDir, spins, airT, airMax, total, round, judges, msg, msgT, nowv=0, confetti;
  function reset(){ total=0; round=1; confetti=[]; document.getElementById('total').textContent='0'; document.getElementById('round').textContent='1'; document.getElementById('over').style.display='none'; startDunk(); }
  function startDunk(){ phase='ready'; mo={x:W*0.14,y:GY,vy:0,rot:0}; pw=0; pwDir=1; spins=0; judges=null; msg='TAP to run! 🏃'; msgT=1; document.getElementById('act').textContent='RUN'; }
  function act(){
    if(phase==='ready'){ phase='run'; document.getElementById('act').textContent='JUMP'; msg='TAP on the power bar!'; }
    else if(phase==='power'){ phase='jump'; launch(); document.getElementById('act').textContent='SPIN'; }
    else if(phase==='air'){ spins++; mo.spinBoost=1; beep(500+spins*60,0.08,'square',0.06); }
  }
  document.getElementById('act').addEventListener('touchstart',function(e){act();e.preventDefault();},{passive:false}); document.getElementById('act').addEventListener('mousedown',act);
  cv.addEventListener('mousedown',act); cv.addEventListener('touchstart',function(e){act();e.preventDefault();},{passive:false});
  addEventListener('keydown',function(e){ if(e.key===' ')act(); });
  document.getElementById('again').onclick=reset;
  function launch(){ airMax=1; airT=0; mo.vy=-(9+pw*9); mo.startX=TRAMX; mo.launchT=nowv; beep(400,0.1,'square',0.06); }
  function update(dt){
    if(phase==='run'){ mo.x+=6*dt; mo.y=GY-Math.abs(Math.sin(nowv*0.02))*6; if(mo.x>=TRAMX){ mo.x=TRAMX; phase='power'; } }
    else if(phase==='power'){ pw+=pwDir*0.028*dt; if(pw>1){pw=1;pwDir=-1;} if(pw<0){pw=0;pwDir=1;} }
    else if(phase==='jump'||phase==='air'){ if(phase==='jump')phase='air';
      mo.vy+=0.4*dt; mo.y+=mo.vy*dt;
      // horizontal travel toward hoop
      var t=Math.min(1,(nowv-mo.launchT)/900); mo.x=TRAMX+(HOOPX-24-TRAMX)*t;
      if(mo.spinBoost>0){ mo.rot+=0.5*dt; mo.spinBoost-=0.05*dt; } else mo.rot*=0.9;
      if(mo.vy>0 && mo.y>=RIMY && mo.x>HOOPX-70){ dunk(); }
      if(mo.y>GY){ mo.y=GY; if(!judges) dunk(); }
    }
    for(var c=confetti.length-1;c>=0;c--){ var f=confetti[c]; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=0.25*dt; f.life-=0.012*dt; if(f.life<=0)confetti.splice(c,1); }
    if(msgT>0)msgT-=0.004*dt;
  }
  function dunk(){ phase='score';
    var base=4 + pw*3 + Math.min(spins,4)*0.7 + (Math.random()*0.8);
    judges=[]; var sum=0; for(var i=0;i<3;i++){ var s=Math.max(1,Math.min(10,Math.round((base+ (Math.random()-0.5)*1.4)*10)/10)); judges.push(s); sum+=s; }
    var avg=sum/3; total+=Math.round(avg*10); document.getElementById('total').textContent=total;
    msg='💥 SLAM! Judges: '+judges.join('  '); msgT=1; cheer();
    for(var k=0;k<40;k++) confetti.push({x:HOOPX,y:RIMY,vx:(Math.random()-0.5)*5,vy:-Math.random()*4,r:3+Math.random()*4,c:['#ffd23f','#ff6ad5','#43c6ff','#7bff9e'][Math.floor(Math.random()*4)],life:1});
    document.getElementById('act').textContent='NEXT';
    setTimeout(function(){ round++; if(round>5){ over(); } else { document.getElementById('round').textContent=round; startDunk(); } },1600);
  }
  function over(){ phase='done'; document.getElementById('os').innerHTML='Total score: <b>'+total+'</b>!<br>'+(total>350?'🌟 SLAM DUNK CHAMP!':total>250?'Great dunks!':'Keep practicing!'); document.getElementById('over').style.display='flex'; }
  function render(){
    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#3a2470'); g.addColorStop(1,'#1a1030'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // spotlights
    ctx.save(); ctx.globalAlpha=0.08; ctx.fillStyle='#fff'; for(var i=0;i<3;i++){ var cx=W*(0.3+i*0.2); ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx-60,GY); ctx.lineTo(cx+60,GY); ctx.closePath(); ctx.fill(); } ctx.restore();
    // crowd band
    ctx.fillStyle='#12103a'; ctx.fillRect(0,GY-40,W,40);
    for(var c=0;c<40;c++){ ctx.fillStyle=['#ff8a1e','#43c6ff','#ffd23f','#ff6ad5'][c%4]; ctx.beginPath(); ctx.arc((c*40)%W+10,GY-24+Math.sin(c)*4,4,0,6.29); ctx.fill(); }
    // floor
    ctx.fillStyle='#d0904e'; ctx.fillRect(0,GY,W,H-GY); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,GY+3); ctx.lineTo(W,GY+3); ctx.stroke();
    // trampoline
    ctx.fillStyle='#333'; ctx.fillRect(TRAMX-40,GY-8,80,8); ctx.strokeStyle='#37d06a'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(TRAMX-38,GY-6); ctx.quadraticCurveTo(TRAMX,GY-2,TRAMX+38,GY-6); ctx.stroke();
    // hoop + backboard
    ctx.fillStyle='#8a94a0'; ctx.fillRect(HOOPX+30,RIMY-40,8,GY-(RIMY-40)); // pole
    ctx.fillStyle='#eef3f7'; ctx.fillRect(HOOPX+2,RIMY-46,34,50); ctx.strokeStyle='#c0392b'; ctx.lineWidth=3; ctx.strokeRect(HOOPX+2,RIMY-46,34,50);
    ctx.strokeStyle='#ff7b00'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(HOOPX-24,RIMY); ctx.lineTo(HOOPX+2,RIMY); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5; for(var n=0;n<6;n++){ ctx.beginPath(); ctx.moveTo(HOOPX-24+n*5,RIMY); ctx.lineTo(HOOPX-18+n*4,RIMY+26); ctx.stroke(); }
    // power bar
    if(phase==='power'||phase==='run'){ var bw=W*0.5,bx=(W-bw)/2,by=H*0.3; ctx.fillStyle='#0008'; roundRect(bx,by,bw,20,10); ctx.fill();
      ctx.fillStyle='#37d06a'; roundRect(bx+2,by+2,(bw-4)*pw,16,8); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 14px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('POWER — tap to jump!',W/2,by-8); }
    drawMo();
    drawConfetti();
    if(msgT>0 && msg){ ctx.fillStyle='rgba(0,0,0,0.5)'; var mw=Math.min(W-20,40+msg.length*10); roundRect(W/2-mw/2,H*0.16,mw,34,12); ctx.fill(); ctx.fillStyle='#ffd23f'; ctx.font='bold 17px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(msg,W/2,H*0.16+17); }
  }
  function drawMo(){ ctx.save(); ctx.translate(mo.x,mo.y-18); ctx.rotate(mo.rot);
    ctx.fillStyle='#ff8a1e'; if(phase==='air'||phase==='score'){ ctx.beginPath(); ctx.arc(14,-14,8,0,6.29); ctx.fill(); } // ball in hand
    ctx.fillStyle='#e0453a'; roundRect(-11,-16,22,30,7); ctx.fill();
    ctx.fillStyle='#f6c48a'; ctx.beginPath(); ctx.arc(0,-24,9,0,6.29); ctx.fill(); ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(0,-27,9,Math.PI,6.29); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('MO',0,-2);
    ctx.fillStyle='#b53228'; ctx.fillRect(-9,14,7,10); ctx.fillRect(2,14,7,10);
    ctx.restore(); }
  function drawConfetti(){ for(var i=0;i<confetti.length;i++){ var f=confetti[i]; ctx.save(); ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle=f.c; ctx.translate(f.x,f.y); ctx.rotate(f.x*0.05); ctx.fillRect(-f.r/2,-f.r/2,f.r,f.r*0.6); ctx.restore(); } }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  var last=0;
  function loop(ts){ nowv=ts; if(!last)last=ts; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts; if(phase!=='done') update(dt); render(); requestAnimationFrame(loop); }
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
