<html lang="en">
<head>
<meta charset="utf-8">

<title>MO 500</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#3a1a6a 0%,#1c0e38 55%,#0c0620 100%);}
 #app{max-width:640px;margin:0 auto;min-height:100%;}
 #menu{padding:16px 14px 40px;}
 header{text-align:center;margin-bottom:6px;}
 h1{margin:4px 0 2px;font-size:42px;letter-spacing:3px;text-shadow:0 0 12px #ff9e3a,0 0 26px #e05aff;}
 .sub{color:#e6c8ff;font-size:13px;margin:0;}
 .coins{display:inline-block;margin-top:6px;background:#2a1a4a;border-radius:999px;padding:5px 14px;font-weight:bold;color:#ffd23f;}
 #playAll{display:block;width:100%;margin:14px 0 8px;font:inherit;font-weight:bold;font-size:20px;padding:16px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#ff9e3a,#e0563b);color:#2a0f00;box-shadow:0 6px 0 #a63a1e;}
 .lbl{color:#c9a6ff;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:16px 4px 8px;font-weight:bold;}
 #parts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
 .part{border-radius:18px;padding:18px 12px;text-align:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.35);position:relative;overflow:hidden;}
 .part:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
 .part .pe{font-size:40px;}
 .part .pn{font-size:17px;font-weight:bold;margin-top:6px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);}
 .part .pc{font-size:12px;color:rgba(255,255,255,.9);margin-top:2px;}
 #gameWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#120a24;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
 #backBtn{position:fixed;top:10px;left:10px;z-index:10;font:inherit;font-weight:bold;font-size:14px;padding:8px 14px;border-radius:999px;border:none;background:#ffd23f;color:#2a1400;box-shadow:0 4px 0 #b8901c;cursor:pointer;}
 #endBox{position:fixed;inset:0;z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,4,26,.85);}
 #endBox .big{font-size:32px;color:#ffd23f;text-shadow:0 3px 10px #000;margin-bottom:6px;text-align:center;padding:0 16px;}
 #endBox .es{font-size:18px;margin-bottom:20px;text-align:center;padding:0 16px;}
 #endBox button{font:inherit;font-weight:bold;font-size:18px;padding:12px 26px;border-radius:999px;border:none;margin:6px;cursor:pointer;}
 #againBtn{background:#39c46a;color:#04220f;box-shadow:0 5px 0 #1f7a3f;}
 #menuBtn{background:#ffd23f;color:#2a1400;box-shadow:0 5px 0 #b8901c;}
</style>
</head>

<div id="app">

  </header>
  <button id="playAll">▶ PLAY</button>

 </div>
