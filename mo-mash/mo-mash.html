<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🏀 MO MASH</title>
<meta name="description" content="Mash as fast as you can to make Mo dunk — a basketball mashing game!">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;font-family:'Trebuchet MS',system-ui,sans-serif;background:#10203f;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;width:100vw;height:100vh;max-width:460px;margin:0 auto;}
  #cv{display:block;width:100%;height:100%;touch-action:none;background:#16264a;}
  .top{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:6px;z-index:5;pointer-events:none;}
  a.btn{pointer-events:auto;background:rgba(0,0,0,.35);color:#fff;border:none;padding:7px 12px;font-size:13px;border-radius:10px;cursor:pointer;font-weight:bold;text-decoration:none;font-family:inherit;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="top">
    <a class="btn" href="../index.html">← Back</a>
    <a class="btn" href="../games.html">🎮 Games</a>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById('cv'), cx=cv.getContext('2d');
  var W=400,H=640,DPR=1,ws=1,ox=0,oy=0,cvW=400,cvH=640;
  function fit(){ var wrap=document.getElementById('wrap'); var vw=wrap.clientWidth||400,vh=wrap.clientHeight||640;
    DPR=Math.min(window.devicePixelRatio||1,2); cv.width=Math.round(vw*DPR); cv.height=Math.round(vh*DPR);
    var sc=Math.min(vw/400,vh/640); ws=sc; ox=(vw-400*sc)/2; oy=(vh-640*sc)/2; cvW=vw; cvH=vh; }
  window.addEventListener('resize',fit);

  // ---- audio ----
  var AC=null;
  function ensureAC(){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){} }
  function bp(f,d,t,v){ try{ ensureAC(); if(!AC)return; var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime; o.type=t||'square'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(v||0.06,n+0.008); g.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.1)); o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n+(d||0.1)+0.03);}catch(e){} }
  function cheer(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){bp(f,0.14,'sine',0.08);},i*80); }); }
  function slam(){ bp(140,0.18,'sawtooth',0.09); setTimeout(function(){bp(90,0.22,'square',0.07);},60); }

  // ---- state ----
  var state='title', mashes=0, best=0, tLeft=10, power=0, level=1, combo=0, comboT=0;
  var shake=0, ballY=0, ballVY=0, pulse=0, flash=0;
  var pops=[], FLY=[];
  var POPC=['#ff5b5b','#ffd23f','#4fd18b','#3a8bf0','#e07be0','#ff9a3f','#5ce0d0'];
  var EMO=['🏀','⭐','🔥','💥','🎉','🏀','⭐'];

  function reset(){ mashes=0; tLeft=10; power=0; level=1; combo=0; comboT=0; pops=[]; FLY=[]; ballY=0; ballVY=0; }
  function start(){ reset(); state='play'; bp(660,0.1,'square',0.07); }

  function burst(x,y,n,big){ for(var i=0;i<n;i++){ pops.push({x:x,y:y,vx:(Math.random()*2-1)*(big?260:170),vy:-80-Math.random()*(big?260:170),life:0.8+Math.random()*0.7,c:POPC[(Math.random()*POPC.length)|0],s:big?7:5}); } }
  function flyText(t,x,y,c,sz){ FLY.push({t:t,x:x,y:y,vy:-70,life:1,c:c||'#fff',sz:sz||30}); }

  function mash(){
    ensureAC();
    if(state==='title'){ start(); return; }
    if(state==='over'){ start(); return; }
    // state === 'play'
    mashes++; combo++; comboT=0.8;
    power+=0.052+Math.min(combo,40)*0.0004;
    ballVY=-7-Math.min(combo,30)*0.12;     // ball jumps
    shake=Math.min(shake+2.2,10);
    pulse=1; flash=0.5;
    var pitch=360+Math.min(combo,60)*14 + (Math.random()*30);
    bp(pitch,0.055,'square',0.05);
    if(mashes%5===0) burst(200,430,6,false);
    if(combo>0 && combo%10===0){ flyText(combo+' COMBO!',200,300,'#ffd23f',26); bp(880,0.08,'sine',0.06); }
    if(power>=1){ dunk(); }
  }
  function dunk(){ power=0; level++; shake=14; slam(); cheer();
    burst(200,180,34,true); flyText('🏀 SLAM! +10',200,220,'#ff9a3f',34); mashes+=0;
    bonus+=10;
  }
  var bonus=0;

  function mvp(){ return mashes + bonus; }

  // ---- input: ANY tap, click, or key counts ----
  function onDown(e){ if(e&&e.cancelable)e.preventDefault(); mash(); }
  cv.addEventListener('touchstart',function(e){e.preventDefault(); for(var i=0;i<e.changedTouches.length;i++)mash();},{passive:false});
  cv.addEventListener('mousedown',onDown);
  window.addEventListener('keydown',function(e){ if(e.repeat){ /* held key still counts a little */ } if(e.key===' '||e.code==='Space')e.preventDefault(); mash(); });

  // ---- update ----
  function upd(dt){
    comboT-=dt; if(comboT<=0){ combo=0; }
    shake*=Math.pow(0.001,dt);
    pulse*=Math.pow(0.02,dt); flash*=Math.pow(0.02,dt);
    // ball physics
    ballVY+=42*dt; ballY+=ballVY; if(ballY>0){ ballY=0; if(ballVY>2){ bp(200,0.05,'sine',0.03); } ballVY=0; }
    if(state==='play'){ tLeft-=dt; if(tLeft<=0){ tLeft=0; state='over'; if(mvp()>best)best=mvp(); cheer(); burst(200,320,40,true); } }
    for(var i=pops.length-1;i>=0;i--){ var p=pops[i]; p.life-=dt; if(p.life<=0){pops.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=520*dt; }
    for(var j=FLY.length-1;j>=0;j--){ var f=FLY[j]; f.life-=dt*0.9; if(f.life<=0){FLY.splice(j,1);continue;} f.y+=f.vy*dt; f.vy*=0.96; }
  }

  // ---- draw helpers ----
  function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
  function emo(ch,x,y,s){ cx.font=(s||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); }
  function txt(str,x,y,s,c,a){ cx.fillStyle=c||'#fff'; cx.font='900 '+(s||18)+'px Trebuchet MS, Arial, sans-serif'; cx.textAlign=a||'center'; cx.textBaseline='middle'; cx.fillText(str,x,y); }

  function drawMo(x,y,s){ // simple energetic Mo with a basketball bounce
    cx.save(); cx.translate(x,y); cx.scale(s,s);
    cx.fillStyle='rgba(0,0,0,.2)'; cx.beginPath(); cx.ellipse(0,26,16,5,0,0,7); cx.fill();
    // legs
    cx.strokeStyle='#2a3a66'; cx.lineWidth=6; cx.lineCap='round'; cx.beginPath(); cx.moveTo(-6,10); cx.lineTo(-9,26); cx.moveTo(6,10); cx.lineTo(9,26); cx.stroke();
    // jersey
    cx.fillStyle='#6b3fa0'; rr(-13,-14,26,28,8); cx.fill();
    cx.fillStyle='#ffd23f'; rr(-13,-2,26,5,2); cx.fill();
    txt('MO',0,-4,11,'#ffd23f');
    // arms up (celebrate)
    cx.strokeStyle='#f6c9a0'; cx.lineWidth=6; cx.beginPath(); cx.moveTo(-11,-8); cx.lineTo(-20,-22); cx.moveTo(11,-8); cx.lineTo(20,-22); cx.stroke();
    // head
    cx.fillStyle='#f6c9a0'; cx.beginPath(); cx.arc(0,-26,11,0,7); cx.fill();
    cx.fillStyle='#3a2a1a'; cx.beginPath(); cx.arc(0,-30,11,Math.PI*1.03,Math.PI*2-0.03); cx.fill();
    cx.fillStyle='#222'; cx.beginPath(); cx.arc(-4,-25,1.8,0,7); cx.arc(4,-25,1.8,0,7); cx.fill();
    cx.strokeStyle='#b5574a'; cx.lineWidth=2; cx.beginPath(); cx.arc(0,-21,4,0.1,Math.PI-0.1); cx.stroke();
    cx.restore();
  }
  function drawArff(x,y){ // Arff the white girl dog — safe & cheering
    cx.save(); cx.translate(x,y);
    cx.fillStyle='rgba(0,0,0,.18)'; cx.beginPath(); cx.ellipse(0,16,14,4,0,0,7); cx.fill();
    cx.fillStyle='#f4f4f9'; rr(-12,-6,24,20,9); cx.fill();                 // body
    cx.beginPath(); cx.arc(13,-8,9,0,7); cx.fill();                        // head
    cx.fillStyle='#e9d6c2'; cx.beginPath(); cx.ellipse(8,-15,3,6,-0.4,0,7); cx.fill(); cx.beginPath(); cx.ellipse(17,-15,3,6,0.4,0,7); cx.fill(); // ears
    cx.fillStyle='#222'; cx.beginPath(); cx.arc(11,-9,1.4,0,7); cx.arc(16,-9,1.4,0,7); cx.fill();
    cx.fillStyle='#f7b8cf'; cx.beginPath(); cx.arc(19,-6,1.6,0,7); cx.fill(); // nose
    cx.fillStyle='#f4f4f9'; cx.beginPath(); cx.arc(-13,-8,4,0,7); cx.fill(); // tail wag
    cx.restore();
    cx.fillStyle='rgba(20,30,55,.8)'; rr(x-16,y+20,32,13,5); cx.fill(); txt('Arff',x,y+27,8,'#ffd6e6');
  }

  function draw(){
    cx.setTransform(DPR,0,0,DPR,0,0); cx.fillStyle='#0e1a33'; cx.fillRect(0,0,cvW,cvH);
    var shx=(Math.random()*2-1)*shake, shy=(Math.random()*2-1)*shake;
    cx.setTransform(DPR*ws,0,0,DPR*ws,DPR*(ox+shx),DPR*(oy+shy));
    // court bg
    var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1d3a6e'); g.addColorStop(1,'#2a5aa0'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
    // flash on mash
    if(flash>0.02){ cx.fillStyle='rgba(255,255,255,'+(flash*0.25)+')'; cx.fillRect(0,0,W,H); }
    // hoop up top
    cx.fillStyle='#fff'; rr(150,70,100,50,6); cx.fill(); cx.strokeStyle='#d24a3a'; cx.lineWidth=3; cx.strokeRect(178,96,44,22);
    cx.strokeStyle='#e8671f'; cx.lineWidth=5; cx.beginPath(); cx.moveTo(172,124); cx.lineTo(228,124); cx.stroke();
    cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=1.5; for(var n=0;n<7;n++){ var nx=174+n*8.5; cx.beginPath(); cx.moveTo(nx,124); cx.lineTo(186+n*4,150); cx.stroke(); }

    if(state==='title') drawTitle();
    else if(state==='play') drawPlay();
    else drawOver();

    // confetti + flytext (always on top)
    for(var i=0;i<pops.length;i++){ var p=pops[i]; cx.globalAlpha=Math.max(0,Math.min(1,p.life)); cx.fillStyle=p.c; cx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); } cx.globalAlpha=1;
    for(var j=0;j<FLY.length;j++){ var f=FLY[j]; cx.globalAlpha=Math.max(0,Math.min(1,f.life)); txt(f.t,f.x,f.y,f.sz,f.c); } cx.globalAlpha=1;
  }

  function drawTitle(){
    var bob=Math.sin(Date.now()/300)*8;
    emo('🏀',W/2,150+bob,70);
    txt('MO MASH',W/2,250,56,'#ffd23f');
    txt('Bash the keys! Tap! Click!',W/2,300,18,'#fff');
    txt('MASH as fast as you can',W/2,326,18,'#cfe');
    txt('to make Mo SLAM DUNK! 🏀',W/2,352,18,'#cfe');
    var p=1+Math.sin(Date.now()/180)*0.08; cx.save(); cx.translate(W/2,430); cx.scale(p,p);
    cx.fillStyle='#4fd18b'; rr(-120,-30,240,60,16); cx.fill(); txt('MASH TO START!',0,0,26,'#06381f'); cx.restore();
    drawMo(140,560,1.5); drawArff(300,565);
    if(best>0) txt('Best: '+best,W/2,500,16,'#ffd23f');
  }

  function drawPlay(){
    // timer bar
    var tw=(W-40)*(tLeft/10);
    cx.fillStyle='rgba(0,0,0,.3)'; rr(20,18,W-40,16,8); cx.fill();
    cx.fillStyle=tLeft<3?'#ff5b5b':'#ffd23f'; rr(20,18,Math.max(0,tw),16,8); cx.fill();
    txt(tLeft.toFixed(1)+'s',W/2,26,11,'#06243f');
    // big mash count
    var ps=1+pulse*0.25;
    cx.save(); cx.translate(W/2,250); cx.scale(ps,ps); txt(''+mvp(),0,0,88,'#fff'); cx.restore();
    txt('MASHES',W/2,305,18,'#ffd23f');
    if(combo>1) txt('🔥 '+combo+' combo',W/2,335,16,'#ff9a3f');
    // Mo dribbling, ball bounces with mashes
    drawMo(140,500,1.6);
    drawArff(300,505);
    emo('🏀',200,470+ballY,30+pulse*6);
    // power meter to DUNK
    cx.fillStyle='rgba(0,0,0,.3)'; rr(40,560,W-80,26,13); cx.fill();
    cx.fillStyle='#ff9a3f'; rr(40,560,Math.max(0,(W-80)*power),26,13); cx.fill();
    txt(power>0.8?'ALMOST... DUNK!':'MASH to fill & DUNK! 🏀',W/2,573,13,'#fff');
    // mash hint
    var fl=(Math.sin(Date.now()/120)*0.5+0.5);
    cx.globalAlpha=0.5+fl*0.5; txt('MASH! MASH! MASH!',W/2,610,20,'#ffd23f'); cx.globalAlpha=1;
  }

  function drawOver(){
    txt('TIME!',W/2,150,40,'#ffd23f');
    emo('🏀',W/2,220,54);
    txt('You mashed',W/2,290,20,'#fff');
    var ps=1+Math.sin(Date.now()/200)*0.06; cx.save(); cx.translate(W/2,340); cx.scale(ps,ps); txt(''+mvp(),0,0,74,'#ffd23f'); cx.restore();
    txt('times! 🔥',W/2,390,22,'#fff');
    if(mvp()>=best && mvp()>0) txt('🏆 NEW BEST! 🏆',W/2,430,22,'#4fd18b'); else txt('Best: '+best,W/2,430,18,'#cfe');
    var p=1+Math.sin(Date.now()/180)*0.08; cx.save(); cx.translate(W/2,500); cx.scale(p,p);
    cx.fillStyle='#4fd18b'; rr(-120,-28,240,56,16); cx.fill(); txt('MASH AGAIN!',0,0,24,'#06381f'); cx.restore();
    drawMo(140,590,1.3); drawArff(300,593);
  }

  var last=0;
  function loop(t){ var dt=Math.min((t-last)/1000,0.05); last=t; upd(dt); draw(); requestAnimationFrame(loop); }
  fit(); requestAnimationFrame(loop);

  // test hook
  window._MASH={ state:function(){return state;}, mashes:function(){return mvp();}, tLeft:function(){return tLeft;}, mash:function(){mash();} };
})();
</script>
</body>
</html>
