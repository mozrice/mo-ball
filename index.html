  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 6px 2px;max-width:100%;scrollbar-width:none;justify-content:flex-start;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap;flex:0 0 auto;font-family:inherit;font-size:13px;font-weight:bold;color:#cfe0ff;background:#18233c;border:2px solid #2e3f66;border-radius:20px;padding:7px 13px;cursor:pointer;}
  .chip.on{color:#3a2a00;background:linear-gradient(#ffe07a,#f0b429);border-color:#f0b429;}
  #sections{max-width:1040px;margin:0 auto;padding:6px 16px 50px;}
  section.cat{margin:20px 0 6px;}
  section.cat h2{font-size:19px;color:#ffe6a3;margin:0 0 12px;border-left:5px solid #ffcf5a;padding:2px 0 2px 10px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
  a.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;
    background:linear-gradient(#ffffff,#dbe6f5);border-radius:16px;padding:16px 8px;min-height:114px;box-shadow:0 5px 0 #0006, 0 8px 20px #0006;transition:transform .1s, box-shadow .1s;}
  @media(hover:hover){a.card:hover{transform:translateY(-3px);box-shadow:0 8px 0 #0006, 0 14px 26px #0007;}}
  a.card:active{transform:translateY(4px);box-shadow:0 1px 0 #0006, 0 4px 12px #0006;}
  a.card .emo{font-size:42px;line-height:1;filter:drop-shadow(0 2px 2px #0003);}
  a.card .name{margin-top:9px;font-weight:bold;font-size:14px;text-align:center;color:#16233c;line-height:1.15;}
  a.card .tag{position:absolute;top:7px;right:7px;background:#e0453a;color:#fff;font-size:9px;font-weight:bold;padding:3px 7px;border-radius:20px;letter-spacing:.5px;}
  a.card .fav{position:absolute;top:5px;left:6px;background:none;border:none;font-size:19px;line-height:1;color:#f0b429;cursor:pointer;padding:2px;}
  a.card.big{background:linear-gradient(#ffe07a,#f0b429);box-shadow:0 5px 0 #a06a00, 0 8px 20px #0006;}
  #noresult{display:none;text-align:center;color:#9fb2d4;padding:40px;font-size:16px;}
  footer{text-align:center;color:#8ea4c4;font-size:12px;padding:0 0 30px;}

  function catOf(x){ if(x.big) return '⭐ Featured'; var s=(x.u+' '+x.n).toLowerCase(); for(var i=0;i<CATS.length;i++){ var c=CATS[i]; for(var k=0;k<c.kw.length;k++){ if(s.indexOf(c.kw[k])>=0) return c.t; } } return '🎮 More Games'; }
  var ORDER=['⭐ Featured','🧊 3D Games','🏀 Basketball','🏗️ Build & Make','🐶 Arff & Dogs','🏃 Action & Racing','🍔 Food','🧹 Clean & Fix','🎵 Music & Fun','🎮 More Games'];
  var byUrl={}; GAMES.forEach(function(x){ byUrl[x.u]=x; });
  var groups={}; GAMES.forEach(function(x){ var c=catOf(x); (groups[c]=groups[c]||[]).push(x); });
  function getFavs(){ try{return JSON.parse(localStorage.getItem('moFavs')||'[]');}catch(e){return [];} }
  function setFavs(a){ try{localStorage.setItem('moFavs',JSON.stringify(a));}catch(e){} }
  var favs=getFavs();
  function isFav(u){ return favs.indexOf(u)>=0; }
  function toggleFav(u){ var i=favs.indexOf(u); if(i>=0)favs.splice(i,1); else favs.push(u); setFavs(favs); renderFavs(); refreshStars(); apply(); }
  function makeCard(x){ var a=document.createElement('a'); a.href=x.u; a.className='card'+(x.big?' big':''); a.dataset.u=x.u; a.dataset.n=x.n.toLowerCase();
    a.innerHTML=(x.tag?'<span class="tag">'+x.tag+'</span>':'')+'<button class="fav">'+(isFav(x.u)?'★':'☆')+'</button><span class="emo">'+x.e+'</span><span class="name">'+x.n+'</span>';
    var fb=a.querySelector('.fav'); fb.dataset.u=x.u; fb.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); toggleFav(x.u); });
    return a; }
  var root=document.getElementById('sections');
  var favSec=document.createElement('section'); favSec.className='cat'; favSec.id='favsec';
  var favH=document.createElement('h2'); favSec.appendChild(favH);
  var favGrid=document.createElement('div'); favGrid.className='grid'; favSec.appendChild(favGrid); root.appendChild(favSec);
  function renderFavs(){ favGrid.innerHTML=''; var list=favs.map(function(u){return byUrl[u];}).filter(Boolean); favSec.style.display=list.length?'':'none'; favH.textContent='⭐ My Favorites ('+list.length+')'; list.forEach(function(x){ favGrid.appendChild(makeCard(x)); }); }
  ORDER.forEach(function(name){ var list=groups[name]; if(!list||!list.length)return; var sec=document.createElement('section'); sec.className='cat'; sec.dataset.cat=name;
    var h=document.createElement('h2'); h.textContent=name+' ('+list.length+')'; sec.appendChild(h);
    var g=document.createElement('div'); g.className='grid'; list.forEach(function(x){ g.appendChild(makeCard(x)); }); sec.appendChild(g); root.appendChild(sec); });
  renderFavs();
  var present=ORDER.filter(function(n){return groups[n]&&groups[n].length;});
  var chipsEl=document.getElementById('chips'); var activeCat='All';
  function addChip(label){ var b=document.createElement('button'); b.className='chip'+(label==='All'?' on':''); b.textContent=label; b.addEventListener('click',function(){ activeCat=label; var cs=document.querySelectorAll('.chip'); for(var i=0;i<cs.length;i++)cs[i].classList.toggle('on',cs[i].textContent===label); window.scrollTo(0,0); apply(); }); chipsEl.appendChild(b); }
  addChip('All'); present.forEach(function(n){ addChip(n); });
  function refreshStars(){ var fs=document.querySelectorAll('.fav'); for(var i=0;i<fs.length;i++){ fs[i].textContent=isFav(fs[i].dataset.u)?'★':'☆'; } }
  var box=document.getElementById('search'); var nores=document.getElementById('noresult');
  function apply(){ var q=box.value.toLowerCase().trim(); var shown=0; var secs=document.querySelectorAll('#sections section.cat');
    for(var s=0;s<secs.length;s++){ var sec=secs[s]; var isFavSec=(sec.id==='favsec'); var cards=sec.querySelectorAll('a.card'); var any=false;
      for(var i=0;i<cards.length;i++){ var a=cards[i]; var catOk=isFavSec||activeCat==='All'||sec.dataset.cat===activeCat; var ok=catOk&&(!q||a.dataset.n.indexOf(q)>=0); a.style.display=ok?'':'none'; if(ok){any=true; if(!isFavSec)shown++;} }
      sec.style.display=(any && (!isFavSec||favs.length))?'':'none';
    }
    nores.style.display=shown?'none':'block';
  }
  box.addEventListener('input',function(){ if(box.value){ activeCat='All'; var cs=document.querySelectorAll('.chip'); for(var i=0;i<cs.length;i++)cs[i].classList.toggle('on',cs[i].textContent==='All'); } apply(); });
