<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Aquarium</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#04203a;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04203a;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz,flip){ cx.save(); cx.translate(x,y); if(flip)cx.scale(-1,1); cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,0,0); cx.restore(); }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.14,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function blip(){ bp(500,0.06,'sine',0.12); } function yum(){ bp(700,0.08,'triangle',0.14); setTimeout(function(){bp(950,0.08,'triangle',0.12);},50); } function calls(){ bp(400,0.14,'sine',0.14); }

var JB={x:66,y:H-58,r:44}, AB={x:W-56,y:H-56,r:42}, BB={x:W-116,y:H-96,r:32};
var joyId=null,joyX=0,joyY=0,aId=null,bId=null;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+8; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(inC(p,BB)){ bId=e.pointerId; callFish(); return; }
  if(inC(p,AB)){ aId=e.pointerId; feed(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; if(e.pointerId===bId)bId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

var SAND=H-80, TOP=64;
var diver={x:W/2,y:H/2};
var fed=0, food=[], bubbles=[], callT=0;
var FTYPES=['🐠','🐟','🐡','🐬','🐢','🐠','🐟','🐠'];
var fish=[]; for(var i=0;i<10;i++){ fish.push({e:FTYPES[i%FTYPES.length], x:40+Math.random()*(W-80), y:TOP+30+Math.random()*(SAND-TOP-60), vx:(Math.random()<0.5?-1:1)*(20+Math.random()*30), vy:(Math.random()-0.5)*20, sz:22+Math.random()*10, wob:Math.random()*6, trick:0, tdir:0}); }
var jelly=[{x:80,y:200,p:0},{x:320,y:160,p:2}];
var crab={x:120,dir:1,p:0};
var shark={x:-60,y:130,dir:1};
var octo={x:60,y:SAND-24,p:0};
var seaweed=[]; for(var i=0;i<8;i++)seaweed.push({x:16+i*50, h:30+Math.random()*40, ph:Math.random()*6, c:i%2?'#2f9e57':'#39b56a'});
var watchers=[{x:118,ph:0,react:0,re:''},{x:158,ph:1.4,react:0,re:''},{x:198,ph:2.6,react:0,re:''},{x:238,ph:3.7,react:0,re:''}];
var T=0;
function reactWatch(){ var w=watchers[Math.floor(Math.random()*watchers.length)]; w.react=1.6; w.re=['😮','👏','❤️','🤩','👀','😃'][Math.floor(Math.random()*6)]; }

function feed(){ blip(); reactWatch(); for(var i=0;i<4;i++)food.push({x:diver.x+(Math.random()-0.5)*30, y:diver.y+10+Math.random()*10, vy:16+Math.random()*10}); }
function callFish(){ calls(); callT=2.2; }
function spawnBubble(x,y){ bubbles.push({x:x,y:y,r:2+Math.random()*4,vy:-20-Math.random()*20}); }

function nearestFood(fx,fy){ var best=null,bd=1e9; for(var i=0;i<food.length;i++){ var d=Math.hypot(food[i].x-fx,food[i].y-fy); if(d<bd){bd=d;best=food[i];} } return {f:best,d:bd}; }

function upd(dt){ T+=dt; if(callT>0)callT-=dt; watchers.forEach(function(w){ if(w.react>0)w.react-=dt; });
  var v=jv(); diver.x=clamp(diver.x+v.x*150*dt,24,W-24); diver.y=clamp(diver.y+v.y*150*dt,TOP+10,SAND-6);
  if((Math.abs(v.x)+Math.abs(v.y))>0.2 && Math.random()<0.3)spawnBubble(diver.x+8,diver.y-10);
  // fish
  fish.forEach(function(f){
    // steer toward food
    var nf=nearestFood(f.x,f.y);
    if(nf.f && nf.d<150){ var dx=nf.f.x-f.x, dy=nf.f.y-f.y, d=Math.hypot(dx,dy)||1; f.vx+=dx/d*80*dt; f.vy+=dy/d*80*dt; if(nf.d<14){ eat(nf.f); } }
    else if(callT>0){ var dx=diver.x-f.x, dy=diver.y-f.y, d=Math.hypot(dx,dy)||1; f.vx+=dx/d*70*dt; f.vy+=dy/d*70*dt; }
    else { // wander
      if(Math.random()<0.01){ f.vx+=(Math.random()-0.5)*30; f.vy+=(Math.random()-0.5)*20; }
      // avoid diver a little (playful scatter)
      var dd=Math.hypot(diver.x-f.x,diver.y-f.y); if(dd<44){ f.vx+=(f.x-diver.x)/dd*40*dt; f.vy+=(f.y-diver.y)/dd*40*dt; }
      // occasional trick (spin)
      if(f.trick<=0 && Math.random()<0.003){ f.trick=1.1; f.tdir=Math.random()<0.5?1:-1; reactWatch(); }
    }
    // avoid shark
    var sd=Math.hypot(shark.x-f.x,shark.y-f.y); if(sd<70){ f.vx+=(f.x-shark.x)/sd*90*dt; f.vy+=(f.y-shark.y)/sd*90*dt; }
    // speed limit
    var sp=Math.hypot(f.vx,f.vy), mx=70; if(sp>mx){ f.vx=f.vx/sp*mx; f.vy=f.vy/sp*mx; }
    f.x+=f.vx*dt; f.y+=f.vy*dt; f.wob+=dt*8;
    if(f.x<20){f.x=20;f.vx=Math.abs(f.vx);} if(f.x>W-20){f.x=W-20;f.vx=-Math.abs(f.vx);}
    if(f.y<TOP+16){f.y=TOP+16;f.vy=Math.abs(f.vy);} if(f.y>SAND-8){f.y=SAND-8;f.vy=-Math.abs(f.vy);}
    if(f.trick>0)f.trick-=dt;
  });
  // food sink
  for(var i=food.length-1;i>=0;i--){ food[i].y+=food[i].vy*dt; if(food[i].y>SAND){ food.splice(i,1); } }
  // bubbles
  for(var i=bubbles.length-1;i>=0;i--){ bubbles[i].y+=bubbles[i].vy*dt; bubbles[i].x+=Math.sin(bubbles[i].y*0.05)*8*dt; if(bubbles[i].y<TOP-6)bubbles.splice(i,1); }
  if(Math.random()<0.06)spawnBubble(30+Math.random()*(W-60),SAND-10);
  // ambient creatures
  jelly.forEach(function(j){ j.p+=dt; j.y+=Math.sin(j.p)*14*dt; j.x+=Math.cos(j.p*0.5)*10*dt; j.x=clamp(j.x,30,W-30); });
  crab.p+=dt*6; crab.x+=crab.dir*20*dt; if(crab.x>W-40){crab.dir=-1;} if(crab.x<40){crab.dir=1;}
  shark.x+=shark.dir*36*dt; if(shark.x>W+60){shark.dir=-1;shark.y=110+Math.random()*80;} if(shark.x<-60){shark.dir=1;shark.y=110+Math.random()*80;}
  octo.p+=dt*2; octo.y=SAND-24+Math.sin(octo.p)*4;
}
function eat(f){ var i=food.indexOf(f); if(i>=0){ food.splice(i,1); fed++; yum(); for(var b=0;b<2;b++)spawnBubble(f.x,f.y); } }

function drawDiver(x,y){ cx.save(); cx.translate(x,y);
  // body (wetsuit)
  cx.fillStyle='#1a2a5a'; rr(-11,-4,22,26,6); cx.fill();
  // arms/legs subtle
  cx.strokeStyle='#1a2a5a'; cx.lineWidth=6; cx.lineCap='round'; cx.beginPath(); cx.moveTo(-9,2); cx.lineTo(-17,10); cx.moveTo(9,2); cx.lineTo(17,10); cx.stroke();
  cx.fillStyle='#0e1a3a'; cx.fillRect(-9,20,7,10); cx.fillRect(2,20,7,10); cx.fillStyle='#111'; cx.fillRect(-12,28,10,5); cx.fillRect(2,28,10,5);
  // head + mask
  cx.fillStyle='#8a5a34'; cx.beginPath(); cx.arc(0,-14,11,0,7); cx.fill();
  cx.fillStyle='rgba(150,220,255,.85)'; rr(-9,-19,18,11,5); cx.fill(); cx.strokeStyle='#222'; cx.lineWidth=1.5; rr(-9,-19,18,11,5); cx.stroke();
  cx.fillStyle='#111'; cx.beginPath(); cx.arc(-4,-13.5,2,0,7); cx.arc(4,-13.5,2,0,7); cx.fill();
  // tank
  cx.fillStyle='#ffd23f'; rr(-14,-2,6,18,3); cx.fill();
  cx.restore(); }
function draw(){ // water
  var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2aa0d0'); g.addColorStop(0.6,'#1670a8'); g.addColorStop(1,'#0a3a68'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // light rays
  cx.globalAlpha=0.12; cx.fillStyle='#fff'; for(var i=0;i<4;i++){ cx.beginPath(); var lx=40+i*110; cx.moveTo(lx,0); cx.lineTo(lx+40,0); cx.lineTo(lx+90,SAND); cx.lineTo(lx+40,SAND); cx.fill(); } cx.globalAlpha=1;
  // sand
  cx.fillStyle='#e6d29a'; cx.beginPath(); cx.moveTo(0,SAND); for(var x=0;x<=W;x+=40)cx.lineTo(x,SAND-6+Math.sin(x*0.1)*5); cx.lineTo(W,H); cx.lineTo(0,H); cx.fill();
  // plants + rocks + chest
  // swaying seaweed plants
  seaweed.forEach(function(s){ var sway=Math.sin(T*1.4+s.ph)*11; cx.lineCap='round'; cx.strokeStyle=s.c; cx.lineWidth=8; cx.beginPath(); cx.moveTo(s.x,SAND); cx.quadraticCurveTo(s.x+sway*0.6,SAND-s.h*0.55, s.x+sway,SAND-s.h); cx.stroke(); cx.strokeStyle='rgba(255,255,255,.15)'; cx.lineWidth=3; cx.stroke(); });
  emoji('🪸',40,SAND-4,34); emoji('🌿',W-46,SAND-2,34); emoji('🪨',W/2+70,SAND-2,28); emoji('🧰',W-90,SAND-6,26); emoji('🐚',80,SAND-2,20);
  emoji('🐙',octo.x,octo.y,30);
  // jelly
  jelly.forEach(function(j){ emoji('🪼',j.x,j.y,28); });
  // fish
  fish.forEach(function(f){ var flip=f.vx<0; cx.save(); cx.translate(f.x,f.y+Math.sin(f.wob)*2); if(f.trick>0)cx.rotate(f.tdir*(1.1-f.trick)*6.28); if(flip)cx.scale(-1,1); cx.font=f.sz+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(f.e,0,0); cx.restore(); });
  // shark
  emoji('🦈',shark.x,shark.y,42,shark.dir<0);
  // crab
  emoji('🦀',crab.x,SAND-6+Math.sin(crab.p)*2,24);
  // food
  cx.fillStyle='#8a5a2e'; food.forEach(function(fd){ cx.beginPath(); cx.arc(fd.x,fd.y,2.5,0,7); cx.fill(); });
  // bubbles
  cx.strokeStyle='rgba(255,255,255,.6)'; cx.lineWidth=1.4; bubbles.forEach(function(b){ cx.beginPath(); cx.arc(b.x,b.y,b.r,0,7); cx.stroke(); });
  // diver
  drawDiver(diver.x,diver.y);
  if(callT>0){ emoji('🔔',diver.x,diver.y-30,20); }
  // HUD
  cx.fillStyle='rgba(4,20,40,.55)'; rr(8,8,W-16,32,10); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 14px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🐠 MO Aquarium',14,30); cx.textAlign='right'; cx.fillStyle='#ffd23f'; cx.fillText('Fed: '+fed,W-14,30);
  // people watching (foreground, outside the glass)
  cx.fillStyle='rgba(180,230,255,.10)'; cx.fillRect(0,H-70,W,70); // glass sheen
  watchers.forEach(function(w){ var by=H-40+Math.sin(T*2+w.ph)*2;
    cx.fillStyle='#0a1730'; rr(w.x-14,by-4,28,40,9); cx.fill(); // shoulders
    cx.beginPath(); cx.arc(w.x,by-12,10,0,7); cx.fill(); // head
    cx.fillStyle='#12264a'; cx.beginPath(); cx.arc(w.x,by-13,10,Math.PI,0); cx.fill(); // hair top
    if(w.react>0){ cx.globalAlpha=Math.min(1,w.react*1.6); emoji(w.re,w.x,by-34,20); cx.globalAlpha=1; } });
  // controls
  var v=jv(); cx.fillStyle='rgba(255,255,255,.16)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.6)';cx.font='bold 10px Trebuchet MS';cx.textAlign='center';cx.fillText('SWIM',JB.x,JB.y+JB.r+12);
  cx.fillStyle=aId!==null?'#ffd23f':'rgba(255,210,63,.95)'; cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle='#2a1400'; cx.font='bold 14px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('FEED',AB.x,AB.y); cx.textBaseline='alphabetic';
  cx.fillStyle=bId!==null?'#ff5ad0':'#c14fe0'; cx.beginPath(); cx.arc(BB.x,BB.y,BB.r,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 13px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('CALL',BB.x,BB.y); cx.textBaseline='alphabetic'; cx.fillStyle='#e6b0ff';cx.font='bold 9px Trebuchet MS';cx.fillText('fish 🔔',BB.x,BB.y+BB.r+10);
}
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window._AQ={ get fed(){return fed;}, get food(){return food.length;}, feed:function(){feed();}, call:function(){callFish();}, setDiver:function(x,y){diver.x=x;diver.y=y;} };
})();
</script>
</body>
</html>
