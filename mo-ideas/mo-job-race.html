  MG.active=true; MG.job=j; MG.type=classify(JOBS[j]); MG.sel=-1; MG.items=[]; MG.hit=0; MG.need=6; MG.mover=null;
  el("pickpanel").style.display="none"; el("minipanel").style.display="block";
  el("minittl").textContent=TITLES[MG.type]||TITLES.clean;
  var t=MG.type;
  if(t==="match"){
   var cols=SOCKCOLS.slice(); for(var s=cols.length-1;s>0;s--){var r=Math.floor(Math.random()*(s+1));var x=cols[s];cols[s]=cols[r];cols[r]=x;}
   var arr=[]; for(var p=0;p<4;p++){arr.push(cols[p]);arr.push(cols[p]);}
   for(var s2=arr.length-1;s2>0;s2--){var r2=Math.floor(Math.random()*(s2+1));var x2=arr[s2];arr[s2]=arr[r2];arr[r2]=x2;}
   for(var i=0;i<arr.length;i++){ MG.items.push({x:60+(i%4)*100,y:80+Math.floor(i/4)*130,col:arr[i],matched:false}); }
  } else if(t==="fetch"||t==="pounce"){
   MG.mover={x:220,y:150,r:20}; MG.need=6; MG.hit=0;
  } else if(t==="milk"){
   MG.need=10; MG.hit=0;
  } else if(t==="sort"){
   MG.selItem=-1; var scols=["#e05050","#3fa9f5"];
   for(var i=0;i<6;i++){ MG.items.push({x:rnd(50,390),y:rnd(50,170),cat:Math.floor(Math.random()*2),col:scols[Math.floor(Math.random()*2)],done:false}); }
   for(var i=0;i<MG.items.length;i++){ MG.items[i].col=scols[MG.items[i].cat]; }
   MG.scols=scols;
  } else {
   var counts={dishes:6,toss:6,water:6,feed:5,sweep:8,bed:5,books:6,fold:6,clean:7};
   var nn=counts[t]||6;
   for(var i=0;i<nn;i++){ MG.items.push({x:rnd(40,400),y:rnd(50,250),ic:Math.floor(Math.random()*4),done:false}); }
  }
 }
 function finishMini(){ MG.active=false; el("minipanel").style.display="none"; el("pickpanel").style.display="block"; tada(); jobDone(MG.job); }

 // ---- drawing helpers ----
 function drawSock(cx,x,y,col,sel,matched){ cx.save(); cx.translate(x,y); if(matched)cx.globalAlpha=0.35;
  cx.fillStyle=col; cx.strokeStyle=sel?"#222":"rgba(0,0,0,.2)"; cx.lineWidth=sel?4:2;
  cx.beginPath(); cx.moveTo(-16,-34); cx.lineTo(16,-34); cx.lineTo(16,8); cx.quadraticCurveTo(16,26,34,26); cx.lineTo(34,42); cx.quadraticCurveTo(-2,42,-16,20); cx.closePath(); cx.fill(); cx.stroke();
  cx.fillStyle="rgba(255,255,255,.85)"; cx.fillRect(-16,-34,32,9);
  if(matched){ cx.globalAlpha=1; cx.fillStyle="#2a8a3a"; cx.font="bold 22px Trebuchet MS"; cx.textAlign="center"; cx.fillText("✓",6,6); } cx.restore(); }
 function dItem(cx,it,t){ var x=it.x,y=it.y,d=it.done;
  if(t==="toss"){ if(d)return; var c=["#c85040","#8a6a3a","#6ab0f0","#c0a040"][it.ic]; cx.fillStyle=c; cx.beginPath(); cx.arc(x,y,12,0,7); cx.fill(); cx.fillStyle="rgba(0,0,0,.15)"; cx.beginPath(); cx.arc(x-3,y-2,4,0,7); cx.fill(); }
  else if(t==="clean"||t==="sweep"){ if(d)return; cx.fillStyle=t==="sweep"?"#a98a5a":["#8a6a3a","#a0c0e0","#c8a050","#d0a0b0"][it.ic]; cx.beginPath(); cx.arc(x,y,12,0,7); cx.fill(); cx.fillStyle="rgba(0,0,0,.18)"; cx.beginPath(); cx.arc(x-3,y-3,4,0,7); cx.fill(); cx.beginPath(); cx.arc(x+4,y+2,3,0,7); cx.fill(); }
  else if(t==="water"){ // pot + flower (wilted->bloom)
   cx.fillStyle="#b5763a"; cx.beginPath(); cx.moveTo(x-12,y+4); cx.lineTo(x+12,y+4); cx.lineTo(x+8,y+20); cx.lineTo(x-8,y+20); cx.fill();
   cx.strokeStyle="#3a8a3a"; cx.lineWidth=3; cx.beginPath(); cx.moveTo(x,y+4); cx.lineTo(x,y-14); cx.stroke();
   if(d){ cx.fillStyle="#f05a8a"; for(var a=0;a<5;a++){ var an=a/5*6.28; cx.beginPath(); cx.arc(x+Math.cos(an)*8,y-14+Math.sin(an)*8,5,0,7); cx.fill(); } cx.fillStyle="#f0d000"; cx.beginPath(); cx.arc(x,y-14,4,0,7); cx.fill(); }
   else { cx.fillStyle="#8aa86a"; cx.beginPath(); cx.ellipse(x,y-14,7,4,0.6,0,7); cx.fill(); } }
  else if(t==="feed"){ // bowl empty->kibble
   cx.fillStyle=d?"#c07a3a":"#7aa0c0"; cx.beginPath(); cx.ellipse(x,y+6,20,8,0,0,7); cx.fill(); cx.fillStyle=d?"#a05a20":"#5a80a0"; cx.beginPath(); cx.arc(x,y,18,0.1,3.04); cx.fill();
   if(d){ cx.fillStyle="#7a4a1a"; for(var k=0;k<6;k++){ cx.beginPath(); cx.arc(x-10+k*4,y-2+(k%2)*4,3,0,7); cx.fill(); } } }
  else if(t==="dishes"){ if(d){ cx.fillStyle="#dff0ff"; cx.beginPath(); cx.arc(x,y,16,0,7); cx.fill(); cx.strokeStyle="#bfe0ff"; cx.lineWidth=2; cx.stroke(); cx.fillStyle="#8fd0ff"; cx.font="bold 14px Trebuchet MS"; cx.textAlign="center"; cx.fillText("✨",x,y+5); }
   else { cx.fillStyle="#cfc0a0"; cx.beginPath(); cx.arc(x,y,16,0,7); cx.fill(); cx.fillStyle="#8a7a4a"; cx.beginPath(); cx.arc(x-4,y-2,4,0,7); cx.fill(); cx.beginPath(); cx.arc(x+5,y+4,3,0,7); cx.fill(); } }
  else if(t==="bed"){ if(d){ cx.fillStyle="#f0b0c0"; } else { cx.fillStyle="#c090a0"; } cx.save(); cx.translate(x,y); if(!d)cx.rotate(0.2); cx.beginPath(); cx.moveTo(-20,-10); cx.lineTo(20,-10); cx.quadraticCurveTo(26,0,20,12); cx.lineTo(-20,12); cx.quadraticCurveTo(-26,0,-20,-10); cx.fill(); cx.restore(); if(d){ cx.fillStyle="#fff"; cx.font="bold 12px Trebuchet MS"; cx.textAlign="center"; cx.fillText("✓",x,y+4);} }
  else if(t==="books"){ if(d)return; var bc=["#e05050","#3fa9f5","#5ac85a","#f0a800"][it.ic]; cx.save(); cx.translate(x,y); cx.rotate(0.3); cx.fillStyle=bc; cx.fillRect(-6,-16,12,32); cx.fillStyle="#fff"; cx.fillRect(-6,-16,12,3); cx.restore(); }
  else if(t==="fold"){ if(d){ cx.fillStyle="#9bd0f0"; cx.fillRect(x-16,y-6,32,16); cx.strokeStyle="#6aa0c0"; cx.lineWidth=2; cx.strokeRect(x-16,y-6,32,16); cx.beginPath(); cx.moveTo(x,y-6); cx.lineTo(x,y+10); cx.stroke(); }
   else { cx.fillStyle="#7ab0e0"; cx.save(); cx.translate(x,y); cx.rotate(rnd(-0.3,0.3)); cx.beginPath(); cx.moveTo(-18,-4); cx.lineTo(18,-8); cx.lineTo(16,14); cx.lineTo(-16,12); cx.fill(); cx.restore(); } }
 }
 function drawMini(){ var cx=mcv.getContext("2d"),W=440,H=300; cx.clearRect(0,0,W,H); cx.fillStyle="#eef4fb"; cx.fillRect(0,0,W,H);
  var t=MG.type;
  if(t==="match"){ for(var i=0;i<MG.items.length;i++){ var it=MG.items[i]; drawSock(cx,it.x,it.y,it.col,i===MG.sel,it.matched); } }
  else if(t==="milk"){
   // cow
   cx.font="70px serif"; cx.textAlign="center"; cx.fillText("🐄",W/2-30,150);
   // udder tap zone
   cx.fillStyle="rgba(255,200,210,.5)"; cx.beginPath(); cx.arc(W/2-30,180,34,0,7); cx.fill();
   cx.fillStyle="#e08aa0"; cx.beginPath(); cx.arc(W/2-30,180,18,0,7); cx.fill();
   // bucket fill
   var bx=W/2+90, by=H-40, bw=54, bh=90; cx.strokeStyle="#888"; cx.lineWidth=3; cx.strokeRect(bx,by-bh,bw,bh);
   var fillh=bh*(MG.hit/MG.need); cx.fillStyle="#f7f3e0"; cx.fillRect(bx+2,by-fillh,bw-4,fillh);
   cx.fillStyle="#2a6ab0"; cx.font="bold 13px Trebuchet MS"; cx.textAlign="right"; cx.fillText("milk: "+MG.hit+" / "+MG.need,W-8,18);
   return;
  }
  else if(t==="sort"){
   // two bins
   var b1x=70,b2x=W-140,by=H-56;
   cx.fillStyle=MG.scols[0]; cx.fillRect(b1x,by,70,50); cx.fillStyle=MG.scols[1]; cx.fillRect(b2x,by,70,50);
   cx.fillStyle="#fff"; cx.font="bold 11px Trebuchet MS"; cx.textAlign="center"; cx.fillText("BIN",b1x+35,by+30); cx.fillText("BIN",b2x+35,by+30);
   for(var i=0;i<MG.items.length;i++){ var it=MG.items[i]; if(it.done)continue;
    cx.fillStyle=it.col; cx.strokeStyle=i===MG.selItem?"#111":"rgba(0,0,0,.2)"; cx.lineWidth=i===MG.selItem?4:2;
    cx.beginPath(); cx.arc(it.x,it.y,15,0,7); cx.fill(); cx.stroke(); }
   var ln=0; for(var i=0;i<MG.items.length;i++){ if(!MG.items[i].done)ln++; }
   cx.fillStyle="#2a6ab0"; cx.font="bold 13px Trebuchet MS"; cx.textAlign="right"; cx.fillText("left: "+ln,W-8,18);
   return;
  }
  else if(t==="fetch"||t==="pounce"){
   // helper character at bottom
   cx.font="40px serif"; cx.textAlign="center"; cx.fillText(t==="fetch"?"🐕":"🐈",60,H-30);
   // moving toy
   MG.mt+=0.05; var mv=MG.mover; if(t==="pounce"){ mv.x=220+Math.sin(MG.mt*1.7)*150; mv.y=150+Math.cos(MG.mt*1.3)*90; }
   cx.fillStyle=t==="fetch"?"#ff8a3d":"#c0392b"; cx.beginPath(); cx.arc(mv.x,mv.y,mv.r,0,7); cx.fill();
   cx.strokeStyle="#7a3a12"; cx.lineWidth=2; cx.beginPath(); cx.arc(mv.x,mv.y,mv.r,0,7); cx.stroke();
   cx.fillStyle="#2a6ab0"; cx.font="bold 13px Trebuchet MS"; cx.textAlign="right"; cx.fillText((t==="fetch"?"fetches: ":"pounces: ")+MG.hit+" / "+MG.need,W-8,18);
   return;
  }
  else {
   if(t==="toss"){ cx.fillStyle="#5a7a9a"; cx.fillRect(W/2-34,H-58,68,50); cx.fillStyle="#456"; cx.fillRect(W/2-40,H-64,80,10); cx.fillStyle="#fff"; cx.font="bold 11px Trebuchet MS"; cx.textAlign="center"; cx.fillText("BIN",W/2,H-30); }
   if(t==="books"){ cx.fillStyle="#a06a34"; cx.fillRect(20,H-40,W-40,10); cx.fillStyle="#c98a4a"; cx.fillRect(20,H-30,W-40,6); }
   for(var i=0;i<MG.items.length;i++){ dItem(cx,MG.items[i],t); }
  }
  var leftn=0; for(var i=0;i<MG.items.length;i++){ if(!MG.items[i].done && !MG.items[i].matched)leftn++; }
  cx.fillStyle="#2a6ab0"; cx.font="bold 13px Trebuchet MS"; cx.textAlign="right";
  cx.fillText((t==="match"?"pairs left: "+Math.ceil(leftn/2):"left: "+leftn),W-8,18);
 }
 function mpos(e){ var r=mcv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*(440/r.width), y:(t.clientY-r.top)*(300/r.height)}; }
 mcv.addEventListener("pointerdown",function(e){ e.preventDefault(); if(!MG.active)return; ac(); var p=mpos(e); var t=MG.type;
  if(t==="match"){
   for(var i=0;i<MG.items.length;i++){ var it=MG.items[i]; if(it.matched)continue;
    if(Math.abs(p.x-it.x)<26 && p.y>it.y-40 && p.y<it.y+46){
     if(MG.sel<0){ MG.sel=i; }
     else if(MG.sel===i){ MG.sel=-1; }
     else { if(MG.items[MG.sel].col===it.col){ MG.items[MG.sel].matched=true; it.matched=true; MG.sel=-1; ding();
       if(MG.items.every(function(x){return x.matched;})) setTimeout(finishMini,300); }
      else { bad(); MG.sel=i; } } return; } }
  } else if(t==="fetch"||t==="pounce"){
   var mv=MG.mover; if(Math.hypot(p.x-mv.x,p.y-mv.y)<mv.r+14){ MG.hit++; ding();
    if(MG.hit>=MG.need){ setTimeout(finishMini,200); } else { mv.x=rnd(40,400); mv.y=rnd(40,240); } }
  } else if(t==="milk"){
   if(Math.hypot(p.x-(220-30),p.y-180)<40){ MG.hit++; tone(300+MG.hit*20,0.06,'sine',0.1); if(MG.hit>=MG.need){ ding(); setTimeout(finishMini,250); } }
  } else if(t==="sort"){
   var W=440,H=300, b1x=70,b2x=W-140,by=H-56;
   // tap a bin with an item selected?
   if(MG.selItem>=0 && p.y>by-6){ var it=MG.items[MG.selItem]; var binCat=(p.x<W/2)?0:1;
    if(it.cat===binCat){ it.done=true; MG.selItem=-1; ding(); if(MG.items.every(function(x){return x.done;})) setTimeout(finishMini,250); }
    else { bad(); } return; }
   // else pick an item
   for(var i=0;i<MG.items.length;i++){ var it=MG.items[i]; if(it.done)continue;
    if(Math.hypot(p.x-it.x,p.y-it.y)<20){ MG.selItem=i; return; } }
  } else {
   for(var i=0;i<MG.items.length;i++){ var it=MG.items[i]; if(it.done)continue;
    if(Math.abs(p.x-it.x)<22 && Math.abs(p.y-it.y)<22){ it.done=true; ding();
     if(MG.items.every(function(x){return x.done;})) setTimeout(finishMini,250); return; } }
  }
 },{passive:false});

 loadProg(); renderJobs(); startBots(); loop();
})();
