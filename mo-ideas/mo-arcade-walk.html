<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MO Arcade Walk</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;touch-action:none;}
 canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
 #hud{position:fixed;inset:0;pointer-events:none;}
 #title{position:absolute;top:8px;width:100%;text-align:center;font-size:17px;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:0 0 10px #e05aff,0 2px 5px #000;}
 #tix{position:absolute;top:8px;right:12px;font-size:16px;font-weight:bold;color:#ffd23f;text-shadow:0 0 8px #ffb02c,0 2px 4px #000;}
 #hint{position:absolute;top:32px;width:100%;text-align:center;font-size:12px;color:#e6c8ff;text-shadow:0 1px 4px #000;}
 .btn{pointer-events:auto;position:absolute;font:inherit;font-weight:bold;border:none;cursor:pointer;}
 #playBtn{display:none;bottom:26%;left:50%;transform:translateX(-50%);font-size:17px;padding:14px 28px;border-radius:999px;background:#6bd18a;color:#06280f;box-shadow:0 5px 0 #3a8f56;letter-spacing:1px;}
 #backBtn{display:none;top:8px;left:12px;font-size:13px;padding:8px 14px;border-radius:999px;background:#e0785a;color:#fff;box-shadow:0 4px 0 #a84e34;text-transform:uppercase;}
 #actBtn{display:none;bottom:16%;left:50%;transform:translateX(-50%);font-size:16px;padding:13px 26px;border-radius:999px;background:#ff8b2c;color:#2a1200;box-shadow:0 5px 0 #b85c12;text-transform:uppercase;}
 .btn:active{transform:translateY(3px) translateX(-50%);}
 #backBtn:active{transform:translateY(3px);}
 #toast{position:absolute;top:38%;width:100%;text-align:center;font-size:26px;font-weight:bold;color:#ffd23f;text-shadow:0 2px 10px #000;display:none;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
 <div id="title">MO Arcade</div>
 <div id="tix">🎟️ 0</div>
 <div id="hint">Walk to a machine and tap PLAY!</div>
 <button class="btn" id="backBtn">◀ Back</button>
 <button class="btn" id="playBtn">▶ Play</button>
 <button class="btn" id="actBtn">Go</button>
 <div id="toast"></div>
</div>
<script>
var cv=document.getElementById('cv'), cx=cv.getContext('2d'), W=0, H=0;
function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; } window.addEventListener('resize',resize); resize();
var tickets=0; function setTix(){ document.getElementById('tix').textContent='🎟️ '+tickets; }
function toast(m,c){ var t=document.getElementById('toast'); t.textContent=m; t.style.color=c||'#ffd23f'; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},1500); }
var actx=null; function AC(){ if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} return actx; }
function beep(f,d,ty){ var a=AC(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=ty||'square'; o.frequency.setValueAtTime(f,a.currentTime); o.frequency.exponentialRampToValueAtTime(Math.max(40,f/2),a.currentTime+(d||0.12)); g.gain.setValueAtTime(0.25,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function bark(){ var a=AC(); if(!a)return; if(a.state==='suspended')a.resume(); [0,0.17].forEach(function(dt){ var t=a.currentTime+dt; var o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter(); o.type='sawtooth'; o.frequency.setValueAtTime(430,t); o.frequency.exponentialRampToValueAtTime(170,t+0.12); f.type='bandpass'; f.frequency.value=950; f.Q.value=1.3; g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.45,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.14); o.connect(f);f.connect(g);g.connect(a.destination); o.start(t); o.stop(t+0.16); }); }
function win(n){ tickets+=n; setTix(); toast('YOU WIN! +'+n+' 🎟️','#6bd18a'); bark(); }
function lose(){ toast('Aw! Try again 🐾','#ff8b6b'); beep(160,0.2); }

var playBtn=document.getElementById('playBtn'), backBtn=document.getElementById('backBtn'), actBtn=document.getElementById('actBtn'), hint=document.getElementById('hint');
function showEl(el,on){ el.style.display=on?'block':'none'; }

// ===== world =====
var MODE='walk';
var mo={x:0.5,y:0.6}, moPx={x:0,y:0}, arff={x:0,y:0};
var joy={active:false,cx:0,cy:0,dx:0,dy:0};
var CABS=[
 {fx:0.5,fy:0.15,name:'Arff 3-Point',col:'#ff8b2c',g:'three'},
 {fx:0.16,fy:0.4,name:'Whack-a-Pup',col:'#6bd18a',g:'whack'},
 {fx:0.84,fy:0.4,name:'Prize Wheel',col:'#c79cff',g:'wheel'},
 {fx:0.5,fy:0.7,name:'Claw Grab',col:'#e0568a',g:'claw'}
];
function cabPx(c){ return {x:c.fx*W, y:c.fy*H}; }
var nearCab=null;

function pos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',function(e){ var p=pos(e); if(AC()&&AC().state==='suspended')AC().resume();
 if(MODE==='walk'){ if(p.y>H*0.5 && p.x<W*0.5){ joy.active=true; joy.cx=p.x; joy.cy=p.y; joy.dx=0; joy.dy=0; joy.id=e.pointerId; } }
 else if(gamePointer){ gamePointer('down',p); } });
cv.addEventListener('pointermove',function(e){ var p=pos(e); if(MODE==='walk'){ if(joy.active&&e.pointerId===joy.id){ joy.dx=p.x-joy.cx; joy.dy=p.y-joy.cy; } } else if(gamePointer){ gamePointer('move',p); } });
cv.addEventListener('pointerup',function(e){ if(joy.active&&e.pointerId===joy.id){ joy.active=false; joy.dx=joy.dy=0; } if(gamePointer)gamePointer('up',pos(e)); });
cv.addEventListener('pointercancel',function(e){ joy.active=false; joy.dx=joy.dy=0; });

playBtn.onclick=function(){ if(nearCab){ openGame(nearCab.g, nearCab.name); } };
backBtn.onclick=function(){ MODE='walk'; gamePointer=null; showEl(backBtn,false); showEl(actBtn,false); };

// ===== hub draw/update =====
function drawChar(x,y,r,body,face){ cx.fillStyle=body; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill(); cx.fillStyle=face; cx.beginPath(); cx.arc(x,y-r*0.5,r*0.6,0,7); cx.fill(); }
function updateHub(){ moPx.x=mo.x*W; moPx.y=mo.y*H;
 if(joy.active){ var d=Math.hypot(joy.dx,joy.dy); if(d>8){ var sp=Math.min(1,d/60)*0.010; mo.x=Math.max(0.06,Math.min(0.94,mo.x+joy.dx/d*sp)); mo.y=Math.max(0.1,Math.min(0.9,mo.y+joy.dy/d*sp)); } }
 // arff follow
 arff.x+=((mo.x*W-40)-arff.x)*0.12; arff.y+=((mo.y*H+8)-arff.y)*0.12;
 // nearest cabinet
 nearCab=null; var best=1e9; CABS.forEach(function(c){ var cp=cabPx(c); var d=Math.hypot(cp.x-mo.x*W, cp.y-mo.y*H); if(d<Math.min(W,H)*0.16 && d<best){ best=d; nearCab=c; } });
 showEl(playBtn, !!nearCab); if(nearCab){ playBtn.textContent='▶ Play '+nearCab.name; }
 hint.textContent = nearCab? 'Tap PLAY to try '+nearCab.name+'!' : 'Walk to a machine and tap PLAY!';
}
function drawHub(){ // floor
 cx.fillStyle='#160a2e'; cx.fillRect(0,0,W,H);
 // neon grid
 cx.strokeStyle='rgba(160,60,255,.18)'; cx.lineWidth=1; for(var gx=0;gx<W;gx+=44){ cx.beginPath(); cx.moveTo(gx,60); cx.lineTo(gx,H); cx.stroke(); } for(var gy=60;gy<H;gy+=44){ cx.beginPath(); cx.moveTo(0,gy); cx.lineTo(W,gy); cx.stroke(); }
 // cabinets
 CABS.forEach(function(c){ var p=cabPx(c); var w=64,h=84; cx.save(); cx.translate(p.x,p.y);
  cx.fillStyle=c.col; roundRect(-w/2,-h/2,w,h,10); cx.fill();
  cx.fillStyle='#101018'; roundRect(-w/2+8,-h/2+10,w-16,h*0.42,6); cx.fill();
  cx.fillStyle='rgba(255,255,255,.85)'; cx.font='bold 12px Trebuchet MS'; cx.textAlign='center'; cx.fillText(c.name,0,h/2+16);
  if(nearCab===c){ cx.strokeStyle='#ffd23f'; cx.lineWidth=4; roundRect(-w/2-4,-h/2-4,w+8,h+8,12); cx.stroke(); }
  cx.restore(); });
 // Arff (fluffy white Maltipoo)
 var ax=arff.x, ay=arff.y; cx.fillStyle='#ffffff'; [[0,0,14],[-9,-3,8],[9,-3,8],[-6,7,8],[6,7,8],[0,-9,8]].forEach(function(o){ cx.beginPath(); cx.arc(ax+o[0],ay+o[1],o[2],0,7); cx.fill(); });
 cx.fillStyle='#f1f4f8'; cx.beginPath(); cx.ellipse(ax-13,ay-1,5,9,-0.3,0,7); cx.ellipse(ax+13,ay-1,5,9,0.3,0,7); cx.fill();
 cx.fillStyle='#20263a'; cx.beginPath(); cx.arc(ax-4,ay-2,2,0,7); cx.arc(ax+4,ay-2,2,0,7); cx.fill(); cx.fillStyle='#2a2a2a'; cx.beginPath(); cx.arc(ax,ay+3,2.6,0,7); cx.fill();
 cx.strokeStyle='#ff7ab0'; cx.lineWidth=4; cx.beginPath(); cx.arc(ax,ay+6,10,0.2,Math.PI-0.2); cx.stroke();
 // Mo (brown skin, orange shirt, red headband)
 var mx=mo.x*W,my=mo.y*H; cx.fillStyle='#ff8c1a'; cx.beginPath(); cx.arc(mx,my,18,0,7); cx.fill(); cx.fillStyle='#8a5a34'; cx.beginPath(); cx.arc(mx,my-14,12,0,7); cx.fill(); cx.fillStyle='#2a1808'; cx.beginPath(); cx.arc(mx,my-18,12,Math.PI,0); cx.fill(); cx.strokeStyle='#e23b3b'; cx.lineWidth=4; cx.beginPath(); cx.arc(mx,my-15,12,Math.PI,0); cx.stroke(); cx.fillStyle='#20263a'; cx.beginPath(); cx.arc(mx-4,my-13,2,0,7); cx.arc(mx+4,my-13,2,0,7); cx.fill();
 // joystick
 if(joy.active){ cx.strokeStyle='rgba(255,255,255,.35)'; cx.lineWidth=3; cx.beginPath(); cx.arc(joy.cx,joy.cy,46,0,7); cx.stroke(); var kx=joy.cx+Math.max(-40,Math.min(40,joy.dx)), ky=joy.cy+Math.max(-40,Math.min(40,joy.dy)); cx.fillStyle='rgba(127,208,255,.85)'; cx.beginPath(); cx.arc(kx,ky,22,0,7); cx.fill(); }
 else { cx.fillStyle='rgba(255,255,255,.08)'; cx.beginPath(); cx.arc(60,H-70,42,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.4)'; cx.font='11px Trebuchet MS'; cx.textAlign='center'; cx.fillText('WALK',60,H-66); }
}
function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

// ===== games (win or lose) =====
var gamePointer=null, GG=null, gameTitle='';
function openGame(id,name){ MODE=id; gameTitle=name; showEl(playBtn,false); showEl(backBtn,true); GAMES[id](); }
function endGame(){ showEl(actBtn,false); gamePointer=null; }

var GAMES={};
// Arff 3-Point: 3 shots, stop the power meter in the GREEN to make it. 2+ makes = win.
GAMES.three=function(){ var shots=3, makes=0, power=0, dir=1, phase='aim', ball={x:0,y:0,t:0,made:false};
 showEl(actBtn,true); actBtn.textContent='SHOOT 🏀'; hint.textContent='Stop the bar in the GREEN to swish a 3-pointer!';
 actBtn.onclick=function(){ if(phase!=='aim')return; ball.made=(power>=42&&power<=72); phase='fly'; ball.t=0; };
 GG={ update:function(){ if(phase==='aim'){ power+=dir*2.2; if(power>=100){power=100;dir=-1;} if(power<=0){power=0;dir=1;} }
   else if(phase==='fly'){ ball.t+=0.04; if(ball.t>=1){ if(ball.made){ makes++; beep(760,0.1,'triangle'); } else beep(180,0.15); shots--; if(shots<=0){ phase='done'; setTimeout(function(){ if(makes>=2){ win(30); } else lose(); MODE='walk'; endGame(); showEl(backBtn,false); },700); } else { phase='aim'; ball.t=0; } } } },
  draw:function(){ var CXp=W/2, hoopY=H*0.24, ballY0=H*0.7;
   cx.fillStyle='#241046'; cx.fillRect(0,0,W,H);
   cx.fillStyle='#e9edf2'; roundRect(CXp-46,hoopY-30,92,54,6); cx.fill(); cx.strokeStyle='#ff7a1a'; cx.lineWidth=6; cx.beginPath(); cx.moveTo(CXp-30,hoopY+24); cx.lineTo(CXp+30,hoopY+24); cx.stroke();
   var bx=CXp, by=ballY0; if(phase==='fly'){ bx=CXp; by=ballY0+(hoopY+24-ballY0)*ball.t; by-=Math.sin(Math.PI*ball.t)* (H*0.12); if(!ball.made && ball.t>0.8){ bx=CXp+ (ball.t-0.8)*160; } }
   cx.fillStyle='#e07a2a'; cx.beginPath(); cx.arc(bx,by,18,0,7); cx.fill();
   // power meter
   var pw=Math.min(W-80,260); var px=(W-pw)/2, py=H*0.86;
   cx.fillStyle='#e0563b'; roundRect(px,py,pw,20,10); cx.fill(); cx.fillStyle='#6bd18a'; cx.fillRect(px+pw*0.42,py,pw*0.30,20); cx.fillStyle='#fff'; cx.fillRect(px+pw*(power/100)-2,py-4,5,28);
   cx.fillStyle='#fff'; cx.font='bold 20px Trebuchet MS'; cx.textAlign='center'; cx.fillText('Shots left: '+shots+'   Made: '+makes,W/2,70);
  } }; };
// Whack-a-Pup: tap pups in 15s. 8+ = win.
GAMES.whack=function(){ var holes=[], up=-1, upUntil=0, score=0, endAt=Date.now()+15000;
 var cols=3, rows=2; for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)holes.push({x:(c+1)/(cols+1)*W, y:H*0.34+r*H*0.24});
 hint.textContent='Tap the pup when it pops up! Get 8 to win!';
 gamePointer=function(t,p){ if(t==='down'&&up>=0){ var h=holes[up]; if(Math.hypot(p.x-h.x,p.y-h.y)<50){ score++; beep(800,0.08,'triangle'); up=-1; } } };
 GG={ update:function(){ var now=Date.now(); if(now>=endAt){ setTimeout(function(){ if(score>=8)win(25); else lose(); MODE='walk'; endGame(); showEl(backBtn,false); },500); GG=null; return; } if(up<0||now>upUntil){ up=(Math.random()*holes.length)|0; upUntil=now+560+Math.random()*380; } },
  draw:function(){ cx.fillStyle='#0e2a16'; cx.fillRect(0,0,W,H); holes.forEach(function(h,i){ cx.fillStyle='#083008'; cx.beginPath(); cx.ellipse(h.x,h.y+28,46,18,0,0,7); cx.fill(); if(i===up){ cx.fillStyle='#fff'; cx.beginPath(); cx.arc(h.x,h.y,26,0,7); cx.fill(); cx.fillStyle='#ff7ab0'; cx.fillRect(h.x-10,h.y+16,20,5); cx.fillStyle='#20263a'; cx.beginPath(); cx.arc(h.x-7,h.y-4,3,0,7); cx.arc(h.x+7,h.y-4,3,0,7); cx.fill(); } });
   var tl=Math.max(0,Math.ceil((endAt-Date.now())/1000)); cx.fillStyle='#fff'; cx.font='bold 20px Trebuchet MS'; cx.textAlign='center'; cx.fillText('Time: '+tl+'   Pups: '+score+'/8',W/2,70); } }; };
// Prize Wheel: tap SPIN, land on a value. 0 = lose.
GAMES.wheel=function(){ var slices=[10,0,25,5,50,0,15,30], N=8, ang=0, vel=0, spinning=false, done=false;
 showEl(actBtn,true); actBtn.textContent='SPIN 🎡'; hint.textContent='Tap SPIN — land on tickets to win!';
 actBtn.onclick=function(){ if(spinning)return; vel=0.35+Math.random()*0.25; spinning=true; done=false; beep(500,0.1); };
 GG={ update:function(){ if(spinning){ ang+=vel; vel*=0.985; if(vel<0.003){ spinning=false; if(!done){ done=true; var idx=(N-(Math.floor(((ang%(Math.PI*2))/(Math.PI*2))*N)%N))%N; var amt=slices[idx]; setTimeout(function(){ if(amt>0)win(amt); else lose(); MODE='walk'; endGame(); showEl(backBtn,false); },600); } } } },
  draw:function(){ cx.fillStyle='#1a1030'; cx.fillRect(0,0,W,H); var CXp=W/2,CYp=H*0.5,R=Math.min(W,H)*0.32; var cols=['#ff8b2c','#555','#6bd18a','#7fd0ff','#ffd23f','#555','#e0568a','#c79cff'];
   for(var i=0;i<N;i++){ var a0=ang+i/N*Math.PI*2, a1=ang+(i+1)/N*Math.PI*2; cx.fillStyle=cols[i]; cx.beginPath(); cx.moveTo(CXp,CYp); cx.arc(CXp,CYp,R,a0,a1); cx.closePath(); cx.fill(); cx.save(); cx.translate(CXp,CYp); cx.rotate((a0+a1)/2); cx.fillStyle='#20263a'; cx.font='bold 18px Trebuchet MS'; cx.textAlign='right'; cx.textBaseline='middle'; cx.fillText(slices[i]||'X',R-14,0); cx.restore(); }
   cx.fillStyle='#fff'; cx.beginPath(); cx.moveTo(CXp-12,CYp-R-4); cx.lineTo(CXp+12,CYp-R-4); cx.lineTo(CXp,CYp-R+16); cx.closePath(); cx.fill(); cx.textBaseline='alphabetic'; } }; };
// Claw Grab: claw slides, tap DROP. Over a prize = win.
GAMES.claw=function(){ var clawX=W/2, dir=1, dropping=0, clawY=0, prizes=[], grabbed=null, done=false;
 var pe=['🦴','🎾','🧸','⭐','🎁']; for(var i=0;i<5;i++)prizes.push({x:(i+1)/6*W, e:pe[i], got:false});
 showEl(actBtn,true); actBtn.textContent='DROP ⬇'; hint.textContent='Tap DROP over a prize to win it!';
 clawY=H*0.2;
 actBtn.onclick=function(){ if(dropping)return; dropping=1; beep(300,0.1); };
 GG={ update:function(){ if(!dropping){ clawX+=dir*4; if(clawX>W*0.85){clawX=W*0.85;dir=-1;} if(clawX<W*0.15){clawX=W*0.15;dir=1;} }
   else if(dropping===1){ clawY+=8; if(clawY>=H*0.62){ dropping=2; var hit=null; prizes.forEach(function(p){ if(!p.got&&Math.abs(p.x-clawX)<34)hit=p; }); grabbed=hit; if(hit){hit.got=true; beep(700,0.15,'triangle');} else beep(160,0.2); } }
   else if(dropping===2){ clawY-=8; if(grabbed){ grabbed.x=clawX; } if(clawY<=H*0.2){ if(!done){ done=true; setTimeout(function(){ if(grabbed)win(30); else lose(); MODE='walk'; endGame(); showEl(backBtn,false); },500); } } } },
  draw:function(){ cx.fillStyle='#241640'; cx.fillRect(0,0,W,H); cx.strokeStyle='#5a4a7a'; cx.lineWidth=6; cx.strokeRect(W*0.08,H*0.1,W*0.84,H*0.72);
   prizes.forEach(function(p){ if(p.got&&grabbed!==p)return; var py=(grabbed===p)?clawY+30:H*0.72; cx.font='34px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(p.e,p.x,py); }); cx.textBaseline='alphabetic';
   cx.strokeStyle='#c9bce0'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(clawX,H*0.1); cx.lineTo(clawX,clawY); cx.stroke(); cx.fillStyle='#c9bce0'; cx.beginPath(); cx.moveTo(clawX-14,clawY); cx.lineTo(clawX,clawY+18); cx.lineTo(clawX+14,clawY); cx.closePath(); cx.fill(); } }; };

setTix();
function loop(){ if(MODE==='walk'){ updateHub(); drawHub(); } else if(GG){ GG.update(); if(GG)GG.draw(); } requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
