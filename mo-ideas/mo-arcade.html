<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MO Arcade</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;
  background:radial-gradient(120% 80% at 50% 0%,#3a1a6a 0%,#1c0e38 55%,#0c0620 100%);color:#fff;}
 #wrap{max-width:660px;margin:0 auto;padding:24px 16px 50px;}
 header{text-align:center;margin-bottom:16px;}
 h1{margin:4px 0 2px;font-size:34px;letter-spacing:4px;text-transform:uppercase;text-shadow:0 0 12px #ff9e3a,0 0 26px #e05aff;}
 .sub{color:#e6c8ff;font-size:14px;margin:0;}
 .hero{display:grid;gap:14px;margin:14px 0 8px;}
 .big{border-radius:20px;padding:20px 16px;text-decoration:none;color:#160a2e;display:flex;align-items:center;gap:14px;box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 30px rgba(255,255,255,.08);transition:transform .08s;}
 .big:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.35);}
 .big .be{font-size:48px;} .big .bn{font-size:21px;font-weight:bold;display:block;} .big .bd{font-size:12px;opacity:.85;}
 .sect{color:#c9a6ff;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:18px 4px 8px;}
 .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
 a.card{text-decoration:none;color:#160a2e;border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .08s;}
 a.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
 a.card .ce{font-size:34px;} a.card .cn{font-size:14px;font-weight:bold;margin-top:4px;} a.card .cd{font-size:11px;opacity:.8;line-height:1.2;margin-top:2px;}
 footer{text-align:center;color:#8a7ab0;font-size:12px;margin-top:26px;}
</style>
</head>
<body>
<div id="wrap">
 <header><div style="font-size:50px;">🕹️</div><h1>MO Arcade</h1><p class="sub">Pick a game to play! 🏀🐾</p></header>

 <div class="hero">
   <a class="big" href="mo-arcade-walk.html" style="background:linear-gradient(135deg,#c79cff,#8b5ae0);">
     <span class="be">🚶</span><span><span class="bn">Walk the Arcade</span><span class="bd">Walk Mo &amp; Arff to every machine — all games in one!</span></span></a>
   <a class="big" href="mo-arff-arcade.html" style="background:linear-gradient(135deg,#ffe58a,#ff9e3a);">
     <span class="be">🐶</span><span><span class="bn">Arff Arcade</span><span class="bd">15 tap &amp; drag games — win tickets &amp; prizes</span></span></a>
 </div>

 <div class="sect">⭐ Pro Games</div>
 <div class="grid" id="pro"></div>

 <div class="sect">🎮 More Games</div>
 <div class="grid" id="more"></div>

 <footer>Made by Coach Mo 🏀🐾</footer>
</div>
<script>
var PRO=[
 ['🎓','Arff School','teach Arff tricks','mo-arff-school.html','linear-gradient(135deg,#a0e0ff,#5aa0e0)'],
 ['🏨','MO Hotel','run the hotel','mo-hotel.html','linear-gradient(135deg,#ffb0d0,#e05a9a)'],
 ['🚇','MO Subway','run the subway','mo-subway.html','linear-gradient(135deg,#8fd6ff,#3a9ad0)'],
 ['🛋️','MO Decorate','build &amp; decorate','mo-decorate.html','linear-gradient(135deg,#b0ffd0,#39c46a)'],
 ['🏠','MO Playhouse','build a playhouse','mo-playhouse.html','linear-gradient(135deg,#ffd08a,#e0863a)']
];
var MORE=[
 ['🔨','MO Fix & Flip','clean &amp; fix','mo-fix-flip-3d.html','#ff8b2c'],
 ['🏙️','MO City','walk the city','mo-city-3d.html','#5a9ae0'],
 ['🏡','MO House','furnish a room','mo-house-3d.html','#b08ae0'],
 ['🚗','MO Driving','drive &amp; ramps','mo-driving.html','#e0a030'],
 ['📦','MO Move','move houses','mo-move.html','#3fbfa8'],
 ['🎉','MO Party','throw a party','mo-party.html','#e05a9a'],
 ['🐷','MO Pig Homes','build pig homes','mo-pig-homes.html','#ff9ec7'],
 ['🛏️','MO Stay','run an Airbnb','mo-stay.html','#3fbfa8'],
 ['💒','MO Wedding','plan a wedding','mo-wedding.html','#e0a0d0'],
 ['🐕','MO Rover','pick &amp; name pets','mo-rover.html','#f0c040']
];
function shade(hex){ var n=parseInt(hex.slice(1),16); var r=(n>>16)&255,g=(n>>8)&255,b=n&255; r=Math.round(r*0.7);g=Math.round(g*0.7);b=Math.round(b*0.7); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
var pro=document.getElementById('pro');
PRO.forEach(function(g){ var a=document.createElement('a'); a.className='card'; a.href=g[3]; a.style.background=g[4]; a.innerHTML='<span class="ce">'+g[0]+'</span><span class="cn">'+g[1]+'</span><span class="cd">'+g[2]+'</span>'; pro.appendChild(a); });
var more=document.getElementById('more');
MORE.forEach(function(g){ var a=document.createElement('a'); a.className='card'; a.href=g[3]; a.style.background='linear-gradient(160deg,'+g[4]+','+shade(g[4])+')'; a.innerHTML='<span class="ce">'+g[0]+'</span><span class="cn">'+g[1]+'</span><span class="cd">'+g[2]+'</span>'; more.appendChild(a); });
</script>
</body>
</html>
