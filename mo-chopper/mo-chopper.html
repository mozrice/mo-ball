<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MO RESCUE CHOPPER</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe4ff;font-family:'Trebuchet MS',system-ui,sans-serif;color:#0a2a44;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;font-weight:bold;}
  .pill{background:#ffffffcc;border-radius:20px;padding:6px 14px;font-size:17px;color:#0a2a44;box-shadow:0 2px 0 #0001;}
  .key{position:fixed;bottom:24px;width:84px;height:84px;border-radius:50%;background:#ffffff55;border:3px solid #ffffff99;display:flex;align-items:center;justify-content:center;font-size:34px;color:#0a2a44;user-select:none;}
  #lft{left:16px;} #rgt{left:112px;}
  #up{right:16px;width:100px;height:100px;background:linear-gradient(#7be07b,#2fbf4a);color:#fff;border-color:#fff;font-size:22px;font-weight:bold;}
  .key:active{transform:translateY(3px);}
  #hint{position:fixed;bottom:130px;left:0;right:0;text-align:center;font-size:14px;color:#0a2a44;background:#ffffff88;padding:5px;pointer-events:none;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#bfe4ffd8;text-align:center;}
  #over h1{font-size:36px;margin:0 0 6px;} #over p{font-size:20px;margin:4px;}
  .btn{margin-top:16px;background:linear-gradient(#43c6ff,#1a8fd6);border:none;color:#fff;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;box-shadow:0 5px 0 #0e5a8a;font-family:inherit;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill">🧑 <span id="saved">0</span></div>
  <div class="pill">⏱️ <span id="time">90</span>s</div>
  <div class="pill">🚁 <span id="carry">0</span>/3</div>
</div>
<div class="key" id="lft">◀</div>
<div class="key" id="rgt">▶</div>
<button class="key" id="up">▲ UP</button>
<div id="hint">Hold ▲ to fly up • fly low over 🧍 to pick up • drop at 🏥</div>
<div id="over"><h1 id="ot">🚁 SHIFT OVER!</h1><p id="os"></p><button class="btn" id="again">Fly Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1,GY=0;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); GY=H-70; }
  addEventListener('resize',resize); resize();
  function beep(f,d,t,v){ try{var a=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());var o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.06;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1));o.stop(a.currentTime+(d||0.1)+0.02);}catch(e){} }
  var heli, people, pad, carried, saved, timeLeft, running, rotor, nowv=0, buildings;
  function reset(){ heli={x:W*0.5,y:120,vx:0,vy:0}; carried=[]; saved=0; timeLeft=90; running=true; rotor=0;
    buildings=[{x:W*0.12,w:90,h:120},{x:W*0.42,w:80,h:80},{x:W*0.7,w:100,h:150}];
    pad={x:W*0.86,y:GY-40,w:90,h:40};
    people=[]; for(var i=0;i<4;i++) people.push(newPerson());
    document.getElementById('over').style.display='none'; document.getElementById('saved').textContent='0'; document.getElementById('carry').textContent='0/3'; document.getElementById('time').textContent='90';
    if(!reset._t){ reset._t=setInterval(function(){ if(running){ timeLeft--; document.getElementById('time').textContent=Math.max(0,timeLeft); if(timeLeft<=0) over(); } },1000); } }
  function rnd(a,b){return a+Math.random()*(b-a);}
  function newPerson(){ // stand on ground or a rooftop
    var spots=[{x:rnd(60,W*0.8),y:GY}]; buildings.forEach(function(b){ spots.push({x:b.x,y:GY-b.h}); });
    var s=spots[Math.floor(Math.random()*spots.length)]; return {x:s.x+rnd(-20,20),y:s.y,ph:rnd(0,6)}; }
  var L=false,R=false,U=false;
  function hold(el,set){ el.addEventListener('touchstart',function(e){set(true);e.preventDefault();},{passive:false}); el.addEventListener('touchend',function(e){set(false);e.preventDefault();},{passive:false}); el.addEventListener('mousedown',function(){set(true);}); el.addEventListener('mouseup',function(){set(false);}); el.addEventListener('mouseleave',function(){set(false);}); }
  hold(document.getElementById('lft'),function(v){L=v;}); hold(document.getElementById('rgt'),function(v){R=v;}); hold(document.getElementById('up'),function(v){U=v;});
  addEventListener('keydown',function(e){ if(e.key==='ArrowLeft')L=true; if(e.key==='ArrowRight')R=true; if(e.key==='ArrowUp'||e.key===' ')U=true; });
  addEventListener('keyup',function(e){ if(e.key==='ArrowLeft')L=false; if(e.key==='ArrowRight')R=false; if(e.key==='ArrowUp'||e.key===' ')U=false; });
  document.getElementById('again').onclick=reset;
  function over(){ running=false; document.getElementById('os').innerHTML='You rescued <b>'+saved+'</b> people! 🎉'; document.getElementById('over').style.display='flex'; }
  function update(dt){
    rotor+=1.2*dt;
    heli.vy+=0.12*dt; if(U) heli.vy-=0.3*dt; heli.vy*=0.99;
    if(L) heli.vx-=0.25*dt; if(R) heli.vx+=0.25*dt; heli.vx*=0.94;
    heli.x+=heli.vx*dt; heli.y+=heli.vy*dt;
    heli.x=Math.max(30,Math.min(W-30,heli.x));
    if(heli.y<40){heli.y=40;heli.vy=0;}
    if(heli.y>GY-14){ heli.y=GY-14; if(heli.vy>0)heli.vy=0; } // land gently on ground
    // pickup
    if(carried.length<3){ for(var i=people.length-1;i>=0;i--){ var p=people[i]; p.ph+=0.1*dt;
      if(Math.abs(p.x-heli.x)<34 && Math.abs((heli.y+30)-p.y)<40){ carried.push({}); people.splice(i,1); document.getElementById('carry').textContent=carried.length+'/3'; beep(700,0.1,'sine',0.06);
        setTimeout(function(){ if(running) people.push(newPerson()); },1500); } } }
    // drop at hospital
    if(carried.length>0 && Math.abs(heli.x-(pad.x))<pad.w*0.6 && heli.y>pad.y-70){ saved+=carried.length; document.getElementById('saved').textContent=saved; carried=[]; document.getElementById('carry').textContent='0/3'; beep(900,0.1,'square',0.07); setTimeout(function(){beep(1200,0.12,'square',0.06);},80); }
  }
  function render(){
    var sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#8fd3ff'); sky.addColorStop(1,'#dff2ff'); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff4c0'; ctx.beginPath(); ctx.arc(W*0.15,80,30,0,6.29); ctx.fill();
    // ground
    ctx.fillStyle='#6bbf5a'; ctx.fillRect(0,GY,W,H-GY); ctx.fillStyle='#5aa64a'; ctx.fillRect(0,GY,W,6);
    // buildings
    for(var b=0;b<buildings.length;b++){ var bd=buildings[b]; ctx.fillStyle='#9aa4b0'; ctx.fillRect(bd.x-bd.w/2,GY-bd.h,bd.w,bd.h);
      ctx.fillStyle='#c7d0da'; for(var wx=bd.x-bd.w/2+8;wx<bd.x+bd.w/2-8;wx+=18){ for(var wy=GY-bd.h+10;wy<GY-14;wy+=22){ ctx.fillRect(wx,wy,10,12); } } }
    // hospital pad
    ctx.fillStyle='#e8eef5'; ctx.fillRect(pad.x-pad.w/2,pad.y,pad.w,pad.h+30);
    ctx.fillStyle='#e0453a'; ctx.font='22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🏥',pad.x,pad.y-14);
    ctx.fillStyle='#3a6ea5'; ctx.fillRect(pad.x-pad.w/2,pad.y,pad.w,8); ctx.fillStyle='#fff'; ctx.font='bold 18px Trebuchet MS'; ctx.fillText('H',pad.x,pad.y+22);
    // waiting people
    for(var i=0;i<people.length;i++){ var p=people[i]; drawPerson(p.x,p.y,Math.sin(p.ph)*0.3,true); }
    // helicopter
    drawHeli();
  }
  function drawPerson(x,y,wave,waving){ ctx.save(); ctx.translate(x,y);
    ctx.fillStyle='#e0453a'; roundRect(-7,-22,14,16,4); ctx.fill();
    ctx.fillStyle='#2a2a3a'; ctx.fillRect(-6,-8,5,8); ctx.fillRect(1,-8,5,8);
    ctx.fillStyle='#f6c48a'; ctx.beginPath(); ctx.arc(0,-27,6,0,6.29); ctx.fill();
    if(waving){ ctx.strokeStyle='#e0453a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(6,-18); ctx.lineTo(12,-24-wave*6); ctx.stroke(); }
    ctx.restore(); }
  function drawHeli(){ var x=heli.x,y=heli.y; ctx.save(); ctx.translate(x,y); ctx.rotate(Math.max(-0.3,Math.min(0.3,heli.vx*0.04)));
    // rope + carried people
    for(var c=0;c<carried.length;c++){ ctx.strokeStyle='#eee'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(0,34+c*20); ctx.stroke(); drawPerson(0,34+c*20+22,0,false); }
    // body
    ctx.fillStyle='#e0453a'; ctx.beginPath(); ctx.ellipse(0,0,30,16,0,0,6.29); ctx.fill();
    ctx.fillStyle='#b53228'; ctx.fillRect(20,-4,34,7); // tail
    ctx.fillStyle='#9fd0ee'; ctx.beginPath(); ctx.ellipse(-10,-2,12,10,0,0,6.29); ctx.fill(); // window
    ctx.fillStyle='#12406b'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('MO',-10,-1);
    // skids
    ctx.strokeStyle='#333'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-20,16); ctx.lineTo(20,16); ctx.moveTo(-14,14); ctx.lineTo(-14,20); ctx.moveTo(12,14); ctx.lineTo(12,20); ctx.stroke();
    // main rotor spinning
    var rw=Math.cos(rotor)*34; ctx.strokeStyle='#333'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-rw,-18); ctx.lineTo(rw,-18); ctx.stroke(); ctx.fillStyle='#333'; ctx.fillRect(-2,-18,4,8);
    // tail rotor
    var tw=Math.sin(rotor*1.6)*8; ctx.beginPath(); ctx.moveTo(52,-6+tw); ctx.lineTo(52,-6-tw); ctx.lineWidth=3; ctx.stroke();
    ctx.restore(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  var last=0;
  function loop(ts){ nowv=ts; if(!last)last=ts; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts; if(running) update(dt); render(); requestAnimationFrame(loop); }
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
