<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Hotel</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#3a2a5a;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
function d(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function moveTo(o,tx,ty,sp){ var dx=tx-o.x, dy=ty-o.y, m=Math.hypot(dx,dy); if(m<0.5)return 0; o.x+=dx/m*Math.min(sp,m); o.y+=dy/m*Math.min(sp,m); return m; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,dd,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(dd||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(dd||0.12)+0.02); }
function bell(){ bp(1050,0.12,'sine',0.14); setTimeout(function(){bp(1400,0.14,'sine',0.12);},70); }
function cash(){ bp(880,0.08,'triangle',0.15); setTimeout(function(){bp(1250,0.1,'triangle',0.14);},60); }
function cardS(){ bp(600,0.06,'triangle',0.13); setTimeout(function(){bp(900,0.08,'triangle',0.12);},55); }
function cleanS(){ bp(700,0.05,'triangle',0.12); setTimeout(function(){bp(520,0.06,'triangle',0.1);},50); }
function nope(){ bp(200,0.09,'square',0.09); }

function inR(p,r){ return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
var PLAYBTN={x:W/2-90,y:H/2+40,w:180,h:60};
var BW=(W-40)/4, BY=H-78, BH=62;
var BTN={ checkin:{x:12,y:BY,w:BW-6,h:BH}, clean:{x:12+BW,y:BY,w:BW-6,h:BH}, serve:{x:12+BW*2,y:BY,w:BW-6,h:BH}, hire:{x:12+BW*3,y:BY,w:BW-6,h:BH} };
var MODEBTN={x:W/2-110,y:H/2+118,w:220,h:40};
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(scene==='title'){ if(inR(p,MODEBTN)){ joyMode=!joyMode; try{localStorage.setItem('moHotelJoy',joyMode?'1':'0');}catch(_){} bell(); return; } if(inR(p,PLAYBTN)) start('new'); return; }
  if(scene==='over'){ if(inR(p,PLAYBTN)) start(result==='win'?'next':'retry'); return; }
  if(inR(p,BTN.checkin)){ cmd('checkin'); return; }
  if(inR(p,BTN.clean)){ cmd('clean'); return; }
  if(inR(p,BTN.serve)){ cmd('serve'); return; }
  if(inR(p,BTN.hire)){ hire(); return; }
  if(curObj().t==='fun'){ for(var fj=0;fj<funs.length;fj++){ if(Math.hypot(p.x-funs[fj].x,p.y-funs[fj].y)<26){ collectFun(fj); return; } } }
  if(joyMode){ if(p.y>104 && p.y<BY){ JOY.active=true; JOY.id=e.pointerId; JOY.bx=p.x; JOY.by=p.y; JOY.dx=0; JOY.dy=0; } return; }
  for(var si=0;si<stealers.length;si++){ if(!stealers[si].claimed && Math.hypot(p.x-stealers[si].x,p.y-stealers[si].y)<28){ assignCatch(stealers[si]); return; } }
});
cv.addEventListener('pointermove',function(e){ if(!JOY.active||e.pointerId!==JOY.id)return; var p=pt(e); var dx=p.x-JOY.bx, dy=p.y-JOY.by, m=Math.hypot(dx,dy); if(m>JOY.R){ dx=dx/m*JOY.R; dy=dy/m*JOY.R; } JOY.dx=dx; JOY.dy=dy; });
function joyEnd(e){ if(e.pointerId===JOY.id){ JOY.active=false; JOY.id=null; JOY.dx=0; JOY.dy=0; } }
cv.addEventListener('pointerup',joyEnd); cv.addEventListener('pointercancel',joyEnd);

var scene='title';
var GY=110, GB=H-150;
var boss={x:W/2,y:H-118,step:0};
var STAFFHOME=[{x:44,y:H-210},{x:44,y:H-160},{x:356,y:H-210},{x:356,y:H-160},{x:44,y:H-110}];
var ROOMTYPES=[
 {n:'Standard',rate:5,col:'#cdbfe4'},
 {n:'Deluxe King',rate:8,col:'#bcd0ec'},
 {n:'Family Suite',rate:9,col:'#c6e4bf'},
 {n:'Ocean Suite',rate:12,col:'#a9dbec'},
 {n:'Presidential',rate:20,col:'#ecdca6'}
];
var RTA=[0,0,1,0,1,3,2,1,4];
var ROOMS=[]; var RX=[80,200,320], RY=[150,250,350];
for(var r=0;r<3;r++)for(var c=0;c<3;c++){ var idx=r*3+c; ROOMS.push({x:RX[c],y:RY[r],num:101+idx,type:ROOMTYPES[RTA[idx]],state:'empty',claimed:null}); }
var review=8.6, AMEN=[['📶','Free WiFi'],['🏊','Pool'],['🍳','Breakfast'],['🅿️','Parking'],['🏋️','Gym'],['🧖','Spa']];
function reviewWord(){ return review>=9?'Exceptional':review>=8?'Wonderful':review>=7?'Very good':review>=6?'Good':'Okay'; }
var ENTRY={x:W/2,y:H-150};
var workers=[], guests=[], spawnCd=1.5, pops=[], cardFx=[];
var coins=0, served=0, cards=0, hireCost=30, msg='', msgT=0;
var CHECKIN_LINES=['👋 Welcome to Mo Hotel!','📝 Got your name!','📖 Found your booking!','🔑 Here is your room key!','🚪 Showed them their room!','🛗 Pointed them to the elevator!'];
var DARK=80, timeLeft=DARK, result=null, confetti=[];
var level=1, best=1, combo=0, lastCheckin=-9, stars=0, serviceCount=0, vipCount=0, petCount=0, cleanCount=0;
var stealers=[], guardCount=0, stealCd=2;
var joyMode=false; try{ joyMode=localStorage.getItem('moHotelJoy')==='1'; }catch(e){}
var JOY={active:false,id:null,bx:0,by:0,dx:0,dy:0,R:44};
var DESKX=W/2, DESKY=H-118;
var sites=[], siteDone=0, funs=[], funCount=0, funCd=0.6;
// Each level has its OWN objective. Coach Mo sends these — add one entry per level.
var LEVELOBJ=[
 {t:'checkin', n:8,  label:'Check in the guests'},
 {t:'guard',   n:8,  label:'Guard rooms from stealers'},
 {t:'build',   n:9,  label:'Rebuild the hotel rooms'},
 {t:'place',   n:9,  label:'Place all the items'},
 {t:'pool',    n:10, label:'Build the swimming pool'},
 {t:'outside', n:10, label:'Build the proooo outside'},
 {t:'arff',    n:8,  label:"Make Arff's house"},
 {t:'fun',     n:12, label:'Have fun at Arff\'s house'}
];
function isBuildObj(o){ o=o||curObj(); return o.t==='build'||o.t==='place'||o.t==='pool'||o.t==='outside'||o.t==='arff'; }
var SITEPOS={
 outside:{pos:[[60,150],[150,140],[250,145],[342,152],[70,250],[200,238],[332,250],[110,338],[230,344],[322,340]], d:['🌳','🌸','🌳','🌷','🌲','🌺','🌳','🪴','🌻','🌳']},
 arff:{pos:[[150,308],[200,308],[250,308],[150,258],[250,258],[200,240],[118,330],[282,330]], d:['🧱','🪵','🧱','🪟','🪟','🔺','🦴','🛏️']}
};
function setupSites(ot){ sites=[]; siteDone=0;
  function P(x,y,u,dd){ sites.push({x:x,y:y,done:false,claimed:null,u:u,d:dd}); }
  if(ot==='build'){ ROOMS.forEach(function(r){ P(r.x,r.y,'🧱','🏠'); }); }
  else if(ot==='place'){ var it=['🛋️','🛏️','🪑','📺','🪴','🚪','🖼️','🪞','💡']; ROOMS.forEach(function(r,i){ P(r.x,r.y,'📦',it[i%it.length]); }); }
  else if(ot==='pool'){ var PX=[64,128,192,256,320], PY=[218,300]; for(var py=0;py<PY.length;py++)for(var px=0;px<PX.length;px++)P(PX[px],PY[py],'',''); }
  else if(ot==='outside'||ot==='arff'){ var S=SITEPOS[ot]; for(var i=0;i<S.pos.length;i++)P(S.pos[i][0],S.pos[i][1],ot==='arff'?'🔨':'🕳️',S.d[i]); }
}
function nearestSite(){ var b=null,bd=1e9; for(var i=0;i<sites.length;i++){ var st=sites[i]; if(st.done||st.claimed)continue; var dd=Math.hypot(boss.x-st.x,boss.y-st.y); if(dd<bd){bd=dd;b=st;} } return b; }
function assignSite(){ var st=nearestSite(); if(!st){ nope(); showMsg('All done — nothing left! ✨'); return; } var w=freeWorker(); if(!w){ nope(); showMsg('All workers busy! Tap HIRE 👷'); return; } st.claimed=w; w.task={type:'site',site:st}; w.state='toTask'; w.tx=st.x; w.ty=st.y+ (curObj().t==='pool'?0:12); bell(); showMsg('Sent a worker to work on it!'); }
function siteDoneFx(st){ st.done=true; st.claimed=null; siteDone++; coins+=2; combo++; if(combo>=2){ coins+=combo; comboSnd(); pop(st.x,st.y-24,'COMBO x'+combo); } var v=curObj().t; cleanS(); pop(st.x,st.y-8, v==='pool'?'💧':(v==='place'?'🛋️':(v==='outside'?'🌳':(v==='arff'?'🐾':'🔨')))); pop(st.x,st.y-8,'+2'); }
function collectFun(i){ var f=funs[i]; if(!f)return; funs.splice(i,1); funCount++; combo++; coins+=1; cash(); pop(f.x,f.y-6,'🎉'); if(combo>=2){ comboSnd(); pop(f.x,f.y-24,'COMBO x'+combo); } }
function assignFun(){ var f=null,bd=1e9; for(var i=0;i<funs.length;i++){ if(funs[i].claimed)continue; var dd=Math.hypot(boss.x-funs[i].x,boss.y-funs[i].y); if(dd<bd){bd=dd;f=funs[i];} } if(!f){ nope(); showMsg('Wait for fun to pop up! 🎈'); return; } var w=freeWorker(); if(!w){ nope(); showMsg('All busy! Tap HIRE 👷'); return; } f.claimed=w; w.task={type:'funcatch',f:f}; w.state='toTask'; bell(); }
function curObj(){ return LEVELOBJ[(level-1)%LEVELOBJ.length]; }
function objVal(o){ o=o||curObj(); switch(o.t){ case 'fill': return occupiedCount(); case 'coins': return coins; case 'checkin': return served; case 'serve': return serviceCount; case 'vip': return vipCount; case 'pet': return petCount; case 'clean': return cleanCount; case 'cards': return cards; case 'guard': return guardCount; case 'build': case 'place': case 'pool': case 'outside': case 'arff': return siteDone; case 'fun': return funCount; default: return 0; } }
function objMet(){ var o=curObj(); return objVal(o)>=o.n; }
function nearestStealer(){ var best=null,bd=1e9; for(var i=0;i<stealers.length;i++){ if(stealers[i].claimed)continue; var dd=d(boss,stealers[i]); if(dd<bd){bd=dd;best=stealers[i];} } return best; }
function assignCatch(s){ var w=freeWorker(); if(!w){ nope(); showMsg('All guards busy! Tap HIRE 👷'); return; } s.claimed=w; w.task={type:'catch',s:s}; w.state='toTask'; bell(); }
try{ best=parseInt(localStorage.getItem('moHotelBest'))||1; }catch(e){}
function darkForLevel(l){ return Math.max(44, 82-(l-1)*6); }
function occupiedCount(){ return ROOMS.filter(function(r){return r.state==='occupied';}).length; }
function winSnd(){ [0,120,240,400,560].forEach(function(t,i){ setTimeout(function(){bp([660,830,990,1320,1580][i],0.16,'triangle',0.15);},t); }); }
function comboSnd(){ bp(1100,0.05,'square',0.11); setTimeout(function(){bp(1500,0.07,'square',0.11);},50); }
var GCOL=['#e0563b','#3a7ac0','#2f9e5a','#c94a8a','#e0a040','#8a5ad0'];
function showMsg(t){ msg=t; msgT=1.8; }
function pop(x,y,e){ pops.push({x:x,y:y,t:0.9,e:e}); }
function addWorker(){ var h=STAFFHOME[workers.length%STAFFHOME.length]; workers.push({x:h.x,y:h.y,hx:h.x,hy:h.y,state:'idle',task:null,workT:0,step:Math.random()*6,card:null}); }
function start(mode){ if(mode==='new')level=1; else if(mode==='next')level++; scene='play'; coins=0; served=0; cards=0; hireCost=30; guests=[]; workers=[]; var nw=Math.min(6,1+level); for(var wi=0;wi<nw;wi++)addWorker(); ROOMS.forEach(function(r){r.state='empty';r.claimed=null;r.robbed=0;}); DARK=darkForLevel(level); spawnCd=0.5; timeLeft=DARK; result=null; confetti=[]; combo=0; lastCheckin=-9; serviceCount=0; vipCount=0; petCount=0; cleanCount=0; stealers=[]; guardCount=0; stealCd=1.4; funs=[]; funCount=0; funCd=0.6; setupSites(curObj().t); boss.x=DESKX; boss.y=DESKY; JOY.active=false; JOY.id=null; JOY.dx=0; JOY.dy=0; review=8.6; bell(); showMsg('Level '+level+': '+curObj().label+' before dark!'); }
function spawnConf(){ for(var i=0;i<60;i++)confetti.push({x:W/2,y:H/2,vx:(Math.random()-0.5)*260,vy:-140-Math.random()*200,c:['#ffd23f','#ff7ac0','#5ad1ff','#9dff6a'][(Math.random()*4)|0],r:Math.random()*6}); }
function openRoom(){ for(var i=0;i<ROOMS.length;i++)if(ROOMS[i].state==='empty' && !ROOMS[i].claimed)return ROOMS[i]; return null; }
function freeWorker(){ for(var i=0;i<workers.length;i++)if(workers[i].state==='idle')return workers[i]; return null; }

function cmd(type){ if(scene!=='play')return; var ot=curObj().t;
  if(type==='checkin'){
    if(ot==='guard'){ var s=nearestStealer(); if(!s){ nope(); showMsg('No stealers to catch right now'); return; } assignCatch(s); return; }
    if(isBuildObj()){ assignSite(); return; }
    if(ot==='fun'){ assignFun(); return; }
  }
  var w=freeWorker(); if(!w){ nope(); showMsg('All workers busy! Hire more 👷'); return; }
  if(type==='checkin'){ var g=null; for(var i=0;i<guests.length;i++)if(guests[i].state==='wait'&&!guests[i].claimed){g=guests[i];break;} if(!g){ nope(); showMsg('No guests waiting to check in'); return; } var rm=openRoom(); if(!rm){ nope(); showMsg('No clean rooms — send a worker to CLEAN'); return; } g.claimed=w; rm.claimed=w; w.task={type:'checkin',g:g,rm:rm}; w.state='toTask'; w.tx=g.x; w.ty=g.y-4; bell(); showMsg('👋 Welcoming a guest — checking them in!'); }
  else if(type==='clean'){ var rm=null; for(var i=0;i<ROOMS.length;i++)if(ROOMS[i].state==='dirty'&&!ROOMS[i].claimed){rm=ROOMS[i];break;} if(!rm){ nope(); showMsg('No dirty rooms right now ✨'); return; } rm.claimed=w; w.task={type:'clean',rm:rm}; w.state='toTask'; w.tx=rm.x; w.ty=rm.y+20; showMsg('Sent a worker to clean the room!'); }
  else if(type==='serve'){ var g=null; for(var i=0;i<guests.length;i++)if(guests[i].state==='inroom'&&guests[i].want&&!guests[i].claimed){g=guests[i];break;} if(!g){ nope(); showMsg('No guests need service yet'); return; } g.claimed=w; w.task={type:'serve',g:g}; w.state='toTask'; w.tx=g.x; w.ty=g.y-4; showMsg('Sent a worker with room service!'); }
}
function hire(){ if(scene!=='play')return; if(coins<hireCost){ nope(); showMsg('Need 🪙'+hireCost+' to hire a worker'); return; } coins-=hireCost; addWorker(); cash(); showMsg('Hired a new worker! 👷 Now '+workers.length); hireCost+=20; }

function upd(dt){ if(msgT>0)msgT-=dt; boss.step+=dt*3;
  for(var i=pops.length-1;i>=0;i--){ pops[i].t-=dt; pops[i].y-=26*dt; if(pops[i].t<=0)pops.splice(i,1); }
  for(var i=cardFx.length-1;i>=0;i--){ var cf=cardFx[i]; cf.t+=dt/0.6; cf.x=cf.x0+(boss.x-cf.x0)*cf.t; cf.y=cf.y0+(boss.y-18-cf.y0)*cf.t; if(cf.t>=1){ cards++; cardS(); pop(boss.x,boss.y-30,'🎟'); cardFx.splice(i,1); } }
  for(var ci=confetti.length-1;ci>=0;ci--){ var c=confetti[ci]; c.vy+=520*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.r+=dt*6; if(c.y>H+20)confetti.splice(ci,1); }
  if(scene!=='play')return;
  // ===== OBJECT OF THE GAME: fill all 9 rooms before dark =====
  timeLeft-=dt;
  if(objMet()){ result='win'; stars=(timeLeft/DARK>0.5?3:(timeLeft/DARK>0.25?2:1)); best=Math.max(best,level); try{localStorage.setItem('moHotelBest',best);}catch(e){} scene='over'; winSnd(); spawnConf(); return; }
  if(timeLeft<=0){ timeLeft=0; result='lose'; scene='over'; nope(); return; }
  var ot=curObj().t; var GUARD=ot==='guard', FUN=ot==='fun', BUILDING=isBuildObj();
  ROOMS.forEach(function(r){ if(r.robbed>0)r.robbed-=dt; });
  // JOYSTICK: move the boss (YOU) around the floor
  if(joyMode && JOY.active){ var sp=170*dt; boss.x=clamp(boss.x+JOY.dx/JOY.R*sp,26,W-26); boss.y=clamp(boss.y+JOY.dy/JOY.R*sp,112,BY-16); }
  if(GUARD){
    stealCd-=dt; if(stealCd<=0 && stealers.length<5){ stealers.push({x:40+Math.random()*(W-80),y:118,step:Math.random()*6,room:ROOMS[(Math.random()*ROOMS.length)|0],caught:false,claimed:null}); stealCd=1.3+Math.random()*1.3; }
    for(var si=stealers.length-1;si>=0;si--){ var s=stealers[si]; s.step+=dt*8; if(s.claimed)continue; if(joyMode && Math.hypot(boss.x-s.x,boss.y-s.y)<26){ guardCount++; combo++; comboSnd(); pop(s.x,s.y-22,'🚨 CAUGHT!'); if(combo>=2)pop(s.x,s.y-40,'COMBO x'+combo); stealers.splice(si,1); continue; } if(moveTo(s,s.room.x,s.room.y+18,54*dt)<12){ s.room.robbed=0.7; pop(s.room.x,s.room.y,'💢'); nope(); stealers.splice(si,1); } }
  }
  if(BUILDING && joyMode){ for(var qi=0;qi<sites.length;qi++){ var st=sites[qi]; if(st.done)continue; if(Math.hypot(boss.x-st.x,boss.y-st.y)<24){ siteDoneFx(st); } } }
  if(FUN){ funCd-=dt; if(funCd<=0 && funs.length<7){ funs.push({x:30+Math.random()*(W-60),y:GB-6,vy:-(20+Math.random()*22),sway:Math.random()*6,e:['🎈','🎉','🦴','🎾','🐾','⭐','🍖'][(Math.random()*7)|0],claimed:null}); funCd=0.7+Math.random()*0.9; }
    for(var fi=funs.length-1;fi>=0;fi--){ var f=funs[fi]; f.sway+=dt*3; f.y+=f.vy*dt; f.x+=Math.sin(f.sway)*14*dt; if(joyMode && Math.hypot(boss.x-f.x,boss.y-f.y)<26){ collectFun(fi); continue; } if(f.y<120){ funs.splice(fi,1); } } }
  spawnCd-=dt; if(!GUARD && !FUN && !BUILDING) if(spawnCd<=0 && guests.filter(function(g){return g.state==='wait';}).length<3){ var pet=Math.random()<0.3?(Math.random()<0.6?'dog':'cat'):null; var vip=!pet && Math.random()<0.16; guests.push({x:ENTRY.x,y:ENTRY.y,state:'wait',col:GCOL[(Math.random()*GCOL.length)|0],step:Math.random()*6,want:false,happy:0,claimed:null,pet:pet,vip:vip,served:false}); spawnCd=3+Math.random()*3; bell(); }
  var wq=guests.filter(function(g){return g.state==='wait';}); wq.forEach(function(g,i){ var tx=ENTRY.x-58+i*52; g.x+=(tx-g.x)*Math.min(1,5*dt); });
  // guests
  for(var i=guests.length-1;i>=0;i--){ var g=guests[i]; g.step+=dt*3; if(g.happy>0)g.happy-=dt;
    if(g.state==='toRoom'){ if(moveTo(g,g.tx,g.ty,130*dt)<10){ g.state='inroom'; g.room.state='occupied'; g.room.claimed=null; g.wantT=3+Math.random()*4; } }
    else if(g.state==='inroom'){ /* guests stay the night — they don't leave */ if(!g.want && !g.claimed){ g.wantT-=dt; if(g.wantT<=0 && Math.random()<0.5){ g.want=true; g.wantT=8; } } }
  }

  workers.forEach(function(w){ w.step+=dt*7;
