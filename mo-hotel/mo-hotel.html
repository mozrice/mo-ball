<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Hotel</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#20304f;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;opacity:.95;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;text-shadow:0 1px 3px #0007;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:18px;font-weight:bold;color:#fff;pointer-events:none;text-shadow:0 1px 4px #000;z-index:4;}
  #sub{position:fixed;top:34px;left:0;right:0;text-align:center;font-size:14px;font-weight:bold;color:#ffe08a;pointer-events:none;text-shadow:0 1px 3px #000;z-index:4;}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;text-align:center;padding:20px;}
  #start{background:linear-gradient(#3a5a8a,#1a2740);}
  #start h1{font-size:26px;margin:0 0 6px;text-shadow:0 2px 4px #0006;} #start p{font-size:15px;margin:4px;max-width:330px;}
  #start .big{font-size:56px;}
  #over{background:#000a;display:none;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;text-shadow:0 2px 0 #b47a1a;} #over p{font-size:17px;margin:3px;}
  #start button,#over button{margin-top:16px;background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
  #start button:active,#over button:active{transform:translateY(3px);box-shadow:0 2px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="hud">🏨 <span id="n">Day 1</span></div>
<div id="sub"></div>
<canvas id="c"></canvas>
<div id="start"><div class="big">🚗🏨</div><h1>MO Hotel</h1><p>Drive to the hotel, then stay for days! Ride the elevator up through real rooms — the cafe, pool, gym, arcade and more — with the whole family. Make it to the ROOFTOP!</p><button id="go">▶ START THE TRIP</button></div>
<div id="over"><h1 id="ot">🎉 ROOFTOP!</h1><p id="om"></p><button id="rs">▶ Stay Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var FLOORS=[
    {n:'Lobby',      e:'🛎️', bg:['#f3e6c4','#c9ab73'], floor:'#b58f4a', act:'Check in at the lobby'},
    {n:'Cafe',       e:'☕',  bg:['#eccfa8','#c99a63'], floor:'#a9743e', act:'Grab a treat at the cafe'},
    {n:'Pool',       e:'🏊',  bg:['#bfeaff','#5fb8e0'], floor:'#3f96c0', act:'Splash in the pool'},
    {n:'Gym',        e:'🏀',  bg:['#f6d9a8','#d8a860'], floor:'#b5823a', act:'Shoot hoops in the gym'},
    {n:'Arcade',     e:'🎮',  bg:['#d0b8f2','#8f6ad0'], floor:'#6a45a0', act:'Play in the arcade'},
    {n:'Restaurant', e:'🍽️', bg:['#f5c8b6','#d0806a'], floor:'#a85a44', act:'Dinner at the restaurant'},
    {n:'Spa',        e:'💆',  bg:['#d4ecd4','#9fcf9f'], floor:'#6faf6f', act:'Relax at the spa'},
    {n:'Rooms',      e:'🛏️', bg:['#f5ccd8','#d090a8'], floor:'#aa6a82', act:'Sleep in your room'},
    {n:'Rooftop',    e:'🌆',  bg:['#ffcf8a','#e0709a'], floor:'#b5607a', act:'ROOFTOP PARTY!'}
  ];
  var floor, phase, riding, rideT, tt, sparks, celebrated, driveX;
  function geoFloorY(){ return H*0.70; }
  function loadFloor(i){ floor=i; var F=FLOORS[i]; document.getElementById('n').textContent='Day '+(i+1)+' · '+F.n;
    document.getElementById('sub').textContent=(i<FLOORS.length-1)?('🛎️ '+F.act+'  —  👆 tap to take the elevator UP!'):('🌆 '+F.act); }
  function reset(){ riding=false; rideT=0; tt=0; sparks=[]; celebrated=false; phase='drive'; driveX=-0.25;
    document.getElementById('n').textContent='🚗 On the way'; document.getElementById('sub').textContent='🚗 Driving to the hotel... 👆 tap to arrive!';
    document.getElementById('over').style.display='none'; document.getElementById('start').style.display='none'; }
  function pt(ev){ var t0=ev.changedTouches?ev.changedTouches[0]:ev; var r=cv.getBoundingClientRect(); return {x:t0.clientX-r.left,y:t0.clientY-r.top}; }
  function tap(ev){ if(riding)return;
    if(phase==='drive'){ driveX+=0.35; return; }
    if(floor>=FLOORS.length-1){ if(!celebrated){celebrated=true; win();} return; }
    riding=true; rideT=0; beep(300,0.14,'square'); setTimeout(function(){beep(240,0.16,'square');},160); }
  cv.addEventListener('touchstart',function(e){ tap(e); e.preventDefault(); },{passive:false});
  cv.addEventListener('mousedown',function(e){ tap(e); });
  function win(){ document.getElementById('ot').innerHTML='🎉 ROOFTOP PARTY! 🎉'; document.getElementById('om').textContent='What a stay — you explored the whole hotel with the family! 🏨🐶'; document.getElementById('sub').textContent='🎉 Best vacation ever!'; document.getElementById('over').style.display='flex'; if(window.MO_MVP)window.MO_MVP(); }
  function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function box(x,y,w,h,c,r){ ctx.fillStyle=c; if(r){ rr(x,y,w,h,r); ctx.fill(); } else { ctx.fillRect(x,y,w,h); } }
  function drawPlant(x,by){ box(x-9,by-16,18,16,'#b5651d',3); ctx.fillStyle='#3f9d4f'; ctx.beginPath(); ctx.ellipse(x,by-30,15,20,0,0,6.29); ctx.fill(); ctx.fillStyle='#4fb85f'; ctx.beginPath(); ctx.ellipse(x-8,by-26,9,14,-0.4,0,6.29); ctx.fill(); ctx.beginPath(); ctx.ellipse(x+8,by-26,9,14,0.4,0,6.29); ctx.fill(); }
  function drawFamily(cx,by,u){ ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    function person(px,ph,shirt,hair,name){ var hipY=by-ph*0.42, shY=by-ph*0.72, hr=ph*0.17, hcy=by-ph*0.90;
      ctx.lineCap='round'; ctx.strokeStyle='#3a3550'; ctx.lineWidth=ph*0.10;
      ctx.beginPath(); ctx.moveTo(px-ph*0.11,hipY); ctx.lineTo(px-ph*0.11,by); ctx.moveTo(px+ph*0.11,hipY); ctx.lineTo(px+ph*0.11,by); ctx.stroke();
      ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.ellipse(px-ph*0.11,by,ph*0.10,ph*0.05,0,0,6.29); ctx.fill(); ctx.beginPath(); ctx.ellipse(px+ph*0.11,by,ph*0.10,ph*0.05,0,0,6.29); ctx.fill();
      ctx.fillStyle=shirt; rr(px-ph*0.21,shY,ph*0.42,hipY-shY+ph*0.05,ph*0.10); ctx.fill();
      ctx.strokeStyle=shirt; ctx.lineWidth=ph*0.11; ctx.beginPath(); ctx.moveTo(px-ph*0.20,shY+ph*0.05); ctx.lineTo(px-ph*0.31,shY+ph*0.30); ctx.moveTo(px+ph*0.20,shY+ph*0.05); ctx.lineTo(px+ph*0.31,shY+ph*0.30); ctx.stroke();
      ctx.fillStyle='#f3c9a0'; ctx.beginPath(); ctx.arc(px-ph*0.31,shY+ph*0.32,ph*0.055,0,6.29); ctx.fill(); ctx.beginPath(); ctx.arc(px+ph*0.31,shY+ph*0.32,ph*0.055,0,6.29); ctx.fill();
      ctx.fillStyle='#f3c9a0'; ctx.beginPath(); ctx.arc(px,hcy,hr,0,6.29); ctx.fill();
      ctx.fillStyle=hair; ctx.beginPath(); ctx.arc(px,hcy-hr*0.14,hr*1.02,Math.PI*1.02,Math.PI*1.98); ctx.fill();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(px-hr*0.36,hcy+hr*0.05,hr*0.13,0,6.29); ctx.fill(); ctx.beginPath(); ctx.arc(px+hr*0.36,hcy+hr*0.05,hr*0.13,0,6.29); ctx.fill();
      ctx.strokeStyle='#b5453a'; ctx.lineWidth=Math.max(1,ph*0.025); ctx.beginPath(); ctx.arc(px,hcy+hr*0.18,hr*0.42,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
      if(name){ ctx.fillStyle='#2a2a1a'; ctx.font='bold '+Math.max(9,ph*0.15)+'px Trebuchet MS'; ctx.fillText(name,px,by+ph*0.16); } }
    function dog(px,dh,name){ ctx.lineCap='round'; ctx.strokeStyle='#f0efe9'; ctx.lineWidth=dh*0.13;
      for(var i=0;i<4;i++){ var lx=px-dh*0.30+i*dh*0.20; ctx.beginPath(); ctx.moveTo(lx,by-dh*0.28); ctx.lineTo(lx,by); ctx.stroke(); }
      ctx.fillStyle='#fff'; ctx.strokeStyle='#e6e6e0'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(px,by-dh*0.42,dh*0.42,dh*0.27,0,0,6.29); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(px+dh*0.44,by-dh*0.55,dh*0.23,0,6.29); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#efeee8'; ctx.beginPath(); ctx.ellipse(px+dh*0.36,by-dh*0.66,dh*0.09,dh*0.16,0.4,0,6.29); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=dh*0.11; ctx.beginPath(); ctx.moveTo(px-dh*0.40,by-dh*0.48); ctx.lineTo(px-dh*0.56,by-dh*0.64); ctx.stroke();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(px+dh*0.46,by-dh*0.58,dh*0.045,0,6.29); ctx.fill();
      ctx.fillStyle='#3a2a2a'; ctx.beginPath(); ctx.arc(px+dh*0.63,by-dh*0.53,dh*0.05,0,6.29); ctx.fill();
      ctx.strokeStyle='#e0453a'; ctx.lineWidth=dh*0.07; ctx.beginPath(); ctx.moveTo(px+dh*0.30,by-dh*0.42); ctx.lineTo(px+dh*0.46,by-dh*0.38); ctx.stroke();
      if(name){ ctx.fillStyle='#2a2a1a'; ctx.font='bold '+Math.max(9,dh*0.15)+'px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText(name,px+dh*0.1,by+dh*0.16); } }
    var gap=u*0.58;
    person(cx-gap*1.5,u,'#3a6ea5','#2a2a2a','Daddy');
    person(cx-gap*0.5,u*0.94,'#d06a95','#5a2f14','Mommy');
    person(cx+gap*0.42,u*0.66,'#e0a030','#3a2412','Me');
    dog(cx+gap*1.35,u*0.72,'Arff');
    ctx.restore(); }
  function drawRoom(fi,fy){ var F=FLOORS[fi]; ctx.textAlign='center'; ctx.textBaseline='middle';
    box(W*0.60,H*0.14,W*0.30,H*0.20,'#bfe4f4',8); ctx.strokeStyle='#fff'; ctx.lineWidth=4; rr(W*0.60,H*0.14,W*0.30,H*0.20,8); ctx.stroke();
    ctx.save(); rr(W*0.60,H*0.14,W*0.30,H*0.20,8); ctx.clip(); box(W*0.60,H*0.27,W*0.30,H*0.07,'#7fb8e0'); for(var b=0;b<5;b++){ box(W*0.615+b*W*0.052,H*0.20+(b%3)*7,W*0.035,H*0.15,'#6aa0c8'); } ctx.restore();
    box(W*0.585,H*0.12,W*0.045,H*0.235,'rgba(255,255,255,0.55)',4); box(W*0.865,H*0.12,W*0.045,H*0.235,'rgba(255,255,255,0.55)',4);
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,H*0.12); ctx.lineTo(W*0.57,H*0.12); ctx.stroke();
    box(W*0.24,H*0.15,W*0.11,H*0.09,'#8a6a3a',4); box(W*0.255,H*0.16,W*0.08,H*0.07,'#cfe6d0',3);
    box(0,fy-5,W,5,'rgba(255,255,255,0.35)');
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.font='bold 14px Trebuchet MS'; ctx.fillText('— '+F.n+' —',W*0.30,H*0.30);
    ctx.save(); ctx.globalAlpha=0.30; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(W*0.44,fy+H*0.035,W*0.32,H*0.045,0,0,6.29); ctx.fill(); ctx.restore();
    drawPlant(W*0.94,fy);
    var n=F.n;
    if(n==='Rooms'){ var bx=W*0.56,bw=W*0.36,bt=fy-H*0.11;
      box(bx,bt-H*0.055,bw,H*0.055,'#6a4a6a',4); box(bx,bt,bw,H*0.11,'#eef2f8',6); box(bx,bt+H*0.05,bw,H*0.06,'#8fb4e0',6);
      box(bx+8,bt-8,bw*0.30,H*0.032,'#fff',4); box(bx+bw*0.36,bt-8,bw*0.30,H*0.032,'#fff',4);
      box(W*0.485,fy-H*0.075,W*0.07,H*0.075,'#7a5a3a',3); box(W*0.505,fy-H*0.125,W*0.03,H*0.05,'#ffd23f',2); box(W*0.495,fy-H*0.14,W*0.05,H*0.02,'#fff2b0',3);
    } else if(n==='Cafe'||n==='Restaurant'){ box(W*0.03,fy-H*0.11,W*0.15,H*0.11,'#8a5a3a',4); box(W*0.05,fy-H*0.135,W*0.05,H*0.03,'#cfd6dd',2);
      var tx=W*0.66; box(tx-3,fy-H*0.03,W*0.014,H*0.05,'#6a4a2a'); box(tx-W*0.10,fy-H*0.055,W*0.20,H*0.02,n==='Restaurant'?'#fff':'#a06a3a',8);
      box(tx-W*0.13,fy-H*0.02,W*0.03,H*0.045,'#6a4a2a',2); box(tx+W*0.10,fy-H*0.02,W*0.03,H*0.045,'#6a4a2a',2);
    } else if(n==='Pool'){ box(W*0.28,fy+H*0.015,W*0.62,H*0.15,'#3aa8d8',10); ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; for(var w=0;w<3;w++){ ctx.beginPath(); ctx.moveTo(W*0.30,fy+H*0.05+w*11+Math.sin(tt*2+w)*3); ctx.bezierCurveTo(W*0.5,fy+H*0.04+w*11,W*0.7,fy+H*0.07+w*11,W*0.88,fy+H*0.05+w*11); ctx.stroke(); }
      box(W*0.03,fy-H*0.02,W*0.16,H*0.03,'#e8c060',4);
    } else if(n==='Gym'){ box(W*0.38,H*0.17,W*0.11,H*0.055,'#fff',3); ctx.strokeStyle='#e0453a'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(W*0.435,H*0.245,W*0.045,0.05*Math.PI,0.95*Math.PI); ctx.stroke();
      box(W*0.52,fy-H*0.028,W*0.18,H*0.028,'#c0392b',4); box(W*0.57,fy,W*0.02,H*0.03,'#555'); box(W*0.63,fy,W*0.02,H*0.03,'#555');
    } else if(n==='Arcade'){ box(W*0.30,H*0.30,W*0.12,H*0.32,'#2a2a4a',5); box(W*0.315,H*0.33,W*0.09,H*0.08,'#5fd0ff',3); box(W*0.44,H*0.30,W*0.12,H*0.32,'#3a1a4a',5); box(W*0.455,H*0.33,W*0.09,H*0.08,'#ff8ad0',3);
    } else if(n==='Spa'){ box(W*0.50,fy-H*0.05,W*0.34,H*0.05,'#e8d0e0',6); box(W*0.50,fy-H*0.018,W*0.34,H*0.03,'#c8a0c0'); ctx.fillStyle='#ffdf9a'; ctx.beginPath(); ctx.arc(W*0.46,fy-H*0.02,4,0,6.29); ctx.fill(); ctx.beginPath(); ctx.arc(W*0.88,fy-H*0.02,4,0,6.29); ctx.fill();
    } else if(n==='Lobby'){ box(W*0.50,fy-H*0.10,W*0.38,H*0.10,'#9a6a3a',4); box(W*0.50,fy-H*0.115,W*0.38,H*0.02,'#c89a5a',3); box(W*0.03,fy-H*0.06,W*0.15,H*0.06,'#c05a7a',6);
    } else if(n==='Rooftop'){ ctx.strokeStyle='#e6ecf2'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(W*0.26,fy); ctx.lineTo(W*0.96,fy); ctx.stroke(); for(var r2=0;r2<8;r2++){ var rx=W*0.26+r2*W*0.10; ctx.beginPath(); ctx.moveTo(rx,fy); ctx.lineTo(rx,fy-H*0.05); ctx.stroke(); } for(var l=0;l<6;l++){ ctx.fillStyle=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff'][l%4]; ctx.beginPath(); ctx.arc(W*0.28+l*W*0.12,H*0.15+Math.sin(l+tt)*5,4,0,6.29); ctx.fill(); } }
    ctx.font=Math.min(W*0.10,42)+'px sans-serif'; ctx.globalAlpha=0.9; ctx.fillText(F.e,W*0.30,H*0.22); ctx.globalAlpha=1;
  }
  function drawMiniCar(cx,cy,s){ ctx.save(); ctx.translate(cx,cy);
    ctx.save(); ctx.globalAlpha=0.2; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(0,s*0.42,s*0.6,s*0.13,0,0,6.29); ctx.fill(); ctx.restore();
    box(-s*0.55,-s*0.06,s*1.10,s*0.40,'#ff5a5a',s*0.12); box(-s*0.30,-s*0.34,s*0.58,s*0.30,'#e84a4a',s*0.10);
    box(-s*0.26,-s*0.30,s*0.24,s*0.22,'#bfeaff',s*0.05); box(s*0.03,-s*0.30,s*0.22,s*0.22,'#bfeaff',s*0.05);
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font=(s*0.18)+'px sans-serif'; ctx.fillText('👦',-s*0.14,-s*0.19); ctx.fillText('🐶',s*0.13,-s*0.19);
    box(-s*0.55,s*0.12,s*1.10,s*0.05,'#ffd23f');
    ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.arc(-s*0.30,s*0.34,s*0.15,0,6.29); ctx.arc(s*0.32,s*0.34,s*0.15,0,6.29); ctx.fill();
    ctx.fillStyle='#cfd6dd'; ctx.beginPath(); ctx.arc(-s*0.30,s*0.34,s*0.07,0,6.29); ctx.arc(s*0.32,s*0.34,s*0.07,0,6.29); ctx.fill();
    ctx.restore(); }
  function draw(){ tt+=0.05;
    if(phase==='drive'){
      var sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#a8e4ff'); sky.addColorStop(1,'#e8f4ff'); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff2a0'; ctx.beginPath(); ctx.arc(W*0.16,H*0.16,20,0,6.29); ctx.fill();
      ctx.fillStyle='#8fd07a'; ctx.fillRect(0,H*0.58,W,H*0.42);
      // hotel building on the right
      box(W*0.66,H*0.20,W*0.30,H*0.40,'#e8d6b0',8); for(var wy=0;wy<4;wy++)for(var wx=0;wx<4;wx++){ box(W*0.69+wx*W*0.066,H*0.24+wy*H*0.085,W*0.045,H*0.055,'#9fc8e0',3); }
      box(W*0.78,H*0.50,W*0.06,H*0.10,'#8a5a3a',3); ctx.fillStyle='#5a3a1a'; ctx.font='bold 15px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('🏨 HOTEL',W*0.81,H*0.17);
      // road
      ctx.fillStyle='#5a5f6a'; ctx.fillRect(0,H*0.72,W,H*0.16);
      ctx.strokeStyle='#ffd23f'; ctx.lineWidth=5; ctx.setLineDash([26,20]); ctx.lineDashOffset=-(tt*60)%46; ctx.beginPath(); ctx.moveTo(0,H*0.80); ctx.lineTo(W,H*0.80); ctx.stroke(); ctx.setLineDash([]);
      driveX+=0.006; var carx=(-0.25+ (driveX+0.25)) *W; if(carx>W*0.60){ carx=W*0.60; }
      drawMiniCar(carx, H*0.78, Math.min(W*0.16,74));
      // exhaust
      for(var e2=0;e2<2;e2++){ ctx.globalAlpha=0.5; ctx.fillStyle='#e8e8e8'; ctx.beginPath(); ctx.arc(carx-Math.min(W*0.16,74)*0.6-e2*12,H*0.80,6-e2*2,0,6.29); ctx.fill(); ctx.globalAlpha=1; }
      if(driveX>=0.85){ phase='floor'; loadFloor(0); }
      requestAnimationFrame(draw); return;
    }
    var F=FLOORS[floor], fy=geoFloorY();
    var g=ctx.createLinearGradient(0,0,0,fy); g.addColorStop(0,F.bg[0]); g.addColorStop(1,F.bg[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,fy);
    ctx.fillStyle=F.floor; ctx.fillRect(0,fy,W,H-fy);
    ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=2; for(var gx=0;gx<W;gx+=48){ ctx.beginPath(); ctx.moveTo(gx,fy); ctx.lineTo(gx-16,H); ctx.stroke(); }
    drawRoom(floor, fy);
    // elevator on the left (solid, no flashing)
    var dx=W*0.03, dw=W*0.15, dy=H*0.30, dh=fy-H*0.30;
    box(dx-6,dy-8,dw+12,dh+8,'#8a939f',8); box(dx,dy,dw,dh, riding?'#2a3550':'#c7ced6',5);
    ctx.strokeStyle='#6a737f'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(dx+dw/2,dy); ctx.lineTo(dx+dw/2,dy+dh); ctx.stroke();
    box(dx,dy-30,dw,22,'#1a2233',5); ctx.fillStyle='#ffd23f'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 14px Trebuchet MS'; ctx.fillText((floor+1)+'',dx+dw/2,dy-19);
    // family with legs standing in the room
    drawFamily(W*0.44, fy+H*0.14, Math.min(H*0.16,90));
    // big clear UP button (bottom center) — solid, gentle bob, no strobe
    if(!riding && floor<FLOORS.length-1){ var bob=Math.sin(tt*2)*3; var bw2=W*0.5,bx2=(W-bw2)/2,by2=H*0.90+bob;
      box(bx2,by2,bw2,H*0.075,'#f0b429',16); box(bx2,by2,bw2,H*0.05,'#ffe07a',16);
      ctx.fillStyle='#5a3a00'; ctx.font='bold 20px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('⬆ TAP TO GO UP', W/2, by2+H*0.037); }
    if(!riding && floor>=FLOORS.length-1 && !celebrated){ var by3=H*0.90+Math.sin(tt*2)*3; box((W-W*0.5)/2,by3,W*0.5,H*0.075,'#e0709a',16); ctx.fillStyle='#fff'; ctx.font='bold 20px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🎉 TAP TO PARTY', W/2, by3+H*0.037); }
    for(var sp=sparks.length-1;sp>=0;sp--){ var q=sparks[sp]; q.x+=q.vx; q.y+=q.vy; q.vy+=0.12; q.life--; if(q.life<=0){sparks.splice(sp,1);continue;} ctx.globalAlpha=q.life/24; ctx.fillStyle=q.c; ctx.fillRect(q.x,q.y,3,3); ctx.globalAlpha=1; }
    if(riding){ rideT+=0.03; var e=Math.min(1,rideT);
      ctx.fillStyle='rgba(20,26,40,'+(0.55*(1-Math.abs(0.5-e)*2)+0.30)+')'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ffd23f'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 26px Trebuchet MS'; ctx.fillText('🛗 Going up...', W/2, H*0.44);
      ctx.font='bold 22px Trebuchet MS'; ctx.fillStyle='#fff'; ctx.fillText('Day '+Math.min(FLOORS.length,floor+2)+' · '+FLOORS[Math.min(FLOORS.length-1,floor+1)].n, W/2, H*0.53);
      if(rideT>=1){ riding=false; loadFloor(Math.min(FLOORS.length-1,floor+1)); if(floor>=FLOORS.length-1){ for(var i=0;i<30;i++)sparks.push({x:W*Math.random(),y:0,vx:(Math.random()-0.5)*3,vy:1+Math.random()*3,life:40,c:['#ff5a5a','#ffd23f','#7bff9e','#43c6ff'][i%4]}); } } }
    requestAnimationFrame(draw); }
  var ac; function beep(f,d,ty){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gn=ac.createGain(); o.frequency.value=f; o.type=ty||'square'; o.connect(gn); gn.connect(ac.destination); gn.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('go').onclick=function(){ reset(); };
  document.getElementById('rs').onclick=function(){ reset(); };
  floor=0; phase='drive'; riding=false; rideT=0; tt=0; sparks=[]; celebrated=false; driveX=-0.25;
  requestAnimationFrame(draw);
})();
</script>
