<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Hotel</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#3a2a5a;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
function d(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function moveTo(o,tx,ty,sp){ var dx=tx-o.x, dy=ty-o.y, m=Math.hypot(dx,dy); if(m<0.5)return 0; o.x+=dx/m*Math.min(sp,m); o.y+=dy/m*Math.min(sp,m); return m; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,dd,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(dd||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(dd||0.12)+0.02); }
function bell(){ bp(1050,0.12,'sine',0.14); setTimeout(function(){bp(1400,0.14,'sine',0.12);},70); }
function cash(){ bp(880,0.08,'triangle',0.15); setTimeout(function(){bp(1250,0.1,'triangle',0.14);},60); }
function cardS(){ bp(600,0.06,'triangle',0.13); setTimeout(function(){bp(900,0.08,'triangle',0.12);},55); }
function cleanS(){ bp(700,0.05,'triangle',0.12); setTimeout(function(){bp(520,0.06,'triangle',0.1);},50); }
function nope(){ bp(200,0.09,'square',0.09); }

function inR(p,r){ return p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
var PLAYBTN={x:W/2-90,y:H/2+40,w:180,h:60};
var BW=(W-40)/4, BY=H-78, BH=62;
var BTN={ checkin:{x:12,y:BY,w:BW-6,h:BH}, clean:{x:12+BW,y:BY,w:BW-6,h:BH}, serve:{x:12+BW*2,y:BY,w:BW-6,h:BH}, hire:{x:12+BW*3,y:BY,w:BW-6,h:BH} };
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(scene==='title'){ if(inR(p,PLAYBTN)) start('new'); return; }
  if(scene==='over'){ if(inR(p,PLAYBTN)) start(result==='win'?'next':'retry'); return; }
  if(inR(p,BTN.checkin)) cmd('checkin');
  else if(inR(p,BTN.clean)) cmd('clean');
  else if(inR(p,BTN.serve)) cmd('serve');
  else if(inR(p,BTN.hire)) hire();
});

var scene='title';
var GY=110, GB=H-150;
var boss={x:W/2,y:H-118,step:0};
var STAFFHOME=[{x:44,y:H-210},{x:44,y:H-160},{x:356,y:H-210},{x:356,y:H-160},{x:44,y:H-110}];
var ROOMTYPES=[
 {n:'Standard',rate:5,col:'#cdbfe4'},
 {n:'Deluxe King',rate:8,col:'#bcd0ec'},
 {n:'Family Suite',rate:9,col:'#c6e4bf'},
 {n:'Ocean Suite',rate:12,col:'#a9dbec'},
 {n:'Presidential',rate:20,col:'#ecdca6'}
];
var RTA=[0,0,1,0,1,3,2,1,4];
var ROOMS=[]; var RX=[80,200,320], RY=[150,250,350];
for(var r=0;r<3;r++)for(var c=0;c<3;c++){ var idx=r*3+c; ROOMS.push({x:RX[c],y:RY[r],num:101+idx,type:ROOMTYPES[RTA[idx]],state:'empty',claimed:null}); }
var review=8.6, AMEN=[['📶','Free WiFi'],['🏊','Pool'],['🍳','Breakfast'],['🅿️','Parking'],['🏋️','Gym'],['🧖','Spa']];
function reviewWord(){ return review>=9?'Exceptional':review>=8?'Wonderful':review>=7?'Very good':review>=6?'Good':'Okay'; }
var ENTRY={x:W/2,y:H-150};
var workers=[], guests=[], spawnCd=1.5, pops=[], cardFx=[];
var coins=0, served=0, cards=0, hireCost=30, msg='', msgT=0;
var DARK=80, timeLeft=DARK, result=null, confetti=[];
var level=1, best=1, combo=0, lastCheckin=-9, stars=0, serviceCount=0, vipCount=0, petCount=0, cleanCount=0;
// Each level has its OWN objective. Coach Mo sends these — add one entry per level.
var LEVELOBJ=[
 {t:'fill', n:9, label:'Fill all 9 rooms'}
];
function curObj(){ return LEVELOBJ[(level-1)%LEVELOBJ.length]; }
function objVal(o){ o=o||curObj(); switch(o.t){ case 'fill': return occupiedCount(); case 'coins': return coins; case 'checkin': return served; case 'serve': return serviceCount; case 'vip': return vipCount; case 'pet': return petCount; case 'clean': return cleanCount; case 'cards': return cards; default: return 0; } }
function objMet(){ var o=curObj(); return objVal(o)>=o.n; }
try{ best=parseInt(localStorage.getItem('moHotelBest'))||1; }catch(e){}
function darkForLevel(l){ return Math.max(44, 82-(l-1)*6); }
function occupiedCount(){ return ROOMS.filter(function(r){return r.state==='occupied';}).length; }
function winSnd(){ [0,120,240,400,560].forEach(function(t,i){ setTimeout(function(){bp([660,830,990,1320,1580][i],0.16,'triangle',0.15);},t); }); }
function comboSnd(){ bp(1100,0.05,'square',0.11); setTimeout(function(){bp(1500,0.07,'square',0.11);},50); }
var GCOL=['#e0563b','#3a7ac0','#2f9e5a','#c94a8a','#e0a040','#8a5ad0'];
function showMsg(t){ msg=t; msgT=1.8; }
function pop(x,y,e){ pops.push({x:x,y:y,t:0.9,e:e}); }
function addWorker(){ var h=STAFFHOME[workers.length%STAFFHOME.length]; workers.push({x:h.x,y:h.y,hx:h.x,hy:h.y,state:'idle',task:null,workT:0,step:Math.random()*6,card:null}); }
function start(mode){ if(mode==='new')level=1; else if(mode==='next')level++; scene='play'; coins=0; served=0; cards=0; hireCost=30; guests=[]; workers=[]; addWorker(); addWorker(); ROOMS.forEach(function(r){r.state='empty';r.claimed=null;}); DARK=darkForLevel(level); spawnCd=0.5; timeLeft=DARK; result=null; confetti=[]; combo=0; lastCheckin=-9; serviceCount=0; vipCount=0; petCount=0; cleanCount=0; review=8.6; bell(); showMsg('Level '+level+': '+curObj().label+' before dark!'); }
function spawnConf(){ for(var i=0;i<60;i++)confetti.push({x:W/2,y:H/2,vx:(Math.random()-0.5)*260,vy:-140-Math.random()*200,c:['#ffd23f','#ff7ac0','#5ad1ff','#9dff6a'][(Math.random()*4)|0],r:Math.random()*6}); }
function openRoom(){ for(var i=0;i<ROOMS.length;i++)if(ROOMS[i].state==='empty' && !ROOMS[i].claimed)return ROOMS[i]; return null; }
function freeWorker(){ for(var i=0;i<workers.length;i++)if(workers[i].state==='idle')return workers[i]; return null; }

function cmd(type){ if(scene!=='play')return; var w=freeWorker(); if(!w){ nope(); showMsg('All workers busy! Hire more 👷'); return; }
  if(type==='checkin'){ var g=null; for(var i=0;i<guests.length;i++)if(guests[i].state==='wait'&&!guests[i].claimed){g=guests[i];break;} if(!g){ nope(); showMsg('No guests waiting to check in'); return; } var rm=openRoom(); if(!rm){ nope(); showMsg('No clean rooms — send a worker to CLEAN'); return; } g.claimed=w; rm.claimed=w; w.task={type:'checkin',g:g,rm:rm}; w.state='toTask'; w.tx=g.x; w.ty=g.y-4; bell(); showMsg('Sent a worker to check them in!'); }
  else if(type==='clean'){ var rm=null; for(var i=0;i<ROOMS.length;i++)if(ROOMS[i].state==='dirty'&&!ROOMS[i].claimed){rm=ROOMS[i];break;} if(!rm){ nope(); showMsg('No dirty rooms right now ✨'); return; } rm.claimed=w; w.task={type:'clean',rm:rm}; w.state='toTask'; w.tx=rm.x; w.ty=rm.y+20; showMsg('Sent a worker to clean the room!'); }
  else if(type==='serve'){ var g=null; for(var i=0;i<guests.length;i++)if(guests[i].state==='inroom'&&guests[i].want&&!guests[i].claimed){g=guests[i];break;} if(!g){ nope(); showMsg('No guests need service yet'); return; } g.claimed=w; w.task={type:'serve',g:g}; w.state='toTask'; w.tx=g.x; w.ty=g.y-4; showMsg('Sent a worker with room service!'); }
}
function hire(){ if(scene!=='play')return; if(coins<hireCost){ nope(); showMsg('Need 🪙'+hireCost+' to hire a worker'); return; } coins-=hireCost; addWorker(); cash(); showMsg('Hired a new worker! 👷 Now '+workers.length); hireCost+=20; }

function upd(dt){ if(msgT>0)msgT-=dt; boss.step+=dt*3;
  for(var i=pops.length-1;i>=0;i--){ pops[i].t-=dt; pops[i].y-=26*dt; if(pops[i].t<=0)pops.splice(i,1); }
  for(var i=cardFx.length-1;i>=0;i--){ var cf=cardFx[i]; cf.t+=dt/0.6; cf.x=cf.x0+(boss.x-cf.x0)*cf.t; cf.y=cf.y0+(boss.y-18-cf.y0)*cf.t; if(cf.t>=1){ cards++; cardS(); pop(boss.x,boss.y-30,'🎟'); cardFx.splice(i,1); } }
  for(var ci=confetti.length-1;ci>=0;ci--){ var c=confetti[ci]; c.vy+=520*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.r+=dt*6; if(c.y>H+20)confetti.splice(ci,1); }
  if(scene!=='play')return;
  // ===== OBJECT OF THE GAME: fill all 9 rooms before dark =====
  timeLeft-=dt;
  if(objMet()){ result='win'; stars=(timeLeft/DARK>0.5?3:(timeLeft/DARK>0.25?2:1)); best=Math.max(best,level); try{localStorage.setItem('moHotelBest',best);}catch(e){} scene='over'; winSnd(); spawnConf(); return; }
  if(timeLeft<=0){ timeLeft=0; result='lose'; scene='over'; nope(); return; }
  spawnCd-=dt; if(spawnCd<=0 && guests.filter(function(g){return g.state==='wait';}).length<3){ var pet=Math.random()<0.3?(Math.random()<0.6?'dog':'cat'):null; var vip=!pet && Math.random()<0.16; guests.push({x:ENTRY.x,y:ENTRY.y,state:'wait',col:GCOL[(Math.random()*GCOL.length)|0],step:Math.random()*6,want:false,happy:0,claimed:null,pet:pet,vip:vip,served:false}); spawnCd=3+Math.random()*3; bell(); }
  var wq=guests.filter(function(g){return g.state==='wait';}); wq.forEach(function(g,i){ var tx=ENTRY.x-58+i*52; g.x+=(tx-g.x)*Math.min(1,5*dt); });
  // guests
  for(var i=guests.length-1;i>=0;i--){ var g=guests[i]; g.step+=dt*3; if(g.happy>0)g.happy-=dt;
    if(g.state==='toRoom'){ if(moveTo(g,g.tx,g.ty,130*dt)<10){ g.state='inroom'; g.room.state='occupied'; g.room.claimed=null; g.wantT=3+Math.random()*4; } }
    else if(g.state==='inroom'){ /* guests stay the night — they don't leave */ if(!g.want && !g.claimed){ g.wantT-=dt; if(g.wantT<=0 && Math.random()<0.5){ g.want=true; g.wantT=8; } } }
  }
  // workers
  workers.forEach(function(w){ w.step+=dt*7;
    if(w.state==='toTask'){ if(moveTo(w,w.tx,w.ty,150*dt)<8){ w.state='work'; w.workT=1.3; } }
    else if(w.state==='work'){ w.workT-=dt; if(w.workT<=0){ var t=w.task;
        if(t.type==='checkin'){ t.g.state='toRoom'; t.g.claimed=null; t.g.room=t.rm; t.g.tx=t.rm.x; t.g.ty=t.rm.y+18; var rate=t.rm.type.rate*(t.g.vip?2:1); coins+=rate; served++; if(t.g.vip)vipCount++; if(t.g.pet)petCount++; review=clamp(review+0.03,0,10); pop(t.g.x,t.g.y-28,'+'+rate); var now=performance.now()/1000; if(now-lastCheckin<3.6){combo++;}else{combo=1;} lastCheckin=now; if(combo>=2){ coins+=combo; comboSnd(); pop(t.g.x,t.g.y-42,'COMBO x'+combo+'!'); } w.card=t.rm.num; w.state='deliver'; w.tx=boss.x-6; w.ty=boss.y-14; }
        else if(t.type==='clean'){ t.rm.state='empty'; t.rm.claimed=null; coins+=3; cleanCount++; cleanS(); pop(t.rm.x,t.rm.y,'✨'); pop(t.rm.x,t.rm.y,'+3'); w.state='return'; w.task=null; }
        else if(t.type==='serve'){ t.g.want=false; t.g.served=true; t.g.claimed=null; t.g.happy=1.4; coins+=4; serviceCount++; review=clamp(review+0.1,0,10); cash(); pop(t.g.x,t.g.y-28,'💗'); pop(t.g.x,t.g.y-28,'+4'); w.state='return'; w.task=null; }
      } }
    else if(w.state==='deliver'){ if(moveTo(w,w.tx,w.ty,150*dt)<10){ cardFx.push({x0:w.x,y0:w.y-14,x:w.x,y:w.y-14,t:0,num:w.card}); showMsg('Worker gave you the room '+w.card+' key card! 🎟'); w.card=null; w.state='return'; w.task=null; } }
    else if(w.state==='return'){ if(moveTo(w,w.hx,w.hy,150*dt)<6){ w.state='idle'; } }
  });
}

function drawPerson(x,y,col,b,cap){ cx.save(); cx.translate(x,y); cx.fillStyle='#3a3f5a'; cx.fillRect(-8,14+b,7,12); cx.fillRect(2,14-b,7,12); cx.fillStyle=col; rr(-12,-6,24,22,6); cx.fill(); if(cap){ cx.fillStyle='#e0c030'; cx.fillRect(-12,-6,24,4);} cx.fillStyle='#a9743e'; cx.beginPath(); cx.arc(0,-17,10,0,7); cx.fill(); if(cap){ cx.fillStyle=col; cx.fillRect(-9,-26,18,6); cx.fillStyle='#e0c030'; cx.fillRect(-9,-21,18,2);} else { cx.fillStyle='#3a2a1a'; cx.beginPath(); cx.arc(0,-23,10,Math.PI,0); cx.fill(); } cx.fillStyle='#fff'; cx.beginPath(); cx.arc(-3,-16,1.8,0,7); cx.arc(4,-16,1.8,0,7); cx.fill(); cx.restore(); }
function drawRoom(rm){ var x=rm.x,y=rm.y;
  // 4 WALLS (outer) + ceiling tone
  cx.fillStyle='#a89578'; rr(x-30,y-24,60,44,4); cx.fill();
  cx.strokeStyle='#7a6a50'; cx.lineWidth=1; cx.strokeRect(x-30,y-24,60,44);
  // FLOOR (inside the 4 walls)
  var floor= rm.state==='dirty'?'#8a6a4a':(rm.state==='occupied'?'#c3b6d2':'#efe4cf');
  cx.fillStyle=floor; cx.fillRect(x-26,y-20,52,36);
  // WINDOW on the back (top) wall
  cx.fillStyle='#bfe3ff'; cx.fillRect(x-9,y-25,18,5); cx.strokeStyle='#fff'; cx.lineWidth=1; cx.strokeRect(x-9,y-25,18,5); cx.beginPath(); cx.moveTo(x,y-25); cx.lineTo(x,y-20); cx.stroke();
  // BED against back wall (headboard, mattress, duvet in room-type color, pillows)
  cx.fillStyle='#6a4a30'; rr(x-15,y-17,30,5,2); cx.fill();
  cx.fillStyle='#fff'; rr(x-15,y-12,30,16,2); cx.fill();
  cx.fillStyle=rm.type.col; rr(x-15,y-2,30,6,2); cx.fill();
  cx.fillStyle='#f4f4f4'; rr(x-13,y-14,10,5,2); cx.fill(); rr(x+3,y-14,10,5,2); cx.fill();
  // NIGHTSTAND + lamp
  cx.fillStyle='#8a5a34'; cx.fillRect(x+16,y-12,6,6); cx.fillStyle='#ffe08a'; cx.beginPath(); cx.arc(x+19,y-13,2,0,7); cx.fill();
  // RUG
  cx.fillStyle='rgba(200,120,90,.32)'; cx.beginPath(); cx.ellipse(x,y+9,12,5,0,0,7); cx.fill();
  // CEILING light (center)
  cx.fillStyle='rgba(255,240,170,.9)'; cx.beginPath(); cx.arc(x,y+3,2.2,0,7); cx.fill();
  // DOOR on the front (bottom) wall
  cx.fillStyle='#5a3a24'; cx.fillRect(x-6,y+16,12,4); cx.fillStyle='#ffd23f'; cx.beginPath(); cx.arc(x-3,y+18,0.8,0,7); cx.fill();
  // dirty mess
  if(rm.state==='dirty'){ cx.fillStyle='rgba(90,60,30,.55)'; for(var m=0;m<4;m++){ cx.beginPath(); cx.arc(x-14+m*9,y+7+(m%2)*4,2,0,7); cx.fill(); } }
  // number + rate plate, type label, status
  cx.fillStyle='#20242c'; rr(x-22,y-38,44,13,3); cx.fill(); cx.fillStyle='#ffd23f'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('RM '+rm.num+' · $'+rm.type.rate,x,y-31); cx.textBaseline='alphabetic';
  cx.fillStyle='rgba(40,20,60,.75)'; cx.font='bold 8px Trebuchet MS'; cx.fillText(rm.type.n,x,y+27);
  var ic= rm.state==='empty'?'✨':(rm.state==='dirty'?'🧹':'💤'); emoji(ic,x+23,y-20,13);
  if(rm.state==='dirty'){ cx.strokeStyle='rgba(255,180,60,.8)'; cx.lineWidth=2; cx.beginPath(); cx.arc(x,y-2,34+Math.sin(boss.step*2)*2,0,7); cx.stroke(); }
}
function draw(){
  if(scene==='title'){ drawTitle(); return; }
  if(scene==='over'){ drawOver(); return; }
  cx.fillStyle='#e8dcc8'; cx.fillRect(0,0,W,H); cx.fillStyle='#dcccb0'; for(var y=GY;y<GB+20;y+=30)for(var x=(y/30%2)*30;x<W;x+=60)cx.fillRect(x,y,30,15);
  // hotel facade: brick + mansard roof (Hotels.com-style header on top)
  cx.fillStyle='#5a3a4a'; cx.fillRect(0,0,W,104);
  cx.strokeStyle='rgba(0,0,0,.12)'; cx.lineWidth=1; for(var by=20;by<104;by+=9){ cx.beginPath(); cx.moveTo(0,by); cx.lineTo(W,by); cx.stroke(); } for(var bx=0;bx<W;bx+=26){ cx.beginPath(); cx.moveTo(bx,18); cx.lineTo(bx,104); cx.stroke(); }
  cx.fillStyle='#2e1e34'; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(W,0); cx.lineTo(W-14,16); cx.lineTo(14,16); cx.closePath(); cx.fill();
  cx.fillStyle='#ffe08a'; for(var dw=26;dw<W-24;dw+=52){ cx.fillRect(dw,4,9,8); }
  cx.fillStyle='#c9a24a'; cx.fillRect(0,100,W,4);
  cx.fillStyle='#ffd23f'; cx.font='bold 18px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🏨 MO HOTEL',10,25); cx.font='12px serif'; cx.fillText('⭐⭐⭐⭐⭐',118,24);
  cx.fillStyle='#2f6ad0'; rr(W-116,8,108,22,5); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 14px Trebuchet MS'; cx.fillText(review.toFixed(1),W-110,24); cx.font='bold 9px Trebuchet MS'; cx.fillText(reviewWord(),W-82,23); cx.font='7px Trebuchet MS'; cx.fillText('guest rating',W-82,31);
  cx.fillStyle='rgba(255,255,255,.7)'; cx.font='9px Trebuchet MS'; cx.fillText('Amenities:',10,50); for(var ai=0;ai<AMEN.length;ai++){ emoji(AMEN[ai][0],72+ai*30,47,15); }
  cx.fillStyle='#fff'; cx.font='bold 12px Trebuchet MS'; cx.textAlign='left'; cx.fillText('Lv '+level+'  🎟 '+cards+'  👷 '+workers.length+(combo>=2?'  🔥x'+combo:''),10,74); cx.textAlign='right'; cx.fillStyle='#ffd23f'; cx.fillText('🪙 '+coins,W-10,74);
  // OBJECTIVE OF THIS LEVEL (changes each level)
  var _o=curObj(); cx.textAlign='center'; cx.fillStyle='#fff'; cx.font='bold 11px Trebuchet MS'; cx.fillText('🎯 '+_o.label+' before dark:  '+objVal(_o)+'/'+_o.n,W/2,90);
  var tf=clamp(timeLeft/DARK,0,1); cx.fillStyle='rgba(255,255,255,.25)'; rr(90,94,W-180,6,3); cx.fill(); cx.fillStyle=tf<0.3?'#3a3a7a':(tf<0.6?'#e0a040':'#ffd23f'); rr(90,94,(W-180)*tf,6,3); cx.fill();
  ROOMS.forEach(drawRoom);
  // front desk + boss (you)
  cx.fillStyle='#8a5a34'; rr(boss.x-60,boss.y-8,120,26,6); cx.fill(); cx.fillStyle='#a9743e'; rr(boss.x-60,boss.y-8,120,7,4); cx.fill();
