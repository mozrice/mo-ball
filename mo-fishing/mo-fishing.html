<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Fishing Frenzy</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#2a6ab0;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:20px;font-weight:bold;color:#ffd23f;pointer-events:none;}
  a.back{position:fixed;top:8px;left:10px;color:#cfeaff;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #tip{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#cfeaff;font-size:15px;pointer-events:none;}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0008;}
  #over h1{font-size:32px;color:#ffd23f;margin:0 0 6px;} button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🎣 <span id="sc">0</span> &nbsp; ⏱️<span id="t">40</span>s &nbsp; 🏆<span id="hi">0</span></div>
<canvas id="c"></canvas>
<div id="tip">👆 Tap to drop your hook — catch fish!</div>
<div id="over"><h1>🎣 TIME!</h1><p>Caught <span id="fin">0</span> • Best <span id="best">0</span></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var HK='moFishHi'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var boatX,hook,fish,score,time,running,last,spawnT,waterY;
  var FISH=[{e:'🐟',p:1},{e:'🐠',p:2},{e:'🐡',p:2},{e:'🦀',p:3},{e:'🦑',p:3},{e:'🐙',p:4},{e:'🥾',p:0}];
  document.getElementById('hi').textContent=getHi();
  function reset(){ boatX=W/2; hook=null; fish=[]; score=0; time=40; running=true; last=0; spawnT=0; waterY=H*0.28; document.getElementById('sc').textContent=0; document.getElementById('t').textContent=40; document.getElementById('over').style.display='none'; for(var i=0;i<6;i++)spawn(); }
  function spawn(){ var f=FISH[Math.floor(Math.random()*FISH.length)]; var fromL=Math.random()<0.5; fish.push({x:fromL?-20:W+20,y:waterY+20+Math.random()*(H-waterY-40),vx:(fromL?1:-1)*(0.8+Math.random()*1.6),e:f.e,p:f.p}); }
  function drop(e){ if(!running||hook)return; hook={x:boatX,y:waterY,state:'down',caught:null}; }
  cv.addEventListener('touchstart',function(e){drop(e);e.preventDefault();},{passive:false});
  cv.addEventListener('mousedown',function(e){drop(e);});
  function loop(ts){ if(!running)return; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts;
    time-=dt/60; if(time<=0){ time=0; over(); } document.getElementById('t').textContent=Math.ceil(time);
    spawnT-=dt; if(spawnT<=0&&fish.length<10){ spawn(); spawnT=40; }
    for(var i=fish.length-1;i>=0;i--){ var f=fish[i]; if(f.caught)continue; f.x+=f.vx*dt; if(f.x<-40||f.x>W+40)fish.splice(i,1); }
    if(hook){ if(hook.state==='down'){ hook.y+=6*dt; if(!hook.caught){ for(var j=0;j<fish.length;j++){ var f2=fish[j]; if(!f2.caught&&Math.hypot(f2.x-hook.x,f2.y-hook.y)<24){ hook.caught=f2; f2.caught=true; hook.state='up'; break; } } } if(hook.y>H-10)hook.state='up'; }
      else { hook.y-=7*dt; if(hook.caught){ hook.caught.x=hook.x; hook.caught.y=hook.y; } if(hook.y<=waterY){ if(hook.caught){ if(hook.caught.p>0){ score+=hook.caught.p; document.getElementById('sc').textContent=score; beep(700,0.08); } else beep(200,0.08); var idx=fish.indexOf(hook.caught); if(idx>=0)fish.splice(idx,1); } hook=null; } } }
    draw(); requestAnimationFrame(loop); }
  function draw(){ ctx.fillStyle='#8fd0ff'; ctx.fillRect(0,0,W,waterY); ctx.fillStyle='#2a6ab0'; ctx.fillRect(0,waterY,W,H-waterY);
    ctx.strokeStyle='#3a7ac0'; for(var w=0;w<H;w+=24){ if(w<waterY)continue; ctx.beginPath(); for(var x=0;x<=W;x+=20)ctx.lineTo(x,w+Math.sin((x+w)*0.05)*3); ctx.stroke(); }
    for(var i=0;i<fish.length;i++){ var f=fish[i]; ctx.font='28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.save(); ctx.translate(f.x,f.y); if(f.vx<0)ctx.scale(-1,1); ctx.fillText(f.e,0,0); ctx.restore(); }
    if(hook){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(boatX,waterY-6); ctx.lineTo(hook.x,hook.y); ctx.stroke(); ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🪝',hook.x,hook.y); }
    ctx.font='40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🚤',boatX,waterY-20); }
  function over(){ running=false; if(score>getHi()){ setHi(score); } document.getElementById('hi').textContent=getHi(); document.getElementById('fin').textContent=score; document.getElementById('best').textContent=getHi(); document.getElementById('over').style.display='flex'; }
  var drag=false;
  cv.addEventListener('mousemove',function(e){ var r=cv.getBoundingClientRect(); boatX=Math.max(30,Math.min(W-30,e.clientX-r.left)); });
  cv.addEventListener('touchmove',function(e){ var t0=e.changedTouches[0]; var r=cv.getBoundingClientRect(); boatX=Math.max(30,Math.min(W-30,t0.clientX-r.left)); e.preventDefault(); },{passive:false});
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); requestAnimationFrame(loop); };
  reset(); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
