<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Tap the Beat</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0c0a1a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:20px;font-weight:bold;color:#ff6ad5;pointer-events:none;}
  a.back{position:fixed;top:8px;left:10px;color:#e0b0ff;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0009;}
  #over h1{font-size:32px;color:#ffd23f;margin:0 0 6px;} button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🎵 <span id="sc">0</span> &nbsp; 🔥<span id="combo">0</span> &nbsp; 🏆<span id="hi">0</span></div>
<canvas id="c"></canvas>
<div id="over"><h1>🎵 SONG OVER</h1><p>Score <span id="fin">0</span> • Best <span id="best">0</span></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); }
  window.addEventListener('resize',fit);
  var HK='moBeatHi'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var LANES=4, cols=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff'], notes=[],score,combo,miss,running,last,spawnT,hitY,lx;
  function layout(){ hitY=H-90; lx=[]; for(var i=0;i<LANES;i++)lx.push(W*(i+0.5)/LANES); }
  document.getElementById('hi').textContent=getHi();
  function reset(){ layout(); notes=[]; score=0; combo=0; miss=0; running=true; last=0; spawnT=0; document.getElementById('sc').textContent=0; document.getElementById('combo').textContent=0; document.getElementById('over').style.display='none'; }
  function spawn(){ notes.push({lane:Math.floor(Math.random()*LANES),y:-30,hit:false}); }
  function hitLane(l){ if(!running)return; var best=null,bd=999; for(var i=0;i<notes.length;i++){ var n=notes[i]; if(n.lane!==l||n.hit)continue; var d=Math.abs(n.y-hitY); if(d<bd){ bd=d; best=n; } } if(best&&bd<50){ best.hit=true; score+=(bd<22?2:1); combo++; document.getElementById('sc').textContent=score; document.getElementById('combo').textContent=combo; beep(500+l*120+combo*3,0.07); for(var p=0;p<4;p++)parts.push({x:lx[l],y:hitY,vx:(Math.random()-0.5)*4,vy:-Math.random()*4-1,c:cols[l],life:20}); } else { combo=0; document.getElementById('combo').textContent=0; beep(150,0.06); } }
  function tap(e){ var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); var x=t0.clientX-r.left; hitLane(Math.max(0,Math.min(LANES-1,Math.floor(x/(W/LANES))))); }
  cv.addEventListener('touchstart',function(e){ for(var i=0;i<e.changedTouches.length;i++){ var r=cv.getBoundingClientRect(); var x=e.changedTouches[i].clientX-r.left; hitLane(Math.max(0,Math.min(LANES-1,Math.floor(x/(W/LANES))))); } e.preventDefault(); },{passive:false});
  cv.addEventListener('mousedown',function(e){tap(e);});
  window.addEventListener('keydown',function(e){ var m={a:0,s:1,d:2,f:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3}; if(m[e.key]!==undefined){ hitLane(m[e.key]); e.preventDefault(); } });
  var parts=[];
  function loop(ts){ if(!running)return; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts;
    spawnT-=dt; if(spawnT<=0){ spawn(); spawnT=32+Math.random()*20; }
    for(var i=notes.length-1;i>=0;i--){ var n=notes[i]; n.y+=4*dt; if(!n.hit&&n.y>hitY+50){ miss++; combo=0; document.getElementById('combo').textContent=0; notes.splice(i,1); if(miss>=12){ over(); return; } } else if(n.hit&&n.y>H+20){ notes.splice(i,1); } else if(n.y>H+40)notes.splice(i,1); }
    for(var p=parts.length-1;p>=0;p--){ var q=parts[p]; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=0.2*dt; q.life-=dt; if(q.life<=0)parts.splice(p,1); }
    draw(); requestAnimationFrame(loop); }
  function draw(){ ctx.fillStyle='#0c0a1a'; ctx.fillRect(0,0,W,H);
    for(var i=0;i<LANES;i++){ ctx.fillStyle=(i%2?'#151228':'#111020'); ctx.fillRect(i*W/LANES,0,W/LANES,H); ctx.strokeStyle=cols[i]+'55'; ctx.lineWidth=2; ctx.strokeRect(i*W/LANES,0,W/LANES,H);
      ctx.strokeStyle=cols[i]; ctx.lineWidth=3; ctx.strokeRect(i*W/LANES+6,hitY-22,W/LANES-12,44); }
    for(var n=0;n<notes.length;n++){ var no=notes[n]; if(no.hit)continue; ctx.fillStyle=cols[no.lane]; var x=lx[no.lane]; ctx.beginPath(); ctx.arc(x,no.y,18,0,6.29); ctx.fill(); ctx.fillStyle='#fff8'; ctx.beginPath(); ctx.arc(x-5,no.y-5,5,0,6.29); ctx.fill(); }
    for(var p=0;p<parts.length;p++){ ctx.globalAlpha=parts[p].life/20; ctx.fillStyle=parts[p].c; ctx.fillRect(parts[p].x-3,parts[p].y-3,6,6); } ctx.globalAlpha=1;
    ctx.font='14px Trebuchet MS'; ctx.fillStyle='#e0b0ff'; ctx.textAlign='center'; ctx.fillText('👆 Tap the lane when the note hits the box!',W/2,26); }
  function over(){ running=false; if(score>getHi()){ setHi(score); } document.getElementById('hi').textContent=getHi(); document.getElementById('fin').textContent=score; document.getElementById('best').textContent=getHi(); document.getElementById('over').style.display='flex'; }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); requestAnimationFrame(loop); };
  fit(); reset(); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
