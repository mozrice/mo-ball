<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Doughnut Drive-Thru</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#3a3a44;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:19px;font-weight:bold;color:#ffd23f;pointer-events:none;}
  a.back{position:fixed;top:8px;left:10px;color:#cfe0ff;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #tip{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#cfe0ff;font-size:14px;pointer-events:none;}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0008;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;} button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🎟️ <span id="tk">0</span> &nbsp; 🍩<span id="sc">0</span> &nbsp; ❤️<span id="lives">3</span></div>
<canvas id="c"></canvas>
<div id="tip">👆 Drag to steer • grab 🍩☕ for tickets • dodge 🚗</div>
<div id="over"><h1>💥 CRASH!</h1><p>Orders <span id="fin">0</span> • 🎟️ Total <span id="tkt">0</span></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); }
  window.addEventListener('resize',fit);
  var TK='moTickets'; function getTk(){ try{return +localStorage.getItem(TK)||0;}catch(e){return 0;} } function addTk(n){ try{localStorage.setItem(TK,getTk()+n);}catch(e){} }
  var roadL,roadR,laneW,lanes,car,things,side,score,lives,running,last,spawnT,scroll,speed,shopT;
  function layout(){ var rw=Math.min(W*0.62,300); roadL=(W-rw)/2; roadR=roadL+rw; laneW=rw/3; lanes=[roadL+laneW*0.5,roadL+laneW*1.5,roadL+laneW*2.5]; if(car)car.y=H-90; }
  function reset(){ layout(); car={x:lanes[1],y:H-90,w:38,h:60}; things=[]; side=[]; score=0; lives=3; running=true; last=0; spawnT=0; scroll=0; speed=4; shopT=120; document.getElementById('sc').textContent=0; document.getElementById('lives').textContent=3; document.getElementById('tk').textContent=getTk(); document.getElementById('over').style.display='none'; for(var i=0;i<8;i++)side.push({x:Math.random()<0.5?roadL-30:roadR+30,y:i*120,e:['🌳','🏠','🚶','🚦','🪧','🌲'][Math.floor(Math.random()*6)]}); }
  var drag=false;
  function move(e){ var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); car.x=Math.max(roadL+18,Math.min(roadR-18,t0.clientX-r.left)); }
  cv.addEventListener('touchstart',function(e){drag=true;move(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',function(e){if(drag)move(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',function(){drag=false;});
  cv.addEventListener('mousedown',function(e){drag=true;move(e);});
  window.addEventListener('mousemove',function(e){if(drag)move(e);});
  window.addEventListener('mouseup',function(){drag=false;});
  function spawn(){ var lane=lanes[Math.floor(Math.random()*3)]; var r=Math.random(); var type=r<0.4?'car':(r<0.7?'donut':(r<0.9?'coffee':'cone')); things.push({x:lane,y:-40,type:type,taken:false}); }
  function loop(ts){ if(!running)return; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts;
    speed=4+score*0.12; scroll+=speed*dt;
    spawnT-=dt; if(spawnT<=0){ spawn(); spawnT=Math.max(24,50-score); }
    shopT-=dt; if(shopT<=0){ shopT=200+Math.random()*120; side.push({x:Math.random()<0.5?roadL-34:roadR+34,y:-60,e:'🍩',shop:true}); }
    for(var s=side.length-1;s>=0;s--){ side[s].y+=speed*dt; if(side[s].y>H+60){ if(side[s].shop)side.splice(s,1); else { side[s].y=-40; side[s].x=Math.random()<0.5?roadL-30:roadR+30; side[s].e=['🌳','🏠','🚶','🚦','🪧','🌲'][Math.floor(Math.random()*6)]; } } }
    for(var i=things.length-1;i>=0;i--){ var t=things[i]; t.y+=speed*dt*(t.type==='car'?0.6:1);
      if(!t.taken&&Math.abs(t.x-car.x)<30&&Math.abs(t.y-car.y)<48){ if(t.type==='car'||t.type==='cone'){ lives--; document.getElementById('lives').textContent=Math.max(0,lives); flash=8; t.taken=true; beep(160,0.12); if(lives<=0){ over(); return; } } else { score++; document.getElementById('sc').textContent=score; addTk(1); document.getElementById('tk').textContent=getTk(); t.taken=true; beep(820,0.07); } }
      if(t.y>H+40)things.splice(i,1); }
    if(flash>0)flash--; draw(); requestAnimationFrame(loop); }
  var flash=0;
  function draw(){ ctx.fillStyle='#4a7a3a'; ctx.fillRect(0,0,W,H);
    // sidewalks
    ctx.fillStyle='#c8c8c8'; ctx.fillRect(roadL-26,0,26,H); ctx.fillRect(roadR,0,26,H);
    // road
    ctx.fillStyle='#3a3a44'; ctx.fillRect(roadL,0,roadR-roadL,H);
    // lane dashes
    ctx.strokeStyle='#ffd23f'; ctx.lineWidth=3; ctx.setLineDash([26,22]); for(var l=1;l<3;l++){ ctx.lineDashOffset=-(scroll%48); ctx.beginPath(); ctx.moveTo(roadL+laneW*l,0); ctx.lineTo(roadL+laneW*l,H); ctx.stroke(); } ctx.setLineDash([]);
    // edge lines
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(roadL,0); ctx.lineTo(roadL,H); ctx.moveTo(roadR,0); ctx.lineTo(roadR,H); ctx.stroke();
    for(var s=0;s<side.length;s++){ ctx.font=(side[s].shop?'34px':'26px')+' sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(side[s].shop?'🍩':side[s].e,side[s].x,side[s].y); if(side[s].shop){ ctx.font='9px Trebuchet MS'; ctx.fillStyle='#fff'; ctx.fillText('DONUTS',side[s].x,side[s].y+22); } }
    for(var i=0;i<things.length;i++){ var t=things[i]; if(t.taken&&t.type!=='car')continue; ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t.type==='car'?'🚗':t.type==='cone'?'🚧':t.type==='donut'?'🍩':'☕',t.x,t.y); }
    ctx.font='40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🚙',car.x,car.y);
    if(flash>0){ ctx.fillStyle='rgba(224,69,58,'+(flash/16)+')'; ctx.fillRect(0,0,W,H); } }
  function over(){ running=false; document.getElementById('fin').textContent=score; document.getElementById('tkt').textContent=getTk(); document.getElementById('over').style.display='flex'; beep(150,0.25); }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); requestAnimationFrame(loop); };
  fit(); reset(); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
