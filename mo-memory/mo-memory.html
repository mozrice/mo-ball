<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Memory Match</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#1a1030;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;}
  #hud{text-align:center;padding:36px 10px 6px;font-size:20px;font-weight:bold;color:#ffd23f;}
  a.back{position:fixed;top:8px;left:10px;color:#c8b0ff;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #grid{display:grid;gap:8px;max-width:440px;margin:8px auto;padding:0 12px;}
  .card{aspect-ratio:1;border-radius:12px;background:linear-gradient(#4a3a7a,#2a1e50);display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;box-shadow:0 4px 0 #0006;user-select:none;transition:transform .08s;}
  .card.flip{background:linear-gradient(#fff,#e0e8ff);} .card.done{background:linear-gradient(#7bff9e,#3aa85a);opacity:.85;}
  .card:active{transform:scale(.96);}
  #win{text-align:center;font-size:22px;color:#7bff9e;font-weight:bold;height:26px;}
  button{display:block;margin:10px auto;background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:18px;padding:12px 24px;border-radius:14px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🧠 Moves <span id="mv">0</span> &nbsp; Pairs <span id="pr">0</span>/8</div>
<div id="grid"></div>
<div id="win"></div>
<button id="rs">🔄 New Game</button>
<script>
(function(){
  var EMO=['🏀','🐶','🚗','🍕','⭐','🎈','🦖','🍦'];
  var grid=document.getElementById('grid'),cards,first,lock,moves,pairs;
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function build(){ grid.innerHTML=''; grid.style.gridTemplateColumns='repeat(4,1fr)'; cards=shuffle(EMO.concat(EMO).slice()); first=null; lock=false; moves=0; pairs=0;
    document.getElementById('mv').textContent=0; document.getElementById('pr').textContent=0; document.getElementById('win').textContent='';
    cards.forEach(function(e,i){ var d=document.createElement('div'); d.className='card'; d.dataset.e=e; d.dataset.i=i; d.textContent=''; d.onclick=function(){ flip(d); }; grid.appendChild(d); }); }
  function flip(d){ if(lock||d.classList.contains('flip')||d.classList.contains('done'))return; d.classList.add('flip'); d.textContent=d.dataset.e;
    if(!first){ first=d; return; } moves++; document.getElementById('mv').textContent=moves;
    if(first.dataset.e===d.dataset.e){ first.classList.add('done'); d.classList.add('done'); first=null; pairs++; document.getElementById('pr').textContent=pairs; beep(760,0.1); if(pairs===8){ document.getElementById('win').textContent='🎉 YOU WIN in '+moves+' moves!'; beep(900,0.2); } }
    else { lock=true; var a=first,b=d; setTimeout(function(){ a.classList.remove('flip'); b.classList.remove('flip'); a.textContent=''; b.textContent=''; first=null; lock=false; },700); beep(300,0.08); } }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(ac.destination); g.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=build; build();
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
