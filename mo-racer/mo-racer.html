<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Racer</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#2a2a3a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(10,10,20,.6);}
  #obox{background:#fff;color:#222;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#e2342f;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#e2342f;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="over"><div id="obox"><h1>🏎️ MO Racer</h1><div id="omsg">Tap left / right to switch lanes.<br>Dodge the cars, grab the coins!</div><button id="go">START</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  var LANES=3, lane=1, laneX=function(i){ return W*(0.5+(i-1)*0.24); };
  var playing=false, score=0, best=+(localStorage.getItem('moRacerBest')||0), speed=6, roadY=0;
  var cars=[], coins=[], t=0, carY=0;
  function reset(){ lane=1; score=0; speed=6; cars=[]; coins=[]; t=0; }
  function spawn(){ if(t%40===0){ var l=Math.floor(Math.random()*3); cars.push({l:l,y:-120,col:['#3aa0e0','#7bcf7b','#e0b040','#b06ae0','#e05a2a'][Math.floor(Math.random()*5)]}); }
    if(t%55===20){ var l2=Math.floor(Math.random()*3); coins.push({l:l2,y:-40}); } }
  function ac(){ try{ var a=ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); return a;}catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function carShape(px,py,col){ x.save(); x.translate(px,py); x.fillStyle=col; rr(-24,-34,48,68,12); x.fill(); x.fillStyle='#1a2530'; rr(-18,-24,36,20,5); x.fill(); rr(-18,6,36,16,5); x.fill(); x.fillStyle='#111'; x.fillRect(-28,-24,6,18); x.fillRect(22,-24,6,18); x.fillRect(-28,10,6,18); x.fillRect(22,10,6,18); x.restore(); }
  function moCar(px,py){ x.save(); x.translate(px,py); x.fillStyle='#e2342f'; rr(-26,-36,52,72,14); x.fill(); x.fillStyle='#fff'; x.font='900 22px Trebuchet MS'; x.textAlign='center'; x.fillText('MO',0,-8); x.fillStyle='#bfe3ff'; rr(-19,4,38,20,5); x.fill(); x.fillStyle='#111'; x.fillRect(-30,-26,6,20); x.fillRect(24,-26,6,20); x.fillRect(-30,12,6,20); x.fillRect(24,12,6,20); x.restore(); }
  function rr(a,b,c,d,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+c,b,a+c,b+d,r); x.arcTo(a+c,b+d,a,b+d,r); x.arcTo(a,b+d,a,b,r); x.arcTo(a,b,a+c,b,r); x.closePath(); }
  function loop(){ t++;
    // road
    x.fillStyle='#3a4250'; x.fillRect(0,0,W,H);
    x.fillStyle='#2a3038'; x.fillRect(W*0.14,0,W*0.72,H);
    // lane lines moving
    roadY=(roadY+speed)%60; x.strokeStyle='#ffd23f'; x.lineWidth=5; x.setLineDash([30,30]); x.lineDashOffset=-roadY;
    for(var li=1;li<3;li++){ var lx=W*(0.14+li*0.24); x.beginPath(); x.moveTo(lx,0); x.lineTo(lx,H); x.stroke(); } x.setLineDash([]);
    // grass
    x.fillStyle='#3a7a3a'; x.fillRect(0,0,W*0.14,H); x.fillRect(W*0.86,0,W*0.14,H);
    if(playing){ spawn(); if(t%180===0)speed+=0.4; }
    var my=H*0.78;
    // coins
    for(var i=coins.length-1;i>=0;i--){ var co=coins[i]; co.y+=speed; var cx2=laneX(co.l); x.fillStyle='#f2c800'; x.strokeStyle='#c89a00'; x.lineWidth=3; x.beginPath(); x.arc(cx2,co.y,14,0,7); x.fill(); x.stroke(); x.fillStyle='#c89a00'; x.font='900 16px Trebuchet MS'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('$',cx2,co.y); x.textBaseline='alphabetic';
      if(co.l===lane && Math.abs(co.y-my)<40){ score+=5; beep(1000); coins.splice(i,1); continue; } if(co.y>H+40)coins.splice(i,1); }
    // cars
    for(var j=cars.length-1;j>=0;j--){ var ca=cars[j]; ca.y+=speed; carShape(laneX(ca.l),ca.y,ca.col);
      if(playing && ca.l===lane && Math.abs(ca.y-my)<62){ playing=false; over(); } if(ca.y>H+80)cars.splice(j,1); }
    // player
    moCar(laneX(lane),my);
    // score
    x.fillStyle='#fff'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='left'; x.fillText('🏁 '+score, 14, 40);
    x.textAlign='right'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('Best '+best, W-14, 36);
    if(playing)score++;
    requestAnimationFrame(loop);
  }
  function over(){ beep(200,0.3); if(score>best){ best=score; try{localStorage.setItem('moRacerBest',score);}catch(e){} }
    document.getElementById('omsg').innerHTML='You scored <b>'+score+'</b>!<br>Best: '+best; document.getElementById('go').textContent='PLAY AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  function move(dir){ if(!playing)return; lane=Math.max(0,Math.min(2,lane+dir)); beep(600); }
  cv.addEventListener('pointerdown',function(e){ move(e.clientX < W/2 ? -1 : 1); });
  addEventListener('keydown',function(e){ if(e.key==='ArrowLeft')move(-1); if(e.key==='ArrowRight')move(1); });
  document.getElementById('over').style.display='flex'; loop();
})();
</script>
</body></html>
