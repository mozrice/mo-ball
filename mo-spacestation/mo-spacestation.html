<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Space Station</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#04030f;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04030f;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.7);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function dock(){ bp(660,0.12,'triangle',0.2); setTimeout(function(){bp(990,0.14,'triangle',0.2);},120); setTimeout(function(){bp(1320,0.18,'triangle',0.2);},260); }
function bump(){ bp(140,0.16,'square',0.18); }

// controls
var JB={x:66,y:H-58,r:46}, AB={x:W-56,y:H-56,r:42}, BB={x:W-116,y:H-96,r:32};
var joyId=null,joyX=0,joyY=0,aId=null,bId=null;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+8; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(inC(p,BB)){ bId=e.pointerId; resetRocket(); return; }
  if(inC(p,AB)){ aId=e.pointerId; return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; if(e.pointerId===bId)bId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

// world
var stars=[]; for(var i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+0.4,tw:Math.random()*6});
var rk={x:W/2,y:H-160,vx:0,vy:0,thr:0};
var st={x:W/2,y:150,drift:16,dir:1,pad:34};
var score=0, msg='Fly up and dock gently!', msgT=2, docked=0, shake=0;
function resetRocket(){ rk.x=W/2; rk.y=H-160; rk.vx=0; rk.vy=0; }
function newStation(){ st.x=80+Math.random()*(W-160); st.drift=16+docked*4; st.dir=Math.random()<0.5?1:-1; }
function showMsg(t){ msg=t; msgT=1.6; }

function upd(dt){ if(msgT>0)msgT-=dt; if(shake>0)shake-=dt;
  var v=jv();
  // fly: joystick eases velocity, gentle space drift
  var maxS=150; rk.vx += (v.x*maxS - rk.vx)*Math.min(1,3.2*dt); rk.vy += (v.y*maxS - rk.vy)*Math.min(1,3.2*dt);
  rk.vy += 10*dt; // tiny downward drift
  if(aId!==null){ rk.vx*=0.86; rk.vy*=0.86; rk.thr=1; } else rk.thr = (Math.abs(v.x)+Math.abs(v.y))>0.2?0.6:0;
  rk.x=clamp(rk.x+rk.vx*dt,20,W-20); rk.y=clamp(rk.y+rk.vy*dt,60,H-120);
  if(rk.x<=20||rk.x>=W-20)rk.vx=0; if(rk.y>=H-120)rk.vy=0;
  // station drift
  st.x+=st.dir*st.drift*dt; if(st.x>W-70){st.x=W-70;st.dir=-1;} if(st.x<70){st.x=70;st.dir=1;}
  // docking: rocket nose (top) near pad (bottom of station), aligned x, slow
  var padY=st.y+34, noseY=rk.y-20; var spd=Math.hypot(rk.vx,rk.vy);
  if(noseY<padY+14 && noseY>padY-20 && Math.abs(rk.x-st.x)<st.pad){
    if(spd<70){ score++; docked++; dock(); showMsg('DOCKED! 🛰️ +1'); resetRocket(); newStation(); }
    else { bump(); shake=0.4; rk.vy=Math.abs(rk.vy)*0.5+40; rk.vx*=-0.4; showMsg('Too fast! Slow down (hold A)'); }
  }
  // hit station body sides -> bump
  else if(rk.y-16<st.y+20 && rk.y-16>st.y-20 && Math.abs(rk.x-st.x)>st.pad && Math.abs(rk.x-st.x)<70){ bump(); shake=0.3; rk.vy=Math.abs(rk.vy)*0.5+40; rk.x+=(rk.x<st.x?-1:1)*8; showMsg('Careful — aim for the green pad!'); }
  stars.forEach(function(s){ s.tw+=dt*3; });
}

function drawRocket(x,y,thr){ cx.save(); cx.translate(x,y);
  if(thr>0){ cx.fillStyle='#ffce3a'; cx.beginPath(); cx.moveTo(-6,22); cx.lineTo(6,22); cx.lineTo(0,34+thr*10); cx.fill(); cx.fillStyle='#ff6a1a'; cx.beginPath(); cx.moveTo(-3,22); cx.lineTo(3,22); cx.lineTo(0,28+thr*6); cx.fill(); }
  cx.fillStyle='#e8e8f0'; cx.beginPath(); cx.moveTo(0,-22); cx.lineTo(11,6); cx.lineTo(11,20); cx.lineTo(-11,20); cx.lineTo(-11,6); cx.closePath(); cx.fill();
  cx.fillStyle='#e0563b'; cx.beginPath(); cx.moveTo(0,-22); cx.lineTo(8,0); cx.lineTo(-8,0); cx.fill(); // nose
  cx.fillStyle='#e0563b'; cx.beginPath(); cx.moveTo(-11,10); cx.lineTo(-20,22); cx.lineTo(-11,22); cx.fill(); cx.beginPath(); cx.moveTo(11,10); cx.lineTo(20,22); cx.lineTo(11,22); cx.fill();
  cx.fillStyle='#5ab0e0'; cx.beginPath(); cx.arc(0,6,5,0,7); cx.fill();
  cx.restore(); }
function drawStation(){ cx.save(); cx.translate(st.x,st.y);
  // solar panels
  cx.fillStyle='#2a4a8a'; cx.fillRect(-72,-8,46,16); cx.fillRect(26,-8,46,16); cx.strokeStyle='#5a7ac0'; for(var i=-70;i<-28;i+=10)cx.strokeRect(i,-8,10,16); for(var i=28;i<70;i+=10)cx.strokeRect(i,-8,10,16);
  cx.fillStyle='#c8ccd8'; rr(-26,-22,52,44,8); cx.fill(); cx.fillStyle='#8a90a0'; rr(-26,-22,52,10,6); cx.fill();
  cx.fillStyle='#5ab0e0'; cx.beginPath(); cx.arc(-10,-2,4,0,7); cx.arc(6,-2,4,0,7); cx.fill();
  // docking pad (green ring) at bottom
  cx.fillStyle='#1a5a2a'; rr(-st.pad,20,st.pad*2,14,6); cx.fill(); cx.fillStyle='#39ff88'; rr(-st.pad+3,22,st.pad*2-6,4,2); cx.fill();
  cx.fillStyle='#fff'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.fillText('DOCK HERE',0,31);
  cx.restore(); }
function draw(){ cx.clearRect(0,0,W,H);
  var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a0a30'); g.addColorStop(1,'#04030f'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  stars.forEach(function(s){ cx.globalAlpha=0.5+0.5*Math.sin(s.tw); cx.fillStyle='#fff'; cx.fillRect(s.x,s.y,s.s,s.s); }); cx.globalAlpha=1;
  emoji('🌍',60,H-70,40); emoji('🌙',W-56,90,26);
  var ox=shake>0?(Math.random()-0.5)*6:0, oy=shake>0?(Math.random()-0.5)*6:0; cx.save(); cx.translate(ox,oy);
  drawStation(); drawRocket(rk.x,rk.y,rk.thr); cx.restore();
  // speed meter
  var spd=Math.hypot(rk.vx,rk.vy); var safe=spd<70;
  cx.fillStyle='rgba(255,255,255,.12)'; rr(W/2-70,H-150,140,12,6); cx.fill(); cx.fillStyle=safe?'#39ff88':'#ff5a5a'; rr(W/2-70,H-150,140*clamp(spd/220,0,1),12,6); cx.fill();
  cx.fillStyle=safe?'#39ff88':'#ff8a8a'; cx.font='bold 11px Trebuchet MS'; cx.textAlign='center'; cx.fillText(safe?'SPEED OK ✓':'TOO FAST!',W/2,H-156);
  // HUD
  cx.fillStyle='rgba(10,10,40,.6)'; rr(8,8,W-16,32,10); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 14px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🛰️ MO Space Station',14,30); cx.textAlign='right'; cx.fillStyle='#39ff88'; cx.fillText('Docks: '+score,W-14,30);
  if(msgT>0){ cx.globalAlpha=Math.min(1,msgT*1.4); cx.textAlign='center'; cx.fillStyle='#ffd23f'; cx.font='bold 20px Trebuchet MS'; cx.fillText(msg,W/2,H/2+40); cx.globalAlpha=1; }
  // controls
  var v=jv(); cx.fillStyle='rgba(255,255,255,.14)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.45)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.6)';cx.font='bold 10px Trebuchet MS';cx.textAlign='center';cx.fillText('FLY',JB.x,JB.y+JB.r+12);
  cx.fillStyle=aId!==null?'#ffd23f':'rgba(255,210,63,.9)'; cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle='#2a1400'; cx.font='bold 18px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('A',AB.x,AB.y); cx.textBaseline='alphabetic'; cx.fillStyle='#ffd23f';cx.font='bold 9px Trebuchet MS';cx.fillText('BRAKE',AB.x,AB.y+AB.r+11);
  cx.fillStyle=bId!==null?'#ff5ad0':'#c14fe0'; cx.beginPath(); cx.arc(BB.x,BB.y,BB.r,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 16px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('B',BB.x,BB.y); cx.textBaseline='alphabetic'; cx.fillStyle='#e6b0ff';cx.font='bold 9px Trebuchet MS';cx.fillText('RESET',BB.x,BB.y+BB.r+10);
}
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window._SS={ get score(){return score;}, setV:function(x,y){rk.vx=x;rk.vy=y;}, setPos:function(x,y){rk.x=x;rk.y=y;}, stX:function(){return st.x;}, stY:function(){return st.y;} };
})();
</script>
</body>
</html>
