<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Sports</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0e2a4a;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#2a6ab0 0%,#123a6a 60%,#0a1e3a 100%);}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640,DPR=Math.min(window.devicePixelRatio||1,2),scale=1;
function fit(){ var s=Math.min(window.innerWidth/W,window.innerHeight/H); scale=s; cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();

// ---- audio ----
var AC=null; function ac(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function tone(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.2,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.15)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.15)+0.02); }
function ding(){ tone(880,0.12,'triangle',0.2); setTimeout(function(){tone(1320,0.14,'triangle',0.18);},80); }
function buzz(){ tone(160,0.3,'sawtooth',0.2); }
function pop(){ tone(520,0.08,'square',0.14); }

// ---- roster ----
var ROSTER=[{id:'mo',n:'Mo',c:'#e0563b',skin:'#8a5a34'},{id:'arff',n:'Arff',c:'#ffffff',skin:'#ffffff'},{id:'mummy',n:'Mummy',c:'#f4a0c8',skin:'#f4a0c8'},{id:'daddy',n:'Daddy',c:'#8fd6ff',skin:'#f4a0c8'},{id:'flick',n:'Flick',c:'#b0ffb0',skin:'#f4a0c8'},{id:'evie',n:'Evie',c:'#e0b0ff',skin:'#f4a0c8'}];
function rget(id){ for(var i=0;i<ROSTER.length;i++)if(ROSTER[i].id===id)return ROSTER[i]; return ROSTER[0]; }
var player='mo';

var EVENTS=[{id:'bball',n:'Basketball',e:'🏀'},{id:'sprint',n:'100m Sprint',e:'🏃'},{id:'swim',n:'Swimming',e:'🏊'},{id:'archery',n:'Archery',e:'🎯'},{id:'jump',n:'Long Jump',e:'🤸'}];
var medals={}; // id -> 'gold'|'silver'|'bronze'
var screen='menu', curEv=null, E={}, msg='', msgT=0;
var mode='olympics';
var NBA_EAST=[{id:'arff',n:'Arff MyTeam',e:'🐾',c:'#ffffff',conf:'E'},{id:'bos',n:'Boston',e:'🍀',c:'#1f8f46',conf:'E'},{id:'mia',n:'Miami',e:'🔥',c:'#e0563b',conf:'E'},{id:'mil',n:'Milwaukee',e:'🦌',c:'#2f6a3a',conf:'E'},{id:'nyk',n:'New York',e:'🗽',c:'#e0863a',conf:'E'},{id:'phi',n:'Philly',e:'🔔',c:'#3a6ab0',conf:'E'},{id:'cle',n:'Cleveland',e:'🍷',c:'#7a1f3a',conf:'E'},{id:'orl',n:'Orlando',e:'🪄',c:'#3a9ad0',conf:'E'}];
var NBA_WEST=[{id:'okc',n:'OKC',e:'⚡',c:'#007ac1',conf:'W'},{id:'den',n:'Denver',e:'⛰️',c:'#1b3a6a',conf:'W'},{id:'lal',n:'LA Lakers',e:'💜',c:'#8b5ae0',conf:'W'},{id:'gsw',n:'Golden State',e:'🌉',c:'#ffd23f',conf:'W'},{id:'phx',n:'Phoenix',e:'☀️',c:'#e0863a',conf:'W'},{id:'dal',n:'Dallas',e:'🐎',c:'#3a6ab0',conf:'W'},{id:'min',n:'Minnesota',e:'🐺',c:'#2a6a8a',conf:'W'},{id:'mem',n:'Memphis',e:'🐻',c:'#3a9ad0',conf:'W'}];
var MO_EAST=[{id:'arffm',n:'Team Arff',e:'🐾',c:'#ffffff',conf:'E'},{id:'mom',n:'Team Mo',e:'🏀',c:'#e0563b',conf:'E'},{id:'eviem',n:'Team Evie',e:'🐷',c:'#e0b0ff',conf:'E'},{id:'flickm',n:'Team Flick',e:'💚',c:'#8fd66a',conf:'E'},{id:'citym',n:'Team City',e:'🏙️',c:'#5aa0e0',conf:'E'},{id:'hotelm',n:'Team Hotel',e:'🏨',c:'#e05a9a',conf:'E'},{id:'subm',n:'Team Subway',e:'🚇',c:'#3a9ad0',conf:'E'},{id:'fairm',n:'Team Fair',e:'🎡',c:'#ff8b2c',conf:'E'}];
var MO_WEST=[{id:'okcm',n:'Team OKC',e:'⚡',c:'#007ac1',conf:'W'},{id:'meowm',n:'Team Meow',e:'🐱',c:'#f0a030',conf:'W'},{id:'mummym',n:'Team Mummy',e:'💗',c:'#f4a0c8',conf:'W'},{id:'daddym',n:'Team Daddy',e:'💙',c:'#8fd6ff',conf:'W'},{id:'dogsm',n:'Dog Park',e:'🐕',c:'#39b56a',conf:'W'},{id:'carm',n:'Carousel',e:'🎠',c:'#c78aff',conf:'W'},{id:'rainm',n:'Rainbow',e:'🌈',c:'#ff7ab0',conf:'W'},{id:'ballm',n:'MOBALL',e:'🏀',c:'#ff8b2c',conf:'W'}];
var league='nba';
var EAST=NBA_EAST, WEST=NBA_WEST, ALLTEAMS=NBA_EAST.concat(NBA_WEST);
function setLeague(l){ league=l; EAST=(l==='mo')?MO_EAST:NBA_EAST; WEST=(l==='mo')?MO_WEST:NBA_WEST; ALLTEAMS=EAST.concat(WEST); }
var RNAMES=['Round 1','Conf Semis','Conf Finals','FINALS 🏆'];
var po={team:null,round:0,opp:null,youMakes:0,oppMakes:0,win:false,unlocked:''};
var UNLOCKS=['🏀 MOBALL Mo','🏙️ City Arff','🚇 Subway Mo','🏨 Hotel Evie','⛲ Fountain Meow','🎡 Fair Daddy','⚡ OKC Star','🌈 Rainbow Arff','🐕 Dog Park Pup','🎠 Carousel Evie'];
var playbook=[];
try{ var _pb=localStorage.getItem('mosports_playbook'); if(_pb)playbook=JSON.parse(_pb); }catch(e){}
function savePB(){ try{ localStorage.setItem('mosports_playbook',JSON.stringify(playbook)); }catch(e){} }
// playoff sports (best score wins the match)
var SPORTS=[{id:'three',n:'3-Point Contest',e:'🎯'},{id:'nfl',n:'MO NFL',e:'🏈'},{id:'build',n:'Home Builder',e:'🏠'},{id:'subway',n:'Subway Drive',e:'🚇'}];
function sname(id){ for(var i=0;i<SPORTS.length;i++)if(SPORTS[i].id===id)return SPORTS[i].n; return id; }
// song maker
var SONG={rows:5,cols:16,grid:[],playing:false,step:0,timer:null};
for(var _r=0;_r<5;_r++){ SONG.grid.push([]); for(var _cc=0;_cc<16;_cc++)SONG.grid[_r].push(0); }

// ---- input ----
var BTN=[];
function btn(x,y,w,h,label,fn,col){ BTN.push({x:x,y:y,w:w,h:h,label:label,fn:fn,col:col}); }
function drawBtns(){ BTN.forEach(function(b){ cx.fillStyle=b.col||'#ffd23f'; rr(b.x,b.y,b.w,b.h,12); cx.fill(); cx.fillStyle='#2a1500'; cx.font='bold 16px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(b.label,b.x+b.w/2,b.y+b.h/2); }); cx.textBaseline='alphabetic'; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
var drag=null, joy={active:false,cx:0,cy:0,dx:0,dy:0};
cv.addEventListener('pointerdown',function(e){ var p=pt(e); if(ac()&&ac().state==='suspended')ac().resume();
 for(var i=0;i<BTN.length;i++){ var b=BTN[i]; if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){ pop(); b.fn(); return; } }
 if(screen==='play') evDown(p); });
cv.addEventListener('pointermove',function(e){ if(screen!=='play')return; var p=pt(e); if(drag){ drag.x=p.x; drag.y=p.y; } if(joy.active){ joy.dx=p.x-joy.cx; joy.dy=p.y-joy.cy; } });
window.addEventListener('pointerup',function(e){ if(screen==='play'&&drag) evUp(); joy.active=false; joy.dx=0; joy.dy=0; });

function setMsg(m,ms){ msg=m; msgT=ms||1200; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
var BUILDSTEPS=[{t:'rug',e:'🟫',n:'Rug'},{t:'brick',e:'🧱',n:'Bricks'},{t:'ceiling',e:'⬜',n:'Ceiling'},{t:'paint',e:'🎨',n:'Paint'},{t:'item',e:'🛋️',n:'Furniture'}];

// ================= EVENT ENGINE =================
function startEvent(id){ curEv=id; screen='play'; drag=null;
 if(id==='bball'){ E={shots:0,makes:0,ball:{x:200,y:520,vx:0,vy:0,live:false},prevY:520,scored:false}; }
 else if(id==='sprint'){ E={me:0,ok:0,t:3,go:false,done:false,speed:0}; }
 else if(id==='swim'){ E={prog:0,t:0,last:0,done:false,started:false}; }
 else if(id==='archery'){ E={arrow:0,phase:'x',rx:0,ry:0,lockx:0,score:0,done:false}; }
 else if(id==='jump'){ E={phase:'power',power:0,angle:0,pv:0,av:0,dist:0,anim:0,done:false,jx:60,jy:470,jvx:0,jvy:0}; }
 else if(id==='three'){ E={t:22,makes:0,ball:{x:200,y:520,vx:0,vy:0,live:false},prevY:520,scored:false,done:false}; }
 else if(id==='nfl'){ E={kind:'nfl',t:28,score:0,cpuScore:0,px:150,py:560,cx:270,cy:560,defs:[{x:80,y:280},{x:200,y:220},{x:320,y:300}],done:false,tackFlash:0}; }
 else if(id==='build'){ E={kind:'build',t:30,score:0,cpuScore:0,px:150,py:460,cx:270,cy:460,stage:0,cstage:0,tx:0,ty:0,ctx:0,cty:0,done:false}; E.tx=60+Math.random()*300; E.ty=180+Math.random()*260; E.ctx=60+Math.random()*300; E.cty=180+Math.random()*260; }
 else if(id==='subway'){ E={kind:'subway',t:28,score:0,cpuScore:0,px:150,py:520,cx:270,cy:520,pax:[],done:false}; for(var _pi=0;_pi<8;_pi++)E.pax.push({x:40+Math.random()*320,y:110+Math.random()*380}); }
}
function awardMedal(quality){ // quality 0..1
 var m = quality>=0.75?'gold':(quality>=0.45?'silver':'bronze'); medals[curEv]=m; ding();
 E.done=true; E.result=m; E.quality=quality; screen='result';
 buildResult();
}
function buildResult(){ /* buttons built in draw */ }

// ---- per event update ----
function updateEvent(dt){
 if(curEv==='bball'){ var b=E.ball; if(b.live){ E.prevY=b.y; b.x+=b.vx; b.y+=b.vy; b.vy+=0.42;
    if(!E.scored&&b.vy>0&&E.prevY<=250&&b.y>=250&&b.x>174&&b.x<226){ E.scored=true; E.makes++; ding(); b.live=false; setMsg('SWISH! 🏀',700); nextShot(); }
    else if(b.y>560){ b.live=false; if(!E.scored){buzz(); setMsg('Miss!',600);} nextShot(); }
    else if(b.x<12||b.x>388){ b.live=false; nextShot(); }
   }
 }
 else if(curEv==='sprint'){ if(!E.go){ E.t-=dt; if(E.t<=0){ E.go=true; ding(); } }
   else if(!E.done){ E.speed*=0.94; E.me+=E.speed*dt*60*0.1; E.ok+=0.42*dt*60*0.1; if(E.me>=100||E.ok>=100){ E.done=true; var q=E.me>=E.ok?(E.me-E.ok>8?1:0.7):(E.ok-E.me<10?0.5:0.3); awardMedal(q); } }
 }
 else if(curEv==='swim'){ if(E.started&&!E.done){ E.t+=dt; if(E.prog>=100){ E.done=true; var q=E.t<7?1:(E.t<11?0.6:0.35); awardMedal(q); } } }
 else if(curEv==='archery'){ if(!E.done){ if(E.phase==='x'){ E.rx=Math.sin(performance.now()/300)*90; } else if(E.phase==='y'){ E.ry=Math.sin(performance.now()/300)*90; } }
 }
 else if(curEv==='jump'){ if(E.phase==='power'){ E.power=(Math.sin(performance.now()/260)*0.5+0.5); }
   else if(E.phase==='angle'){ E.angle=(Math.sin(performance.now()/300)*0.5+0.5)*90; }
   else if(E.phase==='fly'){ E.jx+=E.jvx; E.jy+=E.jvy; E.jvy+=0.5; if(E.jy>=470){ E.jy=470; E.phase='land'; var d=(E.jx-60)/28; E.dist=d; var q=d>8?1:(d>5?0.6:0.35); awardMedal(Math.min(1,q)); } }
 }
 else if(curEv==='three'){ if(!E.done){ E.t-=dt; if(E.t<0)E.t=0; } var b=E.ball; if(b.live){ E.prevY=b.y; b.x+=b.vx;b.y+=b.vy;b.vy+=0.42;
    if(!E.scored&&b.vy>0&&E.prevY<=250&&b.y>=250&&b.x>174&&b.x<226){ E.makes++;ding();setMsg('SWISH +1! 🎯',450); b.live=false; b.x=200;b.y=520;b.vx=0;b.vy=0;E.scored=false; }
    else if(b.y>560||b.x<12||b.x>388){ b.live=false; b.x=200;b.y=520;b.vx=0;b.vy=0;E.scored=false; } }
   if(E.t<=0&&!E.done){ E.done=true; finishMatch(E.makes, E.makes>=6?1:(E.makes>=3?0.6:0.35)); }
 }
 else if(curEv==='nfl'||curEv==='build'||curEv==='subway'){ if(E.done)return;
   var mv=Math.hypot(joy.dx,joy.dy); if(joy.active&&mv>6){ var sp=Math.min(1,mv/46)*(curEv==='subway'?3.6:3.2); E.px+=joy.dx/mv*sp; E.py+=joy.dy/mv*sp; }
   E.px=clamp(E.px,18,382); E.py=clamp(E.py,66,600);
   if(E.tackFlash>0)E.tackFlash-=dt;
   var cspd=(curEv==='subway'?2.0:1.7);
   if(curEv==='nfl'){ E.defs.forEach(function(d){ var dx=E.px-d.x,dy=E.py-d.y,dd=Math.hypot(dx,dy)||1; d.x+=dx/dd*1.1; d.y+=dy/dd*1.1; if(dd<20){ E.tackFlash=0.5; buzz(); E.px=150; E.py=560; } }); if(E.py<94){ E.score++; ding(); setMsg('TOUCHDOWN! 🏈',700); E.px=150; E.py=560; E.defs=[{x:60+Math.random()*280,y:220},{x:60+Math.random()*280,y:300},{x:60+Math.random()*280,y:380}]; }
     E.cy-=1.05; E.cx+=Math.sin(performance.now()/380)*0.6; if(E.cy<94){ E.cpuScore++; E.cy=560; E.cx=80+Math.random()*240; } }
   else if(curEv==='build'){ if(Math.hypot(E.px-E.tx,E.py-E.ty)<26){ var st=BUILDSTEPS[E.stage%BUILDSTEPS.length]; E.score++; ding(); setMsg('Placed the '+st.n+'! '+st.e,600); E.stage++; E.tx=50+Math.random()*310; E.ty=170+Math.random()*280; }
     var cdx=E.ctx-E.cx,cdy=E.cty-E.cy,cd=Math.hypot(cdx,cdy)||1; E.cx+=cdx/cd*cspd; E.cy+=cdy/cd*cspd; if(cd<24){ E.cpuScore++; E.cstage++; E.ctx=50+Math.random()*310; E.cty=170+Math.random()*280; } }
   else { for(var j=0;j<E.pax.length;j++){ var pxo=E.pax[j]; if(Math.hypot(E.px-pxo.x,E.py-pxo.y)<24){ E.pax.splice(j,1); E.score++; pop(); setMsg('Passenger aboard! 🚇',450); E.pax.push({x:40+Math.random()*320,y:110+Math.random()*380}); break; } }
     var best=-1,bd=1e9; for(var ci=0;ci<E.pax.length;ci++){ var pp=E.pax[ci]; var d2=Math.hypot(E.cx-pp.x,E.cy-pp.y); if(d2<bd){bd=d2;best=ci;} } if(best>=0){ var tp=E.pax[best]; var q1=tp.x-E.cx,q2=tp.y-E.cy,q3=Math.hypot(q1,q2)||1; E.cx+=q1/q3*cspd; E.cy+=q2/q3*cspd; if(q3<22){ E.pax.splice(best,1); E.cpuScore++; E.pax.push({x:40+Math.random()*320,y:110+Math.random()*380}); } } }
   E.t-=dt; if(E.t<=0){ E.done=true; if(mode==='playoffs'){ po.youScore=E.score; po.oppScore=E.cpuScore; po.win=E.score>=E.cpuScore; if(po.win)ding(); else buzz(); screen='poresult'; } else { awardMedal(E.score>=E.cpuScore?0.8:0.4); } }
 }
}
function finishMatch(score,quality){ if(mode==='playoffs'){ poFinish(score); } else { awardMedal(Math.min(1,quality)); } }
function nextShot(){ E.shots++; E.scored=false; if(E.shots>=5){ var q=E.makes>=5?1:(E.makes>=3?0.7:(E.makes>=1?0.5:0.3)); setTimeout(function(){ awardMedal(q); },500); } else { E.ball.x=200;E.ball.y=520;E.ball.vx=0;E.ball.vy=0;E.ball.live=false; } }

// ---- per event input ----
function evDown(p){
 if(curEv==='bball'){ if(!E.ball.live&&E.shots<5){ drag={sx:p.x,sy:p.y,x:p.x,y:p.y}; } }
 else if(curEv==='swim'){ if(!E.started){E.started=true;} var side=p.x<200?0:1; if(E.last!==side){ E.prog=Math.min(100,E.prog+4.5); } else { E.prog=Math.min(100,E.prog+1); } E.last=side; pop(); }
 else if(curEv==='archery'){ if(E.phase==='x'){ E.lockx=E.rx; E.phase='y'; pop(); } else if(E.phase==='y'){ var dx=E.lockx, dy=E.ry; var dist=Math.hypot(dx,dy); var ring=Math.max(0,10-Math.round(dist/9)); E.score+=ring; tone(600+ring*40,0.12,'triangle',0.18); E.arrow++; if(E.arrow>=3){ var q=E.score>=24?1:(E.score>=15?0.6:0.35); E.phase='done'; awardMedal(Math.min(1,q)); } else { E.phase='x'; } } }
 else if(curEv==='jump'){ if(E.phase==='power'){ E.pv=E.power; E.phase='angle'; pop(); } else if(E.phase==='angle'){ E.av=E.angle; E.phase='fly'; var rad=E.av*Math.PI/180; var v=6+E.pv*10; E.jvx=Math.cos(rad)*v; E.jvy=-Math.sin(rad)*v; pop(); } }
 else if(curEv==='three'){ if(!E.ball.live&&E.t>0){ drag={sx:p.x,sy:p.y,x:p.x,y:p.y}; } }
 else if(curEv==='nfl'||curEv==='build'||curEv==='subway'){ joy.active=true; joy.cx=p.x; joy.cy=p.y; joy.dx=0; joy.dy=0; }
}
function evUp(){ if((curEv==='bball'||curEv==='three')&&drag){ var dx=drag.x-drag.sx, dy=drag.y-drag.sy; var len=Math.hypot(dx,dy); if(len>12){ var k=0.16; var vx=dx*k, vy=dy*k; var sp=Math.hypot(vx,vy),mx=17; if(sp>mx){vx=vx/sp*mx;vy=vy/sp*mx;} E.ball.vx=vx;E.ball.vy=vy;E.ball.live=true;E.prevY=E.ball.y; tone(300,0.1,'square',0.12);} drag=null; } }

// tap-to-run for sprint (whole screen)
cv.addEventListener('pointerdown',function(e){ if(screen==='play'&&curEv==='sprint'&&E.go&&!E.done){ E.speed+=1.4; pop(); } });

// ================= DRAW =================
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function medalCol(m){ return m==='gold'?'#ffd23f':m==='silver'?'#cfd8e0':m==='bronze'?'#d0894a':'#3a5a80'; }
function drawPerson(x,y,col,skin,pose){ // simple athlete
 cx.fillStyle='#2a3a5a'; cx.fillRect(x-9,y+16,7,20); cx.fillRect(x+2,y+16,7,20);
 cx.fillStyle=col; rr(x-12,y-6,24,26,6); cx.fill();
 cx.fillStyle=skin; cx.beginPath(); cx.arc(x,y-18,11,0,7); cx.fill();
 if(pose==='run'){ cx.strokeStyle=skin; cx.lineWidth=5; cx.lineCap='round'; cx.beginPath(); cx.moveTo(x-10,y+2); cx.lineTo(x-18,y-6); cx.moveTo(x+10,y+2); cx.lineTo(x+18,y+8); cx.stroke(); }
}
function draw(){ cx.clearRect(0,0,W,H); BTN=[];
 if(screen==='menu') drawMenu();
 else if(screen==='pick') drawPick();
 else if(screen==='hub') drawHub();
 else if(screen==='play') drawPlay();
 else if(screen==='result') drawResult();
 else if(screen==='ceremony') drawCeremony();
 else if(screen==='teams') drawTeams();
 else if(screen==='bracket') drawBracket();
 else if(screen==='poresult') drawPoResult();
 else if(screen==='champ') drawChamp();
 else if(screen==='myteam') drawMyTeam();
 else if(screen==='song') drawSong();
 if(msg&&msgT>0){ cx.fillStyle='rgba(10,20,40,.85)'; rr(W/2-110,54,220,40,12); cx.fill(); cx.fillStyle='#ffd23f'; cx.font='bold 20px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(msg,W/2,74); cx.textBaseline='alphabetic'; }
