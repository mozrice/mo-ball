<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MO SPORTS — Trick Shots</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#5a3a1a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000066;padding:6px 10px;border-radius:10px;}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10;background:#1a1020cc;}
  .overlay.hide{display:none;}
  .card{background:#fff6e8;border:4px solid #e8902a;border-radius:20px;padding:22px 26px;max-width:92%;box-shadow:0 18px 50px #0009;color:#5a3a1a;}
  .card h1{margin:0 0 8px;font-size:28px;color:#d4641e;}
  .card p{margin:8px 0;line-height:1.35;font-size:16px;}
  .big{margin-top:14px;padding:14px 30px;font-size:22px;font-weight:900;background:linear-gradient(#ffd98a,#f2902a);color:#4a2708;border:none;border-radius:14px;box-shadow:0 5px 0 #c86a1a;cursor:pointer;}
  .big:active{transform:translateY(4px);box-shadow:0 1px 0 #c86a1a;}
</style>
</head>
<body>
<a class="back" href="mo-sports.html">&#11013; MO SPORTS</a>
<canvas id="c"></canvas>
<div class="overlay" id="startOv">
  <div class="card">
    <h1>🎯 TRICK SHOTS</h1>
    <p>Make the shot from each spot — they get wilder every round!</p>
    <p style="font-size:14px;opacity:.9"><b>Hold</b> to fill the <b>power bar</b>, <b>let go</b> on the <b>green spot</b> to swish!<br>Farther spots are worth more points.<br>You get <b>3 misses</b> — how far can you go?</p>
    <button class="big" id="startBtn">▶ SHOOT!</button>
  </div>
</div>
<div class="overlay hide" id="endOv">
  <div class="card">
    <h1 id="endTitle">🏀 Nice shooting!</h1>
    <p id="endMsg">You scored big!</p>
    <button class="big" id="againBtn">🔁 Play again</button>
  </div>
</div>
<script>
"use strict";
(function(){
  var cv=document.getElementById("c"), x=cv.getContext("2d");
  var W=0,H=0,DPR=1,fy=0;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+"px"; cv.style.height=H+"px"; x.setTransform(DPR,0,0,DPR,0,0); fy=H*0.74; place(); }
  addEventListener("resize",resize);

  var AC=null; function ac(){ if(!AC){ try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
  function beep(f,d,t,v){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.type=t||"sine"; o.frequency.value=f; g.gain.value=v||0.06; o.connect(g); g.connect(a.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1)); o.stop(a.currentTime+(d||0.1)+0.02); }
  function swish(){ beep(1200,0.08,"sine",0.06); setTimeout(function(){beep(1600,0.1,"sine",0.05);},70); }
  function cheer(){ beep(523,0.1,"triangle",0.06); setTimeout(function(){beep(659,0.1,"triangle",0.06);},90); setTimeout(function(){beep(784,0.16,"triangle",0.06);},180); }
  function clang(){ beep(300,0.07,"square",0.05); }
  function miss(){ beep(220,0.14,"sawtooth",0.04); }

  // trick-shot spots, left of the hoop, getting farther (more points)
  var SPOTS=[
    {f:0.60, n:"Layup", p:1},
    {f:0.50, n:"Free Throw", p:2},
    {f:0.42, n:"Wing Jumper", p:2},
    {f:0.32, n:"Corner Three", p:3},
    {f:0.25, n:"Deep Three", p:4},
    {f:0.16, n:"Half-Court", p:6},
    {f:0.09, n:"Full-Court Heave", p:10}
  ];
  var mode="start", idx=0, score=0, lives=3, ball, hoop, launchPt, resetT=0, conf=[], cheerT=0, shake=0;
  var GRAV=0.42;
  var charging=false, meter=0, mdir=1, MSPEED=0.026, KMIN=0.80, KMAX=1.20, ZLO=0.43, ZHI=0.52;

  function place(){ hoop={x:W*0.82, y:H*0.40, r:Math.max(18,W*0.05)}; setSpot(); }
  function setSpot(){ var s=SPOTS[Math.min(idx,SPOTS.length-1)]; launchPt={x:W*s.f, y:fy-6}; if(!ball||!ball.flying){ ball={x:launchPt.x, y:launchPt.y-18, vx:0,vy:0,flying:false,scored:false,passedY:false, r:Math.max(10,W*0.028)}; } }
  function reset(){ idx=0; score=0; lives=3; conf=[]; cheerT=0; shake=0; resetT=0; charging=false; meter=0; place(); ball.flying=false; }

  function pt(e){ var t=e.touches&&e.touches[0]?e.touches[0]:e; var r=cv.getBoundingClientRect(); return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)}; }
  function down(e){ ac(); if(mode!=="play"||ball.flying||resetT>0)return; if(e.cancelable)e.preventDefault(); charging=true; meter=0; mdir=1; }
  function up(){ if(!charging)return; charging=false; shootPower(meter); }
  cv.addEventListener("mousedown",down); addEventListener("mouseup",up);
  cv.addEventListener("touchstart",down,{passive:false}); addEventListener("touchend",up); addEventListener("touchcancel",up);

  function computeIdeal(){ var lx=ball.x, ly=ball.y, hx=hoop.x, hy=hoop.y;
    var apexRise=(ly-hy)+H*0.14; var vy0=-Math.sqrt(2*GRAV*Math.max(10,apexRise));
    var a=0.5*GRAV, bq=vy0, cq=(ly-hy); var disc=bq*bq-4*a*cq; if(disc<0)disc=0; var t=(-bq+Math.sqrt(disc))/(2*a);
    return {vx:(hx-lx)/t, vy:vy0}; }
  function shootPower(p){ var k=KMIN+(KMAX-KMIN)*p; var v=computeIdeal(); ball.vx=v.vx*k; ball.vy=v.vy*k; ball.flying=true; ball.scored=false; ball.passedY=false; beep(430,0.05,"triangle",0.05); }

  function madeShot(){ var s=SPOTS[Math.min(idx,SPOTS.length-1)]; score+=s.p; cheerT=60; swish(); cheer();
    for(var i=0;i<30;i++) conf.push({x:hoop.x+(Math.random()-0.5)*50,y:hoop.y,vx:(Math.random()-0.5)*6,vy:-Math.random()*6-2,life:60,c:["#ffcf5a","#e8545a","#4f90e8","#4fbf6a","#fff"][i%5]});
    idx++; resetT=34; ball.flying=false;
    if(idx>=SPOTS.length){ setTimeout(win,700); } }
  function missedShot(){ lives--; shake=16; miss(); resetT=24; ball.flying=false; if(lives<=0){ setTimeout(gameOver,600); } }

  function win(){ mode="end"; document.getElementById("endTitle").textContent="🏆 Trick Shot Master!"; document.getElementById("endMsg").textContent="You made every spot — final score "+score+"! Amazing!"; document.getElementById("endOv").classList.remove("hide"); }
  function gameOver(){ mode="end"; document.getElementById("endTitle").textContent="🏀 Great shooting!"; document.getElementById("endMsg").textContent="You scored "+score+" and reached the "+SPOTS[Math.min(idx,SPOTS.length-1)].n+". Try again!"; document.getElementById("endOv").classList.remove("hide"); }

  function start(){ ac(); resize(); reset(); mode="play"; document.getElementById("startOv").classList.add("hide"); document.getElementById("endOv").classList.add("hide"); }
  document.getElementById("startBtn").onclick=start; document.getElementById("againBtn").onclick=start;

  function update(){ if(cheerT>0)cheerT--; if(shake>0)shake--;
    if(charging){ meter+=mdir*MSPEED; if(meter>=1){meter=1;mdir=-1;} if(meter<=0){meter=0;mdir=1;} }
    if(ball.flying){ ball.x+=ball.vx; ball.y+=ball.vy; ball.vy+=GRAV;
      if(!ball.scored){ if(ball.vy>0 && !ball.passedY && ball.y>=hoop.y && ball.y-ball.vy<hoop.y){ ball.passedY=true; if(Math.abs(ball.x-hoop.x)<hoop.r*0.85){ ball.scored=true; madeShot(); } }
        if(ball.x>hoop.x+hoop.r*1.1 && ball.x-ball.vx<=hoop.x+hoop.r*1.1 && ball.y<hoop.y+10 && ball.y>hoop.y-hoop.r*2.2){ ball.vx*=-0.4; clang(); } }
      if(!ball.scored && (ball.y>fy+8 || ball.x>W+40 || ball.x<-40)){ missedShot(); } }
    if(resetT>0){ resetT--; if(resetT===0){ setSpot(); ball.x=launchPt.x; ball.y=launchPt.y-18; ball.vx=0; ball.vy=0; ball.flying=false; ball.scored=false; ball.passedY=false; } }
    for(var i=conf.length-1;i>=0;i--){ var c=conf[i]; c.x+=c.vx; c.y+=c.vy; c.vy+=0.14; c.life--; if(c.life<=0)conf.splice(i,1); }
  }

  function skC(){ try{return localStorage.getItem("moSkin")||"#f6c48a";}catch(e){return "#f6c48a";} }
  function hrC(){ try{return localStorage.getItem("moHair")||"#2a2018";}catch(e){return "#2a2018";} }
  function rr(a,b,c,d,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+c,b,a+c,b+d,r); x.arcTo(a+c,b+d,a,b+d,r); x.arcTo(a,b+d,a,b,r); x.arcTo(a,b,a+c,b,r); x.closePath(); }
  function draw(){
    var sx = shake>0? (Math.random()-0.5)*shake*0.6:0;
    x.save(); x.translate(sx,0);
    // gym wall + floor
    var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#f0d8a8"); g.addColorStop(1,"#e4c088"); x.fillStyle=g; x.fillRect(-10,0,W+20,H);
    x.fillStyle="#1a6fd0"; x.fillRect(-10,H*0.10,W+20,H*0.06); x.fillStyle="#fff"; x.font="bold "+Math.round(H*0.045)+"px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("MO SPORTS", W/2, H*0.13);
    x.fillStyle="#c88a4a"; x.fillRect(-10,fy,W+20,H-fy); x.fillStyle="#b87a3a"; x.fillRect(-10,fy,W+20,6);
    // three-point arc
    x.strokeStyle="#f2e6c8"; x.lineWidth=4; x.beginPath(); x.arc(W*0.92, fy+(H-fy)*0.3, W*0.64, Math.PI*0.72, Math.PI*1.28); x.stroke();
    // hoop
    x.strokeStyle="#cfd6e4"; x.lineWidth=7; x.beginPath(); x.moveTo(hoop.x+hoop.r*1.5,hoop.y-hoop.r*1.2); x.lineTo(hoop.x+hoop.r*1.9,fy); x.stroke();
    x.fillStyle="#eef2fb"; rr(hoop.x+hoop.r*0.8,hoop.y-hoop.r*1.3,hoop.r*0.9,hoop.r*1.6,4); x.fill(); x.strokeStyle="#c23"; x.lineWidth=3; x.strokeRect(hoop.x+hoop.r*1.0,hoop.y-hoop.r*0.6,hoop.r*0.5,hoop.r*0.5);
    x.strokeStyle="#ff7a2a"; x.lineWidth=5; x.beginPath(); x.ellipse(hoop.x,hoop.y,hoop.r*0.7,hoop.r*0.22,0,0,7); x.stroke();
    x.strokeStyle="#ffffffcc"; x.lineWidth=1.5; for(var n=0;n<7;n++){ var a3=-hoop.r*0.6+n*hoop.r*0.2; x.beginPath(); x.moveTo(hoop.x+a3,hoop.y); x.lineTo(hoop.x+a3*0.5,hoop.y+hoop.r*0.9); x.stroke(); }
    // spot marker
    if(mode==="play"){ var sp=SPOTS[Math.min(idx,SPOTS.length-1)]; x.fillStyle="#ffffff55"; x.beginPath(); x.ellipse(launchPt.x, fy+4, hoop.r*0.8, hoop.r*0.22,0,0,7); x.fill(); }
    // Mo
    drawMo(launchPt.x, launchPt.y);
    // ideal-arc guide (faint) + POWER METER
    if(mode==="play" && !ball.flying && resetT<=0){
      var v=computeIdeal(); var tx=ball.x,ty=ball.y,tvx=v.vx,tvy=v.vy;
      x.fillStyle="#fff"; for(var s2=0;s2<70;s2++){ tx+=tvx; ty+=tvy; tvy+=GRAV; if(s2%4===0){ x.globalAlpha=Math.max(0.08,0.4-s2/120); x.beginPath(); x.arc(tx,ty,2.5,0,7); x.fill(); } if(ty>H)break; } x.globalAlpha=1;
      var mx=20, mtop=H*0.42, mh=H*0.38, mw=20;
      x.fillStyle="#000a"; rr(mx-3,mtop-3,mw+6,mh+6,8); x.fill();
      x.fillStyle="#2a2a3a"; rr(mx,mtop,mw,mh,5); x.fill();
      var zy1=mtop+mh*(1-ZHI), zy0=mtop+mh*(1-ZLO); x.fillStyle="#3fd06a"; rr(mx,zy1,mw,zy0-zy1,3); x.fill();
      var iy=mtop+mh*(1-meter); if(charging){ x.fillStyle="#ffd24a"; rr(mx,iy,mw,mtop+mh-iy,3); x.fill(); x.fillStyle="#fff"; x.fillRect(mx-4,iy-2,mw+8,4); }
      x.fillStyle="#fff"; x.font="bold 12px Trebuchet MS"; x.textAlign="center"; x.textBaseline="bottom"; x.fillText("POWER", mx+mw/2, mtop-6);
      if(!charging){ x.fillStyle="#ffd24a"; x.font="bold 13px Trebuchet MS"; x.textBaseline="top"; x.fillText("hold!", mx+mw/2, mtop+mh+6); }
    }
    // ball
    if(!(resetT>0 && !ball.flying)) drawBall(ball.x,ball.y,ball.r);
    // confetti
    for(var i2=0;i2<conf.length;i2++){ var c=conf[i2]; x.fillStyle=c.c; x.fillRect(c.x,c.y,5,5); }
    x.restore();
    // HUD
    if(mode==="play"){ var sp2=SPOTS[Math.min(idx,SPOTS.length-1)];
      x.fillStyle="#000a"; rr(10,8,W-20,34,10); x.fill();
      x.fillStyle="#ffd24a"; x.font="bold 17px Trebuchet MS"; x.textAlign="left"; x.textBaseline="middle"; x.fillText("🎯 "+sp2.n+"  ("+sp2.p+" pts)", 18, 25);
      x.textAlign="right"; x.fillStyle="#fff"; x.fillText("Score "+score+"   "+ "🏀".repeat(lives), W-18, 25);
      if(cheerT>40){ x.fillStyle="#ffcf5a"; x.font="bold 30px Trebuchet MS"; x.textAlign="center"; x.strokeStyle="#000"; x.lineWidth=5; x.strokeText("SWISH! 🎉",W/2,H*0.5); x.fillText("SWISH! 🎉",W/2,H*0.5); } }
  }
  function drawMo(cx,cy){ var s=Math.max(24,W*0.065), skin=skC(), hair=hrC();
    x.fillStyle="#243a66"; x.fillRect(cx-s*0.3,cy,s*0.26,s*0.7); x.fillRect(cx+s*0.04,cy,s*0.26,s*0.7);
    x.fillStyle="#e8542a"; rr(cx-s*0.42,cy-s*0.7,s*0.84,s*0.8,8); x.fill();
    x.fillStyle="#fff"; x.font="bold "+Math.round(s*0.3)+"px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("MO",cx,cy-s*0.3);
    x.fillStyle="#d84a1e"; x.fillRect(cx+s*0.4,cy-s*0.9,s*0.16,s*0.5);
    x.fillStyle=skin; x.beginPath(); x.arc(cx,cy-s*0.95,s*0.3,0,7); x.fill();
    x.fillStyle=hair; x.beginPath(); x.arc(cx,cy-s*1.02,s*0.3,Math.PI*1.03,Math.PI*1.97); x.fill();
    x.fillStyle="#201008"; x.beginPath(); x.arc(cx-s*0.1,cy-s*0.95,s*0.045,0,7); x.arc(cx+s*0.1,cy-s*0.95,s*0.045,0,7); x.fill();
    x.strokeStyle="#201008"; x.lineWidth=2; x.beginPath(); x.arc(cx,cy-s*0.88,s*0.1,0.15*Math.PI,0.85*Math.PI); x.stroke();
  }
  function drawBall(cx,cy,r){ x.fillStyle="#e8812a"; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); x.strokeStyle="#7a3a10"; x.lineWidth=2; x.beginPath(); x.arc(cx,cy,r,0,7); x.moveTo(cx-r,cy); x.lineTo(cx+r,cy); x.moveTo(cx,cy-r); x.lineTo(cx,cy+r); x.stroke(); }

  function frame(){ requestAnimationFrame(frame); if(mode==="play")update(); draw(); }
  resize(); requestAnimationFrame(frame);

  window._T={ get:function(){ return {mode:mode, idx:idx, spot:SPOTS[Math.min(idx,SPOTS.length-1)].n, score:score, lives:lives, meter:meter, flying:ball?ball.flying:false }; },
    shootPower:function(p){ if(ball.flying||resetT>0)return; shootPower(p); } };
})();
</script>
</body>
</html>
