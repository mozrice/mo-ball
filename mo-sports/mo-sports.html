<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MO SPORTS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#2a6cf0,#1a3f8a 60%,#102a5a);font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;}
  body{display:flex;flex-direction:column;align-items:center;padding:16px 16px 40px;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000044;padding:6px 10px;border-radius:10px;}
  h1{font-size:34px;margin:40px 0 2px;color:#ffd24a;text-align:center;text-shadow:0 2px 6px #0006;}
  .sub{color:#dbe7ff;font-weight:bold;margin:0 0 12px;text-align:center;}
  .look{background:#ffffff1f;border:3px solid #ffffff55;border-radius:16px;padding:10px 14px;margin:6px 0 16px;text-align:center;max-width:420px;width:100%;}
  .look b{color:#ffd24a;}
  .swrow{display:flex;gap:9px;justify-content:center;margin:6px 0;flex-wrap:wrap;}
  .sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 5px #0004;}
  .sw.on{border-color:#ffd24a;transform:scale(1.14);}
  .sports{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:460px;}
  a.sport{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#13306a;
    background:linear-gradient(#ffffff,#dfeaff);border:3px solid #ffffff;border-radius:20px;padding:20px 10px;box-shadow:0 6px 14px #0003;min-height:120px;}
  a.sport:active{transform:translateY(3px);}
  a.sport .emo{font-size:46px;}
  a.sport .nm{font-weight:900;font-size:18px;}
  a.sport .ds{font-size:12px;color:#4a5a7a;text-align:center;}
  a.sport.soon{opacity:.62;filter:grayscale(.3);}
  .foot{margin-top:18px;color:#cfe0ff;font-size:13px;text-align:center;}
</style>
</head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<h1>🏀 MO SPORTS</h1>
<p class="sub">Jesser-style hoops challenges — go for the high score!</p>

<div class="look">
  <b>🎨 MO LOOK — pick skin &amp; hair</b>
  <div class="swrow" id="skinPick"></div>
  <div class="swrow" id="hairPick"></div>
</div>

<div class="sports">
  <a class="sport" href="mo-sports-trickshots.html"><span class="emo">🎯</span><span class="nm">Trick Shots</span><span class="ds">Wild spots, harder each round</span></a>
  <a class="sport" href="mo-sports-lasttomiss.html"><span class="emo">🔥</span><span class="nm">Last to Miss</span><span class="ds">How long a streak?</span></a>
  <a class="sport soon" href="#"><span class="emo">🎡</span><span class="nm">Spin the Wheel</span><span class="ds">Random shot — soon!</span></a>
  <a class="sport soon" href="#"><span class="emo">🆚</span><span class="nm">1-on-1</span><span class="ds">vs Coach Mo — soon!</span></a>
</div>

<p class="foot">More challenges coming — pick one to play 🏆</p>

<script>
(function(){
  var SKINS=["#f6c48a","#eab98c","#d99a6c","#b97a4e","#8a5a34","#5e3a1e"];
  var HAIRS=["#2a2018","#4a2a10","#6a4a1a","#101010","#8a5a2a","#caa23a"];
  var moSkin, moHair;
  try{ moSkin=localStorage.getItem("moSkin")||SKINS[0]; moHair=localStorage.getItem("moHair")||HAIRS[0]; }catch(e){ moSkin=SKINS[0]; moHair=HAIRS[0]; }
  function save(){ try{ localStorage.setItem("moSkin",moSkin); localStorage.setItem("moHair",moHair); }catch(e){} }
  var sp=document.getElementById("skinPick"), hp=document.getElementById("hairPick");
  SKINS.forEach(function(c){ var d=document.createElement("div"); d.className="sw"+(c===moSkin?" on":""); d.style.background=c;
    d.onclick=function(){ moSkin=c; save(); Array.prototype.forEach.call(sp.children,function(e){e.classList.remove("on");}); d.classList.add("on"); }; sp.appendChild(d); });
  HAIRS.forEach(function(c){ var d=document.createElement("div"); d.className="sw"+(c===moHair?" on":""); d.style.background=c;
    d.onclick=function(){ moHair=c; save(); Array.prototype.forEach.call(hp.children,function(e){e.classList.remove("on");}); d.classList.add("on"); }; hp.appendChild(d); });
  Array.prototype.forEach.call(document.querySelectorAll("a.sport.soon"),function(a){ a.addEventListener("click",function(e){ e.preventDefault(); }); });
})();
</script>
</body>
</html>
