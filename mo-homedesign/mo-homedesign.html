<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#241a33;color:#f4eefb;font-family:'Trebuchet MS',Verdana,sans-serif;overflow:hidden;}
  #wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:8px;}
  .namebtn{display:block;margin:6px auto 2px;background:linear-gradient(#c9a6ff,#8a63e0);color:#2a1650;font-weight:bold;border:none;border-radius:14px;padding:9px 22px;font-size:16px;font-family:inherit;box-shadow:0 4px 0 #0006;text-decoration:none;}

<body>

    <a class="nb" href="../mo-home.html">🏠 MO Home</a>

  </div>
</div>
<script>
(function(){
  var cv=document.getElementById("cv"), cx=cv.getContext("2d"), steps=document.getElementById("steps");
  var W=cv.width, H=cv.height, t=0;
  var scene="menu", g={}, ptr={x:W/2,y:0,down:false};
  var coins=0; try{ coins=parseInt(localStorage.getItem("mohd_coins")||"0",10)||0; }catch(e){}
  function saveC(){ try{ localStorage.setItem("mohd_coins",String(coins)); }catch(e){} }
  var stars=8; try{ var _sv=localStorage.getItem("mohd_starbank"); if(_sv==null){ stars=8; localStorage.setItem("mohd_starbank","8"); } else stars=parseInt(_sv,10)||0; }catch(e){ stars=8; }
  function saveStars(){ try{ localStorage.setItem("mohd_starbank",String(stars)); }catch(e){} }

  // ---- helpers ----
  var AC=null; function beep(f,d,ty){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),ga=AC.createGain(); o.frequency.value=f;o.type=ty||"square";o.connect(ga);ga.connect(AC.destination);ga.gain.value=.05;o.start();ga.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08)); }catch(e){} }
  function ding(){ beep(760,.06,"sine"); setTimeout(function(){beep(1040,.09,"sine");},60); }
  function pop(){ beep(560,.05,"sine"); }
  function kaching(){ beep(880,.06,"sine"); setTimeout(function(){beep(1180,.1,"sine");},70); }
  function rr(x,y,w,h,r){ cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath(); }
  function text(s,x,y,sz,c,al){ cx.fillStyle=c||"#fff";cx.font="bold "+sz+"px Trebuchet MS,sans-serif";cx.textAlign=al||"center";cx.textBaseline="middle";cx.fillText(s,x,y); }
  function emo(ch,x,y,s){ cx.font=s+"px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(ch,x,y); }
  function label(s){ steps.textContent=s; }
  function shade(hex,f){ var n=parseInt(hex.slice(1),16); var r=(n>>16)&255,gg=(n>>8)&255,b=n&255; r=Math.max(0,Math.min(255,Math.round(r*(1+f)))); gg=Math.max(0,Math.min(255,Math.round(gg*(1+f)))); b=Math.max(0,Math.min(255,Math.round(b*(1+f)))); return "rgb("+r+","+gg+","+b+")"; }

  var FX=[],CONF=[];
  function star(x,y,n){ n=n||6; for(var i=0;i<n;i++){ var a=Math.random()*6.28,s=1.2+Math.random()*2; FX.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c:"#ffe27a",r:2+Math.random()*2}); } }
  function dust(x,y){ for(var i=0;i<12;i++){ var a=Math.random()*6.28,s=1+Math.random()*2.8; FX.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,life:1,c:["#8a7a5a","#b0a088","#6a5a44","#9a8a6a","#7a6a4a"][i%5],r:2+Math.random()*3}); } }
  function thud(){ beep(90,.12,"sawtooth"); setTimeout(function(){beep(60,.1,"square");},50); }
  function confetti(){ for(var i=0;i<26;i++){ CONF.push({x:Math.random()*W,y:-10,vy:1.6+Math.random()*2.2,vx:Math.random()*2-1,r:3+Math.random()*4,c:["#ff5a7a","#ffd23f","#5ad0a0","#5aa0ff","#c77aff"][i%5],rot:0,vr:Math.random()*.3-.15}); } }
  function updFX(){ for(var i=FX.length-1;i>=0;i--){ var p=FX[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.03; if(p.life<=0)FX.splice(i,1);} for(var k=CONF.length-1;k>=0;k--){var c=CONF[k];c.y+=c.vy;c.x+=c.vx;c.rot+=c.vr;if(c.y>H+20)CONF.splice(k,1);} }
  function renFX(){ FX.forEach(function(p){ cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,Math.max(.5,p.r*p.life),0,7); cx.fill(); }); cx.globalAlpha=1; CONF.forEach(function(c){ cx.save(); cx.translate(c.x,c.y); cx.rotate(c.rot); cx.fillStyle=c.c; cx.fillRect(-c.r/2,-c.r/2,c.r,c.r*1.6); cx.restore(); }); }

  function drawArff(x,y,s){ cx.save(); cx.translate(x,y); cx.scale(s||1,s||1); var wag=Math.sin(t*0.25)*4;
    cx.strokeStyle="#8a5a2f"; cx.lineWidth=4; cx.lineCap="round"; cx.beginPath(); cx.moveTo(-18,-2); cx.lineTo(-28,-8+wag); cx.stroke();
    cx.fillStyle="#a56a34"; [-10,-2,8,14].forEach(function(lx){ cx.fillRect(lx,6,5,12); });
    cx.fillStyle="#b5793f"; rr(-20,-12,34,20,10); cx.fill(); cx.beginPath(); cx.arc(16,-12,11,0,7); cx.fill();
    cx.fillStyle="#c98a52"; cx.beginPath(); cx.ellipse(23,-10,6,5,0,0,7); cx.fill();
    cx.fillStyle="#8a5a2f"; cx.beginPath(); cx.ellipse(11,-21,5,8,-.4,0,7); cx.fill();
    cx.fillStyle="#222"; cx.beginPath(); cx.arc(19,-14,1.8,0,7); cx.fill(); cx.fillStyle="#2a1a10"; cx.beginPath(); cx.arc(28,-11,2.6,0,7); cx.fill();
    cx.restore(); }
  function drawMeow(x,y,s){ cx.save(); cx.translate(x,y); cx.scale(s||1,s||1); var tail=Math.sin(t*0.2)*5;
    cx.strokeStyle="#c99a2a"; cx.lineWidth=3; cx.lineCap="round"; cx.beginPath(); cx.moveTo(-13,0); cx.quadraticCurveTo(-24,-4,-20,-14+tail); cx.stroke();
    cx.fillStyle="#e0b84a"; [-7,5].forEach(function(lx){ cx.fillRect(lx,4,4,8); });
    cx.fillStyle="#f2c94c"; rr(-15,-10,26,14,7); cx.fill(); cx.beginPath(); cx.arc(12,-10,8,0,7); cx.fill();
    cx.fillStyle="#c99a2a"; cx.beginPath(); cx.moveTo(6,-16); cx.lineTo(9,-24); cx.lineTo(12,-16); cx.closePath(); cx.fill(); cx.beginPath(); cx.moveTo(14,-16); cx.lineTo(17,-24); cx.lineTo(19,-16); cx.closePath(); cx.fill();
    cx.fillStyle="#2a2a30"; cx.beginPath(); cx.arc(11,-11,1.4,0,7); cx.arc(16,-11,1.4,0,7); cx.fill(); cx.fillStyle="#e88"; cx.beginPath(); cx.arc(13.5,-8,1.2,0,7); cx.fill();
    cx.restore(); }

  // ---- real-looking people ----
  var PEOPLE={
    dad:  {skin:"#f0c39a",hair:"#3a2a1a",shirt:"#3a7bd0",pants:"#2a3a55",h:1.15,hairstyle:"short"},
    mom:  {skin:"#f2c9a0",hair:"#6a4a2a",shirt:"#e06a9a",pants:"#7a4aa0",h:1.08,hairstyle:"pony"},
    boy:  {skin:"#f0c39a",hair:"#4a3320",shirt:"#5ab05a",pants:"#3a4a6a",h:0.86,hairstyle:"cap"},
    girl: {skin:"#f6cfa8",hair:"#5a3a1a",shirt:"#c77ad0",pants:"#c77ad0",h:0.84,hairstyle:"pig",dress:true},
    baby: {skin:"#f8d4b0",hair:"#8a6a44",shirt:"#ffd23f",pants:"#ffd23f",h:0.62,hairstyle:"curl"},
    gma:  {skin:"#f0cfae",hair:"#dcdce0",shirt:"#8ac0d0",pants:"#5a6a7a",h:1.0,hairstyle:"bun",glasses:true},
    gpa:  {skin:"#eec6a2",hair:"#dcdce0",shirt:"#c0a060",pants:"#5a5a5a",h:1.05,hairstyle:"bald",glasses:true}
  };
  function drawPerson(x,y,s,type){ var P=PEOPLE[type]||PEOPLE.dad; s=(s||1)*P.h; cx.save(); cx.translate(x,y); cx.scale(s,s);
    cx.fillStyle="rgba(0,0,0,.16)"; cx.beginPath(); cx.ellipse(0,20,13,5,0,0,7); cx.fill();
    var sw=Math.sin(t*0.12+x)*2;
    // legs
    cx.strokeStyle=P.pants; cx.lineWidth=5; cx.lineCap="round";
    if(!P.dress){ cx.beginPath(); cx.moveTo(-4,8); cx.lineTo(-4+sw,20); cx.moveTo(4,8); cx.lineTo(4-sw,20); cx.stroke(); }
    // body
    if(P.dress){ cx.fillStyle=P.shirt; cx.beginPath(); cx.moveTo(-6,-10); cx.lineTo(6,-10); cx.lineTo(12,18); cx.lineTo(-12,18); cx.closePath(); cx.fill(); }
    else { cx.fillStyle=P.shirt; rr(-9,-11,18,21,5); cx.fill(); }
    // arms
    cx.strokeStyle=P.shirt; cx.lineWidth=4; cx.beginPath(); cx.moveTo(-8,-6); cx.lineTo(-12,4); cx.moveTo(8,-6); cx.lineTo(12,4); cx.stroke();
    cx.fillStyle=P.skin; cx.beginPath(); cx.arc(-12,5,2,0,7); cx.arc(12,5,2,0,7); cx.fill();
    // head
    cx.fillStyle=P.skin; cx.beginPath(); cx.arc(0,-20,8.5,0,7); cx.fill();
    // hair
    cx.fillStyle=P.hair;
    if(P.hairstyle==="short"){ cx.beginPath(); cx.arc(0,-23,8.5,Math.PI,2*Math.PI); cx.fill(); cx.fillRect(-8.5,-23,17,3); }
    else if(P.hairstyle==="pony"){ cx.beginPath(); cx.arc(0,-23,9,Math.PI,2*Math.PI); cx.fill(); cx.fillRect(-9,-23,18,4); cx.beginPath(); cx.ellipse(9,-16,3,7,0,0,7); cx.fill(); }
    else if(P.hairstyle==="cap"){ cx.fillStyle="#e04a4a"; cx.beginPath(); cx.arc(0,-23,9,Math.PI,2*Math.PI); cx.fill(); cx.fillRect(0,-24,12,3); }
    else if(P.hairstyle==="pig"){ cx.beginPath(); cx.arc(0,-23,9,Math.PI,2*Math.PI); cx.fill(); cx.fillRect(-9,-23,18,4); cx.beginPath(); cx.arc(-10,-18,4,0,7); cx.arc(10,-18,4,0,7); cx.fill(); }
    else if(P.hairstyle==="curl"){ cx.beginPath(); cx.arc(0,-26,3,0,7); cx.fill(); }
    else if(P.hairstyle==="bun"){ cx.beginPath(); cx.arc(0,-24,8.5,Math.PI,2*Math.PI); cx.fill(); cx.beginPath(); cx.arc(0,-29,4,0,7); cx.fill(); }
    else if(P.hairstyle==="bald"){ cx.beginPath(); cx.arc(0,-24,8.5,Math.PI*1.15,2*Math.PI-0.5); cx.fill(); }
    // glasses
    if(P.glasses){ cx.strokeStyle="#333"; cx.lineWidth=1; cx.beginPath(); cx.arc(-3,-20,2.4,0,7); cx.arc(3,-20,2.4,0,7); cx.moveTo(-0.6,-20); cx.lineTo(0.6,-20); cx.stroke(); }
    // face
    cx.fillStyle="#3a2a1a"; cx.beginPath(); cx.arc(-3,-20,1.1,0,7); cx.arc(3,-20,1.1,0,7); cx.fill();
    cx.strokeStyle="#c0806a"; cx.lineWidth=1; cx.beginPath(); cx.arc(0,-17,2.4,0.15*Math.PI,0.85*Math.PI); cx.stroke();
    cx.restore(); }

  // ---- data ----
  var WALLS=["#f0e0c8","#cfe3f0","#f0d0dc","#d8ecd0","#e6dcf0","#f6ecc4"];
  var FLOORS=["#b98a5a","#c9a06a","#9aa0a6","#d8c9a8","#8a6a44","#8fae74"];
  var ROOMS=[
    {k:"living",n:"Living Room",e:"🛋️",wall:0,floor:1},
    {k:"bed",n:"Bedroom",e:"🛏️",wall:2,floor:3},
    {k:"kitchen",n:"Kitchen",e:"🍽️",wall:5,floor:2},
    {k:"bath",n:"Bathroom",e:"🛁",wall:1,floor:2},
    {k:"kids",n:"Kids Room",e:"🧸",wall:4,floor:5},
    {k:"yard",n:"Backyard",e:"🌳",wall:1,floor:5}
  ];
  var CATS=[
    {n:"🛋️ Furniture", items:[["🛋️","Sofa",34],["🪑","Chair",28],["🛏️","Bed",38],["🚪","Door",32],["🪞","Mirror",28],["🗄️","Cabinet",30],["📺","TV",30],["🪑","Stool",22],["🛗","Closet",30],["🚽","Toilet",26],["🛁","Bathtub",34],["🚿","Shower",28],["🧊","Fridge",30],["🪟","Window",28]]},
    {n:"🖼️ Decor", items:[["🖼️","Painting",28],["🪴","Plant",28],["🕯️","Candle",22],["🧸","Teddy",26],["🎈","Balloon",26],["🏺","Vase",26],["🕰️","Clock",26],["📚","Books",26],["🪆","Doll",22],["🎀","Bow",22],["🖥️","Computer",26],["🎸","Guitar",28]]},
    {n:"🍽️ Kitchen", items:[["🍽️","Plates",24],["🥘","Pot",26],["☕","Coffee",22],["🧑‍🍳","Chef",28],["🍞","Bread",22],["🧁","Cupcake",22],["🍎","Fruit",22],["🫖","Kettle",24],["🍕","Pizza",24],["🥗","Salad",22]]},
    {n:"🟫 Rugs", items:[["🟫","Brown Rug",44],["🟦","Blue Rug",44],["🟩","Green Rug",44],["🟥","Red Rug",44],["🟪","Purple Rug",44],["⬜","White Tile",44],["🟨","Yellow Rug",44]]},
    {n:"👨‍👩‍👧 Family", items:[["P:dad","Dad",1],["P:mom","Mom",1],["P:boy","Boy",1],["P:girl","Girl",1],["P:baby","Baby",1],["P:gma","Grandma",1],["P:gpa","Grandpa",1],["🐕","Arff",1],["🐈","Meow",1]]},
    {n:"💡 Lights", items:[["💡","Bulb",24],["🔦","Lamp",24],["🪩","Disco",28],["🏮","Lantern",26],["✨","Sparkle",24],["🕯️","Candle",22],["🪔","Oil Lamp",24]]}
  ];
  var LIGHTSET={"💡":1,"🔦":1,"🪩":1,"🏮":1,"✨":1,"🕯️":1,"🪔":1};
  function itemSp(it){ return !!(it.e&&(it.e.indexOf("P:")===0||it.e==="🐕"||it.e==="🐈")); }
  var SIZES=[1,1.8,2.7], SIZEN=["Small","BIG","HUGE"];

  var ROOM_TOP=90, ROOM_BOT=H-168;
  var PANY=H-160;
  var pendRoom="living", pendName="Living Room", pendWall=0, pendFloor=1;

  function saveDesign(){ try{ localStorage.setItem("mohd_room_"+g.room, JSON.stringify({items:g.items,wall:g.wall,floor:g.floor,night:g.night})); }catch(e){} }
  function loadDesign(room){ try{ var d=JSON.parse(localStorage.getItem("mohd_room_"+room)); if(d)return d; }catch(e){} return null; }

  function go(name){ FX=[]; CONF=[]; scene=name; if(S[name].init)S[name].init(); }
  var S={};

  // ---- design GOALS (like a real home-makeover game) ----
  function hasCat(cn){ var cat=null; for(var c=0;c<CATS.length;c++) if(CATS[c].n===cn)cat=CATS[c]; if(!cat)return false; for(var i=0;i<g.items.length;i++){ for(var k=0;k<cat.items.length;k++){ if(cat.items[k][0]===g.items[i].e)return true; } } return false; }
  var GOALS=[
    {e:"🛋️",t:"Add some furniture", f:function(){return hasCat("🛋️ Furniture");}},
    {e:"🖼️",t:"Add a plant or decoration", f:function(){return hasCat("🖼️ Decor");}},
    {e:"🟫",t:"Lay down a rug", f:function(){return hasCat("🟫 Rugs");}},
    {e:"💡",t:"Add a light", f:function(){return hasCat("💡 Lights");}},
    {e:"👨",t:"Add family or a pet", f:function(){return hasCat("👨‍👩‍👧 Family");}},
    {e:"🎨",t:"Change the wall color", f:function(){return g.wall!==g.wall0;}},
    {e:"🛒",t:"Place 8 things total", f:function(){return g.items.length>=8;}}
  ];
  function goalsDone(){ var n=0; for(var i=0;i<GOALS.length;i++)if(GOALS[i].f())n++; return n; }
  function starsFor(){ var it=g.items.length; return it>=14?3:(it>=10?2:1); }
  function drawMiniRoom(x,y,w,h,dirty,items,wall,floor){ cx.save(); rr(x,y,w,h,6); cx.clip();
    var mid=y+h*0.52;
    cx.fillStyle=dirty?shade(WALLS[wall],-0.35):WALLS[wall]; cx.fillRect(x,y,w,mid-y);
    cx.fillStyle=dirty?shade(FLOORS[floor],-0.35):FLOORS[floor]; cx.fillRect(x,mid,w,y+h-mid);
    if(dirty){ cx.fillStyle="rgba(70,55,30,.4)"; cx.fillRect(x,y,w,h); emo("🕸️",x+13,y+13,15); emo("🗑️",x+w*0.55,y+h*0.72,16); emo("🕳️",x+w*0.76,y+h*0.82,13); emo("🕷️",x+w*0.4,y+16,12); cx.strokeStyle="#2a2016"; cx.lineWidth=2; cx.beginPath(); cx.moveTo(x+w*0.28,y+9); cx.lineTo(x+w*0.33,y+25); cx.lineTo(x+w*0.26,y+40); cx.stroke(); }
    else { if(items){ for(var i=0;i<items.length;i++){ var it=items[i]; var ix=x+Math.max(7,Math.min(w-7,(it.x/W)*w)); var iy=y+Math.max(7,Math.min(h-7,((it.y-ROOM_TOP)/(ROOM_BOT-ROOM_TOP))*h)); var e=it.e; if(e&&e.indexOf("P:")===0)emo("🧍",ix,iy,13); else if(e==="🐕")emo("🐕",ix,iy,12); else if(e==="🐈")emo("🐈",ix,iy,12); else emo(e,ix,iy,Math.min(16,(it.base||it.s||18)*0.55)); } } emo("✨",x+w-13,y+13,14); }
    cx.restore(); cx.strokeStyle="#fff"; cx.lineWidth=2; rr(x,y,w,h,6); cx.stroke(); }

  // ---------------- MENU ----------------
  S.menu={ init:function(){ label("Pick a room to design! 🏠"); },
    render:function(){
      var gr=cx.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#e8dcff"); gr.addColorStop(1,"#f6eefc"); cx.fillStyle=gr; cx.fillRect(0,0,W,H);
      text("🏠 MO HOME DESIGN",W/2,42,24,"#6a3ac0");
      text("Pick a room to decorate!",W/2,72,14,"#7a5aa0");
      // room cards 2 cols x 3
      for(var i=0;i<ROOMS.length;i++){ var col=i%2, row=Math.floor(i/2); var bx=30+col*(W/2-8), by=100+row*150, bw=W/2-38, bh=134;
        var has=loadDesign(ROOMS[i].k);
        cx.fillStyle="#fff"; rr(bx,by,bw,bh,16); cx.fill(); cx.strokeStyle="#c9a6ff"; cx.lineWidth=3; rr(bx,by,bw,bh,16); cx.stroke();
        // mini preview
        cx.fillStyle=WALLS[ROOMS[i].wall]; rr(bx+10,by+10,bw-20,bh-52,10); cx.fill();
        cx.fillStyle=FLOORS[ROOMS[i].floor]; cx.fillRect(bx+10,by+bh-72,bw-20,30);
        emo(ROOMS[i].e,bx+bw/2,by+40,40);
        var st=0; try{st=parseInt(localStorage.getItem("mohd_stars_"+ROOMS[i].k)||"0",10)||0;}catch(e){}
        if(st>0){ for(var sr=0;sr<3;sr++)emo(sr<st?"⭐":"☆",bx+bw/2-16+sr*16,by+bh-40,14); }
        if(has&&has.items&&has.items.length){ for(var q=0;q<Math.min(has.items.length,5);q++){ var it=has.items[q]; if(it.e&&it.e!=="🐕"&&it.e!=="🐈"&&it.e.indexOf("P:")!==0)emo(it.e,bx+20+q*((bw-40)/5),by+bh-58,16); } }

      if(g.goalsOpen){ var pw=284,px=W/2-pw/2,py=104; if(!(ptr.x>px&&ptr.x<px+pw&&ptr.y>py&&ptr.y<py+302)){ g.goalsOpen=false; } else if(ptr.x>px+pw-40&&ptr.y<py+42){ g.goalsOpen=false; } return; }
      // goals strip
      if(ptr.y>=68&&ptr.y<=88){ g.goalsOpen=true; pop(); return; }
      // palette panel
      if(ptr.y>=PANY){
        var tabW=(W-16)/CATS.length;
        if(ptr.y<PANY+28){ var c=Math.floor((ptr.x-8)/tabW); if(c>=0&&c<CATS.length){ g.cat=c; g.pick=-1; pop(); } return; }
        if(ptr.y>=PANY+30&&ptr.y<=PANY+55&&ptr.x>W/2-84&&ptr.x<W/2+84){ g.sizeIdx=(g.sizeIdx+1)%SIZES.length; g.placeScale=SIZES[g.sizeIdx]; if(g.sel>=0){ g.items[g.sel].scale=g.placeScale; g.items[g.sel].base=g.items[g.sel].base||g.items[g.sel].s; saveDesign(); } ding(); return; }
        var P=paletteRects(); var its=CATS[g.cat].items;
        for(var k=0;k<its.length;k++){ var col=k%P.cols, row=Math.floor(k/P.cols); var bx=P.gx+col*(P.cw); var byy=P.gy+row*(P.ch+4);
          if(ptr.x>bx&&ptr.x<bx+P.cw-4&&ptr.y>byy&&ptr.y<byy+P.ch){ g.pick=(g.pick===k?-1:k); pop(); return; } }
        return;
      }
      // HUD buttons row
      if(ptr.y>=38&&ptr.y<=64){
        if(ptr.x>=10&&ptr.x<68){ g.wall=(g.wall+1)%WALLS.length; saveDesign(); pop(); return; }
        if(ptr.x>=72&&ptr.x<130){ g.floor=(g.floor+1)%FLOORS.length; saveDesign(); pop(); return; }
        if(ptr.x>=134&&ptr.x<192){ g.night=!g.night; saveDesign(); ding(); return; }
        if(ptr.x>=196&&ptr.x<246){ if(g.sel>=0){ g.items.splice(g.sel,1); g.sel=-1; saveDesign(); beep(200,.08); } return; }
        if(ptr.x>=250&&ptr.x<304){ saveDesign(); go("menu"); return; }
        if(ptr.x>=308&&ptr.x<362){ pendRoom=g.room; pendName=g.roomName; pendWall=g.wall; pendFloor=g.floor; saveDesign(); go("demolish"); return; }
      }
      // resize handles on the selected item
      if(g.sel>=0){ var si=g.items[g.sel]; var sp=itemSp(si); var srad=(sp?22:(si.base||si.s||26)*0.8)*(si.scale||1); srad=Math.max(20,srad);
        var hy=si.y-(sp?si.scale*30:srad);
        if(Math.hypot(ptr.x-(si.x-srad-2),ptr.y-hy)<18){ si.scale=Math.max(0.5,(si.scale||1)/1.25); si.base=si.base||si.s; saveDesign(); pop(); return; }
        if(Math.hypot(ptr.x-(si.x+srad+2),ptr.y-hy)<18){ si.scale=Math.min(4,(si.scale||1)*1.25); si.base=si.base||si.s; saveDesign(); ding(); return; } }
      // room area
      if(ptr.y>ROOM_TOP&&ptr.y<ROOM_BOT){
        if(g.pick>=0){ var it=CATS[g.cat].items[g.pick]; var isSp=(it[0].indexOf("P:")===0||it[0]==="🐕"||it[0]==="🐈"); var obj={e:it[0], x:ptr.x, y:ptr.y, base:isSp?24:it[2], scale:g.placeScale||1}; g.items.push(obj); g.sel=g.items.length-1; coins++; saveC(); saveDesign(); ding(); star(ptr.x,ptr.y,6); return; }
        // select nearest for moving
        var best=-1,bd=1e9; for(var i=0;i<g.items.length;i++){ var it2=g.items[i]; var rr2=Math.max(30,(it2.base||it2.s||26)*(it2.scale||1)*0.9); var d=Math.hypot(it2.x-ptr.x,it2.y-ptr.y); if(d<bd&&d<rr2){bd=d;best=i;} }
        g.sel=best; if(best>=0){ g.dragging=true; pop(); } return;
      } },
    drag:function(){ if(g.dragging&&g.sel>=0&&g.pick<0){ g.items[g.sel].x=Math.max(14,Math.min(W-14,ptr.x)); g.items[g.sel].y=Math.max(ROOM_TOP+10,Math.min(ROOM_BOT-6,ptr.y)); } },
    up:function(){ if(g.dragging){ g.dragging=false; saveDesign(); } },
    tap:function(){} };

  // ---------------- input ----------------
  function pos(e){ var r=cv.getBoundingClientRect(), sx=cv.width/r.width, sy=cv.height/r.height; var cxp,cyp; if(e.touches&&e.touches[0]){ cxp=e.touches[0].clientX; cyp=e.touches[0].clientY; } else { cxp=e.clientX; cyp=e.clientY; } return {x:(cxp-r.left)*sx, y:(cyp-r.top)*sy}; }
  function down(e){ e.preventDefault(); var p=pos(e); ptr.x=p.x; ptr.y=p.y; ptr.down=true; var s=S[scene]; if(s.down)s.down(); if(s.tap)s.tap(); }
  function move(e){ e.preventDefault(); var p=pos(e); ptr.x=p.x; ptr.y=p.y; var s=S[scene]; if(ptr.down&&s.drag)s.drag(); }
  function up(e){ e.preventDefault(); ptr.down=false; var s=S[scene]; if(s.up)s.up(); }
  cv.addEventListener("mousedown",down); cv.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
  cv.addEventListener("touchstart",down,{passive:false}); cv.addEventListener("touchmove",move,{passive:false}); cv.addEventListener("touchend",up,{passive:false});
  go("menu"); (function loop(){ t++; var s=S[scene]; if(s.update)s.update(); updFX(); cx.fillStyle="#efe8f8"; cx.fillRect(0,0,W,H); s.render(); requestAnimationFrame(loop); })();
})();
</script>
