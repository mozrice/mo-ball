<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Diner</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffe6c0;font-family:'Trebuchet MS',system-ui,sans-serif;color:#222;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(120,80,40,.6);}
  #obox{background:#fff;color:#222;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#e07a2a;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#e07a2a;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="over"><div id="obox"><h1>🍔 MO Diner</h1><div id="omsg">Each customer wants a food.<br>Tap the matching food fast!</div><button id="go">OPEN</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  var FOODS=['🍔','🍟','🌭','🍕','🍦','🥤'];
  var playing=false, score=0, best=+(localStorage.getItem('moDinerBest')||0);
  var want='', timer=0, timerMax=180, t=0, flash=0, flashCol='';
  function reset(){ score=0; t=0; newOrder(); }
  function newOrder(){ want=FOODS[Math.floor(Math.random()*FOODS.length)]; timerMax=Math.max(70,180-score*2); timer=timerMax; }
  function ac(){ try{ return ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function btnRect(i){ var cols=3, cw=W*0.28, ch=W*0.28, gapx=(W-cols*cw)/(cols+1); var col=i%3, row=Math.floor(i/3); return {x:gapx+col*(cw+gapx), y:H*0.5+row*(ch+16), w:cw, h:ch}; }
  function loop(){ t++;
    x.fillStyle='#ffe6c0'; x.fillRect(0,0,W,H);
    x.fillStyle='#e0b884'; x.fillRect(0,H*0.42,W,8);
    // customer + speech
    x.save(); x.translate(W/2,H*0.24); x.fillStyle='#f4c9a0'; x.beginPath(); x.arc(0,0,34,0,7); x.fill(); x.fillStyle='#3a6ad0'; rr(-30,30,60,44,10); x.fill(); x.fillStyle='#111'; x.beginPath(); x.arc(-10,-4,4,0,7); x.arc(10,-4,4,0,7); x.fill(); x.strokeStyle='#a05a3a'; x.lineWidth=3; x.beginPath(); x.arc(0,6,10,0.15*Math.PI,0.85*Math.PI); x.stroke(); x.restore();
    // order bubble
    x.fillStyle='#fff'; x.strokeStyle='#e07a2a'; x.lineWidth=3; rr(W/2+30,H*0.12,W*0.24,W*0.18,12); x.fill(); x.stroke(); x.font=Math.round(W*0.11)+'px serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(want,W/2+30+W*0.12,H*0.12+W*0.09); x.textBaseline='alphabetic';
    x.fillStyle='#a0522a'; x.font='900 '+Math.round(W*0.045)+'px Trebuchet MS'; x.textAlign='center'; x.fillText('I want a '+want+' !',W/2,H*0.44);
    // timer bar
    if(playing){ timer--; if(timer<=0){ playing=false; over(); } }
    var frac=Math.max(0,timer/timerMax); x.fillStyle='#ddd'; x.fillRect(W*0.15,H*0.47,W*0.7,10); x.fillStyle=frac<0.3?'#e2342f':'#3a9d3a'; x.fillRect(W*0.15,H*0.47,W*0.7*frac,10);
    // food buttons
    for(var i=0;i<FOODS.length;i++){ var r=btnRect(i); x.fillStyle=(flash>0 && flashIdx===i)?flashCol:'#fff'; x.strokeStyle='#e07a2a'; x.lineWidth=3; rr(r.x,r.y,r.w,r.h,14); x.fill(); x.stroke(); x.font=Math.round(r.w*0.5)+'px serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(FOODS[i],r.x+r.w/2,r.y+r.h/2); x.textBaseline='alphabetic'; }
    if(flash>0)flash--;
    x.fillStyle='#a0522a'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='left'; x.fillText('🍽️ '+score, 14, 40);
    x.textAlign='right'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('Best '+best, W-14, 36);
    requestAnimationFrame(loop);
  }
  var flashIdx=-1;
  function over(){ beep(160,0.3); if(score>best){ best=score; try{localStorage.setItem('moDinerBest',score);}catch(e){} }
    document.getElementById('omsg').innerHTML='You served <b>'+score+'</b>!<br>Best: '+best; document.getElementById('go').textContent='OPEN AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  function rr(a,b,c,d,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+c,b,a+c,b+d,r); x.arcTo(a+c,b+d,a,b+d,r); x.arcTo(a,b+d,a,b,r); x.arcTo(a,b,a+c,b,r); x.closePath(); }
  cv.addEventListener('pointerdown',function(e){ if(!playing)return; for(var i=0;i<FOODS.length;i++){ var r=btnRect(i); if(e.clientX>r.x&&e.clientX<r.x+r.w&&e.clientY>r.y&&e.clientY<r.y+r.h){ flashIdx=i; flash=12; if(FOODS[i]===want){ score++; flashCol='#b6ffb6'; beep(1000); newOrder(); } else { flashCol='#ffb6b6'; beep(220); timer-=40; } break; } } });
  document.getElementById('over').style.display='flex'; reset(); loop();
})();
</script>
</body></html>
