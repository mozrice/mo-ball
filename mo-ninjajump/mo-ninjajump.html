<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Ninja</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1030;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(26,16,48,.72);}
  #obox{background:#fff;color:#222;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#7a3ad0;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#7a3ad0;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="over"><div id="obox"><h1>🥷 MO Ninja</h1><div id="omsg">Tap to jump (tap twice for a double jump!)<br>Leap over the blocks!</div><button id="go">RUN</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  var playing=false, score=0, best=+(localStorage.getItem('moNinjaBest')||0);
  var gy, py=0, vy=0, jumps=0, obs=[], coins=[], speed=8, t=0, run=0, bgx=0;
  function reset(){ gy=H*0.78; py=gy; vy=0; jumps=0; obs=[]; coins=[]; speed=8; score=0; t=0; }
  function ac(){ try{ return ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function ninja(cx,cy){ x.save(); x.translate(cx,cy); run+=0.3;
    x.fillStyle='#111'; x.strokeStyle='#111'; x.lineWidth=7; x.lineCap='round';
    var sw=(py<gy)?4:Math.sin(run)*8;
    x.beginPath(); x.moveTo(-4,-6); x.lineTo(-8+sw,14); x.moveTo(4,-6); x.lineTo(8-sw,14); x.stroke(); // legs
    x.fillStyle='#7a3ad0'; rr(-12,-30,24,28,8); x.fill(); // body
    x.strokeStyle='#7a3ad0'; x.beginPath(); x.moveTo(8,-22); x.lineTo(18,-14+ (py<gy?-8:Math.sin(run+2)*6)); x.stroke(); // arm
    x.fillStyle='#f4c9a0'; x.beginPath(); x.arc(0,-38,11,0,7); x.fill(); // head
    x.fillStyle='#7a3ad0'; x.fillRect(-11,-42,22,8); // headband
    x.fillStyle='#fff'; x.fillRect(-6,-40,5,3); x.fillRect(2,-40,5,3);
    x.fillStyle='#7a3ad0'; x.beginPath(); x.moveTo(-11,-40); x.lineTo(-22,-36); x.lineTo(-11,-34); x.fill(); // band tail
    x.restore(); }
  function rr(a,b,c,d,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+c,b,a+c,b+d,r); x.arcTo(a+c,b+d,a,b+d,r); x.arcTo(a,b+d,a,b,r); x.arcTo(a,b,a+c,b,r); x.closePath(); }
  function loop(){ t++;
    var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2a1a4a'); g.addColorStop(1,'#5a3a8a'); x.fillStyle=g; x.fillRect(0,0,W,H);
    // moon + buildings parallax
    x.fillStyle='#fdf0c0'; x.beginPath(); x.arc(W*0.8,H*0.2,W*0.07,0,7); x.fill();
    bgx=(bgx+ (playing?2:0))% (W*0.3); x.fillStyle='#2a1a4a'; for(var b=-1;b<5;b++){ var bx=b*W*0.3-bgx; x.fillRect(bx,gy-H*0.22,W*0.16,H*0.22); }
    // ground
    x.fillStyle='#1a1030'; x.fillRect(0,gy+20,W,H); x.strokeStyle='#7a3ad0'; x.lineWidth=4; x.beginPath(); x.moveTo(0,gy+20); x.lineTo(W,gy+20); x.stroke();
    var cx=W*0.24;
    if(playing){ if(t%Math.max(40,90-Math.floor(score/50))===0)obs.push({x:W+40,w:26+Math.random()*22,h:34+Math.random()*40}); if(t%70===35)coins.push({x:W+30,y:gy-60-Math.random()*90}); if(t%240===0)speed+=0.5; }
    // physics
    vy+=1.3; py+=vy; if(py>=gy){ py=gy; vy=0; jumps=0; }
    // obstacles
    for(var i=obs.length-1;i>=0;i--){ var o=obs[i]; o.x-=speed; x.fillStyle='#e2342f'; rr(o.x,gy-o.h,o.w,o.h,4); x.fill(); x.fillStyle='#a01820'; rr(o.x,gy-o.h,o.w,6,3); x.fill();
      if(playing && cx+12>o.x && cx-12<o.x+o.w && py>gy-o.h+4){ playing=false; over(); } if(o.x<-50)obs.splice(i,1); }
    // coins
    for(var j=coins.length-1;j>=0;j--){ var c=coins[j]; c.x-=speed; x.fillStyle='#f2c800'; x.strokeStyle='#c89a00'; x.lineWidth=3; x.beginPath(); x.arc(c.x,c.y,12,0,7); x.fill(); x.stroke();
      if(Math.hypot(c.x-cx,c.y-(py-20))<26){ score+=5; beep(1000); coins.splice(j,1); continue; } if(c.x<-30)coins.splice(j,1); }
    ninja(cx,py);
    x.fillStyle='#fff'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='left'; x.fillText('🥷 '+score, 14, 40);
    x.textAlign='right'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('Best '+best, W-14, 36);
    if(playing)score++;
    requestAnimationFrame(loop);
  }
  function over(){ beep(180,0.3); if(score>best){ best=score; try{localStorage.setItem('moNinjaBest',score);}catch(e){} }
    document.getElementById('omsg').innerHTML='You scored <b>'+score+'</b>!<br>Best: '+best; document.getElementById('go').textContent='RUN AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  function jump(){ if(!playing)return; if(jumps<2){ vy=-19; jumps++; beep(700); } }
  cv.addEventListener('pointerdown',function(){ jump(); }); addEventListener('keydown',function(e){ if(e.key===' '||e.key==='ArrowUp')jump(); });
  document.getElementById('over').style.display='flex'; loop();
})();
</script>
</body></html>
