<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎾 Mo Tennis</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0f1b26;color:#eaf2f7;font-family:'Trebuchet MS',Verdana,sans-serif;overflow:hidden;}
  #wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px;}
  .namebtn{display:block;margin:6px auto 4px;background:linear-gradient(#ffd23f,#f7a72b);color:#5a3a1a;font-weight:bold;border:none;border-radius:14px;padding:9px 22px;font-size:17px;font-family:inherit;box-shadow:0 4px 0 #0006;text-decoration:none;}
  h1{margin:4px 0 2px;font-size:22px;color:#ffd23f;text-shadow:0 2px 0 #0007;}
  #hud{font-size:15px;color:#bfe3a0;margin:2px 0 6px;font-weight:bold;}
  canvas{background:#6a3fa0;border-radius:16px;box-shadow:0 8px 24px #0009;touch-action:none;max-width:100%;height:auto;}
  #nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .nb{background:#16283a;border:2px solid #35617e;color:#dceaf5;font-weight:bold;font-size:14px;padding:8px 14px;border-radius:12px;font-family:inherit;text-decoration:none;}
</style>
</head>
<body>
<div id="wrap">
  <a class="namebtn" href="../index.html">🏠 MO ARCADE</a>
  <h1>🎾 Mo Tennis</h1>
  <div id="hud">Tap to serve!</div>
  <canvas id="cv" width="440" height="620"></canvas>
  <div id="nav">
    <a class="nb" href="../index.html">← Back</a>
    <a class="nb" href="../mo-home.html">🏠 MO Home</a>
    <a class="nb" href="../games.html">🎮 All Games</a>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById("cv"), cx=cv.getContext("2d"), hud=document.getElementById("hud");
  var W=cv.width, H=cv.height;
  var WIN=7;                                   // first to 7 wins
  var state="menu";                            // menu, serve, play, point, over
  var you, ai, ball, pScore, aScore, msg, msgT, rally, server, winner;
  var best=0; try{best=parseInt(localStorage.getItem("moTennisBest")||"0",10)||0;}catch(e){}

  // ---- audio ----
  var AC=null; function beep(f,d,t){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),g=AC.createGain(); o.frequency.value=f; o.type=t||"square"; o.connect(g); g.connect(AC.destination); g.gain.value=.06; o.start(); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.08)); o.stop(AC.currentTime+(d||.08)); }catch(e){} }

  function reset(){
    you={x:W/2,y:H-60,w:70,r:16};
    ai={x:W/2,y:60,w:70,r:16};
    pScore=0; aScore=0; server=1; msg=""; msgT=0; winner=null;
    newBall(1);
  }
  function newBall(dir){                        // dir 1 = ball goes up (you serve), -1 down
    rally=0;
    ball={x:(server===1?you.x:ai.x), y:(server===1?H-90:90), vx:0, vy:0, live:false};
    state="serve";
    hud.textContent = (server===1?"Your serve":"Opponent serve")+" — "+pScore+" : "+aScore;
  }

  function serve(){
    if(state!=="serve")return;
    var dir = server===1 ? -1 : 1;
    var ang=(Math.random()*2-1)*1.1;
    var sp=5.2;
    ball.vx=Math.sin(ang)*sp; ball.vy=dir*Math.abs(Math.cos(ang)*sp);
    ball.live=true; state="play"; rally=0; beep(700,.07);
    hud.textContent="Rally! "+pScore+" : "+aScore;
  }

  // ---- input: drag to move your player ----
  function px(e){ var r=cv.getBoundingClientRect(); var t=e.touches&&e.touches[0]?e.touches[0]:e; return (t.clientX-r.left)/r.width*W; }
  function down(e){ e.preventDefault();
    if(AC&&AC.state==="suspended")AC.resume();
    if(state==="menu"){ reset(); return; }
    if(state==="over"){ reset(); return; }
    if(state==="point"){ return; }              // wait for auto-advance
    if(state==="serve"){ you.x=clampX(px(e)); if(server===1) serve(); else serve(); return; }
    you.x=clampX(px(e));
  }
  function move(e){ if(e.cancelable)e.preventDefault(); if(state==="play"||state==="serve") you.x=clampX(px(e)); }
  function clampX(x){ return Math.max(you.w/2, Math.min(W-you.w/2, x)); }
  cv.addEventListener("mousedown",down); cv.addEventListener("mousemove",move);
  cv.addEventListener("touchstart",down,{passive:false}); cv.addEventListener("touchmove",move,{passive:false});

  function point(who){                           // who: 1 you scored, -1 ai scored
    ball.live=false;
    if(who===1){ pScore++; msg="You win the point! 🎾"; beep(880,.12); }
    else { aScore++; msg="Opponent scores"; beep(200,.2,"sawtooth"); }
    state="point"; msgT=70;
    if(pScore>=WIN||aScore>=WIN){
      winner = pScore>=WIN ? "you":"ai";
      if(pScore>aScore && pScore>best){ best=pScore; try{localStorage.setItem("moTennisBest",String(best));}catch(e){} }
    }
    server = who===1 ? 1 : -1;                    // winner serves next
  }

  function update(){
    if(state==="play"){
      // AI tracks the ball with a little lag/imperfection
      var speed = 3.2 + rally*0.06;
      var target = ball.x + ball.vx*3;
      if(ball.vy<0){ ai.x += Math.max(-speed,Math.min(speed, (target-ai.x)*0.14)); }
      else { ai.x += (W/2-ai.x)*0.02; }           // drift to center when ball coming to you
      ai.x=Math.max(ai.w/2,Math.min(W-ai.w/2,ai.x));

      ball.x+=ball.vx; ball.y+=ball.vy;
      // side walls
      if(ball.x<10){ball.x=10;ball.vx=Math.abs(ball.vx);beep(400,.04);}
      if(ball.x>W-10){ball.x=W-10;ball.vx=-Math.abs(ball.vx);beep(400,.04);}
      // your racket (bottom)
      if(ball.vy>0 && ball.y>you.y-you.r && ball.y<you.y+8){
        if(Math.abs(ball.x-you.x)<you.w/2+8){
          rally++; ball.vy=-Math.abs(ball.vy)-0.18;
          ball.vx += (ball.x-you.x)/(you.w/2)*2.4;  // english by hit position
          ball.y=you.y-you.r; beep(660,.06); msgFlash();
        }
      }
      // ai racket (top)
      if(ball.vy<0 && ball.y<ai.y+ai.r && ball.y>ai.y-8){
        if(Math.abs(ball.x-ai.x)<ai.w/2+6){
          rally++; ball.vy=Math.abs(ball.vy)+0.18;
          ball.vx += (ball.x-ai.x)/(ai.w/2)*1.8;
          ball.y=ai.y+ai.r; beep(520,.06);
        }
      }
      // cap speed
      var mx=9.5; ball.vx=Math.max(-mx,Math.min(mx,ball.vx));
      // scoring: passed a baseline
      if(ball.y>H+16) point(-1);
      else if(ball.y<-16) point(1);
    }
    else if(state==="point"){
      msgT--;
      if(msgT<=0){
        if(winner){ state="over"; hud.textContent = winner==="you"?"🏆 YOU WIN the match!":"Opponent wins — try again!"; }
        else { newBall(); }
      }
    }
  }
  function msgFlash(){ }

  // ---- draw ----
  function court(){
    cx.fillStyle="#2e6fb0"; cx.fillRect(0,0,W,H);
    cx.fillStyle="#6a3fa0"; cx.fillRect(24,24,W-48,H-48);
    cx.strokeStyle="rgba(255,255,255,.9)"; cx.lineWidth=3;
    cx.strokeRect(24,24,W-48,H-48);
    // service lines
    cx.beginPath(); cx.moveTo(24,H*0.32); cx.lineTo(W-24,H*0.32); cx.moveTo(24,H*0.68); cx.lineTo(W-24,H*0.68); cx.stroke();
    cx.beginPath(); cx.moveTo(W/2,H*0.32); cx.lineTo(W/2,H*0.68); cx.stroke();
    // net
    cx.fillStyle="rgba(255,255,255,.85)"; cx.fillRect(20,H/2-3,W-40,6);
    cx.strokeStyle="rgba(255,255,255,.5)"; cx.lineWidth=1;
    for(var i=24;i<W-24;i+=10){ cx.beginPath(); cx.moveTo(i,H/2-3); cx.lineTo(i,H/2+3); cx.stroke(); }
  }
  function racket(p,col){
    cx.fillStyle=col; roundRect(p.x-p.w/2,p.y-8,p.w,16,8); cx.fill();
    cx.fillStyle="rgba(255,255,255,.25)"; roundRect(p.x-p.w/2+4,p.y-6,p.w-8,5,3); cx.fill();
  }
  function player(p, shirt, hair, isYou){
    var bx=p.x, y=p.y, d=isYou?1:-1;
    cx.fillStyle="rgba(0,0,0,.2)"; cx.beginPath(); cx.ellipse(bx, y+d*50, 15,5,0,0,7); cx.fill();
    // legs
    cx.strokeStyle="#2f3a52"; cx.lineWidth=5; cx.lineCap="round";
    cx.beginPath(); cx.moveTo(bx-5,y+d*32); cx.lineTo(bx-6,y+d*46); cx.moveTo(bx+5,y+d*32); cx.lineTo(bx+6,y+d*46); cx.stroke();
    // torso
    cx.fillStyle=shirt; roundRect(bx-11, y + (d>0?13:-33), 22, 20, 6); cx.fill();
    // head + hair
    cx.fillStyle="#f6c9a0"; cx.beginPath(); cx.arc(bx, y+d*8, 8, 0, 7); cx.fill();
    cx.fillStyle=hair; cx.beginPath(); cx.arc(bx, y+d*8-2, 8, Math.PI, 2*Math.PI); cx.fill();
    // arm raised toward the net holding the racket
    cx.strokeStyle=shirt; cx.lineWidth=5; cx.beginPath(); cx.moveTo(bx+d*9, y+d*17); cx.lineTo(bx+15, y-d*5); cx.stroke();
    var rx=bx+19, rY=y-d*8;
    cx.strokeStyle="#8a5a2f"; cx.lineWidth=3; cx.beginPath(); cx.moveTo(bx+15, y-d*5); cx.lineTo(rx, rY); cx.stroke();
    cx.strokeStyle="#1a1a1a"; cx.lineWidth=2.5; cx.fillStyle="rgba(255,255,255,.14)";
    cx.beginPath(); cx.ellipse(rx, rY, 9, 11, 0.5, 0, 7); cx.fill(); cx.stroke();
    cx.strokeStyle="rgba(255,255,255,.55)"; cx.lineWidth=0.7;
    for(var i=-2;i<=2;i++){ cx.beginPath(); cx.moveTo(rx-6,rY+i*3); cx.lineTo(rx+6,rY+i*3); cx.stroke(); cx.beginPath(); cx.moveTo(rx+i*3,rY-8); cx.lineTo(rx+i*3,rY+8); cx.stroke(); }
  }
  function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
  function scoreboard(){
    cx.fillStyle="rgba(0,0,0,.35)"; roundRect(W/2-52,H/2-20,104,40,10); cx.fill();
    cx.fillStyle="#fff"; cx.font="bold 22px Trebuchet MS,sans-serif"; cx.textAlign="center"; cx.textBaseline="middle";
    cx.fillText(pScore+" : "+aScore, W/2, H/2);
    cx.font="bold 11px Trebuchet MS,sans-serif"; cx.fillStyle="#cfe";
    cx.fillText("YOU", W/2, H*0.78); cx.fillText("CPU", W/2, H*0.22);
  }
  function drawBall(){
    cx.fillStyle="rgba(0,0,0,.2)"; cx.beginPath(); cx.ellipse(ball.x, ball.y+6, 8, 4, 0,0,7); cx.fill();
    cx.fillStyle="#e8f56b"; cx.beginPath(); cx.arc(ball.x,ball.y,7,0,7); cx.fill();
    cx.strokeStyle="#fff"; cx.lineWidth=1.5; cx.beginPath(); cx.arc(ball.x-2,ball.y,7,-0.6,0.9); cx.stroke();
  }
  function center(t,y,s,c){ cx.fillStyle=c||"#fff"; cx.font="bold "+s+"px Trebuchet MS,sans-serif"; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText(t,W/2,y); }

  function render(){
    court();
    if(state==="menu"){
      scoreOverlay("🎾 MO TENNIS", "Drag to move your racket.\nHit the ball back over the net!\nFirst to "+WIN+" wins.", "▶ TAP TO PLAY");
      center("Best: "+best, H*0.86, 15, "#ffd23f");
      return;
    }
    player(ai,"#3a7bd5","#2a2018",false); player(you,"#e0453a","#6b4423",true);
    if(state==="serve"||state==="play") drawBall();
    scoreboard();
    if(state==="serve"){ center(server===1?"Tap to serve ⬆":"Opponent serving…", H*0.6, 16, "#fff"); }
    if(state==="point"){ center(msg, H*0.42, 18, msg.indexOf("You")>=0?"#e8f56b":"#fff"); }
    if(state==="over"){
      cx.fillStyle="rgba(0,0,0,.55)"; cx.fillRect(0,0,W,H);
      center(winner==="you"?"🏆 YOU WIN!":"😤 CPU WINS", H*0.4, 30, winner==="you"?"#ffd23f":"#fff");
      center("Final: "+pScore+" : "+aScore, H*0.5, 20, "#fff");
      center("▶ TAP TO PLAY AGAIN", H*0.62, 18, "#7bd07b");
    }
  }
  function scoreOverlay(title,body,btn){
    center(title, H*0.3, 30, "#ffd23f");
    cx.fillStyle="#eaf2f7"; cx.font="bold 15px Trebuchet MS,sans-serif"; cx.textAlign="center"; cx.textBaseline="middle";
    body.split("\n").forEach(function(l,i){ cx.fillText(l, W/2, H*0.44+i*24); });
    cx.fillStyle="#7bd07b"; roundRect(W/2-100,H*0.66,200,50,14); cx.fill();
    center(btn, H*0.66+25, 18, "#06280f");
  }

  function loop(){ update(); render(); requestAnimationFrame(loop); }
  reset(); state="menu"; loop();
})();
</script>
</body>
</html>
