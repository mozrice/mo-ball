<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🏠 FAMILY HOUSE DESIGNER</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#241a12;color:#f6eee2;font-family:'Trebuchet MS',Verdana,sans-serif;overflow:hidden;}
  #wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:8px;}
  .namebtn{display:block;margin:6px auto 2px;background:linear-gradient(#ffd23f,#f7a72b);color:#5a3a1a;font-weight:bold;border:none;border-radius:14px;padding:9px 22px;font-size:16px;font-family:inherit;box-shadow:0 4px 0 #0006;text-decoration:none;}
  h1{margin:2px 0;font-size:20px;color:#ffd23f;text-shadow:0 2px 0 #0007;}
  #steps{font-size:13px;color:#e7cfa9;margin:2px 0 6px;font-weight:bold;}
  canvas{background:#f3ead9;border-radius:16px;box-shadow:0 8px 24px #0009;touch-action:none;max-width:100%;height:auto;}
  #nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .nb{background:#3a2a1a;border:2px solid #7a5a30;color:#f0dcc0;font-weight:bold;font-size:14px;padding:8px 14px;border-radius:12px;font-family:inherit;text-decoration:none;}
</style>
</head>
<body>
<div id="wrap">
  <a class="namebtn" href="../index.html">🏠 MO ARCADE</a>
  <h1>🏠 FAMILY HOUSE DESIGNER</h1>
  <div id="steps">Design the family house, room by room!</div>
  <canvas id="cv" width="440" height="620"></canvas>
  <div id="nav">
    <a class="nb" href="../index.html">← Back</a>
    <a class="nb" href="../mo-home.html">🏠 MO Home</a>
    <a class="nb" href="../games.html">🎮 All Games</a>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById("cv"), cx=cv.getContext("2d"), steps=document.getElementById("steps");
  var W=cv.width, H=cv.height, t=0;
  var scene="menu", g={}, ptr={x:W/2,y:0,down:false};
  var coins=0; try{ coins=parseInt(localStorage.getItem("mohouse_coins")||"0",10)||0; }catch(e){}
  function save(){ try{ localStorage.setItem("mohouse_coins",String(coins)); }catch(e){} }
  var owned={}; try{ owned=JSON.parse(localStorage.getItem("mohouse_owned")||"{}")||{}; }catch(e){}
  var equipHat=-1; try{ var _eh=localStorage.getItem("mohouse_hat"); equipHat=(_eh===null)?-1:parseInt(_eh,10); if(isNaN(equipHat))equipHat=-1; }catch(e){}
  function saveShop(){ try{ localStorage.setItem("mohouse_owned",JSON.stringify(owned)); localStorage.setItem("mohouse_hat",String(equipHat)); }catch(e){} }
  var HAT_EMOJI=["🎩","🧢","👑","🥳"];
  var SHOP=[{k:"hat0",e:"🎩",n:"Top Hat",p:30,cat:"hat",hi:0},{k:"hat1",e:"🧢",n:"Cap",p:20,cat:"hat",hi:1},{k:"hat2",e:"👑",n:"Crown",p:60,cat:"hat",hi:2},{k:"hat3",e:"🥳",n:"Party Hat",p:25,cat:"hat",hi:3},{k:"pet0",e:"🐰",n:"Pet Bunny",p:40,cat:"pet"},{k:"pet1",e:"🐧",n:"Pet Penguin",p:45,cat:"pet"},{k:"spark",e:"✨",n:"Sparkle Trail",p:50,cat:"pow"}];

  var AC=null; function beep(f,d,ty){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),ga=AC.createGain(); o.frequency.value=f;o.type=ty||"square";o.connect(ga);ga.connect(AC.destination);ga.gain.value=.06;o.start();ga.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08)); }catch(e){} }
  function ding(){ beep(760,.08,"sine"); setTimeout(function(){beep(1020,.12,"sine");},80); }
  function clink(){ beep(880,.05,"sine"); setTimeout(function(){beep(1180,.06,"sine");},50); }
  function rr(x,y,w,h,r){ cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath(); }
  function text(s,x,y,sz,c,al){ cx.fillStyle=c||"#fff";cx.font="bold "+sz+"px Trebuchet MS,sans-serif";cx.textAlign=al||"center";cx.textBaseline="middle";cx.fillText(s,x,y); }
  function emo(ch,x,y,s){ cx.font=s+"px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(ch,x,y); }
  function btn(label,y,c){ cx.fillStyle=c||"#7bd07b"; rr(W/2-120,y,240,52,14); cx.fill(); text(label,W/2,y+26,18,"#06280f"); }
  function coinHUD(){ cx.fillStyle="rgba(255,255,255,.88)"; rr(14,12,94,30,10); cx.fill(); cx.strokeStyle="#e0b64a"; cx.lineWidth=2; rr(14,12,94,30,10); cx.stroke(); emo("🪙",34,27,20); text("x "+coins,54,27,17,"#5a3a1a","left"); }
  function label(s){ steps.textContent=s; }
  function go(name){ FX.parts=[]; FX.conf=[]; FX.floats=[]; scene=name; if(S[name].init)S[name].init(); }

  // FX
  var FX={parts:[],conf:[],floats:[]};
  function drop(x,y,col,n,up){ n=n||8; for(var i=0;i<n;i++){ var a=Math.random()*6.28,s=1+Math.random()*2.4; FX.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:(up?-1:0.4)-Math.random()*2,life:1,col:col,r:2+Math.random()*2.5,g:0.14}); } }
  function star(x,y,n){ n=n||8; for(var i=0;i<n;i++){ var a=Math.random()*6.28,s=1.6+Math.random()*2.4; FX.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.4,life:1,col:"#fff2a8",r:2+Math.random()*2,g:0.08,tw:1}); } }
  function floatUp(s,x,y,col){ FX.floats.push({s:s,x:x,y:y,life:1,col:col||"#fff"}); }
  function confettiBurst(){ for(var i=0;i<26;i++){ FX.conf.push({x:Math.random()*W,y:-10-Math.random()*60,vy:1.6+Math.random()*2.4,vx:Math.random()*2-1,r:3+Math.random()*4,col:["#ff5a7a","#ffd23f","#5ad0a0","#5aa0ff","#c77aff"][i%5],rot:Math.random()*6,vr:Math.random()*0.3-0.15}); } }
  function updateFX(){
    for(var i=FX.parts.length-1;i>=0;i--){ var p=FX.parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=0.03; if(p.life<=0)FX.parts.splice(i,1); }
    for(var j=FX.floats.length-1;j>=0;j--){ var f=FX.floats[j]; f.y-=1.1; f.life-=0.02; if(f.life<=0)FX.floats.splice(j,1); }
    for(var k=FX.conf.length-1;k>=0;k--){ var c=FX.conf[k]; c.y+=c.vy; c.x+=c.vx; c.rot+=c.vr; if(c.y>H+20)FX.conf.splice(k,1); }
  }
  function renderFX(){
    FX.parts.forEach(function(p){ cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.tw&&Math.floor(t/3)%2?"#fff":p.col; cx.beginPath(); cx.arc(p.x,p.y,Math.max(0.5,p.r*p.life),0,7); cx.fill(); });
    cx.globalAlpha=1;
    FX.floats.forEach(function(f){ cx.globalAlpha=Math.max(0,f.life); cx.fillStyle=f.col; cx.strokeStyle="#00000055"; cx.lineWidth=3; cx.font="bold 20px Trebuchet MS,sans-serif"; cx.textAlign="center"; cx.textBaseline="middle"; cx.strokeText(f.s,f.x,f.y); cx.fillText(f.s,f.x,f.y); });
    cx.globalAlpha=1;
    FX.conf.forEach(function(c){ cx.save(); cx.translate(c.x,c.y); cx.rotate(c.rot); cx.fillStyle=c.col; cx.fillRect(-c.r/2,-c.r/2,c.r,c.r*1.6); cx.restore(); });
  }

  var CY=300; // counter top surface y
  function drawKitchen(){
    // wall
    cx.fillStyle="#f6e9d2"; cx.fillRect(0,0,W,CY);
    // upper cabinets
    cx.fillStyle="#c98f5a"; cx.fillRect(0,44,W,74); cx.strokeStyle="#a5713f"; cx.lineWidth=2;
    for(var i=0;i<4;i++){ cx.strokeRect(6+i*108,50,100,62); cx.fillStyle="#8a5a2f"; cx.fillRect(6+i*108+84,78,8,8); cx.fillStyle="#c98f5a"; }
    // counter band
    cx.fillStyle="#8a95a5"; cx.fillRect(0,CY,W,20);
    cx.fillStyle="#6a7585"; cx.fillRect(0,CY+18,W,4);
    // base cabinets
    cx.fillStyle="#b97f4a"; cx.fillRect(0,CY+22,W,H-CY-22); cx.strokeStyle="#8a5a2f"; cx.lineWidth=2;
    for(var j=0;j<4;j++){ cx.strokeRect(8+j*108,CY+30,100,H-CY-40); cx.fillStyle="#7a4a2a"; cx.fillRect(8+j*108+46,CY+40,10,10); cx.fillStyle="#b97f4a"; }
  }

  var S={};
  var JOBS=[["person","🚶","Walk House","#ffd27a"],["door","🚪","Front Door","#d7c6a0"],["drive","🛣️","Driveway","#cfcfcf"],["sink","🚰","Kitchen Sink","#bfe0ff"],["coffee","☕","Coffee Bar","#e8c9a0"],["dining","🍽️","Dining Room","#f0c6a0"],["kids","🌟","Kids Stars","#c9c0f0"],["bath","🛁","Bathroom","#bfe8ee"],["gym","🏋️","Home Gym","#ffc0c0"],["sunroom","🪟","Sunroom","#cfeee0"],["firepit","🔥","Fire Pit","#ffd0b0"],["theater","🎬","Home Theater","#d4c6f0"],["petwash","🐾","Pet Wash","#ffe0c0"],["cityview","🌆","City View","#c4d4f0"],["rooftop","🌿","Rooftop Garden","#c8e8c0"],["gameroom","🎱","Game Room","#bfe0d0"],["yoga","🧘","Yoga Studio","#e0d0f0"],["robot","🤖","Robot Helper","#c4d4e4"],["range","🍳","Pro Range","#ffd0d0"],["hiddentv","📺","Hidden TV","#d4d4d4"],["shop","🛒","Coin Shop","#ffe8a0"]];
  var menuPage=0, PAGE=14;
  function menuRects(){ var cols=2,tw=152,th=52,gx=12,gy=8,x0=(W-(cols*tw+(cols-1)*gx))/2,y0=150,r=[]; for(var i=0;i<PAGE;i++){ var c=i%cols,rw=Math.floor(i/cols); r.push({x:x0+c*(tw+gx),y:y0+rw*(th+gy),w:tw,h:th}); } return r; }

  // ---------------- MENU ----------------
  S.menu={ init:function(){ label("Pick a job to do! 🪙 "+coins); },
    render:function(){ drawKitchen(); coinHUD();
      emo("🏠",W*0.5,84,26);
      text("FAMILY HOUSE DESIGNER",W/2,116,17,"#7a4a1a"); text("Pick a job to do!",W/2,136,12,"#7a5a3a");
      var R=menuRects(), start=menuPage*PAGE, pages=Math.ceil(JOBS.length/PAGE);
      for(var i=0;i<PAGE;i++){ var idx=start+i; if(idx>=JOBS.length)break; var rc=R[i],J=JOBS[idx]; cx.fillStyle=J[3]; rr(rc.x,rc.y,rc.w,rc.h,12); cx.fill(); cx.strokeStyle="#ffffffcc"; cx.lineWidth=2; rr(rc.x,rc.y,rc.w,rc.h,12); cx.stroke(); emo(J[1],rc.x+26,rc.y+rc.h/2,22); text(J[2],rc.x+44,rc.y+rc.h/2,12,"#3a2a10","left"); }
      if(pages>1){ text("Page "+(menuPage+1)+" / "+pages,W/2,H-24,13,"#7a4a1a");
        if(menuPage>0){ cx.fillStyle="#e8c9a0"; rr(30,H-40,120,32,10); cx.fill(); cx.strokeStyle="#fff"; cx.lineWidth=2; rr(30,H-40,120,32,10); cx.stroke(); text("◀ Back",90,H-24,14,"#3a2a10"); }
        if(menuPage<pages-1){ cx.fillStyle="#ffd27a"; rr(W-150,H-40,120,32,10); cx.fill(); cx.strokeStyle="#fff"; cx.lineWidth=2; rr(W-150,H-40,120,32,10); cx.stroke(); text("More ▶",W-90,H-24,14,"#3a2a10"); } } },
    tap:function(){ var R=menuRects(), start=menuPage*PAGE, pages=Math.ceil(JOBS.length/PAGE);
      if(pages>1){ if(menuPage>0 && ptr.y>H-40&&ptr.y<H-8&&ptr.x>30&&ptr.x<150){ menuPage--; beep(500,.06); return; }
        if(menuPage<pages-1 && ptr.y>H-40&&ptr.y<H-8&&ptr.x>W-150&&ptr.x<W-30){ menuPage++; beep(600,.06); return; } }
      for(var i=0;i<PAGE;i++){ var idx=start+i; if(idx>=JOBS.length)break; var rc=R[i]; if(ptr.x>rc.x&&ptr.x<rc.x+rc.w&&ptr.y>rc.y&&ptr.y<rc.y+rc.h){ beep(680,.08); go(JOBS[idx][0]); return; } } } };

  // ================= INSTALL SINK =================
  // basin cutout centered
  var BX=145, BW=150, BTOP=CY-2, BH=104;
  var SPOUTX=250, SPOUTY=258;                 // faucet spout output
  var FBASE={x:200,y:CY};                       // faucet base on counter
  function drawBasin(){ // metal sink basin recessed
    cx.fillStyle="#7d8794"; rr(BX-6,BTOP-6,BW+12,BH+12,14); cx.fill();
    var gr=cx.createLinearGradient(0,BTOP,0,BTOP+BH); gr.addColorStop(0,"#c6cdd6"); gr.addColorStop(1,"#9aa4b0"); cx.fillStyle=gr; rr(BX,BTOP,BW,BH,12); cx.fill();
    cx.strokeStyle="#6a7480"; cx.lineWidth=2; rr(BX,BTOP,BW,BH,12); cx.stroke();
    // drain
    cx.fillStyle="#5a6470"; cx.beginPath(); cx.arc(BX+BW/2,BTOP+BH-16,7,0,7); cx.fill();
  }
  function drawFaucet(on,turn){ cx.save();
    // base
    cx.fillStyle="#b8bfc8"; rr(FBASE.x-10,FBASE.y-14,20,16,4); cx.fill();
    // neck (arc up and over to spout)
    cx.strokeStyle="#c6cdd6"; cx.lineWidth=10; cx.lineCap="round"; cx.beginPath(); cx.moveTo(FBASE.x, FBASE.y-10); cx.lineTo(FBASE.x, SPOUTY-6); cx.quadraticCurveTo(FBASE.x, SPOUTY-14, SPOUTX-6, SPOUTY-10); cx.lineTo(SPOUTX, SPOUTY); cx.stroke();
    cx.strokeStyle="#9aa4b0"; cx.lineWidth=3; cx.beginPath(); cx.moveTo(FBASE.x, FBASE.y-10); cx.lineTo(FBASE.x, SPOUTY-6); cx.stroke();
    // handle (rotates with turn)
    cx.save(); cx.translate(FBASE.x-16, FBASE.y-6); cx.rotate((turn||0)*-1.1); cx.fillStyle="#7fb0e0"; rr(-4,-16,8,20,4); cx.fill(); cx.beginPath(); cx.arc(0,-16,6,0,7); cx.fill(); cx.restore();
    cx.restore();
  }
  function drawStream(){ // flowing water from spout into basin
    for(var i=0;i<4;i++){ var wob=Math.sin((t*0.4)+(i))*2; cx.strokeStyle="rgba(120,190,255,0.8)"; cx.lineWidth=2; cx.beginPath(); cx.moveTo(SPOUTX-3+i*2+wob, SPOUTY); cx.lineTo(SPOUTX-3+i*2+wob*-1, BTOP+BH-24); cx.stroke(); }
    // basin water pool
    cx.fillStyle="rgba(120,190,255,0.5)"; rr(BX+8,BTOP+BH-42,BW-16,34,8); cx.fill();
    if(t%4===0) drop(SPOUTX+(Math.random()*20-10), BTOP+BH-30, "#bfe4ff", 3);
  }

  S.sink={ init:function(){ g={phase:"sink", hold:null, hx:0, hy:0, turn:0, turning:false, tstartY:0,
      dishes:[], cur:null, washed:0, need:6, spawnT:0, over:false}; label("Drag the SINK into the counter! 🚰"); },
    update:function(){
      if(g.phase==="wash" && !g.over){
        // manage current dish
        if(!g.cur){ g.spawnT--; if(g.spawnT<=0){ var TY=["🍽️","🍴","🥣","🍳","🥤","🍵"]; g.cur={x:372,y:CY+2,dirt:1,e:TY[Math.floor(Math.random()*TY.length)],held:false,done:false}; } }
        else if(g.cur.held){ // if inside stream zone, wash
          if(Math.abs(g.cur.x-SPOUTX)<40 && g.cur.y>SPOUTY-10 && g.cur.y<BTOP+BH){ g.cur.dirt=Math.max(0,g.cur.dirt-0.035); if(t%3===0)drop(g.cur.x,g.cur.y-6,"#bfe4ff",2,true);
            if(g.cur.dirt<=0 && !g.cur.done){ g.cur.done=true; clink(); star(g.cur.x,g.cur.y,7); floatUp("✨ clean!",g.cur.x,g.cur.y-14,"#fff2a8"); coins++; save(); g.washed++;
              g.cur=null; g.spawnT=18; if(g.washed>=g.need){ g.over=true; confettiBurst(); label("SINK DONE! 🪙 "+coins); } } }
        }
      }
    },
    render:function(){ drawKitchen();
      // drying rack (left) with washed dishes
      cx.fillStyle="#c9b28a"; rr(30,CY-4,84,8,3); cx.fill();
      for(var d=0;d<g.washed;d++){ emo("🍽️", 40+ (d%4)*20, CY-14 - Math.floor(d/4)*4, 15); }
      drawBasin();
      // installed faucet after placed
      if(g.phase!=="sink"){ drawFaucet(g.phase!=="faucet", g.turn); }
      if((g.phase==="wash") && g.turn>0.6){ drawStream(); }
      coinHUD();

      // instructions + shelf part
      if(g.phase==="sink"){ text("Drag the SINK into the counter!",W/2,44,17,"#4a2a10");
        // ghost outline
        cx.setLineDash([7,6]); cx.strokeStyle="#5a6470"; cx.lineWidth=3; rr(BX,BTOP,BW,BH,12); cx.stroke(); cx.setLineDash([]);
        var sx=g.hold==="sink"?g.hx:W/2, sy=g.hold==="sink"?g.hy:540; drawShelfSink(sx,sy);
      }
      else if(g.phase==="faucet"){ text("Drag the FAUCET onto the sink!",W/2,44,17,"#4a2a10");
        emo("⬇️", FBASE.x, FBASE.y-30+Math.sin(t*0.2)*3, 20);
        var fx=g.hold==="faucet"?g.hx:W/2, fy=g.hold==="faucet"?g.hy:545; drawShelfFaucet(fx,fy);
      }
      else if(g.phase==="handle"){ text("Turn the HANDLE up to start water!",W/2,44,16,"#4a2a10");
        // pulsing hint on handle
        cx.strokeStyle="rgba(120,180,255,"+(0.4+Math.sin(t*0.2)*0.3)+")"; cx.lineWidth=3; cx.beginPath(); cx.arc(FBASE.x-16,FBASE.y-6,18,0,7); cx.stroke();
        text("👆 drag it up",FBASE.x-16,FBASE.y+26,12,"#3a6a9a");
      }
      else if(g.phase==="wash"){ text("Drag dirty dishes under the water! 🧽",W/2,40,15,"#4a2a10");
        // dish on the counter to wash
        if(g.cur){ cx.save(); cx.translate(g.cur.x,g.cur.y); emo(g.cur.e,0,0,30);
          if(g.cur.dirt>0){ cx.globalAlpha=g.cur.dirt*0.8; cx.fillStyle="#8a6a3a"; [[-8,-4],[6,-8],[2,6],[-5,7]].forEach(function(p){ cx.beginPath(); cx.arc(p[0],p[1],3.5,0,7); cx.fill(); }); cx.globalAlpha=1; }
          cx.restore(); }
        // progress
        for(var k=0;k<g.need;k++){ emo(k<g.washed?"✨":"⚪", W/2-(g.need-1)*15+k*30, H-22, 16); }
        if(g.over){ if(t%45===0)confettiBurst(); cx.fillStyle="rgba(0,0,0,.5)"; cx.fillRect(0,0,W,H); text("🚰 SINK INSTALLED!",W/2,H*0.4,24,"#ffd23f"); text("Kitchen sparkles! ✨",W/2,H*0.47,16,"#fff"); btn("▶ BACK TO KITCHEN",H*0.56); }
      }
    },
    down:function(){
      if(g.phase==="sink"){ var sx=W/2,sy=540; if(Math.abs(ptr.x-sx)<70&&Math.abs(ptr.y-sy)<44){ g.hold="sink"; g.hx=ptr.x; g.hy=ptr.y; } }
      else if(g.phase==="faucet"){ if(Math.abs(ptr.x-W/2)<60&&Math.abs(ptr.y-545)<40){ g.hold="faucet"; g.hx=ptr.x; g.hy=ptr.y; } }
      else if(g.phase==="handle"){ if(Math.abs(ptr.x-(FBASE.x-16))<26&&Math.abs(ptr.y-(FBASE.y-6))<30){ g.turning=true; g.tstartY=ptr.y; } }
      else if(g.phase==="wash"){ if(g.cur && Math.abs(ptr.x-g.cur.x)<26&&Math.abs(ptr.y-g.cur.y)<26){ g.cur.held=true; } }
    },
    drag:function(){
      if(g.hold){ g.hx=ptr.x; g.hy=ptr.y; }
      else if(g.turning){ g.turn=Math.max(0,Math.min(1,(g.tstartY-ptr.y)/60)); if(g.turn>=1 && g.phase==="handle"){ g.phase="wash"; g.turning=false; g.spawnT=6; ding(); label("💧 Water on! Wash the dishes!"); } }
      else if(g.phase==="wash" && g.cur && g.cur.held){ g.cur.x=ptr.x; g.cur.y=ptr.y; }
    },
    up:function(){
      if(g.hold==="sink"){ if(Math.abs(g.hx-(BX+BW/2))<70 && Math.abs(g.hy-(BTOP+BH/2))<70){ g.phase="faucet"; ding(); drop(BX+BW/2,BTOP+BH/2,"#c6cdd6",10); label("Now drag the FAUCET on! 🚰"); } beep(g.phase==="faucet"?700:300,.08); g.hold=null; }
      else if(g.hold==="faucet"){ if(Math.abs(g.hx-FBASE.x)<70 && Math.abs(g.hy-FBASE.y)<80){ g.phase="handle"; ding(); drop(FBASE.x,FBASE.y-20,"#c6cdd6",8); label("Turn the handle to start the water!"); } else beep(300,.08); g.hold=null; }
      else if(g.turning){ if(g.turn<1)g.turn=0; g.turning=false; }
      else if(g.phase==="wash" && g.cur){ g.cur.held=false; if(!g.cur.done){ /* snap back toward counter if dropped low */ if(g.cur.y>H-60){ g.cur.x=372; g.cur.y=CY+2; } } }
    },
    tap:function(){ if(g.phase==="wash" && g.over){ go("menu"); } } };
  function drawShelfSink(x,y){ cx.save(); cx.translate(x,y);

    render:function(){
      var gr=cx.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#fff4d6"); gr.addColorStop(1,"#ffe6b0"); cx.fillStyle=gr; cx.fillRect(0,0,W,H);
      emo("🛒",W/2-70,52,30); text("COIN SHOP",W/2+10,52,24,"#a5701a");
      // coin balance badge
      cx.fillStyle="#fff"; rr(W/2-56,72,112,30,15); cx.fill(); cx.strokeStyle="#e0b64a"; cx.lineWidth=3; rr(W/2-56,72,112,30,15); cx.stroke(); emo("🪙",W/2-32,87,20); text(coins,W/2+8,87,18,"#a5701a","left");
      var R=shopRects();
      for(var i=0;i<SHOP.length;i++){ var rc=R[i], it=SHOP[i], own=!!owned[it.k], canBuy=coins>=it.p;
        cx.fillStyle=own?"#dff5df":(canBuy?"#fff":"#eee2c8"); rr(rc.x,rc.y,rc.w,rc.h,14); cx.fill();
        cx.strokeStyle=own?"#5ab06a":"#e0c88a"; cx.lineWidth=own?3:2; rr(rc.x,rc.y,rc.w,rc.h,14); cx.stroke();
        emo(it.e,rc.x+30,rc.y+rc.h/2,30); text(it.n,rc.x+52,rc.y+26,13,"#5a3a10","left");
        if(own){ if(it.cat==="hat"){ var worn=(equipHat===it.hi); text(worn?"👕 WORN":"tap: wear",rc.x+52,rc.y+52,13,worn?"#2a7a2a":"#7a5a2a","left"); } else { text("OWNED ✓",rc.x+52,rc.y+52,13,"#2a7a2a","left"); } }
        else { emo("🪙",rc.x+54,rc.y+52,15); text(it.p,rc.x+70,rc.y+52,14,canBuy?"#a5701a":"#b0a080","left"); }
      }
      cx.fillStyle="#e8c9a0"; rr(W/2-90,H-46,180,34,11); cx.fill(); cx.strokeStyle="#fff"; cx.lineWidth=2; rr(W/2-90,H-46,180,34,11); cx.stroke(); text("◀ BACK TO JOBS",W/2,H-29,15,"#3a2a10");
      renderFX();
      if(g.flash>0){ g.flash--; }
    },
    tap:function(){
      if(ptr.y>H-46&&ptr.y<H-12&&Math.abs(ptr.x-W/2)<90){ beep(500,.06); go("menu"); return; }
      var R=shopRects();
      for(var i=0;i<SHOP.length;i++){ var rc=R[i], it=SHOP[i]; if(ptr.x>rc.x&&ptr.x<rc.x+rc.w&&ptr.y>rc.y&&ptr.y<rc.y+rc.h){
        if(owned[it.k]){ if(it.cat==="hat"){ equipHat=(equipHat===it.hi)?-1:it.hi; saveShop(); ding(); star(rc.x+30,rc.y+rc.h/2,5); } else { beep(400,.06); } }
        else if(coins>=it.p){ coins-=it.p; owned[it.k]=true; if(it.cat==="hat")equipHat=it.hi; save(); saveShop(); ding(); confettiBurst(); star(rc.x+rc.w/2,rc.y+rc.h/2,10); floatUp("Bought! ✨",rc.x+rc.w/2,rc.y+10,"#5a3a10"); label("Got it! 🪙 "+coins); }
        else { beep(200,.12,"sawtooth"); floatUp("Need more 🪙",rc.x+rc.w/2,rc.y+10,"#c05a3a"); }
        return; } }
    } };

  // ---------------- input ----------------
  function pos(e){ var r=cv.getBoundingClientRect(), sx=cv.width/r.width, sy=cv.height/r.height; var cxp,cyp; if(e.touches&&e.touches[0]){ cxp=e.touches[0].clientX; cyp=e.touches[0].clientY; } else { cxp=e.clientX; cyp=e.clientY; } return {x:(cxp-r.left)*sx, y:(cyp-r.top)*sy}; }
  function down(e){ e.preventDefault(); var p=pos(e); ptr.x=p.x; ptr.y=p.y; ptr.down=true; var s=S[scene]; if(s.down)s.down(); if(s.tap)s.tap(); }
  function move(e){ e.preventDefault(); var p=pos(e); ptr.x=p.x; ptr.y=p.y; var s=S[scene]; if(ptr.down&&s.drag)s.drag(); }
  function up(e){ e.preventDefault(); ptr.down=false; var s=S[scene]; if(s.up)s.up(); }
  cv.addEventListener("mousedown",down); cv.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
  cv.addEventListener("touchstart",down,{passive:false}); cv.addEventListener("touchmove",move,{passive:false}); cv.addEventListener("touchend",up,{passive:false});

  function loop(){ t++; var s=S[scene]; if(s.update)s.update(); updateFX(); s.render(); renderFX(); requestAnimationFrame(loop); }
  go("menu"); loop();
})();
</script>
