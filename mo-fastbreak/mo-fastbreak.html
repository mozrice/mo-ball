<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MO FAST BREAK</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d3b2e;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;font-weight:bold;text-shadow:0 2px 0 #0007;}
  .pill{background:#0008;border-radius:20px;padding:6px 14px;font-size:17px;}
  .key{position:fixed;bottom:24px;width:44%;height:96px;border-radius:20px;border:3px solid #ffffff77;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;background:#0004;}
  #kl{left:3%;} #kr{right:3%;}
  .key:active{background:#0007;}
  #hint{position:fixed;bottom:128px;left:0;right:0;text-align:center;font-size:14px;color:#fff;background:#0005;padding:5px;pointer-events:none;}
  #msg{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:38px;font-weight:bold;color:#ffd23f;text-shadow:0 3px 0 #0008;pointer-events:none;opacity:0;transition:opacity .12s;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0d3b2ed8;text-align:center;}
  #over h1{font-size:38px;margin:0 0 6px;color:#7bff9e;} #over p{font-size:20px;margin:4px;}
  .btn{margin-top:16px;background:linear-gradient(#2ad17a,#1a9a5a);border:none;color:#fff;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;box-shadow:0 5px 0 #127a44;font-family:inherit;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill">🏀 <span id="pts">0</span></div>
  <div class="pill">⚡ <span id="fb">0</span></div>
  <div class="pill">❤️ <span id="lives">3</span></div>
</div>
<div class="key" id="kl">◀</div>
<div class="key" id="kr">▶</div>
<div id="hint">Weave ◀ ▶ through defenders — grab 🏀 hoops to finish the fast break! ⚡</div>
<div id="msg"></div>
<div id="over"><h1 id="ot">🛑 TURNOVER!</h1><p id="os"></p><button class="btn" id="again">Run It Back</button></div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1,LANES=3;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  function beep(f,d,t,v){ try{var a=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());var o=a.createOscillator(),g=a.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||0.05;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.08));o.stop(a.currentTime+(d||0.08)+0.02);}catch(e){} }
  var best=+(localStorage.getItem('mofastbreak_best')||0);
  var mo, defs, items, lane, speed, pts, fb, lives, running, scroll, spawnT, msgT, dribble, nowv=0;
  function laneX(l){ return W*(0.25+l*0.25); }
  function reset(){ lane=1; mo={x:laneX(1),y:H*0.76}; defs=[]; items=[]; speed=4.5; pts=0; fb=0; lives=3; running=true; scroll=0; spawnT=30; msgT=0; dribble=0;
    document.getElementById('over').style.display='none'; upd(); }
  function upd(){ document.getElementById('pts').textContent=pts; document.getElementById('fb').textContent=fb; document.getElementById('lives').textContent=lives; }
  function move(d){ if(!running)return; lane=Math.max(0,Math.min(LANES-1,lane+d)); beep(400,0.05,'square',0.04); }
  document.getElementById('kl').addEventListener('touchstart',function(e){move(-1);e.preventDefault();},{passive:false}); document.getElementById('kl').addEventListener('mousedown',function(){move(-1);});
  document.getElementById('kr').addEventListener('touchstart',function(e){move(1);e.preventDefault();},{passive:false}); document.getElementById('kr').addEventListener('mousedown',function(){move(1);});
  addEventListener('keydown',function(e){ if(e.key==='ArrowLeft')move(-1); if(e.key==='ArrowRight')move(1); });
  var sx0=null; cv.addEventListener('touchstart',function(e){sx0=e.touches[0].clientX;},{passive:true}); cv.addEventListener('touchend',function(e){ if(sx0!=null){ var dx=(e.changedTouches[0].clientX-sx0); if(dx>30)move(1); else if(dx<-30)move(-1); sx0=null; } });
  document.getElementById('again').onclick=reset;
  function showMsg(m,col){ var e=document.getElementById('msg'); e.textContent=m; e.style.color=col||'#ffd23f'; e.style.opacity=1; msgT=1; }
  function hit(){ lives--; upd(); showMsg('🛑 STRIPPED! ('+lives+')','#ff6a6a'); beep(180,0.2,'sawtooth',0.06); if(lives<=0) over(); }
  function over(){ running=false; if(pts>best){best=pts;localStorage.setItem('mofastbreak_best',best);}
    document.getElementById('os').innerHTML='Fast-break points: <b>'+pts+'</b><br>Finishes: <b>'+fb+'</b> — Best: <b>'+best+'</b>'; document.getElementById('over').style.display='flex'; beep(160,0.3,'sawtooth',0.08); }
  function update(dt){
    speed+=0.0025*dt; scroll+=speed*dt; dribble+=0.3*dt;
    mo.x+=(laneX(lane)-mo.x)*0.3*dt;
    spawnT-=dt; if(spawnT<=0){ var r=Math.random();
      if(r<0.6){ var dl=Math.floor(Math.random()*LANES); defs.push({lane:dl,y:-40}); }
      else { items.push({lane:Math.floor(Math.random()*LANES),y:-40,t:r<0.82?'hoop':'coin'}); }
      spawnT=Math.max(18,40-speed*2); }
    for(var i=defs.length-1;i>=0;i--){ var d=defs[i]; d.y+=speed*dt; if(d.y>H+40){ defs.splice(i,1); continue; }
      if(d.lane===lane && d.y>mo.y-26 && d.y<mo.y+26){ defs.splice(i,1); hit(); if(!running)return; } }
    for(var j=items.length-1;j>=0;j--){ var it=items[j]; it.y+=speed*dt; if(it.y>H+40){ items.splice(j,1); continue; }
      if(it.lane===lane && Math.abs(it.y-mo.y)<30){ if(it.t==='hoop'){ pts+=2; fb++; showMsg('⚡ FINISH! +2','#7bff9e'); } else { pts+=1; } beep(800,0.08,'square',0.05); upd(); items.splice(j,1); } }
    if(msgT>0){ msgT-=0.016*dt; if(msgT<=0)document.getElementById('msg').style.opacity=0; }
  }
  function render(){
    ctx.fillStyle='#12805e'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#0d6a4e'; ctx.lineWidth=3; for(var y=(scroll%80)-80;y<H;y+=80){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2; ctx.setLineDash([12,12]); for(var l=1;l<LANES;l++){ ctx.beginPath(); ctx.moveTo(W*0.125+l*W*0.25,0); ctx.lineTo(W*0.125+l*W*0.25,H); ctx.stroke(); } ctx.setLineDash([]);
    for(var j=0;j<items.length;j++){ var it=items[j]; ctx.font='34px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(it.t==='hoop'?'🏀':'🪙',laneX(it.lane),it.y); }
    for(var i=0;i<defs.length;i++){ var d=defs[i]; drawDef(laneX(d.lane),d.y); }
    drawMo();
  }
  function drawDef(x,y){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='#e0453a'; roundRect(-13,-16,26,30,8); ctx.fill();
    ctx.fillStyle='#f6c48a'; ctx.beginPath(); ctx.arc(0,-24,10,0,6.29); ctx.fill(); ctx.fillStyle='#2a2a3a'; ctx.beginPath(); ctx.arc(0,-27,10,Math.PI,6.29); ctx.fill();
    ctx.strokeStyle='#e0453a'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-10,-6); ctx.lineTo(-20,-16); ctx.moveTo(10,-6); ctx.lineTo(20,-16); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('D',0,-2); ctx.restore(); }
  function drawMo(){ var x=mo.x,y=mo.y; ctx.save(); ctx.translate(x,y);
    var by=Math.abs(Math.sin(dribble))*10; ctx.fillStyle='#e0701f'; ctx.beginPath(); ctx.arc(16,14-by,8,0,6.29); ctx.fill();
    ctx.fillStyle='#1a6fd0'; roundRect(-13,-16,26,30,8); ctx.fill();
    ctx.fillStyle='#f6c48a'; ctx.beginPath(); ctx.arc(0,-24,10,0,6.29); ctx.fill(); ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(0,-27,10,Math.PI,6.29); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('MO',0,-2); ctx.restore(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  var last=0;
  function loop(ts){ nowv=ts; if(!last)last=ts; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts; if(running) update(dt); render(); requestAnimationFrame(loop); }
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
