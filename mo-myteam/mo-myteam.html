<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO MyTEAM</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0%,#2a2340,#0e0b16);font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;}
  body{padding:12px 12px 90px;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;opacity:.9;text-decoration:none;font-size:14px;z-index:9;font-weight:bold;text-shadow:0 1px 3px #000;}
  h1{text-align:center;font-size:26px;margin:30px 0 2px;color:#ffd23f;text-shadow:0 2px 10px #ff8a0044;}
  .sub{text-align:center;color:#b9a6e6;font-weight:bold;font-size:13px;margin-bottom:12px;letter-spacing:.08em;}
  .bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
  .bar button{border:none;font-family:inherit;font-weight:bold;font-size:15px;color:#2a1a00;background:linear-gradient(#ffe07a,#f0b429);padding:11px 16px;border-radius:14px;box-shadow:0 4px 0 #b4801a;}
  .bar button:active{transform:translateY(2px);box-shadow:0 2px 0 #b4801a;}
  .bar .play{background:linear-gradient(#7bff9e,#2ec46a);box-shadow:0 4px 0 #1a7a3f;color:#0a2a12;}
  .sec{font-weight:bold;color:#ffd23f;margin:16px 4px 8px;font-size:15px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .card{position:relative;border-radius:14px;padding:8px 6px 10px;text-align:center;background:#20182e;border:2px solid #3a3352;box-shadow:0 4px 10px #0006;overflow:hidden;}
  .card.gold{border-color:#ffd23f;background:linear-gradient(#3a2e10,#241c0a);}
  .card.purp{border-color:#b06aff;background:linear-gradient(#2a1a3e,#1a1026);}
  .card.blue{border-color:#5ab6ff;background:linear-gradient(#132a3e,#0e1a28);}
  .card.gray{border-color:#8a90a0;}
  .card .rt{position:absolute;top:4px;left:6px;font-weight:bold;font-size:15px;}
  .card.gold .rt{color:#ffd23f;} .card.purp .rt{color:#c89aff;} .card.blue .rt{color:#8fd0ff;} .card.gray .rt{color:#c8cede;}
  .card .em{font-size:38px;line-height:1;margin:8px 0 2px;}
  .card .nm{font-size:12px;font-weight:bold;}
  .card .pos{font-size:10px;color:#9a94b8;}
  .card.inteam{outline:3px solid #7bff9e;}
  .card .star{position:absolute;top:3px;right:5px;font-size:13px;}
  .empty{grid-column:1/-1;text-align:center;color:#8a84a8;padding:18px;font-weight:bold;}
  #line{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px;}
  .slot{aspect-ratio:3/4;border-radius:12px;border:2px dashed #4a4368;background:#1a1428;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#7a749a;}
  .slot .se{font-size:26px;} .slot.filled{border-style:solid;border-color:#7bff9e;color:#fff;}
  /* pack overlay */
  #packov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;padding:16px;}
  #packcards{display:flex;gap:10px;justify-content:center;}
  .pc{width:92px;border-radius:14px;padding:10px 6px;text-align:center;transform:rotateY(90deg);animation:flip .5s forwards;}
  .pc:nth-child(2){animation-delay:.25s;} .pc:nth-child(3){animation-delay:.5s;}
  @keyframes flip{to{transform:rotateY(0);}}
  #packov h2{color:#ffd23f;font-size:22px;margin:0 0 14px;}
  #packov button{margin-top:20px;border:none;font-family:inherit;font-weight:bold;font-size:18px;color:#2a1a00;background:linear-gradient(#ffe07a,#f0b429);padding:12px 26px;border-radius:14px;box-shadow:0 4px 0 #b4801a;}
  .toast{position:fixed;left:0;right:0;bottom:70px;text-align:center;font-weight:bold;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none;z-index:15;}
  .footplay{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0e0b16 40%);display:flex;justify-content:center;z-index:12;}
  .footplay button{border:none;font-family:inherit;font-weight:bold;font-size:20px;color:#0a2a12;background:linear-gradient(#7bff9e,#2ec46a);padding:14px 34px;border-radius:16px;box-shadow:0 5px 0 #1a7a3f;}
  .footplay button:active{transform:translateY(3px);box-shadow:0 2px 0 #1a7a3f;}
</style></head>
<body>
<a class="back" href="../mo-2k26/mo-2k26.html">&#11013; 2K26 Menu</a>
<h1>🃏 MO MyTEAM</h1>
<div class="sub" id="sub">OPEN PACKS · COLLECT · BUILD YOUR STARTING 5</div>
<div class="bar">
  <button id="openBtn">📦 OPEN PACK</button>
  <button id="allBtn">🎁 STARTER PACK</button>
</div>
<div class="sec">⭐ Your Starting 5 <span id="lc" style="color:#9a94b8;font-size:12px;"></span></div>
<div id="line"></div>
<div class="sec">🃏 Your Collection <span id="cc" style="color:#9a94b8;font-size:12px;"></span></div>
<div class="grid" id="coll"></div>
<div class="footplay"><button id="playBtn">▶ PLAY 5v5 with my team</button></div>
<div id="packov"><h2 id="packh">📦 New Cards!</h2><div id="packcards"></div><button id="packclose">AWESOME! ✨</button></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var POOL=[
    {n:'MO',e:'🏀',r:99,p:'PG'},{n:'Arff',e:'🐶',r:93,p:'C'},{n:'Big Mo',e:'🗿',r:91,p:'C'},
    {n:'Dunker',e:'💥',r:92,p:'PF'},{n:'Flash',e:'⚡',r:90,p:'SG'},{n:'Sniper',e:'🎯',r:89,p:'SG'},
    {n:'Buckets',e:'🪣',r:88,p:'SF'},{n:'Daddy',e:'🧑',r:88,p:'PF'},{n:'Mommy',e:'👩',r:87,p:'SF'},
    {n:'Splash',e:'🌊',r:86,p:'SG'},{n:'Glue',e:'🧤',r:84,p:'SF'},{n:'Wall',e:'🧱',r:84,p:'C'},
    {n:'Meow',e:'🐱',r:82,p:'PG'},{n:'Coach Jr',e:'📋',r:80,p:'PG'},{n:'Rook',e:'🐣',r:77,p:'SF'}
  ];
  function rar(r){ return r>=92?'gold':r>=88?'purp':r>=84?'blue':'gray'; }
  var owned={}, lineup=[]; // owned: idx->count
  try{ var s=JSON.parse(localStorage.getItem('moMyTeam')||'{}'); owned=s.owned||{}; lineup=s.line||[]; }catch(e){ owned={}; lineup=[]; }
  function save(){ try{ localStorage.setItem('moMyTeam',JSON.stringify({owned:owned,line:lineup})); }catch(e){} }
  function weight(r){ return r>=92?0.7:r>=88?1.6:r>=84?3.2:5; }
  function pull(){ var tot=0,i; for(i=0;i<POOL.length;i++)tot+=weight(POOL[i].r); var x=Math.random()*tot; for(i=0;i<POOL.length;i++){ x-=weight(POOL[i].r); if(x<=0)return i; } return POOL.length-1; }
  function give(idx){ owned[idx]=(owned[idx]||0)+1; }
  function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.style.opacity='1'; setTimeout(function(){el.style.opacity='0';},1400); }
  function openPack(n){ var got=[]; for(var k=0;k<n;k++){ var idx=pull(); give(idx); got.push(idx); } save(); showPack(got); render(); }
  function showPack(got){ var ov=document.getElementById('packov'), cc=document.getElementById('packcards'); cc.innerHTML='';
    got.forEach(function(idx){ var c=POOL[idx],cl=rar(c.r); var d=document.createElement('div'); d.className='pc card '+cl; d.innerHTML='<div class="rt">'+c.r+'</div><div class="em">'+c.e+'</div><div class="nm">'+c.n+'</div><div class="pos">'+c.p+'</div>'; cc.appendChild(d); });
    ov.style.display='flex'; try{ beep(); }catch(e){} }
  function render(){
    // lineup
    var ln=document.getElementById('line'); ln.innerHTML='';
    for(var i=0;i<5;i++){ var idx=lineup[i]; var s=document.createElement('div'); if(idx==null){ s.className='slot'; s.innerHTML='<div class="se">➕</div>PG/SG/etc'; } else { var c=POOL[idx]; s.className='slot filled'; s.innerHTML='<div class="se">'+c.e+'</div>'+c.n+'<br><b>'+c.r+'</b>'; s.onclick=(function(i){return function(){ lineup.splice(i,1); save(); render(); };})(i); } ln.appendChild(s); }
    document.getElementById('lc').textContent=lineup.length+'/5';
    var ovr=lineup.length?Math.round(lineup.reduce(function(a,b){return a+POOL[b].r;},0)/lineup.length):0;
    document.getElementById('sub').textContent=lineup.length===5?('TEAM OVERALL: '+ovr+' — ready to ball!'):'OPEN PACKS · COLLECT · PICK 5 STARTERS';
    // collection
    var coll=document.getElementById('coll'); coll.innerHTML=''; var keys=Object.keys(owned).filter(function(k){return owned[k]>0;});
    keys.sort(function(a,b){return POOL[b].r-POOL[a].r;});
    document.getElementById('cc').textContent=keys.length+' players';
    if(!keys.length){ coll.innerHTML='<div class="empty">No cards yet — tap 🎁 STARTER PACK to begin!</div>'; }
    keys.forEach(function(k){ var idx=+k,c=POOL[idx],cl=rar(c.r); var inT=lineup.indexOf(idx)>=0; var d=document.createElement('div'); d.className='card '+cl+(inT?' inteam':''); d.innerHTML='<div class="rt">'+c.r+'</div>'+(owned[idx]>1?'<div class="star">x'+owned[idx]+'</div>':'')+'<div class="em">'+c.e+'</div><div class="nm">'+c.n+'</div><div class="pos">'+c.p+(inT?' · ⭐':'')+'</div>';
      d.onclick=function(){ var pos=lineup.indexOf(idx); if(pos>=0){ lineup.splice(pos,1); } else if(lineup.length<5){ lineup.push(idx); } else { toast('Starting 5 is full — tap a starter to remove'); return; } save(); render(); };
      coll.appendChild(d); });
  }
  document.getElementById('openBtn').onclick=function(){ openPack(3); };
  document.getElementById('allBtn').onclick=function(){ openPack(6); toast('🎁 6-card starter pack!'); };
  document.getElementById('packclose').onclick=function(){ document.getElementById('packov').style.display='none'; };
  document.getElementById('playBtn').onclick=function(){ if(lineup.length<5){ toast('Pick 5 starters first! ('+lineup.length+'/5)'); return; } save(); location.href='../mo-2k/mo-2k.html'; };
  var ac; function beep(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); [660,880,990].forEach(function(f,i){ var o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(ac.destination); g.gain.value=0.05; o.start(ac.currentTime+i*0.08); o.stop(ac.currentTime+i*0.08+0.1); }); }catch(e){} }
  render();
})();
</script>
</body></html>
