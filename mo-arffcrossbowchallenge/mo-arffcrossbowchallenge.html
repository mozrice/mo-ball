<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🏹 Arff Crossbow</title>
<meta name="description" content="Play Arff Crossbow in MO ARCADE!">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;font-family:'Trebuchet MS',system-ui,sans-serif;color:#5a3a1a;
    background:linear-gradient(135deg,#D4A574 0%,#E8C4A0 50%,#F5DEB3 100%);}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:10px;}
  #wrap{width:100%;max-width:440px;text-align:center;}
  h1{font-size:22px;margin:2px 0 8px;color:#5a3a1a;}
  #stage{position:relative;width:100%;height:70vh;max-height:560px;min-height:380px;
    border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);background:#F5DEB3;}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .btns{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  a.btn,button.btn{display:inline-block;background:linear-gradient(135deg,#D4A574,#C4956A);color:#fff;
    border:none;padding:11px 18px;font-size:15px;border-radius:12px;cursor:pointer;font-weight:bold;
    text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.2);font-family:inherit;}
  a.btn:active,button.btn:active{transform:translateY(2px);}
</style>
</head>
<body>
<div id="wrap">
  <h1>🏹 Arff Crossbow</h1>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="btns">
    <a class="btn" href="../index.html">← Back</a>
    <a class="btn" href="../mo-home.html">🏠 MO Home</a>
    <a class="btn" href="../games.html">🎮 All Games</a>
  </div>
</div>
<script>
const CFG = {"mode": "target", "emoji": "🏹", "title": "Arff Crossbow", "key": "mo-arffcrossbowchallenge", "time": 45, "hint": "Tap targets fast - small = more points!", "good": ["🎯", "🍎", "🎈"], "bad": [], "quiz": []};
(function(){
  var stage=document.getElementById('stage');
  var cv=document.getElementById('cv');
  var cx=cv.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var W=320,H=440;
  function resize(){ var r=stage.getBoundingClientRect(); W=r.width||320; H=r.height||440; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
  window.addEventListener('resize',resize);

  var AC=null;
  function beep(f,d,t,v){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime; o.type=t||'square'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(v||0.05,n+0.01); g.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.12)); o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n+(d||0.12)+0.03);}catch(e){} }
  function hs(){ try{return parseInt(localStorage.getItem(CFG.key)||'0',10)||0;}catch(e){return 0;} }
  function setHs(s){ try{ if(s>hs()) localStorage.setItem(CFG.key,String(s)); }catch(e){} }

  var state='menu', score=0, best=hs(), timeLeft=CFG.time||45, last=0, combo=0;
  var parts=[];
  function burst(x,y,c){ for(var i=0;i<12;i++){ parts.push({x:x,y:y,vx:(Math.random()*2-1)*140,vy:(Math.random()*2-1)*140-40,life:0.6,c:c||'#ffcf5a'}); } }

  var pointer={x:0,y:0,down:false};
  function pos(e){ var r=cv.getBoundingClientRect(); var t=e.touches&&e.touches[0]?e.touches[0]:e; return {x:(t.clientX-r.left), y:(t.clientY-r.top)}; }
  function onDown(e){ e.preventDefault(); var p=pos(e); pointer.x=p.x;pointer.y=p.y;pointer.down=true; if(AC&&AC.state==='suspended')AC.resume(); handle(p.x,p.y,'down'); }
  function onMove(e){ if(e.cancelable)e.preventDefault(); var p=pos(e); pointer.x=p.x;pointer.y=p.y; handle(p.x,p.y,'move'); }
  function onUp(e){ pointer.down=false; handle(pointer.x,pointer.y,'up'); }
  cv.addEventListener('mousedown',onDown); cv.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
  cv.addEventListener('touchstart',onDown,{passive:false}); cv.addEventListener('touchmove',onMove,{passive:false}); cv.addEventListener('touchend',onUp);
  window.addEventListener('keydown',function(e){ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(state!=='play'){ start(); } else if(CFG.mode==='stack'){ M.stack.pointer(0,0,'down'); } } if(state==='play'&&CFG.mode==='dodge'){ if(e.code==='ArrowLeft') g.px=Math.max(20,g.px-26); if(e.code==='ArrowRight') g.px=Math.min(W-20,g.px+26); } });

  var M={}, g={};

  function start(){ resize(); state='play'; score=0; combo=0; timeLeft=CFG.time||45; parts=[]; M[CFG.mode].init(); last=performance.now(); beep(660,0.09,'square',0.05); }
  function over(){ state='over'; setHs(score); best=hs(); beep(200,0.3,'sawtooth',0.05); }
  function handle(x,y,type){ if(state==='menu'){ if(type==='down') start(); return; } if(state==='over'){ if(type==='down') start(); return; } var m=M[CFG.mode]; if(m.pointer) m.pointer(x,y,type); }

  function loop(t){ var dt=Math.min((t-last)/1000,0.05); last=t;
    if(state==='play'){ timeLeft-=dt; if(timeLeft<=0){ timeLeft=0; over(); } var m=M[CFG.mode]; if(m.update)m.update(dt); }
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=320*dt; }
    render(); requestAnimationFrame(loop);
  }

  function bg(){ var grd=cx.createLinearGradient(0,0,0,H); grd.addColorStop(0,'#F7E4C4'); grd.addColorStop(1,'#E8C4A0'); cx.fillStyle=grd; cx.fillRect(0,0,W,H); }
  function emo(ch,x,y,s){ cx.font=(s||34)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); }
  function text(str,x,y,s,c,a){ cx.fillStyle=c||'#5a3a1a'; cx.font='bold '+(s||18)+'px Trebuchet MS, sans-serif'; cx.textAlign=a||'center'; cx.textBaseline='middle'; cx.fillText(str,x,y); }
  function roundRect(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
  function hud(){ text('⭐ '+score, 12, 20, 20, '#7a4a10','left'); text('⏱ '+Math.ceil(timeLeft), W-12,20,20,'#7a4a10','right'); if(combo>1){ text('🔥 x'+combo, W/2, 20, 18, '#e0453a'); } }

  function render(){ bg();
    if(state==='menu'){ emo(CFG.emoji, W/2, H*0.30, 74); text(CFG.title, W/2, H*0.49, 21, '#5a3a1a'); text('Best: '+best, W/2, H*0.57, 16, '#a06a30');
      cx.fillStyle='#D4A574'; roundRect(W/2-88,H*0.65,176,54,15); cx.fill(); text('▶ TAP TO PLAY', W/2, H*0.65+27, 18, '#fff');
      wrapText(CFG.hint||'', W/2, H*0.82, 14, W-50, '#8a6a40'); }
    else if(state==='play'){ var m=M[CFG.mode]; if(m.render)m.render(); hud(); }
    else { emo('🏆', W/2, H*0.27, 62); text('Score: '+score, W/2, H*0.44, 26, '#5a3a1a'); text('Best: '+best, W/2, H*0.52, 18, '#a06a30'); if(score>=best&&score>0) text('🎉 NEW BEST!', W/2, H*0.6, 18, '#e0453a');
      cx.fillStyle='#D4A574'; roundRect(W/2-88,H*0.68,176,54,15); cx.fill(); text('↻ PLAY AGAIN', W/2, H*0.68+27, 18, '#fff'); }
    for(var i=0;i<parts.length;i++){ var p=parts[i]; cx.globalAlpha=Math.max(p.life,0); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,4,0,7); cx.fill(); } cx.globalAlpha=1;
  }
  function wrapText(str,cx0,cy0,size,maxw,col){ cx.font='bold '+size+'px Trebuchet MS, sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillStyle=col||'#5a3a1a'; var words=str.split(' '); var line='',lines=[]; for(var i=0;i<words.length;i++){ var test=line?line+' '+words[i]:words[i]; if(cx.measureText(test).width>maxw&&line){ lines.push(line); line=words[i]; } else line=test; } if(line)lines.push(line); for(var i=0;i<lines.length;i++){ cx.fillText(lines[i], cx0, cy0+i*(size+4)); } }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  // ===== CATCH =====
  M.catch={
    init:function(){ g.items=[]; g.spawn=0; },
    update:function(dt){ g.spawn-=dt; if(g.spawn<=0){ g.spawn=0.5+Math.random()*0.4; var good=Math.random()>0.28||CFG.bad.length===0; var arr=good?CFG.good:CFG.bad; var ch=arr[(Math.random()*arr.length)|0]; g.items.push({x:26+Math.random()*(W-52),y:-28,ch:ch,good:good,v:80+Math.random()*70+(CFG.time-timeLeft)*1.4}); }
      for(var i=g.items.length-1;i>=0;i--){ var it=g.items[i]; it.y+=it.v*dt; if(it.y>H+30){ g.items.splice(i,1); if(it.good) combo=0; } } },
    render:function(){ for(var i=0;i<g.items.length;i++){ emo(g.items[i].ch, g.items[i].x, g.items[i].y, 40); } },
    pointer:function(x,y,type){ if(type!=='down')return; for(var i=g.items.length-1;i>=0;i--){ var it=g.items[i]; if(Math.abs(x-it.x)<30&&Math.abs(y-it.y)<30){ g.items.splice(i,1); if(it.good){ combo++; score+=10+Math.min(combo,10); burst(x,y,'#7bd07b'); beep(600+combo*22,0.08,'square',0.05);} else { score=Math.max(0,score-15); combo=0; burst(x,y,'#e0453a'); beep(150,0.16,'sawtooth',0.05);} return; } } }
  };

  // ===== TARGET =====
  M.target={
    init:function(){ g.t=null; g.next=0.3; },
    update:function(dt){ if(!g.t){ g.next-=dt; if(g.next<=0){ g.t={x:40+Math.random()*(W-80),y:60+Math.random()*(H-140),life:1.25,ch:CFG.good[(Math.random()*CFG.good.length)|0]}; } return; } g.t.life-=dt; if(g.t.life<=0){ g.t=null; g.next=0.25; combo=0; } },
    render:function(){ if(g.t){ var r=22+g.t.life*26; cx.fillStyle='rgba(224,69,58,.25)'; cx.beginPath(); cx.arc(g.t.x,g.t.y,r+6,0,7); cx.fill(); cx.fillStyle='#e0453a'; cx.beginPath(); cx.arc(g.t.x,g.t.y,r,0,7); cx.fill(); cx.fillStyle='#fff'; cx.beginPath(); cx.arc(g.t.x,g.t.y,r*0.62,0,7); cx.fill(); emo(g.t.ch, g.t.x, g.t.y, r*1.1); } },
    pointer:function(x,y,type){ if(type!=='down'||!g.t)return; var r=22+g.t.life*26; if(Math.hypot(x-g.t.x,y-g.t.y)<r+10){ combo++; score+=10+Math.round((1.25-g.t.life)*16)+Math.min(combo,10); burst(g.t.x,g.t.y,'#ffcf5a'); beep(700+combo*16,0.08,'square',0.06); g.t=null; g.next=0.18; } }
  };

  // ===== MEMORY =====
  M.memory={
    init:function(){ var pool=CFG.good.slice(0,6); var deck=shuffle(pool.concat(pool)); g.cards=deck.map(function(c){return {ch:c,face:false,done:false,_x:0,_y:0,_w:0,_h:0};}); g.sel=[]; g.lock=0; g.cols=3; g.rows=4; },
    update:function(dt){ if(g.lock>0){ g.lock-=dt; if(g.lock<=0&&g.sel.length===2){ var a=g.cards[g.sel[0]],b=g.cards[g.sel[1]]; if(a.ch===b.ch){ a.done=b.done=true; combo++; score+=25+Math.min(combo,8)*2; burst(W/2,H/2,'#7bd07b'); beep(760,0.1,'square',0.06);} else { a.face=b.face=false; combo=0; } g.sel=[]; var done=true; for(var i=0;i<g.cards.length;i++){ if(!g.cards[i].done){done=false;break;} } if(done){ score+=Math.ceil(timeLeft)*3; over(); } } } },
    render:function(){ var pad=10, gw=(W-pad*(g.cols+1))/g.cols, gh=(H-56-pad*(g.rows+1))/g.rows; for(var i=0;i<g.cards.length;i++){ var c=g.cards[i]; var col=i%g.cols, row=(i/g.cols)|0; var x=pad+col*(gw+pad), y=44+pad+row*(gh+pad); c._x=x;c._y=y;c._w=gw;c._h=gh; if(c.done)cx.globalAlpha=0.35; cx.fillStyle=(c.face||c.done)?'#fff':'#D4A574'; roundRect(x,y,gw,gh,10); cx.fill(); if(c.face||c.done){ emo(c.ch, x+gw/2, y+gh/2, Math.min(gw,gh)*0.55);} else { emo('❓', x+gw/2, y+gh/2, Math.min(gw,gh)*0.4);} cx.globalAlpha=1; } },
    pointer:function(x,y,type){ if(type!=='down'||g.lock>0)return; for(var i=0;i<g.cards.length;i++){ var c=g.cards[i]; if(c.done||c.face)continue; if(x>c._x&&x<c._x+c._w&&y>c._y&&y<c._y+c._h){ c.face=true; g.sel.push(i); beep(520,0.06,'square',0.05); if(g.sel.length===2) g.lock=0.65; return; } } }
  };

  // ===== RHYTHM =====
  M.rhythm={
    init:function(){ g.pos=0; g.dir=1; g.speed=0.85; g.zone=0.5; g.zw=0.17; g.hits=0; g.total=0; },
    update:function(dt){ g.pos+=g.dir*g.speed*dt; if(g.pos>1){g.pos=1;g.dir=-1;} if(g.pos<0){g.pos=0;g.dir=1;} },
    render:function(){ emo(CFG.emoji, W/2, H*0.28, 56); text('Hits: '+g.hits+'/'+g.total, W/2, H*0.42, 18); var bx=28,bw=W-56,by=H*0.55,bh=28; cx.fillStyle='#c9a878'; roundRect(bx,by,bw,bh,14); cx.fill(); var zx=bx+(g.zone-g.zw/2)*bw, zw=g.zw*bw; cx.fillStyle='#7bd07b'; roundRect(zx,by,zw,bh,14); cx.fill(); var px=bx+g.pos*bw; cx.fillStyle='#e0453a'; cx.fillRect(px-3,by-9,6,bh+18); text('TAP in the green!', W/2, H*0.68, 15, '#8a6a40'); },
    pointer:function(x,y,type){ if(type!=='down')return; g.total++; if(Math.abs(g.pos-g.zone)<g.zw/2){ g.hits++; combo++; score+=20+Math.min(combo,10)*2; burst(W/2,H*0.55,'#7bd07b'); beep(700+combo*20,0.1,'square',0.06); g.speed=Math.min(g.speed+0.06,2.3); g.zone=0.2+Math.random()*0.6; } else { combo=0; beep(150,0.16,'sawtooth',0.05); } }
  };

  // ===== DODGE =====
  M.dodge={
    init:function(){ g.px=W/2; g.obs=[]; g.coins=[]; g.spawn=0; },
    update:function(dt){ if(pointer.down){ g.px+=(pointer.x-g.px)*Math.min(dt*13,1); } if(g.px<20)g.px=20; if(g.px>W-20)g.px=W-20; g.spawn-=dt; if(g.spawn<=0){ g.spawn=0.55+Math.random()*0.35; g.obs.push({x:24+Math.random()*(W-48),y:-24,v:130+(CFG.time-timeLeft)*3,ch:CFG.bad[(Math.random()*CFG.bad.length)|0]}); if(Math.random()>0.4) g.coins.push({x:24+Math.random()*(W-48),y:-24,v:140}); }
      var py=H-52;
      for(var i=g.obs.length-1;i>=0;i--){ var o=g.obs[i]; o.y+=o.v*dt; if(o.y>H+24){g.obs.splice(i,1);} else if(Math.abs(o.x-g.px)<26&&Math.abs(o.y-py)<26){ g.obs.splice(i,1); score=Math.max(0,score-10); combo=0; burst(g.px,py,'#e0453a'); beep(150,0.2,'sawtooth',0.05);} }
      for(var i=g.coins.length-1;i>=0;i--){ var c=g.coins[i]; c.y+=c.v*dt; if(c.y>H+24){g.coins.splice(i,1);} else if(Math.abs(c.x-g.px)<26&&Math.abs(c.y-py)<26){ g.coins.splice(i,1); combo++; score+=10+Math.min(combo,10); burst(g.px,py,'#ffcf5a'); beep(600+combo*20,0.08,'square',0.05);} } },
    render:function(){ for(var i=0;i<g.coins.length;i++) emo('⭐',g.coins[i].x,g.coins[i].y,28); for(var i=0;i<g.obs.length;i++) emo(g.obs[i].ch||'💣',g.obs[i].x,g.obs[i].y,34); emo(CFG.emoji,g.px,H-52,46); text('Drag to move',W/2,H-16,12,'#8a6a40'); }
  };

  // ===== STACK =====
  M.stack={
    init:function(){ g.blocks=[{x:W/2-48,w:96}]; g.cur={x:0,w:96,dir:1,speed:130}; },
    update:function(dt){ g.cur.x+=g.cur.dir*g.cur.speed*dt; if(g.cur.x+g.cur.w>W){g.cur.x=W-g.cur.w;g.cur.dir=-1;} if(g.cur.x<0){g.cur.x=0;g.cur.dir=1;} },
    render:function(){ var bh=26; for(var i=0;i<g.blocks.length;i++){ var b=g.blocks[i]; var y=H-42-i*bh; cx.fillStyle=i%2?'#D4A574':'#C4956A'; roundRect(b.x,y,b.w,bh-3,6); cx.fill(); } var cy=H-42-g.blocks.length*bh; cx.fillStyle='#e0453a'; roundRect(g.cur.x,cy,g.cur.w,bh-3,6); cx.fill(); text('Height: '+g.blocks.length, W/2, 20, 18,'#7a4a10'); text('Tap to drop!', W/2, H-14, 12, '#8a6a40'); },
    pointer:function(x,y,type){ if(type!=='down')return; var top=g.blocks[g.blocks.length-1]; var left=Math.max(g.cur.x,top.x); var right=Math.min(g.cur.x+g.cur.w, top.x+top.w); var ov=right-left; if(ov<=4){ over(); return; } g.blocks.push({x:left,w:ov}); combo++; score+=10+Math.round(ov/96*10); burst(left+ov/2, H-42-g.blocks.length*26, '#7bd07b'); beep(500+g.blocks.length*18,0.08,'square',0.05); g.cur={x:0,w:ov,dir:1,speed:130+g.blocks.length*7}; }
  };

  // ===== QUIZ =====
  M.quiz={
    init:function(){ g.qs=shuffle(CFG.quiz.slice()); g.i=0; g.q=null; nextQ(); },
    update:function(dt){},
    render:function(){ if(!g.q)return; text('Q'+(g.i)+' / '+g.qs.length, W/2, 30, 14,'#a06a30'); wrapText(g.q.q, W/2, 78, 19, W-40, '#5a3a1a'); for(var k=0;k<g.q.opts.length;k++){ var by=140+k*60; cx.fillStyle='#fff'; roundRect(20,by,W-40,50,11); cx.fill(); cx.strokeStyle='#D4A574'; cx.lineWidth=2; roundRect(20,by,W-40,50,11); cx.stroke(); text(g.q.opts[k], W/2, by+25, 17, '#5a3a1a'); } },
    pointer:function(x,y,type){ if(type!=='down'||!g.q)return; for(var k=0;k<g.q.opts.length;k++){ var by=140+k*60; if(y>by&&y<by+50){ if(k===g.q.a){ combo++; score+=20+Math.min(combo,10)*2; burst(W/2,by+25,'#7bd07b'); beep(720,0.1,'square',0.06);} else { combo=0; score=Math.max(0,score-5); beep(150,0.16,'sawtooth',0.05);} nextQ(); return; } } }
  };
  function nextQ(){ if(g.i>=g.qs.length){ score+=Math.ceil(timeLeft)*2; over(); return; } g.q=g.qs[g.i]; g.i++; }

  // ===== SHOT (aim -> power -> green) =====
  M.shot={
    init:function(){ g.PROJ=CFG.proj||CFG.emoji; g.GOAL=CFG.goal||'🥅'; g.GW=(CFG.goalW||0.4); g.KEEP=!!CFG.keeper;
      g.phase='aim'; g.aimX=W/2; g.power=0; g.pdir=1; g.gpos=0; g.gdir=1; g.keeperX=W/2; g.kdir=1; g.proj=null; g.lockPower=0.75; g.greenHit=0; g.msg=''; g.msgT=0; g.result=''; g.gY=80; },
    update:function(dt){
      if(g.KEEP){ var gw=g.GW*W, lo=(W-gw)/2+18, hi=(W+gw)/2-18; g.keeperX+=g.kdir*100*dt; if(g.keeperX>hi){g.keeperX=hi;g.kdir=-1;} if(g.keeperX<lo){g.keeperX=lo;g.kdir=1;} }
      if(g.phase==='power'){ g.power+=g.pdir*1.25*dt; if(g.power>1){g.power=1;g.pdir=-1;} if(g.power<0){g.power=0;g.pdir=1;} }
      else if(g.phase==='green'){ g.gpos+=g.gdir*1.05*dt; if(g.gpos>1){g.gpos=1;g.gdir=-1;} if(g.gpos<0){g.gpos=0;g.gdir=1;} }
      else if(g.phase==='fly'){ g.proj.t+=dt*1.7; if(g.proj.t>=1) resolveShot(); }
      if(g.msgT>0)g.msgT-=dt;
    },
    render:function(){
      var gw=g.GW*W, gx=(W-gw)/2, gy=g.gY;
      cx.fillStyle='rgba(224,69,58,.14)'; roundRect(gx,gy-28,gw,56,10); cx.fill();
      emo(g.GOAL, W/2, gy, 50);
      if(g.KEEP) emo('🧤', g.keeperX, gy+8, 32);
      emo(g.PROJ, W/2, H-58, 42);
      if(g.phase==='aim'){ cx.strokeStyle='#5a3a1a'; cx.lineWidth=2; cx.setLineDash([6,6]); cx.beginPath(); cx.moveTo(W/2,H-72); cx.lineTo(g.aimX,gy+22); cx.stroke(); cx.setLineDash([]); emo('🎯',g.aimX,gy+24,20); text('DRAG to aim, let go',W/2,H-14,14,'#8a6a40'); }
      else if(g.phase==='power'){ var bx=W-38,by=110,bh=H-230; cx.fillStyle='#c9a878'; roundRect(bx,by,22,bh,8); cx.fill(); var ph=g.power*bh; cx.fillStyle='#7bd07b'; roundRect(bx,by+bh-ph,22,ph,8); cx.fill(); cx.strokeStyle='#e0453a'; cx.lineWidth=3; var sy=by+bh-0.75*bh; cx.beginPath(); cx.moveTo(bx-6,sy); cx.lineTo(bx+28,sy); cx.stroke(); text('TAP to set POWER',W/2,H-14,14,'#8a6a40'); }
      else if(g.phase==='green'){ var bx2=30,bw=W-60,by2=H*0.6,bh2=26; cx.fillStyle='#c9a878'; roundRect(bx2,by2,bw,bh2,13); cx.fill(); var zw=0.16*bw, zx=bx2+(0.5-0.08)*bw; cx.fillStyle='#7bd07b'; roundRect(zx,by2,zw,bh2,13); cx.fill(); var px=bx2+g.gpos*bw; cx.fillStyle='#e0453a'; cx.fillRect(px-3,by2-9,6,bh2+18); text('TAP in the GREEN!',W/2,H*0.72,15,'#8a6a40'); }
      else if(g.phase==='fly'){ var t=g.proj.t; var x=W/2+(g.proj.endX-W/2)*t; var y=(H-58)+(gy-(H-58))*t; var arc=Math.sin(t*Math.PI)*70; emo(g.PROJ,x,y-arc,38); }
      if(g.msgT>0) text(g.msg, W/2, H*0.4, 30, g.result==='make'?'#2a8a2a':'#e0453a');
    },
    pointer:function(x,y,type){
      if(g.phase==='aim'){ if(type==='down'||type==='move'){ g.aimX=Math.max(28,Math.min(W-28,x)); } else if(type==='up'){ g.phase='power'; g.power=0; g.pdir=1; } return; }
      if(type!=='down')return;
      if(g.phase==='power'){ g.lockPower=g.power; g.phase='green'; g.gpos=0; g.gdir=1; beep(500,0.07,'square',0.05); }
      else if(g.phase==='green'){ g.greenHit=Math.abs(g.gpos-0.5); var dev=g.greenHit*W*0.9*(Math.random()<0.5?-1:1); g.proj={t:0,endX:g.aimX+dev,powerOff:Math.abs(g.lockPower-0.75)}; g.phase='fly'; beep(660,0.08,'square',0.05); }
    }
  };
  function resolveShot(){
    var gw=g.GW*W, gx=(W-gw)/2, p=g.proj;
    var made = p.endX>gx+8 && p.endX<gx+gw-8 && p.powerOff<0.3;
    if(made && g.KEEP && Math.abs(p.endX-g.keeperX)<26) made=false;
    if(made){ combo++; var acc=Math.max(0,(0.12-Math.min(g.greenHit,0.12))/0.12); var pts=15+Math.round(acc*15)+Math.min(combo,10); score+=pts; g.msg='SCORE! +'+pts; g.result='make'; burst(p.endX,g.gY,'#7bd07b'); beep(760,0.12,'square',0.06); }
    else { combo=0; g.msg=(p.powerOff>=0.3?'Missed!':'Blocked!'); g.result='miss'; beep(150,0.2,'sawtooth',0.05); }
    g.msgT=0.9; g.phase='aim'; g.aimX=W/2;
  }

  resize();
  last=performance.now();
  requestAnimationFrame(loop);
})();
</script>
