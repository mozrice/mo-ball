<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Stadium Builder</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#0e1424;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#bcd0ea;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:17px;font-weight:bold;color:#ffd23f;pointer-events:none;}
  #tools{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:8px;background:#0a1224dd;}
  .tool{font-size:22px;background:#26325a;border:2px solid #3a4a7a;border-radius:12px;padding:6px 9px;font-family:inherit;color:#fff;}
  .tool.sel{border-color:#ffd23f;background:#3a4a2a;}
  .act{font-size:14px;font-weight:bold;background:#1a9a5a;border:none;border-radius:12px;padding:8px 10px;color:#fff;font-family:inherit;}
  #cheer{background:#e0662a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🏟️ Build your stadium! &nbsp; 👥<span id="fans">0</span></div>
<canvas id="c"></canvas>
<div id="tools">
  <button class="tool sel" data-t="seat">💺</button>
  <button class="tool" data-t="fan">🧑</button>
  <button class="tool" data-t="light">💡</button>
  <button class="tool" data-t="flag">🚩</button>
  <button class="tool" data-t="board">🔢</button>
  <button class="tool" data-t="erase">🧽</button>
  <button class="act" id="cheer">📣 CHEER!</button>
  <button class="act" id="clear">🧹</button>
</div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var items=[], tool='seat', cheerT=0;
  var EMO={seat:'💺',fan:'🧑',light:'💡',flag:'🚩',board:'🔢'};
  var tools=document.querySelectorAll('.tool'); for(var i=0;i<tools.length;i++){ (function(b){ b.onclick=function(){ for(var j=0;j<tools.length;j++)tools[j].classList.remove('sel'); b.classList.add('sel'); tool=b.dataset.t; }; })(tools[i]); }
  function place(e){ var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); var x=t0.clientX-r.left,y=t0.clientY-r.top; if(y>H-64)return;
    if(tool==='erase'){ for(var i=items.length-1;i>=0;i--){ if(Math.hypot(items[i].x-x,items[i].y-y)<24){ items.splice(i,1); updateFans(); break; } } }
    else { items.push({x:x,y:y,e:EMO[tool],t:tool,bob:Math.random()*6.28}); updateFans(); } }
  function updateFans(){ var n=0; for(var i=0;i<items.length;i++)if(items[i].t==='fan'||items[i].t==='seat')n++; document.getElementById('fans').textContent=n; }
  cv.addEventListener('touchstart',function(e){place(e);e.preventDefault();},{passive:false});
  cv.addEventListener('mousedown',function(e){place(e);});
  document.getElementById('cheer').onclick=function(){ cheerT=90; beep(500,0.1); setTimeout(function(){beep(700,0.1);},100); setTimeout(function(){beep(900,0.15);},200); };
  document.getElementById('clear').onclick=function(){ items=[]; updateFans(); };
  function loop(){ if(cheerT>0)cheerT--; draw(); requestAnimationFrame(loop); }
  function draw(){ var lit=false; for(var i=0;i<items.length;i++)if(items[i].t==='light'){lit=true;break;}
    ctx.fillStyle=lit?'#1a2b1a':'#0e2410'; ctx.fillRect(0,0,W,H*0.62);
    ctx.fillStyle='#2f7a3f'; ctx.fillRect(W*0.12,H*0.14,W*0.76,H*0.4); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(W*0.12,H*0.14,W*0.76,H*0.4); ctx.beginPath(); ctx.moveTo(W*0.5,H*0.14); ctx.lineTo(W*0.5,H*0.54); ctx.stroke(); ctx.beginPath(); ctx.arc(W*0.5,H*0.34,26,0,6.29); ctx.stroke();
    ctx.fillStyle='#20304a'; ctx.fillRect(0,H*0.62,W,H*0.38-60);
    for(var i=0;i<items.length;i++){ var it=items[i]; var yb=(it.t==='fan'&&cheerT>0)?Math.abs(Math.sin((cheerT+it.bob*10)*0.3))*8:0; ctx.font='24px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(it.e,it.x,it.y-yb); }
    if(cheerT>0){ ctx.fillStyle='#ffd23f'; ctx.font='bold 26px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('📣 GO MO! 🎉',W/2,H*0.09); for(var k=0;k<3;k++){ ctx.font='20px sans-serif'; ctx.fillText(['🎉','🎊','⭐'][k%3],W*0.2+k*W*0.3,H*0.1+(cheerT%20)); } }
    ctx.fillStyle='#fff9'; ctx.font='12px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('👆 Place seats & fans in the stands, add 💡 lights, then CHEER!',W/2,H-72); }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(ac.destination); g.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
