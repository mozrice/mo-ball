  function rr(rx,ry,rw,rh,r){ x.beginPath(); x.moveTo(rx+r,ry); x.arcTo(rx+rw,ry,rx+rw,ry+rh,r); x.arcTo(rx+rw,ry+rh,rx,ry+rh,r); x.arcTo(rx,ry+rh,rx,ry,r); x.arcTo(rx,ry,rx+rw,ry,r); x.closePath(); }
  function sky(){ var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#5bb0ff'); g.addColorStop(0.62,'#bfe6ff'); x.fillStyle=g; x.fillRect(0,0,W,H*0.64);
    x.fillStyle='#ffd23f'; x.beginPath(); x.arc(W*0.85,H*0.13,W*0.055,0,7); x.fill();
    clouds.forEach(function(cl){ cl.fx+=cl.v*0.01; if(cl.fx>1.15)cl.fx=-0.15; cloud(cl.fx*W,cl.fy*H,W*0.05*cl.s); });
    x.strokeStyle='rgba(30,50,80,0.5)'; x.lineWidth=2; for(var b=0;b<5;b++){ var bx=((t*26+b*90)%(W+80))-40, by=H*(0.08+0.05*(b%2)); x.beginPath(); x.moveTo(bx-7,by); x.lineTo(bx,by-5); x.lineTo(bx+7,by); x.stroke(); } }
  function cloud(cx,cy,r){ x.fillStyle='rgba(255,255,255,0.92)'; x.beginPath(); x.arc(cx,cy,r,0,7); x.arc(cx+r,cy+4,r*0.8,0,7); x.arc(cx-r,cy+4,r*0.8,0,7); x.arc(cx,cy+6,r*0.9,0,7); x.fill(); }
  function plane(px,py,s){ x.save(); x.translate(px,py);
    x.fillStyle='#e8edf5'; rr(-18*s,-5*s,40*s,11*s,5*s); x.fill(); x.beginPath(); x.moveTo(22*s,-4*s); x.lineTo(30*s,0); x.lineTo(22*s,4*s); x.closePath(); x.fill();
    x.fillStyle='#7bd0ff'; x.beginPath(); x.moveTo(-16*s,-4*s); x.lineTo(-26*s,-14*s); x.lineTo(-8*s,-4*s); x.closePath(); x.fill();
    x.fillStyle='#2a90e0'; x.beginPath(); x.moveTo(-4*s,4*s); x.lineTo(-16*s,16*s); x.lineTo(8*s,4*s); x.closePath(); x.fill();
    x.restore(); }
  function person(px,py,s,col,dir){ x.save(); x.translate(px,py); x.scale(dir||1,1);
    x.fillStyle='#23324a'; x.fillRect(-4*s,6*s,3*s,10*s); x.fillRect(1*s,6*s,3*s,10*s);

    x.fillStyle='#2a1a12'; x.beginPath(); x.arc(0,-13*s,5*s,Math.PI,0); x.fill();
    x.restore(); }
  function dogArff(px,py,s){ x.save(); var jy=(arffAction==='jump'&&arffActT>0)?-Math.abs(Math.sin((1.6-arffActT)*7))*15*s:0;
    x.translate(px+(arffBite>0?Math.sin(t*40)*4*s:0), py+jy);

    x.fillStyle='#fff';
    if(arffAction==='sit'){ rr(-6*s,-9*s,12*s,11*s,4*s); x.fill(); x.beginPath(); x.arc(0,-13*s,5*s,0,7); x.fill();
      x.fillStyle='#2a2a2a'; x.beginPath(); x.arc(-1.8*s,-14*s,1.2*s,0,7); x.arc(2.4*s,-14*s,1.2*s,0,7); x.fill();
      x.fillStyle='#fff'; rr(-7*s,0,14*s,4*s,2*s); x.fill(); x.fillStyle='#e0453a'; x.fillRect(-4*s,-10*s,8*s,2*s);
    } else if(arffAction==='swim'){ rr(-9*s,-1*s,18*s,7*s,4*s); x.fill(); x.beginPath(); x.arc(9*s,-3*s,5*s,0,7); x.fill();
      x.fillStyle='#2a2a2a'; x.beginPath(); x.arc(11*s,-4*s,1.2*s,0,7); x.fill(); x.fillStyle='#ff6a8a'; x.fillRect(13*s,-2*s,4*s,3*s);
      x.fillStyle='#fff'; var pd=Math.sin(t*12)*2.5*s; x.fillRect(-6*s,5*s+pd,3*s,4*s); x.fillRect(2*s,5*s-pd,3*s,4*s);

      if(arffAction==='shake'&&arffActT>0){ x.strokeStyle='#fff'; x.lineWidth=3*s; x.beginPath(); x.moveTo(6*s,4*s); x.lineTo(11*s,-2*s+Math.sin(t*20)*3*s); x.stroke(); }

    x.fillStyle='#d6c9ac'; x.beginPath(); x.moveTo(hx-hw*0.07,hy-hh); x.lineTo(hx+hw/2,hy-hh*1.32); x.lineTo(hx+hw*1.07,hy-hh); x.closePath(); x.fill();

    x.fillStyle='#0b2a4a'; x.font='bold '+Math.round(W*0.036)+'px Trebuchet MS'; x.fillText('Fly to a city and walk around!', W/2, H*0.215); }
  function drawFly(){ sky(); x.textAlign='center'; x.fillStyle='#0b2a4a'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.fillText('✈️ Flying to '+dest+'!', W/2, H*0.16);
    plane(planeX,H*0.4,Math.max(1.6,W*0.011)); planeX+=W*0.012; flyT+=0.016; if(planeX>W*1.2||flyT>2.2)land(); }

  function loop(){ t+=0.016; if(msgT>0)msgT-=0.016; if(arffBite>0)arffBite-=0.016;
    if(arffActT>0){ arffActT-=0.016; if(arffActT<=0&&(arffAction==='roll'||arffAction==='jump'||arffAction==='shake'))arffAction=''; }
    if(scene==='live'){ var sp=player.mode==='walk'?W*0.006:(player.mode==='bus'?W*0.014:W*0.02);
      if(jx){ player.x+=jx*sp; player.dir=jx<0?-1:1; } player.x=Math.max(W*0.06,Math.min(worldW-W*0.06,player.x)); camX=Math.max(0,Math.min(worldW-W,player.x-W/2));
      happy=Math.min(100,happy+Math.abs(jx)*0.05);
      for(var bi=0;bi<buildings.length;bi++){ var bh2=buildings[bi]; if(bh2.kind==='hotel'&&!bh2.collected&&Math.abs(player.x-(bh2.x+bh2.w/2))<bh2.w*0.85){ bh2.collected=true; collectHotel(bh2); }
        if(!hasBook&&bh2.kind==='library'&&Math.abs(player.x-(bh2.x+bh2.w/2))<bh2.w*0.85){ hasBook=true; msg="📖 Puppy Training Book! Now Arff will listen! 🐶"; msgT=2.6; beep(1200); beep(1550); say("Now Arff will listen!"); } } }
    if(scene==='hotel'||scene==='room'){ var hsp=W*0.006; if(jx){ player.x+=jx*hsp; player.dir=jx<0?-1:1; } player.x=Math.max(W*0.06,Math.min(hotelRoomW-W*0.06,player.x)); camX=Math.max(0,Math.min(Math.max(0,hotelRoomW-W),player.x-W/2)); }
    if(scene==='pick')drawPick(); else if(scene==='fly')drawFly(); else if(scene==='switch')drawSwitch(); else if(scene==='hotel')drawHotelIn(); else if(scene==='room')drawRoom(); else drawWorld();
    requestAnimationFrame(loop); }
  loop();

  function collectHotel(b){ var room=b.room||(100+Math.floor(Math.random()*899)); myHotels.push({name:b.name,city:dest,stars:b.stars,value:b.value,room:room}); saveHotels(); msg='🔑 Room Card! '+b.stars+'★ Room '+room+'  +$'+commas(b.value); msgT=2.4; beep(1300); beep(1650); updateCardsBtn(); say('You got a room card!'); }
  function updateCardsBtn(){ var c=document.getElementById('cardsBtn'); if(c)c.textContent='🏨 $'+commas(netWorth()); }
  function renderCards(){ var g=document.getElementById('cardsGrid'); g.innerHTML=''; document.getElementById('cardsTot').innerHTML='💰 Net Worth: <b>$'+commas(netWorth())+'</b> · '+myHotels.length+' room cards';
    if(!myHotels.length){ g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#9ab;padding:16px">Walk into 🏨 HOTELS in big cities to get Room Cards!</div>'; return; }
    var chg=false; myHotels.slice().reverse().forEach(function(hh){ if(!hh.room){ hh.room=100+Math.floor((hh.value%899)); chg=true; } var col=['#a06a3a','#9aa0ad','#e0a020','#7fc8f0','#c86aff'][Math.min(4,hh.stars-1)]; var d=document.createElement('div'); d.className='hcard'; d.style.background='linear-gradient(140deg,'+col+',#ffffffbb)';
      d.innerHTML='<div class="hkey">🔑 ROOM '+hh.room+'</div><div class="hstripe"></div><div class="hn">🏨 '+hh.city+'</div><div class="hs">'+Array(hh.stars+1).join('★')+'</div><div class="hv">$'+commas(hh.value)+'</div>'; g.appendChild(d); });
    if(chg)saveHotels(); }
  function flyTo(name){ dest=name; pop=popReal(name); snowy=!!SNOWSET[name]; cityN=Math.max(0,Math.min(SKY.length,Math.round(pop/1400000))); cityHmax=0.13+Math.min(0.42,pop/40000000*0.42);
    document.getElementById('statesov').style.display='none';
    scene='fly'; planeX=-W*0.2; flyT=0; ui('fly'); hint('✈️ '+dest+'...'); beep(700); say('Flying to '+name+'!'); }
  function land(){ buildWorld(); happy=0; scene='live'; ui('live'); hint('Walk with the joystick! Tap a 🏨 hotel to go inside!'); beep(900); say('Welcome to '+dest+'!'); }

  function ui(s){ document.getElementById('pick').style.display=s==='pick'?'flex':'none';
    document.getElementById('stick').style.display=(s==='live'||s==='hotel'||s==='room')?'block':'none';
    document.getElementById('ride').style.display=s==='live'?'flex':'none';
    var sb=document.getElementById('swback'); sb.style.display=(s==='switch'||s==='hotel'||s==='room')?'block':'none'; sb.textContent=(s==='hotel'||s==='room')?'🚪 Exit':'✖ Stop';
    var eb=document.getElementById('elevBtn'); if(eb){ eb.style.display=(s==='hotel'||s==='room')?'block':'none'; eb.textContent=s==='room'?'🛗 Go Down':'🛗 My Room'; }
    if(s!=='live'&&s!=='hotel'&&s!=='room'){ jx=0; knob(); } markMode(); }
  function markMode(){ document.getElementById('carBtn').classList.toggle('on',player.mode==='car'); document.getElementById('busBtn').classList.toggle('on',player.mode==='bus'); }

  function setMode(m){ player.mode=(player.mode===m)?'walk':m; markMode(); beep(700); }
  document.getElementById('carBtn').onclick=function(){ setMode('car'); };
  document.getElementById('busBtn').onclick=function(){ setMode('bus'); };
  document.getElementById('swBtn').onclick=function(){ scene='switch'; switchStart(); ui('switch'); beep(900); say('Playing Switch 2!'); };
  document.getElementById('swback').onclick=function(){ if((scene==='hotel'||scene==='room')&&streetX!=null){ player.x=streetX; camX=Math.max(0,Math.min(worldW-W,player.x-W/2)); } scene='live'; ui('live'); beep(500); happy=Math.min(100,happy+20); };
  document.getElementById('elevBtn').onclick=function(){ if(scene==='hotel'){ scene='room'; player.x=W*0.3; hotelRoomW=W*1.6; camX=0; ui('room'); hint('Your room! Nice view 🌆'); beep(1050); say('Going up!'); } else if(scene==='room'){ scene='hotel'; player.x=W*0.3; hotelRoomW=W*1.8; camX=0; ui('hotel'); hint('Swim in the pool! 🏊'); beep(900); say('Going down!'); } };
  document.getElementById('flyBtn').onclick=function(){ scene='pick'; ui('pick'); hint('Pick a new place to fly!'); beep(500); };
  function updateArffBtn(){ var b=document.getElementById('sitBtn'); if(b){ var tk=arffTricks[arffTi]; b.textContent='🐶 Teach '+tk.replace(/^./,function(c){return c.toUpperCase();}); } }
  document.getElementById('sitBtn').onclick=function(){
    if(!hasBook){ arffBite=0.9; arffAction=''; msg="Arff won't listen! 😝 Get the 📖 Book at the LIBRARY!"; msgT=2.4; beep(200); say("Arff, listen!"); return; }
    var tr=arffTricks[arffTi]; arffTi=(arffTi+1)%arffTricks.length; arffLearn[tr]=1; arffAction=tr; arffActT=1.6;
    var m={sit:'GOOD GIRL! Arff SITS! 🎉',swim:'Arff can SWIM! 🏊🐶',roll:'Arff ROLLS OVER! 🌀',shake:'Arff SHAKES a paw! 🐾',jump:'Arff JUMPS up! ⬆️🐶'}[tr]||('GOOD GIRL! Arff can '+tr.toUpperCase()+'! 🎉🐶');
    msg=m; msgT=2.2; beep(1300); beep(1600); say('Good girl! '+tr); updateArffBtn(); };
  document.getElementById('cardsBtn').onclick=function(){ renderCards(); document.getElementById('cardsov').style.display='flex'; beep(700); };
  document.getElementById('cardsClose').onclick=function(){ document.getElementById('cardsov').style.display='none'; };
  updateCardsBtn();

  // Switch tap-to-jump
  cv.addEventListener('pointerdown',function(e){ if(scene==='switch'){ if(sw.cy>=-1){ sw.vy=-14; beep(900); } }
    else if(scene==='live'){ var wx=camX+e.clientX; for(var i=0;i<buildings.length;i++){ var b=buildings[i]; if(b.kind==='hotel'&&wx>=b.x&&wx<=b.x+b.w){ enterHotel(b); break; } } } });

  // joystick (walk)
  (function(){ var st=document.getElementById('stick'), kn=document.getElementById('knob'); var pid=null,R=40;
    function set(dx){ dx=Math.max(-R,Math.min(R,dx)); kn.style.left=(38+dx)+'px'; jx=dx/R; }
    window.knob=function(){ kn.style.left='38px'; kn.style.top='38px'; };
    st.addEventListener('pointerdown',function(e){ e.preventDefault(); pid=e.pointerId; var r=st.getBoundingClientRect(); set(e.clientX-r.left-60); kn.style.top=(e.clientY-r.top-22)+'px'; });
    st.addEventListener('pointermove',function(e){ if(pid===null)return; var r=st.getBoundingClientRect(); set(e.clientX-r.left-60); });
    window.addEventListener('pointerup',function(e){ if(pid!==null){ pid=null; jx=0; knob(); } });
  })();

  // pick buttons
  document.getElementById('randBtn').addEventListener('click',function(){ var all=CITIES.concat(STATES); flyTo(all[Math.floor(Math.random()*all.length)]); });
  var statesov=document.getElementById('statesov');
  document.getElementById('statesBtn').addEventListener('click',function(){ buildStates(); statesov.style.display='flex'; beep(700); });
  document.getElementById('statesClose').addEventListener('click',function(){ statesov.style.display='none'; });
  function buildStates(){ var grid=document.getElementById('statesGrid'); grid.innerHTML=''; var total=0;
    STATES.slice().sort(function(a,b){return popReal(b)-popReal(a);}).forEach(function(s){ var p=popReal(s); total+=p; var b=document.createElement('button'); b.innerHTML='🇺🇸 '+s+'<br><span style="color:#7bff9e;font-size:10px">👥 '+commas(p)+'</span>'; b.onclick=function(){ flyTo(s); }; grid.appendChild(b); });
    document.getElementById('statesTot').innerHTML='👥 <b>'+commas(total)+'</b> people live in all 50 states! Biggest first! 🎉'; }

  function hint(tx){ document.getElementById('hint').textContent=tx; }
  hint('Pick a place and fly there! ✈️'); updateArffBtn();
  var ac; function beep(f){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(ac.destination); g.gain.value=0.05; o.start(); o.stop(ac.currentTime+0.09);}catch(e){} }
  function say(tx){ try{ var u=new SpeechSynthesisUtterance(tx); u.rate=.95; u.pitch=1.15; speechSynthesis.speak(u);}catch(e){} }
})();
</script>
</body></html>
