<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO My Player</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#3a1a6a 0%,#1c0e38 60%,#0c0620 100%);}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }

// audio
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.2,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function good(){ bp(880,0.1,'triangle',0.2); setTimeout(function(){bp(1250,0.09,'triangle',0.16);},55); }
function bad(){ bp(150,0.15,'square',0.15); }
function fanfare(){ bp(660,0.14,'triangle',0.22); setTimeout(function(){bp(880,0.14,'triangle',0.22);},130); setTimeout(function(){bp(1180,0.2,'triangle',0.22);},270); }
function click(){ bp(520,0.06,'square',0.14); }
function whoosh(){ bp(420,0.12,'sine',0.16); setTimeout(function(){bp(260,0.1,'sine',0.12);},55); } // shot release
function swish(){ bp(900,0.11,'triangle',0.22); setTimeout(function(){bp(1350,0.13,'triangle',0.18);},70); } // net swish

// ===== player =====
var SKINS=['#8a5a34','#b5794a','#e0b48a','#5a3a1a','#f0d0b0'];
var JERS=[['#e0563b','Red'],['#3aa0ff','Blue'],['#39b56a','Green'],['#ffd23f','Gold'],['#9a5ae0','Purple'],['#ff7ab0','Pink']];
var NUMS=[0,1,3,5,7,10,11,23,24,30,32,33,45];
var NAMES=['MO','ARFF','EVIE','ACE','ZO','KAI','MJ','REX','LUX','NOVA'];
var POS=['PG (Guard)','SG (Shooter)','SF (Wing)','PF (Forward)','C (Center)'];
var P={ skin:1, jer:0, num:7, nameI:0, posI:0,
        stats:{shoot:50,speed:50,dunk:50,defense:50,pass:50}, done:{} };
function ovr(){ var s=P.stats; return Math.round((s.shoot+s.speed+s.dunk+s.defense+s.pass)/5); }

// ===== camera face scan (stays local, never uploaded) =====
var camEl=document.getElementById('cam'), camReady=false, camErr=false, LIVE=false;
function startCam(){ camReady=false; camErr=false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ camErr=true; return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(function(stream){ camEl.srcObject=stream; var pl=camEl.play(); if(pl&&pl.catch)pl.catch(function(){}); camReady=true; }).catch(function(){ camErr=true; });
}
function stopCam(){ try{ var s=camEl.srcObject; if(s)s.getTracks().forEach(function(t){t.stop();}); camEl.srcObject=null; }catch(e){} camReady=false; }
function snapFace(){ if(!camReady||!camEl.videoWidth)return false; var vw=camEl.videoWidth,vh=camEl.videoHeight,sz=Math.min(vw,vh);
  var oc=document.createElement('canvas'); oc.width=140; oc.height=140; var o=oc.getContext('2d');
  o.save(); o.translate(140,0); o.scale(-1,1); o.drawImage(camEl,(vw-sz)/2,(vh-sz)/2,sz,sz,0,0,140,140); o.restore(); P.faceImg=oc; return true; }
function camA(){ if(camReady && snapFace())good(); stopCam(); scr='create'; }
function camB(){ stopCam(); scr='create'; }

// ===== controls (joystick + A + B) =====
var JB={x:66,y:H-60,r:46}, AB={x:W-56,y:H-58,r:42}, BB={x:W-116,y:H-96,r:32};
var joyId=null, joyX=0,joyY=0, aId=null, bId=null, aEdge=false,bEdge=false;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+8; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown',function(e){ var p=pt(e);
  if(inC(p,BB)){ bId=e.pointerId; bEdge=true; onB(); return; }
  if(inC(p,AB)){ aId=e.pointerId; aEdge=true; onA(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; if(e.pointerId===bId)bId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r, y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }
function onA(){ if(ac()&&ac().state==='suspended')ac().resume(); if(scr==='create')createA(); else if(scr==='hub')hubA(); else if(scr==='drill')drillA(); else if(scr==='done')doneA(); else if(scr==='camera')camA(); else if(scr==='play')playA(); else if(scr==='modesel')modeselA(); else if(scr==='run')runA(); else if(scr==='title'){ scr='camera'; startCam(); } }
function onB(){ if(scr==='create')createB(); else if(scr==='hub')hubB(); else if(scr==='done')doneB(); else if(scr==='camera')camB(); else if(scr==='modesel'){ scr='done'; } else if(scr==='play'){ leavePlay(); scr='done'; } else if(scr==='run'){ scr='done'; } }

// ===== avatar =====
function drawBaller(x,y,s){ // s=scale
  var skin=SKINS[P.skin], jer=JERS[P.jer][0];
  cx.save(); cx.translate(x,y); cx.scale(s,s);
  // legs
  cx.fillStyle='#2a2440'; cx.fillRect(-14,26,11,30); cx.fillRect(3,26,11,30);
  cx.fillStyle='#fff'; cx.fillRect(-15,54,12,8); cx.fillRect(3,54,12,8);
  // jersey
  cx.fillStyle=jer; rr(-20,-8,40,40,8); cx.fill();
  cx.fillStyle='rgba(255,255,255,.85)'; cx.font='bold 20px Trebuchet MS'; cx.textAlign='center'; cx.fillText(P.num,0,20);
  // arms
  cx.strokeStyle=skin; cx.lineWidth=8; cx.lineCap='round'; cx.beginPath(); cx.moveTo(-16,0); cx.lineTo(-26,22); cx.moveTo(16,0); cx.lineTo(26,22); cx.stroke();
  if(LIVE && camReady && camEl.videoWidth){ // LIVE camera watching you!
    var vw=camEl.videoWidth,vh=camEl.videoHeight,sz=Math.min(vw,vh);
    cx.save(); cx.beginPath(); cx.arc(0,-26,18,0,7); cx.clip(); cx.save(); cx.translate(18,-44); cx.scale(-1,1); cx.drawImage(camEl,(vw-sz)/2,(vh-sz)/2,sz,sz,0,0,36,36); cx.restore(); cx.restore();
    cx.strokeStyle='#ff5a5a'; cx.lineWidth=3; cx.beginPath(); cx.arc(0,-26,18,0,7); cx.stroke();
    cx.fillStyle=jer; cx.fillRect(-18,-34,36,6);
  } else if(P.faceImg){ // YOUR photo as the head
    cx.save(); cx.beginPath(); cx.arc(0,-26,18,0,7); cx.clip(); cx.drawImage(P.faceImg,-18,-44,36,36); cx.restore();
    cx.strokeStyle=jer; cx.lineWidth=3; cx.beginPath(); cx.arc(0,-26,18,0,7); cx.stroke();
    cx.fillStyle=jer; cx.fillRect(-18,-34,36,6); // headband over photo
  } else {
    // head
    cx.fillStyle=skin; cx.beginPath(); cx.arc(0,-26,17,0,7); cx.fill();
    // headband (jersey color)
    cx.fillStyle=jer; cx.fillRect(-17,-34,34,7);
    // hair top
    cx.fillStyle='#201810'; cx.beginPath(); cx.arc(0,-36,17,Math.PI,0); cx.fill();
    // eyes + smile
    cx.fillStyle='#fff'; cx.beginPath(); cx.arc(-6,-25,3,0,7); cx.arc(6,-25,3,0,7); cx.fill();
    cx.fillStyle='#201008'; cx.beginPath(); cx.arc(-6,-25,1.5,0,7); cx.arc(6,-25,1.5,0,7); cx.fill();
    cx.strokeStyle='#3a1c0a'; cx.lineWidth=2; cx.beginPath(); cx.arc(0,-19,5,0.15*Math.PI,0.85*Math.PI); cx.stroke();
  }
  cx.restore();
}

// ===== screens =====
var scr='title';
// create
var rows=['Skin','Jersey','Number','Name','Position']; var selRow=0, stepCd=0;
function createStep(dx,dy){ if(stepCd>0)return;
  if(dy>0.5){ selRow=(selRow+1)%rows.length; stepCd=0.2; click(); return; }
  if(dy<-0.5){ selRow=(selRow+rows.length-1)%rows.length; stepCd=0.2; click(); return; }
  if(dx>0.5||dx<-0.5){ var d=dx>0?1:-1; stepCd=0.18; click();
    if(selRow===0)P.skin=(P.skin+d+SKINS.length)%SKINS.length;
    else if(selRow===1)P.jer=(P.jer+d+JERS.length)%JERS.length;
    else if(selRow===2){ var i=NUMS.indexOf(P.num); P.num=NUMS[(i+d+NUMS.length)%NUMS.length]; }
    else if(selRow===3)P.nameI=(P.nameI+d+NAMES.length)%NAMES.length;
    else if(selRow===4)P.posI=(P.posI+d+POS.length)%POS.length;
  }
}
function createA(){ scr='hub'; good(); }
function createB(){ // randomize
  P.skin=Math.floor(Math.random()*SKINS.length); P.jer=Math.floor(Math.random()*JERS.length);
  P.num=NUMS[Math.floor(Math.random()*NUMS.length)]; P.nameI=Math.floor(Math.random()*NAMES.length); P.posI=Math.floor(Math.random()*POS.length); good();
}
// hub
var DRILLS=[{k:'shoot',e:'🎯',t:'Shooting',s:'shoot'},{k:'speed',e:'🏃',t:'Speed',s:'speed'},{k:'dunk',e:'💪',t:'Dunk',s:'dunk'},{k:'defense',e:'🛡️',t:'Defense',s:'defense'},{k:'pass',e:'🤾',t:'Passing',s:'pass'}];
var hubSel=0;
function hubStep(dx){ if(stepCd>0)return; if(dx>0.5){ hubSel=(hubSel+1)%DRILLS.length; stepCd=0.2; click(); } else if(dx<-0.5){ hubSel=(hubSel+DRILLS.length-1)%DRILLS.length; stepCd=0.2; click(); } }
function hubA(){ startDrill(DRILLS[hubSel]); }
function hubB(){ // finish -> done, needs at least all drills tried
  scr='done'; buildBadges(); fanfare(); spawnConfetti(); }
// drills
var curD=null, g={}, tLeft=0, dscore=0;
function startDrill(d){ curD=d; scr='drill'; dscore=0; tLeft=15; g={};
  if(d.k==='shoot'){ g.px=W/2; g.tx=W/2; g.dir=1; g.tw=54; g.ball=null; }
  else if(d.k==='speed'){ g.px=W/2; g.py=H*0.5; g.items=[]; g.sp=0; }
  else if(d.k==='dunk'){ g.meter=0; g.mdir=1; g.tries=8; g.hit=0; tLeft=null; }
  else if(d.k==='defense'){ g.px=W/2; g.balls=[]; g.sp=0; g.miss=0; }
  else if(d.k==='pass'){ g.notes=[]; g.sp=0; g.hy=H-150; }
}
function drillA(){ if(!curD)return;
  if(curD.k==='shoot'){ if(!g.ball){ var al=Math.abs(g.px-g.tx)<g.tw*0.5; g.ball={x:g.px,y:H-180,vy:-9,make:al}; whoosh(); if(al){dscore+=2; setTimeout(swish,150);}else setTimeout(function(){bp(240,0.14,'square',0.14);},150);} }
  else if(curD.k==='dunk'){ if(g.tries>0){ g.tries--; var good0=(g.meter>0.66&&g.meter<0.9); if(good0){dscore+=2;g.hit++;good();}else{bad();} if(g.tries<=0)endDrill(); } }
  else if(curD.k==='pass'){ var best=-1,bd=999; for(var i=0;i<g.notes.length;i++){ if(g.notes[i].hit)continue; var dd=Math.abs(g.notes[i].y-g.hy); if(dd<bd){bd=dd;best=i;} } if(best>=0&&bd<34){ g.notes[best].hit=1; dscore++; good(); } else bp(220,0.09,'square',0.12); }
}
function endDrill(){ // apply stat
  var st=curD.s; var gain;
  if(curD.k==='shoot')gain=55+dscore*3; else if(curD.k==='speed')gain=52+dscore*3; else if(curD.k==='dunk')gain=52+dscore*3; else if(curD.k==='defense')gain=54+dscore*3; else gain=54+dscore*3;
  P.stats[st]=Math.max(P.stats[st], Math.min(99,gain));
  P.done[curD.k]=true; scr='hub'; good();
}
// done / badges
var badges=[];
function buildBadges(){ badges=[]; var s=P.stats;
  if(s.shoot>=75)badges.push('🎯 Sharpshooter'); if(s.dunk>=75)badges.push('💪 Dunk King');
  if(s.speed>=75)badges.push('🏃 Speedster'); if(s.defense>=75)badges.push('🛡️ Lockdown');
  if(s.pass>=75)badges.push('🤾 Playmaker'); if(ovr()>=80)badges.push('⭐ Superstar');
  if(badges.length===0)badges.push('🏀 Rookie'); }
function doneA(){ scr='modesel'; } // choose a mode
function doneB(){ scr='create'; P.stats={shoot:50,speed:50,dunk:50,defense:50,pass:50}; P.done={}; P.faceImg=null; confetti=[]; } // new player

// ===== MODE SELECT =====
var msSel=0;
function modeStep(dx){ if(stepCd>0)return; if(dx>0.5){ msSel=Math.min(2,msSel+1); stepCd=0.2; click(); } else if(dx<-0.5){ msSel=Math.max(0,msSel-1); stepCd=0.2; click(); } }
function modeselA(){ if(msSel===0)startPlay('cam'); else if(msSel===1)startPlay('normal'); else startRun(); }

// ===== PLAY: shootout with YOUR baller =====
var play=null;
function startPlay(mode){ scr='play'; confetti=[]; play={tw:54,ball:null,score:0,t:30,mode:mode,meter:0,mdir:1,gf:0,rate:'' }; if(mode==='cam'){ LIVE=true; startCam(); } else { LIVE=false; } }
function leavePlay(){ if(LIVE){ stopCam(); LIVE=false; } }
function greenZone(){ var w=0.10+(P.stats.shoot-50)/49*0.12; var c=0.74; return [c-w,c+w]; } // higher shooting = wider green
function playA(){ if(!play)return; if(!play.ball){ var z=greenZone(); var green=(play.meter>=z[0]&&play.meter<=z[1]);
  play.ball={x:W/2,y:H-180,vy:-10,make:green}; whoosh();
  if(green){ play.score+=2; play.gf=0.9; play.rate='GREEN! 🔥'; setTimeout(swish,150); } else { play.rate='miss'; setTimeout(function(){bp(240,0.14,'square',0.14);},150); } } }
function updatePlay(dt,v){ play.t-=dt; if(play.t<=0){ play.t=0; leavePlay(); scr='done'; buildBadges(); return; }
  play.meter+=play.mdir*1.5*dt; if(play.meter>1){play.meter=1;play.mdir=-1;} if(play.meter<0){play.meter=0;play.mdir=1;}
  if(play.gf>0)play.gf-=dt;
  if(play.ball){ play.ball.y+=play.ball.vy; play.ball.vy+=0.12; if(play.ball.y>H-120||play.ball.y<120)play.ball=null; } }
function drawPlay(){ cx.textAlign='center';
  cx.fillStyle='rgba(10,4,26,.6)'; rr(8,8,W-16,32,10); cx.fill(); cx.fillStyle='#ffd23f'; cx.font='bold 14px Trebuchet MS'; cx.textAlign='left'; cx.fillText((play.mode==='cam'?'📷 ':'🏀 ')+NAMES[P.nameI],16,29);
  cx.textAlign='right'; cx.fillStyle='#fff'; cx.fillText('Pts '+play.score,W-16,29); cx.textAlign='center'; cx.fillStyle=play.t<6?'#ff6a6a':'#fff'; cx.fillText('⏱'+Math.ceil(play.t),W/2,29);
  if(play.mode==='cam'){ cx.fillStyle='#ff5a5a'; cx.beginPath(); cx.arc(28,52,5,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 11px Trebuchet MS'; cx.textAlign='left'; cx.fillText('LIVE — camera watching you!',40,56); }
  cx.strokeStyle='#fff'; cx.lineWidth=5; cx.beginPath(); cx.arc(W/2,150,play.tw/2,0,7); cx.stroke(); emoji('🥅',W/2,148,30);
  drawBaller(W/2,H-155,1.3); if(play.ball)emoji('🏀',play.ball.x,play.ball.y,24);
  // POWER METER (vertical, right side)
  var mx=W-40, my=200, mh=230, z=greenZone();
  cx.fillStyle='rgba(20,10,4,.75)'; rr(mx-11,my,22,mh,10); cx.fill();
  cx.fillStyle='rgba(80,230,120,.9)'; rr(mx-9,my+mh-z[1]*mh,18,(z[1]-z[0])*mh,4); cx.fill(); // green zone
  var yy=my+mh-play.meter*mh; cx.fillStyle='#ffd23f'; rr(mx-13,yy-3,26,6,3); cx.fill(); // marker
  cx.fillStyle='#fff'; cx.font='bold 10px Trebuchet MS'; cx.textAlign='center'; cx.fillText('POWER',mx,my-8);
  cx.fillStyle='#fff'; cx.font='bold 15px Trebuchet MS'; cx.fillText('Press A in the GREEN! 🎯',W/2-10,270);
  if(play.gf>0){ cx.globalAlpha=Math.min(1,play.gf*2); cx.fillStyle='#54e878'; cx.font='bold 24px Trebuchet MS'; cx.fillText('GREEN! 🔥',W/2,330); cx.globalAlpha=1; }
  drawControls(true,true,'SHOOT','DONE'); }
function drawModeSel(){ cx.textAlign='center'; cx.fillStyle='#ffd23f'; cx.font='bold 24px Trebuchet MS'; cx.fillText('PICK A MODE',W/2,54);
  var opts=[{e:'📷',t:'Camera Watches Me',d:'Your REAL face, live!'},{e:'🎮',t:'Just Play — Shootout',d:'Power-meter buckets'},{e:'🏃',t:'Run & Jump!',d:'Mario-style — grab the flag'}];
  for(var i=0;i<3;i++){ var y=76+i*150, on=(i===msSel);
    cx.fillStyle=on?'rgba(255,210,63,.2)':'rgba(255,255,255,.06)'; rr(36,y,W-72,132,16); cx.fill();
    if(on){ cx.strokeStyle='#ffd23f'; cx.lineWidth=3; rr(36,y,W-72,132,16); cx.stroke(); }
    emoji(opts[i].e,86,y+66,52); cx.fillStyle='#fff'; cx.font='bold 19px Trebuchet MS'; cx.textAlign='left'; cx.fillText(opts[i].t,140,y+58);
    cx.fillStyle='#c9b3f0'; cx.font='13px Trebuchet MS'; cx.fillText(opts[i].d,140,y+82); }
  cx.textAlign='center'; cx.fillStyle='#e6c8ff'; cx.font='13px Trebuchet MS'; cx.fillText('◀ Move to pick · A start · B back ▶',W/2,H-84);
  drawControls(true,true,'START','BACK'); }

// ===== RUN & JUMP (platformer) =====
var run=null; var WORLDW=2600, GROUNDT;
function startRun(){ scr='run'; confetti=[]; GROUNDT=H-60;
  var segs=[{x:0,w:520},{x:600,w:520},{x:1200,w:1400}];
  var plats=[{x:300,y:H-160,w:96},{x:720,y:H-175,w:96},{x:900,y:H-235,w:84},{x:1320,y:H-165,w:100},{x:1620,y:H-205,w:96}];
  var cones=[420,830,1420,1760,2080];
  var coins=[[330,H-205],[400,H-140],[730,H-215],[915,H-275],[1050,H-130],[1330,H-205],[1650,H-245],[1900,H-130],[2150,H-130],[2350,H-140]].map(function(c){return {x:c[0],y:c[1],got:false};});
  run={x:40,y:GROUNDT-40,vy:0,onG:true,lives:3,coins:0,iv:0,win:0,segs:segs,plats:plats,cones:cones.map(function(x){return {x:x};}),coinsA:coins,flagX:2470,off:0};
}
function runA(){ if(run&&run.onG){ run.vy=-430; run.onG=false; bp(600,0.1,'square',0.16); } }
function updateRun(dt,v){ if(run.win>0){ run.win-=dt; if(run.win<=0){ scr='done'; buildBadges(); } return; }
  var spd=155+(P.stats.speed-50)*0.7; run.x=Math.max(12, run.x+v.x*spd*dt);
  var prevFeet=run.y+40; run.vy+=1350*dt; run.y+=run.vy*dt; run.onG=false; var feet=run.y+40;
  // solids: ground segs + platforms
  var solids=[]; run.segs.forEach(function(s){ solids.push({x:s.x,w:s.w,top:GROUNDT}); }); run.plats.forEach(function(pl){ solids.push({x:pl.x,w:pl.w,top:pl.y}); });
  for(var i=0;i<solids.length;i++){ var s=solids[i]; if(run.x>s.x-6 && run.x<s.x+s.w+6 && prevFeet<=s.top+4 && feet>=s.top && run.vy>=0){ run.y=s.top-40; run.vy=0; run.onG=true; feet=s.top; } }
  // pit fall

var last=performance.now();
function update(dt){ if(stepCd>0)stepCd-=dt;
  var v=jv();
  if(scr==='create'){ createStep(v.x,v.y); }
  else if(scr==='hub'){ hubStep(v.x); }
  else if(scr==='drill'){ updateDrill(dt,v); }
  else if(scr==='play'){ updatePlay(dt,v); }
  else if(scr==='run'){ updateRun(dt,v); }
  else if(scr==='modesel'){ modeStep(v.x); }
  for(var c=confetti.length-1;c>=0;c--){ var q=confetti[c]; q.x+=q.vx; q.y+=q.vy; q.vy+=0.06; q.rot+=q.vr; if(q.y>H+20)confetti.splice(c,1); }
}
function updateDrill(dt,v){ if(tLeft!==null){ tLeft-=dt; if(tLeft<=0){ endDrill(); return; } }
  if(curD.k==='shoot'){ g.px=clamp(g.px+v.x*230*dt,30,W-30); g.tx+=g.dir*80*dt; if(g.tx>W-70){g.tx=W-70;g.dir=-1;} if(g.tx<70){g.tx=70;g.dir=1;}
    if(g.ball){ g.ball.y+=g.ball.vy; if(g.ball.y<160){ g.ball=null; } } }
  else if(curD.k==='speed'){ g.px=clamp(g.px+v.x*230*dt,24,W-24); g.py=clamp(g.py+v.y*200*dt,140,H-150);
    g.sp-=dt; if(g.sp<=0){ g.items.push({x:24+Math.random()*(W-48),y:-20,vy:150+Math.random()*90,bad:Math.random()<0.4}); g.sp=0.45+Math.random()*0.3; }
    for(var i=g.items.length-1;i>=0;i--){ var it=g.items[i]; it.y+=it.vy*dt; if(Math.hypot(it.x-g.px,it.y-g.py)<28){ if(it.bad){bad();dscore=Math.max(0,dscore-1);}else{good();dscore++;} g.items.splice(i,1); } else if(it.y>H+20)g.items.splice(i,1); } }
  else if(curD.k==='dunk'){ g.meter+=g.mdir*1.1*dt; if(g.meter>1){g.meter=1;g.mdir=-1;} if(g.meter<0){g.meter=0;g.mdir=1;} }
  else if(curD.k==='defense'){ g.px=clamp(g.px+v.x*250*dt,30,W-30);
    g.sp-=dt; if(g.sp<=0){ g.balls.push({x:30+Math.random()*(W-60),y:-20,vy:180+Math.random()*90}); g.sp=0.55+Math.random()*0.35; }
    for(var i=g.balls.length-1;i>=0;i--){ var bl=g.balls[i]; bl.y+=bl.vy*dt; if(bl.y>H-150 && Math.abs(bl.x-g.px)<40){ good(); dscore++; g.balls.splice(i,1);} else if(bl.y>H-40){ bad(); g.balls.splice(i,1);} } }
  else if(curD.k==='pass'){ g.sp-=dt; if(g.sp<=0){ g.notes.push({x:W/2,y:-10,vy:210,hit:0}); g.sp=0.62; }
    for(var i=g.notes.length-1;i>=0;i--){ var nt=g.notes[i]; nt.y+=nt.vy*dt; if(nt.y>g.hy+46)g.notes.splice(i,1); } }
}
