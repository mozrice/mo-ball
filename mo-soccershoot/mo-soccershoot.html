<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Soccer Fangames</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#2f7a34;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#eaffea;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;background:#0006;padding:4px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0009;z-index:7;}
  #over h1{font-size:32px;color:#ffd23f;margin:0 0 6px;text-align:center;} #over p{font-size:20px;margin:4px;text-align:center;}
  #over button{margin-top:16px;background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;cursor:pointer;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<canvas id="c"></canvas>
<div id="over"><h1 id="otitle"></h1><p id="ofinal"></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),x=cv.getContext('2d'),W,H,DPR,anim=0;
  var OPP="THE STRIKERS"; // opponent team name
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; x.setTransform(DPR,0,0,DPR,0,0); layout(); }
  addEventListener('resize',fit);
  var S; // scale
  var goalL,goalR,goalTop,goalLineY,spotX,spotY;
  function layout(){ S=Math.min(W,H)/26; goalL=W*0.2; goalR=W*0.8; goalTop=H*0.12; goalLineY=H*0.33; spotX=W/2; spotY=H*0.74; }
  // ---------- state ----------
  var mode,round,moGoals,oppGoals,sudden,aimX,aimDir,aimLock,powerVal,powerDir,ball,keeperX,keeperDive,ballTarget,msg,msgT,resultT,myDive,oppThird,oppPow,shake=0;
  var foodK,foodM,foodR,foodO,foodBites,foodPhase,foodPaid;
  var gameDay,chDone,chStart,sleepT,failT; var CHLEN=20; // seconds per challenge
  var HK='moSoccerHi2'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  function newGame(){ mode='title'; round=1; moGoals=0; oppGoals=0; sudden=false; msg=''; msgT=0; document.getElementById('over').style.display='none'; }
  function startYourKick(){ mode='aim'; aimX=W/2; aimDir=1; aimLock=null; ball={x:spotX,y:spotY,r:S*0.55}; keeperX=W/2; keeperDive=0; msg=''; msgT=0; }
  function startOppKick(){ mode='keeppick'; ball={x:spotX,y:spotY,r:S*0.55}; keeperX=W/2; myDive=null; oppThird=Math.floor(Math.random()*3); oppPow=0.4+Math.random()*0.6; msg=''; msgT=0; }
  function startFood(){ mode='food'; foodPhase='build'; foodK=false; foodM=false; foodR=false; foodO=false; foodBites=0; foodPaid=null; }
  function beginRun(){ gameDay=1; chDone=0; beginDay(1); }
  function beginDay(d){ gameDay=d; mode='sleep'; sleepT=140; }
  function startChallenge(){ startFood(); chStart=Date.now(); }
  function chRemain(){ return Math.max(0, CHLEN-(Date.now()-chStart)/1000); }
  function chComplete(){ chDone++; roar(); shake=10; if(chDone>=3){ mode='win'; if(window.MO_MVP)setTimeout(window.MO_MVP,300); } else { mode='daydone'; } }
  function chFail(){ mode='fail'; failT=110; beep(120,0.4); }
  function foodBtns(){ var y=H*0.8,h=H*0.085,d=[['k','Ketchup','#e8402a'],['m','Mustard','#f2c94c'],['r','Relish','#3fa65a'],['o','Onions','#efe6d2']],a=[]; for(var i=0;i<4;i++){ a.push({key:d[i][0],label:d[i][1],col:d[i][2],x:W*0.045+i*W*0.235,y:y,w:W*0.2,h:h}); } return a; }
  function payBtns(){ var y=H*0.8,h=H*0.1; return [{key:'cash',label:'💵 CASH',x:W*0.08,y:y,w:W*0.38,h:h},{key:'card',label:'💳 CARD',x:W*0.54,y:y,w:W*0.38,h:h}]; }
  function third(px){ var t=(px-goalL)/(goalR-goalL); return t<0.34?0:(t<0.67?1:2); }
  function thirdX(t){ return goalL+(goalR-goalL)*(t===0?0.2:(t===1?0.5:0.8)); }
  // ---------- input ----------
  function pt(e){ var t=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); return {x:t.clientX-r.left,y:t.clientY-r.top}; }
  function tap(p){
    if(mode==='title'){ ac(); beginRun(); return; }
    if(mode==='sleep'){ return; }
    if(mode==='fail'){ return; }
    if(mode==='daydone'){ beginDay(gameDay+1); return; }
    if(mode==='win'){ mode='title'; return; }
    if(mode==='food'){
      if(foodPhase==='build'){ var fb=foodBtns(); for(var i=0;i<fb.length;i++){ var b=fb[i]; if(p.x>b.x&&p.x<b.x+b.w&&p.y>b.y&&p.y<b.y+b.h){ if(b.key==='k')foodK=true; else if(b.key==='m')foodM=true; else if(b.key==='r')foodR=true; else foodO=true; beep(600,0.06); break; } } if(foodK&&foodM&&foodR&&foodO)foodPhase='pay'; }
      else if(foodPhase==='pay'){ var pb=payBtns(); for(var j=0;j<pb.length;j++){ var b2=pb[j]; if(p.x>b2.x&&p.x<b2.x+b2.w&&p.y>b2.y&&p.y<b2.y+b2.h){ foodPaid=b2.key; foodPhase='eat'; beep(780,0.08); break; } } }
      else { if(p.y>H*0.34&&p.y<H*0.62){ foodBites++; beep(240,0.08); if(foodBites>=3){ chComplete(); } } }
      return; }
    if(mode==='aim'){ aimLock=aimX; mode='power'; powerVal=0; powerDir=1; beep(500,0.06); return; }
    if(mode==='power'){ doShot(); return; }
    if(mode==='keeppick'){ var d=p.x<W/3?0:(p.x<2*W/3?1:2); myDive=d; doOppShot(); return; }
  }
  function doShot(){ var bt=third(aimLock); var tx=aimLock, ty=goalTop+(1-powerVal)*(goalLineY-goalTop);
    keeperDive=Math.floor(Math.random()*3);
    var good=(bt!==keeperDive)||(powerVal>0.8); // beat keeper by placement or a top-corner rocket
    ballTarget={x:tx,y:ty,good:good,kx:thirdX(keeperDive)}; mode='kick'; ball.t=0; beep(360,0.08); }
  function doOppShot(){ var tx=thirdX(oppThird), ty=goalTop+(1-oppPow)*(goalLineY-goalTop);
    var saved=(myDive===oppThird)&&!(oppPow>0.85);
    ballTarget={x:tx,y:ty,good:!saved,kx:thirdX(myDive)}; mode='oppkick'; ball.t=0; beep(300,0.08); }
  cv.addEventListener('touchstart',function(e){ tap(pt(e)); e.preventDefault(); },{passive:false});
  cv.addEventListener('mousedown',function(e){ tap(pt(e)); });
  // ---------- loop ----------
  function loop(){ anim++; if(shake>0)shake*=0.86; if(shake<0.3)shake=0;
    if(mode==='sleep'){ sleepT--; if(sleepT<=0) startChallenge(); }
    else if(mode==='food'){ if(chRemain()<=0) chFail(); }
    else if(mode==='fail'){ failT--; if(failT<=0) mode='title'; }
    if(mode==='aim'){ aimX+=aimDir*(W*0.012); if(aimX>goalR-S){aimX=goalR-S;aimDir=-1;} if(aimX<goalL+S){aimX=goalL+S;aimDir=1;} }
    else if(mode==='power'){ powerVal+=powerDir*0.028; if(powerVal>=1){powerVal=1;powerDir=-1;} if(powerVal<=0){powerVal=0;powerDir=1;} }
    else if(mode==='kick'||mode==='oppkick'){ ball.t+=0.045; var e=Math.min(1,ball.t); ball.x=spotX+(ballTarget.x-spotX)*e; ball.y=spotY+(ballTarget.y-spotY)*e; ball.r=S*0.55-S*0.28*e;
      keeperX+=(ballTarget.kx-keeperX)*0.14;
      if(e>=1){ resolveShot(); } }
    else if(mode==='result'){ resultT--; if(resultT<=0) afterResult(); }
    if(msgT>0)msgT--;
    draw(); requestAnimationFrame(loop); }
  function resolveShot(){ var youKicked=(mode==='kick');
    if(ballTarget.good){ if(youKicked){moGoals++;} else {oppGoals++;} showMsg(youKicked?'⚽ GOAL! LET\'S GO MO!':'😤 '+OPP+' SCORE', youKicked?'#ffd23f':'#ff8a7a'); shake=youKicked?16:8; beep(760,0.1); setTimeout(function(){beep(1000,0.12);},90); roar(); }
    else { showMsg(youKicked?'🧤 SAVED!':'🧤 YOU SAVED IT!', '#9fe0ff'); shake=youKicked?6:16; beep(200,0.14); if(!youKicked)roar(); }
    mode='result'; resultT=70; }
  function afterResult(){ if(mode!=='result')return;
    // after your kick -> opponent kick; after opponent kick -> next round
    if(lastWasYourKick()){ startOppKick(); }
    else { round++; var decided=false;
      if(round>5){ if(moGoals!==oppGoals){ decided=true; } else { sudden=true; } }
      if(sudden && round>5 && moGoals!==oppGoals) decided=true;
      if(decided){ over(); } else { startYourKick(); } }
  }
  var _lastYour=true; function lastWasYourKick(){ return _lastYour; }
  // track which shot just happened via resolveShot
  var _origResolve=resolveShot; resolveShot=function(){ _lastYour=(mode==='kick'); _origResolve(); };
  function over(){ mode='over'; var win=moGoals>oppGoals; if(moGoals>getHi())setHi(moGoals);
    document.getElementById('otitle').textContent=win?'🏆 MO WINS!':(moGoals<oppGoals?'😤 '+OPP+' WIN':'🤝 TIE!');
    document.getElementById('otitle').style.color=win?'#ffd23f':'#fff';
    document.getElementById('ofinal').textContent='Final:  MO '+moGoals+'  —  '+oppGoals+'  '+OPP;
    document.getElementById('over').style.display='flex'; if(win&&window.MO_MVP)setTimeout(window.MO_MVP,300); }
  // ---------- draw ----------
  function drawHotDog(cx,cy,k,m,r,o,bites){ var L=W*0.5, hh=S*1.1, left=cx-L/2, right=left+L*(1-bites/3*0.8);
    x.fillStyle='#e0a860'; rr(left,cy+hh*0.05,right-left,hh*0.5,hh*0.25); // bottom bun
    x.fillStyle='#9c4a2a'; rr(left+S*0.2,cy-hh*0.22,(right-left)-S*0.4,hh*0.5,hh*0.25); // sausage
    x.fillStyle='#b4603a'; rr(left+S*0.25,cy-hh*0.2,(right-left)-S*0.5,hh*0.16,hh*0.08);
    if(r){ x.fillStyle='#3fa65a'; for(var i=0;i<16;i++){ var px=left+S*0.4+i*((right-left)-S*0.8)/16; x.fillRect(px,cy-hh*0.3,3,5); } }
    if(o){ x.fillStyle='#efe6d2'; for(var i2=0;i2<11;i2++){ var oxp=left+S*0.5+i2*((right-left)-S*1.0)/11; x.beginPath(); x.arc(oxp,cy-hh*0.08,3,0,7); x.fill(); } }
    if(k){ x.strokeStyle='#e8402a'; x.lineWidth=S*0.18; x.lineCap='round'; x.beginPath(); for(var j=0;j<=14;j++){ var jx=left+S*0.4+j*((right-left)-S*0.8)/14, jy=cy-hh*0.04+Math.sin(j)*S*0.13; if(j===0)x.moveTo(jx,jy); else x.lineTo(jx,jy); } x.stroke(); }
    if(m){ x.strokeStyle='#f2c94c'; x.lineWidth=S*0.14; x.beginPath(); for(var j2=0;j2<=14;j2++){ var mx2=left+S*0.4+j2*((right-left)-S*0.8)/14, my2=cy-hh*0.04+Math.cos(j2)*S*0.13; if(j2===0)x.moveTo(mx2,my2); else x.lineTo(mx2,my2); } x.stroke(); }
    x.fillStyle='#e8b36a'; rr(left,cy-hh*0.58,right-left,hh*0.42,hh*0.2); } // top bun
  function drawChips(cx,cy){ x.fillStyle='#caa02a'; rr(cx-S*0.95,cy-S*0.5,S*1.9,S*1.1,6); x.fillStyle='#f4ce4e'; for(var i=0;i<6;i++){ x.beginPath(); x.arc(cx-S*0.55+(i%3)*S*0.55,cy-S*0.15+Math.floor(i/3)*S*0.4,S*0.2,0,7); x.fill(); } x.fillStyle='#fff'; x.font='12px Trebuchet MS'; x.textAlign='center'; x.fillText('chips',cx,cy+S*0.95); }
  function drawDrink(cx,cy){ x.fillStyle='#d94a4a'; x.beginPath(); x.moveTo(cx-S*0.6,cy-S*0.7); x.lineTo(cx+S*0.6,cy-S*0.7); x.lineTo(cx+S*0.45,cy+S*0.95); x.lineTo(cx-S*0.45,cy+S*0.95); x.closePath(); x.fill(); x.fillStyle='#fff'; rr(cx-S*0.62,cy-S*0.82,S*1.24,S*0.22,3); x.strokeStyle='#fff'; x.lineWidth=S*0.12; x.beginPath(); x.moveTo(cx+S*0.2,cy-S*0.8); x.lineTo(cx+S*0.5,cy-S*1.6); x.stroke(); x.fillStyle='#fff'; x.font='12px Trebuchet MS'; x.textAlign='center'; x.fillText('drink',cx,cy+S*1.15); }
  function drawFood(){ var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2f7a34'); g.addColorStop(1,'#24642a'); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.fillStyle='#ffd23f'; x.font='900 22px Trebuchet MS'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('🌭 HOT-DOG CHALLENGE',W/2,H*0.065);
    x.fillStyle='#fff'; x.font='bold 13px Trebuchet MS'; x.fillText('Day '+gameDay+'  •  Challenge '+(chDone+1)+'/3  •  finish before time’s up!',W/2,H*0.105);
    // timer bar
    var rem=chRemain(), frac=rem/CHLEN, pw=W*0.7,px0=W/2-pw/2; x.fillStyle='#000a'; rr(px0-3,H*0.135,pw+6,14,7); x.fillStyle='#223'; rr(px0,H*0.137,pw,10,5); x.fillStyle=frac<0.3?'#ff5a5a':'#3fd06a'; rr(px0,H*0.137,pw*frac,10,5);
    x.fillStyle='#fff'; x.font='bold 12px Trebuchet MS'; x.fillText('⏱️ '+Math.ceil(rem)+'s',W/2,H*0.167);
    drawChips(W*0.16,H*0.46); drawDrink(W*0.85,H*0.46);
    x.fillStyle='#fafafa'; rr(W*0.42,H*0.62,W*0.16,H*0.015,2); x.fillStyle='#eee'; x.font='11px Trebuchet MS'; x.fillText('napkins',W*0.5,H*0.645);
    drawHotDog(W/2,H*0.48,foodK,foodM,foodR,foodO,foodBites);
    if(foodPhase==='build'){ x.fillStyle='#ffe07a'; x.font='bold 15px Trebuchet MS'; x.fillText('Tap to add toppings (fresh off the grill!):',W/2,H*0.73);
      var fb=foodBtns(); for(var i=0;i<fb.length;i++){ var b=fb[i],done=(b.key==='k'?foodK:b.key==='m'?foodM:b.key==='r'?foodR:foodO); x.fillStyle=done?'#2a5a2f':b.col; rr(b.x,b.y,b.w,b.h,10); x.strokeStyle='#fff'; x.lineWidth=2; rrS(b.x,b.y,b.w,b.h,10); x.fillStyle=(b.key==='m'||b.key==='o')?'#333':'#fff'; x.font='bold 13px Trebuchet MS'; x.fillText(done?'✓ '+b.label:b.label,b.x+b.w/2,b.y+b.h/2); } }
    else if(foodPhase==='pay'){ x.fillStyle='#ffe07a'; x.font='bold 17px Trebuchet MS'; x.fillText('Time to pay — Cash or Card?',W/2,H*0.73);
      var pb=payBtns(); for(var j=0;j<pb.length;j++){ var b2=pb[j]; x.fillStyle='#1f9fd8'; rr(b2.x,b2.y,b2.w,b2.h,12); x.strokeStyle='#fff'; x.lineWidth=2; rrS(b2.x,b2.y,b2.w,b2.h,12); x.fillStyle='#fff'; x.font='900 20px Trebuchet MS'; x.fillText(b2.label,b2.x+b2.w/2,b2.y+b2.h/2); } }
    else { x.fillStyle='#ffe07a'; x.font='bold 16px Trebuchet MS'; x.fillText('Paid with '+(foodPaid==='cash'?'cash 💵':'card 💳')+'! Tap the hot dog to EAT!',W/2,H*0.72);
      x.fillStyle='#fff'; x.font='14px Trebuchet MS'; x.fillText('Share a bite with your sibling!  Bites: '+foodBites+'/3',W/2,H*0.77); } }
  function drawSleep(){ x.fillStyle='#0b1430'; x.fillRect(0,0,W,H);
    for(var i=0;i<40;i++){ x.fillStyle='#ffffff'+(i%3?'66':'aa'); x.fillRect((i*83)%W,(i*57)%(H*0.6),2,2); }
    x.fillStyle='#ffe9a0'; x.beginPath(); x.arc(W*0.75,H*0.22,S*2,0,7); x.fill(); x.fillStyle='#0b1430'; x.beginPath(); x.arc(W*0.82,H*0.19,S*1.7,0,7); x.fill();
    x.fillStyle='#fff'; x.font='900 26px Trebuchet MS'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('💤 NIGHT '+gameDay,W/2,H*0.45);
    x.fillStyle='#9fe0ff'; x.font='16px Trebuchet MS'; x.fillText('Mo sleeps at the stadium…',W/2,H*0.52); x.fillText('Challenges done: '+chDone+' / 3',W/2,H*0.58);
    x.fillStyle='#ffd23f'; x.font='bold 15px Trebuchet MS'; x.fillText('☀️ Day '+gameDay+' challenge coming up!',W/2,H*0.66); }
  function drawDayDone(){ var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2f7a34'); g.addColorStop(1,'#24642a'); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.fillStyle='#3fd06a'; x.font='900 30px Trebuchet MS'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('✅ CHALLENGE DONE!',W/2,H*0.3);
    drawHotDog(W/2,H*0.46,true,true,true,true,3);
    x.fillStyle='#fff'; x.font='900 22px Trebuchet MS'; x.fillText(chDone+' / 3 challenges',W/2,H*0.6);
    x.fillStyle='#9fe0ff'; x.font='15px Trebuchet MS'; x.fillText('Great, Mo! Get '+(3-chDone)+' more to win.',W/2,H*0.66);
    x.fillStyle='#1f9fd8'; rr(W/2-110,H*0.76,220,54,16); x.fillStyle='#fff'; x.font='900 18px Trebuchet MS'; x.fillText('💤 Sleep → Day '+(gameDay+1),W/2,H*0.76+27); }
  function drawWin(){ var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1f6fd0'); g.addColorStop(1,'#13306a'); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.fillStyle='#ffd23f'; x.font='900 34px Trebuchet MS'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('🏆 YOU WIN!',W/2,H*0.3);
    x.fillStyle='#fff'; x.font='bold 19px Trebuchet MS'; x.fillText('3 CHALLENGES DONE!',W/2,H*0.42); x.fillText('Mo did it in '+gameDay+' days! ⚽🌭',W/2,H*0.49);
    x.fillStyle='#9fe0ff'; x.font='15px Trebuchet MS'; x.fillText('What a game-day champ fan!',W/2,H*0.56);
    x.fillStyle='#f0b429'; rr(W/2-100,H*0.68,200,54,16); x.fillStyle='#5a3a00'; x.font='900 20px Trebuchet MS'; x.fillText('▶ Play Again',W/2,H*0.68+27); }
  function drawFail(){ x.fillStyle='#000'; x.fillRect(0,0,W,H);
    if(failT<70){ x.fillStyle='#ff5a5a'; x.font='900 24px Trebuchet MS'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('💤 LIGHTS OUT!',W/2,H*0.46); x.fillStyle='#aaa'; x.font='15px Trebuchet MS'; x.fillText('You missed the challenge…',W/2,H*0.53); x.fillText('back to the start',W/2,H*0.58); } }
  function draw(){ x.save(); if(shake>0)x.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    if(mode==='food'){ drawFood(); x.restore(); return; }
    if(mode==='sleep'){ drawSleep(); x.restore(); return; }
    if(mode==='daydone'){ drawDayDone(); x.restore(); return; }
    if(mode==='win'){ drawWin(); x.restore(); return; }
    if(mode==='fail'){ drawFail(); x.restore(); return; }
    // pitch
    for(var s=0;s<H;s+=H*0.08){ x.fillStyle=(Math.floor(s/(H*0.08))%2)?'#2f7a34':'#36873b'; x.fillRect(0,s,W,H*0.08); }
    drawGoal();
    // penalty arc + spot
    x.strokeStyle='#ffffff88'; x.lineWidth=3; x.beginPath(); x.arc(W/2,H*0.6,W*0.2,0.15*Math.PI,0.85*Math.PI); x.stroke();
    x.fillStyle='#fff'; x.beginPath(); x.arc(spotX,spotY,4,0,7); x.fill();
    var def=(mode==='keeppick'||mode==='oppkick'); // you are keeper when opponent kicks
    // keeper in goal
    drawKeeper(def?keeperX:(mode==='kick'?keeperX:W/2), goalLineY-S*0.2, def?'#1f6fd0':'#e8402a', (mode==='kick'||mode==='oppkick')?Math.sign(keeperX-W/2):0);
    // kicker at the spot
    if(mode==='aim'||mode==='power'||mode==='kick'){ drawPlayer(spotX, spotY+S*1.3, '#1f6fd0','M'); }
    else if(mode==='keeppick'||mode==='oppkick'){ drawPlayer(spotX, spotY+S*1.3, '#e8402a','S'); }
    // ball
    if(mode!=='title'&&mode!=='keeppick') drawBall(ball.x,ball.y,ball.r); else if(mode==='keeppick') drawBall(spotX,spotY,S*0.55);
    // aim reticle
    if(mode==='aim'){ x.strokeStyle='#ffd23f'; x.lineWidth=3; x.setLineDash([7,7]); x.beginPath(); x.moveTo(ball.x,ball.y); x.lineTo(aimX,goalLineY-S*0.4); x.stroke(); x.setLineDash([]); x.fillStyle='#ffd23f'; x.beginPath(); x.arc(aimX,goalLineY-S*0.4,8,0,7); x.fill(); }
    // power bar
