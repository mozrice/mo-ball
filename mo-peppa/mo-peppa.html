  #gamesov{position:fixed;inset:0;background:rgba(20,20,40,.72);z-index:20;display:none;align-items:center;justify-content:center;}

<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }

  var gy, worldW, camX=0, jx=0, score=0, t=0;

    {n:'Mummy',c:{type:'pig',dress:'#f6921e'}},
    {n:'Daddy',c:{type:'pig',dress:'#1f9e78',glasses:true,beard:true,big:1}},

    {n:'Miss Rabbit',c:{type:'rabbit',dress:'#1a5fd0'}},
    {n:'Grandpa',c:{type:'pig',dress:'#2f7bd8',glasses:true}},

    {n:'M. Gazelle',c:{type:'pony',dress:'#7a3a8a'}},

    {n:'Off. Panda',c:{type:'panda',dress:'#16265a',hat:'police'}},

  ];

  var season=0, forceNight=false, fireworks=false; // 0 summer 1 fall 2 winter 3 spring
  var SEASON=[{g:'#6aa84e',hi:'#8ad07a',fall:null},{g:'#c98a3a',hi:'#e0b060',fall:'🍂'},{g:'#eef4ff',hi:'#dbe6ff',fall:'❄'},{g:'#7bc85a',hi:'#a8e08a',fall:'🌸'}];
  var flakes=[]; for(var fk=0;fk<26;fk++)flakes.push({x:Math.random(),y:Math.random(),v:0.4+Math.random()*0.8,sw:Math.random()*6});
  var balloons=[], train={x:0,v:1.4}, held=null, floatV=0, heli={x:0,v:2.6};
  var gameOn=false, gameT=0, gameScore=0, bestGame=+(localStorage.getItem('moPeppaGame')||0);
  var trail=[], heldT=0;
  var FAMFOLLOW=[{type:'pig',dress:'#f6921e',name:'Mummy'},{type:'pig',dress:'#1f9e78',glasses:true,beard:true,name:'Daddy',big:1},{type:'pig',dress:'#2f7bd8',dino:true,small:1,name:'George'},{type:'pig',dress:'#ffd23f',small:1,name:'Evie'}];
  var goodies=[]; // floating "got it" popups
  function lerp(a,b,t){ return Math.round(a+(b-a)*t); }
  function shopItems(n){ n=n.toLowerCase();
    if(n.indexOf('cake')>=0||n.indexOf('sweet')>=0)return ['🍰','🧁','🍩','🍪'];
    if(n.indexOf('toy')>=0||n.indexOf('play')>=0)return ['🧸','🚗','🪀','🎲'];
    if(n.indexOf('ice')>=0)return ['🍦','🍨','🍧','🥤'];
    if(n.indexOf('book')>=0||n.indexOf('school')>=0)return ['📚','📕','📗','📘'];
    if(n.indexOf('boot')>=0)return ['👢','🥾','🧦','👟'];
    if(n.indexOf('pizza')>=0)return ['🍕','🍅','🧀','🥤'];
    if(n.indexOf('balloon')>=0)return ['🎈','🎉','🎁','🎀'];
    return ['⭐','🎈','🍭','🧸']; }
  var buildings=[], friends=[], puddles=[], clouds=[], rain=[], cars=[], people=[], stars=[];
  var SHOPCOL=['#f4a03a','#7bcf7b','#6ab0e0','#e07ab0','#c88ae0','#e0b06a','#ff8a6a','#6ad0c0'];
  var SHOPNAME=['Cake Shop','Toy Store','Ice Cream','Book Shop','Muddy Boots','Sweet Shop','Pizza','Playground','School','Balloon Shop'];

  function build(){ gy=H*0.72; worldW=W*8; camX=0; pep.x=W*0.4; pep.y=gy;
    buildings=[]; var bx=W*0.02, i=0; while(bx<worldW-W*0.1){ var bw=W*0.2+Math.random()*W*0.08; buildings.push({x:bx,w:bw,h:H*(0.18+Math.random()*0.22),col:SHOPCOL[i%SHOPCOL.length],name:SHOPNAME[i%SHOPNAME.length],open:0,rang:0,garage:(i%2===0),gcol:['#e05a2a','#2a90e0','#7bcf7b','#e0439a','#ffd23f'][i%5]}); bx+=bw*1.05; i++; }
    buildings[0].house=true; buildings[0].name='Peppa House'; buildings[0].col='#f0932b'; buildings[0].h=H*0.42;
    var HN=["Suzy's House","Danny's House","Rebecca's House","Pedro's House","Candy's House","Zoe's House","Emily's House"]; var hi=0;
    buildings.forEach(function(bb,bk){ if(bb.garage && !bb.house){ bb.home=true; bb.name=HN[hi%HN.length]; hi++; bb.h=H*(0.34+Math.random()*0.08); } });
    var lb=buildings[buildings.length-1]; lb.boat=true; lb.home=false; lb.garage=false; lb.name='Boat Dock'; lb.col='#3aa0d0';
    var PLACES=[{k:'school',name:'Playgroup',col:'#f2c14e'},{k:'playground',name:'Playground',col:'#7bcf7b'},{k:'birthday',name:'Party Hall',col:'#e07ab0'},{k:'beach',name:'The Beach',col:'#6ac0e0'},{k:'farm',name:'Farm',col:'#8fce6a'},{k:'funfair',name:'Fun Fair',col:'#c88ae0'},{k:'dino',name:'Dino Park',col:'#6ad0c0'},{k:'hospital',name:'Hospital',col:'#e8f0ff'},{k:'pizza',name:'Pizza Place',col:'#ff9a5a'},{k:'tower',name:'City Tower',col:'#8aa0c0'},{k:'mall',name:'Mega Mall',col:'#d0a0e0'},{k:'subway',name:'Subway',col:'#7a8a9a'},{k:'bank',name:'Coin Bank',col:'#f2d24e'},{k:'coaster',name:'Theme Park',col:'#ff6aa0'},{k:'cinema',name:'Cinema',col:'#c05a8a'},{k:'donut',name:'Donut Shop',col:'#ffb0c8'},{k:'aquarium',name:'Aquarium',col:'#4fb0d0'},{k:'clock',name:'Clock Tower',col:'#c8a86a'},{k:'hotel',name:'Grand Hotel',col:'#e0c060'},{k:'mural',name:'Art Wall',col:'#a0d0a0'}];
    var pj=0; buildings.forEach(function(bb){ if(!bb.garage&&!bb.house&&!bb.home&&!bb.boat&&pj<PLACES.length){ bb.place=PLACES[pj].k; bb.name=PLACES[pj].name; bb.col=PLACES[pj].col; pj++; } });
    stars=[]; for(var st2=0;st2<12;st2++)stars.push({x:W*0.8+Math.random()*(worldW-W), y:gy-H*(0.14+Math.random()*0.12), got:false, ph:Math.random()*6});
    coins=[]; for(var co=0;co<20;co++)coins.push({x:W*0.5+Math.random()*(worldW-W), y:gy-H*(0.02+Math.random()*0.1), got:false, ph:Math.random()*6});
    litter=[]; for(var li=0;li<14;li++)litter.push({x:W*0.5+Math.random()*(worldW-W), e:['🗑️','🥤','📰','🍌'][li%4], gone:false});
    balloons=[]; for(var bn=0;bn<7;bn++)balloons.push({x:W*0.7+Math.random()*(worldW-W), y:gy-H*(0.2+Math.random()*0.15), col:['#ff5a5a','#5ad0ff','#ffd23f','#7bff9e','#e07ab0'][bn%5], ph:Math.random()*6});
    train.x=-300; heli.x=-200;
    var MRJ=[['🍦','Ice Cream'],['🚌','Bus Driver'],['🎫','Ticket Lady'],['📚','Librarian'],['🧹','Window Cleaner'],['♻️','Recycling'],['⛴️','Ferry'],['🦷','Dentist'],['🏗️','Crane'],['🚒','Fire Fighter'],['🥖','Baker'],['✈️','Pilot'],['🩺','Nurse'],['🚜','Digger'],['🎪','Fun Fair']];
    MRJOBS=MRJ.map(function(j,k){ return {x:worldW*(0.12+k*(0.76/MRJ.length)), e:j[0], n:j[1]}; });
    puddles=[]; for(var pu=0;pu<14;pu++)puddles.push({x:W*0.6+Math.random()*(worldW-W*0.8), w:50+Math.random()*70, hit:false});
    puddles.push({x:worldW*0.5, w:200, hit:false, giant:true});
    var FR=[{type:'pig',dress:'#f6921e',name:'Mummy',line:'Hello Peppa!'},{type:'pig',dress:'#1f9e78',glasses:true,beard:true,name:'Daddy',big:1,line:'Ho ho ho!'},{type:'pig',dress:'#2f7bd8',name:'George',dino:true,small:1,line:'Dine-saw! Grrr!'},{type:'pig',dress:'#ffd23f',name:'Evie',small:1,line:'Hiii!'},
      {type:'sheep',dress:'#b98ee0',name:'Suzy',line:'Baaa!'},{type:'dog',dress:'#e8801f',name:'Danny',line:'Woof woof!'},{type:'rabbit',dress:'#4fb0e8',name:'Rebecca',line:'Squeak!'},{type:'pony',dress:'#c8863a',glasses:true,name:'Pedro',line:'Neigh...'},{type:'cat',dress:'#ff7ab0',name:'Candy',line:'Meow!'},
      {type:'panda',dress:'#16265a',name:'Officer Panda',hat:'police',line:'Hello hello!'},
      {type:'squirrel',dress:'#16265a',name:'Officer Squirrel',hat:'police',line:'Stay safe!'},
      {type:'rabbit',dress:'#ff8a3a',name:'Miss Rabbit',line:'I do every job!'}];
    friends=[]; FR.forEach(function(f,k){ f.x=W*0.9+k*(worldW-W*1.2)/FR.length; f.wt=Math.random()*6; f.v=(k%2?-1:1)*(0.6+Math.random()*0.7); f.dir=f.v<0?-1:1; friends.push(f); });
    cars=[]; for(var cc=0;cc<8;cc++)cars.push({x:Math.random()*worldW, v:(Math.random()<0.5?1:-1)*(1.5+Math.random()*2), col:['#e05a2a','#2a90e0','#7bcf7b','#e0439a','#ffd23f','#9b59ff'][cc%6]});
    cars.push({x:worldW*0.4, v:2.2, col:'#ffffff', police:true});
    cars.push({x:worldW*0.6, v:-2, col:'#d0201a', fire:true});
    people=[];
    clouds=[]; for(var c2=0;c2<6;c2++)clouds.push({fx:Math.random(),fy:0.06+Math.random()*0.22,s:0.6+Math.random()*0.8});
    rain=[]; for(var r=0;r<36;r++)rain.push({x:Math.random()*W,y:Math.random()*H,v:6+Math.random()*4}); }
  build();

  function rr(a,b,c,d,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+c,b,a+c,b+d,r); x.arcTo(a+c,b+d,a,b+d,r); x.arcTo(a,b+d,a,b,r); x.arcTo(a,b,a+c,b,r); x.closePath(); }

  // ===== animal characters =====
  function head_pig(s){ x.lineJoin='round';
    // head (real Peppa: round with a little top curl)
    x.strokeStyle='#d15c86'; x.lineWidth=2*s; x.fillStyle='#f9a0c4';
    x.beginPath(); x.ellipse(4*s,-38*s,16*s,15*s,0,0,7); x.fill(); x.stroke();
    // snout tube sticking out front
    x.fillStyle='#f9a0c4'; x.strokeStyle='#d15c86'; x.beginPath(); x.ellipse(24*s,-44*s,12*s,8*s,-0.12,0,7); x.fill(); x.stroke();
    x.fillStyle='#dd6f9a'; x.beginPath(); x.ellipse(22*s,-45*s,2.1*s,2.7*s,0,0,7); x.fill(); x.beginPath(); x.ellipse(28*s,-45*s,2.1*s,2.7*s,0,0,7); x.fill();
    // two eyes side by side, both facing forward, with pupils
    x.fillStyle='#fff'; x.strokeStyle='#d15c86'; x.lineWidth=1.4*s;
    x.beginPath(); x.arc(11*s,-47*s,5.2*s,0,7); x.fill(); x.stroke();
    x.beginPath(); x.arc(20*s,-48*s,5.2*s,0,7); x.fill(); x.stroke();
    x.fillStyle='#1a1a1a'; x.beginPath(); x.arc(13*s,-47*s,2.4*s,0,7); x.fill(); x.beginPath(); x.arc(22*s,-48*s,2.4*s,0,7); x.fill();
    x.fillStyle='#fff'; x.beginPath(); x.arc(13.9*s,-48*s,0.9*s,0,7); x.fill(); x.beginPath(); x.arc(22.9*s,-49*s,0.9*s,0,7); x.fill();
    // rosy cheek
    x.fillStyle='rgba(240,110,150,0.55)'; x.beginPath(); x.arc(9*s,-34*s,4.2*s,0,7); x.fill();
    // curly smile under the snout
    x.strokeStyle='#b8496a'; x.lineWidth=2*s; x.lineCap='round'; x.beginPath(); x.moveTo(14*s,-36*s); x.quadraticCurveTo(19*s,-31*s,25*s,-35*s); x.stroke();
    // little top-of-head hair curl
    x.strokeStyle='#d15c86'; x.lineWidth=1.8*s; x.beginPath(); x.arc(-3*s,-53*s,3*s,0.2,4.2); x.stroke();
    x.pigDone=true; }
  function head_sheep(s){ x.strokeStyle='#d6cdba'; x.lineWidth=1.4*s; x.fillStyle='#fff'; for(var i=0;i<7;i++){ var a=i/7*6.28; x.beginPath(); x.arc(2*s+Math.cos(a)*15*s,-40*s+Math.sin(a)*13*s,7*s,0,7); x.fill(); x.stroke(); }
    x.fillStyle='#efe6d4'; x.beginPath(); x.ellipse(6*s,-38*s,13*s,12*s,0,0,7); x.fill(); x.stroke();
    x.fillStyle='#fff'; x.beginPath(); x.arc(-4*s,-50*s,6*s,0,7); x.fill(); }
  function head_dog(s){ x.strokeStyle='#c07830'; x.lineWidth=1.6*s; x.fillStyle='#f0a860'; x.beginPath(); x.ellipse(2*s,-38*s,16*s,14*s,0,0,7); x.fill(); x.stroke();
    x.beginPath(); x.ellipse(22*s,-40*s,10*s,7*s,0,0,7); x.fill(); x.stroke();

  function head_rabbit(s){ x.strokeStyle='#dcdcdc'; x.lineWidth=1.4*s; x.fillStyle='#fff'; x.beginPath(); x.ellipse(-2*s,-58*s,4*s,12*s,-0.15,0,7); x.fill(); x.stroke(); x.beginPath(); x.ellipse(8*s,-58*s,4*s,12*s,0.15,0,7); x.fill(); x.stroke();
    x.beginPath(); x.ellipse(2*s,-38*s,15*s,14*s,0,0,7); x.fill(); x.stroke();

    if(held){ x.strokeStyle='#bbb'; x.lineWidth=1.5; x.beginPath(); x.moveTo(ppx,pep.y-40); x.lineTo(ppx,pep.y-64); x.stroke(); x.fillStyle=held.col; x.beginPath(); x.ellipse(ppx,pep.y-78,15,18,0,0,7); x.fill(); }
    // pet puppy follows Peppa
    var petTargetX=pep.x-28*pep.dir; pet.x+=(petTargetX-pet.x)*0.12; pet.wt+=Math.abs(petTargetX-pet.x)*0.02;
    (function(){ var dx=pet.x-camX, dy=gy+10, walk=Math.sin(pet.wt)*3;
      x.save(); x.translate(dx,dy); if(pep.dir<0)x.scale(-1,1);
      x.fillStyle='#e8b878'; x.beginPath(); x.ellipse(0,-6,11,7,0,0,7); x.fill(); // body
      x.strokeStyle='#e8b878'; x.lineWidth=3; x.lineCap='round'; x.beginPath(); x.moveTo(-6,-2); x.lineTo(-7+walk,6); x.moveTo(5,-2); x.lineTo(6-walk,6); x.stroke(); // legs
      x.fillStyle='#e8b878'; x.beginPath(); x.arc(11,-11,6,0,7); x.fill(); // head
      x.fillStyle='#d09a58'; x.beginPath(); x.ellipse(4,-14,3,5,0.4,0,7); x.fill(); // ear
      x.fillStyle='#3a2a1a'; x.beginPath(); x.arc(13,-12,1.4,0,7); x.fill(); x.beginPath(); x.arc(16,-9,1.4,0,7); x.fill(); // eye+nose
      x.strokeStyle='#e8b878'; x.lineWidth=3; x.beginPath(); x.moveTo(-10,-9); x.lineTo(-15,-14+Math.sin(t*0.3)*3); x.stroke(); // wagging tail
      x.restore(); })();
    // splashes
    for(var j=splashes.length-1;j>=0;j--){ var sp=splashes[j]; sp.x+=sp.vx; sp.y+=sp.vy; sp.vy+=0.5; sp.life--; if(sp.life<=0){ splashes.splice(j,1); continue; } x.fillStyle='rgba(120,80,40,'+(sp.life/20)+')'; x.beginPath(); x.arc(sp.x,sp.y,sp.r,0,7); x.fill(); }
    if(SEASON[season].fall){ x.font=Math.round(W*0.045)+'px serif'; x.textAlign='center'; flakes.forEach(function(fl){ fl.y+=fl.v/H; fl.x-=0.0008; if(fl.y>1){fl.y=-0.02;fl.x=Math.random();} var fxx=((fl.x%1+1)%1)*W, fyy=fl.y*(gy+H*0.1)+Math.sin(t*0.03+fl.sw)*6; x.fillText(SEASON[season].fall,fxx,fyy); }); }
    // score
    x.fillStyle='#5a2a0a'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='center'; x.fillText('💦 '+score, W*0.38, H*0.1);
    x.fillStyle='#c0392b'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('⭐ Best '+best, W*0.66, H*0.06);
    x.fillStyle='#d4a017'; x.fillText('⭐ '+starCount, W*0.62, H*0.11);
    x.fillStyle='#c89a00'; x.fillText('🪙 '+coinCount, W*0.78, H*0.11);
    x.fillStyle='#3a8a4a'; x.fillText('🧹 '+cleaned, W*0.9, H*0.06);
    for(var gi=goodies.length-1;gi>=0;gi--){ var gd=goodies[gi]; gd.y-=1.2; gd.life--; if(gd.life<=0){goodies.splice(gi,1);continue;} x.globalAlpha=Math.min(1,gd.life/20); x.font=Math.round(W*0.06)+'px serif'; x.textAlign='center'; x.fillText(gd.txt,gd.x,gd.y); x.globalAlpha=1; }
    if(bigFlash>0){ bigFlash--; x.fillStyle='rgba(200,40,60,'+Math.min(1,bigFlash/40)+')'; x.font='900 '+Math.round(W*0.09)+'px Trebuchet MS'; x.fillText('BIG SPLASH! ⭐', W/2, H*0.2); }
    var gb=document.getElementById('goin'); gb.style.display=atDoor?'block':'none'; gb.textContent=(atDoor&&atDoor.house)?'GO HOME 🏠':((atDoor&&(atDoor.home||atDoor.boat))?'GO IN 🏠':'GO IN 🚪');
    document.getElementById('ride').style.display=inside?'none':'block';
    document.getElementById('wx').style.display=inside?'none':'block';
    document.getElementById('se').style.display=inside?'none':'block';
    document.getElementById('gm').style.display=inside?'none':'block';
    document.getElementById('players').style.display=inside?'none':'block';
    document.getElementById('games').style.display=inside?'none':'block';
    if(gameOn){ gameT--; if(gameT<=0){ gameOn=false; if(gameScore>bestGame){ bestGame=gameScore; try{localStorage.setItem('moPeppaGame',bestGame);}catch(e){} } bigFlash=120; }
      x.fillStyle='#c0392b'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='center'; x.fillText('⏱ '+Math.ceil(gameT/60)+'s  💦 '+gameScore, W/2, H*0.16); }
    requestAnimationFrame(loop);
  }
  var splashes=[];
  loop();

  function land(){ pep.squash=1; for(var i=0;i<puddles.length;i++){ var pu=puddles[i]; if(Math.abs(pep.x-pu.x)<pu.w/2+12){
    var big=pu.giant; score+=big?5:1; var n=big?40:16;
    for(var k=0;k<n;k++)splashes.push({x:pep.x-camX+(Math.random()-0.5)*(big?110:40),y:gy+6,vx:(Math.random()-0.5)*(big?14:8),vy:-4-Math.random()*(big?11:6),r:3+Math.random()*(big?6:4),life:big?30:20});
    if(big){ bigFlash=90; oink(); setTimeout(function(){oink();},180); } else oink();
    if(score>best){ best=score; try{localStorage.setItem('moPeppaBest',best);}catch(e){} }
    if(gameOn)gameScore+=big?5:1;
    break; } } }
  function jump(){ if(held){ held=null; return; } if(pep.onGround){ pep.vy=-18; pep.onGround=false; beep(700); } }
  document.getElementById('jump').addEventListener('pointerdown',function(e){ e.preventDefault(); jump(); });
  (function(){ var ov=document.getElementById('pickov'), grid=document.getElementById('pickgrid');
    var EM={pig:'🐷',sheep:'🐑',dog:'🐶',rabbit:'🐰',pony:'🐴',cat:'🐱',elephant:'🐘',zebra:'🦓',potato:'🥔',panda:'🐼',squirrel:'🐿️'};
    PLAYABLE.forEach(function(pl){ var btn=document.createElement('div'); btn.className='pickbtn'; btn.style.background=pl.c.dress+'22';
      var em=(pl.n==='M. Gazelle')?'🦌':EM[pl.c.type]; btn.innerHTML='<div style="font-size:26px">'+em+'</div>'+pl.n;
      btn.addEventListener('pointerdown',function(ev){ ev.preventDefault(); var c={}; for(var k in pl.c)c[k]=pl.c[k]; me=c; ov.style.display='none'; beep(760); setTimeout(function(){oink();},60); });
      grid.appendChild(btn); });
    document.getElementById('players').addEventListener('pointerdown',function(e){ e.preventDefault(); ov.style.display='flex'; });
    document.getElementById('pickclose').addEventListener('pointerdown',function(e){ e.preventDefault(); ov.style.display='none'; });
  })();
  (function(){ var ov=document.getElementById('gamesov'), grid=document.getElementById('ggrid');
    var GAMES=[
      {n:'1. Taxi Driver 🚕',a:'car'},{n:'2. Elevator Tower 🏢',a:'place:tower'},
      {n:'3. Beat the Traffic 🚦',a:'free'},{n:'4. Pizza Delivery 🍕',a:'place:pizza'},
      {n:'5. Ride the Subway 🚇',a:'place:subway'},{n:'6. Build Skyscraper 🏗️',a:'place:tower'},
      {n:'7. Shopping Mall 🛍️',a:'place:mall'},{n:'8. Bus Route 🚌',a:'car'},
      {n:'9. City at Night 🌃',a:'night'},{n:'10. Police Patrol 🚓',a:'play:panda'},
      {n:'11. Clean the City 🧹',a:'free'},{n:'12. City Fun Fair 🎡',a:'place:funfair'},
      {n:'13. Hospital 🏥',a:'place:hospital'},{n:'14. Cross the Bridge 🌉',a:'place:beach'},
      {n:'15. Rooftop Heli 🚁',a:'place:tower'},{n:'16. Collect Coins 🪙',a:'splash'},
      {n:'17. Theme Park 🎢',a:'place:coaster'},{n:'18. Walk the Dogs 🐕',a:'free'},
      {n:'19. Firefighter 🚒',a:'play:rabbit'},{n:'20. Explore Streets 🗺️',a:'free'},
      {n:'21. Bus Stop Line 🚏',a:'free'},{n:'22. Window Washer 🧼',a:'place:tower'},
      {n:'23. Road Builder 🚧',a:'free'},{n:'24. Cinema Trip 🎬',a:'place:cinema'},
      {n:'25. Donut Shop 🍩',a:'place:donut'},{n:'26. Feed Pigeons 🐦',a:'free'},
      {n:'27. Ambulance Rush 🚑',a:'place:hospital'},{n:'28. Rooftop Garden 🌷',a:'place:mural'},
      {n:'29. Street Parade 🎉',a:'free'},{n:'30. Elevator Buttons 🛗',a:'place:tower'},
      {n:'31. Fireworks Night 🎆',a:'fireworks'},{n:'32. Bike Courier 🚲',a:'bike'},
      {n:'33. Hotel Bellhop 🛎️',a:'place:hotel'},{n:'34. Clock Tower 🕰️',a:'place:clock'},
      {n:'35. Paint a Mural 🎨',a:'place:mural'},{n:'36. Beat Rush Hour 🚕',a:'car'},
      {n:'37. City Aquarium 🐟',a:'place:aquarium'},{n:'38. Supermarket Sweep 🛒',a:'place:mall'},
      {n:'39. Rooftop Fair 🎡',a:'place:funfair'},{n:'40. Light the Bridge 🌉',a:'place:beach'}
    ];
    var PNAME={school:'Playgroup',playground:'Playground',birthday:'Party Hall',beach:'The Beach',farm:'Farm',funfair:'Fun Fair',dino:'Dino Park',hospital:'Hospital',pizza:'Pizza Place',tower:'City Tower',mall:'Mega Mall',subway:'Subway',bank:'Coin Bank',coaster:'Theme Park',cinema:'Cinema',donut:'Donut Shop',aquarium:'Aquarium',clock:'Clock Tower',hotel:'Grand Hotel',mural:'Art Wall'};
    function entPlace(key){ inside={place:key, name:PNAME[key]||'City'}; return true; }
    GAMES.forEach(function(g){ var btn=document.createElement('div'); btn.className='gbtn'; btn.textContent=g.n;
      btn.addEventListener('pointerdown',function(ev){ ev.preventDefault(); ov.style.display='none'; beep(760);
        if(g.a==='car'){ pep.ride=3; document.getElementById('ride').textContent='WALK 🐷'; }
        else if(g.a==='night'){ forceNight=!forceNight; }
        else if(g.a==='splash'){ if(!gameOn){ gameOn=true; gameT=20*60; gameScore=0; } }
        else if(g.a==='bike'){ pep.ride=1; document.getElementById('ride').textContent='SCOOTER 🛴'; }
        else if(g.a==='fireworks'){ forceNight=true; fireworks=!fireworks; }
        else if(g.a==='play:panda'){ me={type:'panda',dress:'#16265a',hat:'police'}; }
        else if(g.a==='play:rabbit'){ me={type:'rabbit',dress:'#1a5fd0'}; }
        else if(g.a.indexOf('place:')===0){ entPlace(g.a.slice(6)); }
      });
      grid.appendChild(btn); });
    document.getElementById('games').addEventListener('pointerdown',function(e){ e.preventDefault(); ov.style.display='flex'; });
    document.getElementById('gclose').addEventListener('pointerdown',function(e){ e.preventDefault(); ov.style.display='none'; });
  })();
  cv.addEventListener('pointerdown',function(e){
    var rx=e.clientX;
    if(inside){ if(inside.house||inside.boat)return; // buy an item
      if(score>0){ score--; var items=shopItems(inside.name); var em=items[Math.floor(t/7)%items.length]; goodies.push({x:rx,y:e.clientY,txt:em,life:45}); oink(); } return; }
    // outside: tap litter to clean it up
    for(var lz=0;lz<litter.length;lz++){ var lt=litter[lz]; if(lt.gone)continue; if(Math.abs((lt.x-camX)-rx)<28 && Math.abs(e.clientY-(gy+H*0.03))<40){ lt.gone=true; cleaned++; try{localStorage.setItem('moPeppaClean',cleaned);}catch(_){} beep(700); goodies.push({x:lt.x-camX,y:gy+H*0.03,txt:'✨',life:30}); return; } }
    // outside: find nearest friend to the tap
    var bestF=null,bd=60; friends.forEach(function(f){ var d=Math.abs((f.x-camX)-rx); if(d<bd){bd=d;bestF=f;} });
    if(bestF){ bestF.talk=110; var ty=bestF.type;
      if(bestF.name==='George'||ty==='dog'||ty==='pony'){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(220,ac.currentTime); o.frequency.linearRampToValueAtTime(90,ac.currentTime+0.25); o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.07; o.start(); o.stop(ac.currentTime+0.26);}catch(_){} }
      else if(ty==='pig'){ oink(); } else beep(760);
    }
  });
  document.getElementById('wx').addEventListener('pointerdown',function(e){ e.preventDefault(); weather=(weather+1)%3; var w=document.getElementById('wx'); w.textContent=weather===0?'☀️/🌧️':(weather===1?'☀️ Sunny':'🌧️ Storm'); beep(560); });
  var SEA=['🌞 Summer','🍂 Fall','❄️ Winter','🌸 Spring'];
  document.getElementById('se').addEventListener('pointerdown',function(e){ e.preventDefault(); season=(season+1)%4; document.getElementById('se').textContent=SEA[season]; beep(620); });
  document.getElementById('gm').addEventListener('pointerdown',function(e){ e.preventDefault(); if(!gameOn){ gameOn=true; gameT=20*60; gameScore=0; beep(900); } });
  document.getElementById('ride').addEventListener('pointerdown',function(e){ e.preventDefault();
    pep.ride=(pep.ride+1)%4; var r=document.getElementById('ride');
    r.textContent=pep.ride===0?'RIDE 🚲':(pep.ride===1?'SCOOTER 🛴':(pep.ride===2?'CAR 🚗':'WALK 🐷')); beep(600); });
  document.getElementById('goin').addEventListener('pointerdown',function(e){ e.preventDefault();
    if(inside){ inside=null; jx=0; beep(500); }
    else if(atDoor){ inside=atDoor; jx=0; beep(660); setTimeout(function(){oink();},80); } });

  (function(){ var st=document.getElementById('stick'), kn=document.getElementById('knob'); var pid=null,R=40;
    function set(dx){ dx=Math.max(-R,Math.min(R,dx)); kn.style.left=(38+dx)+'px'; jx=dx/R; }
    function rel(){ pid=null; kn.style.left='38px'; kn.style.top='38px'; jx=0; }
    st.addEventListener('pointerdown',function(e){ e.preventDefault(); pid=e.pointerId; try{st.setPointerCapture(e.pointerId);}catch(_){} var r=st.getBoundingClientRect(); set(e.clientX-r.left-60); kn.style.top=(e.clientY-r.top-22)+'px'; });
    st.addEventListener('pointermove',function(e){ if(pid===null)return; var r=st.getBoundingClientRect(); set(e.clientX-r.left-60); });
    st.addEventListener('pointerup',rel); st.addEventListener('pointercancel',rel); st.addEventListener('lostpointercapture',rel); addEventListener('pointerup',rel); addEventListener('blur',rel);
  })();

  var ac; function beep(f){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(ac.destination); g.gain.value=0.04; o.start(); o.stop(ac.currentTime+0.08);}catch(e){} }
  function oink(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(400,ac.currentTime); o.frequency.linearRampToValueAtTime(180,ac.currentTime+0.15); o.type='sawtooth'; o.connect(g); g.connect(ac.destination); g.gain.value=0.06; o.start(); o.stop(ac.currentTime+0.16);}catch(e){}
    try{ var u=new SpeechSynthesisUtterance('Oink! Splash!'); u.rate=1.1; u.pitch=1.5; speechSynthesis.speak(u); }catch(e){} }
})();
