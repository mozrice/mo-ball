<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO All-Star Shootout</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#c9772f;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;opacity:.95;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;text-shadow:0 1px 3px #0007;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:17px;font-weight:bold;color:#fff;pointer-events:none;text-shadow:0 1px 4px #000;z-index:4;}
  #sub{position:fixed;top:33px;left:0;right:0;text-align:center;font-size:14px;font-weight:bold;color:#ffe08a;pointer-events:none;text-shadow:0 1px 3px #000;z-index:4;}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;text-align:center;padding:20px;}
  #start{background:linear-gradient(#e79a4a,#a85a1a);}
  #start h1{font-size:25px;margin:0 0 6px;text-shadow:0 2px 4px #0006;} #start p{font-size:15px;margin:4px;max-width:330px;}
  #start .big{font-size:56px;}
  #over{background:#000a;display:none;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;text-shadow:0 2px 0 #b47a1a;} #over p{font-size:17px;margin:3px;}
  #start button,#over button{margin-top:16px;background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
  #start button:active,#over button:active{transform:translateY(3px);box-shadow:0 2px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="hud">🏀 <span id="sc">0</span> pts &nbsp; · &nbsp; 🎯 <span id="sh">10</span> shots &nbsp; · &nbsp; 🔥 <span id="st">0</span></div>
<div id="sub"></div>
<canvas id="c"></canvas>
<div id="start"><div class="big">🏀⭐</div><h1>MO All-Star Shootout</h1><p>Tap when the power bar hits the GREEN zone to swish it! Make streaks for bonus points. You get 10 shots — go for MVP!</p><button id="go">▶ SHOOT!</button></div>
<div id="over"><h1 id="ot">🎉 GAME!</h1><p id="om"></p><button id="rs">▶ Shoot Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var score, shots, streak, best, running, tt, mx, mdir, ball, sparks, cheer, msg, shooting, made, hi;
  try{ hi=+localStorage.getItem('moAllstar')||0; }catch(e){ hi=0; }
  function hoop(){ return {x:W*0.76, y:H*0.34, r:Math.min(W*0.09,42)}; }
  function shooter(){ return {x:W*0.24, y:H*0.70}; }
  function reset(){ score=0; shots=10; streak=0; running=true; tt=0; mx=0; mdir=1; sparks=[]; cheer=0; msg=''; shooting=false; made=false;
    var s=shooter(); ball={x:s.x, y:s.y-Math.min(W*0.16,86)*0.55, held:true, t:0};
    document.getElementById('sc').textContent=0; document.getElementById('sh').textContent=10; document.getElementById('st').textContent=0;
    document.getElementById('over').style.display='none'; document.getElementById('start').style.display='none'; document.getElementById('sub').textContent='👆 Tap in the GREEN zone to shoot!'; }
  function tap(){ if(!running||shooting||shots<=0)return; shoot(mx); }
  cv.addEventListener('touchstart',function(e){ tap(); e.preventDefault(); },{passive:false});
  cv.addEventListener('mousedown',function(e){ tap(); });
  function shoot(p){ shooting=true; ball.held=false; ball.t=0; var h=hoop();
    var perfect=Math.abs(p-0.70)<0.05; made=Math.abs(p-0.70)<0.13; ball.perfect=perfect;
    var off = (p-0.70); // negative=short, positive=long
    ball.sx=ball.x; ball.sy=ball.y; ball.ex = made? h.x : h.x + (off>0? h.r*2.2 : -h.r*1.8); ball.ey = made? h.y+2 : h.y + (made?0:h.r*1.2);
    ball.arc = H*0.30 + (0.70-p)*H*0.12; ball.resolved=false; beep(300+p*400,0.08); }
  function resolve(){ shots--; document.getElementById('sh').textContent=shots;
    if(made){ var pts=ball.perfect?3:2; score+=pts + Math.min(2,streak); streak++; document.getElementById('sc').textContent=score; document.getElementById('st').textContent=streak;
      msg=(ball.perfect?'✨ SWISH! ':'🏀 SCORE! ')+(streak>1?('🔥 x'+streak):''); cheer=22; var h=hoop(); for(var i=0;i<16;i++)sparks.push({x:h.x,y:h.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-1,life:26,c:['#ffe27a','#ff8a3a','#fff','#8fffcf'][i%4]}); beep(760,0.08); setTimeout(function(){beep(1040,0.09);},70);
    } else { streak=0; document.getElementById('st').textContent=0; msg='😬 Miss! Try the green zone'; beep(150,0.16,'sawtooth'); }
    document.getElementById('sub').textContent=msg;
    if(shots<=0){ setTimeout(gameover,900); }
    else { setTimeout(function(){ var s=shooter(); ball={x:s.x,y:s.y-Math.min(W*0.16,86)*0.55,held:true,t:0}; shooting=false; }, 650); } }
  function gameover(){ running=false; if(score>hi){ hi=score; try{localStorage.setItem('moAllstar',hi);}catch(e){} }
    var mvp=score>=14; document.getElementById('ot').innerHTML=mvp?'🏆 MVP!!':'🎉 GAME OVER';
    document.getElementById('om').textContent='You scored '+score+' points! Best: '+hi+(mvp?' — you are an ALL-STAR!':' — keep shooting!');
    document.getElementById('over').style.display='flex'; if(mvp && window.MO_MVP)window.MO_MVP(); }
  function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function drawBall(x,y,r){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='#e8792a'; ctx.beginPath(); ctx.arc(0,0,r,0,6.29); ctx.fill(); ctx.strokeStyle='#7a3a12'; ctx.lineWidth=Math.max(1.5,r*0.09); ctx.beginPath(); ctx.arc(0,0,r,0,6.29); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.moveTo(0,-r); ctx.lineTo(0,r); ctx.moveTo(-r*0.7,-r*0.7); ctx.quadraticCurveTo(0,0,-r*0.7,r*0.7); ctx.moveTo(r*0.7,-r*0.7); ctx.quadraticCurveTo(0,0,r*0.7,r*0.7); ctx.stroke(); ctx.restore(); }
  function drawFamily(cx,by,u,bounce){ ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle'; by-=bounce||0;
    function person(px,ph,shirt,hair,name){ var hipY=by-ph*0.42, shY=by-ph*0.72, hr=ph*0.17, hcy=by-ph*0.90;
      ctx.lineCap='round'; ctx.strokeStyle='#3a3550'; ctx.lineWidth=ph*0.10;
      ctx.beginPath(); ctx.moveTo(px-ph*0.11,hipY); ctx.lineTo(px-ph*0.11,by); ctx.moveTo(px+ph*0.11,hipY); ctx.lineTo(px+ph*0.11,by); ctx.stroke();
      ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.ellipse(px-ph*0.11,by,ph*0.10,ph*0.05,0,0,6.29); ctx.fill(); ctx.beginPath(); ctx.ellipse(px+ph*0.11,by,ph*0.10,ph*0.05,0,0,6.29); ctx.fill();
      ctx.fillStyle=shirt; rr(px-ph*0.21,shY,ph*0.42,hipY-shY+ph*0.05,ph*0.10); ctx.fill();
      ctx.strokeStyle=shirt; ctx.lineWidth=ph*0.11; ctx.beginPath(); ctx.moveTo(px-ph*0.20,shY+ph*0.05); ctx.lineTo(px-ph*0.32,shY-ph*0.10); ctx.moveTo(px+ph*0.20,shY+ph*0.05); ctx.lineTo(px+ph*0.32,shY-ph*0.10); ctx.stroke();
      ctx.fillStyle='#f3c9a0'; ctx.beginPath(); ctx.arc(px-ph*0.32,shY-ph*0.10,ph*0.055,0,6.29); ctx.fill(); ctx.beginPath(); ctx.arc(px+ph*0.32,shY-ph*0.10,ph*0.055,0,6.29); ctx.fill();
      ctx.fillStyle='#f3c9a0'; ctx.beginPath(); ctx.arc(px,hcy,hr,0,6.29); ctx.fill();
      ctx.fillStyle=hair; ctx.beginPath(); ctx.arc(px,hcy-hr*0.14,hr*1.02,Math.PI*1.02,Math.PI*1.98); ctx.fill();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(px-hr*0.36,hcy+hr*0.05,hr*0.13,0,6.29); ctx.fill(); ctx.beginPath(); ctx.arc(px+hr*0.36,hcy+hr*0.05,hr*0.13,0,6.29); ctx.fill();
      ctx.strokeStyle='#b5453a'; ctx.lineWidth=Math.max(1,ph*0.025); ctx.beginPath(); ctx.arc(px,hcy+hr*0.18,hr*0.42,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
      if(name){ ctx.fillStyle='#fff'; ctx.font='bold '+Math.max(9,ph*0.15)+'px Trebuchet MS'; ctx.fillText(name,px,by+ph*0.16); } }
    function dog(px,dh,name){ ctx.lineCap='round'; ctx.strokeStyle='#f0efe9'; ctx.lineWidth=dh*0.13;
      for(var i=0;i<4;i++){ var lx=px-dh*0.30+i*dh*0.20; ctx.beginPath(); ctx.moveTo(lx,by-dh*0.28); ctx.lineTo(lx,by); ctx.stroke(); }
      ctx.fillStyle='#fff'; ctx.strokeStyle='#e6e6e0'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(px,by-dh*0.42,dh*0.42,dh*0.27,0,0,6.29); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(px+dh*0.44,by-dh*0.55,dh*0.23,0,6.29); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#efeee8'; ctx.beginPath(); ctx.ellipse(px+dh*0.36,by-dh*0.66,dh*0.09,dh*0.16,0.4,0,6.29); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=dh*0.11; ctx.beginPath(); ctx.moveTo(px-dh*0.40,by-dh*0.48); ctx.lineTo(px-dh*0.56,by-dh*0.64); ctx.stroke();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(px+dh*0.46,by-dh*0.58,dh*0.045,0,6.29); ctx.fill();
      ctx.fillStyle='#3a2a2a'; ctx.beginPath(); ctx.arc(px+dh*0.63,by-dh*0.53,dh*0.05,0,6.29); ctx.fill();
      if(name){ ctx.fillStyle='#fff'; ctx.font='bold '+Math.max(9,dh*0.15)+'px Trebuchet MS'; ctx.fillText(name,px+dh*0.1,by+dh*0.16); } }
    var gap=u*0.46;
    person(cx-gap*1.1,u,'#3a6ea5','#2a2a2a','Daddy');
    person(cx-gap*0.1,u*0.94,'#d06a95','#5a2f14','Mommy');
    dog(cx+gap*1.15,u*0.66,'Arff');
    ctx.restore(); }
  function drawShooter(x,by,u,armUp){ // "Me" shooting
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    var ph=u,hipY=by-ph*0.42, shY=by-ph*0.72, hr=ph*0.17, hcy=by-ph*0.90;
    ctx.lineCap='round'; ctx.strokeStyle='#3a3550'; ctx.lineWidth=ph*0.11;
    ctx.beginPath(); ctx.moveTo(x-ph*0.11,hipY); ctx.lineTo(x-ph*0.12,by); ctx.moveTo(x+ph*0.11,hipY); ctx.lineTo(x+ph*0.12,by); ctx.stroke();
    ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.ellipse(x-ph*0.12,by,ph*0.10,ph*0.05,0,0,6.29); ctx.fill(); ctx.beginPath(); ctx.ellipse(x+ph*0.12,by,ph*0.10,ph*0.05,0,0,6.29); ctx.fill();
    ctx.fillStyle='#e0a030'; rr(x-ph*0.21,shY,ph*0.42,hipY-shY+ph*0.05,ph*0.10); ctx.fill();
    // arms up toward ball
    ctx.strokeStyle='#e0a030'; ctx.lineWidth=ph*0.12; var ay=armUp?shY-ph*0.35:shY+ph*0.05;
    ctx.beginPath(); ctx.moveTo(x-ph*0.18,shY+ph*0.04); ctx.lineTo(x-ph*0.10,ay); ctx.moveTo(x+ph*0.18,shY+ph*0.04); ctx.lineTo(x+ph*0.10,ay); ctx.stroke();
    ctx.fillStyle='#f3c9a0'; ctx.beginPath(); ctx.arc(x,hcy,hr,0,6.29); ctx.fill();
    ctx.fillStyle='#3a2412'; ctx.beginPath(); ctx.arc(x,hcy-hr*0.14,hr*1.02,Math.PI*1.02,Math.PI*1.98); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(x-hr*0.36,hcy+hr*0.05,hr*0.13,0,6.29); ctx.fill(); ctx.beginPath(); ctx.arc(x+hr*0.36,hcy+hr*0.05,hr*0.13,0,6.29); ctx.fill();
    ctx.strokeStyle='#b5453a'; ctx.lineWidth=Math.max(1,ph*0.025); ctx.beginPath(); ctx.arc(x,hcy+hr*0.18,hr*0.42,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold '+Math.max(9,ph*0.15)+'px Trebuchet MS'; ctx.fillText('Me',x,by+ph*0.16);
    ctx.restore(); }
  function draw(){ tt+=0.05;
    // court
    var sky=ctx.createLinearGradient(0,0,0,H*0.55); sky.addColorStop(0,'#2a3a5a'); sky.addColorStop(1,'#46608a'); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.55);
    // crowd dots
    for(var c=0;c<40;c++){ ctx.fillStyle=['#ffd23f','#ff6a6a','#6ad0ff','#8fff9e','#fff'][c%5]; ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc((c*57%W),H*0.10+(c*31%Math.floor(H*0.28)),3,0,6.29); ctx.fill(); } ctx.globalAlpha=1;
    ctx.fillStyle='#c9884a'; ctx.fillRect(0,H*0.55,W,H*0.45);
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,H*0.55); ctx.lineTo(W,H*0.55); ctx.stroke();
    // key / paint
    ctx.fillStyle='rgba(220,120,50,0.6)'; ctx.fillRect(W*0.58,H*0.55,W*0.30,H*0.30); ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.strokeRect(W*0.58,H*0.55,W*0.30,H*0.30);
    ctx.beginPath(); ctx.arc(W*0.73,H*0.55,W*0.12,0,Math.PI); ctx.stroke();
    // backboard + hoop
    var h=hoop(); ctx.fillStyle='#fff'; rr(h.x-6,h.y-h.r*1.7,W*0.03,h.r*2.3,3); ctx.fill(); // pole bit
    ctx.fillStyle='#eef2f8'; rr(h.x-h.r*1.1,h.y-h.r*1.5,h.r*2.2,h.r*1.4,4); ctx.fill(); ctx.strokeStyle='#c33'; ctx.lineWidth=3; rr(h.x-h.r*0.5,h.y-h.r*1.0,h.r,h.r*0.7,3); ctx.stroke();
    ctx.strokeStyle='#e8792a'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(h.x,h.y,h.r,h.r*0.32,0,0,6.29); ctx.stroke();
    // net
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5; for(var nl=0;nl<7;nl++){ var a=nl/6; var nx=h.x-h.r+a*h.r*2; ctx.beginPath(); ctx.moveTo(nx,h.y); ctx.lineTo(h.x-h.r*0.5+a*h.r, h.y+h.r*0.9+Math.sin(tt*3+nl)*2); ctx.stroke(); }
    // cheer squad (with legs) + shooter
    var bnc = (cheer>0? Math.abs(Math.sin(tt*10))*12 : 0) + Math.sin(tt*2.6)*3; if(cheer>0)cheer--;
    drawFamily(W*0.16, H*0.88, Math.min(H*0.15,80), bnc);
    var s=shooter(); drawShooter(s.x, s.y - (ball.held?Math.abs(Math.sin(tt*2.6))*3:0), Math.min(H*0.16,86), ball.held);
    // ball
    var br=Math.min(W*0.05,22);
    if(ball.held){ drawBall(ball.x, ball.y, br); }
    else if(shooting){ if(!ball.resolved){ ball.t+=0.045; } var t=Math.min(1,ball.t);
      ball.x=ball.sx+(ball.ex-ball.sx)*t; ball.y=ball.sy+(ball.ey-ball.sy)*t - ball.arc*Math.sin(Math.PI*t);
      if(ball.resolved && !made){ ball.y+=6; }
      drawBall(ball.x,ball.y,br);
      if(t>=1 && !ball.resolved){ ball.resolved=true; resolve(); } }
    // power meter
    if(running && !shooting){ mx+=mdir*0.024; if(mx>1){mx=1;mdir=-1;} if(mx<0){mx=0;mdir=1;}
      var bw=W*0.7,bx=(W-bw)/2,by=H*0.93,bh=18;
      ctx.fillStyle='rgba(0,0,0,0.35)'; rr(bx,by,bw,bh,9); ctx.fill();
      ctx.fillStyle='rgba(120,255,150,0.55)'; rr(bx+bw*0.57,by,bw*0.26,bh,4); ctx.fill();
      ctx.fillStyle='#ffd23f'; rr(bx+bw*mx-3,by-4,6,bh+8,3); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.5; rr(bx,by,bw,bh,9); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 11px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('GREEN = SWISH',bx+bw*0.70,by-10); }
    // floating msg
    if(msg && !shooting){ ctx.fillStyle='#fff'; ctx.font='bold 20px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText(msg,W/2,H*0.50); }
    // sparks
    for(var sp=sparks.length-1;sp>=0;sp--){ var q=sparks[sp]; q.x+=q.vx; q.y+=q.vy; q.vy+=0.14; q.life--; if(q.life<=0){sparks.splice(sp,1);continue;} ctx.globalAlpha=q.life/26; ctx.fillStyle=q.c; ctx.fillRect(q.x,q.y,3,3); ctx.globalAlpha=1; }
    requestAnimationFrame(draw); }
  var ac; function beep(f,d,ty){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gn=ac.createGain(); o.frequency.value=f; o.type=ty||'square'; o.connect(gn); gn.connect(ac.destination); gn.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('go').onclick=function(){ reset(); };
  document.getElementById('rs').onclick=function(){ reset(); };
  score=0; shots=10; streak=0; running=false; tt=0; mx=0; mdir=1; sparks=[]; cheer=0; msg=''; shooting=false; made=false; var s0=shooter(); ball={x:s0.x,y:s0.y-Math.min(W*0.16,86)*0.55,held:true,t:0};
  requestAnimationFrame(draw);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var Pt=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)Pt.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<Pt.length;i++){ var p=Pt[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),gn=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(gn); gn.connect(a.destination); gn.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function init(){ hookVisible(document.getElementById('over')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body></html>
