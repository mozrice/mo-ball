<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mo Picture Puzzle</title>
<meta name="theme-color" content="#1b2f3c">
<style>
  html, body { margin: 0; height: 100%; background: #12222c;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; color: #eaf2f7; }
  #wrap { max-width: 940px; margin: 0 auto; padding: 8px 10px 24px; text-align: center; }
  h1 { margin: 8px 0 2px; font-size: 25px; letter-spacing: 3px; color: #ffcf5c; text-transform: uppercase; }
  #hint { font-size: 13px; letter-spacing: 1px; color: #9fc0d0; margin-bottom: 6px; }
  #coins { font-size: 16px; font-weight: bold; letter-spacing: 1px; color: #ffcf5c; margin: 2px 0 6px; }
  canvas { width: min(96vw, 900px); height: auto; border-radius: 12px;
    box-shadow: 0 12px 34px rgba(0,0,0,.5); cursor: grab; touch-action: none; background: #16303f; }
  canvas:active { cursor: grabbing; }
  #actions { display: flex; gap: 9px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 14px; font-weight: bold; letter-spacing: 1px; padding: 9px 18px;
    border-radius: 999px; border: none; cursor: pointer; }
  #newBtn { background: #6bd18a; color: #06280f; box-shadow: 0 4px 0 #3a8f56; }
  #peekBtn { background: #f6c945; color: #3a2a00; box-shadow: 0 4px 0 #b8922a; }
  .diff { background: #1b2f3c; color: #dfeaf1; border: 2px solid #2f4a5c; box-shadow: 0 4px 0 #12222c; }
  .diff.sel { background: #274155; border-color: #ffcf5c; color: #ffcf5c; }
  .btn:active { transform: translateY(3px); }
  #msg { height: 20px; font-size: 15px; font-weight: bold; letter-spacing: 1px; color: #6bd18a; margin-top: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🧩 Mo Picture Puzzle</h1>
  <div id="hint">Drag the pieces into the frame to finish the picture!</div>
  <div id="coins">🪙 Coins: 0</div>
  <canvas id="c" width="900" height="600"></canvas>
  <div id="actions">
    <button id="newBtn" class="btn">🧩 New Puzzle</button>
    <button id="peekBtn" class="btn">👀 Peek</button>
    <button id="easyBtn" class="btn diff sel">Easy</button>
    <button id="hardBtn" class="btn diff">Hard</button>
  </div>
  <div id="msg"></div>
</div>

<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const CW = 900, CH = 600;
  canvas.width = CW; canvas.height = CH;

  const BOARD = { x: 44, y: 96, w: 384, h: 384 };
  let GRID = 3;
  let pieces = [], src = null, picName = "", cellW, cellH, margin;
  let placedCount = 0, won = false, peek = false;

  // ---- coin wallet (shared with the other family games) ----
  const coinEl = document.getElementById("coins");
  let coins = 0;
  try { coins = parseInt(localStorage.getItem("hoopCoins") || "0", 10) || 0; } catch (e) {}
  function showCoins() { coinEl.textContent = "🪙 Coins: " + coins; }
  function saveCoins() { try { localStorage.setItem("hoopCoins", String(coins)); } catch (e) {} }
  showCoins();

  const msg = document.getElementById("msg");
  function flash(t, ms) { msg.textContent = t; const cur = t;
    setTimeout(function () { if (msg.textContent === cur) msg.textContent = ""; }, ms || 2200); }

  // ---------- sounds ----------
  let AC = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.value = vol || 0.15; o.connect(g); g.connect(AC.destination);
      const t = AC.currentTime; o.start(t);
      g.gain.setValueAtTime(g.gain.value, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.stop(t + dur);
    } catch (e) {}
  }
  function fanfare() { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, 0.28, "triangle", 0.2); }, i * 130); }); }

  // ---------- pictures (drawn, no image files needed) ----------
  function bg(g, w, h, c1, c2) { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, w, h); }

  function drawBasketball(g, w, h) {
    bg(g, w, h, "#2b5d86", "#173a56");
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.40;
    const rg = g.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.2, cx, cy, r);
    rg.addColorStop(0, "#ffb356"); rg.addColorStop(1, "#d4620f");
    g.fillStyle = rg; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    g.strokeStyle = "#5a2c08"; g.lineWidth = w * 0.018; g.lineCap = "round";
    g.beginPath(); g.moveTo(cx - r, cy); g.lineTo(cx + r, cy);
    g.moveTo(cx, cy - r); g.lineTo(cx, cy + r); g.stroke();
    g.beginPath(); g.arc(cx - r * 0.55, cy, r, -1.1, 1.1); g.stroke();
    g.beginPath(); g.arc(cx + r * 0.55, cy, r, Math.PI - 1.1, Math.PI + 1.1); g.stroke();
  }
  function drawSmiley(g, w, h) {
    bg(g, w, h, "#8fd0ff", "#cdecff");
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.40;
    g.fillStyle = "#ffd93b"; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    g.strokeStyle = "#e0a800"; g.lineWidth = w * 0.02; g.stroke();
    g.fillStyle = "#3a2a00";
    g.beginPath(); g.arc(cx - r * 0.38, cy - r * 0.2, r * 0.11, 0, 7); g.fill();
    g.beginPath(); g.arc(cx + r * 0.38, cy - r * 0.2, r * 0.11, 0, 7); g.fill();
    g.lineWidth = w * 0.028; g.strokeStyle = "#3a2a00"; g.lineCap = "round";
    g.beginPath(); g.arc(cx, cy + r * 0.05, r * 0.55, 0.3, Math.PI - 0.3); g.stroke();
  }
  function drawHouse(g, w, h) {
    bg(g, w, h, "#a7ddf2", "#dff2fb");
    g.fillStyle = "#ffd93b"; g.beginPath(); g.arc(w * 0.18, h * 0.2, w * 0.08, 0, 7); g.fill();
    g.fillStyle = "#4bbf5a"; g.fillRect(0, h * 0.78, w, h * 0.22);
    const bx = w * 0.28, bw = w * 0.44, by = h * 0.42, bh = h * 0.38;
    g.fillStyle = "#f2e9dc"; g.fillRect(bx, by, bw, bh);
    g.fillStyle = "#d23b3b"; g.beginPath(); g.moveTo(bx - w * 0.03, by); g.lineTo(bx + bw / 2, by - h * 0.22); g.lineTo(bx + bw + w * 0.03, by); g.closePath(); g.fill();
    g.fillStyle = "#7a4b25"; g.fillRect(bx + bw * 0.4, by + bh * 0.45, bw * 0.2, bh * 0.55);
    g.fillStyle = "#8fd3ff"; g.fillRect(bx + bw * 0.12, by + bh * 0.2, bw * 0.2, bh * 0.22);
    g.fillRect(bx + bw * 0.68, by + bh * 0.2, bw * 0.2, bh * 0.22);
  }
  function drawRocket(g, w, h) {
    bg(g, w, h, "#0d1b3a", "#26346a");
    g.fillStyle = "#fff";
    const st = [[0.15,0.2],[0.8,0.15],[0.7,0.4],[0.25,0.55],[0.85,0.7],[0.12,0.78],[0.5,0.28]];
    st.forEach(function (s) { g.beginPath(); g.arc(w * s[0], h * s[1], 2.4, 0, 7); g.fill(); });
    const cx = w / 2;
    g.fillStyle = "#ff7a3c"; g.beginPath();
    g.moveTo(cx, h * 0.82); g.quadraticCurveTo(cx - w * 0.05, h * 0.9, cx, h * 0.98); g.quadraticCurveTo(cx + w * 0.05, h * 0.9, cx, h * 0.82); g.fill();
    g.fillStyle = "#e8edf2"; g.beginPath();
    g.moveTo(cx, h * 0.12); g.quadraticCurveTo(cx + w * 0.16, h * 0.45, cx + w * 0.12, h * 0.8);
    g.lineTo(cx - w * 0.12, h * 0.8); g.quadraticCurveTo(cx - w * 0.16, h * 0.45, cx, h * 0.12); g.fill();
    g.fillStyle = "#d23b3b";
    g.beginPath(); g.moveTo(cx - w * 0.12, h * 0.62); g.lineTo(cx - w * 0.24, h * 0.82); g.lineTo(cx - w * 0.12, h * 0.8); g.fill();
    g.beginPath(); g.moveTo(cx + w * 0.12, h * 0.62); g.lineTo(cx + w * 0.24, h * 0.82); g.lineTo(cx + w * 0.12, h * 0.8); g.fill();
    g.fillStyle = "#8fd3ff"; g.beginPath(); g.arc(cx, h * 0.42, w * 0.08, 0, 7); g.fill();
    g.strokeStyle = "#3f6fa0"; g.lineWidth = w * 0.015; g.stroke();
  }
  function drawStar(g, w, h) {
    bg(g, w, h, "#5b3a9e", "#8a5fd0");
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.42, r = R * 0.45;
    g.fillStyle = "#ffd93b"; g.beginPath();
    for (let i = 0; i < 10; i++) { const ang = -Math.PI / 2 + i * Math.PI / 5; const rad = i % 2 ? r : R;
      const x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad; i ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.closePath(); g.fill(); g.strokeStyle = "#e0a800"; g.lineWidth = w * 0.015; g.stroke();
    g.fillStyle = "#fff";
    [[0.2,0.25],[0.82,0.3],[0.75,0.78],[0.22,0.75]].forEach(function (s) { g.beginPath(); g.arc(w * s[0], h * s[1], 3, 0, 7); g.fill(); });
  }
  function drawFish(g, w, h) {
    bg(g, w, h, "#1a86c0", "#0c4f7a");
    g.fillStyle = "rgba(255,255,255,.35)";
    [[0.7,0.25,7],[0.8,0.4,5],[0.72,0.5,4],[0.2,0.7,6]].forEach(function (b) { g.beginPath(); g.arc(w * b[0], h * b[1], b[2], 0, 7); g.fill(); });
    const cx = w * 0.46, cy = h / 2;
    g.fillStyle = "#ff8a3c"; g.beginPath(); g.ellipse(cx, cy, w * 0.26, h * 0.17, 0, 0, 7); g.fill();
    g.beginPath(); g.moveTo(cx + w * 0.2, cy); g.lineTo(cx + w * 0.36, cy - h * 0.12); g.lineTo(cx + w * 0.36, cy + h * 0.12); g.closePath(); g.fill();
    g.fillStyle = "#ffb37a"; g.beginPath(); g.moveTo(cx, cy - h * 0.15); g.quadraticCurveTo(cx, cy - h * 0.28, cx - w * 0.1, cy - h * 0.16); g.fill();
    g.fillStyle = "#fff"; g.beginPath(); g.arc(cx - w * 0.13, cy - h * 0.03, w * 0.035, 0, 7); g.fill();
    g.fillStyle = "#22303a"; g.beginPath(); g.arc(cx - w * 0.14, cy - h * 0.03, w * 0.017, 0, 7); g.fill();
  }
  function drawCourt(g, w, h) {
    // wood floor
    const fl = g.createLinearGradient(0, 0, 0, h);
    fl.addColorStop(0, "#e6b271"); fl.addColorStop(1, "#b57238");
    g.fillStyle = fl; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(120,70,20,.28)"; g.lineWidth = Math.max(1, w * 0.006);
    for (let i = 1; i < 10; i++) { g.beginPath(); g.moveTo(i * w / 10, 0); g.lineTo(i * w / 10, h); g.stroke(); }

    const cx = w / 2, LW = w * 0.014;
    g.strokeStyle = "#f4f7fa"; g.lineWidth = LW; g.lineCap = "round"; g.lineJoin = "round";

    // half-court line + centre circle at the bottom
    g.beginPath(); g.moveTo(0, h - LW / 2); g.lineTo(w, h - LW / 2); g.stroke();
    g.beginPath(); g.arc(cx, h, w * 0.13, Math.PI, 2 * Math.PI); g.stroke();

    // painted key (the "paint") up from the baseline at the top
    const keyW = w * 0.30, keyH = h * 0.40, keyX = cx - keyW / 2;
    g.fillStyle = "rgba(44,111,151,.85)"; g.fillRect(keyX, 0, keyW, keyH);
    g.strokeRect(keyX, 0, keyW, keyH);

    // free-throw circle at the end of the key
    g.beginPath(); g.arc(cx, keyH, w * 0.15, 0, 7); g.stroke();

    // three-point line: two straight sides that meet a big arc cleanly
    const tpR = w * 0.42, hoopY = h * 0.06, sxx = w * 0.40, meetY = hoopY + w * 0.128;
    g.beginPath();
    g.moveTo(cx - sxx, 0); g.lineTo(cx - sxx, meetY);
    g.arc(cx, hoopY, tpR, Math.PI - 0.309, 0.309, true);
    g.lineTo(cx + sxx, 0); g.stroke();

    // backboard + hoop at the top
    g.strokeStyle = "#f4f7fa"; g.lineWidth = w * 0.02;
    g.beginPath(); g.moveTo(cx - w * 0.09, hoopY - h * 0.02); g.lineTo(cx + w * 0.09, hoopY - h * 0.02); g.stroke();
    g.strokeStyle = "#ff7a1c"; g.lineWidth = w * 0.016;
    g.beginPath(); g.arc(cx, hoopY + h * 0.015, w * 0.05, 0, 7); g.stroke();
  }
  const PICS = [
    { fn: drawCourt, name: "basketball court 🏀" },
    { fn: drawBasketball, name: "basketball 🏀" },
    { fn: drawSmiley, name: "smiley face 😀" },
    { fn: drawHouse, name: "house 🏠" },
    { fn: drawRocket, name: "rocket 🚀" },
    { fn: drawStar, name: "star ⭐" },
    { fn: drawFish, name: "fish 🐠" }
  ];
  let lastPic = -1;

  // ---------- one jigsaw edge with a bump in the middle ----------
  function edge(g, ax, ay, bx, by, wnx, wny, bump) {
    if (!bump) { g.lineTo(bx, by); return; }
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len, r = len * 0.13;
    const p1x = mx - ux * r, p1y = my - uy * r, p2x = mx + ux * r, p2y = my + uy * r;
    g.lineTo(p1x, p1y);
    g.bezierCurveTo(p1x + wnx * bump * r * 1.5, p1y + wny * bump * r * 1.5,
                    p2x + wnx * bump * r * 1.5, p2y + wny * bump * r * 1.5, p2x, p2y);
    g.lineTo(bx, by);
  }

  function buildPuzzle() {
    won = false; placedCount = 0; pieces = []; peek = false;
    let pi = Math.floor(Math.random() * PICS.length);
    if (pi === lastPic) pi = (pi + 1) % PICS.length;
    lastPic = pi; picName = PICS[pi].name;
    // render the full picture onto a source canvas
    src = document.createElement("canvas"); src.width = BOARD.w; src.height = BOARD.h;
    PICS[pi].fn(src.getContext("2d"), BOARD.w, BOARD.h);

    cellW = BOARD.w / GRID; cellH = BOARD.h / GRID;
    margin = Math.ceil(Math.min(cellW, cellH) * 0.26);

    // shared bump maps so neighbouring edges interlock
    const Hb = [], Vb = [];
    for (let r = 0; r < GRID - 1; r++) { Hb[r] = []; for (let c = 0; c < GRID; c++) Hb[r][c] = Math.random() < 0.5 ? -1 : 1; }
    for (let r = 0; r < GRID; r++) { Vb[r] = []; for (let c = 0; c < GRID - 1; c++) Vb[r][c] = Math.random() < 0.5 ? -1 : 1; }

    for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) {
      const x0 = c * cellW, y0 = r * cellH, x1 = x0 + cellW, y1 = y0 + cellH;
      const topB = r > 0 ? Hb[r - 1][c] : 0;
      const botB = r < GRID - 1 ? Hb[r][c] : 0;
      const leftB = c > 0 ? Vb[r][c - 1] : 0;
      const rightB = c < GRID - 1 ? Vb[r][c] : 0;

      const pw = cellW + 2 * margin, ph = cellH + 2 * margin;
      const pc = document.createElement("canvas"); pc.width = pw; pc.height = ph;
      const g = pc.getContext("2d");
      g.translate(margin - x0, margin - y0);
      g.beginPath(); g.moveTo(x0, y0);
      edge(g, x0, y0, x1, y0, 0, 1, topB);   // top,   normal down
      edge(g, x1, y0, x1, y1, 1, 0, rightB);  // right,  normal right
      edge(g, x1, y1, x0, y1, 0, 1, botB);    // bottom, normal down
      edge(g, x0, y1, x0, y0, 1, 0, leftB);   // left,   normal right
      g.closePath();
      g.save(); g.clip(); g.drawImage(src, 0, 0);
      // soft top-left highlight for a 3D piece look
      g.globalCompositeOperation = "source-atop";
      const hl = g.createLinearGradient(x0, y0, x1, y1);
      hl.addColorStop(0, "rgba(255,255,255,.16)"); hl.addColorStop(0.5, "rgba(255,255,255,0)");
      g.fillStyle = hl; g.fillRect(x0 - margin, y0 - margin, pw, ph);
      g.restore();
      g.lineWidth = 2; g.strokeStyle = "rgba(20,30,40,.55)"; g.stroke();

      pieces.push({ img: pc, w: pw, h: ph, c: c, r: r,
        cx: BOARD.x + x0 - margin, cy: BOARD.y + y0 - margin,
        x: 0, y: 0, placed: false });
    }
    scatter();
    draw();
  }

  function scatter() {
    // pile the pieces in the open area to the right of the board
    const zone = { x0: BOARD.x + BOARD.w + 16, x1: CW - 12, y0: 84, y1: CH - 12 };
    pieces.forEach(function (p) {
      const maxX = Math.max(zone.x0, zone.x1 - p.w);
      const maxY = Math.max(zone.y0, zone.y1 - p.h);
      p.x = Math.round(zone.x0 + Math.random() * (maxX - zone.x0));
      p.y = Math.round(zone.y0 + Math.random() * (maxY - zone.y0));
      p.placed = false;
    });
    // shuffle draw order
    for (let i = pieces.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pieces[i]; pieces[i] = pieces[j]; pieces[j] = t; }
  }

  // ---------- rendering ----------
  function roundRect(g, x, y, w, h, r) { g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  function draw() {
    ctx.clearRect(0, 0, CW, CH);
    const bgGrad = ctx.createLinearGradient(0, 0, 0, CH);
    bgGrad.addColorStop(0, "#173445"); bgGrad.addColorStop(1, "#0f2531");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, CW, CH);

    // tray label
    ctx.fillStyle = "rgba(255,255,255,.32)"; ctx.font = "bold 15px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("↑ pieces — drag them into the frame ↑", BOARD.x + BOARD.w + 16 + (CW - (BOARD.x + BOARD.w + 16)) / 2 - 8, 70);

    // board frame + faint hint
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
    ctx.fillStyle = "#0c1a22"; roundRect(ctx, BOARD.x - 8, BOARD.y - 8, BOARD.w + 16, BOARD.h + 16, 14); ctx.fill();
    ctx.restore();
    ctx.save(); roundRect(ctx, BOARD.x, BOARD.y, BOARD.w, BOARD.h, 6); ctx.clip();
    ctx.fillStyle = "#1b333f"; ctx.fillRect(BOARD.x, BOARD.y, BOARD.w, BOARD.h);
    if (src) { ctx.globalAlpha = (peek || won) ? 1 : 0.16; ctx.drawImage(src, BOARD.x, BOARD.y); ctx.globalAlpha = 1; }
    // grid guide lines
    if (!won) {
      ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(BOARD.x + i * cellW, BOARD.y); ctx.lineTo(BOARD.x + i * cellW, BOARD.y + BOARD.h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(BOARD.x, BOARD.y + i * cellH); ctx.lineTo(BOARD.x + BOARD.w, BOARD.y + i * cellH); ctx.stroke();
      }
    }
    ctx.restore();

    // placed pieces first, then loose pieces on top (in array order = z order)
    pieces.forEach(function (p) { if (p.placed) ctx.drawImage(p.img, p.x, p.y); });
    pieces.forEach(function (p) { if (!p.placed) ctx.drawImage(p.img, p.x, p.y); });

    if (won) {
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, 0, CW, CH);
      ctx.save(); roundRect(ctx, BOARD.x, BOARD.y, BOARD.w, BOARD.h, 6); ctx.clip();
      ctx.drawImage(src, BOARD.x, BOARD.y); ctx.restore();
      ctx.textAlign = "center"; ctx.fillStyle = "#ffcf5c";
      ctx.font = "bold 34px Trebuchet MS, sans-serif";
      ctx.fillText("🎉 You did it! 🎉", CW / 2, 52);
    }
  }

  // ---------- dragging ----------
  let drag = null, offX = 0, offY = 0;
  const hit = document.createElement("canvas"); const hitCtx = hit.getContext("2d");
  function pointAt(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / rect.width * CW, y: (e.clientY - rect.top) / rect.height * CH };
  }
  function pieceUnder(px, py) {
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      if (p.placed) continue;
      if (px < p.x || px > p.x + p.w || py < p.y || py > p.y + p.h) continue;
      hit.width = p.w; hit.height = p.h; hitCtx.clearRect(0, 0, p.w, p.h); hitCtx.drawImage(p.img, 0, 0);
      const a = hitCtx.getImageData(Math.floor(px - p.x), Math.floor(py - p.y), 1, 1).data[3];
      if (a > 30) return i;
    }
    return -1;
  }
  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (won) return;
    const pt = pointAt(e);
    const i = pieceUnder(pt.x, pt.y);
    if (i < 0) return;
    const p = pieces[i];
    pieces.splice(i, 1); pieces.push(p);       // bring to top
    drag = p; offX = pt.x - p.x; offY = pt.y - p.y;
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!drag) return; e.preventDefault();
    const pt = pointAt(e);
    drag.x = pt.x - offX; drag.y = pt.y - offY; draw();
  });
  function dropPiece() {
    if (!drag) return;
    const snap = Math.min(cellW, cellH) * 0.32;
    if (Math.abs(drag.x - drag.cx) < snap && Math.abs(drag.y - drag.cy) < snap) {
      drag.x = drag.cx; drag.y = drag.cy; drag.placed = true; placedCount++;
      beep(660, 0.12, "square", 0.12);
      if (placedCount === pieces.length) winGame();
    }
    drag = null; draw();
  }
  window.addEventListener("pointerup", dropPiece);
  window.addEventListener("pointercancel", dropPiece);

  function winGame() {
    won = true;
    const reward = GRID === 3 ? 25 : 60;
    coins += reward; saveCoins(); showCoins();
    fanfare();
    flash("You finished the " + picName + "!  +" + reward + " coins 🎉", 4000);
  }

  // ---------- buttons ----------
  document.getElementById("newBtn").addEventListener("click", function () { buildPuzzle(); flash("New puzzle — good luck! 🧩"); });
  document.getElementById("peekBtn").addEventListener("click", function () {
    peek = true; draw();
    setTimeout(function () { peek = false; draw(); }, 1500);
    flash("Here's the picture — memorize it! 👀", 1500);
  });
  const easyBtn = document.getElementById("easyBtn"), hardBtn = document.getElementById("hardBtn");
  easyBtn.addEventListener("click", function () { if (GRID === 3) return; GRID = 3; easyBtn.classList.add("sel"); hardBtn.classList.remove("sel"); buildPuzzle(); });
  hardBtn.addEventListener("click", function () { if (GRID === 4) return; GRID = 4; hardBtn.classList.add("sel"); easyBtn.classList.remove("sel"); buildPuzzle(); });

  buildPuzzle();
})();
</script>
</body>
</html>
