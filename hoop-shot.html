<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoop Shot</title>
<meta name="description" content="Tap to shoot the basketball into the hoop.">

<!-- These lines are what turn the page into an installable app -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12232e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Hoop Shot">

<body>

<h1>Hoop Shot</h1>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    touch-action: manipulation;   /* no accidental zoom when tapping fast */
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #12232e;
    color: #f4f7f9;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #7fb2c9;
  }

  /* ---- the two-player scoreboard ---- */
  #scoreboard {
    display: flex;
    gap: 10px;
  }

  .team {
    min-width: 140px;
    padding: 6px 16px 8px;
    border-radius: 10px;
    text-align: center;
    background: #1b2f3c;
    border: 2px solid #2f4a5c;
    opacity: 0.5;                       /* the player who is waiting goes dim */
    transition: opacity 0.2s, border-color 0.2s;
  }

  .team.active { opacity: 1; }
  .team.p1.active { border-color: #4f9de0; }
  .team.p2.active { border-color: #ff8b2c; }

  .team .who {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .team.p1 .who { color: #4f9de0; }
  .team.p2 .who { color: #ff8b2c; }

  .team .pts {
    font-size: 30px;
    font-weight: bold;
    color: #ffcf5c;
  }

  #turn {
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9fc0d0;
    min-height: 20px;
  }

  #winner {
    display: none;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffcf5c;
  }

  #winner.show { display: block; }

  #againBtn { display: none; }
  #againBtn.show { display: inline-block; }

  .team .games {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #9fc0d0;
  }

  #series {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6f8b9b;
  }

  #coins2d {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #ffd84a;
    margin-top: 4px;
  }
  #coins2d.pop { animation: coinpop 0.4s ease-out; }
  #buyBtn2 { font-size: 13px; letter-spacing: 1px; padding: 5px 14px; margin-top: 4px;
    background: #ffd84a; color: #3a2a00; box-shadow: 0 3px 0 #b8922a; }
  @keyframes coinpop { 0%{transform:scale(1);} 40%{transform:scale(1.3);} 100%{transform:scale(1);} }

  #nextBtn { display: none; }
  #nextBtn.show { display: inline-block; }

  /* ---- the Rebound / Block / Time Out row ---- */
  #actionRow { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .actbtn { font-size: 16px; letter-spacing: 1px; padding: 9px 18px; box-shadow: 0 4px 0 #b85c12; }
  #reboundBtn { background: #f6c945; color: #3a2a00; box-shadow: 0 4px 0 #b8922a; }
  #blockBtn2 { background: #ef8f7a; color: #3a0c00; box-shadow: 0 4px 0 #b85a49; }
  #toBtn2 { background: #7fd0ff; color: #082430; box-shadow: 0 4px 0 #3f7f9f; }
  #dunkBtn2 { background: #ff5a3c; color: #fff2ee; box-shadow: 0 4px 0 #b83a26; }
  #stealBtn2 { background: #4fd0c0; color: #06322c; box-shadow: 0 4px 0 #2f8f83; }
  #dblBtn2 { background: #9b8cff; color: #14103a; box-shadow: 0 4px 0 #6a5cc0; }

  svg {
    width: min(94vw, 900px);
    height: auto;
    border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    cursor: pointer;
  }

  button {
    font: inherit;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
    padding: 12px 40px;
    border: none;
    border-radius: 999px;
    background: #ff8b2c;
    color: #2a1200;
    cursor: pointer;
    box-shadow: 0 6px 0 #b85c12;
  }

  button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b85c12;
  }

  button:disabled {
    background: #6a7580;
    color: #39424a;
    box-shadow: 0 6px 0 #454e56;
    cursor: default;
  }

  /* ---- the Practice / 1-on-1 mode picker ---- */
  #modes { display: flex; gap: 10px; }

  .modebtn {
    font: inherit;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 999px;
    border: 2px solid #2f4a5c;
    background: #1b2f3c;
    color: #9fc0d0;
    box-shadow: none;
    cursor: pointer;
  }

  .modebtn:active { transform: none; box-shadow: none; }
  .modebtn.active { background: #ff8b2c; color: #2a1200; border-color: #ff8b2c; }

  #nameInput {
    display: none;
    font: inherit;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 12px;
    width: 110px;
    text-align: center;
    border-radius: 999px;
    border: 2px solid #ff8b2c;
    background: #0e1a22;
    color: #f4f7f9;
    outline: none;
  }
  #nameInput.show { display: inline-block; }

  /* ---- the poses ---- */
  /* The boy and the dog are built on the same joints, so these rules pose
     both of them. Change the numbers to change the pose! */
  #player, #dog,
  #player g, #dog g {
    transition: transform 0.3s cubic-bezier(0.34, 1.25, 0.64, 1);
    transform-box: view-box;
  }

  .legL,
  .legR { transform-origin: 120px 272px; }  /* the hips */

  .armL,
  .armR { transform-origin: 120px 222px; }  /* the shoulders */

  #player, #dog { transform-origin: 120px 340px; } /* the feet */

  /* Pose 2: bend down and get ready */
  .crouch { transform: translateY(16px); }
  .crouch .legL { transform: rotate(-15deg); }
  .crouch .legR { transform: rotate(13deg); }
  .crouch .armL { transform: rotate(30deg); }
  .crouch .armR { transform: rotate(26deg); }

  /* Pose 3: jump up and push the ball away */
  .release { transform: translateY(-16px); }
  .release .legL { transform: rotate(7deg); }
  .release .legR { transform: rotate(-9deg); }
  .release .armL { transform: rotate(-100deg); }
  .release .armR { transform: rotate(-104deg); }

  /* Defense: stand tall with both arms up to contest the dog's shot */
  .guard .armL { transform: rotate(-150deg); }
  .guard .armR { transform: rotate(-168deg); }
  .guard .legL { transform: rotate(-6deg); }
  .guard .legR { transform: rotate(6deg); }

  /* ---- in a game both are on court (one shoots, one defends); JS hides the
         dog in Practice ---- */
  #dog { display: block; }

  /* ---- the net shaking when the ball goes in ---- */
  /* Both nets share this. The left hoop is drawn flipped over, so inside its
     own back-to-front world its net sits at exactly the same spot. */
  #net  { transform-box: view-box; transform-origin: 640px 130px; }
  #netL { transform-box: view-box; transform-origin: 480px 130px; }
  #net.swish, #netL.swish { animation: wobble 0.55s ease-out; }

  @keyframes wobble {
    0%   { transform: scaleY(1)    scaleX(1); }
    25%  { transform: scaleY(1.35) scaleX(0.82); }
    55%  { transform: scaleY(0.92) scaleX(1.1); }
    80%  { transform: scaleY(1.08) scaleX(0.96); }
    100% { transform: scaleY(1)    scaleX(1); }
  }

  /* ---- the shot clock ---- */
  #shotClockText {
    font-family: "Courier New", monospace;
    font-size: 26px;
    font-weight: bold;
    fill: #ffcf5c;
  }

  /* the last few seconds go red */
  #shotClockText.low { fill: #e5533d; }

  /* ---- the 10-minute game clock, up in the middle ---- */
  #gameClockText {
    font-family: "Courier New", monospace;
    font-size: 23px;
    font-weight: bold;
    fill: #cfe0ea;
  }

  /* the last minute goes red */
  #gameClockText.low { fill: #e5533d; }

  /* ---- the SWISH! word ---- */
  #swish { opacity: 0; transform-box: view-box; transform-origin: 640px 70px; }
  #swish.show { animation: pop 1s ease-out; }

  /* ---- the MISS! word, same trick as SWISH ---- */
  #miss { opacity: 0; transform-box: view-box; transform-origin: 640px 70px; }
  #miss.show { animation: pop 1s ease-out; }

  /* ---- the SHOT CLOCK! word for a 24-second violation ---- */
  /* It pops up in the middle of the court, not over a hoop. */
  #violation { opacity: 0; transform-box: view-box; transform-origin: 380px 70px; }
  #violation.show { animation: pop 1.2s ease-out; }

  /* ---- the REBOUND! / BLOCK! / TIME OUT word ---- */
  #note { opacity: 0; transform-box: view-box; transform-origin: 380px 100px; }
  #note.show { animation: pop 1.1s ease-out; }

  /* On the dog's go the words pop up over the left hoop instead */
  #court.dogTurn #swish,
  #court.dogTurn #miss { transform-origin: 120px 70px; }

  @keyframes pop {
    0%   { opacity: 0; transform: scale(0.3) translateY(10px); }
    25%  { opacity: 1; transform: scale(1.2) translateY(-6px); }
    40%  { opacity: 1; transform: scale(1)   translateY(-8px); }
    100% { opacity: 0; transform: scale(1)   translateY(-30px); }
  }
</style>

<div id="scoreboard">
  <div class="team p1 active" id="team1">
    <div class="who">You</div>
    <div class="pts" id="pts1">0</div>
    <div class="games" id="games1">Games 0</div>
  </div>
  <div class="team p2" id="team2">
    <div class="who">Puppy</div>
    <div class="pts" id="pts2">0</div>
    <div class="games" id="games2">Games 0</div>
  </div>
</div>

<div id="series">Best of 3 &middot; 10 minutes &middot; most points wins</div>
<div id="coins2d">&#128176; $0.00</div>
<button id="buyBtn2">&#128722; Buy 30 coins (pretend)</button>

  <button id="practiceBtn" class="modebtn">Practice</button>
  <button id="gameBtn" class="modebtn active">1 on 1</button>

  <input id="nameInput" maxlength="10" placeholder="Name" autocomplete="off">
</div>

<div id="turn">Your ball</div>
<div id="winner"></div>

<svg id="court" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">

    <!-- a big fluffy top-knot and cheek fur framing the face -->
    <g fill="#f4efe5" stroke="none">
      <circle cx="106" cy="173" r="8.5"/>
      <circle cx="120" cy="167" r="9.5"/>
      <circle cx="134" cy="173" r="8.5"/>
      <circle cx="98"  cy="185" r="7.5"/>

    <!-- lighter muzzle, pink nose and mouth -->
    <ellipse cx="120" cy="201" rx="12" ry="9" fill="#f0e8da" stroke="none"/>
    <ellipse cx="120" cy="197" rx="5" ry="3.8" fill="#ef9ab4" stroke="none"/>
    <ellipse cx="118.5" cy="195.8" rx="1.4" ry="1" fill="#ffc7d8" stroke="none"/>
    <path d="M114 206 Q120 210 126 206" stroke="#7a5030" stroke-width="2" fill="none"/>

    <!-- big puppy eyes with a glint -->
    <circle cx="110" cy="185" r="4.2" fill="#2a1a10" stroke="none"/>
    <circle cx="130" cy="185" r="4.2" fill="#2a1a10" stroke="none"/>
    <circle cx="111.3" cy="183.6" r="1.4" fill="#ffffff" stroke="none"/>
    <circle cx="131.3" cy="183.6" r="1.4" fill="#ffffff" stroke="none"/>

    <!-- front paws -->

    </g>
  </g>
  </g>

  <!-- the power meter: an UPRIGHT bar. Hold SHOOT and the yellow fill climbs;
       let go when it reaches the green band and the ball goes in. Drawn here
       (after the players) so it stays on top and is always easy to see. -->
  <g id="meter">
    <rect x="369" y="185" width="22" height="145" rx="6"
          fill="#0e1a22" stroke="#5b6b76" stroke-width="2" opacity="0.92"/>
    <!-- the green band sits where a perfect-power shot goes in -->

    <!-- the fill grows UP from the foot of the bar -->

  <!-- the ball -->

    <path d="M-13 0 H13 M0 -13 V13" stroke="#8a3c0d" stroke-width="1.5" fill="none"/>
    <path d="M-9.5 -9 Q-1 0 -9.5 9" stroke="#8a3c0d" stroke-width="1.5" fill="none"/>
    <path d="M9.5 -9 Q1 0 9.5 9" stroke="#8a3c0d" stroke-width="1.5" fill="none"/>
  </g>

  <text id="swish" x="640" y="70" text-anchor="middle"
        font-family="Trebuchet MS, sans-serif" font-size="34" font-weight="bold"
        fill="#ffcf5c" stroke="#7a4a00" stroke-width="1">SWISH!</text>

  <text id="miss" x="640" y="70" text-anchor="middle"
        font-family="Trebuchet MS, sans-serif" font-size="34" font-weight="bold"
        fill="#e5533d" stroke="#5a1a10" stroke-width="1">MISS!</text>

  <text id="violation" x="380" y="70" text-anchor="middle"
        font-family="Trebuchet MS, sans-serif" font-size="30" font-weight="bold"
        fill="#e5533d" stroke="#5a1a10" stroke-width="1">SHOT CLOCK!</text>

  <text id="note" x="380" y="100" text-anchor="middle"
        font-family="Trebuchet MS, sans-serif" font-size="30" font-weight="bold"
        fill="#6bd18a" stroke="#0c3a1c" stroke-width="1">REBOUND!</text>
</svg>

<button id="shootBtn">HOLD TO SHOOT</button>
<div id="actionRow">
  <button id="reboundBtn" class="actbtn">&#128587; Rebound</button>
  <button id="blockBtn2" class="actbtn">&#9995; Block</button>
  <button id="dunkBtn2" class="actbtn">&#128293; Dunk</button>
  <button id="stealBtn2" class="actbtn">&#9994; Steal</button>
  <button id="dblBtn2" class="actbtn">&#128101; Double</button>
  <button id="toBtn2" class="actbtn">&#9200; Time Out</button>
</div>
<button id="nextBtn">NEXT QUARTER</button>
<button id="againBtn">PLAY AGAIN</button>

<script>
  // ---- Numbers you can play with ----
  const GRAVITY = 900;     // how hard the ball falls. Bigger = drops faster.
  const FLIGHT_TIME = 1.0; // seconds it takes to reach the hoop
  const CROUCH_END = 0.32; // seconds spent bending down
  const WINDUP_END = 0.50; // seconds until the ball leaves the hands
  const BOUNCE = 0.45;     // how bouncy the floor is (0 = no bounce)
  const SHOT_CLOCK = 24;   // seconds on the shot clock. Try 5 to make it panic!
  const QUARTERS = 4;      // a full game is four 10-minute quarters
  const METER_SPEED = 45;  // how fast the power bar moves. Bigger = harder!
  const RIM_WIDTH = 36;    // how near the middle of the rim you have to be
                           // (widened for the longer court, so the green band
                           //  on the power bar still matches makeable shots)
  const DOG_SKILL = 0.6;   // how often the dog scores. 1 means it never misses
  const GREEN_HALF = 4.0;  // half the scoring band, in power-bar numbers.
                           // Measure it before changing - if this is wrong,
                           // DOG_SKILL stops meaning what it says.

  const FLOOR = 327;                  // where the ball rests on the ground

  // Each shooter has their own end of the court. The dog's numbers are the
  // boy's numbers flipped over: 600 minus the boy's x. Change one and flip it
  // for the other, or the two ends stop matching.
  const SIDES = [
    {                                  // the boy: stands left, shoots right
      hands:   { x: 216, y: 250 },     // ball waiting in the hands
      chest:   { x: 210, y: 268 },     // ball tucked in while crouching
      release: { x: 200, y: 168 },     // ball leaving the fingertips
      hoop:    { x: 640, y: 130 },     // middle of the rim he aims at
      net: "net"
    },
    {                                  // the dog: stands right, shoots left
      hands:   { x: 544, y: 250 },
      chest:   { x: 550, y: 268 },
      release: { x: 560, y: 168 },
      hoop:    { x: 120, y: 130 },
      net: "netL"
    }
  ];

  const ball = document.getElementById("ball");
  const player = document.getElementById("player");
  const dog = document.getElementById("dog");
  const boySide = document.getElementById("boySide");
  const dogSide = document.getElementById("dogSide");
  const nets = {
    net:  document.getElementById("net"),
    netL: document.getElementById("netL")
  };
  const swish = document.getElementById("swish");
  const btn = document.getElementById("shootBtn");
  const againBtn = document.getElementById("againBtn");
  const nextBtn = document.getElementById("nextBtn");
  const games1 = document.getElementById("games1");
  const games2 = document.getElementById("games2");
  const court = document.getElementById("court");
  const miss = document.getElementById("miss");
  const violation = document.getElementById("violation");
  const turnEl = document.getElementById("turn");
  const winnerEl = document.getElementById("winner");
  const team1 = document.getElementById("team1");
  const team2 = document.getElementById("team2");
  const pts1 = document.getElementById("pts1");
  const pts2 = document.getElementById("pts2");
  const practiceBtn = document.getElementById("practiceBtn");
  const gameBtn = document.getElementById("gameBtn");
  const musicBtn = document.getElementById("musicBtn");
  const seriesEl = document.getElementById("series");

  let scores = [0, 0];     // points in the game being played. [you, dog]
  let quarter = 1;         // which quarter we're in (1..4)
  let turn = 0;            // 0 means it is your shot, 1 means it is the dog's
  let gameOver = false;    // this game has been won, waiting for NEXT GAME
  let seriesOver = false;  // somebody has won the whole series
  let shooting = false;
  let mode = "game";       // "game" = 1-on-1 vs the dog, "practice" = just you
  let wantRebound = false; // you tapped REBOUND during your miss -> keep the ball
  let blockedShot = false; // you tapped BLOCK during the dog's shot -> it misses
  let paused = false;      // a time out is on -> clocks are frozen
  let ftPending = false;   // you drew an AND 1 -> one free throw is owed
  let shootingFT = false;  // the shot in progress is that free throw
  const FT_OFFSET = 324;   // the free-throw spot: stand out in front of the hoop

  // ---- coins: earn by scoring, spend to play games; saved + shared with the 3D game ----
  const COIN_VALUE = 0.30;       // each coin is worth 30 cents
  const GAME_COST = 30;          // a game costs 30 coins to play
  const coins2dEl = document.getElementById("coins2d");
  let coins = 30;                // start with enough for one game
  try { const s = localStorage.getItem("hoopCoins"); if (s !== null) coins = parseInt(s, 10) || 0; } catch (e) {}
  function saveCoins() { try { localStorage.setItem("hoopCoins", coins); } catch (e) {} }
  function renderCoins() { if (coins2dEl) coins2dEl.textContent = "🪙 " + coins + " · $" + (coins * COIN_VALUE).toFixed(2); }
  function addCoins(n) {
    coins += n; saveCoins(); renderCoins();
    if (coins2dEl) { coins2dEl.className = ""; void coins2dEl.offsetWidth; coins2dEl.className = "pop"; }
  }
  function spendCoins(n) { coins = Math.max(0, coins - n); saveCoins(); renderCoins(); }
  renderCoins();
  document.getElementById("buyBtn2").addEventListener("click", function () {
    addCoins(30); this.blur();   // pretend shop - play money only, no real charges
  });

  // ---- where the feet are, for 2-point / 3-point shots ----
  let currentRunX = 0;     // how far the running feet are from home, right now
  let shotOffsetX = 0;     // the spot this shot is being taken from
  const BASE_TX = [60, 700];   // the boySide / dogSide group home positions
  const LINE_X  = [578, 182];  // the 3-point arc by each hoop (boy's / dog's)

  // The launch speed that would drop the ball right into that side's hoop.
  // For the dog this comes out negative, which is what sends the ball left.
  function launchFor(s) {
    return {
      vx: (s.hoop.x - s.release.x) / FLIGHT_TIME,
      vy: (s.hoop.y - s.release.y - 0.5 * GRAVITY * FLIGHT_TIME * FLIGHT_TIME) / FLIGHT_TIME
    };
  }

  function placeBall(x, y, spin) {
    ball.setAttribute("transform", "translate(" + x + " " + y + ") rotate(" + (spin || 0) + ")");
  }

  function smooth(a, b, t) {                 // slide from a to b, gently
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    return a + (b - a) * e;
  }

  placeBall(SIDES[0].hands.x, SIDES[0].hands.y, 0);

  // ---- bouncing the ball while he waits ----
  // The ball drops from his hand to the floor and back, over and over, until
  // he picks it up to shoot. Falling is fastest near the floor, which is why
  // the drop is squared instead of just going up and down evenly.
  const DRIBBLE_TIME = 0.5;   // seconds for one bounce. Smaller = faster.

  let dribbling = false;
  let dribbleStart = null;

  function dribbleFrame(now) {
    if (!dribbling) return;
    if (dribbleStart === null) dribbleStart = now;

    const p = ((now - dribbleStart) / 1000 % DRIBBLE_TIME) / DRIBBLE_TIME;
    const half = p < 0.5 ? p / 0.5 : (1 - p) / 0.5;   // 0 -> 1 -> 0
    const drop = half * half;                          // fastest at the floor

    const t = (now - dribbleStart) / 1000;   // seconds spent dribbling

    // ---- run the FULL COURT while dribbling ----
    // The shooter sweeps between a spot way out back (a long 3-pointer) and a
    // spot right under the hoop (an easy 2). Press SHOOT to plant wherever the
    // feet are at that moment. The dog's side is a mirror of the boy's.
    let footX;
    if (shootingFT) {
      // a free throw: stand still on the line, no running
      footX = SIDES[0].hands.x + FT_OFFSET;
      currentRunX = FT_OFFSET;
    } else {
      const RUN_NEAR = turn === 0 ? 600 : 160;   // driving in, near the hoop
      const RUN_FAR  = turn === 0 ? 175 : 585;   // pulled way back
      const mid = (RUN_NEAR + RUN_FAR) / 2;
      const amp = (RUN_NEAR - RUN_FAR) / 2;
      footX = mid + Math.sin(t * Math.PI * 0.6) * amp;   // sweep far <-> near
      currentRunX = footX - SIDES[turn].hands.x;    // offset from the home spot
    }
    const runX = currentRunX;

    const h = SIDES[turn].hands;      // bounce it wherever the shooter is now
    placeBall(footX, h.y + (FLOOR - h.y) * drop, (now - dribbleStart) * 0.4);

    // slide the WHOLE shooter group to the running spot. Using the outer group
    // (not the body) means the crouch/jump poses still work on top of it.
    const who = turn === 0 ? player : dog;
    const outer = turn === 0 ? boySide : dogSide;
    outer.setAttribute("transform", turn === 0
        ? "translate(" + (BASE_TX[0] + runX) + ",0)"
        : "translate(" + (BASE_TX[1] + runX) + ",0) scale(-1,1)");

    // the body sinks a little as the ball drops toward the floor
    who.style.transition = "none";
    who.style.transform = "translateY(" + (drop * 7) + "px)";

    // the front arm pumps down onto the ball
    const pumpArm = who.querySelector(".armR");
    if (pumpArm) {
      pumpArm.style.transition = "none";
      pumpArm.style.transform = "rotate(" + (drop * 26) + "deg)";
    }

    // the legs run - one swings forward while the other swings back
    const stride = Math.sin(t * Math.PI * 4) * 22;
    const legL = who.querySelector(".legL");
    const legR = who.querySelector(".legR");
    if (legL) { legL.style.transition = "none"; legL.style.transform = "rotate(" + stride + "deg)"; }
    if (legR) { legR.style.transition = "none"; legR.style.transform = "rotate(" + (-stride) + "deg)"; }

    // keep the defender (the other player) shadowing the shooter
    positionDefender(footX);

    requestAnimationFrame(dribbleFrame);
  }

  function startDribble() {
    if (dribbling || shooting || charging || gameOver || seriesOver) return;
    clearShotOffset();               // every new possession starts from home
    player.className.baseVal = "";   // the shooter dribbles/poses, not guarding
    dog.className.baseVal = "";
    dribbling = true;                // whoever has the ball bounces it
    dribbleStart = null;
    requestAnimationFrame(dribbleFrame);
  }

  function stopDribble() {
    dribbling = false;
    const h = SIDES[turn].hands;
    placeBall(h.x, h.y, 0);          // caught, back in the hand

    // stand both of them back up straight and give the smooth pose-transition
    // back, so the crouch and jump for the real shot look right again.
    [player, dog].forEach(function (el) {
      el.style.transition = "";
      el.style.transform = "";
      el.querySelectorAll(".armR, .legL, .legR").forEach(function (part) {
        part.style.transition = "";
        part.style.transform = "";
      });
    });
    clearShotOffset();
  }

  // Plant the shooter at the spot their feet reached, ready to shoot from there.
  function applyShotOffset(off) {
    const outer = turn === 0 ? boySide : dogSide;
    const tx = BASE_TX[turn] + off;
    outer.setAttribute("transform", turn === 0
        ? "translate(" + tx + ",0)"
        : "translate(" + tx + ",0) scale(-1,1)");
    const h = SIDES[turn].hands;
    placeBall(h.x + off, h.y, 0);
    positionDefender(SIDES[turn].hands.x + off);   // the other one contests
  }

  // Put both shooters back on their home spots.
  function clearShotOffset() {
    boySide.setAttribute("transform", "translate(60,0)");
    dogSide.setAttribute("transform", "translate(700,0) scale(-1,1)");
  }

  // Stand the DEFENDER (whoever is not shooting) just goal-side of the shooter,
  // both arms up to contest. Skipped in practice - there is no opponent.
  const DEF_GAP = 72;

  function clearInline(el) {
    el.style.transition = "";
    el.style.transform = "";
    el.querySelectorAll(".armR, .armL, .legL, .legR").forEach(function (p) {
      p.style.transition = ""; p.style.transform = "";
    });
  }

  function positionDefender(shooterFootX) {
    if (mode === "practice") return;                // no opponent when practicing
    if (turn === 1) {
      // the dog shoots at the LEFT hoop, so the boy guards on its left
      const dx = Math.max(150, shooterFootX - DEF_GAP);
      const off = dx - SIDES[0].hands.x;
      boySide.setAttribute("transform", "translate(" + (BASE_TX[0] + off) + ",0)");
      clearInline(player);
      player.className.baseVal = "guard";
    } else {
      // the boy shoots at the RIGHT hoop, so the dog guards on its right
      const dx = Math.min(612, shooterFootX + DEF_GAP);
      const off = dx - SIDES[1].hands.x;
      dogSide.setAttribute("transform", "translate(" + (BASE_TX[1] + off) + ",0) scale(-1,1)");
      clearInline(dog);
      dog.className.baseVal = "guard";
    }
  }

  // Behind your line (farther from the hoop) is a 3, in front of it is a 2.
  function pointsFor(off) {
    const feetX = SIDES[turn].hands.x + off;
    const behind = turn === 0 ? feetX <= LINE_X[0] : feetX >= LINE_X[1];
    return behind ? 3 : 2;
  }

  function nameOf(who) {
    return who === 0 ? "You" : "The puppy";
  }

  // ---- whose turn is it, and what does the scoreboard say ----
  function updateBoard() {
    pts1.textContent = scores[0];
    pts2.textContent = scores[1];
    team1.className = turn === 0 ? "team p1 active" : "team p1";
    team2.className = turn === 1 ? "team p2 active" : "team p2";
    court.className.baseVal = turn === 1 ? "dogTurn" : "";  // swap boy for baby
    turnEl.textContent = turn === 0 ? "Your ball" : "The puppy's ball";
    if (mode === "game") {
      seriesEl.textContent = "Quarter " + quarter + " of 4 · most points wins";
    }

    // the SWISH! and MISS! words belong over the hoop being shot at
    swish.setAttribute("x", SIDES[turn].hoop.x);
    miss.setAttribute("x", SIDES[turn].hoop.x);

    // You can only press the button on your own go.
    btn.disabled = shooting || gameOver || seriesOver || turn === 1;
  }

  // A quarter's clock hit zero and there are more quarters to play: pause for
  // the break and wait for NEXT QUARTER. Scores carry over.
  function endQuarter() {
    gameOver = true;
    stopDribble();
    updateBoard();
    turnEl.textContent = "";
    winnerEl.textContent = "End of Quarter " + quarter;
    winnerEl.className = "show";
    nextBtn.className = "show";
    btn.disabled = true;
  }

  // The 4th quarter is over (or a tie was broken after it) - the game is done.
  function endMatch(who) {
    gameOver = true;
    seriesOver = true;
    stopDribble();
    updateBoard();
    turnEl.textContent = "";
    winnerEl.textContent = (who === 0 ? "You win the game!" : nameOf(who) + " wins the game!");
    winnerEl.className = "show";
    againBtn.className = "show";
    btn.disabled = true;
  }

  // Called once the ball has finished rolling around.
  function endTurn(scored) {
    // ---- AND 1 free throw ----
    if (shootingFT) {
      shootingFT = false;
      if (scored) { scores[0] = scores[0] + 1; addCoins(30); flashNote("FREE THROW GOOD! +1", "#ffcf5c"); }
      else flashNote("MISSED FREE THROW", "#e5533d");
      updateBoard();
      // then fall through to the normal end-of-possession handling below
    } else {
      if (!scored) miss.className.baseVal = "show";
      if (ftPending) {
        // you scored AND got fouled -> stay on your possession for one free throw
        ftPending = false; shootingFT = true;
        updateBoard(); resetShotClock();
        flashNote("AND 1 · FREE THROW! hold to shoot", "#ffcf5c");
        startDribble();
        return;
      }
    }

    if (mode === "practice") {       // solo - you always get the ball back
      updateBoard();
      resetShotClock();
      startDribble();
      return;
    }

    // REBOUND: you tapped Rebound during your own miss -> grab it and shoot again
    if (!scored && turn === 0 && wantRebound) {
      wantRebound = false;
      updateBoard();
      resetShotClock();
      startDribble();
      return;
    }
    wantRebound = false;

    // If the buzzer has sounded, resolve the period now that this shot is done
    // (this also covers a shot that was still in the air when time expired).
    if (gameClock <= 0) {
      resolvePeriodEnd();
      if (gameOver) return;      // the quarter or the whole game just ended
    }

    turn = 1 - turn;          // the other one gets the ball
    updateBoard();
    resetShotClock();
    startDribble();                 // the new shooter bounces it a few times
    if (turn === 1) startDogTurn();  // ...and the dog then picks it up itself
  }

  function shoot(strength) {
    if (shooting || gameOver || seriesOver) return;
    shooting = true;
    blockedShot = false;      // fresh shot: no block yet
    btn.disabled = true;

    // Pose whoever is taking this shot, and use their end of the court -
    // shifted to the exact spot the feet were planted (off).
    const me = turn === 0 ? player : dog;
    const off = shotOffsetX;
    const base = SIDES[turn];
    const s = {
      hands:   { x: base.hands.x   + off, y: base.hands.y },
      chest:   { x: base.chest.x   + off, y: base.chest.y },
      release: { x: base.release.x + off, y: base.release.y },
      hoop:    base.hoop,
      net:     base.net
    };
    const launch = launchFor(s);

    me.className.baseVal = "crouch";
    swish.className.baseVal = "";
    miss.className.baseVal = "";
    nets.net.className.baseVal = "";
    nets.netL.className.baseVal = "";

    let last = null;      // time of the previous frame
    let started = null;   // time of the click
    let flying = false;   // has the ball left the hands?
    let flightT = 0;      // seconds the ball has been in the air
    let scored = false;   // has it gone through the rim yet?
    let bounces = 0;
    let restedAt = null;  // when the ball came to a stop
    const b = { x: s.hands.x, y: s.hands.y, vx: 0, vy: 0, spin: 0 };

    function frame(now) {
      if (started === null) { started = now; last = now; }
      const t = (now - started) / 1000;          // seconds since the click
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      if (t < CROUCH_END) {
        // Bending down, ball tucked to the chest.
        b.x = smooth(s.hands.x, s.chest.x, t / CROUCH_END);
        b.y = smooth(s.hands.y, s.chest.y, t / CROUCH_END);
      } else if (t < WINDUP_END) {
        // Springing up, ball lifted overhead.
        if (me.className.baseVal !== "release") me.className.baseVal = "release";
        const p = (t - CROUCH_END) / (WINDUP_END - CROUCH_END);
        b.x = smooth(s.chest.x, s.release.x, p);
        b.y = smooth(s.chest.y, s.release.y, p);
      } else {
        // In the air! Gravity takes over.
        if (!flying) {
          flying = true;
          // strength comes from the power meter. 1 is a perfect throw,
          // less than 1 falls short, more than 1 sails long.
          b.x = s.release.x; b.y = s.release.y;
          b.vx = launch.vx * strength; b.vy = launch.vy * strength;
        }
        // Hold the follow-through, then lower the arms. Uses the same clock as
        // the ball so the pose never gets ahead of the shot.
        flightT += dt;
        if (flightT > 0.55 && me.className.baseVal === "release") {
          me.className.baseVal = "";
        }
        b.vy += GRAVITY * dt;
        const wasAbove = b.y < s.hoop.y;  // where the ball was before it moved
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.spin += b.vx * dt * 0.7;

        // Through the rim?
        // It only counts if the ball DROPS THROUGH the ring: it has to be
        // above the rim one moment and below it the next. Without the
        // "wasAbove" part, a ball rolling about under the hoop scores too.
        if (!scored && !blockedShot && wasAbove && b.y >= s.hoop.y &&
            b.x > s.hoop.x - RIM_WIDTH && b.x < s.hoop.x + RIM_WIDTH) {
          scored = true;
          b.vx *= 0.22;                     // the net kills the sideways speed
          if (shootingFT) {
            // this is the free throw itself - it's worth 1, scored over in endTurn
            swish.textContent = "GOOD!";
            nets[s.net].className.baseVal = "swish";
            swish.className.baseVal = "show";
            swishSound();
          } else {
            const gained = pointsFor(off);    // 3 from behind the line, 2 in front
            scores[turn] = scores[turn] + gained;
            if (turn === 0) addCoins(30);     // 30 cents for every basket you make
            swish.textContent = "SWISH +" + gained + "!";
            updateBoard();
            nets[s.net].className.baseVal = "swish";
            swish.className.baseVal = "show";
            swishSound();                     // ding!
            resetShotClock();                 // a bucket puts 24 back on the clock

            // AND 1! sometimes you get fouled on the make -> go shoot one free throw
            if (turn === 0 && Math.random() < 0.35) {
              ftPending = true;
              flashNote("AND 1!", "#ffcf5c");
              tone(660, 0.10, "triangle", 0.12);
              setTimeout(function () { tone(990, 0.14, "triangle", 0.10); }, 90);
            }
          }
        }

        // the walls at each end, so a big overthrow does not fly off the picture
        if (b.x > 748) { b.x = 748; b.vx = -b.vx * 0.3; }
        if (b.x < 12)  { b.x = 12;  b.vx = -b.vx * 0.3; }

        // Hitting the floor.
        if (b.y >= FLOOR) {
          b.y = FLOOR;
          if (bounces < 2 && b.vy > 60) {
            b.vy = -b.vy * BOUNCE;
            b.vx *= 0.5;
            bounces++;
          } else {
            b.vy = 0; b.vx = 0;
            if (restedAt === null) restedAt = now;
          }
        }
      }

      placeBall(b.x, b.y, b.spin);

      if (restedAt !== null && now - restedAt > 500) {
        placeBall(s.hands.x, s.hands.y, 0);   // ball back in the hands
        me.className.baseVal = "";
        shooting = false;
        endTurn(scored);                   // hand over to the other player
        return;                            // stop the loop
      }
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  // ---- the shot clock ----
  // It counts down from 24 and starts again. Running out does not cost you
  // anything - it is just there to hurry you up.
  const clockText = document.getElementById("shotClockText");
  let shotClock = SHOT_CLOCK;

  function showClock() {
    clockText.textContent = shotClock;
    if (shotClock <= 5) {
      clockText.className.baseVal = "low";   // nearly out of time - go red
    } else {
      clockText.className.baseVal = "";
    }
  }

  function resetShotClock() {
    shotClock = SHOT_CLOCK;
    showClock();
  }

  showClock();

  // A 24-second violation: time ran out before a shot went up, so the ball
  // is turned over to the other player - just like real basketball.
  function shotClockViolation() {
    if (charging) { charging = false; dogTarget = null; power = 0; drawMeter(); }
    stopDribble();

    // flash the SHOT CLOCK! word in the middle of the court
    violation.className.baseVal = "";
    void violation.getBoundingClientRect();   // let the pop animation replay
    violation.className.baseVal = "show";

    if (mode === "practice") { resetShotClock(); startDribble(); return; }

    turn = 1 - turn;            // turnover - the other one gets the ball
    updateBoard();
    resetShotClock();
    startDribble();
    if (turn === 1) startDogTurn();
  }

  // Tick once a second.
  setInterval(function () {
    if (mode === "practice") return;         // no shot clock when practicing
    if (paused) return;                      // a time out is on
    if (gameOver || seriesOver) return;      // the clock waits between games
    shotClock = shotClock - 1;
    showClock();
    if (shotClock <= 0) {
      if (shooting) {
        resetShotClock();        // a shot is already in the air - let it finish
      } else {
        shotClockViolation();    // nobody got a shot up in time: turnover
      }
    }
  }, 1000);

  // ---- the 10-minute game clock ----
  const gameClockText = document.getElementById("gameClockText");
  const GAME_TIME = 600;       // ten minutes per quarter, in seconds
  let gameClock = GAME_TIME;

  function fmtClock(s) {
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return m + ":" + (ss < 10 ? "0" + ss : ss);
  }

  function showGameClock() {
    gameClockText.textContent = fmtClock(gameClock);
    gameClockText.className.baseVal = gameClock <= 60 ? "low" : "";  // last minute red
  }

  function resetGameClock() {
    gameClock = GAME_TIME;
    showGameClock();
  }

  showGameClock();

  // When time runs out, whoever is ahead wins the game. If it is a tie, play
  // carries on and the next basket wins it (handled in endTurn).
  function resolvePeriodEnd() {
    if (quarter < QUARTERS) {
      endQuarter();                       // more basketball to play
    } else if (scores[0] !== scores[1]) {
      endMatch(scores[0] > scores[1] ? 0 : 1);
    }
    // 4th quarter tied -> play on; the next basket wins it (see endTurn)
  }

  function timeUp() {
    if (shooting) return;                 // a shot is in the air; endTurn ends it
    resolvePeriodEnd();
  }

  setInterval(function () {
    if (mode === "practice") return;         // no game clock when practicing
    if (paused) return;                      // a time out is on
    if (gameOver || seriesOver) return;
    if (gameClock > 0) {
      gameClock = gameClock - 1;
      showGameClock();
      if (gameClock <= 0) timeUp();
    }
  }, 1000);

  // ---- the power meter ----
  // Hold the button down and the yellow bar slides up and down. Let go while
  // it is in the green stripe and the ball goes in. Let go too early and the
  // shot is short, too late and it sails long.
  const meterFill = document.getElementById("meterFill");
  const METER_BOTTOM = 328;  // the foot of the upright power bar
  const METER_TALL   = 141;  // how tall the bar is (inside the frame)

  let charging = false;
  let power = 0;          // 0 at the bottom of the bar, 100 at the top
  let meterDir = 1;       // 1 going up, -1 coming back down
  let meterLast = null;
  let dogTarget = null;   // where the dog has decided to let go
  let dogWants3 = false;  // this possession, is the puppy pulling up for a three?

  function drawMeter() {
    const h = METER_TALL * (power / 100);          // taller as the power climbs
    meterFill.setAttribute("height", h);
    meterFill.setAttribute("y", METER_BOTTOM - h); // grow upward from the foot
  }

  function meterFrame(now) {
    if (!charging) return;
    if (meterLast === null) meterLast = now;
    const dt = Math.min((now - meterLast) / 1000, 0.05);
    meterLast = now;

    power = power + meterDir * METER_SPEED * dt;
    if (power >= 100) { power = 100; meterDir = -1; }   // bounce off the top
    if (power <= 0)   { power = 0;   meterDir = 1; }    // bounce off the bottom

    drawMeter();

    // The dog lets go by itself when the bar reaches the spot it picked.
    if (dogTarget !== null && power >= dogTarget) {
      releaseShot();
      return;
    }

    requestAnimationFrame(meterFrame);
  }

  function startCharging() {
    if (shooting || gameOver || seriesOver || charging) return;
    shotOffsetX = currentRunX;    // freeze the feet wherever they are now
    if (shootingFT) {
      shotOffsetX = FT_OFFSET;    // a free throw is always taken from the line
    } else if (turn === 1 && dogWants3) {
      // the puppy steps back behind its 3-point line (x >= 182) for a three
      const footX = 205 + Math.random() * 80;
      shotOffsetX = footX - SIDES[1].hands.x;
    }
    stopDribble();                // catch the ball to line the shot up
    applyShotOffset(shotOffsetX); // ...and plant on that spot (behind or in front)
    charging = true;
    power = 0;
    meterDir = 1;
    meterLast = null;
    drawMeter();
    requestAnimationFrame(meterFrame);
  }

  function releaseShot() {
    if (!charging) return;
    charging = false;
    dogTarget = null;
    dogWants3 = false;

    // Turn the bar into how hard the ball is thrown.
    // 50 on the meter is a perfect shot, which is 1 here. The 0.8 spread is
    // what makes the green stripe small: a wider spread means letting go a
    // moment early throws the ball a lot softer, so timing matters more.
    const strength = 0.6 + (power / 100) * 0.8;

    power = 0;
    drawMeter();
    shoot(strength);
  }

  // ---- the dog ----
  // The dog uses the very same power bar you do. It picks a spot to let go
  // and aims for the green stripe. DOG_SKILL decides how wild its aim is, so
  // when the dog misses it is because it really did let go at the wrong
  // moment - exactly like you. Nothing is decided by luck after the throw.
  function dogAim() {
    const spread = GREEN_HALF / DOG_SKILL;
    return 50 + (Math.random() * 2 - 1) * spread;
  }

  function startDogTurn() {
    // a moment of thinking, so it does not fire the instant you finish
    setTimeout(function () {
      if (gameOver || seriesOver || shooting || turn !== 1) return;
      dogTarget = dogAim();
      dogWants3 = Math.random() < 0.4;   // ~40% of the time the puppy shoots a three
      startCharging();
    }, 900);
  }

  // You may only touch the bar on your own go.
  function youCharge() {
    if (turn !== 0) return;
    startCharging();
  }

  function youRelease() {
    if (turn !== 0) return;
    releaseShot();
  }

  btn.addEventListener("pointerdown", youCharge);
  court.addEventListener("pointerdown", youCharge);
  window.addEventListener("pointerup", youRelease);

  // ---- Rebound / Block / Time Out ----
  const noteEl = document.getElementById("note");
  function flashNote(text, color) {
    noteEl.textContent = text;
    if (color) noteEl.setAttribute("fill", color);
    noteEl.className.baseVal = "";
    void noteEl.getBoundingClientRect();     // let the pop animation replay
    noteEl.className.baseVal = "show";
  }
  const reboundBtn = document.getElementById("reboundBtn");
  const blockBtn2  = document.getElementById("blockBtn2");
  const toBtn2     = document.getElementById("toBtn2");
  const dunkBtn2   = document.getElementById("dunkBtn2");
  const stealBtn2  = document.getElementById("stealBtn2");
  const dblBtn2    = document.getElementById("dblBtn2");

  // REBOUND: while your shot is in the air, claim your own miss so you shoot again
  function doRebound2d() {
    if (turn !== 0 || !shooting) return;
    wantRebound = true;
    flashNote("REBOUND!", "#6bd18a");
    ding(784, 0);
  }
  // BLOCK: while the dog's shot is in the air, swat it so it misses (then it's your ball)
  function doBlock2d() {
    if (turn !== 1 || !shooting) return;
    blockedShot = true;
    flashNote("BLOCK!", "#7fd0ff");
    ding(300, 0); ding(220, 0.09);
  }
  // TIME OUT: freeze the clocks until you tap Resume
  function doTimeout2d() {
    paused = !paused;
    toBtn2.innerHTML = paused ? "&#9654; Resume" : "&#9200; Time Out";
    flashNote(paused ? "TIME OUT" : "BACK TO PLAY!", "#7fd0ff");
    ding(paused ? 523 : 659, 0);
  }
  // SLAM DUNK: on your turn, a guaranteed 2 points
  function doDunk2d() {
    if (turn !== 0 || shooting || gameOver || seriesOver || paused) return;
    scores[0] = scores[0] + 2; addCoins(30); updateBoard();
    flashNote("SLAM DUNK! +2", "#ffcf5c");
    swishSound();
    resetShotClock();
  }
  // STEAL: on the puppy's turn (before it shoots), swipe the ball -> your ball
  function doSteal2d() {
    if (turn !== 1 || shooting || gameOver || seriesOver || paused) return;
    if (charging) { charging = false; dogTarget = null; power = 0; drawMeter(); }
    flashNote("STEAL!", "#6bd18a"); ding(880, 0); ding(1180, 0.08);
    turn = 0; updateBoard(); resetShotClock(); startDribble();
  }
  // DOUBLE TEAM: two of you swarm the puppy and force the turnover
  function doDoubleTeam2d() {
    if (turn !== 1 || shooting || gameOver || seriesOver || paused) return;
    if (charging) { charging = false; dogTarget = null; power = 0; drawMeter(); }
    flashNote("DOUBLE TEAM!", "#9b8cff"); ding(700, 0); ding(500, 0.1); ding(900, 0.2);
    turn = 0; updateBoard(); resetShotClock(); startDribble();
  }
  reboundBtn.addEventListener("click", doRebound2d);
  blockBtn2.addEventListener("click", doBlock2d);
  toBtn2.addEventListener("click", doTimeout2d);
  dunkBtn2.addEventListener("click", doDunk2d);
  stealBtn2.addEventListener("click", doSteal2d);
  dblBtn2.addEventListener("click", doDoubleTeam2d);
  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.repeat) return;
    if (e.code === "KeyR") doRebound2d();
    else if (e.code === "KeyB") doBlock2d();
    else if (e.code === "KeyT") doTimeout2d();
    else if (e.code === "KeyE") doDunk2d();
    else if (e.code === "KeyF") doSteal2d();
    else if (e.code === "KeyG") doDoubleTeam2d();
  });

  // The spacebar works too.
  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;   // typing a name, not shooting
    if (e.code === "Space" && !e.repeat) { e.preventDefault(); youCharge(); }
  });
  window.addEventListener("keyup", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); youRelease(); }
  });

  // Start the next quarter. The running score carries over.
  nextBtn.addEventListener("click", function () {
    quarter = quarter + 1;
    turn = 0;
    gameOver = false;
    winnerEl.textContent = "";
    winnerEl.className = "";
    nextBtn.className = "";
    updateBoard();
    resetShotClock();
    resetGameClock();
    startDribble();
  });

  // Start a whole new game from Quarter 1.
  againBtn.addEventListener("click", function () {
    scores = [0, 0];
    quarter = 1;
    turn = 0;
    gameOver = false;
    seriesOver = false;
    winnerEl.textContent = "";
    winnerEl.className = "";
    againBtn.className = "";
    updateBoard();
    resetShotClock();
    resetGameClock();
    startDribble();
  });

  // ---- Practice vs 1-on-1 ----
  function applyModeUI() {
    const practice = mode === "practice";
    document.getElementById("gameClock").style.display = practice ? "none" : "";
    document.getElementById("shotClock").style.display = practice ? "none" : "";
    team2.style.display = practice ? "none" : "";       // hide the puppy's score
    games1.style.display = "none";                      // no per-player game count
    games2.style.display = "none";
    dog.style.display = practice ? "none" : "block";    // no puppy in practice
    if (practice) seriesEl.textContent = "Practice · just keep shooting";
    // the game-mode line ("Quarter X of 4") is set by updateBoard
    practiceBtn.classList.toggle("active", practice);
    gameBtn.classList.toggle("active", !practice);
  }

  function setMode(m) {
    mode = m;
    scores = [0, 0];
    quarter = 1;
    turn = 0;
    gameOver = false;
    seriesOver = false;
    shooting = false;
    charging = false;
    dogTarget = null;
    winnerEl.textContent = "";
    winnerEl.className = "";
    nextBtn.className = "";
    againBtn.className = "";
    stopDribble();            // reset the shooters and ball to home
    applyModeUI();
    updateBoard();
    resetShotClock();
    resetGameClock();
    startDribble();
  }

  practiceBtn.addEventListener("click", function () { setMode("practice"); this.blur(); });
  gameBtn.addEventListener("click", function () {
    this.blur();
    if (mode === "game") return;                 // already playing
    if (coins < GAME_COST) { flashNote("NEED 30 COINS · PLAY PRACTICE", "#ffd84a"); return; }
    spendCoins(GAME_COST); setMode("game"); flashNote("PAID 30 · GAME ON!", "#6bd18a");
  });
  document.getElementById("threeDBtn").addEventListener("click", function () { location.href = "hoop-shot-3d.html"; });

  // ---- the jersey name ----
  const nameBtn = document.getElementById("nameBtn");
  const nameInput = document.getElementById("nameInput");
  const jerseyName = document.getElementById("jerseyName");

  function setJersey(name) {
    const n = (name || "").toUpperCase().replace(/\s+/g, " ").trim().slice(0, 10) || "PLAYER";
    jerseyName.textContent = n;
    // shrink the text so longer names still fit on the little jersey
    jerseyName.setAttribute("font-size", n.length <= 6 ? 6.5 : Math.max(4.4, 40 / n.length));
  }

  nameBtn.addEventListener("click", function () {
    nameInput.classList.toggle("show");
    if (nameInput.classList.contains("show")) { nameInput.value = jerseyName.textContent; nameInput.focus(); nameInput.select(); }
    this.blur();
  });
  nameInput.addEventListener("input", function () { setJersey(this.value); });
  // pressing Enter tucks the box away again
  nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { nameInput.classList.remove("show"); nameInput.blur(); }
  });

  // ---- music & sounds ----
  // All made with the Web Audio API (little beeps), so there are NO sound files
  // and it still works with no internet.
  let audioCtx = null;
  let musicOn = true;
  let musicTimer = null;
  let musicStep = 0;

  // a cheery pentatonic loop (frequencies in Hz; 0 = a rest), plus a bass line
  // new bouncy tune
  // new punchy tune
  const MELODY = [784,0,784,659, 880,0,880,784, 587,659,784,880, 988,880,784,0];
  const BASS   = [196,0,131,0,   220,0,147,0,   147,0,196,0,     131,0,196,0];
  const STEP_MS = 210;             // length of one note

  function tone(freq, dur, type, vol) {
    if (!audioCtx || !freq) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.03);
  }

  // a short blip for the action buttons (ignores the timing offset - close enough)
  function ding(f, when) { tone(f, 0.18, "triangle", 0.09); }

  function musicTick() {
    tone(MELODY[musicStep], 0.18, "triangle", 0.08);
    tone(BASS[musicStep],   0.22, "square",   0.05);
    musicStep = (musicStep + 1) % MELODY.length;
  }

  function startMusic() {
    if (!audioCtx || !musicOn || musicTimer) return;
    musicTimer = setInterval(musicTick, STEP_MS);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  // Browsers only allow sound after the first tap/click/key, so we wake the
  // audio up on the first thing the player does.
  function initAudioOnce() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return; }
    if (audioCtx.state === "suspended") audioCtx.resume();
    if (musicOn) startMusic();
  }
  window.addEventListener("pointerdown", initAudioOnce);
  window.addEventListener("keydown", initAudioOnce);

  // a happy little "ding-ding" when a shot drops
  function swishSound() {
    if (!audioCtx) return;
    tone(880, 0.12, "triangle", 0.13);
    setTimeout(function () { tone(1320, 0.16, "triangle", 0.11); }, 80);
  }

  musicBtn.addEventListener("click", function () {
    musicOn = !musicOn;
    musicBtn.classList.toggle("active", musicOn);
    musicBtn.innerHTML = musicOn ? "&#9834; Music" : "&#9834; Music: off";
    if (musicOn) { initAudioOnce(); startMusic(); } else { stopMusic(); }
    this.blur();
  });

  setMode("practice");        // start free in Practice; tap "1 on 1" (30 coins) to play a game

  // The game needs no internet at all - everything is inside this one file.
  // The service worker below is just a bonus: it lets the game be *installed*
  // like an app and reopened offline. It only works when the game is opened
  // through a web address (http://localhost...), so we skip it when the file
  // is opened directly (file://) - the game still plays perfectly either way.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>

</body>
</html>
