<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>📺 MO ARFF ADS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#1a1230;color:#f3ecff;font-family:'Trebuchet MS',Verdana,sans-serif;overflow:hidden;}
  #wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:8px;}
  .namebtn{display:block;margin:6px auto 2px;background:linear-gradient(#ffd23f,#f7a72b);color:#5a3a1a;font-weight:bold;border:none;border-radius:14px;padding:9px 22px;font-size:16px;font-family:inherit;box-shadow:0 4px 0 #0006;text-decoration:none;}
  h1{margin:2px 0;font-size:20px;color:#ffd23f;text-shadow:0 2px 0 #0007;}
  #steps{font-size:13px;color:#d4c2ff;margin:2px 0 6px;font-weight:bold;}
  canvas{background:#efe6ff;border-radius:16px;box-shadow:0 8px 24px #0009;touch-action:none;max-width:100%;height:auto;}
  #nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .nb{background:#2a1d4a;border:2px solid #6a4fb0;color:#eadcff;font-weight:bold;font-size:14px;padding:8px 14px;border-radius:12px;font-family:inherit;text-decoration:none;}
</style>
</head>
<body>
<div id="wrap">
  <a class="namebtn" href="../index.html">🏠 MO ARCADE</a>
  <h1>📺 MO ARFF ADS</h1>
  <div id="steps">Make your own dog-world ads!</div>
  <canvas id="cv" width="440" height="620"></canvas>
  <div id="nav">
    <a class="nb" href="../index.html">← Back</a>
    <a class="nb" href="../mo-home.html">🏠 MO Home</a>
    <a class="nb" href="../games.html">🎮 All Games</a>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById("cv"), cx=cv.getContext("2d"), steps=document.getElementById("steps");
  var W=cv.width, H=cv.height, t=0;
  var scene="menu", g={}, ptr={x:W/2,y:0,down:false};
  var coins=0; try{ coins=parseInt(localStorage.getItem("moarffads_coins")||"0",10)||0; }catch(e){}
  function save(){ try{ localStorage.setItem("moarffads_coins",String(coins)); }catch(e){} }

  var AC=null; function beep(f,d,ty){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),ga=AC.createGain(); o.frequency.value=f;o.type=ty||"square";o.connect(ga);ga.connect(AC.destination);ga.gain.value=.06;o.start();ga.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.08));o.stop(AC.currentTime+(d||.08)); }catch(e){} }
  function bark(){ beep(520,.09,"square"); setTimeout(function(){beep(380,.12,"square");},90); }
  function ding(){ beep(760,.08,"sine"); setTimeout(function(){beep(1020,.12,"sine");},80); }
  function rr(x,y,w,h,r){ cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath(); }
  function text(s,x,y,sz,c,al){ cx.fillStyle=c||"#fff";cx.font="bold "+sz+"px Trebuchet MS,sans-serif";cx.textAlign=al||"center";cx.textBaseline="middle";cx.fillText(s,x,y); }
  function emo(ch,x,y,s){ cx.font=s+"px serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(ch,x,y); }
  function btn(label,y,c){ cx.fillStyle=c||"#7bd07b"; rr(W/2-120,y,240,52,14); cx.fill(); text(label,W/2,y+26,18,"#06280f"); }

  // Arff the dog
  function drawArff(x,y,s,facing,pose){
    facing=facing||1; pose=pose||"stand"; var wag=Math.sin(t*0.25)*4;
    cx.save(); cx.translate(x,y); cx.scale(s*facing,s);
    var legY = pose==="sit"?4:6, lift = pose==="run"?Math.sin(t*0.5)*3:0;
    cx.strokeStyle="#8a5a2f"; cx.lineWidth=4; cx.lineCap="round";
    cx.beginPath(); cx.moveTo(-18,-2); cx.lineTo(-28,-8+wag); cx.stroke();
    cx.fillStyle="#a56a34";
    if(pose==="sit"){ cx.fillRect(6,legY,5,12); cx.fillRect(-2,legY-2,5,14); }
    else { [-10,-2,8,14].forEach(function(lx,i){ cx.fillRect(lx,legY+(i%2?lift:-lift),5,12); }); }
    cx.fillStyle="#b5793f"; rr(-20,-12,34,20,10); cx.fill();
    var hx=16, hy=pose==="sit"?-16:-12;
    cx.beginPath(); cx.arc(hx,hy,11,0,7); cx.fill();
    cx.fillStyle="#c98a52"; cx.beginPath(); cx.ellipse(hx+7,hy+2,6,5,0,0,7); cx.fill();
    cx.fillStyle="#8a5a2f"; cx.beginPath(); cx.ellipse(hx-5,hy-9,5,8,-.4,0,7); cx.fill();
    cx.fillStyle="#222"; cx.beginPath(); cx.arc(hx+3,hy-2,1.8,0,7); cx.fill();
    cx.fillStyle="#2a1a10"; cx.beginPath(); cx.arc(hx+12,hy+1,2.6,0,7); cx.fill();
    if(pose==="run"||pose==="jump"){ cx.fillStyle="#e86a8a"; rr(hx+9,hy+4,4,7,2); cx.fill(); }
    cx.restore();
  }
  function coinHUD(){ cx.fillStyle="rgba(255,255,255,.85)"; rr(14,12,94,30,10); cx.fill(); cx.strokeStyle="#e0b64a"; cx.lineWidth=2; rr(14,12,94,30,10); cx.stroke(); emo("🪙",34,27,20); text("x "+coins,54,27,17,"#5a3a1a","left"); }
  function label(s){ steps.textContent=s; }
  function go(name){ FX.parts=[]; FX.floats=[]; FX.conf=[]; FX.shake=0; scene=name; if(S[name].init)S[name].init(); }

  // ============ FX ============
  var FX={parts:[], floats:[], conf:[], shake:0};
  function shakeIt(a){ FX.shake=Math.max(FX.shake,a); }
  function burst(x,y,col,n,spd){ n=n||10; spd=spd||3.4; for(var i=0;i<n;i++){ var a=Math.random()*6.28, s=spd*(0.4+Math.random()); FX.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,col:col,r:2+Math.random()*3,g:0.12}); } }
  function star(x,y,n){ n=n||8; for(var i=0;i<n;i++){ var a=Math.random()*6.28,s=1.6+Math.random()*2.4; FX.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.4,life:1,col:"#fff2a8",r:2+Math.random()*2,g:0.08,tw:1}); } }
  function heartPop(x,y,n){ n=n||6; for(var i=0;i<n;i++){ FX.parts.push({x:x+(Math.random()*20-10),y:y,vx:(Math.random()*1.4-0.7),vy:-1.4-Math.random()*1.6,life:1,col:"#ff6a8a",r:5+Math.random()*3,g:0.02,heart:1}); } }
  function floatUp(s,x,y,col){ FX.floats.push({s:s,x:x,y:y,life:1,col:col||"#fff"}); }
  function confettiBurst(){ for(var i=0;i<28;i++){ FX.conf.push({x:Math.random()*W,y:-10-Math.random()*60,vy:1.6+Math.random()*2.4,vx:Math.random()*2-1,r:3+Math.random()*4,col:["#ff5a7a","#ffd23f","#5ad0a0","#5aa0ff","#c77aff"][i%5],rot:Math.random()*6,vr:Math.random()*0.3-0.15}); } }
  function updateFX(){
    for(var i=FX.parts.length-1;i>=0;i--){ var p=FX.parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=0.03; if(p.life<=0)FX.parts.splice(i,1); }
    for(var j=FX.floats.length-1;j>=0;j--){ var f=FX.floats[j]; f.y-=1.1; f.life-=0.02; if(f.life<=0)FX.floats.splice(j,1); }
    for(var k=FX.conf.length-1;k>=0;k--){ var c=FX.conf[k]; c.y+=c.vy; c.x+=c.vx; c.rot+=c.vr; if(c.y>H+20)FX.conf.splice(k,1); }
  }
  function renderFX(){
    FX.parts.forEach(function(p){ cx.globalAlpha=Math.max(0,p.life); if(p.heart){ cx.fillStyle=p.col; cx.font=(p.r*3)+"px serif"; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText("♥",p.x,p.y); } else { cx.fillStyle=p.tw&&Math.floor(t/3)%2?"#ffffff":p.col; cx.beginPath(); cx.arc(p.x,p.y,Math.max(0.5,p.r*p.life),0,7); cx.fill(); } });
    cx.globalAlpha=1;
    FX.floats.forEach(function(f){ cx.globalAlpha=Math.max(0,f.life); cx.fillStyle=f.col; cx.strokeStyle="#00000055"; cx.lineWidth=3; cx.font="bold 20px Trebuchet MS,sans-serif"; cx.textAlign="center"; cx.textBaseline="middle"; cx.strokeText(f.s,f.x,f.y); cx.fillText(f.s,f.x,f.y); });
    cx.globalAlpha=1;
    FX.conf.forEach(function(c){ cx.save(); cx.translate(c.x,c.y); cx.rotate(c.rot); cx.fillStyle=c.col; cx.fillRect(-c.r/2,-c.r/2,c.r,c.r*1.6); cx.restore(); });
  }

  // shared product / star / slogan data
  var PRODUCTS=[["🦴","Crunchy Bones","#f7a72b","#e8630e"],["🥏","Super Frisbees","#ff5a7a","#c8306a"],
    ["🎾","Bouncy Balls","#5ad0a0","#1f9a6a"],["🐾","Paw-Fect Treats","#c77aff","#7a3ad0"],
    ["🛁","Sudsy Pup Wash","#5aa0ff","#2a5ad0"],["🏠","Cozy Doghouse","#ffb45a","#e07a1a"]];
  var STARS=[["🐕","Arff"],["🐈","Meow"],["👦","Mo"],["👨","Dad"],["👩","Mom"]];
  var SLOGANS=["Best in town!","Woof-tastic!","Every good boy loves it!","5 paws up!","Yummy & fun!","Get yours today!"];

  var S={};

  // ---------------- MENU ----------------
  S.menu={ init:function(){ label("Make and play dog-world ads! 🪙 "+coins); },
    render:function(){
      var gr=cx.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#efe6ff"); gr.addColorStop(1,"#dcf3ff"); cx.fillStyle=gr; cx.fillRect(0,0,W,H);
      // floating mini ad cards in background
      for(var b=0;b<5;b++){ var pr=PRODUCTS[b%PRODUCTS.length]; var bx=(b*97+t*0.5)%(W+60)-30, by=H*0.62-(b*70+t*0.8)%(H*0.5); cx.globalAlpha=0.35; cx.fillStyle=pr[2]; rr(bx,by,40,26,7); cx.fill(); cx.globalAlpha=1; emo(pr[0],bx+20,by+13,16); }
      drawArff(W/2, H*0.2+Math.sin(t*0.06)*4, 1.7, 1, Math.floor(t/90)%2?"sit":"stand");
      // TV screen over dog
      coinHUD();
      var ts=25+Math.sin(t*0.1)*1.5; text("MO ARFF ADS",W/2,H*0.35,ts,"#6a3ad0");
      emo("📺",W/2-105,H*0.35,26);
      var ys=[H*0.46,H*0.55,H*0.64];
      var mb=[["🎬  MAKE AN AD","#ffd27a"],["🎯  CATCH ADS","#a9e9bd"],["🖼️  BILLBOARD","#c6ecff"]];
      for(var i=0;i<3;i++){ cx.fillStyle=mb[i][1]; rr(W/2-140,ys[i]-24,280,46,13); cx.fill(); cx.strokeStyle="#ffffffaa"; cx.lineWidth=2; rr(W/2-140,ys[i]-24,280,46,13); cx.stroke(); text(mb[i][0],W/2,ys[i],18,"#3a2a10"); }
      text("Tap a mode to play!",W/2,H*0.74,14,"#5a3a7a");
      // little Meow peeking
      emo("🐈",W*0.82,H*0.2+Math.sin(t*0.08)*3,26); },
    tap:function(){ var ys=[H*0.46,H*0.55,H*0.64], names=["make","catch","board"];
      for(var i=0;i<3;i++){ if(Math.abs(ptr.y-ys[i])<24 && Math.abs(ptr.x-W/2)<140){ bark(); burst(ptr.x,ptr.y,"#ffd23f",8); go(names[i]); return; } } } };

  // ---------------- MAKE AN AD (the real production process!) ----------------
  var SETS=[["🏞️","The Park","#8fce7c","#4f9a44"],["🍽️","The Kitchen","#ffcf8a","#e0a24a"],
    ["🏖️","The Beach","#ffe28a","#f0b64a"],["🎬","The Studio","#b6a4e6","#7a5fd0"]];
  var MUSIC=[["🎵","Happy Tune"],["🥁","Epic Beat"],["🎸","Rock Star"],["🎺","Big Finish"]];
  var STICON=["📋","🎭","🏞️","✍️","🎬","✂️","📺"];
  var STNAME=["The Brief","Casting","The Set","The Script","Filming","Editing","Premiere!"];
  function cards(n,cols,cw,ch,gap,y0){ var r=[],tw=cols*cw+(cols-1)*gap,x0=(W-tw)/2; for(var i=0;i<n;i++){ var c=i%cols,rw=Math.floor(i/cols); r.push({x:x0+c*(cw+gap),y:y0+rw*(ch+gap),w:cw,h:ch,i:i}); } return r; }
  function optCard(rc,sel,a,b){ if(b){ var gr=cx.createLinearGradient(0,rc.y,0,rc.y+rc.h); gr.addColorStop(0,a); gr.addColorStop(1,b); cx.fillStyle=gr; } else cx.fillStyle=sel?"#ffd27a":"#4a3a70"; rr(rc.x,rc.y,rc.w,rc.h,13); cx.fill(); cx.strokeStyle=sel?"#fff":"#ffffff55"; cx.lineWidth=sel?4:2; rr(rc.x,rc.y,rc.w,rc.h,13); cx.stroke(); }
  function hit(rc){ return ptr.x>rc.x&&ptr.x<rc.x+rc.w&&ptr.y>rc.y&&ptr.y<rc.y+rc.h; }
  function makeReady(){ return g.stage===0?g.prod>=0 : g.stage===1?g.starI>=0 : g.stage===2?g.setI>=0 : g.stage===3?g.slog>=0 : g.stage===5?g.music>=0 : false; }

  S.make={ init:function(){ g={stage:0, prod:-1, starI:-1, setI:-1, slog:-1, music:-1, film:"ready", filmT:0, playT:0, rated:false}; label("🎬 AD STUDIO — Step 1: The Brief!"); },
    update:function(){
      if(g.stage===4 && g.film!=="ready"){ g.filmT++;
        if(g.film==="count"){ if(g.filmT%30===1)beep(520,.12); if(g.filmT>=90){ g.film="rec"; g.filmT=0; beep(920,.14,"sine"); } }
        else if(g.film==="rec"){ if(g.filmT>=115){ g.film="cut"; bark(); star(W/2,H*0.34,8); } }
      }
      if(g.stage===6){ g.playT++;
        if(g.playT===45){ ding(); }
        if(g.playT===80 && !g.rated){ g.rated=true; coins+=10; save(); confettiBurst(); star(W/2,H*0.4,12); floatUp("+10 🪙",W/2,H*0.3,"#ffe27a"); label("🏆 Ad complete! 🪙 "+coins); }
      } },
    render:function(){
      var gr=cx.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#3a2a5a"); gr.addColorStop(1,"#241640"); cx.fillStyle=gr; cx.fillRect(0,0,W,H);
      coinHUD();
      // ---- progress bar (7 stages) ----
      var n=7, x0=44, x1=W-24, sp=(x1-x0)/(n-1);
      cx.strokeStyle="#ffffff33"; cx.lineWidth=3; cx.beginPath(); cx.moveTo(x0,48); cx.lineTo(x1,48); cx.stroke();
      for(var s=0;s<n;s++){ var px=x0+s*sp, done=s<g.stage, cur=s===g.stage;
        cx.fillStyle=cur?"#ffd23f":(done?"#7bd07b":"#4a3a70"); cx.beginPath(); cx.arc(px,48,cur?14:11,0,7); cx.fill();
        if(cur){ cx.strokeStyle="#fff"; cx.lineWidth=2; cx.beginPath(); cx.arc(px,48,16,0,7); cx.stroke(); }
        emo(done?"✅":STICON[s], px, 48, cur?17:13); }
      text("Step "+(g.stage+1)+" of 7 — "+STNAME[g.stage].toUpperCase(), W/2, 78, 17, "#ffd27a");

      // ===== FILMING =====
      if(g.stage===4){
        var SET=SETS[g.setI], P=PRODUCTS[g.prod], st=STARS[g.starI];
        // the movie set
        var gs=cx.createLinearGradient(0,100,0,H*0.62); gs.addColorStop(0,SET[2]); gs.addColorStop(1,SET[3]); cx.fillStyle=gs; rr(20,100,W-40,H*0.52,16); cx.fill();
        cx.strokeStyle="#0006"; cx.lineWidth=4; rr(20,100,W-40,H*0.52,16); cx.stroke();
        emo(SET[0], 52, 128, 26);
        var acting = g.film==="rec";
        var by = H*0.4 + (acting? -Math.abs(Math.sin(g.filmT*0.2))*16 : Math.sin(t*0.06)*3);
        emo(st[0], W*0.36, by, 46);
        emo(P[0], W*0.6, H*0.4+Math.sin(t*0.1)*4, 40);
        // clapperboard
        emo("🎬", W*0.5, H*0.56, 30);
        if(g.film==="ready"){ text("Lights... camera...",W/2,H*0.2,17,"#3a2a10"); btn("🎬 ACTION!",H-66,"#ffce3f"); }
        else if(g.film==="count"){ var cd=3-Math.floor(g.filmT/30); text(cd>0?String(cd):"GO!",W/2,H*0.32,64,"#fff"); text("Get ready to film!",H*0.2<0?0:W/2,H*0.2,16,"#3a2a10"); }
        else if(g.film==="rec"){ if(Math.floor(g.filmT/12)%2===0){ cx.fillStyle="#ff3a3a"; cx.beginPath(); cx.arc(44,128,7,0,7); cx.fill(); text("REC",70,128,15,"#ff3a3a","left"); } text("🎥 Filming Take 1...",W/2,H*0.2,17,"#3a2a10"); }
        else { text("✂️ CUT! Perfect take!",W/2,H*0.2,19,"#2a5a2a"); btn("NEXT ▶ Editing",H-66,"#7bd07b"); }
        return;
      }
      // ===== PREMIERE =====
      if(g.stage===6){
        var SET2=SETS[g.setI], P2=PRODUCTS[g.prod], st2=STARS[g.starI];
        var gp=cx.createLinearGradient(0,100,0,H*0.66); gp.addColorStop(0,SET2[2]); gp.addColorStop(1,P2[3]); cx.fillStyle=gp; rr(20,100,W-40,H*0.56,18); cx.fill();
        cx.strokeStyle="#fff8"; cx.lineWidth=3; rr(20,100,W-40,H*0.56,18); cx.stroke();
        // ON AIR + blinking
        if(Math.floor(t/20)%2===0){ cx.fillStyle="#ff3a3a"; cx.beginPath(); cx.arc(W/2-58,122,6,0,7); cx.fill(); }
        text("ON AIR",W/2,122,15,"#fff");
        emo(SET2[0], 52, 128, 22);
        emo(MUSIC[g.music][0], W-52, 128+Math.sin(t*0.3)*4, 22);
        var bob=Math.sin(g.playT*0.2)*10;
        emo(P2[0], W/2, H*0.32+bob, 68);
        emo(st2[0], W*0.28, H*0.44+Math.abs(Math.sin(g.playT*0.18))*-12, 40);
        emo(st2[0], W*0.72, H*0.44+Math.abs(Math.cos(g.playT*0.18))*-12, 40);
        text(P2[1].toUpperCase(),W/2,H*0.44,23,"#fff");
        text('"'+SLOGANS[g.slog]+'"',W/2,H*0.51,18,"#fff2c8");
        if(g.rated){ text("⭐⭐⭐⭐⭐",W/2,H*0.58,26,"#ffe27a"); text("5-STAR AD!",W/2,H*0.63,16,"#fff"); }
        btn(g.rated?"🎬 MAKE ANOTHER":"…now airing…",H-66, g.rated?"#7bd07b":"#b7a0e0");
        return;
      }

      // ===== CHOOSER STAGES (0,1,2,3,5) =====
      // picks-so-far strip
      var picks=""; if(g.prod>=0)picks+=PRODUCTS[g.prod][0]; if(g.starI>=0)picks+=" "+STARS[g.starI][0]; if(g.setI>=0)picks+=" "+SETS[g.setI][0]; if(g.slog>=0)picks+=" 💬"; if(g.music>=0)picks+=" "+MUSIC[g.music][0];
      if(picks)text("Your ad so far:  "+picks, W/2, 98, 15, "#d4c2ff");
      var rc, i;
      if(g.stage===0){ text("What are we advertising?",W/2,120,15,"#cbb8ff"); var R=cards(6,2,150,80,14,138);
        for(i=0;i<6;i++){ rc=R[i]; var P=PRODUCTS[i]; optCard(rc,g.prod===i,P[2],P[3]); emo(P[0],rc.x+rc.w/2,rc.y+34,34); text(P[1],rc.x+rc.w/2,rc.y+66,12,"#fff"); }
      } else if(g.stage===1){ text("Who's the star of the show?",W/2,120,15,"#cbb8ff"); var R1=cards(5,3,92,100,10,140);
        for(i=0;i<5;i++){ rc=R1[i]; var stx=STARS[i]; optCard(rc,g.starI===i); emo(stx[0],rc.x+rc.w/2,rc.y+46,42); text(stx[1],rc.x+rc.w/2,rc.y+84,14,g.starI===i?"#3a2a10":"#eadcff"); }
      } else if(g.stage===2){ text("Where do we film it?",W/2,120,15,"#cbb8ff"); var R2=cards(4,2,150,80,14,140);
        for(i=0;i<4;i++){ rc=R2[i]; var SE=SETS[i]; optCard(rc,g.setI===i,SE[2],SE[3]); emo(SE[0],rc.x+rc.w/2,rc.y+34,32); text(SE[1],rc.x+rc.w/2,rc.y+66,13,"#2a2a2a"); }
      } else if(g.stage===3){ text("Pick the catchy slogan!",W/2,120,15,"#cbb8ff"); var R3=cards(6,1,320,46,9,138);
        for(i=0;i<6;i++){ rc=R3[i]; optCard(rc,g.slog===i); text('"'+SLOGANS[i]+'"',rc.x+rc.w/2,rc.y+23,16,g.slog===i?"#3a2a10":"#eadcff"); }
      } else if(g.stage===5){ text("Add music & finish the edit!",W/2,120,15,"#cbb8ff"); var R5=cards(4,2,150,72,14,150);
        for(i=0;i<4;i++){ rc=R5[i]; var M=MUSIC[i]; optCard(rc,g.music===i); emo(M[0],rc.x+rc.w/2,rc.y+30,30); text(M[1],rc.x+rc.w/2,rc.y+58,13,g.music===i?"#3a2a10":"#eadcff"); }
      }
      // NEXT / action button when ready
      if(makeReady()){ var lbl = g.stage===3?"NEXT ▶ Filming" : g.stage===5?"📺 PREMIERE!" : "NEXT ▶"; btn(lbl,H-66, g.stage===5?"#ffce3f":"#7bd07b"); } },

    tap:function(){
      // ---- FILMING taps ----
      if(g.stage===4){
        if(g.film==="ready" && ptr.y>H-66 && ptr.y<H-14 && Math.abs(ptr.x-W/2)<120){ g.film="count"; g.filmT=0; bark(); label("🎬 Action! Rolling..."); return; }
        if(g.film==="cut" && ptr.y>H-66 && ptr.y<H-14 && Math.abs(ptr.x-W/2)<120){ g.stage=5; beep(680,.08); label("✂️ Now edit it — add music!"); return; }
        return;
      }
      // ---- PREMIERE taps ----
      if(g.stage===6){ if(g.rated && ptr.y>H-66 && ptr.y<H-14 && Math.abs(ptr.x-W/2)<120){ go("make"); } return; }

      // ---- NEXT / action button ----
      if(ptr.y>H-66 && ptr.y<H-14 && Math.abs(ptr.x-W/2)<120 && makeReady()){
        if(g.stage===0){ g.stage=1; beep(680,.08); label("🎭 Step 2: Casting the star!"); return; }
        if(g.stage===1){ g.stage=2; beep(680,.08); label("🏞️ Step 3: Choose the set!"); return; }
        if(g.stage===2){ g.stage=3; beep(680,.08); label("✍️ Step 4: Write the slogan!"); return; }
        if(g.stage===3){ g.stage=4; g.film="ready"; g.filmT=0; beep(680,.08); label("🎬 Step 5: Lights, camera, ACTION!"); return; }
        if(g.stage===5){ g.stage=6; g.playT=0; g.rated=false; bark(); label("📺 Step 7: The premiere!"); return; }
      }
      // ---- card picks ----
      var i,rc;
      if(g.stage===0){ var R=cards(6,2,150,80,14,138); for(i=0;i<6;i++){ if(hit(R[i])){ g.prod=i; beep(600,.06); burst(ptr.x,ptr.y,PRODUCTS[i][2],7); } } }
      else if(g.stage===1){ var R1=cards(5,3,92,100,10,140); for(i=0;i<5;i++){ if(hit(R1[i])){ g.starI=i; beep(640,.06); heartPop(ptr.x,ptr.y,4); } } }
      else if(g.stage===2){ var R2=cards(4,2,150,80,14,140); for(i=0;i<4;i++){ if(hit(R2[i])){ g.setI=i; beep(620,.06); burst(ptr.x,ptr.y,SETS[i][2],6); } } }
      else if(g.stage===3){ var R3=cards(6,1,320,46,9,138); for(i=0;i<6;i++){ if(hit(R3[i])){ g.slog=i; beep(700,.06); star(ptr.x,ptr.y,5); } } }
      else if(g.stage===5){ var R5=cards(4,2,150,72,14,150); for(i=0;i<4;i++){ if(hit(R5[i])){ g.music=i; beep(680,.06); star(ptr.x,ptr.y,5); } } } } };

  // ---------------- CATCH ADS ----------------
  S.catch={ init:function(){ g={ads:[], got:0, need:15, boops:0, over:false, spawn:0, dx:W/2, hop:0}; label("CATCH ADS — tap the fun ones! 🎯"); },
    update:function(){ if(g.hop>0)g.hop--; if(g.over)return;
      g.spawn++; if(g.spawn> Math.max(16, 30-g.got) ){ g.spawn=0; var boring=Math.random()<0.26; var pi=Math.floor(Math.random()*PRODUCTS.length);
        g.ads.push({x:44+Math.random()*(W-88), y:H+30, r:26, vy:-(1.0+Math.random()*1.3), sway:Math.random()*6.28, boring:boring, pi:pi}); }
      for(var i=g.ads.length-1;i>=0;i--){ var a=g.ads[i]; a.y+=a.vy; a.x+=Math.sin(t*0.05+a.sway)*0.6; if(a.y< -50) g.ads.splice(i,1); }
      g.dx+=(((g.target!=null?g.target:W/2))-g.dx)*0.12; },
    render:function(){ var gr=cx.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#dff0ff"); gr.addColorStop(1,"#eee6ff"); cx.fillStyle=gr; cx.fillRect(0,0,W,H);
      coinHUD();
      g.ads.forEach(function(a){ cx.save(); cx.translate(a.x,a.y); var s=1+Math.sin(t*0.1+a.sway)*0.04; cx.scale(s,s);
        if(a.boring){ cx.fillStyle="#9a94a8"; rr(-30,-20,60,40,10); cx.fill(); cx.strokeStyle="#6a6478"; cx.lineWidth=2; rr(-30,-20,60,40,10); cx.stroke(); emo("😴",0,-2,26); }
        else { var P=PRODUCTS[a.pi]; var g2=cx.createLinearGradient(0,-22,0,22); g2.addColorStop(0,P[2]); g2.addColorStop(1,P[3]); cx.fillStyle=g2; rr(-32,-22,64,44,11); cx.fill(); cx.strokeStyle="#fff"; cx.lineWidth=2; rr(-32,-22,64,44,11); cx.stroke(); emo(P[0],0,-3,26); text("SALE!",0,14,10,"#fff"); }
        cx.restore(); });
      var pose = g.hop>0?"jump":"stand";
      drawArff(g.dx, H-40+ (g.hop>0? -Math.sin((10-g.hop)/10*3.14)*20:0), 1.4, 1, pose);
      text("Tap 📢 fun ads  •  skip 😴",W/2,40,16,"#4a2a7a");
      cx.fillStyle="#00000018"; rr(W/2-100,H-26,200,12,6); cx.fill(); cx.fillStyle="#7a5ad0"; rr(W/2-100,H-26,200*Math.min(1,g.got/g.need),12,6); cx.fill();
      text(g.got+"/"+g.need,W/2,H-20,12,"#3a1a5a");
      if(g.over){ if(t%45===0)confettiBurst(); cx.fillStyle="rgba(0,0,0,.45)"; cx.fillRect(0,0,W,H); text("🎯 AD-CATCHING STAR!",W/2,H*0.42,22,"#ffd23f"); text("Caught "+g.need+" fun ads!",W/2,H*0.49,16,"#fff"); btn("▶ BACK TO MENU",H*0.57); } },
    tap:function(){ if(g.over){ go("menu"); return; }
      for(var i=g.ads.length-1;i>=0;i--){ var a=g.ads[i]; if(Math.abs(ptr.x-a.x)<38 && Math.abs(ptr.y-a.y)<30){
        if(a.boring){ g.boops++; beep(150,.16,"sawtooth"); shakeIt(6); floatUp("boring!",a.x,a.y,"#9a94a8"); g.ads.splice(i,1); return; }
        g.ads.splice(i,1); g.got++; coins++; save(); g.target=a.x; g.hop=10; ding(); burst(a.x,a.y,PRODUCTS[a.pi][2],12,2.6); floatUp("+1 🪙",a.x,a.y-6,"#ffe27a"); star(a.x,a.y,5);
        if(g.got>=g.need){ g.over=true; confettiBurst(); label("CATCH ADS done! 🪙 "+coins); } return; } } },
    drag:function(x){ ptr.x=x; } };

  // ---------------- BILLBOARD ----------------
  S.board={ init:function(){ g={slots:[null,null,null,null,null,null], sel:0, filled:0, over:false}; label("BILLBOARD — tap slots to add ads! 🖼️"); },
    render:function(){ var gr=cx.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#bfe6ff"); gr.addColorStop(1,"#e9f9ef"); cx.fillStyle=gr; cx.fillRect(0,0,W,H);
      // sky + posts
      cx.fillStyle="#ffe45e"; cx.beginPath(); cx.arc(W-48,50,20,0,7); cx.fill();
      coinHUD();
      text("Build the big ad billboard!",W/2,52,17,"#2a5a7a");
      // billboard frame
      var bx0=30, by0=80, bw=W-60, bh=H*0.56;
      cx.fillStyle="#6a4a2a"; cx.fillRect(W/2-10,by0+bh,20,H-by0-bh-40); // post
      cx.fillStyle="#c9a06a"; rr(bx0-8,by0-8,bw+16,bh+16,12); cx.fill();
      cx.fillStyle="#3a2a4a"; rr(bx0,by0,bw,bh,8); cx.fill();
      // 6 slots 2x3
      for(var i=0;i<6;i++){ var col=i%2,row=Math.floor(i/3===undefined?0:0); col=i%2; row=Math.floor(i/2);
        var sw=(bw-30)/2, sh=(bh-40)/3, sx=bx0+10+col*(sw+10), sy=by0+10+row*(sh+10);
        var it=g.slots[i];
        if(it!=null){ var P=PRODUCTS[it]; var g2=cx.createLinearGradient(0,sy,0,sy+sh); g2.addColorStop(0,P[2]); g2.addColorStop(1,P[3]); cx.fillStyle=g2; rr(sx,sy,sw,sh,8); cx.fill(); cx.strokeStyle="#fff"; cx.lineWidth=2; rr(sx,sy,sw,sh,8); cx.stroke(); emo(P[0],sx+sw/2,sy+sh/2-6,34); text(P[1].toUpperCase(),sx+sw/2,sy+sh-14,11,"#fff"); }
        else { cx.fillStyle=g.sel===i?"#5a4a7a":"#4a3a60"; rr(sx,sy,sw,sh,8); cx.fill(); cx.strokeStyle=g.sel===i?"#ffd27a":"#ffffff33"; cx.lineWidth=g.sel===i?3:2; cx.setLineDash([6,5]); rr(sx,sy,sw,sh,8); cx.stroke(); cx.setLineDash([]); emo("➕",sx+sw/2,sy+sh/2,30); text("tap to add",sx+sw/2,sy+sh-16,11,"#cbb8ff"); }
      }
      text(g.filled+"/6 ads placed",W/2,by0+bh+22,14,"#3a5a2a");
      if(g.over){ if(t%45===0)confettiBurst(); cx.fillStyle="rgba(0,0,0,.45)"; cx.fillRect(0,0,W,H); text("🖼️ BILLBOARD COMPLETE!",W/2,H*0.4,21,"#ffd23f"); text("+8 🪙 earned!",W/2,H*0.47,17,"#fff"); btn("▶ NEW BILLBOARD",H*0.54,"#7bd07b"); btn("🏠 BACK TO MENU",H*0.64,"#c6ecff"); } },
    tap:function(){ if(g.over){ if(ptr.y>H*0.64-8&&ptr.y<H*0.64+52){ go("menu"); } else { go("board"); } return; }
      var bx0=30, by0=80, bw=W-60, bh=H*0.56;
      for(var i=0;i<6;i++){ var col=i%2,row=Math.floor(i/2); var sw=(bw-30)/2, sh=(bh-40)/3, sx=bx0+10+col*(sw+10), sy=by0+10+row*(sh+10);
        if(ptr.x>sx&&ptr.x<sx+sw&&ptr.y>sy&&ptr.y<sy+sh){
          if(g.slots[i]==null){ g.slots[i]=Math.floor(Math.random()*PRODUCTS.length); g.filled++; ding(); burst(ptr.x,ptr.y,PRODUCTS[g.slots[i]][2],10); star(ptr.x,ptr.y,4);
            if(g.filled>=6){ g.over=true; coins+=8; save(); confettiBurst(); label("Billboard done! 🪙 "+coins); } }
          else { g.slots[i]=(g.slots[i]+1)%PRODUCTS.length; beep(620,.06); burst(ptr.x,ptr.y,PRODUCTS[g.slots[i]][2],6); } // tap again to swap product
          return; } } } };

  // ---------------- input ----------------
  function pos(e){ var r=cv.getBoundingClientRect(), sx=cv.width/r.width, sy=cv.height/r.height; var cxp,cyp; if(e.touches&&e.touches[0]){ cxp=e.touches[0].clientX; cyp=e.touches[0].clientY; } else { cxp=e.clientX; cyp=e.clientY; } return {x:(cxp-r.left)*sx, y:(cyp-r.top)*sy}; }
  function down(e){ e.preventDefault(); var p=pos(e); ptr.x=p.x; ptr.y=p.y; ptr.down=true; var s=S[scene]; if(s.tap)s.tap(); if(s.drag)s.drag(p.x); }
  function move(e){ e.preventDefault(); var p=pos(e); ptr.x=p.x; ptr.y=p.y; var s=S[scene]; if(ptr.down&&s.drag)s.drag(p.x); }
  function up(e){ e.preventDefault(); ptr.down=false; }
  cv.addEventListener("mousedown",down); cv.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
  cv.addEventListener("touchstart",down,{passive:false}); cv.addEventListener("touchmove",move,{passive:false}); cv.addEventListener("touchend",up,{passive:false});

  function loop(){ t++; var s=S[scene]; if(s.update)s.update(); updateFX();
    cx.save(); var sh=FX.shake>0.4?FX.shake:0; if(sh){ cx.translate((Math.random()*2-1)*sh,(Math.random()*2-1)*sh); } FX.shake*=0.85;
    s.render(); renderFX(); cx.restore();
    requestAnimationFrame(loop); }
  go("menu"); loop();
})();
</script>
