<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MO INTUIT DOME</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#060a1c;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000066;padding:6px 10px;border-radius:10px;}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5;pointer-events:none;}
  #ui .wrap{pointer-events:auto;display:flex;flex-direction:column;align-items:center;}
  h1{margin:0;font-size:min(13vw,62px);letter-spacing:2px;color:#37e0ff;text-shadow:0 0 24px #37e0ff88,0 0 48px #37e0ff44;}
  h2{margin:6px 0 0;font-size:min(5vw,22px);color:#ffcf5a;text-shadow:0 0 14px #ffcf5a55;font-weight:bold;}
  #start{margin-top:min(44vh,360px);padding:18px 54px;font-size:26px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(#5fe9ff,#1f9fd8);color:#042033;border:none;border-radius:18px;
    box-shadow:0 7px 0 #1477a8,0 0 34px #37e0ff66;cursor:pointer;}
  #start:active{transform:translateY(5px);box-shadow:0 2px 0 #1477a8,0 0 24px #37e0ff66;}
  #typeWrap{position:fixed;left:0;right:0;bottom:12%;display:none;justify-content:center;z-index:8;}
  #typeWrap.show{display:flex;}
  #word{width:min(80vw,420px);text-align:center;font-family:'Trebuchet MS',sans-serif;font-size:30px;font-weight:900;
    letter-spacing:4px;text-transform:uppercase;color:#042033;background:#eaf6ff;border:4px solid #37e0ff;border-radius:16px;
    padding:12px 10px;box-shadow:0 0 26px #37e0ff66;outline:none;}
  #word::placeholder{color:#8fb6cc;letter-spacing:3px;font-weight:700;}
</style>
</head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="ui"><div class="wrap">
  <h1>MO INTUIT DOME</h1>
  <h2>🏀 Home of the L.A. CLIPS</h2>
  <button id="start">▶ START</button>
</div></div>
<div id="typeWrap"><input id="word" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="type: GAME DAY"></div>
<script>
"use strict";
(function(){
  var cv=document.getElementById("c"), x=cv.getContext("2d");
  var W=0,H=0,DPR=1,anim=0,stars=[],conf=[];
  // modes: start | bed | type | gday | walk | tickets
  var mode="start";
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+"px"; cv.style.height=H+"px"; x.setTransform(DPR,0,0,DPR,0,0); buildStars(); layout(); }
  addEventListener("resize",resize);
  function buildStars(){ stars=[]; for(var i=0;i<60;i++){ stars.push({x:Math.random()*W, y:Math.random()*H*0.5, r:Math.random()*1.6+0.5, ph:Math.random()*6}); } }

  function skC(){ try{return localStorage.getItem("moSkin")||"#f6c48a";}catch(e){return "#f6c48a";} }
  function hrC(){ try{return localStorage.getItem("moHair")||"#2a2018";}catch(e){return "#2a2018";} }
  function rr(a,b,c,d,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+c,b,a+c,b+d,r); x.arcTo(a+c,b+d,a,b+d,r); x.arcTo(a,b+d,a,b,r); x.arcTo(a,b,a+c,b,r); x.closePath(); }

  var AC=null; function ac(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==="suspended")AC.resume(); return AC; }
  function beep(f,d,t,v){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.type=t||"sine"; o.frequency.value=f; g.gain.value=v||0.05; o.connect(g); g.connect(a.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1)); o.stop(a.currentTime+(d||0.1)+0.02); }
  function ding(){ beep(900,0.08,"sine",0.06); setTimeout(function(){beep(1300,0.1,"sine",0.05);},70); }
  function roar(){ for(var i=0;i<8;i++){ (function(j){ setTimeout(function(){ beep(220+Math.random()*500,0.12,"sawtooth",0.02); }, j*45); })(i); } }

  // ---- geometry ----
  var bed={}, moPos={x:0,y:0}, onBed=true, dragging=false, moScale=1;
  var moX=0, moVX=0, walkPhase=0, fridgeX=0, floorY=0, gotTickets=false;
  var foods=[], dragFood=-1, eatenCount=0, mouthX=0, mouthY=0, moEatX=0, chomp=0;
  var bottle={x:0,y:0}, bottleDrag=false, fill=0, sinkX=0, sinkY=0;
  var clockX=0, clockCY=0, atClock=false;
  var bagItems=[], dragItem=-1, packedCount=0, bagX=0, bagY=0;
  var streetGoalX=0, bowlsX=0;
  var loadBag={x:0,y:0}, loadDrag=false, carLoadX=0;
  var snacks=[], dragSnack=-1, coolerX=0, coolerY=0, snackCount=0;
  var waters=[], dragWater=-1, holders=[], waterCount=0;
  var pen={x:0,y:0}, penDrag=false, signProg=0, inkPts=[];
  var hatX=0, moHat=-1, HATCOLS=["#e8402a","#1f5fd0","#ffcf5a"];
  var plugs=[], dragPlug=-1, outlet={x:0,y:0}, camPort={x:0,y:0};
  var joy={active:false,id:null,bx:0,by:0,r:0,kx:0,ky:0,dx:0};
  function layout(){
    bed.w=Math.min(W*0.7,420); bed.h=Math.min(H*0.16,120); bed.x=W/2-bed.w/2; bed.y=H*0.55;
    moScale=Math.max(26,W*0.10);
    if(onBed){ moPos.x=W/2; moPos.y=bed.y+8; }
    floorY=H*0.72; fridgeX=W*0.82;
    joy.r=Math.min(W*0.15,70); joy.bx=joy.r+22; joy.by=H-joy.r-22; joy.kx=joy.bx; joy.ky=joy.by;
  }

  function drawMo(cx,cy,sleeping,wphase){ var s=moScale, skin=skC(), hair=hrC();
    if(sleeping){
      x.fillStyle="#3b6fb0"; rr(cx-bed.w*0.34,cy-6,bed.w*0.68,bed.h*0.7,14); x.fill();
      x.fillStyle="#5a8fd8"; rr(cx-bed.w*0.34,cy-6,bed.w*0.68,10,6); x.fill();
      var hx=cx-bed.w*0.28, hy=cy+bed.h*0.14;
      x.fillStyle=skin; x.beginPath(); x.arc(hx,hy,s*0.3,0,7); x.fill();
      x.fillStyle=hair; x.beginPath(); x.arc(hx,hy-s*0.08,s*0.3,Math.PI*0.95,Math.PI*2.05); x.fill();
      x.fillStyle="#201008"; x.beginPath(); x.arc(hx+s*0.05,hy,s*0.03,0,7); x.fill();
      var zz=(anim*0.03)%1; x.fillStyle="#bcd6ff"; x.font="bold "+Math.round(s*0.4)+"px Trebuchet MS"; x.textAlign="left"; x.textBaseline="middle"; x.globalAlpha=1-zz; x.fillText("z", cx+bed.w*0.1+zz*20, cy-10-zz*30); x.globalAlpha=1;
      return;
    }
    // ---- MO L.A. CLIPS uniform (RED & BLUE) ----
    var JB="#1f5fd0", RED="#e8402a";
    var sw=wphase?Math.sin(wphase)*s*0.16:0;
    // blue shorts with red stripe
    x.fillStyle=JB; x.fillRect(cx-s*0.26,cy,s*0.22,s*0.6+(wphase?sw:0)); x.fillRect(cx+s*0.04,cy,s*0.22,s*0.6-(wphase?sw:0));
    x.fillStyle=RED; x.fillRect(cx-s*0.17,cy,s*0.03,s*0.6+(wphase?sw:0)); x.fillRect(cx+s*0.14,cy,s*0.03,s*0.6-(wphase?sw:0));
    // sleeveless arms (skin)
    var up=(mode==="gday"||mode==="tickets");
    x.strokeStyle=skin; x.lineWidth=s*0.16; x.lineCap="round";
    if(up){ x.beginPath(); x.moveTo(cx-s*0.36,cy-s*0.5); x.lineTo(cx-s*0.58,cy-s*1.02); x.moveTo(cx+s*0.36,cy-s*0.5); x.lineTo(cx+s*0.58,cy-s*1.02); x.stroke(); }
    else { var aw=wphase?Math.cos(wphase)*s*0.12:0; x.beginPath(); x.moveTo(cx-s*0.36,cy-s*0.45); x.lineTo(cx-s*0.6,cy-s*0.28+aw); x.moveTo(cx+s*0.36,cy-s*0.45); x.lineTo(cx+s*0.6,cy-s*0.28-aw); x.stroke(); }
    // jersey body (blue) with RED side panels + red neck trim
    x.fillStyle=JB; rr(cx-s*0.4,cy-s*0.7,s*0.8,s*0.8,8); x.fill();
    x.fillStyle=RED; rr(cx-s*0.4,cy-s*0.7,s*0.11,s*0.8,8); x.fill(); rr(cx+s*0.29,cy-s*0.7,s*0.11,s*0.8,8); x.fill();
    x.strokeStyle=RED; x.lineWidth=s*0.06; x.beginPath(); x.moveTo(cx-s*0.17,cy-s*0.7); x.lineTo(cx-s*0.06,cy-s*0.57); x.lineTo(cx+s*0.06,cy-s*0.57); x.lineTo(cx+s*0.17,cy-s*0.7); x.stroke();
    // "MO" (white, red outline) + number 1 (red, white outline)
    x.font="900 "+Math.round(s*0.25)+"px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle";
    x.strokeStyle=RED; x.lineWidth=s*0.06; x.strokeText("MO",cx,cy-s*0.42); x.fillStyle="#fff"; x.fillText("MO",cx,cy-s*0.42);
    x.font="900 "+Math.round(s*0.24)+"px Trebuchet MS"; x.strokeStyle="#fff"; x.lineWidth=s*0.06; x.strokeText("1",cx,cy-s*0.14); x.fillStyle=RED; x.fillText("1",cx,cy-s*0.14);
    x.fillStyle=skin; x.beginPath(); x.arc(cx,cy-s*0.95,s*0.3,0,7); x.fill();
    x.fillStyle=hair; x.beginPath(); x.arc(cx,cy-s*1.02,s*0.3,Math.PI*1.03,Math.PI*1.97); x.fill();
    x.fillStyle="#201008"; x.beginPath(); x.arc(cx-s*0.1,cy-s*0.95,s*0.045,0,7); x.arc(cx+s*0.1,cy-s*0.95,s*0.045,0,7); x.fill();
    x.fillStyle="#2a0a0a"; x.beginPath(); x.arc(cx,cy-s*0.84,s*0.09,0,Math.PI); x.fill();
    if(moHat>=0){ var hc2=HATCOLS[moHat]; x.fillStyle=hc2; x.beginPath(); x.arc(cx,cy-s*1.08,s*0.31,Math.PI,2*Math.PI); x.fill(); x.fillRect(cx-s*0.31,cy-s*1.10,s*0.62,s*0.05); x.fillRect(cx+s*0.06,cy-s*1.10,s*0.4,s*0.07); x.fillStyle="#fff"; x.font="900 "+Math.round(s*0.17)+"px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("M",cx,cy-s*1.2); }
  }

  function banner(txt,col){ x.fillStyle="#000a"; rr(W*0.05,H*0.04,W*0.9,34,12); x.fill(); x.fillStyle=col||"#ffcf5a"; x.font="bold 18px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(txt, W/2, H*0.04+17); }
  function drawClock(cx,cy,r){
    x.fillStyle="#2a2f52"; x.beginPath(); x.arc(cx,cy,r+6,0,7); x.fill();
    x.fillStyle="#fff"; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
    x.strokeStyle="#13306a"; x.lineWidth=3; x.beginPath(); x.arc(cx,cy,r,0,7); x.stroke();
    for(var i=0;i<12;i++){ var a=i*Math.PI/6; x.strokeStyle="#334"; x.lineWidth=2; x.beginPath(); x.moveTo(cx+Math.cos(a)*r*0.82,cy+Math.sin(a)*r*0.82); x.lineTo(cx+Math.cos(a)*r*0.92,cy+Math.sin(a)*r*0.92); x.stroke(); }
    function hand(deg,len,wd,col){ var a=(deg-90)*Math.PI/180; x.strokeStyle=col; x.lineWidth=wd; x.lineCap="round"; x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(a)*len, cy+Math.sin(a)*len); x.stroke(); }
    hand(210, r*0.5, 4, "#13306a"); hand(0, r*0.72, 3, "#e8402a");
    x.fillStyle="#13306a"; x.beginPath(); x.arc(cx,cy,3.5,0,7); x.fill();
    x.fillStyle="#13306a"; x.font="bold "+Math.round(r*0.42)+"px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("7:00", cx, cy+r+16);
  }
  function paperRect(){ return {x:W*0.5-W*0.38, y:H*0.22, w:W*0.76, h:H*0.4}; }
  function drawPaperSign(p){ var r=paperRect();
    x.fillStyle="#fff"; rr(r.x,r.y,r.w,r.h,10); x.fill(); x.strokeStyle="#c9b48a"; x.lineWidth=3; rr(r.x,r.y,r.w,r.h,10); x.stroke();
    if(inkPts.length>1){ x.strokeStyle="#9ec3f0"; x.lineWidth=3; x.lineCap="round"; x.beginPath(); x.moveTo(inkPts[0].x,inkPts[0].y); for(var i=1;i<inkPts.length;i++){ x.lineTo(inkPts[i].x,inkPts[i].y); } x.stroke(); }
    x.textAlign="center"; x.textBaseline="middle";
    x.fillStyle="rgba(31,95,208,"+(0.14+0.86*p)+")"; x.font="900 "+Math.round(Math.min(W*0.12,64))+"px Trebuchet MS"; x.fillText("GOOD LUCK", W/2, r.y+r.h*0.36);
    x.fillStyle="rgba(232,64,42,"+(0.14+0.86*p)+")"; x.fillText("CLIPS!", W/2, r.y+r.h*0.68);
  }
  function drawPen(cx,cy){ x.save(); x.translate(cx,cy); x.rotate(-0.6);
    x.fillStyle="#1f5fd0"; rr(-5,-moScale*0.95,10,moScale*0.95,3); x.fill();
    x.fillStyle="#ffcf5a"; rr(-5,-moScale*0.95,10,11,3); x.fill();
    x.fillStyle="#333"; x.beginPath(); x.moveTo(-5,0); x.lineTo(5,0); x.lineTo(0,11); x.closePath(); x.fill();
    x.restore(); }
  function drawMeow(cx,cy){ var s=moScale*0.55;
    x.fillStyle="#9a9aa6"; rr(cx-s*0.7,cy-s*0.6,s*1.3,s*0.7,s*0.3); x.fill();
    x.beginPath(); x.arc(cx-s*0.6,cy-s*0.75,s*0.42,0,7); x.fill();
    x.beginPath(); x.moveTo(cx-s*0.95,cy-s*1.05); x.lineTo(cx-s*0.8,cy-s*1.45); x.lineTo(cx-s*0.6,cy-s*1.05); x.closePath(); x.fill();
    x.beginPath(); x.moveTo(cx-s*0.6,cy-s*1.05); x.lineTo(cx-s*0.42,cy-s*1.45); x.lineTo(cx-s*0.25,cy-s*1.05); x.closePath(); x.fill();
    x.strokeStyle="#9a9aa6"; x.lineWidth=s*0.24; x.lineCap="round"; x.beginPath(); x.moveTo(cx+s*0.55,cy-s*0.25); x.quadraticCurveTo(cx+s*1.05,cy-s*0.55,cx+s*0.9,cy-s*1.05); x.stroke();
    x.fillStyle="#2a6e3a"; x.beginPath(); x.arc(cx-s*0.72,cy-s*0.78,s*0.08,0,7); x.arc(cx-s*0.48,cy-s*0.78,s*0.08,0,7); x.fill();
    x.fillStyle="#e86a8a"; x.beginPath(); x.arc(cx-s*0.6,cy-s*0.62,s*0.06,0,7); x.fill(); }
  function drawBowls(cx,cy){
    drawMeow(cx, cy-moScale*0.35);
    x.fillStyle="#e86a2a"; x.beginPath(); x.ellipse(cx-moScale*0.55,cy-4,moScale*0.42,moScale*0.18,0,0,7); x.fill();
    x.fillStyle="#8a5a2a"; for(var k=0;k<6;k++){ x.beginPath(); x.arc(cx-moScale*0.55+(k%3-1)*moScale*0.18, cy-8-((k/3|0))*moScale*0.08, moScale*0.06,0,7); x.fill(); }
    x.fillStyle="#6aa0d8"; x.beginPath(); x.ellipse(cx+moScale*0.55,cy-4,moScale*0.42,moScale*0.18,0,0,7); x.fill();
    x.fillStyle="#9fd0ff"; x.beginPath(); x.ellipse(cx+moScale*0.55,cy-7,moScale*0.3,moScale*0.12,0,0,7); x.fill();
    x.fillStyle="#7a5030"; x.font="bold 12px Trebuchet MS"; x.textAlign="center"; x.textBaseline="top"; x.fillText("food",cx-moScale*0.55,cy+6); x.fillText("water",cx+moScale*0.55,cy+6); }
  function drawStreet(){
    var sky=x.createLinearGradient(0,0,0,H*0.55); sky.addColorStop(0,"#7ec0ee"); sky.addColorStop(1,"#d6ecf8"); x.fillStyle=sky; x.fillRect(0,0,W,H*0.55);
    x.save(); x.shadowColor="#37e0ff"; x.shadowBlur=12; x.fillStyle="#17407a"; var dw=W*0.2,dh=H*0.055; x.beginPath(); x.ellipse(W*0.8,H*0.45,dw/2,dh,0,Math.PI,0); x.fill(); x.restore();
    x.fillStyle="#ffcf5a"; x.font="bold 10px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("MO DOME",W*0.8,H*0.43);
    var hy=H*0.30; var hc=["#d98b6a","#e8c06a","#9ac47a","#7ab0d8","#c79ad8","#e0a0a0"];
    for(var i=0;i<6;i++){ var hx=i*W*0.19-10; x.fillStyle=hc[i%6]; x.fillRect(hx,hy,W*0.15,H*0.22); x.fillStyle="#8a5a3a"; x.beginPath(); x.moveTo(hx-4,hy); x.lineTo(hx+W*0.075,hy-24); x.lineTo(hx+W*0.15+4,hy); x.closePath(); x.fill(); x.fillStyle="#5a3a2a"; x.fillRect(hx+W*0.055,hy+H*0.11,W*0.035,H*0.11); }
    x.fillStyle="#6ab04a"; x.fillRect(0,H*0.52,W,H*0.055);
    x.fillStyle="#cfc9bf"; x.fillRect(0,H*0.575,W,H*0.165);
    x.fillStyle="#44474e"; x.fillRect(0,H*0.74,W,H*0.26);
    x.strokeStyle="#ffd24a"; x.lineWidth=4; x.setLineDash([24,20]); x.lineDashOffset=-(anim*3)%44; x.beginPath(); x.moveTo(0,H*0.87); x.lineTo(W,H*0.87); x.stroke(); x.setLineDash([]); }
  function drawHolders(){ var ty=H*0.5; x.fillStyle="#3a3f4a"; rr(W*0.1,ty,W*0.8,moScale*1.1,12); x.fill(); x.fillStyle="#2a2f38"; rr(W*0.1,ty,W*0.8,10,8); x.fill();
    x.fillStyle="#555"; x.font="bold 13px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle";
    for(var i=0;i<holders.length;i++){ var hd=holders[i]; x.fillStyle="#1a1d24"; x.beginPath(); x.ellipse(hd.x,hd.y,moScale*0.34,moScale*0.16,0,0,7); x.fill();
      if(hd.filled){ drawBottle(hd.x, hd.y-moScale*0.5, 1); }
      else { x.save(); x.globalAlpha=0.35+0.3*Math.sin(anim*0.14+i); x.strokeStyle="#ffcf5a"; x.lineWidth=2; x.beginPath(); x.ellipse(hd.x,hd.y,moScale*0.34,moScale*0.16,0,0,7); x.stroke(); x.restore(); } } }
  function drawCooler(cx,cy,filled){ var w=moScale*1.4,h=moScale*0.9;
    x.fillStyle="#2f8fd0"; rr(cx-w/2,cy-h,w,h,8); x.fill();
    x.fillStyle="#1f6fb0"; rr(cx-w/2,cy-h*0.55,w,h*0.12,4); x.fill();
    x.fillStyle="#d8ecff"; rr(cx-w/2,cy-h-h*0.22,w,h*0.3,6); x.fill(); // open lid
    x.fillStyle="#fff"; x.font="bold "+Math.round(moScale*0.26)+"px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("🧊 MO",cx,cy-h*0.28);
    x.save(); x.globalAlpha=0.4+0.3*Math.sin(anim*0.14); x.strokeStyle="#ffcf5a"; x.lineWidth=3; rr(cx-w/2,cy-h-h*0.22,w,h*0.5,6); x.stroke(); x.restore(); }
  function drawCarSide(cx,cy){ var w=moScale*2.0,h=moScale*0.75;
    x.fillStyle="#c6361f"; rr(cx-w*0.3,cy-h*1.7,w*0.6,h*0.9,8); x.fill();
    x.fillStyle="#bfe3ff"; rr(cx-w*0.25,cy-h*1.6,w*0.5,h*0.66,5); x.fill();
    x.fillStyle="#e8402a"; rr(cx-w/2,cy-h,w,h,10); x.fill();
    x.fillStyle="#1a1a1a"; x.beginPath(); x.arc(cx-w*0.28,cy,h*0.52,0,7); x.arc(cx+w*0.28,cy,h*0.52,0,7); x.fill();
    x.fillStyle="#9aa0a6"; x.beginPath(); x.arc(cx-w*0.28,cy,h*0.22,0,7); x.arc(cx+w*0.28,cy,h*0.22,0,7); x.fill();
    x.fillStyle="#ffcf5a"; x.font="bold "+Math.round(moScale*0.26)+"px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("MO",cx,cy-h*0.5); }
  function drawArff(cx,cy){ var s=moScale*0.55;
    x.fillStyle="#caa06a"; rr(cx-s*0.8,cy-s*0.6,s*1.4,s*0.6,s*0.3); x.fill();
    x.beginPath(); x.arc(cx-s*0.9,cy-s*0.7,s*0.42,0,7); x.fill();

  function toEat(){ mode="eat"; moEatX=W*0.30; mouthX=moEatX; mouthY=floorY-moScale*0.84; eatenCount=0; dragFood=-1; chomp=0;
    var items=["🥣","🍞","🍌","🍎"]; foods=[]; for(var i=0;i<items.length;i++){ var fx=W*0.60+i*W*0.095; foods.push({emoji:items[i], hx:fx, hy:floorY-44, x:fx, y:floorY-44, eaten:false}); } }
  function toWater(){ mode="water"; fill=0; bottleDrag=false; sinkX=W*0.2; sinkY=floorY-150; bottle.x=W*0.72; bottle.y=floorY-moScale*0.7; }
  function toClockWalk(){ mode="clockwalk"; moX=W*0.14; moVX=0; walkPhase=0; atClock=false; clockX=W*0.82; clockCY=H*0.40; joy.dx=0; joy.kx=joy.bx; joy.ky=joy.by; }
  function toBowls(){ mode="bowls"; moX=W*0.12; moVX=0; walkPhase=0; bowlsX=W*0.8; joy.dx=0; joy.kx=joy.bx; joy.ky=joy.by; }
  function toSign(){ mode="sign"; signProg=0; inkPts=[]; penDrag=false; pen.x=W*0.7; pen.y=H*0.32; }
  function toHats(){ mode="hatwalk"; moX=W*0.12; moVX=0; walkPhase=0; hatX=W*0.8; joy.dx=0; joy.kx=joy.bx; joy.ky=joy.by; }
  function toStreet(){ mode="street"; moX=W*0.1; moVX=0; walkPhase=0; streetGoalX=W*0.86; joy.dx=0; joy.kx=joy.bx; joy.ky=joy.by; }
  function toLoad(){ mode="load"; carLoadX=W*0.7; loadDrag=false; loadBag.x=W*0.28; loadBag.y=floorY-moScale*0.7; }
  function toCooler(){ mode="cooler"; snackCount=0; dragSnack=-1; coolerX=W*0.32; coolerY=floorY-4;
    var items=["🍎","🍪","🥨","🧃"]; snacks=[]; for(var i=0;i<items.length;i++){ var ix=W*0.52+i*W*0.1; snacks.push({emoji:items[i], hx:ix, hy:floorY-44, x:ix, y:floorY-44, inCooler:false}); } }
  function toWater5(){ mode="water5"; waterCount=0; dragWater=-1; var hy=H*0.5+moScale*0.3;
    holders=[]; for(var i=0;i<5;i++){ holders.push({x:W*0.2+i*W*0.15, y:hy, filled:false}); }
    waters=[]; for(var j=0;j<5;j++){ var wx=W*0.18+j*W*0.16; waters.push({hx:wx, hy:floorY-30, x:wx, y:floorY-30, inHolder:false}); } }
  function toHours(){ mode="hours"; var ww=document.getElementById("word"); ww.value=""; ww.placeholder="type: 10"; ww.setAttribute("inputmode","numeric"); document.getElementById("typeWrap").classList.add("show"); setTimeout(function(){ try{ww.focus();}catch(e){} },60); }
  function toCharge(){ mode="charge"; dragPlug=-1; document.getElementById("typeWrap").classList.remove("show"); try{document.getElementById("word").blur();}catch(e){}
    outlet.x=W*0.85; outlet.y=H*0.5; camPort.x=W*0.28-moScale*0.65-8; camPort.y=floorY-34-moScale*0.45;
    plugs=[ {kind:"cam", hx:W*0.45,hy:floorY-24, x:W*0.45,y:floorY-24, tx:camPort.x, ty:camPort.y, placed:false},
            {kind:"wall", hx:W*0.62,hy:floorY-24, x:W*0.62,y:floorY-24, tx:outlet.x, ty:outlet.y, placed:false} ]; }
  function toPack(){ mode="pack"; packedCount=0; dragItem=-1; bagX=W*0.33; bagY=floorY-6;
    var kinds=["bottle","🎟️","🧢","🍎"]; bagItems=[]; for(var i=0;i<kinds.length;i++){ var ix=W*0.58+i*W*0.105; bagItems.push({kind:kinds[i], hx:ix, hy:floorY-44, x:ix, y:floorY-44, packed:false}); } }
  function toClockType(){ mode="clocktype"; var ww=document.getElementById("word"); ww.value=""; ww.placeholder="type: 7:00"; ww.setAttribute("inputmode","numeric"); document.getElementById("typeWrap").classList.add("show"); setTimeout(function(){ try{ww.focus();}catch(e){} },60); }
  function win(next){
    if(next==="gday"){ mode="gday"; document.getElementById("typeWrap").classList.remove("show"); try{document.getElementById("word").blur();}catch(e){} }
    else if(next==="tickets"){ mode="tickets"; }
    else if(next==="fed"){ mode="fed"; }
    else if(next==="watered"){ mode="watered"; bottleDrag=false; }
    else if(next==="timed"){ mode="timed"; document.getElementById("typeWrap").classList.remove("show"); try{document.getElementById("word").blur();}catch(e){} }
    else if(next==="packed"){ mode="packed"; dragItem=-1; }
    else if(next==="bowlsdone"){ mode="bowlsdone"; }
    else if(next==="signdone"){ mode="signdone"; penDrag=false; }
    else if(next==="hatdone"){ mode="hatdone"; }
    else if(next==="hoursdone"){ mode="hoursdone"; document.getElementById("typeWrap").classList.remove("show"); try{document.getElementById("word").blur();}catch(e){} }
    else if(next==="charged"){ mode="charged"; dragPlug=-1; }
    else if(next==="atcar"){ mode="atcar"; }
    else if(next==="loaded"){ mode="loaded"; loadDrag=false; }
    else if(next==="coolerdone"){ mode="coolerdone"; dragSnack=-1; }
    else if(next==="water5done"){ mode="water5done"; dragWater=-1; }
    confetti(); ding(); roar();
  }
  function reset(){ mode="start"; onBed=true; dragging=false; gotTickets=false; document.getElementById("ui").style.display="flex"; document.getElementById("typeWrap").classList.remove("show"); document.getElementById("word").value=""; layout(); }

  document.getElementById("start").onclick=startGame;
  var w=document.getElementById("word");
  function norm(s){ return (s||"").toUpperCase().replace(/[^A-Z]/g,""); }
  function normDigits(s){ return (s||"").replace(/\D/g,""); }
  w.addEventListener("input",function(){ beep(600+Math.random()*200,0.03,"square",0.02);
    if(mode==="type"){ if(norm(w.value)==="GAMEDAY") win("gday"); }
    else if(mode==="clocktype"){ if(normDigits(w.value)==="700") win("timed"); }
    else if(mode==="hours"){ if(normDigits(w.value)==="10") win("hoursdone"); } });
  w.addEventListener("keydown",function(e){ if(e.key!=="Enter")return;
    if(mode==="type" && norm(w.value)==="GAMEDAY") win("gday");
    else if(mode==="clocktype" && normDigits(w.value)==="700") win("timed");
    else if(mode==="hours" && normDigits(w.value)==="10") win("hoursdone"); });

  window._M={ get:function(){return {mode:mode,onBed:onBed,moX:Math.round(moX),gotTickets:gotTickets};},
    start:startGame, pull:function(){ if(mode==="bed"){ dragging=false; onBed=false; toType(); } },
    type:function(s){ w.value=s; w.dispatchEvent(new Event("input")); },
    go:function(){ if(mode==="gday") toWalk(); },
    joy:function(d){ if(mode==="walk"||mode==="clockwalk"){ joy.dx=d; } },
    eatGo:function(){ if(mode==="tickets") toEat(); },
    feed:function(){ if(mode==="eat"){ for(var i=0;i<foods.length;i++){foods[i].eaten=true;} eatenCount=foods.length; win("fed"); } },
    waterGo:function(){ if(mode==="fed") toWater(); },
    fillUp:function(){ if(mode==="water"){ bottle.x=sinkX+39; bottle.y=sinkY+60; } },
    clockGo:function(){ if(mode==="watered") toClockWalk(); },
    atClk:function(){ if(mode==="clockwalk"){ atClock=true; toClockType(); } },
    typeTime:function(s){ w.value=s; w.dispatchEvent(new Event("input")); },
    packGo:function(){ if(mode==="timed") toPack(); },
    packAll:function(){ if(mode==="pack"){ for(var i=0;i<bagItems.length;i++){bagItems[i].packed=true;} packedCount=bagItems.length; win("packed"); } },
    bowlsGo:function(){ if(mode==="packed") toBowls(); },
    bowlsReach:function(){ if(mode==="bowls") win("bowlsdone"); },
    signGo:function(){ if(mode==="bowlsdone") toSign(); },
    signFill:function(){ if(mode==="sign"){ signProg=1; win("signdone"); } },
    hatsGo:function(){ if(mode==="signdone") toHats(); },
    hatReach:function(){ if(mode==="hatwalk") mode="hatpick"; },
    pickHat:function(i){ if(mode==="hatpick"){ moHat=i; win("hatdone"); } },
    hoursGo:function(){ if(mode==="hatdone") toHours(); },
    typeHours:function(s){ w.value=s; w.dispatchEvent(new Event("input")); },
    chargeGo:function(){ if(mode==="hoursdone") toCharge(); },
    chargeAll:function(){ if(mode==="charge"){ plugs[0].placed=true; plugs[1].placed=true; win("charged"); } },
    streetGo:function(){ if(mode==="charged") toStreet(); },
    streetReach:function(){ if(mode==="street") win("atcar"); },
    loadGo:function(){ if(mode==="atcar") toLoad(); },
    loadBagIn:function(){ if(mode==="load"){ win("loaded"); } },
    coolerGo:function(){ if(mode==="loaded") toCooler(); },
    coolerAll:function(){ if(mode==="cooler"){ for(var i=0;i<snacks.length;i++)snacks[i].inCooler=true; snackCount=snacks.length; win("coolerdone"); } },
    water5Go:function(){ if(mode==="coolerdone") toWater5(); },
    water5All:function(){ if(mode==="water5"){ for(var i=0;i<5;i++){holders[i].filled=true;waters[i].inHolder=true;} waterCount=5; win("water5done"); } },
    get2:function(){ return {mode:mode, moHat:moHat}; } };
})();
</script>
