<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Dino World</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#7ab86a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(30,50,20,.7);}
  #obox{background:#fff;color:#222;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#3a8a3a;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#3a8a3a;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="over"><div id="obox"><h1>🦖 MO Dino World</h1><div id="omsg">Move the basket to catch eggs!<br>Catch dino eggs 🥚, dodge rocks!</div><button id="go">CATCH</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  var playing=false, score=0, lives=3, best=+(localStorage.getItem('moDinoBest')||0);
  var bx=0, tx=0, drops=[], t=0;
  function reset(){ bx=W/2; tx=W/2; drops=[]; score=0; lives=3; t=0; }
  function ac(){ try{ return ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function loop(){ t++;
    var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#9ad0ff'); g.addColorStop(1,'#bfe6c0'); x.fillStyle=g; x.fillRect(0,0,W,H);
    // volcano hills
    x.fillStyle='#6aa85a'; x.beginPath(); x.moveTo(0,H*0.7); x.quadraticCurveTo(W*0.3,H*0.5,W*0.6,H*0.7); x.quadraticCurveTo(W*0.8,H*0.55,W,H*0.7); x.lineTo(W,H); x.lineTo(0,H); x.fill();
    x.fillStyle='#8a5a3a'; x.beginPath(); x.moveTo(W*0.7,H*0.55); x.lineTo(W*0.82,H*0.28); x.lineTo(W*0.94,H*0.55); x.fill(); x.fillStyle='#e2342f'; x.beginPath(); x.moveTo(W*0.79,H*0.3); x.lineTo(W*0.82,H*0.24); x.lineTo(W*0.85,H*0.3); x.fill();
    var by=H*0.82;
    if(playing){ bx+=(tx-bx)*0.3;
      if(t%Math.max(24,60-Math.floor(score/40))===0){ var rock=Math.random()<0.28; drops.push({x:40+Math.random()*(W-80),y:-30,v:3+Math.random()*3+score*0.01,rock:rock}); } }
    for(var i=drops.length-1;i>=0;i--){ var d=drops[i]; d.y+=d.v;
      if(d.rock){ x.fillStyle='#6a6a72'; x.beginPath(); x.arc(d.x,d.y,15,0,7); x.fill(); x.fillStyle='#54545c'; x.beginPath(); x.arc(d.x-4,d.y-4,5,0,7); x.fill(); }
      else { x.save(); x.translate(d.x,d.y); x.fillStyle='#f2e0c0'; x.beginPath(); x.ellipse(0,0,13,17,0,0,7); x.fill(); x.fillStyle='#c8a86a'; x.beginPath(); x.arc(-4,-3,3,0,7); x.arc(5,4,3,0,7); x.fill(); x.restore(); }
      if(d.y>by-14 && d.y<by+20 && Math.abs(d.x-bx)<48){ if(d.rock){ lives--; beep(180); if(lives<=0){ playing=false; over(); } } else { score+=5; beep(1000); } drops.splice(i,1); continue; }
      if(d.y>H+30){ drops.splice(i,1); } }
    // basket
    x.save(); x.translate(bx,by); x.fillStyle='#8a5a2a'; x.beginPath(); x.moveTo(-46,-14); x.lineTo(46,-14); x.lineTo(38,20); x.lineTo(-38,20); x.closePath(); x.fill(); x.strokeStyle='#6a4020'; x.lineWidth=3; for(var w=-3;w<=3;w++){ x.beginPath(); x.moveTo(w*13,-14); x.lineTo(w*11,20); x.stroke(); } x.strokeStyle='#6a4020'; x.beginPath(); x.moveTo(-42,-2); x.lineTo(42,-2); x.stroke();
    x.fillStyle='#e2342f'; x.font='900 12px Trebuchet MS'; x.textAlign='center'; x.fillText('MO',0,10); x.restore();
    x.fillStyle='#3a5a2a'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='left'; x.fillText('🥚 '+score, 14, 40);
    x.textAlign='center'; x.fillText('❤️'.repeat(Math.max(0,lives)), W/2, 40);
    x.textAlign='right'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('Best '+best, W-14, 36);
    requestAnimationFrame(loop);
  }
  function over(){ beep(160,0.3); if(score>best){ best=score; try{localStorage.setItem('moDinoBest',score);}catch(e){} }
    document.getElementById('omsg').innerHTML='You caught <b>'+score+'</b>!<br>Best: '+best; document.getElementById('go').textContent='CATCH AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  var down=false; function setX(cx){ tx=Math.max(46,Math.min(W-46,cx)); }
  cv.addEventListener('pointerdown',function(e){ down=true; setX(e.clientX); }); cv.addEventListener('pointermove',function(e){ if(down)setX(e.clientX); }); addEventListener('pointerup',function(){ down=false; });
  document.getElementById('over').style.display='flex'; loop();
})();
</script>
</body></html>
