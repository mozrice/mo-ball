<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Arff Racer</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#2a2a3a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;opacity:.9;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;text-shadow:0 1px 3px #000;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:18px;font-weight:bold;color:#fff;pointer-events:none;text-shadow:0 1px 4px #000;}
  #sub{position:fixed;top:34px;left:0;right:0;text-align:center;font-size:14px;font-weight:bold;color:#ffe08a;pointer-events:none;text-shadow:0 1px 3px #000;}
  #start,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:8;text-align:center;padding:20px;}
  #start{background:linear-gradient(#5a7a4a,#7ab04a);}
  #start h1{font-size:26px;margin:0 0 6px;text-shadow:0 2px 4px #0007;} #start p{font-size:15px;margin:4px;max-width:330px;}
  #start .big{font-size:60px;}
  #over{background:#000a;display:none;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;text-shadow:0 2px 0 #b47a1a;} #over p{font-size:17px;margin:3px;}
  #start button,#over button{margin-top:16px;background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
  #start button:active,#over button:active{transform:translateY(3px);box-shadow:0 2px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="hud">🦴 <span id="sc">0</span>/<span id="goal">20</span> &nbsp; 🏆 <span id="hi">0</span></div>
<div id="sub">DRAG left & right to steer Arff!</div>
<canvas id="c"></canvas>
<div id="start"><div class="big">🐕🛵</div><h1>MO Arff Racer</h1><p>DRAG your finger left and right to steer Arff down the road! Grab the bones 🦴 and gold ⭐, but dodge the cones and rocks! Get 20 to be MVP!</p><button id="go">▶ GO</button></div>
<div id="over"><h1 id="ot">🎉 WIN!</h1><p id="om"></p><button id="rs">▶ Race Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var GOAL=20, HK='moArffRacerHi';
  function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var GOOD=['🦴','🦴','🍖','🐾'], GOLD='⭐', BAD=['🚧','🪨','🛢️','🌵'];
  var arff, items, score, running, spawnT, tt, scroll, best, bonk, pops;
  best=getHi(); document.getElementById('hi').textContent=best; document.getElementById('goal').textContent=GOAL;
  function roadX(){ return {left:W*0.16, right:W*0.84}; }
  function reset(){ arff={x:W*0.5,tx:W*0.5,y:H*0.8}; items=[]; score=0; running=true; spawnT=20; tt=0; scroll=0; bonk=0; pops=[];
    document.getElementById('sc').textContent=0; document.getElementById('over').style.display='none'; document.getElementById('start').style.display='none'; document.getElementById('sub').textContent='👉 DRAG to steer Arff!'; }
  function steer(e){ if(!running)return; var t0=e.changedTouches?e.changedTouches[0]:(e.touches?e.touches[0]:e); var r=cv.getBoundingClientRect(); var x=t0.clientX-r.left; var rd=roadX(); arff.tx=Math.max(rd.left,Math.min(rd.right,x)); }
  cv.addEventListener('touchstart',function(e){ steer(e); e.preventDefault(); },{passive:false});
  cv.addEventListener('touchmove',function(e){ steer(e); e.preventDefault(); },{passive:false});
  cv.addEventListener('mousedown',function(e){ dragging=true; steer(e); });
  cv.addEventListener('mousemove',function(e){ if(dragging)steer(e); });
  window.addEventListener('mouseup',function(){ dragging=false; });
  var dragging=false;
  function pop(x,y,txt,col){ pops.push({x:x,y:y,txt:txt,col:col,life:28}); }
  function spawn(){ var rd=roadX(); var x=rd.left+Math.random()*(rd.right-rd.left); var r=Math.random(); var kind,e;
    if(r<0.12){kind='gold';e=GOLD;} else if(r<0.5){kind='bad';e=BAD[Math.floor(Math.random()*BAD.length)];} else {kind='good';e=GOOD[Math.floor(Math.random()*GOOD.length)];}
    items.push({x:x,y:-30,e:e,kind:kind}); }
  function win(){ running=false; document.getElementById('ot').innerHTML='🎉 ARFF WINS! 🎉'; document.getElementById('om').textContent='You raced to '+score+'! Best: '+best; document.getElementById('over').style.display='flex'; if(window.MO_MVP)window.MO_MVP(); }
  function draw(){ tt+=0.05; scroll+=6+score*0.15;
    // grass sides
    ctx.fillStyle='#5aa03a'; ctx.fillRect(0,0,W,H);
    // road
    var rd=roadX(); ctx.fillStyle='#454550'; ctx.fillRect(rd.left-10,0,(rd.right-rd.left)+20,H);
    ctx.fillStyle='#3a3a44'; ctx.fillRect(rd.left-10,0,6,H); ctx.fillRect(rd.right+4,0,6,H);
    // dashes
    ctx.fillStyle='#ffd23f'; for(var dy=(scroll%70)-70; dy<H; dy+=70){ ctx.fillRect(W*0.5-3,dy,6,36); }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(running){
      arff.x+=(arff.tx-arff.x)*0.2;
      spawnT--; if(spawnT<=0){ spawn(); spawnT=Math.max(16,34-score*0.6); }
      for(var i=items.length-1;i>=0;i--){ var it=items[i]; it.y+=(6+score*0.15);
        if(Math.abs(it.x-arff.x)<34 && Math.abs(it.y-arff.y)<34){
          if(it.kind==='bad'){ bonk=12; beep(150,0.14,'sawtooth'); if(score>0){score--;document.getElementById('sc').textContent=score;} pop(it.x,it.y,'-1','#ff7a7a'); items.splice(i,1); continue; }
          else { var pts=it.kind==='gold'?3:1; score+=pts; document.getElementById('sc').textContent=score; beep(it.kind==='gold'?980:680,0.06); pop(it.x,it.y,'+'+pts,it.kind==='gold'?'#ffd23f':'#8fffa8'); if(score>best){best=score;setHi(best);document.getElementById('hi').textContent=best;} if(score>=GOAL){win();} items.splice(i,1); continue; }
        }
        if(it.y>H+40)items.splice(i,1);
      }
    }
    for(var j=0;j<items.length;j++){ ctx.font='34px sans-serif'; ctx.fillText(items[j].e,items[j].x,items[j].y); }
    // Arff
    ctx.save(); ctx.translate(arff.x+(bonk>0?(Math.random()-0.5)*8:0),arff.y); var tilt=(arff.tx-arff.x)*0.01; ctx.rotate(tilt); ctx.font='46px sans-serif'; ctx.fillText('🐕',0,0); ctx.font='22px sans-serif'; ctx.fillText('🛵',0,20); ctx.restore(); if(bonk>0)bonk--;
    for(var p=pops.length-1;p>=0;p--){ var pp=pops[p]; pp.y-=1.4; pp.life--; if(pp.life<=0){pops.splice(p,1);continue;} ctx.globalAlpha=Math.min(1,pp.life/18); ctx.fillStyle=pp.col; ctx.font='bold 18px Trebuchet MS'; ctx.fillText(pp.txt,pp.x,pp.y); ctx.globalAlpha=1; }
    requestAnimationFrame(draw); }
  var ac; function beep(f,d,ty){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gn=ac.createGain(); o.frequency.value=f; o.type=ty||'square'; o.connect(gn); gn.connect(ac.destination); gn.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('go').onclick=function(){ reset(); };
  document.getElementById('rs').onclick=function(){ reset(); };
  arff={x:W*0.5,tx:W*0.5,y:H*0.8}; items=[]; score=0; running=false; spawnT=20; tt=0; scroll=0; bonk=0; pops=[];
  requestAnimationFrame(draw);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
