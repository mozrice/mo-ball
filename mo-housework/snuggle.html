<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MO'S HOUSE WORK — Living Room</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#ffe9c9;font-family:'Trebuchet MS',system-ui,sans-serif;color:#5a3a1a;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000044;padding:6px 10px;border-radius:10px;}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10;background:#3a2410cc;}
  .overlay.hide{display:none;}
  .card{background:#fff6e8ee;border:4px solid #e0b06a;border-radius:22px;padding:22px 26px;max-width:92%;box-shadow:0 20px 60px #0007;}
  .card h1{margin:0 0 8px;font-size:25px;color:#a8641e;}
  .card p{margin:8px 0;line-height:1.35;font-size:16px;}
  .big{margin-top:14px;padding:14px 30px;font-size:22px;font-weight:900;background:linear-gradient(#ffd98a,#f0a829);color:#5a3d00;border:none;border-radius:14px;box-shadow:0 5px 0 #b8792a;cursor:pointer;}
  .big:active{transform:translateY(4px);box-shadow:0 1px 0 #b8792a;}
  .swrow{display:flex;gap:9px;justify-content:center;margin:5px 0;}
  .sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 5px #0003;}
  .sw.on{border-color:#a8641e;transform:scale(1.14);}
</style>
</head>
<body>
<a class="back" href="mo-housework.html">&#11013; Menu</a>
<canvas id="c"></canvas>

<div class="overlay" id="startOv">
  <div class="card">
    <h1>🐶 SNUGGLE WITH ARFF</h1>
    <p style="color:#a8641e;font-weight:800;margin-top:0">MO'S HOUSE WORK — Living Room</p>
    <p>1) <b>Walk Mo to the couch</b> with the joystick.<br>2) Arff comes to snuggle.<br>3) <b>Drag the blanket</b> over you both.<br>4) <b>Pet Arff</b> until she's cozy!</p>
    <p style="font-weight:800;margin-bottom:0;color:#a8641e">🎨 MO LOOK — pick skin &amp; hair</p>
    <div class="swrow" id="skinPick"></div>
    <div class="swrow" id="hairPick"></div>
    <button class="big" id="startBtn">▶ START</button>
  </div>
</div>

<div class="overlay hide" id="doneOv">
  <div class="card">
    <h1>😊 ALL COZY &amp; WARM!</h1>
    <p id="doneP"></p>
    <button class="big" id="againBtn">🐶 AGAIN</button>
  </div>
</div>

<script>
"use strict";
(function(){
  var cv=document.getElementById("c"), x=cv.getContext("2d");
  var W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+"px"; cv.style.height=H+"px"; x.setTransform(DPR,0,0,DPR,0,0); placeJoy(); }
  addEventListener("resize",resize);

  var AC=null; function ac(){ if(!AC){ try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
  function beep(f,d,t,v){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.type=t||"sine"; o.frequency.value=f; g.gain.value=v||0.07; o.connect(g); g.connect(a.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1)); o.stop(a.currentTime+(d||0.1)+0.02); }
  function sitSfx(){ beep(400,0.08,"triangle",0.07); }
  function barkSfx(){ beep(700,0.07,"square",0.07); setTimeout(function(){beep(1000,0.09,"square",0.07);},70); }
  function petSfx(){ beep(620+Math.random()*120,0.05,"sine",0.05); }
  function doneSfx(){ [523,659,784,1046,784,1046,1319].forEach(function(f,i){ setTimeout(function(){beep(f,0.16,"sine",0.08);}, i*150); }); }

  var SKINS=["#f6c48a","#eab98c","#d99a6c","#b97a4e","#8a5a34","#5e3a1e"];
  var HAIRS=["#2a2018","#4a2a10","#6a4a1a","#101010","#8a5a2a","#caa23a"];
  var moSkin, moHair;
  try{ moSkin=localStorage.getItem("moSkin")||SKINS[0]; moHair=localStorage.getItem("moHair")||HAIRS[0]; }catch(e){ moSkin=SKINS[0]; moHair=HAIRS[0]; }
  function saveLook(){ try{ localStorage.setItem("moSkin",moSkin); localStorage.setItem("moHair",moHair); }catch(e){} }

  function floorY(){ return H*0.80; }
  function couchX(){ return W*0.56; }

  var mode="start";   // start | walk | call | blanket | pet | done
  var mo, arff, joy, blanket, cozy, hearts, callT, lastPt;

  function reset(){
    mo={x:W*0.2, dir:1, vx:0, ph:0, sit:false};
    arff={x:W*0.92, dir:-1, ph:0, sit:false};
    blanket={x:couchX()-110, y:floorY()-96, held:false, placed:false};
    cozy=0; hearts=[]; callT=0; lastPt=null;
    placeJoy(); joy.active=false;
  }

  var joy={active:false,cx:0,cy:0,R:64,kx:0,ky:0};
  function placeJoy(){ joy.R=Math.max(54,Math.min(78,Math.min(W,H)*0.13)); joy.cx=joy.R+26; joy.cy=H-joy.R-26; joy.kx=joy.cx; joy.ky=joy.cy; }
  function pt(e){ var t=e.touches&&e.touches[0]?e.touches[0]:e; var r=cv.getBoundingClientRect(); return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)}; }
  function setKnob(px,py){ var dx=px-joy.cx, dy=py-joy.cy, m=Math.hypot(dx,dy)||1, cl=Math.min(m,joy.R); joy.kx=joy.cx+dx/m*cl; joy.ky=joy.cy+dy/m*cl; }

  function down(e){ ac(); var p=pt(e);
    if(mode==="walk"){ if(Math.hypot(p.x-joy.cx,p.y-joy.cy)<joy.R*2.2 || p.y>H*0.6){ if(e.cancelable)e.preventDefault(); joy.active=true; setKnob(p.x,p.y); } return; }
    if(mode==="blanket"){ if(Math.hypot(p.x-blanket.x,p.y-blanket.y)<60){ if(e.cancelable)e.preventDefault(); blanket.held=true; blanket.x=p.x; blanket.y=p.y; } return; }
    if(mode==="pet"){ if(e.cancelable)e.preventDefault(); lastPt=p; } }
  function move(e){ var p=pt(e);
    if(mode==="walk"){ if(joy.active){ if(e.cancelable)e.preventDefault(); setKnob(p.x,p.y); } return; }
    if(mode==="blanket"){ if(blanket.held){ if(e.cancelable)e.preventDefault(); blanket.x=p.x; blanket.y=p.y; } return; }
    if(mode==="pet"){ if(lastPt){ if(e.cancelable)e.preventDefault(); var ax=couchX()+28, ay=floorY()-58;
      if(Math.hypot(p.x-ax,p.y-ay)<70){ var d=Math.hypot(p.x-lastPt.x,p.y-lastPt.y); cozy=Math.min(100,cozy+Math.min(6,d*0.25)); if(d>3 && Math.random()<0.3){ hearts.push({x:ax+(Math.random()*30-15),y:ay-10,vy:-Math.random()-0.6,life:50}); petSfx(); } if(cozy>=100) finish(); }
      lastPt=p; } return; } }
  function up(){ joy.active=false; joy.kx=joy.cx; joy.ky=joy.cy; lastPt=null;
    if(mode==="blanket" && blanket.held){ blanket.held=false;
      if(Math.abs(blanket.x-couchX())<120 && blanket.y>floorY()-150){ blanket.placed=true; blanket.x=couchX(); blanket.y=floorY()-46; sitSfx(); mode="pet"; }
      else { blanket.x=couchX()-110; blanket.y=floorY()-96; } } }
  cv.addEventListener("mousedown",down); addEventListener("mousemove",move); addEventListener("mouseup",up);
  cv.addEventListener("touchstart",down,{passive:false}); addEventListener("touchmove",move,{passive:false}); addEventListener("touchend",up); addEventListener("touchcancel",up);

  (function buildLook(){
    var sp=document.getElementById("skinPick"), hp=document.getElementById("hairPick");
    SKINS.forEach(function(c){ var d=document.createElement("div"); d.className="sw"+(c===moSkin?" on":""); d.style.background=c;
      d.onclick=function(){ moSkin=c; saveLook(); ac(); Array.prototype.forEach.call(sp.children,function(e){e.classList.remove("on");}); d.classList.add("on"); }; sp.appendChild(d); });
    HAIRS.forEach(function(c){ var d=document.createElement("div"); d.className="sw"+(c===moHair?" on":""); d.style.background=c;
      d.onclick=function(){ moHair=c; saveLook(); ac(); Array.prototype.forEach.call(hp.children,function(e){e.classList.remove("on");}); d.classList.add("on"); }; hp.appendChild(d); });
  })();
  document.getElementById("startBtn").onclick=function(){ ac(); resize(); reset(); mode="walk"; document.getElementById("startOv").classList.add("hide"); };
  document.getElementById("againBtn").onclick=function(){ ac(); resize(); reset(); mode="walk"; document.getElementById("doneOv").classList.add("hide"); };

  function finish(){ mode="done"; doneSfx(); for(var i=0;i<20;i++) hearts.push({x:couchX()+(Math.random()*80-40),y:floorY()-60,vy:-Math.random()*1.5-0.5,life:70});
    setTimeout(function(){ if(mode!=="done")return; document.getElementById("doneP").innerHTML="Mo and Arff are snuggled under the warm blanket.<br>Arff is so happy and cozy! 🐶"; document.getElementById("doneOv").classList.remove("hide"); }, 1200); }

  var last=0;
  function frame(ts){ var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts; if(mode!=="start") update(dt); render(); requestAnimationFrame(frame); }
  function update(dt){
    for(var h=hearts.length-1;h>=0;h--){ hearts[h].y+=hearts[h].vy*dt; hearts[h].life-=dt; if(hearts[h].life<=0) hearts.splice(h,1); }
    if(mode==="walk"){
      var off=(joy.kx-joy.cx)/joy.R;
      if(joy.active && Math.abs(off)>0.12){ mo.dir=off>0?1:-1; mo.vx=off*3.6; } else { mo.vx*=Math.pow(0.6,dt); }
      mo.x+=mo.vx*dt; if(mo.x<W*0.06){mo.x=W*0.06;mo.vx=0;} if(mo.x>W*0.92){mo.x=W*0.92;mo.vx=0;}
      mo.ph+=Math.abs(mo.vx)*0.07*dt;
      if(Math.abs(mo.x-(couchX()-34))<30){ mo.sit=true; mo.x=couchX()-34; mo.vx=0; sitSfx(); mode="call"; callT=20; }
    } else if(mode==="call"){
      // Arff trots over to snuggle
      var tgt=couchX()+40; var d=tgt-arff.x; arff.dir=d>=0?1:-1; if(Math.abs(d)>2){ arff.x+=Math.max(-3,Math.min(3,d*0.08))*dt; arff.ph+=0.2*dt; }
      else { arff.sit=true; arff.x=tgt; if(callT>0){ callT-=dt; if(callT<=0){ barkSfx(); mode="blanket"; } } }
    }
  }

  // ---- render ----
  function rr(a,b,c,d,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+c,b,a+c,b+d,r); x.arcTo(a+c,b+d,a,b+d,r); x.arcTo(a,b+d,a,b,r); x.arcTo(a,b,a+c,b,r); x.closePath(); }
  function render(){
    var fy=floorY();
    var wall=x.createLinearGradient(0,0,0,fy); wall.addColorStop(0,"#ffe9c9"); wall.addColorStop(1,"#f7d9ad"); x.fillStyle=wall; x.fillRect(0,0,W,fy);
    x.fillStyle="#caa06a"; x.fillRect(0,fy,W,H-fy); x.fillStyle="#b98f58"; x.fillRect(0,fy,W,5);
    // window + lamp + rug
    x.fillStyle="#bfe3f0"; rr(W*0.08,H*0.14,W*0.2,H*0.2,8); x.fill(); x.strokeStyle="#fff"; x.lineWidth=4; rr(W*0.08,H*0.14,W*0.2,H*0.2,8); x.stroke();
    x.fillStyle="#e8c06a"; x.beginPath(); x.ellipse(couchX(),fy-6,W*0.3,14,0,0,7); x.fill(); // rug
    // couch
    var cxp=couchX();
    x.fillStyle="#9a6ac0"; rr(cxp-96,fy-80,196,74,16); x.fill(); x.fillStyle="#8457ad"; rr(cxp-96,fy-80,196,26,16); x.fill();
    x.fillStyle="#a97fd0"; rr(cxp-104,fy-56,22,56,10); x.fill(); rr(cxp+84,fy-56,22,56,10); x.fill();

    var k=Math.min(W,H)/320;
    if(blanket.placed){
      // snuggled together under a cozy blanket — heads peek over the top
      drawSnugUnder(cxp, fy, k);
    } else {
      if(mo.sit){ drawSeated(cxp-24, fy, k, {body:"#1a6fd0",hair:moHair,label:"MO"}); }
      else { drawGuy(mo.x, fy, {k:k, body:"#1a6fd0", pants:"#243a66", skin:moSkin, hair:moHair, label:"MO", dir:mo.dir, walk:Math.abs(mo.vx)>0.3, ph:mo.ph}); }
      drawArffFluffy(arff.x, fy, k*0.9);
      if(mode==="blanket") drawBlanket(blanket.x,blanket.y);
    }

    // hearts
    for(var i=0;i<hearts.length;i++){ x.globalAlpha=Math.max(0,hearts[i].life/60); drawHeart(hearts[i].x,hearts[i].y,1.1); } x.globalAlpha=1;

    // prompts + cozy meter
    x.textAlign="center"; x.textBaseline="middle";
    if(mode==="walk"){ x.fillStyle="#a8641e"; x.font="bold 18px Trebuchet MS"; x.fillText("Walk Mo to the couch!", W/2, H*0.12); }
    else if(mode==="call"){ x.fillStyle="#a8641e"; x.font="bold 18px Trebuchet MS"; x.fillText("Here comes Arff!", W/2, H*0.12); }
    else if(mode==="blanket"){ x.fillStyle="#a8641e"; x.font="bold 18px Trebuchet MS"; x.fillText("Drag the blanket over Mo & Arff!", W/2, H*0.12); }
    else if(mode==="pet"){ x.fillStyle="#a8641e"; x.font="bold 18px Trebuchet MS"; x.fillText("Pet Arff to make her cozy!", W/2, H*0.12);
      var bw=Math.min(W*0.6,240), bx=W/2-bw/2, by=H*0.17; x.fillStyle="rgba(90,58,26,0.25)"; rr(bx,by,bw,16,8); x.fill();
      x.fillStyle="#e05a8a"; rr(bx,by,bw*cozy/100,16,8); x.fill(); x.fillStyle="#7a4a10"; x.font="bold 12px Trebuchet MS"; x.fillText("Cozy", W/2, by+8); }

    // joystick (walk only)
    if(mode==="walk"){
      x.globalAlpha=joy.active?0.95:0.7;
      x.beginPath(); x.arc(joy.cx,joy.cy,joy.R,0,7); x.fillStyle="rgba(90,58,26,0.28)"; x.fill(); x.lineWidth=5; x.strokeStyle="rgba(255,255,255,0.55)"; x.stroke();
      x.fillStyle="rgba(255,255,255,0.6)"; x.font="bold "+Math.round(joy.R*0.42)+"px Arial"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("‹",joy.cx-joy.R*0.66,joy.cy); x.fillText("›",joy.cx+joy.R*0.66,joy.cy);
      x.beginPath(); x.arc(joy.kx,joy.ky,joy.R*0.52,0,7); var kg=x.createRadialGradient(joy.kx-6,joy.ky-6,4,joy.kx,joy.ky,joy.R*0.52); kg.addColorStop(0,"#ffe8b0"); kg.addColorStop(1,"#e8a23a"); x.fillStyle=kg; x.fill(); x.lineWidth=4; x.strokeStyle="#9a6a1e"; x.stroke();
      x.globalAlpha=1;
    }
  }
  function drawBlanket(px,py){ x.save(); x.translate(px,py); x.fillStyle="#e05a8a"; rr(-44,-30,88,60,12); x.fill(); x.fillStyle="#c23f6f"; rr(-44,-30,88,14,12); x.fill();
    x.strokeStyle="#fff"; x.lineWidth=2; for(var i=-30;i<=30;i+=15){ x.beginPath(); x.moveTo(-40,i); x.lineTo(40,i); x.stroke(); }
    x.fillStyle="#fff"; x.font="bold 11px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("blanket",0,-38); x.restore(); }

  function drawSeated(px,py,k,o){
    x.save();
    // bent legs forward on the seat
    x.strokeStyle="#243a66"; x.lineWidth=6*k; x.lineCap="round";
    x.beginPath(); x.moveTo(px-5*k,py-16*k); x.lineTo(px-10*k,py-2*k); x.stroke();
    x.beginPath(); x.moveTo(px+5*k,py-16*k); x.lineTo(px+10*k,py-2*k); x.stroke();
    var bodyW=22*k, bodyH=22*k, headR=10.5*k, bodyBot=py-14*k, bodyTop=bodyBot-bodyH, hy=bodyTop-headR+5*k;
    x.fillStyle=o.body; rr(px-bodyW/2,bodyTop,bodyW,bodyH,7*k); x.fill();
    if(o.label){ x.fillStyle="#fff"; x.font="bold "+Math.round(9*k)+"px Trebuchet MS"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(o.label,px,(bodyTop+bodyBot)/2); }
    x.fillStyle=moSkin; x.beginPath(); x.arc(px,hy,headR,0,7); x.fill();
    x.fillStyle=o.hair; x.beginPath(); x.arc(px,hy-2*k,headR,Math.PI,2*Math.PI); x.fill();
    x.fillStyle="#fff"; x.beginPath(); x.arc(px-headR*0.34,hy+1*k,1.9*k,0,7); x.arc(px+headR*0.34,hy+1*k,1.9*k,0,7); x.fill();
    x.fillStyle="#201008"; x.beginPath(); x.arc(px-headR*0.34,hy+1*k,1*k,0,7); x.arc(px+headR*0.34,hy+1*k,1*k,0,7); x.fill();
    x.strokeStyle="#b06a44"; x.lineWidth=1.7*k; x.beginPath(); x.arc(px,hy+3.5*k,headR*0.42,0.15*Math.PI,0.85*Math.PI); x.stroke();
    x.restore();
  }
  function drawHeart(px,py,s){ x.save(); x.translate(px,py); x.scale(s,s); x.fillStyle="#ff6a9a"; x.beginPath(); x.moveTo(0,3); x.bezierCurveTo(-6,-4,-9,2,0,9); x.bezierCurveTo(9,2,6,-4,0,3); x.closePath(); x.fill(); x.restore(); }
  function drawMoHead(px,cy,k){ var headR=11*k;
    x.fillStyle=moSkin; x.beginPath(); x.arc(px,cy,headR,0,7); x.fill();
    x.fillStyle=moHair; x.beginPath(); x.arc(px,cy-2*k,headR,Math.PI,2*Math.PI); x.fill();
    var ex=headR*0.34; x.fillStyle="#fff"; x.beginPath(); x.arc(px-ex,cy+1*k,2*k,0,7); x.arc(px+ex,cy+1*k,2*k,0,7); x.fill();
    x.fillStyle="#201008"; x.beginPath(); x.arc(px-ex,cy+1*k,1*k,0,7); x.arc(px+ex,cy+1*k,1*k,0,7); x.fill();
    x.strokeStyle="#b06a44"; x.lineWidth=1.7*k; x.beginPath(); x.arc(px,cy+3.5*k,headR*0.42,0.15*Math.PI,0.85*Math.PI); x.stroke(); }
  function drawArffHead(px,cy,sc){ x.save(); x.translate(px,cy); x.scale(sc,sc);
    x.fillStyle="#f4f2ec"; x.beginPath(); x.ellipse(-8,2,5,8,-0.3,0,7); x.fill(); x.beginPath(); x.ellipse(8,2,5,8,0.3,0,7); x.fill();
    x.fillStyle="#fff"; x.beginPath(); x.arc(0,0,10,0,7); x.fill();
    x.beginPath(); x.arc(-4,-7,3.5,0,7); x.arc(4,-7,3.5,0,7); x.fill();
    x.fillStyle="#2a2018"; x.beginPath(); x.arc(-3.5,-1,1.6,0,7); x.arc(3.5,-1,1.6,0,7); x.fill();
    x.fillStyle="#fff"; x.beginPath(); x.arc(-3,-1.5,0.5,0,7); x.arc(4,-1.5,0.5,0,7); x.fill();
    x.fillStyle="#3a2a2a"; x.beginPath(); x.arc(0,3,2,0,7); x.fill();
    if(Math.sin(last/260)>0){ x.fillStyle="#ff8fae"; x.beginPath(); x.ellipse(0,6.5,2,3.5,0,0,7); x.fill(); }
    x.restore(); }
  function drawSnugUnder(cxp,fy,k){
    // cozy blanket mound over the couch seat, dipping low between the two heads
    x.fillStyle="#e05a8a"; x.beginPath();
    x.moveTo(cxp-82,fy-6); x.lineTo(cxp-82,fy-40);
    x.quadraticCurveTo(cxp-82,fy-56,cxp-56,fy-56);
    x.quadraticCurveTo(cxp,fy-64,cxp+56,fy-56);
    x.quadraticCurveTo(cxp+82,fy-56,cxp+82,fy-40);
    x.lineTo(cxp+82,fy-6); x.closePath(); x.fill();
    x.strokeStyle="#c23f6f"; x.lineWidth=3; x.beginPath(); x.moveTo(cxp-78,fy-48); x.quadraticCurveTo(cxp,fy-58,cxp+78,fy-48); x.stroke();
    // Mo head peeking (left) + little hands holding the blanket
    drawMoHead(cxp-26, fy-62, k);
    x.fillStyle=moSkin; x.beginPath(); x.arc(cxp-36,fy-46,3*k,0,7); x.arc(cxp-16,fy-46,3*k,0,7); x.fill();
    // Arff head peeking (right), snuggled close
    drawArffHead(cxp+28, fy-58, k*0.95);
  }

  function drawGuy(px,feetY,o){
    var k=o.k||1.3, bob=o.walk?Math.abs(Math.sin(o.ph))*4*k:0, dir=o.dir||1, sw=o.walk?Math.sin(o.ph)*5*k:0;
    var legLen=12*k, bodyH=24*k, bodyW=22*k, headR=10.5*k;
    var bodyBot=feetY-bob-legLen, bodyTop=bodyBot-bodyH, hy=bodyTop-headR+5*k;
    x.save();
    x.globalAlpha=0.18; x.fillStyle="#000"; x.beginPath(); x.ellipse(px,feetY,bodyW*0.6,5,0,0,7); x.fill(); x.globalAlpha=1;
    x.strokeStyle=o.pants||"#2a3f66"; x.lineWidth=6*k; x.lineCap="round";
    x.beginPath(); x.moveTo(px-5*k,bodyBot-2); x.lineTo(px-5*k+sw,feetY-bob); x.stroke();
    x.beginPath(); x.moveTo(px+5*k,bodyBot-2); x.lineTo(px+5*k-sw,feetY-bob); x.stroke();

    x.restore();
  }
