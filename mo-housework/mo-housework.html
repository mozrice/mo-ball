<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MO'S HOUSE WORK</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#ffe3bf,#f6c9a0 60%,#e9b98a);font-family:'Trebuchet MS',system-ui,sans-serif;color:#5a3a1a;}
  body{display:flex;flex-direction:column;align-items:center;padding:16px 16px 40px;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000044;padding:6px 10px;border-radius:10px;}
  h1{font-size:30px;margin:38px 0 2px;color:#a8641e;text-align:center;}
  .sub{color:#7a4a10;font-weight:bold;margin:0 0 10px;text-align:center;}
  .look{background:#fff6e8cc;border:3px solid #e0b06a;border-radius:16px;padding:10px 14px;margin:8px 0 14px;text-align:center;max-width:420px;width:100%;}
  .look b{color:#a8641e;}
  .swrow{display:flex;gap:9px;justify-content:center;margin:6px 0;flex-wrap:wrap;}
  .sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 5px #0003;}
  .sw.on{border-color:#a8641e;transform:scale(1.14);}
  .rooms{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:440px;}
  a.room{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#5a3a1a;
    background:linear-gradient(#fff7ec,#ffe3bf);border:3px solid #e0b06a;border-radius:20px;padding:20px 10px;box-shadow:0 6px 14px #0002;min-height:120px;}
  a.room:active{transform:translateY(3px);}
  a.room .emo{font-size:42px;}
  a.room .nm{font-weight:900;font-size:17px;}
  a.room .ds{font-size:12px;color:#8a6a40;text-align:center;}
  a.room.soon{opacity:.6;filter:grayscale(.3);}
  .foot{margin-top:18px;color:#8a6a40;font-size:13px;text-align:center;}
</style>
</head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<h1>🏠 MO'S HOUSE WORK</h1>
<p class="sub">Help Mo around the house with the family &amp; Arff!</p>

<div class="look">
  <b>🎨 MO LOOK — pick skin &amp; hair</b>
  <div class="swrow" id="skinPick"></div>
  <div class="swrow" id="hairPick"></div>
</div>

<div class="rooms">
  <a class="room" href="cinema.html"><span class="emo">🎬</span><span class="nm">Cinema</span><span class="ds">Movie night + pillows + hoops</span></a>
  <a class="room" href="charades.html"><span class="emo">🎭</span><span class="nm">Mo's Room</span><span class="ds">Charades — act &amp; guess</span></a>
  <a class="room" href="snuggle.html"><span class="emo">🐶</span><span class="nm">Living Room</span><span class="ds">Snuggle with Arff</span></a>
  <a class="room soon" href="#"><span class="emo">➕</span><span class="nm">More soon</span><span class="ds">New rooms coming!</span></a>
</div>

<p class="foot">Pick a room to play 🐾</p>

<script>
(function(){
  var SKINS=["#f6c48a","#eab98c","#d99a6c","#b97a4e","#8a5a34","#5e3a1e"];
  var HAIRS=["#2a2018","#4a2a10","#6a4a1a","#101010","#8a5a2a","#caa23a"];
  var moSkin, moHair;
  try{ moSkin=localStorage.getItem("moSkin")||SKINS[0]; moHair=localStorage.getItem("moHair")||HAIRS[0]; }catch(e){ moSkin=SKINS[0]; moHair=HAIRS[0]; }
  function save(){ try{ localStorage.setItem("moSkin",moSkin); localStorage.setItem("moHair",moHair); }catch(e){} }
  var sp=document.getElementById("skinPick"), hp=document.getElementById("hairPick");
  SKINS.forEach(function(c){ var d=document.createElement("div"); d.className="sw"+(c===moSkin?" on":""); d.style.background=c;
    d.onclick=function(){ moSkin=c; save(); Array.prototype.forEach.call(sp.children,function(e){e.classList.remove("on");}); d.classList.add("on"); }; sp.appendChild(d); });
  HAIRS.forEach(function(c){ var d=document.createElement("div"); d.className="sw"+(c===moHair?" on":""); d.style.background=c;
    d.onclick=function(){ moHair=c; save(); Array.prototype.forEach.call(hp.children,function(e){e.classList.remove("on");}); d.classList.add("on"); }; hp.appendChild(d); });
  document.querySelector("a.room.soon").addEventListener("click",function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
