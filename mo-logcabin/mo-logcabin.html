<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Log Cabin</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#8fd0ff;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function grab(){ bp(700,0.06,'sine',0.14); } function thunk(){ bp(150,0.12,'square',0.16); bp(90,0.14,'sine',0.16); } function ding(){ bp(880,0.1,'triangle',0.2); setTimeout(function(){bp(1250,0.1,'triangle',0.16);},70); }
function bark(){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(),bpf=a.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=900; o.type='sawtooth'; o.frequency.setValueAtTime(420,a.currentTime); o.frequency.exponentialRampToValueAtTime(190,a.currentTime+0.1); g.gain.setValueAtTime(0.26,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.12); o.connect(bpf);bpf.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+0.13); }

var JB={x:66,y:H-58,r:44}, AB={x:W-56,y:H-56,r:42}, BB={x:W-116,y:H-96,r:32};
var joyId=null,joyX=0,joyY=0,aId=null,bId=null;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+8; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(inC(p,BB)){ bId=e.pointerId; resetAll(); return; }
  if(inC(p,AB)){ aId=e.pointerId; onA(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; if(e.pointerId===bId)bId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

// world
var GROUND=H-140;
var hook={x:200,y:120};
var held=false, fall=null; // fall={x,y,vy,zone,ty}
var WALLS_NEED=6, DOG_NEED=4;
var walls=0, doorDone=false, roofDone=false, dog=0;
var msg='Grab a log (A), drop it on the cabin!', msgT=3, done=false, arffX=340;
function resetAll(){ walls=0; doorDone=false; roofDone=false; dog=0; held=false; fall=null; done=false; msg='Grab a log (A), drop it on the cabin!'; msgT=2.5; arffX=340; }
function showMsg(t){ msg=t; msgT=1.8; }

// cabin geometry
var CBX=125, CBW=150, LOGH=18; // cabin center x, wall width, log height
function wallTopY(i){ return GROUND - 6 - (i+1)*LOGH; } // y of top of ith wall log
var DGX=305, DGW=80;
function dogTopY(i){ return GROUND - 6 - (i+1)*16; }

function nextTarget(zone){ // returns {ty, kind}
  if(zone==='cabin'){ if(walls<WALLS_NEED) return {ty:wallTopY(walls)+LOGH/2, kind:'wall'}; if(!doorDone) return {ty:GROUND-24, kind:'door'}; if(!roofDone) return {ty:wallTopY(WALLS_NEED)-6, kind:'roof'}; return null; }
  else { if(dog<DOG_NEED) return {ty:dogTopY(dog)+8, kind:'dog'}; return null; }
}
function onA(){ if(done)return;
  if(fall)return; // wait for current log to land
  if(!held){ held=true; grab(); showMsg('Move over the build spot, press A to drop'); return; }
  // drop
  var zone = hook.x<215?'cabin':'dog';
  var tgt=nextTarget(zone);
  if(!tgt){ // that zone is finished; drop wasted
    held=false; showMsg(zone==='cabin'?'Cabin part done — build the doghouse! 🐶':'Doghouse is done!'); return;
  }
  held=false; fall={x:(zone==='cabin'?CBX:DGX), y:hook.y+30, vy:0, zone:zone, ty:tgt.ty, kind:tgt.kind};
}

function upd(dt){ if(msgT>0)msgT-=dt;
  var v=jv(); hook.x=clamp(hook.x+v.x*180*dt,50,W-40); hook.y=clamp(hook.y+v.y*60*dt,96,150);
  if(fall){ fall.vy+=900*dt; fall.y+=fall.vy*dt; if(fall.y>=fall.ty){ fall.y=fall.ty; commit(fall); fall=null; } }
  if(done){ if(arffX>DGX){ arffX-=40*dt; } }
}
function commit(f){ thunk();
  if(f.kind==='wall'){ walls++; if(walls===WALLS_NEED)showMsg('Walls up! Now a DOOR 🚪'); }
  else if(f.kind==='door'){ doorDone=true; showMsg('Door in! Now the ROOF 🔺'); }
  else if(f.kind==='roof'){ roofDone=true; showMsg('Roof on! Build a doghouse for Arff 🐶'); }
  else if(f.kind==='dog'){ dog++; if(dog<DOG_NEED)bark(); if(dog===DOG_NEED)showMsg('Doghouse done!'); }
  if(walls>=WALLS_NEED && doorDone && roofDone && dog>=DOG_NEED && !done){ done=true; ding(); setTimeout(bark,300); showMsg('CABIN COMPLETE! 🏡🐶'); }
}

// draw
function log(x,y,w,h){ cx.fillStyle='#a9743e'; rr(x-w/2,y-h/2,w,h,h/2); cx.fill(); cx.fillStyle='#c68a4e'; rr(x-w/2,y-h/2,w,h*0.5,h/2); cx.fill(); cx.strokeStyle='#7a5228'; cx.lineWidth=1.5; rr(x-w/2,y-h/2,w,h,h/2); cx.stroke(); cx.fillStyle='#8a5a2e'; cx.beginPath(); cx.arc(x-w/2+5,y,h*0.32,0,7); cx.arc(x+w/2-5,y,h*0.32,0,7); cx.fill(); }
function draw(){ // sky
  var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#8fd0ff'); g.addColorStop(1,'#cdeeff'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
  emoji('☁️',80,70,30); emoji('☁️',300,60,26); emoji('☀️',W-40,40,30);
  // ground
  cx.fillStyle='#7ec850'; cx.fillRect(0,GROUND,W,H-GROUND); cx.fillStyle='#5aa83a'; cx.fillRect(0,GROUND,W,8);
  emoji('🌲',26,GROUND-24,40); emoji('🌲',W-24,GROUND-24,40);
  // build zone ghosts
  var zone=hook.x<215?'cabin':'dog'; var tgt=nextTarget(zone);
  if(!held && !fall && !done){ /* show pile hint */ }
  // cabin ghost outline
  cx.strokeStyle='rgba(255,255,255,.5)'; cx.setLineDash([6,5]); cx.lineWidth=2; cx.strokeRect(CBX-CBW/2, wallTopY(WALLS_NEED-1)-4, CBW, WALLS_NEED*LOGH+4); cx.setLineDash([]);
  // cabin walls
  for(var i=0;i<walls;i++){ log(CBX, wallTopY(i)+LOGH/2, CBW, LOGH); }
  // door
  if(doorDone){ cx.fillStyle='#6a3a18'; rr(CBX-16,GROUND-40,32,40,4); cx.fill(); cx.fillStyle='#e0b04a'; cx.beginPath(); cx.arc(CBX+8,GROUND-20,2.5,0,7); cx.fill(); }
  // roof
  if(roofDone){ cx.fillStyle='#8a3a2a'; cx.beginPath(); cx.moveTo(CBX-CBW/2-6, wallTopY(WALLS_NEED-1)); cx.lineTo(CBX, wallTopY(WALLS_NEED-1)-46); cx.lineTo(CBX+CBW/2+6, wallTopY(WALLS_NEED-1)); cx.closePath(); cx.fill(); }
  // doghouse ghost + logs
  cx.strokeStyle='rgba(255,255,255,.5)'; cx.setLineDash([6,5]); cx.strokeRect(DGX-DGW/2, dogTopY(DOG_NEED-1)-2, DGW, DOG_NEED*16+2); cx.setLineDash([]);
  for(var i=0;i<dog;i++){ log(DGX, dogTopY(i)+8, DGW, 16); }
  if(dog>=DOG_NEED){ cx.fillStyle='#8a3a2a'; cx.beginPath(); cx.moveTo(DGX-DGW/2-4,dogTopY(DOG_NEED-1)); cx.lineTo(DGX,dogTopY(DOG_NEED-1)-26); cx.lineTo(DGX+DGW/2+4,dogTopY(DOG_NEED-1)); cx.fill(); cx.fillStyle='#3a1a08'; cx.beginPath(); cx.arc(DGX,GROUND-14,11,Math.PI,0,true); cx.fill(); }
  // Arff
  emoji('🐶',arffX,GROUND-18,26);
  // crane: tower + jib + trolley + cable + hook
  cx.fillStyle='#ffd23f'; cx.fillRect(16,60,10,GROUND-60); cx.fillRect(12,58,W-40,10); // tower + jib
  cx.strokeStyle='#b8901c'; cx.lineWidth=2; for(var ty=70;ty<GROUND;ty+=24)cx.strokeRect(16,ty,10,24);
  cx.fillStyle='#e0563b'; rr(hook.x-14,62,28,12,3); cx.fill(); // trolley
  cx.strokeStyle='#444'; cx.lineWidth=2; cx.beginPath(); cx.moveTo(hook.x,74); cx.lineTo(hook.x,hook.y); cx.stroke();
  cx.fillStyle='#888'; cx.beginPath(); cx.moveTo(hook.x-7,hook.y); cx.lineTo(hook.x+7,hook.y); cx.lineTo(hook.x,hook.y+9); cx.fill();
  if(held){ log(hook.x, hook.y+24, 120, LOGH); }
  if(fall){ log(fall.x, fall.y, fall.zone==='cabin'?CBW:DGW, fall.zone==='cabin'?LOGH:16); }
  // checklist HUD
  cx.fillStyle='rgba(20,10,4,.55)'; rr(8,8,W-16,34,10); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 12px Trebuchet MS'; cx.textAlign='left';
  cx.fillText('🪵'+walls+'/'+WALLS_NEED+'  '+(doorDone?'🚪✓':'🚪')+'  '+(roofDone?'🔺✓':'🔺')+'  🐶'+dog+'/'+DOG_NEED, 16, 30);
  cx.textAlign='right'; cx.fillStyle='#ffd23f'; cx.fillText('MO Log Cabin',W-14,30);
  if(msgT>0||done){ cx.globalAlpha=done?1:Math.min(1,msgT*1.4); cx.textAlign='center'; cx.fillStyle=done?'#ffd23f':'#fff'; cx.font='bold '+(done?24:16)+'px Trebuchet MS'; cx.fillText(msg,W/2,H/2-30); cx.globalAlpha=1; }
  // controls
  var v=jv(); cx.fillStyle='rgba(255,255,255,.18)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill(); cx.fillStyle='rgba(0,0,0,.4)';cx.font='bold 10px Trebuchet MS';cx.textAlign='center';cx.fillText('CRANE',JB.x,JB.y+JB.r+12);
  cx.fillStyle=aId!==null?'#ffd23f':'rgba(255,210,63,.95)'; cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle='#2a1400'; cx.font='bold 15px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText(held?'DROP':'GRAB',AB.x,AB.y); cx.textBaseline='alphabetic';
  cx.fillStyle=bId!==null?'#ff5ad0':'#c14fe0'; cx.beginPath(); cx.arc(BB.x,BB.y,BB.r,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 16px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('B',BB.x,BB.y); cx.textBaseline='alphabetic'; cx.fillStyle='#e6b0ff';cx.font='bold 9px Trebuchet MS';cx.fillText('RESET',BB.x,BB.y+BB.r+10);
}
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window._LC={ get walls(){return walls;}, get dog(){return dog;}, get done(){return done;}, setHook:function(x){hook.x=x;}, a:function(){onA();}, get held(){return held;}, get falling(){return !!fall;} };
})();
</script>
</body>
</html>
