<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Block Build</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1c0e38;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.1)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.1)+0.02); }
function place(){ bp(500,0.07,'square',0.14); } function pick(){ bp(700,0.05,'sine',0.12); } function trash(){ bp(200,0.12,'square',0.14); }

var ROOM_TOP=46, ROOM_BOT=H-132, GRID=20, SNAP=true;
// palette: blocks (color) + emoji items
var PAL=[
 {t:'blk',c:'#e0563b'},{t:'blk',c:'#3aa0ff'},{t:'blk',c:'#39b56a'},{t:'blk',c:'#ffd23f'},{t:'blk',c:'#9a5ae0'},{t:'blk',c:'#c07a2a'},{t:'blk',c:'#c8c8c8'},{t:'blk',c:'#ff7ab0'},{t:'em',e:'🚪'},{t:'em',e:'🪟'},{t:'em',e:'🧒'},
 {t:'em',e:'🛏️'},{t:'em',e:'🛋️'},{t:'em',e:'🪑'},{t:'em',e:'🍽️'},{t:'em',e:'📺'},{t:'em',e:'💡'},{t:'em',e:'🪴'},{t:'em',e:'🖼️'},{t:'em',e:'🧸'},{t:'em',e:'🏀'},{t:'em',e:'🐶'}
];
var placed=[]; // {t,c/e,x,y}
var drag=null; // {item, x, y, fromIdx}
// try restore
try{ var s=localStorage.getItem('moRoom'); if(s)placed=JSON.parse(s); }catch(e){}
function save(){ try{ localStorage.setItem('moRoom', JSON.stringify(placed)); }catch(e){} }

// palette layout: 2 rows of 11
var PSLOT=34, PGAP=2, PCOLS=11, PY1=H-126, PY2=H-88, PX0=6;
function palRect(i){ var r=Math.floor(i/PCOLS), c=i%PCOLS; return {x:PX0+c*(PSLOT+PGAP), y:(r===0?PY1:PY2), w:PSLOT, h:PSLOT}; }
// bottom bar buttons
var clearBtn={x:8,y:H-38,w:96,h:30}, gridBtn={x:112,y:H-38,w:96,h:30}, trashBtn={x:W-96,y:H-40,w:88,h:34};

function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
function inR(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function snap(v){ return SNAP?Math.round(v/GRID)*GRID:v; }

cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  // buttons
  if(inR(p,clearBtn)){ placed=[]; save(); trash(); return; }
  if(inR(p,gridBtn)){ SNAP=!SNAP; bp(600,0.05,'sine',0.12); return; }
  // palette pickup -> new item
  for(var i=0;i<PAL.length;i++){ if(inR(p,palRect(i))){ drag={item:{t:PAL[i].t,c:PAL[i].c,e:PAL[i].e}, x:p.x, y:p.y, fromIdx:-1}; pick(); return; } }
  // pick up a placed item (topmost)
  for(var i=placed.length-1;i>=0;i--){ var it=placed[i]; if(Math.abs(p.x-it.x)<22 && Math.abs(p.y-it.y)<22 && p.y<ROOM_BOT){ drag={item:{t:it.t,c:it.c,e:it.e}, x:p.x, y:p.y, fromIdx:i}; placed.splice(i,1); pick(); return; } }
});
cv.addEventListener('pointermove',function(e){ if(!drag)return; var p=pt(e); drag.x=p.x; drag.y=p.y; });
window.addEventListener('pointerup',function(e){ if(!drag)return; var p=drag;
  // drop on trash -> delete
  if(inR(p,trashBtn)){ trash(); drag=null; save(); return; }
  // drop in room -> place
  if(p.y>ROOM_TOP+4 && p.y<ROOM_BOT-4){ placed.push({t:p.item.t,c:p.item.c,e:p.item.e, x:snap(clamp(p.x,ROOM_TOP,W-8)), y:snap(clamp(p.y,ROOM_TOP+8,ROOM_BOT-8))}); place(); save(); }
  drag=null;
});

function drawItem(it,x,y,ghost){ cx.globalAlpha=ghost?0.75:1;
  if(it.t==='blk'){ cx.fillStyle=it.c; rr(x-19,y-19,38,38,6); cx.fill(); cx.fillStyle='rgba(255,255,255,.25)'; rr(x-19,y-19,38,10,6); cx.fill(); cx.strokeStyle='rgba(0,0,0,.25)'; cx.lineWidth=1.5; rr(x-19,y-19,38,38,6); cx.stroke(); }
  else { emoji(it.e,x,y,36); }
  cx.globalAlpha=1;
}
function draw(){ cx.clearRect(0,0,W,H);
  // title
  cx.fillStyle='#241436'; cx.fillRect(0,0,W,ROOM_TOP); cx.fillStyle='#ffd23f'; cx.font='bold 18px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🧱 MO Block Build',10,30); cx.fillStyle='#c9b3f0'; cx.font='11px Trebuchet MS'; cx.textAlign='right'; cx.fillText('drag to build your room!',W-10,30);
  // room floor + walls
  var fg=cx.createLinearGradient(0,ROOM_TOP,0,ROOM_BOT); fg.addColorStop(0,'#e8d3b0'); fg.addColorStop(1,'#d3b184'); cx.fillStyle=fg; cx.fillRect(0,ROOM_TOP,W,ROOM_BOT-ROOM_TOP);
  // wall band at top of room
  cx.fillStyle='#b9d0e8'; cx.fillRect(0,ROOM_TOP,W,44);
  // grid
  if(SNAP){ cx.strokeStyle='rgba(120,90,50,.18)'; cx.lineWidth=1; for(var gx=0;gx<W;gx+=GRID){ cx.beginPath(); cx.moveTo(gx,ROOM_TOP); cx.lineTo(gx,ROOM_BOT); cx.stroke(); } for(var gy=ROOM_TOP;gy<ROOM_BOT;gy+=GRID){ cx.beginPath(); cx.moveTo(0,gy); cx.lineTo(W,gy); cx.stroke(); } }
  // placed
  placed.forEach(function(it){ drawItem(it,it.x,it.y,false); });
  if(placed.length===0 && !drag){ cx.fillStyle='rgba(90,60,30,.5)'; cx.font='bold 15px Trebuchet MS'; cx.textAlign='center'; cx.fillText('Drag blocks & furniture up here 👆',W/2,(ROOM_TOP+ROOM_BOT)/2); cx.font='13px Trebuchet MS'; cx.fillText('Make a room you live in!',W/2,(ROOM_TOP+ROOM_BOT)/2+24); }
  // palette panel
  cx.fillStyle='#20143a'; cx.fillRect(0,PY1-8,W,H-(PY1-8));
  cx.fillStyle='#c9b3f0'; cx.font='10px Trebuchet MS'; cx.textAlign='left'; cx.fillText('BLOCKS & THINGS — drag one up:',8,PY1-12);
  for(var i=0;i<PAL.length;i++){ var r=palRect(i); cx.fillStyle='rgba(255,255,255,.08)'; rr(r.x,r.y,r.w,r.h,7); cx.fill(); drawItem(PAL[i], r.x+r.w/2, r.y+r.h/2, false); }
  // bottom bar
  cx.fillStyle='#e0563b'; rr(clearBtn.x,clearBtn.y,clearBtn.w,clearBtn.h,8); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 13px Trebuchet MS'; cx.textAlign='center'; cx.fillText('🧹 Clear',clearBtn.x+clearBtn.w/2,clearBtn.y+20);
  cx.fillStyle=SNAP?'#39b56a':'#555'; rr(gridBtn.x,gridBtn.y,gridBtn.w,gridBtn.h,8); cx.fill(); cx.fillStyle='#fff'; cx.fillText('▦ Grid '+(SNAP?'ON':'OFF'),gridBtn.x+gridBtn.w/2,gridBtn.y+20);
  cx.fillStyle=(drag&&inR(drag,trashBtn))?'#ff3a3a':'#5a2a2a'; rr(trashBtn.x,trashBtn.y,trashBtn.w,trashBtn.h,8); cx.fill(); cx.fillStyle='#fff'; cx.fillText('🗑️ drop to delete',trashBtn.x+trashBtn.w/2,trashBtn.y+22);
  // drag ghost
  if(drag){ drawItem(drag.item, drag.x, drag.y, true); }
}
function frame(){ draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window._BB={ get count(){return placed.length;}, clear:function(){placed=[];}, add:function(t,x,y){ placed.push({t:'em',e:t,x:x,y:y}); } };
})();
</script>
</body>
</html>
