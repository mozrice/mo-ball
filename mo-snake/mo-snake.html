<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Snake</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#173a1a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(10,40,15,.7);}
  #obox{background:#fff;color:#222;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#3a9d3a;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#3a9d3a;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="over"><div id="obox"><h1>🐍 MO Snake</h1><div id="omsg">Swipe (or arrow keys) to turn.<br>Eat apples 🍎, grow long, don't bite yourself!</div><button id="go">START</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  var GRID=17, cell=0, ox=0, oy=0, boardPx=0;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); boardPx=Math.min(W,H-80); cell=Math.floor(boardPx/GRID); ox=Math.floor((W-cell*GRID)/2); oy=Math.floor((H-cell*GRID)/2)+20; }
  addEventListener('resize',resize); resize();
  var playing=false, score=0, best=+(localStorage.getItem('moSnakeBest')||0);
  var snake=[], dir={x:1,y:0}, nd={x:1,y:0}, food={x:5,y:5}, stepT=0, speed=8;
  function reset(){ snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}]; dir={x:1,y:0}; nd={x:1,y:0}; score=0; speed=8; placeFood(); }
  function placeFood(){ do{ food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)}; }while(snake.some(function(s){return s.x===food.x&&s.y===food.y;})); }
  function ac(){ try{ return ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function step(){ dir=nd; var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID||snake.some(function(s){return s.x===head.x&&s.y===head.y;})){ playing=false; over(); return; }
    snake.unshift(head); if(head.x===food.x&&head.y===food.y){ score++; beep(900+score*8); placeFood(); if(score%4===0)speed=Math.min(18,speed+1); } else snake.pop(); }
  function loop(){
    x.fillStyle='#173a1a'; x.fillRect(0,0,W,H);
    // board
    x.fillStyle='#1f4a22'; x.fillRect(ox,oy,cell*GRID,cell*GRID);
    for(var i=0;i<GRID;i++)for(var j=0;j<GRID;j++){ if((i+j)%2===0){ x.fillStyle='#24522a'; x.fillRect(ox+i*cell,oy+j*cell,cell,cell); } }
    if(playing){ stepT++; if(stepT>=(60/speed)){ stepT=0; step(); } }
    // food
    x.fillStyle='#e2342f'; x.beginPath(); x.arc(ox+food.x*cell+cell/2,oy+food.y*cell+cell/2,cell*0.36,0,7); x.fill(); x.fillStyle='#3a9d3a'; x.fillRect(ox+food.x*cell+cell/2-1,oy+food.y*cell+4,3,5);
    // snake
    for(var s=snake.length-1;s>=0;s--){ var seg=snake[s]; var head=s===0; x.fillStyle=head?'#ffd23f':(s%2?'#3aba5a':'#4ad06a'); var pad=head?1:2; x.fillRect(ox+seg.x*cell+pad,oy+seg.y*cell+pad,cell-pad*2,cell-pad*2);
      if(head){ x.fillStyle='#e2342f'; x.font='900 '+Math.round(cell*0.5)+'px Trebuchet MS'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('MO',ox+seg.x*cell+cell/2,oy+seg.y*cell+cell/2+1); x.textBaseline='alphabetic'; } }
    x.fillStyle='#fff'; x.font='900 '+Math.round(W*0.06)+'px Trebuchet MS'; x.textAlign='left'; x.fillText('🍎 '+score, 14, 40);
    x.textAlign='right'; x.font='900 '+Math.round(W*0.04)+'px Trebuchet MS'; x.fillText('Best '+best, W-14, 36);
    requestAnimationFrame(loop);
  }
  function over(){ beep(160,0.3); if(score>best){ best=score; try{localStorage.setItem('moSnakeBest',score);}catch(e){} }
    document.getElementById('omsg').innerHTML='You grew to <b>'+(score+3)+'</b>!<br>Best apples: '+best; document.getElementById('go').textContent='PLAY AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  function turn(dx,dy){ if(dx===-dir.x&&dy===-dir.y)return; nd={x:dx,y:dy}; }
  addEventListener('keydown',function(e){ if(e.key==='ArrowLeft')turn(-1,0); if(e.key==='ArrowRight')turn(1,0); if(e.key==='ArrowUp')turn(0,-1); if(e.key==='ArrowDown')turn(0,1); });
  var sx0,sy0; cv.addEventListener('pointerdown',function(e){ sx0=e.clientX; sy0=e.clientY; });
  cv.addEventListener('pointerup',function(e){ var dx=e.clientX-sx0, dy=e.clientY-sy0; if(Math.abs(dx)<12&&Math.abs(dy)<12)return; if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1); });
  document.getElementById('over').style.display='flex'; loop();
})();
</script>
</body></html>
