<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Potion Lab</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#12203a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#bcd0ea;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:17px;font-weight:bold;color:#ffd23f;pointer-events:none;}
  #tools{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:8px;background:#0a1224dd;}
  .tool{font-size:24px;background:#26325a;border:2px solid #3a4a7a;border-radius:12px;padding:5px 9px;font-family:inherit;color:#fff;}
  .tool.sel{border-color:#ffd23f;background:#3a4a2a;}
  .act{font-size:14px;font-weight:bold;background:#26325a;border:2px solid #4a5a8a;border-radius:12px;padding:8px 10px;color:#fff;font-family:inherit;}
  #big{font-size:22px;background:#1a9a5a;border-color:#1a9a5a;}
</style></head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="hud">&#129514; Build a wizard lab! &nbsp; &#128993;<span id="cnt">0</span></div>
<canvas id="c"></canvas>
<div id="tools" id="toolbar"></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var PAL=["🧪", "⚗️", "🔮", "🧙", "📜", "🕯️", "🐸", "🍄", "💎", "✨"];
  var BG=["#2a1a4a", "#160a2a", null];
  var items=[], tool=PAL[0], sz=28;
  var tb=document.getElementById('tools');
  PAL.forEach(function(e,i){ var b=document.createElement('button'); b.className='tool'+(i===0?' sel':''); b.textContent=e; b.onclick=function(){ var all=tb.querySelectorAll('.tool'); for(var j=0;j<all.length;j++)all[j].classList.remove('sel'); b.classList.add('sel'); tool=e; }; tb.appendChild(b); });
  var er=document.createElement('button'); er.className='tool'; er.textContent='&#129529;'; er.innerHTML='&#129529;'; er.onclick=function(){ var all=tb.querySelectorAll('.tool'); for(var j=0;j<all.length;j++)all[j].classList.remove('sel'); er.classList.add('sel'); tool='ERASE'; }; tb.appendChild(er);
  var cl=document.createElement('button'); cl.className='act'; cl.innerHTML='&#129529; Clear'; cl.onclick=function(){ items=[]; document.getElementById('cnt').textContent=0; }; tb.appendChild(cl);
  function place(e){ var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); var x=t0.clientX-r.left,y=t0.clientY-r.top; if(y>H-62)return;
    if(tool==='ERASE'){ for(var i=items.length-1;i>=0;i--){ if(Math.hypot(items[i].x-x,items[i].y-y)<sz*0.7){ items.splice(i,1); break; } } }
    else { items.push({x:x,y:y,e:tool}); }
    document.getElementById('cnt').textContent=items.length; }
  cv.addEventListener('touchstart',function(e){place(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',function(e){place(e);e.preventDefault();},{passive:false});
  cv.addEventListener('mousedown',function(e){dn=true;place(e);});
  cv.addEventListener('mousemove',function(e){if(dn)place(e);});
  window.addEventListener('mouseup',function(){dn=false;}); var dn=false;
  function loop(){ var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,BG[0]); g.addColorStop(1,BG[1]); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(BG[2]){ ctx.fillStyle=BG[2]; ctx.fillRect(0,H*0.7,W,H*0.3); }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(var i=0;i<items.length;i++){ ctx.font=sz+'px sans-serif'; ctx.fillText(items[i].e,items[i].x,items[i].y); }
    ctx.fillStyle='#fff9'; ctx.font='13px Trebuchet MS'; ctx.fillText('Tap to make a magic potion lab!',W/2,H-70);
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
