<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Dragon Quest</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#3a6a3a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  a.back{position:fixed;top:8px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:9;text-shadow:0 1px 3px #000;background:#00000055;padding:6px 10px;border-radius:10px;}
  #stick{position:fixed;bottom:20px;left:18px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);z-index:8;touch-action:none;}
  #knob{position:absolute;top:38px;left:38px;width:44px;height:44px;border-radius:50%;background:#e2342f;}
  #fire{position:fixed;bottom:30px;right:22px;z-index:8;border:none;font-family:inherit;font-weight:900;font-size:20px;color:#fff;background:linear-gradient(#ffb04a,#e2342f);padding:20px 26px;border-radius:20px;box-shadow:0 5px 0 #a01820;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(20,40,20,.65);}
  #obox{background:#fff;color:#222;border-radius:18px;padding:26px 30px;text-align:center;max-width:80%;}
  #obox h1{color:#3a8a3a;margin:0 0 6px;}
  #go{margin-top:14px;border:none;background:#3a8a3a;color:#fff;font-family:inherit;font-weight:900;font-size:20px;padding:12px 28px;border-radius:14px;}
</style></head>
<body>
<a class="back" href="../index.html">&#11013; Arcade</a>
<canvas id="c"></canvas>
<div id="stick"><div id="knob"></div></div>
<button id="fire">🔥 FIRE</button>
<div id="over"><div id="obox"><h1>🐉 MO Dragon Quest</h1><div id="omsg">Joystick to walk, 🔥 to shoot.<br>Grab 5 gems 💎 then beat the dragon boss!</div><button id="go">QUEST</button></div></div>
<script>
(function(){
  var cv=document.getElementById('c'), x=cv.getContext('2d'), W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; x.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  var playing=false, gems=0, hp=5, best=+(localStorage.getItem('moDQBest')||0), stage='collect';
  var mo={x:0,y:0,dir:1}, jx=0,jy=0, gemList=[], shots=[], boss=null, fireballs=[], t=0, trees=[];
  function reset(){ mo={x:W/2,y:H*0.6,dir:1}; gems=0; hp=5; stage='collect'; gemList=[]; shots=[]; fireballs=[]; boss=null; t=0;
    for(var i=0;i<5;i++)gemList.push({x:60+Math.random()*(W-120),y:H*0.2+Math.random()*(H*0.55),got:false});
    trees=[]; for(var i=0;i<7;i++)trees.push({x:Math.random()*W,y:H*0.15+Math.random()*(H*0.7)}); }
  function ac(){ try{ return ac._c=ac._c||new(window.AudioContext||window.webkitAudioContext)(); }catch(e){return null;} }
  function beep(f,d){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start();o.stop(a.currentTime+(d||0.08)); }
  function moDraw(){ x.save(); x.translate(mo.x,mo.y); x.scale(mo.dir,1); x.fillStyle='#e2342f'; x.beginPath(); x.arc(0,0,18,0,7); x.fill(); x.fillStyle='#f4c9a0'; x.beginPath(); x.arc(0,-4,11,0,7); x.fill(); x.fillStyle='#ffd23f'; x.beginPath(); x.moveTo(-12,-10); x.lineTo(0,-22); x.lineTo(12,-10); x.fill(); x.fillStyle='#fff'; x.font='900 10px Trebuchet MS'; x.textAlign='center'; x.fillText('MO',0,8); x.restore(); }
  function loop(){ t++;
    x.fillStyle='#4a8a3a'; x.fillRect(0,0,W,H); for(var i=0;i<W;i+=40)for(var j=0;j<H;j+=40){ if((i+j)%80===0){ x.fillStyle='#458035'; x.fillRect(i,j,40,40);} }
    for(var i=0;i<trees.length;i++){ var tr=trees[i]; x.fillStyle='#6a4a2a'; x.fillRect(tr.x-4,tr.y,8,16); x.fillStyle='#2a7d3a'; x.beginPath(); x.arc(tr.x,tr.y-4,16,0,7); x.fill(); }
    if(playing){ mo.x+=jx*5; mo.y+=jy*5; mo.x=Math.max(20,Math.min(W-20,mo.x)); mo.y=Math.max(60,Math.min(H-40,mo.y)); if(jx!==0)mo.dir=jx<0?-1:1; }
    if(stage==='collect'){ for(var i=0;i<gemList.length;i++){ var g=gemList[i]; if(g.got)continue; x.save(); x.translate(g.x,g.y+Math.sin(t*0.1+g.x)*3); x.fillStyle='#3ad0e0'; x.beginPath(); x.moveTo(0,-12); x.lineTo(10,0); x.lineTo(0,12); x.lineTo(-10,0); x.closePath(); x.fill(); x.restore(); if(playing&&Math.hypot(g.x-mo.x,g.y-mo.y)<28){ g.got=true; gems++; beep(1100); if(gems>=5){ stage='boss'; boss={x:W/2,y:H*0.22,hp:20,max:20,dir:1,cd:60}; beep(400);} } } }
    else if(stage==='boss' && boss){ boss.x+=boss.dir*2; if(boss.x<80)boss.dir=1; if(boss.x>W-80)boss.dir=-1; if(playing){ boss.cd--; if(boss.cd<=0){ fireballs.push({x:boss.x,y:boss.y+30,vx:(mo.x-boss.x)*0.02,vy:5}); boss.cd=Math.max(28,60-Math.floor((boss.max-boss.hp)*2)); beep(300);} }
      // dragon
      x.save(); x.translate(boss.x,boss.y); x.fillStyle='#2a9d4a'; x.beginPath(); x.ellipse(0,0,44,30,0,0,7); x.fill(); x.fillStyle='#3aba5a'; x.beginPath(); x.arc(0,-24,20,0,7); x.fill(); x.fillStyle='#2a7d3a'; for(var s=0;s<5;s++){ x.beginPath(); x.moveTo(-30+s*15,-20); x.lineTo(-24+s*15,-32); x.lineTo(-18+s*15,-20); x.fill(); } x.fillStyle='#fff'; x.beginPath(); x.arc(-8,-26,5,0,7); x.arc(8,-26,5,0,7); x.fill(); x.fillStyle='#111'; x.beginPath(); x.arc(-8,-26,2.5,0,7); x.arc(8,-26,2.5,0,7); x.fill(); x.restore();
      x.fillStyle='#000'; x.fillRect(boss.x-44,boss.y-44,88,7); x.fillStyle='#e2342f'; x.fillRect(boss.x-44,boss.y-44,88*(boss.hp/boss.max),7);
      // fireballs from boss
      for(var i=fireballs.length-1;i>=0;i--){ var f=fireballs[i]; f.x+=f.vx; f.y+=f.vy; x.fillStyle='#ff7a2a'; x.beginPath(); x.arc(f.x,f.y,10,0,7); x.fill(); x.fillStyle='#ffd23f'; x.beginPath(); x.arc(f.x,f.y,5,0,7); x.fill();
        if(playing&&Math.hypot(f.x-mo.x,f.y-mo.y)<26){ hp--; beep(180); fireballs.splice(i,1); if(hp<=0){ playing=false; over(false); } continue; } if(f.y>H+20)fireballs.splice(i,1); }
    }
    // player shots
    for(var i=shots.length-1;i>=0;i--){ var s=shots[i]; s.x+=s.vx; s.y+=s.vy; x.fillStyle='#ffd23f'; x.beginPath(); x.arc(s.x,s.y,7,0,7); x.fill(); x.fillStyle='#ff7a2a'; x.beginPath(); x.arc(s.x,s.y,4,0,7); x.fill();
      if(stage==='boss'&&boss&&Math.hypot(s.x-boss.x,s.y-boss.y)<44){ boss.hp--; beep(900); shots.splice(i,1); if(boss.hp<=0){ playing=false; over(true); } continue; } if(s.y<-20||s.y>H+20||s.x<-20||s.x>W+20)shots.splice(i,1); }
    moDraw();
    x.fillStyle='#fff'; x.font='900 '+Math.round(W*0.055)+'px Trebuchet MS'; x.textAlign='left'; x.strokeStyle='#2a4a2a'; x.lineWidth=3; x.strokeText('💎 '+gems+'/5',14,42); x.fillText('💎 '+gems+'/5',14,42);
    x.textAlign='right'; x.strokeText('❤️ '+hp,W-14,42); x.fillText('❤️ '+hp,W-14,42);
    if(stage==='boss'){ x.textAlign='center'; x.fillStyle='#ffd23f'; x.strokeText('BOSS FIGHT!',W/2,42); x.fillText('BOSS FIGHT!',W/2,42); }
    requestAnimationFrame(loop);
  }
  function fire(){ if(!playing)return; shots.push({x:mo.x,y:mo.y,vx: stage==='boss'?0:mo.dir*10, vy: stage==='boss'?-10:0}); if(stage==='boss'){ shots[shots.length-1].vx=(boss.x-mo.x)*0.06; } beep(700); }
  function over(win){ beep(win?1500:200,0.4); var sc=win?100:gems*10; if(sc>best){ best=sc; try{localStorage.setItem('moDQBest',sc);}catch(e){} }
    document.getElementById('omsg').innerHTML=(win?'🏆 You beat the DRAGON!':'The dragon got you!')+'<br>Best: '+best; document.getElementById('go').textContent='QUEST AGAIN'; document.getElementById('over').style.display='flex'; }
  document.getElementById('go').addEventListener('click',function(){ reset(); playing=true; document.getElementById('over').style.display='none'; });
  document.getElementById('fire').addEventListener('pointerdown',function(e){ e.preventDefault(); fire(); });
  (function(){ var st=document.getElementById('stick'), kn=document.getElementById('knob'); var pid=null,R=40;
    function set(dx,dy){ var d=Math.hypot(dx,dy); if(d>R){ dx=dx/d*R; dy=dy/d*R; } kn.style.left=(38+dx)+'px'; kn.style.top=(38+dy)+'px'; jx=dx/R; jy=dy/R; }
    function rel(){ pid=null; kn.style.left='38px'; kn.style.top='38px'; jx=0; jy=0; }
    st.addEventListener('pointerdown',function(e){ e.preventDefault(); pid=e.pointerId; try{st.setPointerCapture(e.pointerId);}catch(_){} var r=st.getBoundingClientRect(); set(e.clientX-r.left-60,e.clientY-r.top-60); });
    st.addEventListener('pointermove',function(e){ if(pid===null)return; var r=st.getBoundingClientRect(); set(e.clientX-r.left-60,e.clientY-r.top-60); });
    st.addEventListener('pointerup',rel); st.addEventListener('pointercancel',rel); st.addEventListener('lostpointercapture',rel); addEventListener('pointerup',rel); addEventListener('blur',rel);
  })();
  document.getElementById('over').style.display='flex'; loop();
})();
</script>
</body></html>
