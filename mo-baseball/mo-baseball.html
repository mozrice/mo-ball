<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Home Run Derby</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#3a8a3a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#eaffea;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:18px;font-weight:bold;color:#fff;pointer-events:none;}
  #msg{position:fixed;top:44px;left:0;right:0;text-align:center;font-size:26px;font-weight:bold;color:#ffd23f;pointer-events:none;text-shadow:0 2px 0 #0007;}
  #swing{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd23f,#e0662a);border:none;color:#5a2a00;font-weight:bold;font-size:26px;box-shadow:0 6px 0 #b4541a;z-index:6;}
  #swing:active{transform:translateX(-50%) translateY(4px);}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0008;z-index:7;}
  #over h1{font-size:32px;color:#ffd23f;margin:0 0 6px;} #over button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">⚾ Pitch <span id="pn">1</span>/10 &nbsp; 💥<span id="hr">0</span> HR &nbsp; 🏆<span id="hi">0</span></div>
<div id="msg"></div>
<canvas id="c"></canvas>
<button id="swing">SWING!</button>
<div id="over"><h1>⚾ DERBY OVER!</h1><p id="fmsg"></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var HK='moDerbyHi'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var pitch, hr, pn, ball, state, msg, msgT, hitBall, best, running;
  document.getElementById('hi').textContent=getHi();
  function plateY(){ return H*0.72; }
  function reset(){ pn=1; hr=0; best=0; running=true; document.getElementById('hr').textContent=0; document.getElementById('pn').textContent=1; document.getElementById('over').style.display='none'; newPitch(); }
  function newPitch(){ state='pitching'; msg=''; hitBall=null; ball={y:H*0.16,speed:2.2+pn*0.18+Math.random()*0.6}; }
  function swing(){ if(state==='pitching'){ var py=plateY(); var d=Math.abs(ball.y-py); if(d<70){ var quality=1-d/70; var power=0.5+quality*0.9; var dist=Math.round(power*(280+Math.random()*180)); var homer=dist>=300; if(homer)hr++; hitBall={x:W*0.5,y:py,vx:(Math.random()-0.5)*5,vy:-13*power,dist:dist,homer:homer,t:0}; msg=homer?('💥 HOME RUN! '+dist+' ft!'):('Hit! '+dist+' ft'); msgT=110; if(homer){ beep(820,0.12); setTimeout(function(){beep(1050,0.12);},110);} else beep(500,0.1); state='hit'; document.getElementById('hr').textContent=hr; } else { msg='🅾️ Swing & miss!'; msgT=90; beep(180,0.14); state='miss'; setTimeout(nextPitch,700); } } }
  function nextPitch(){ pn++; if(pn>10){ over(); return; } document.getElementById('pn').textContent=pn; newPitch(); }
  document.getElementById('swing').addEventListener('touchstart',function(e){swing();e.preventDefault();},{passive:false});
  document.getElementById('swing').addEventListener('mousedown',function(){swing();});
  window.addEventListener('keydown',function(e){ if(e.key===' '){ swing(); e.preventDefault(); } });
  function loop(){ if(!running){ return; }
    if(state==='pitching'){ ball.y+=ball.speed; if(ball.y>plateY()+80){ msg='🅾️ Strike! Too slow!'; msgT=90; state='miss'; beep(180,0.12); setTimeout(nextPitch,700); } }
    if(state==='hit'&&hitBall){ hitBall.t++; hitBall.x+=hitBall.vx; hitBall.y+=hitBall.vy; hitBall.vy+=0.4; if(hitBall.y>H+40||hitBall.t>90){ setTimeout(nextPitch,300); state='flying'; } }
    if(msgT>0)msgT--; draw(); requestAnimationFrame(loop); }
  function draw(){ // field
    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#8fd0ff'); g.addColorStop(0.5,'#bfe8ff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.5);
    ctx.fillStyle='#3a8a3a'; ctx.beginPath(); ctx.moveTo(0,H*0.5); ctx.lineTo(W,H*0.5); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
    // outfield wall
    ctx.fillStyle='#2a5a8a'; ctx.fillRect(0,H*0.46,W,10); ctx.fillStyle='#ffd23f'; ctx.font='12px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('🏟️ 300 ft — HOME RUN WALL',W/2,H*0.44);
    // dirt diamond
    ctx.fillStyle='#c8863a'; ctx.beginPath(); ctx.arc(W/2,plateY()+30,60,0,6.29); ctx.fill();
    // batter
    ctx.font='44px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(state==='hit'?'🏏':'🧑‍🦱',W/2-24,plateY()); ctx.fillText('🏏',W/2+6,plateY()-6);
    ctx.fillStyle='#fff'; ctx.font='11px Trebuchet MS'; ctx.fillText('⬆ swing when ball is here!',W/2,plateY()+44);
    // sweet zone
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.setLineDash([6,6]); ctx.strokeRect(W/2-70,plateY()-40,140,80); ctx.setLineDash([]);
    // pitched ball
    if(state==='pitching'){ ctx.font='24px sans-serif'; ctx.fillText('⚾',W/2,ball.y); }
    // hit ball
    if(state==='hit'&&hitBall){ ctx.font='22px sans-serif'; ctx.fillText('⚾',hitBall.x,hitBall.y); }
    var m=document.getElementById('msg'); m.textContent=msgT>0?msg:''; }
  function over(){ running=false; if(hr>getHi()){ setHi(hr); } document.getElementById('hi').textContent=getHi(); document.getElementById('fmsg').textContent='You hit '+hr+' home runs! Best '+getHi(); document.getElementById('over').style.display='flex'; }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); };
  reset(); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:32%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function init(){ hookVisible(document.getElementById('over')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body></html>
