<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Pizza Topping Rush</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#2a1a0e;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:19px;font-weight:bold;color:#ffd23f;pointer-events:none;}
  a.back{position:fixed;top:8px;left:10px;color:#e8c090;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #order{position:fixed;top:42px;left:0;right:0;text-align:center;font-size:22px;pointer-events:none;}
  #trays{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:12px;flex-wrap:wrap;}
  .tp{font-size:34px;background:#3a2a1a;border:2px solid #6a4a2a;border-radius:14px;padding:8px 12px;}
  .tp:active{transform:scale(.92);}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0009;}
  #over h1{font-size:30px;color:#ffd23f;margin:0 0 6px;} #over button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🍕 <span id="sc">0</span> &nbsp; ⏱️<span id="t">45</span>s &nbsp; 🏆<span id="hi">0</span></div>
<div id="order"></div>
<canvas id="c"></canvas>
<div id="trays"></div>
<div id="over"><h1>🍕 TIME!</h1><p>Pizzas <span id="fin">0</span> • Best <span id="best">0</span></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var HK='moPizzaRushHi'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var TOPS=['🍅','🧀','🍄','🫑','🌶️','🍍','🥓','🫒'];
  var order,placed,score,time,running,timer;
  document.getElementById('hi').textContent=getHi();
  function buildTrays(){ var tr=document.getElementById('trays'); tr.innerHTML=''; TOPS.forEach(function(e){ var b=document.createElement('div'); b.className='tp'; b.textContent=e; b.onclick=function(){ place(e); }; tr.appendChild(b); }); }
  function newOrder(){ var n=2+Math.floor(Math.random()*3); order=[]; for(var i=0;i<n;i++)order.push(TOPS[Math.floor(Math.random()*TOPS.length)]); placed=[]; document.getElementById('order').textContent='Make: '+order.join(' '); }
  function place(e){ if(!running)return; placed.push(e); beep(500,0.05);
    var idx=placed.length-1; if(order[idx]!==e){ // wrong topping
      placed=[]; beep(180,0.1); flash=8; return; }
    if(placed.length===order.length){ score++; document.getElementById('sc').textContent=score; beep(820,0.1); setTimeout(function(){beep(1000,0.1);},90); newOrder(); } }
  function reset(){ score=0; time=45; running=true; buildTrays(); newOrder(); document.getElementById('sc').textContent=0; document.getElementById('t').textContent=45; document.getElementById('over').style.display='none'; }
  var flash=0;
  function tick(){ if(!running)return; time-=0.1; if(time<=0){ time=0; over(); } document.getElementById('t').textContent=Math.ceil(time); }
  function loop(){ if(flash>0)flash--; draw(); requestAnimationFrame(loop); }
  function draw(){ ctx.fillStyle='#2a1a0e'; ctx.fillRect(0,0,W,H); if(flash>0){ ctx.fillStyle='rgba(224,69,58,'+(flash/16)+')'; ctx.fillRect(0,0,W,H); }
    var cx=W/2,cy=H*0.42,rad=Math.min(W,H)*0.26;
    ctx.fillStyle='#e8b04a'; ctx.beginPath(); ctx.arc(cx,cy,rad,0,6.29); ctx.fill(); ctx.fillStyle='#c8352a'; ctx.beginPath(); ctx.arc(cx,cy,rad-10,0,6.29); ctx.fill(); ctx.fillStyle='#f0d060'; ctx.beginPath(); ctx.arc(cx,cy,rad-18,0,6.29); ctx.fill();
    for(var i=0;i<placed.length;i++){ var a=(i/Math.max(1,order.length))*6.28-1.57; var px=cx+Math.cos(a)*rad*0.45, py=cy+Math.sin(a)*rad*0.45; ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(placed[i],px,py); }
    ctx.fillStyle='#8a6a3a'; ctx.font='14px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('👇 Tap toppings in the right order!',cx,cy+rad+22); }
  function over(){ running=false; if(score>getHi()){ setHi(score); } document.getElementById('hi').textContent=getHi(); document.getElementById('fin').textContent=score; document.getElementById('best').textContent=getHi(); document.getElementById('over').style.display='flex'; }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); };
  reset(); setInterval(tick,100); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
