<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Color Match</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#12142a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none;}
  #hud{text-align:center;padding:34px 10px 4px;font-size:20px;font-weight:bold;color:#ffd23f;}
  a.back{position:fixed;top:8px;left:10px;color:#bcd0ea;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #word{text-align:center;font-size:52px;font-weight:bold;margin:14px 0;}
  #ask{text-align:center;font-size:16px;color:#bcd0ea;height:20px;}
  #btns{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:400px;margin:18px auto;padding:0 16px;}
  .cb{padding:26px;border-radius:16px;border:none;font-size:22px;font-weight:bold;color:#fff;font-family:inherit;box-shadow:0 5px 0 #0007;}
  .cb:active{transform:translateY(3px);}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0009;}
  #over h1{font-size:32px;color:#ffd23f;margin:0 0 6px;} #over button{background:linear-gradient(#ffe07a,#f0b429);border:none;color:#5a3a00;font-weight:bold;font-size:20px;padding:14px 28px;border-radius:16px;font-family:inherit;box-shadow:0 5px 0 #b4801a;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🎨 <span id="sc">0</span> &nbsp; ⏱️<span id="t">5.0</span>s &nbsp; 🏆<span id="hi">0</span></div>
<div id="ask">Tap the button whose COLOR matches the word!</div>
<div id="word">RED</div>
<div id="btns"></div>
<div id="over"><h1>🎨 GAME OVER</h1><p>Score <span id="fin">0</span> • Best <span id="best">0</span></p><button id="rs">▶ Play Again</button></div>
<script>
(function(){
  var HK='moColorHi'; function getHi(){ try{return +localStorage.getItem(HK)||0;}catch(e){return 0;} } function setHi(v){ try{localStorage.setItem(HK,v);}catch(e){} }
  var COLORS=[['RED','#e0453a'],['BLUE','#2a6ff0'],['GREEN','#2ad17a'],['YELLOW','#ffd23f'],['PURPLE','#a24aff'],['ORANGE','#ff8a2a'],['PINK','#ff6ad5']];
  var score,timeLeft,timer,running,answer;
  document.getElementById('hi').textContent=getHi();
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function round(){ var opts=shuffle(COLORS).slice(0,4); var target=opts[Math.floor(Math.random()*opts.length)]; answer=target[1];
    // word text is a random color NAME, but the ink color is target color
    var wordName=COLORS[Math.floor(Math.random()*COLORS.length)][0];
    var wd=document.getElementById('word'); wd.textContent=wordName; wd.style.color=target[1];
    var wrap=document.getElementById('btns'); wrap.innerHTML=''; shuffle(opts).forEach(function(c){ var b=document.createElement('button'); b.className='cb'; b.style.background=c[1]; b.textContent=' '; b.onclick=function(){ pick(c[1]); }; wrap.appendChild(b); });
    timeLeft=Math.max(1.3,3.2-score*0.06); }
  function pick(col){ if(!running)return; if(col===answer){ score++; document.getElementById('sc').textContent=score; beep(760,0.07); round(); } else { beep(160,0.12); over(); } }
  function reset(){ score=0; running=true; document.getElementById('sc').textContent=0; document.getElementById('over').style.display='none'; round(); }
  function tick(){ if(!running)return; timeLeft-=0.1; document.getElementById('t').textContent=Math.max(0,timeLeft).toFixed(1); if(timeLeft<=0){ over(); } }
  function over(){ running=false; if(score>getHi()){ setHi(score); } document.getElementById('hi').textContent=getHi(); document.getElementById('fin').textContent=score; document.getElementById('best').textContent=getHi(); document.getElementById('over').style.display='flex'; }
  var ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var o=ac.createOscillator(),gg=ac.createGain(); o.frequency.value=f; o.type='square'; o.connect(gg); gg.connect(ac.destination); gg.gain.value=0.05; o.start(); o.stop(ac.currentTime+d); }catch(e){} }
  document.getElementById('rs').onclick=function(){ reset(); };
  reset(); setInterval(tick,100);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
