<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MO STUNT RACING</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1020;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  .hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;font-weight:bold;text-shadow:0 2px 0 #0008;z-index:5;}
  .pill{background:#0008;border-radius:20px;padding:6px 14px;font-size:17px;}
  .key{position:fixed;bottom:22px;width:82px;height:82px;border-radius:50%;background:#ffffff22;border:3px solid #ffffff66;display:flex;align-items:center;justify-content:center;font-size:36px;user-select:none;z-index:6;}
  #left{left:16px;} #right{left:112px;}
  #gas{position:fixed;right:16px;bottom:20px;width:98px;height:98px;border-radius:50%;background:linear-gradient(#3ee06a,#1f9e46);border:none;color:#fff;font-weight:bold;font-size:20px;box-shadow:0 5px 0 #0e6b30;z-index:6;}
  #flip{position:fixed;right:126px;bottom:34px;width:86px;height:86px;border-radius:50%;background:linear-gradient(#ffcf5a,#f0a929);border:none;color:#5a3b00;font-weight:bold;font-size:16px;box-shadow:0 5px 0 #a86f10;z-index:6;display:none;}
  #gas:active,#flip:active{transform:translateY(3px);}
  #msg{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:44px;font-weight:bold;color:#ffd23f;text-shadow:0 4px 0 #0009,0 0 22px #ffae00;pointer-events:none;opacity:0;transition:opacity .12s;z-index:4;}
  #hint{position:fixed;bottom:120px;left:0;right:0;text-align:center;font-size:15px;color:#e7d6ff;pointer-events:none;text-shadow:0 1px 2px #000;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#0a1020dd;text-align:center;z-index:7;}
  #over h1{font-size:40px;margin:0 0 6px;color:#ffd23f;text-shadow:0 3px 0 #0007;}
  #over p{font-size:20px;margin:4px;}
  .btn{margin-top:16px;background:linear-gradient(#43c6ff,#1a8fd6);border:none;color:#fff;font-weight:bold;font-size:23px;padding:15px 32px;border-radius:16px;box-shadow:0 5px 0 #0e5a8a;font-family:inherit;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0e5a8a;}
  #cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:bold;color:#ffd23f;text-shadow:0 4px 0 #0008;pointer-events:none;z-index:5;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">⏱️ <span id="time">60</span>s</div>
    <div class="pill">💨 <span id="spd">0</span></div>
  </div>
  <div class="key" id="left">◀</div>
  <div class="key" id="right">▶</div>
  <button id="flip">🔄 FLIP</button>
  <button id="gas">GAS</button>
  <div id="msg"></div>
  <div id="hint">Hit the yellow RAMPS ▲ then hold 🔄 FLIP in the air!</div>
  <div id="cd"></div>
  <div id="over">
    <h1 id="otitle">🏁 RUN OVER!</h1>
    <p id="ostat"></p>
    <button class="btn" id="again">Race Again</button>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',resize); resize();

  function beep(f,d,t,v){ try{var a=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
    var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.value=f;
    g.gain.value=v||0.05; o.connect(g); g.connect(a.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1)); o.stop(a.currentTime+(d||0.1)+0.02);}catch(e){} }

  var roadW=2000, segLen=200, camH=1200, camD=0.84, N=240, DRAW=170;
  var trackLen=N*segLen, segs=[], boosts, ramps, trees;
  function build(){
    segs=[];
    for(var i=0;i<N;i++){ var curve=0;
      if(i>30&&i<55) curve=2.2; if(i>80&&i<100) curve=-2.8; if(i>130&&i<155) curve=2.4; if(i>190&&i<215) curve=-2.2;
      segs.push({i:i,curve:curve,y:Math.sin(i*0.11)*500}); }
    boosts=[]; for(var b=14;b<N;b+=30){ boosts.push({seg:b,x:(b%2?0.5:-0.5),on:true}); }
    ramps=[]; for(var r=30;r<N;r+=55){ ramps.push({seg:r}); }
    trees=[]; for(var t=0;t<N;t+=3){ trees.push({seg:t,side:(t%6<3?-1:1)*(1.4+((t*5)%4)*0.12),kind:(t*3)%3}); }
  }

  var player, running, started, score, timeLeft, boostT, nowv=0;
  function reset(){
    build();
    player={z:0,x:0,speed:0,maxBase:150,air:false,jumpH:0,vy:0,flip:0,flips:0,land:0};
    running=true; started=false; score=0; timeLeft=60; boostT=0;
    document.getElementById('over').style.display='none';
    document.getElementById('score').textContent='0'; document.getElementById('time').textContent='60';
    document.getElementById('flip').style.display='none';
    var cd=document.getElementById('cd'); var st=['3','2','1','GO!']; var si=0; cd.textContent=st[0]; beep(440,0.15,'square',0.08);
    var iv=setInterval(function(){ si++; if(si<st.length){ cd.textContent=st[si]; beep(si===3?880:440,0.15,'square',0.08);} if(si>=st.length){ cd.textContent=''; started=true; clearInterval(iv);} },700);
    if(!reset._t){ reset._t=setInterval(function(){ if(running&&started){ timeLeft--; document.getElementById('time').textContent=Math.max(0,timeLeft); if(timeLeft<=0) gameOver(); } },1000); }
  }
  function gameOver(){ running=false; started=false; document.getElementById('otitle').textContent='🏁 RUN OVER!';
    document.getElementById('ostat').innerHTML='You scored <b>'+score+'</b> stunt points!'; document.getElementById('over').style.display='flex'; beep(660,0.2,'square',0.08); }

  var keyL=false,keyR=false,gas=false,flipHeld=false;
  function hold(el,set){ el.addEventListener('touchstart',function(e){set(true);e.preventDefault();},{passive:false});
    el.addEventListener('touchend',function(e){set(false);e.preventDefault();},{passive:false});
    el.addEventListener('mousedown',function(){set(true);}); el.addEventListener('mouseup',function(){set(false);}); el.addEventListener('mouseleave',function(){set(false);}); }
  hold(document.getElementById('left'),function(v){keyL=v;}); hold(document.getElementById('right'),function(v){keyR=v;});
  hold(document.getElementById('gas'),function(v){gas=v;}); hold(document.getElementById('flip'),function(v){flipHeld=v;});
  window.addEventListener('keydown',function(e){ if(e.key==='ArrowLeft')keyL=true; if(e.key==='ArrowRight')keyR=true; if(e.key===' '||e.key==='ArrowUp')gas=true; if(e.key==='ArrowDown'||e.key==='Shift')flipHeld=true; });
  window.addEventListener('keyup',function(e){ if(e.key==='ArrowLeft')keyL=false; if(e.key==='ArrowRight')keyR=false; if(e.key===' '||e.key==='ArrowUp')gas=false; if(e.key==='ArrowDown'||e.key==='Shift')flipHeld=false; });
  document.getElementById('again').addEventListener('click',reset);

  function segAt(z){ z=((z%trackLen)+trackLen)%trackLen; return segs[Math.floor(z/segLen)%N]; }
  function showMsg(m){ var e=document.getElementById('msg'); e.textContent=m; e.style.opacity=1; setTimeout(function(){e.style.opacity=0;},900); }

  function update(dt){
    var maxS=player.maxBase*(boostT>0?1.7:1);
    if(gas) player.speed+=3.2*dt; else player.speed-=2.4*dt;
    player.speed=Math.max(0,Math.min(maxS,player.speed));
    if(!player.air){
      var steer=(keyL?-1:0)+(keyR?1:0); var spct=player.speed/player.maxBase;
      player.x+=steer*0.045*dt*(0.5+spct);
      var seg=segAt(player.z); player.x-=seg.curve*0.00011*player.speed*dt;
      player.x=Math.max(-2,Math.min(2,player.x));
    }
    player.z+=player.speed*dt;
    if(boostT>0) boostT-=dt;

    var pseg=Math.floor((player.z%trackLen)/segLen);
    for(var b=0;b<boosts.length;b++){ var bo=boosts[b]; if(bo.on&&bo.seg===pseg&&Math.abs(player.x-bo.x)<0.55){ boostT=70; bo.on=false; beep(900,0.15,'sawtooth',0.07); (function(bb){setTimeout(function(){bb.on=true;},5000);})(bo); } }

    // ramp launch
    if(!player.air){ for(var r=0;r<ramps.length;r++){ if(ramps[r].seg===pseg && player.speed>player.maxBase*0.65){
      player.air=true; player.vy=4+player.speed*0.02; player.jumpH=0; player.flip=0; player.flips=0;
      document.getElementById('flip').style.display='block'; beep(500,0.12,'square',0.07); break; } } }

    if(player.air){
      player.jumpH+=player.vy*dt; player.vy-=0.12*dt;
      if(flipHeld){ player.flip+=0.14*dt; if(player.flip>=6.283*(player.flips+1)){ player.flips++; beep(700+player.flips*80,0.1,'square',0.07); } }
      if(player.jumpH<=0){ // landed
        player.jumpH=0; player.air=false; document.getElementById('flip').style.display='none';
        if(player.flips>0){ var pts=player.flips*100; score+=pts; document.getElementById('score').textContent=score; showMsg('🔄 '+player.flips+' FLIP'+(player.flips>1?'S':'')+'! +'+pts); beep(900,0.15,'square',0.08); }
        else { score+=20; document.getElementById('score').textContent=score; showMsg('+20 AIR!'); }
        player.flip=0; player.land=1;
      }
    }
    if(player.land>0) player.land-=0.05*dt;
    document.getElementById('spd').textContent=Math.round(player.speed*1.6)+(boostT>0?'💨':'');
  }

  function proj(xW,yW,zR){ if(zR<1)zR=1; var s=camD/zR;
    return { x:W/2+s*(xW-player.x*roadW)*(W/2)/1000, y:H/2-s*(yW-camH)*(H/2)/1000, w:s*roadW*(W/2)/1000, s:s }; }
  function poly(ax,ay,bx,by,cx,cy,dx,dy){ ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(cx,cy); ctx.lineTo(dx,dy); ctx.closePath(); ctx.fill(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function render(){
    var g=ctx.createLinearGradient(0,0,0,H*0.55); g.addColorStop(0,'#7fd0ff'); g.addColorStop(1,'#dff3ff');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.58); ctx.fillStyle='#4a9d3a'; ctx.fillRect(0,H*0.55,W,H*0.45);
    ctx.fillStyle='#fff4c0'; ctx.beginPath(); ctx.arc(W*0.72,H*0.15,38,0,6.29); ctx.fill();

    ctx.save();
    // flip in the air: spin the whole scene + raise it (you're up high)
    if(player.air){ ctx.translate(W/2,H*0.62); ctx.rotate(player.flip); ctx.translate(-W/2,-H*0.62); ctx.translate(0, Math.min(player.jumpH*1.6,200)); }

    var pos=((player.z%trackLen)+trackLen)%trackLen; var baseIndex=Math.floor(pos/segLen); var basePercent=(pos%segLen)/segLen;
    var x=0,dx=0,maxy=H, sprites=[];
    for(var n=0;n<DRAW;n++){ var si=(baseIndex+n)%N; var seg=segs[si], segN=segs[(si+1)%N];
      var z1=(n-basePercent)*segLen; if(z1<1)z1=1; var z2=z1+segLen;
      var p1=proj(x,seg.y,z1), p2=proj(x+dx,segN.y,z2); x+=dx; dx+=seg.curve;
      if(p1.y<=p2.y||p2.y>maxy) continue; maxy=p2.y;
      var light=(Math.floor((baseIndex+n)/3)%2)===0;
      ctx.fillStyle=light?'#57b048':'#4a9d3a'; ctx.fillRect(0,p2.y,W,Math.ceil(p1.y-p2.y)+1);
      var rw1=p1.w*1.18,rw2=p2.w*1.18; ctx.fillStyle=light?'#f0f0f0':'#d23a3a'; poly(p1.x-rw1,p1.y,p1.x+rw1,p1.y,p2.x+rw2,p2.y,p2.x-rw2,p2.y);
      ctx.fillStyle=light?'#71757e':'#63666f'; poly(p1.x-p1.w,p1.y,p1.x+p1.w,p1.y,p2.x+p2.w,p2.y,p2.x-p2.w,p2.y);
      if(light){ ctx.fillStyle='#f4f4f4'; var l1=p1.w*0.05,l2=p2.w*0.05; poly(p1.x-l1,p1.y,p1.x+l1,p1.y,p2.x+l2,p2.y,p2.x-l2,p2.y); }
      for(var bi=0;bi<boosts.length;bi++){ if(boosts[bi].seg===si&&boosts[bi].on) sprites.push({t:'boost',x:p1.x+boosts[bi].x*p1.w,y:p1.y,w:p1.w}); }
      for(var ri=0;ri<ramps.length;ri++){ if(ramps[ri].seg===si) sprites.push({t:'ramp',x:p1.x,y:p1.y,w:p1.w,y2:p2.y,x2:p2.x,w2:p2.w}); }
      for(var ti=0;ti<trees.length;ti++){ if(trees[ti].seg===si) sprites.push({t:'tree',x:p1.x+trees[ti].side*p1.w,y:p1.y,w:p1.w,k:trees[ti].kind}); }
    }
    for(var d=sprites.length-1;d>=0;d--) drawSprite(sprites[d]);
    ctx.restore();
    drawKart();
  }
  function drawSprite(s){ if(s.w<1) return;
    if(s.t==='ramp'){ ctx.fillStyle='#ffd23f'; poly(s.x-s.w,s.y,s.x+s.w,s.y,s.x2+s.w2*0.7,s.y2,s.x2-s.w2*0.7,s.y2);
      ctx.fillStyle='#e0453a'; ctx.font='bold '+Math.max(10,s.w*0.5)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('▲',s.x,(s.y+s.y2)/2); }
    else if(s.t==='boost'){ var w=s.w*0.55,h=w*0.34; ctx.fillStyle='#ffd23f'; ctx.fillRect(s.x-w/2,s.y-h,w,h); ctx.fillStyle='#ff7b00'; ctx.font='bold '+Math.max(7,w*0.42)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('»»',s.x,s.y-h*0.5); }
    else if(s.t==='tree'){ var th=s.w*0.9; if(th<6)th=6; ctx.fillStyle='#6b4a2a'; ctx.fillRect(s.x-th*0.05,s.y-th*0.42,th*0.1,th*0.42); ctx.fillStyle=['#2e7d32','#388e3c','#43a047'][s.k]; ctx.beginPath(); ctx.arc(s.x,s.y-th*0.5,th*0.3,0,6.29); ctx.fill(); }
  }
  function drawKart(){
    var cx=W/2+(keyL?-5:0)+(keyR?5:0), cy=H*0.87 - (player.air?Math.min(player.jumpH*1.6,200):0);
    var wob=Math.sin(nowv*0.02)*(player.speed>8?2:0);
    ctx.save(); ctx.translate(cx,cy+wob);
    if(player.air) ctx.rotate(player.flip*0.5);
    if(boostT>0||player.air){ ctx.fillStyle='rgba(255,160,0,0.7)'; for(var f=0;f<3;f++){ ctx.beginPath(); ctx.moveTo(-30+f*30,44); ctx.lineTo(-18+f*30,44); ctx.lineTo(-24+f*30,58+((f*7+Math.floor(nowv*0.1))%12)); ctx.closePath(); ctx.fill(); } }
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(0,46,72,14,0,0,6.29); ctx.fill();
    ctx.fillStyle='#111'; ctx.fillRect(-74,20,22,30); ctx.fillRect(52,20,22,30);
    ctx.fillStyle='#ff8a1e'; roundRect(-58,-6,116,52,14); ctx.fill(); ctx.fillStyle='#ff6a00'; roundRect(-58,26,116,20,10); ctx.fill();
    ctx.fillStyle='#12406b'; roundRect(-26,-30,52,30,10); ctx.fill();
    ctx.fillStyle='#f6c48a'; ctx.beginPath(); ctx.arc(0,-30,15,0,6.29); ctx.fill(); ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(0,-36,15,Math.PI,6.29); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText('MO',0,20);
    ctx.restore();
  }

  var last=0;
  function loop(ts){ nowv=ts; if(!last) last=ts; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts;
    if(running&&started) update(dt); render(); requestAnimationFrame(loop); }
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
