<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Bowling</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#2a1a0e;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:19px;font-weight:bold;color:#ffd23f;text-shadow:0 2px 0 #0008;pointer-events:none;}
  #msg{position:fixed;top:44px;left:0;right:0;text-align:center;font-size:24px;font-weight:bold;color:#7bff9e;pointer-events:none;text-shadow:0 2px 0 #0008;}
  a.back{position:fixed;top:8px;left:10px;color:#e8d0a0;text-decoration:none;font-size:14px;z-index:5;}
  #tip{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#e8d0a0;font-size:15px;pointer-events:none;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🎳 Frame <span id="fr">1</span>/10 &nbsp; Score <span id="sc">0</span></div>
<div id="msg"></div>
<canvas id="c"></canvas>
<div id="tip">👆 Drag left/right to aim, let go to bowl!</div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); }
  window.addEventListener('resize',fit);
  var pins,ball,aim,rolling,frame,score,msg,msgT,laneL,laneR,rolls,frameScore;
  function layout(){ laneL=W*0.2; laneR=W*0.8; }
  function setPins(){ pins=[]; var cx=W/2, py=H*0.2, sp=W*0.06; var rows=[[0],[-1,1],[-2,0,2],[-3,-1,1,3]]; for(var r=0;r<4;r++){ for(var k=0;k<rows[r].length;k++){ pins.push({x:cx+rows[r][k]*sp*0.9,y:py+r*sp*0.9,down:false}); } } }
  function reset(){ frame=1; score=0; rolls=0; frameScore=0; msg=''; msgT=0; newRoll(true); document.getElementById('sc').textContent=0; document.getElementById('fr').textContent=1; }
  function newRoll(fresh){ if(fresh)setPins(); ball={x:W/2,y:H-70,r:18}; aim=W/2; rolling=false; }
  var drag=false;
  function setAim(e){ if(rolling)return; var t0=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); aim=Math.max(laneL,Math.min(laneR,t0.clientX-r.left)); ball.x=aim; }
  cv.addEventListener('touchstart',function(e){drag=true;setAim(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',function(e){if(drag)setAim(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',function(e){drag=false;if(!rolling)roll();e.preventDefault();},{passive:false});
  cv.addEventListener('mousedown',function(e){drag=true;setAim(e);});
  window.addEventListener('mousemove',function(e){if(drag)setAim(e);});
  window.addEventListener('mouseup',function(){if(drag){drag=false;if(!rolling)roll();}});
  var vx;
  function roll(){ rolling=true; vx=(W/2-aim)*0.02; }
  function loop(){ if(rolling){ ball.y-=7; ball.x+=vx;
      for(var i=0;i<pins.length;i++){ var p=pins[i]; if(!p.down&&Math.hypot(p.x-ball.x,p.y-ball.y)<20){ p.down=true; vx*=0.7; } }
      if(ball.y<H*0.12){ rolling=false; endRoll(); } }
    if(msgT>0)msgT--; draw(); requestAnimationFrame(loop); }
  function endRoll(){ var down=0; for(var i=0;i<pins.length;i++)if(pins[i].down)down++; rolls++;
    if(rolls===1){ frameScore=down; if(down===10){ msg='STRIKE! 🎉'; msgT=90; score+=10+5; finishFrame(); } else { newRoll(false); } }
    else { var total=down; score+=total+(frameScore===0&&total===10?5:0); if(total===10&&frameScore<10)msg='SPARE! ✨',msgT=90; else if(!msg)msg='+'+total,msgT=60; finishFrame(); }
    document.getElementById('sc').textContent=score; }
  function finishFrame(){ rolls=0; frameScore=0; frame++; if(frame>10){ setTimeout(function(){ msg='🏆 FINAL: '+score+'!'; msgT=100000; },400); rolling=false; ball=null; } else { document.getElementById('fr').textContent=frame; setTimeout(function(){ if(frame<=10)newRoll(true); },500); } }
  function draw(){ ctx.fillStyle='#2a1a0e'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#c9a25a'; ctx.beginPath(); ctx.moveTo(laneL,H); ctx.lineTo(W*0.34,H*0.12); ctx.lineTo(W*0.66,H*0.12); ctx.lineTo(laneR,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0006'; for(var g=1;g<5;g++){ var f=g/5; ctx.fillRect(W/2-1,H*0.12+(H-H*0.12)*f*0.0,2,0); }
    for(var i=0;i<pins.length;i++){ var p=pins[i]; if(p.down)continue; ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🎳',p.x,p.y); }
    if(ball){ ctx.fillStyle='#1a1a2a'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,6.29); ctx.fill(); ctx.fillStyle='#43c6ff'; ctx.beginPath(); ctx.arc(ball.x-5,ball.y-5,4,0,6.29); ctx.fill();
      if(!rolling){ ctx.strokeStyle='#7bff9e88'; ctx.lineWidth=3; ctx.setLineDash([8,8]); ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(W/2,H*0.12); ctx.stroke(); ctx.setLineDash([]); } }
    var m=document.getElementById('msg'); m.textContent=msgT>0?msg:''; }
  fit(); reset(); requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration - shows a gold badge + confetti on win/finish */
(function(){
  var busy=false;
  function celebrate(){ if(busy)return; busy=true;
    var b=document.createElement('div'); b.textContent='⭐ MVP SUPERSTAR! ⭐';
    b.style.cssText='position:fixed;left:0;right:0;top:36%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';
    document.body.appendChild(b);
    var cvs=document.createElement('canvas'); cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;'; document.body.appendChild(cvs);
    var x=cvs.getContext('2d'); cvs.width=innerWidth; cvs.height=innerHeight;
    var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];
    for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});
    var fr=0; (function anim(){ x.clearRect(0,0,cvs.width,cvs.height); for(var i=0;i<P.length;i++){ var p=P[i]; p.x+=p.vx; p.y+=p.vy; p.r+=0.12; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); } fr++; if(fr<150)requestAnimationFrame(anim); else { if(cvs.parentNode)cvs.parentNode.removeChild(cvs); } })();
    try{ var a=new (window.AudioContext||window.webkitAudioContext)(); [660,880,990,1180].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain(); o.frequency.value=f; o.type='square'; o.connect(g); g.connect(a.destination); g.gain.value=0.05; o.start(a.currentTime+i*0.11); o.stop(a.currentTime+i*0.11+0.12); }); }catch(e){}
    setTimeout(function(){ b.style.opacity='0'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); busy=false; },600); },1900);
  }
  window.MO_MVP=celebrate;
  function hookVisible(el){ if(!el)return; var was=false; new MutationObserver(function(){ var vis=getComputedStyle(el).display!=='none'&&getComputedStyle(el).opacity!=='0'; if(vis&&!was){ was=true; celebrate(); } else if(!vis){ was=false; } }).observe(el,{attributes:true,attributeFilter:['style','class']}); }
  function hookText(el){ if(!el)return; var was=false; new MutationObserver(function(){ var t=(el.textContent||'').trim(); if(t&&!was){ was=true; celebrate(); } else if(!t){ was=false; } }).observe(el,{childList:true,characterData:true,subtree:true}); }
  function init(){ hookVisible(document.getElementById('over')); hookText(document.getElementById('win')); }
  if(document.readyState!=='loading')init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

</body></html>
