<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MO Arff Farmer</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;background:#0c0620;color:#fff;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#3a7a2a;}
 canvas{touch-action:none;display:block;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
 a.back{position:fixed;top:8px;left:10px;color:#fff;opacity:.95;text-decoration:none;font-size:13px;z-index:5;font-weight:bold;text-shadow:0 1px 3px #000;}
</style>
</head>
<body>
<a class="back" href="../games.html">&#11013; Games</a>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function woof(){ bp(420,0.12,'square',0.14); setTimeout(function(){bp(300,0.14,'square',0.12);},90); }
function chore(){ bp(640,0.08,'triangle',0.16); setTimeout(function(){bp(900,0.09,'triangle',0.16);},70); }
function no(){ bp(200,0.1,'square',0.1); }
function fanfare(){ [660,880,990,1180].forEach(function(f,i){ setTimeout(function(){ bp(f,0.14,'triangle',0.16); },i*120); }); }

var JB={x:66,y:H-58,r:44}, AB={x:W-58,y:H-60,r:46};
var joyId=null,joyX=0,joyY=0,aId=null;
function inC(p,c){ return Math.hypot(p.x-c.x,p.y-c.y)<=c.r+10; }
function pt(e){ var r=cv.getBoundingClientRect(); var t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/scale,y:(t.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(won){ if(p.x>PB.x-PB.w/2&&p.x<PB.x+PB.w/2&&p.y>PB.y-PB.h/2&&p.y<PB.y+PB.h/2){ chore(); restart(); } return; }
  if(inC(p,AB)){ aId=e.pointerId; doChore(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });
function endPtr(e){ if(e.pointerId===joyId)joyId=null; if(e.pointerId===aId)aId=null; }
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

var arff={x:W/2,y:H-170,step:0}, dir=1;
var JOBS=[
 {k:'guard',  e:'🦴', n:'Guard the gate',      x:200, y:118},
 {k:'feed',   e:'🍖', n:'Feed the animals',    x:74,  y:178},
 {k:'eggs',   e:'🥚', n:'Collect the eggs',    x:326, y:178},
 {k:'herd',   e:'🐑', n:'Herd the sheep',      x:74,  y:255},
 {k:'fetch',  e:'🗞️', n:'Fetch the news',       x:200, y:255},
 {k:'water',  e:'💧', n:'Water the garden',    x:326, y:255},
 {k:'harvest',e:'🥕', n:'Harvest the veggies', x:74,  y:332},
 {k:'shoo',   e:'🌽', n:'Shoo the crows',      x:200, y:332},
 {k:'tidy',   e:'🧹', n:'Tidy the farm',       x:326, y:332},
 {k:'cart',   e:'🛷', n:'Pull the cart',       x:200, y:408}
];
JOBS.forEach(function(j){ j.done=false; j.pop=0; });
var day=1, MAXDAY=10, coins=0, doneCount=0, won=false, msg='🐾 Run Arff to each glowing chore and press DO!', msgT=3.8, pops=[], t=0;
var PB={x:W/2,y:H*0.66,w:200,h:62};
var meow={x:120,y:H-120,t:1,tx:120,ty:H-120};
function d(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function moveTo(o,tx,ty,sp){ var dx=tx-o.x, dy=ty-o.y, m=Math.hypot(dx,dy); if(m<1)return; o.x+=dx/m*Math.min(sp,m); o.y+=dy/m*Math.min(sp,m); }
function showMsg(x){ msg=x; msgT=1.9; }
function nearestJob(){ var best=null,bd=52; for(var i=0;i<JOBS.length;i++){ var j=JOBS[i]; if(j.done)continue; var dd=d(arff,j); if(dd<bd){ bd=dd; best=j; } } return best; }
function newDay(){ JOBS.forEach(function(j){ j.done=false; j.pop=0; }); doneCount=0; arff.x=W/2; arff.y=H-170; }
function doChore(){ if(won) return; var j=nearestJob();
  if(!j){ showMsg('🐾 Run onto a glowing chore, then press DO!'); no(); return; }
  j.done=true; j.pop=1; doneCount++; coins+=2; chore(); woof();
  for(var i=0;i<12;i++) pops.push({x:j.x,y:j.y,vx:(Math.random()-0.5)*150,vy:-Math.random()*150-40,t:0.7,e:['⭐','✨','💛','🪙'][i%4]});
  if(doneCount>=JOBS.length){ coins+=10; fanfare();
    if(day>=MAXDAY){ won=true; return; }
    day++; newDay(); showMsg('🎉 Day '+(day-1)+' done! +10 🪙 bonus — Day '+day+' chores!'); }
  else showMsg('✅ '+j.n+'! ('+doneCount+'/'+JOBS.length+')');
}
function restart(){ day=1; coins=0; won=false; pops=[]; newDay(); showMsg('🐾 Run Arff to each chore and press DO!'); }
function upd(dt){ t+=dt; if(msgT>0)msgT-=dt;
  var v=jv(); var mv=Math.hypot(v.x,v.y); if(mv>0.15){ arff.x=clamp(arff.x+v.x*175*dt,22,W-22); arff.y=clamp(arff.y+v.y*175*dt,104,H-150); arff.step+=dt*12; if(v.x<-0.1)dir=-1; else if(v.x>0.1)dir=1; }
  // Meow the cat wanders
  meow.t-=dt; if(meow.t<=0){ meow.tx=50+Math.random()*(W-100); meow.ty=H-250+Math.random()*120; meow.t=2+Math.random()*2.5; } moveTo(meow,meow.tx,meow.ty,45*dt);
  for(var i=0;i<JOBS.length;i++){ if(JOBS[i].pop>0) JOBS[i].pop-=dt*1.6; }
  for(var i=pops.length-1;i>=0;i--){ var p=pops[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=380*dt; p.t-=dt; if(p.t<=0)pops.splice(i,1); }
}
function drawArff(x,y){ var bob=Math.sin(arff.step)*2; cx.save(); cx.translate(x,y+bob); cx.scale(dir,1);
  // tail
  cx.strokeStyle='#f3f3f3'; cx.lineWidth=5; cx.lineCap='round'; cx.beginPath(); cx.moveTo(-14,-2); cx.quadraticCurveTo(-24,-8,-20,-16+Math.sin(arff.step*2)*4); cx.stroke();
  // legs
  cx.fillStyle='#e8e8e8'; var ls=Math.sin(arff.step)*3; cx.fillRect(-11,8+ls,5,10); cx.fillRect(6,8-ls,5,10);
  // body
  cx.fillStyle='#fff'; rr(-15,-8,30,18,9); cx.fill();
  // head
  cx.beginPath(); cx.arc(13,-8,11,0,7); cx.fill();
  // ear
  cx.fillStyle='#e0e0e0'; cx.beginPath(); cx.ellipse(9,-16,4,7,-0.4,0,7); cx.fill();
  // snout + nose
  cx.fillStyle='#fff'; cx.beginPath(); cx.arc(21,-5,5,0,7); cx.fill(); cx.fillStyle='#2a1a12'; cx.beginPath(); cx.arc(24,-5,2,0,7); cx.fill();
  // eye
  cx.fillStyle='#2a1a12'; cx.beginPath(); cx.arc(14,-10,1.8,0,7); cx.fill();
  // collar
  cx.strokeStyle='#e0453a'; cx.lineWidth=2.5; cx.beginPath(); cx.arc(13,-6,10,0.5,2.0); cx.stroke();
  cx.restore();
  cx.fillStyle='#fff'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.fillText('ARFF',x,y+bob+22);
}
function draw(){
  cx.fillStyle='#4ea63a'; cx.fillRect(0,0,W,H); cx.fillStyle='#43992f'; for(var y=0;y<H;y+=28)for(var x=(y/28%2)*28;x<W;x+=56)cx.fillRect(x,y,28,14);
  // barn + Mo helper
  cx.fillStyle='#b4342a'; cx.fillRect(W/2-24,60,48,30); cx.fillStyle='#8a251d'; cx.beginPath(); cx.moveTo(W/2-28,60); cx.lineTo(W/2,44); cx.lineTo(W/2+28,60); cx.fill(); cx.fillStyle='#f0e6d2'; cx.fillRect(W/2-7,70,14,20);
  emoji('🧑‍🌾',W/2+40,78,24);
  // job stations
  for(var i=0;i<JOBS.length;i++){ var j=JOBS[i]; var near=nearestJob()===j;
    if(j.done){ cx.save(); cx.globalAlpha=0.55; emoji(j.e,j.x,j.y,26); cx.restore(); cx.fillStyle='#2ec46a'; cx.font='bold 13px Trebuchet MS'; cx.textAlign='center'; cx.fillText('✓',j.x+20,j.y-16); }
    else { if(near){ cx.save(); cx.globalAlpha=0.7+Math.sin(t*6)*0.3; cx.strokeStyle='#fff'; cx.lineWidth=2; cx.setLineDash([5,5]); cx.beginPath(); cx.arc(j.x,j.y,26,0,7); cx.stroke(); cx.setLineDash([]); cx.restore(); }
      emoji(j.e,j.x,j.y,28); cx.fillStyle='#fff'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.fillText(near?'DO HERE':j.n.split(' ')[0].toUpperCase(),j.x,j.y+30); } }
  // Meow the cat
  emoji('🐱',meow.x,meow.y,20);
  // Arff
  drawArff(arff.x,arff.y);
  // pops
  pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.5); emoji(p.e,p.x,p.y,16); cx.globalAlpha=1; });
  // HUD
  cx.fillStyle='rgba(10,30,10,.55)'; rr(8,8,W-16,32,10); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 12px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🐕 Day '+day+'/'+MAXDAY,14,30); cx.textAlign='center'; cx.fillStyle='#ffe6b0'; cx.fillText('✅ '+doneCount+'/'+JOBS.length+' chores',W/2,30); cx.textAlign='right'; cx.fillStyle='#ffd23f'; cx.fillText('🪙 '+coins,W-14,30);
  if(msgT>0){ cx.globalAlpha=Math.min(1,msgT*1.4); cx.textAlign='center'; cx.fillStyle='#fff'; cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=4; cx.font='bold 15px Trebuchet MS'; cx.strokeText(msg,W/2,H-180); cx.fillText(msg,W/2,H-180); cx.globalAlpha=1; }
  // controls
  var v=jv(); cx.fillStyle='rgba(255,255,255,.16)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill(); cx.fillStyle='rgba(0,0,0,.4)';cx.font='bold 10px Trebuchet MS';cx.textAlign='center';cx.fillText('RUN',JB.x,JB.y+JB.r+12);
  cx.fillStyle=aId!==null?'#ffd23f':'rgba(255,210,63,.95)'; cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle='#2a1400'; cx.font='bold 16px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('DO',AB.x,AB.y); cx.textBaseline='alphabetic';
  // WIN screen
  if(won){ cx.fillStyle='rgba(8,20,8,0.82)'; cx.fillRect(0,0,W,H); cx.textAlign='center';
    cx.fillStyle='#ffd23f'; cx.font='bold 32px Trebuchet MS'; cx.fillText('🎉 YOU WIN! 🎉',W/2,H*0.30);
    cx.fillStyle='#fff'; cx.font='bold 16px Trebuchet MS'; cx.fillText('Arff did all '+MAXDAY+' days of chores!',W/2,H*0.40);
    cx.fillStyle='#ffe6b0'; cx.font='bold 22px Trebuchet MS'; cx.fillText('🪙 TOTAL: '+coins+' coins',W/2,H*0.49);
    cx.fillStyle='#2ec46a'; rr(PB.x-PB.w/2,PB.y-PB.h/2,PB.w,PB.h,14); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 22px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('▶ PLAY AGAIN',PB.x,PB.y); cx.textBaseline='alphabetic';
    pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.5); emoji(p.e,p.x,p.y,18); cx.globalAlpha=1; }); }
}
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window._AF={ get day(){return day;}, get coins(){return coins;}, get done(){return doneCount;}, get total(){return JOBS.length;}, get won(){return won;}, setArff:function(x,y){arff.x=x;arff.y=y;}, atJob:function(i){ arff.x=JOBS[i].x; arff.y=JOBS[i].y; }, nextJob:function(){ for(var i=0;i<JOBS.length;i++) if(!JOBS[i].done){ arff.x=JOBS[i].x; arff.y=JOBS[i].y; return; } }, act:function(){doChore();}, restart:function(){restart();} };
})();
</script>
</body>
</html>
