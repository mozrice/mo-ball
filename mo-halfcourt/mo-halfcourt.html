<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MO HALF-COURT HERO</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#20143a;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;font-weight:bold;text-shadow:0 2px 0 #0007;}
  .pill{background:#0008;border-radius:20px;padding:6px 14px;font-size:17px;}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:15px;color:#e7d6ff;pointer-events:none;text-shadow:0 1px 2px #000;}
  #msg{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:38px;font-weight:bold;color:#ffd23f;text-shadow:0 3px 0 #0008,0 0 18px #ffae00;pointer-events:none;opacity:0;transition:opacity .12s;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#20143add;text-align:center;}
  #over h1{font-size:38px;margin:0 0 6px;color:#ffd23f;} #over p{font-size:20px;margin:4px;}
  .btn{margin-top:16px;background:linear-gradient(#ff9f43,#f0722a);border:none;color:#fff;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;box-shadow:0 5px 0 #b4541a;font-family:inherit;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill">🏀 <span id="score">0</span></div>
  <div class="pill">⏱️ <span id="time">45</span>s</div>
  <div class="pill" id="distp">📏 <span id="dist">Half</span></div>
</div>
<div id="msg"></div>
<div id="hint">HOLD + RELEASE on GREEN to heave it! Longer shots = more points 🎯</div>
<div id="over"><h1 id="ot">🏀 TIME!</h1><p id="os"></p><button class="btn" id="again">Heave Again</button></div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1,GY=0,T=46,G=0.4,GC=0.84;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); GY=H*0.8; }
  addEventListener('resize',resize); resize();
  function beep(f,d,t,v){ try{var a=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());var o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.06;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.1));o.stop(a.currentTime+(d||0.1)+0.02);}catch(e){} }
  function cheer(){ beep(523,0.12,'square',0.06); setTimeout(function(){beep(784,0.18,'square',0.06);},110); }
  var hoop, ball, score, timeLeft, running, holding, meter, dist, gw, msgT, crowd, nowv=0, confetti;
  function reset(){ hoop={x:W*0.86,y:H*0.3,r:24}; score=0; timeLeft=45; running=true; holding=false; meter=0; msgT=0; confetti=[]; newBall();
    crowd=[]; for(var i=0;i<60;i++) crowd.push({x:Math.random()*W,row:Math.floor(Math.random()*3),c:['#ff8a1e','#43c6ff','#ffd23f','#ff6ad5'][Math.floor(Math.random()*4)],j:0});
    document.getElementById('over').style.display='none'; document.getElementById('score').textContent='0'; document.getElementById('time').textContent='45';
    if(!reset._t){ reset._t=setInterval(function(){ if(running){ timeLeft--; document.getElementById('time').textContent=Math.max(0,timeLeft); if(timeLeft<=0) over(); } },1000); } }
  function newBall(){ dist=0.5+Math.random()*0.5; gw=0.11-dist*0.05; ball={x:hoop.x-dist*(W*0.72),y:GY-16,vx:0,vy:0,flying:false,spin:0,frame:0,green:false};
    document.getElementById('dist').textContent=dist>0.85?'Full Court!':dist>0.68?'3/4 Court':'Half Court'; }
  function startHold(){ if(!running||ball.flying||holding)return; holding=true; meter=0; }
  function release(){ if(!holding)return; holding=false; var off=meter-GC; var pf=1+off*1.3; var perfectVy=(hoop.y-ball.y-0.5*G*T*T)/T; ball.vy=perfectVy*pf; ball.vx=(hoop.x-ball.x)/T; ball.flying=true; ball.frame=0; ball.green=Math.abs(off)<gw; beep(ball.green?520:300,0.1,'sine',0.05); }
  cv.addEventListener('mousedown',startHold); addEventListener('mouseup',release);
  cv.addEventListener('touchstart',function(e){startHold();e.preventDefault();},{passive:false}); addEventListener('touchend',release);
  addEventListener('keydown',function(e){ if(e.key===' ')startHold(); }); addEventListener('keyup',function(e){ if(e.key===' ')release(); });
  document.getElementById('again').onclick=reset;
  function showMsg(m){ var e=document.getElementById('msg'); e.textContent=m; e.style.opacity=1; msgT=1; }
  function result(made){ if(made){ var pts=Math.round(dist*10)+(ball.green?2:0); score+=pts; document.getElementById('score').textContent=score;
      showMsg((dist>0.85?'🌟 FULL COURT! +':'🏀 BANG! +')+pts); cheer(); for(var i=0;i<crowd.length;i++)crowd[i].j=1; for(var k=0;k<24;k++) confetti.push({x:hoop.x,y:hoop.y,vx:(Math.random()-0.5)*5,vy:-Math.random()*4,r:2+Math.random()*4,c:['#ffd23f','#ff6ad5','#43c6ff'][Math.floor(Math.random()*3)],life:1}); }
    else { beep(160,0.15,'sawtooth',0.05); }
    newBall(); }
  function over(){ running=false; document.getElementById('os').innerHTML='You scored <b>'+score+'</b> points! 🎯'; document.getElementById('over').style.display='flex'; }
  function update(dt){
    if(holding){ meter+=0.02*dt; if(meter>=1){ meter=1; release(); } }
    if(ball.flying){ ball.frame+=dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt; ball.vy+=G*dt; ball.spin+=0.3*dt;
      if(ball.frame>=T){ result(ball.green||Math.abs(ball.y-hoop.y)<18); return; } if(ball.y>GY+30){ result(false); } }
    for(var i=0;i<crowd.length;i++){ if(crowd[i].j>0)crowd[i].j-=0.05*dt; }
    for(var c=confetti.length-1;c>=0;c--){ var f=confetti[c]; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=0.2*dt; f.life-=0.02*dt; if(f.life<=0)confetti.splice(c,1); }
    if(msgT>0){ msgT-=0.014*dt; if(msgT<=0)document.getElementById('msg').style.opacity=0; }
  }
  function render(){
    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#3a2470'); g.addColorStop(1,'#1a1030'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#12103a'; ctx.fillRect(0,0,W,H*0.18); for(var i=0;i<crowd.length;i++){ var c=crowd[i]; ctx.fillStyle=c.c; ctx.beginPath(); ctx.arc(c.x,14+c.row*16-(c.j>0?c.j*6:0),4,0,6.29); ctx.fill(); }
    // court floor
    ctx.fillStyle='#d0904e'; ctx.fillRect(0,GY,W,H-GY); ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(W*0.5,GY); ctx.lineTo(W*0.5,H); ctx.stroke(); // half line
    ctx.beginPath(); ctx.arc(W*0.5,GY,40,Math.PI,6.29); ctx.stroke();
    // hoop
    ctx.fillStyle='#8a94a0'; ctx.fillRect(hoop.x+hoop.r+6,hoop.y-30,8,GY-(hoop.y-30));
    ctx.fillStyle='#eef3f7'; ctx.fillRect(hoop.x+hoop.r-6,hoop.y-42,20,48); ctx.strokeStyle='#c0392b'; ctx.lineWidth=3; ctx.strokeRect(hoop.x+hoop.r-6,hoop.y-42,20,48);
    ctx.strokeStyle='#ff7b00'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(hoop.x-hoop.r,hoop.y); ctx.lineTo(hoop.x+hoop.r,hoop.y); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5; for(var n=0;n<6;n++){ ctx.beginPath(); ctx.moveTo(hoop.x-hoop.r+n*(hoop.r*2/5),hoop.y); ctx.lineTo(hoop.x-hoop.r*0.6+n*(hoop.r/4),hoop.y+22); ctx.stroke(); }
    for(var c2=0;c2<confetti.length;c2++){ var f=confetti[c2]; ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle=f.c; ctx.fillRect(f.x-f.r/2,f.y-f.r/2,f.r,f.r); ctx.globalAlpha=1; }
    drawBall(ball.x,ball.y);
    draw2K();
  }
  function draw2K(){ if(ball.flying)return; var mx=ball.x+28, my=ball.y-150, mh=150, mw=18;
    ctx.fillStyle='#0009'; roundRect(mx,my,mw,mh,9); ctx.fill();
    var gy1=my+mh*(1-(GC+gw)), gy2=my+mh*(1-(GC-gw)); ctx.fillStyle='#37d06a'; ctx.fillRect(mx+2,gy1,mw-4,gy2-gy1);
    ctx.fillStyle=holding?'#ffd23f':'#888'; ctx.fillRect(mx+2,my+mh*(1-meter),mw-4,mh*meter);
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; roundRect(mx,my,mw,mh,9); ctx.stroke();
    if(!holding){ ctx.fillStyle='#fff'; ctx.font='bold 11px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('HOLD',mx+mw/2,my+mh+16); } }
  function drawBall(x,y){ var r=13; ctx.save(); ctx.translate(x,y); ctx.rotate(ball.spin);
    var grd=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.2,0,0,r); grd.addColorStop(0,'#ffb15c'); grd.addColorStop(1,'#e0701f'); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,0,r,0,6.29); ctx.fill();
    ctx.strokeStyle='#7a3d10'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,r,0,6.29); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.moveTo(0,-r); ctx.lineTo(0,r); ctx.stroke(); ctx.restore(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  var last=0;
  function loop(ts){ nowv=ts; if(!last)last=ts; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts; if(running) update(dt); render(); requestAnimationFrame(loop); }
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
