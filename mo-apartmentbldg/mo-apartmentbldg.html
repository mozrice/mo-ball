(function(){

  function fit(){ var wrap=document.getElementById('wrap'); var vw=wrap.clientWidth||400,vh=wrap.clientHeight||640;
    DPR=Math.min(window.devicePixelRatio||1,2); cv.width=Math.round(vw*DPR); cv.height=Math.round(vh*DPR);
    var sc=Math.min(vw/400,vh/640); worldScale=sc; worldOX=(vw-400*sc)/2; worldOY=(vh-640*sc)/2; cvW=vw; cvH=vh; }

  window.addEventListener('resize',fit);

  // audio + song
  var AC=null;
  function ensureAC(){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){} }
  function bp(f,d,t,v){ try{ ensureAC(); if(!AC)return; var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime; o.type=t||'square'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(v||0.06,n+0.01); g.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.12)); o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n+(d||0.12)+0.03);}catch(e){} }
  function ding(){ bp(880,0.09,'sine',0.08); setTimeout(function(){bp(1175,0.12,'sine',0.08);},90); }
  function slideSfx(){ bp(300,0.3,'sine',0.04); }
  var noiseBuf=null;
  function getNoise(){ if(noiseBuf||!AC)return noiseBuf; try{ var b=AC.createBuffer(1,Math.floor(AC.sampleRate*0.2),AC.sampleRate); var d=b.getChannelData(0); for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1; noiseBuf=b; }catch(e){} return noiseBuf; }
  function aTone(f,at,dur,type,vol){ if(!AC)return; try{ var o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,at); g.gain.exponentialRampToValueAtTime(vol,at+0.02); g.gain.exponentialRampToValueAtTime(0.0001,at+dur); o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at+dur+0.05);}catch(e){} }
  function aChord(fs,at,dur,vol){ for(var i=0;i<fs.length;i++) aTone(fs[i],at,dur,'sine',vol); }
  function aKick(at){ if(!AC)return; try{ var o=AC.createOscillator(),g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(150,at); o.frequency.exponentialRampToValueAtTime(50,at+0.12); g.gain.setValueAtTime(0.22,at); g.gain.exponentialRampToValueAtTime(0.0001,at+0.15); o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at+0.2);}catch(e){} }
  function aHat(at){ if(!AC)return; try{ var s=AC.createBufferSource(); s.buffer=getNoise(); if(!s.buffer)return; var g=AC.createGain(),f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000; g.gain.setValueAtTime(0.07,at); g.gain.exponentialRampToValueAtTime(0.0001,at+0.05); s.connect(f); f.connect(g); g.connect(AC.destination); s.start(at); s.stop(at+0.07);}catch(e){} }
  function scheduleBacking(n0){ aChord([196,262,330],n0,1.15,0.05); aChord([175,262,349],n0+1.24,1.15,0.05); aChord([196,294,392],n0+2.48,1.25,0.05); aChord([196,262,330],n0+3.66,1.6,0.06);

    for(var t=0;t<5.4;t+=0.6) aKick(n0+t); for(var h=0.3;h<5.4;h+=0.3) aHat(n0+h); }
  var songActive=false,songWord='',VOICE=null;
  var SONG=[{w:'Mo',f:262,d:0.32,say:'Moe'},{w:'Ho',f:330,d:0.30,say:'Hotel'},{w:'tel',f:392,d:0.46},{w:'',f:0,d:0.16},{w:'Mo',f:262,d:0.32,say:'Moe'},{w:'Ho',f:330,d:0.30,say:'Hotel'},{w:'tel',f:392,d:0.46},{w:'',f:0,d:0.16},{w:'nev',f:392,d:0.26,say:'never'},{w:'er',f:440,d:0.26},{w:'fail',f:349,d:0.40,say:'fail'},{w:'at',f:330,d:0.26,say:'at'},{w:'Mo',f:294,d:0.30,say:'Moe'},{w:'Ho',f:330,d:0.30,say:'Hotel'},{w:'tel!',f:523,d:0.70}];
  function pickVoice(){ try{ var vs=window.speechSynthesis.getVoices(); if(!vs.length)return; VOICE=vs.find(function(v){return /Natural|Google US English|Samantha|Aria|Jenny|Ava|Allison|Zira/i.test(v.name);})||vs.find(function(v){return /en[-_]US/i.test(v.lang);})||vs.find(function(v){return /^en/i.test(v.lang);})||vs[0]; }catch(e){} }
  try{ if(window.speechSynthesis){ pickVoice(); window.speechSynthesis.onvoiceschanged=pickVoice; } }catch(e){}
  function sing(w,fr){ try{ if(!window.speechSynthesis)return; var u=new SpeechSynthesisUtterance(w); u.pitch=Math.max(0.7,Math.min(2,fr/280)); u.rate=0.8; if(VOICE)u.voice=VOICE; window.speechSynthesis.speak(u); }catch(e){} }
  function playSong(){ if(songActive)return; songActive=true; songWord=''; ensureAC(); try{ if(window.speechSynthesis){window.speechSynthesis.cancel(); if(!VOICE)pickVoice();} }catch(e){} if(AC)scheduleBacking(AC.currentTime+0.12);

  var IX0=26,IX1=374,IY0=86,IY1=476;
  var L=30,Rr=204,CW=166, r0=90,r1=214,r2=338,CH=116;
  var FLOORS={
    0:{name:'Lobby',ic:'🛎️',bg:'#f3e3c6',zones:[
      {key:'desk',name:'Front Desk',icon:'🛎️',color:'#7aa7e0',x:30,y:90,w:166,h:98,msg:''},
      {key:'coffee',name:'Coffee Corner',icon:'☕',color:'#d6a98a',x:204,y:90,w:166,h:98,msg:''},
      {key:'market',name:'Market',icon:'🛒',color:'#f2b65c',x:30,y:194,w:166,h:98,msg:''},
      {key:'elev',name:'Elevator',icon:'🛗',color:'#ffce54',x:204,y:194,w:166,h:98,msg:''}
    ]},
    1:{name:'Dining',ic:'🍽️',bg:'#f0e0d0',zones:[
      {key:'buffet',name:'Breakfast Buffet',icon:'🥐',color:'#f2c777',x:L,y:r0,w:CW,h:CH,msg:'🥐 The big breakfast buffet — yum!'},
      {key:'cafe',name:'Cafe Sierra',icon:'🍽️',color:'#e79ec4',x:Rr,y:r0,w:CW,h:CH,msg:'🍽️ Cafe Sierra — sit-down dinner.'},
      {key:'roomsvc',name:'Room Service',icon:'🛎️',color:'#9ec9e7',x:L,y:r1,w:CW,h:CH,msg:'🛎️ Room Service, open 24 hours!'},
      {key:'ballroom',name:'Ballroom',icon:'🎉',color:'#c7a6f2',x:Rr,y:r1,w:CW,h:CH,msg:'🎉 The big ballroom for parties!'},
      {key:'elev',name:'Elevator',icon:'🛗',color:'#ffce54',x:Rr,y:r2,w:CW,h:CH,msg:''}

    2:{name:'Pool & Gym',ic:'🏊',bg:'#cdeffb',zones:[
      {key:'pool',name:'Outdoor Pool',icon:'🏊',color:'#73cfe6',x:L,y:r0,w:CW,h:CH,msg:'🏊 The outdoor pool — splash!'},
      {key:'hottub',name:'Hot Tub',icon:'♨️',color:'#f2a6a6',x:Rr,y:r0,w:CW,h:CH,msg:'♨️ The warm, bubbly hot tub.'},

      {key:'room',name:'Room',icon:'🛏️',color:'#c7b6e0',x:30,y:90,w:166,h:98,msg:''},
      {key:'room',name:'Room',icon:'🛏️',color:'#b6c7e0',x:204,y:90,w:166,h:98,msg:''},
      {key:'room',name:'Room',icon:'🛏️',color:'#e0c7b6',x:30,y:194,w:166,h:98,msg:''},
      {key:'room',name:'Room',icon:'🛏️',color:'#c7e0b6',x:204,y:194,w:166,h:98,msg:''},
      {key:'room',name:'Room',icon:'🛏️',color:'#e0b6d2',x:30,y:298,w:166,h:98,msg:''},
      {key:'elev',name:'Elevator',icon:'🛗',color:'#ffce54',x:204,y:298,w:166,h:98,msg:''}

    4:{name:'Rooftop',ic:'🌇',bg:'#bcd9f2',zones:[
      {key:'rooflounge',name:'Rooftop Lounge',icon:'🛋️',color:'#e7c08a',x:L,y:r0,w:CW,h:CH,msg:'🛋️ The rooftop lounge — kick back!'},
      {key:'sunset',name:'Sunset View',icon:'🌇',color:'#f2a65c',x:Rr,y:r0,w:CW,h:CH,msg:'🌇 Watch the L.A. sunset up high!'},
      {key:'elev',name:'Elevator',icon:'🛗',color:'#ffce54',x:L,y:r1,w:CW,h:CH,msg:''}

    5:{name:'MO KIDS HOTEL',ic:'🧒',bg:'#ffe3f1',zones:[
      {key:'ballpit',name:'Ball Pit',icon:'🏐',color:'#ff9fb0',x:L,y:r0,w:CW,h:CH,msg:''},
      {key:'arcade',name:'Arcade',icon:'🎮',color:'#9fd0ff',x:Rr,y:r0,w:CW,h:CH,msg:''},
      {key:'bounce',name:'Bounce House',icon:'🎪',color:'#ffd27f',x:L,y:r1,w:CW,h:CH,msg:''},
      {key:'toys',name:'Toy Room',icon:'🧸',color:'#b9f29f',x:Rr,y:r1,w:CW,h:CH,msg:''},
      {key:'hoops',name:'Mini Hoops',icon:'🏀',color:'#f2b06a',x:L,y:r2,w:CW,h:CH,msg:''},
      {key:'shuttle',name:'Shuttle Back',icon:'🚐',color:'#8fd0a0',x:Rr,y:r2,w:CW,h:CH,msg:''}
    ]}
  };
  var NFLOORS=5;
  // put every room into a left/right column so there's a center hallway
  (function(){ for(var f in FLOORS){ var zs=FLOORS[f].zones; var fn=(f==='5'?0:(+f+1)), cnt=1; for(var i=0;i<zs.length;i++){ var z=zs[i]; var lft=(z.x+z.w/2)<200; z.x=lft?30:232; z.w=138; z.num=(z.key==='elev')?null:(fn>0?fn*100+(cnt++):cnt++); } } })();
  function curZones(){ return FLOORS[floor].zones; }
  function zoneAt(x,y){ var z=curZones(); for(var i=0;i<z.length;i++){ var r=z[i]; if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return r; } return null; }
  // the Free Shuttle, Arena Shuttle and Valet are OUTSIDE MO HOTEL (on the curb), not rooms
  var VS={x:26,y:410,w:102,h:58}, VALETSPOT={key:'valet'};
  var SS={x:136,y:410,w:100,h:58}, SHUTTLESPOT={key:'shuttle'};
  var AS={x:244,y:410,w:124,h:58}, ARENASPOT={key:'arena'};
  function inRect(x,y,R){ return x>R.x&&x<R.x+R.w&&y>R.y&&y<R.y+R.h; }
  function activeZone(x,y){ if(floor===0){ if(inRect(x,y,SS)) return SHUTTLESPOT; if(inRect(x,y,VS)) return VALETSPOT; if(inRect(x,y,AS)) return ARENASPOT; } return zoneAt(x,y); }
  // walls + doorways + center hallway
  var WALLW=7, HX0=168, HX1=232, DOORH=48;
  function interior(z){ return {x:z.x+WALLW,y:z.y+WALLW,w:z.w-2*WALLW,h:z.h-2*WALLW}; }
  function roomDoor(z){ var lft=(z.x+z.w/2)<200, dy=z.y+z.h/2-DOORH/2; return lft?{x:z.x+z.w-WALLW-3,y:dy,w:WALLW*2+6,h:DOORH}:{x:z.x-WALLW-3,y:dy,w:WALLW*2+6,h:DOORH}; }
  function hallBottom(){ return floor===0?402:IY1; }
  function walkable(x,y){ if(floor===0&&y>=400) return true; if(x>HX0&&x<HX1&&y>IY0&&y<hallBottom()) return true; var zs=curZones(); for(var i=0;i<zs.length;i++){ var z=zs[i]; var I=interior(z); if(x>I.x&&x<I.x+I.w&&y>I.y&&y<I.y+I.h) return true; var D=roomDoor(z); if(x>D.x&&x<D.x+D.w&&y>D.y&&y<D.y+D.h) return true; } return false; }

  var px=200,py=240,pdir=1,pwalk=0,rideT=0,rideTarget=0,shuttleT=0,shuttleDest=0,carT=0;
  var inZone=null, dwellZone=null, dwellT=0, dwellArmed=true, doorOpen=0, inPool=false, inHotTub=false;
  function rideNext(){ rideTarget=(floor+1)%NFLOORS; rideT=1.0; slideSfx(); }
  function shuttleRide(){ shuttleDest=(floor===5)?0:5; shuttleT=1.7; slideSfx(); }
  function arenaRide(){ shuttleDest='arena'; shuttleT=1.7; slideSfx(); }
  function parkCar(){ if(carT>0)return; carT=1.4; bp(150,0.25,'sawtooth',0.05); setTimeout(function(){bp(230,0.2,'sawtooth',0.04);},160); }

  }

    var items=['🍔 One juicy burger!','🍟 Crispy fries!','🌭 A hot dog too!','🥤 A cold lemonade!','🍦 And ice cream! Enjoy, Mo!'];

    setTimeout(function(){ orderBusy=false; }, items.length*1100+300);

  function onEnter(z){ if(z.key==='elev'){ rideNext(); } else if(z.key==='desk'){ showMsg(CHECKIN[frontDeskN%CHECKIN.length],2); frontDeskN++; ding(); } else if(z.key==='bellhop'){ showMsg(BELLHOP[bellhopN%BELLHOP.length],2); bellhopN++; coins++; ding(); } else if(z.msg){ showMsg(z.msg,1.8); bp(620,0.07,'sine',0.05); } }

  var pops=[], POPC=['#ff6b6b','#ffd23f','#4fd18b','#3a7bd5','#e07be0','#ffa64f'];

  // input: joystick only (no buttons)

  function handleDown(id,x,y){ ensureAC();

  function onDown(e){ var p=e.changedTouches?e.changedTouches:[e]; for(var k=0;k<p.length;k++){ var t=p[k],w=toWorld(t.clientX,t.clientY); handleDown(t.identifier!=null?t.identifier:'m',w.x,w.y); } }
  function onMove(e){ var p=e.changedTouches?e.changedTouches:[e]; for(var k=0;k<p.length;k++){ var t=p[k],id=t.identifier!=null?t.identifier:'m'; if(joy.active&&joy.id===id){ var w=toWorld(t.clientX,t.clientY); joy.kx=w.x; joy.ky=w.y; } } }
  function onUp(e){ var p=e.changedTouches?e.changedTouches:[e]; for(var k=0;k<p.length;k++){ var t=p[k],id=t.identifier!=null?t.identifier:'m'; if(joy.active&&joy.id===id){ joy.active=false; joy.id=null; } } }

  var petArff={x:200,y:466,tx:200,ty:466,t:0};
  var blueDog={x:200,y:300,tx:200,ty:300,t:0};

    else if(inHotTub){ cx.strokeStyle='rgba(255,255,255,.55)'; cx.lineWidth=2; cx.beginPath(); cx.ellipse(px,py+3,14,5,0,0,7); cx.stroke(); }
  }

  function drawJoystick(){ cx.fillStyle='rgba(0,0,0,.28)'; cx.beginPath(); cx.arc(joyBaseX,joyBaseY,JR,0,7); cx.fill(); var v=jv(),kx=joyBaseX+v.x*JR,ky=joyBaseY+v.y*JR; cx.fillStyle='rgba(255,255,255,.85)'; cx.beginPath(); cx.arc(kx,ky,JR*0.5,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.5)'; emo('✛',joyBaseX,joyBaseY-JR-12,16); }
  function drawCoins(){ txt('Walk around MO HOTEL!',W/2,52,15,'#fff'); }

  function drawShuttleRide(){
    cx.fillStyle='rgba(20,30,55,.6)'; cx.fillRect(0,0,W,H);
    var g=cx.createLinearGradient(0,IY0,0,H*0.55); g.addColorStop(0,'#8fc7f5'); g.addColorStop(1,'#cfe8ff'); cx.fillStyle=g; cx.fillRect(0,IY0,W,H*0.55-IY0);
    cx.fillStyle='#5b5b66'; cx.fillRect(0,H*0.55,W,64);
    cx.fillStyle='#f2d24a'; var off=(Date.now()/60)%40; for(var i=-1;i<W/40+1;i++){ cx.fillRect(i*40-off,H*0.57,20,5); }
    emo('🌴',60,H*0.44,40); emo('🌴',W-70,H*0.4,36); emo('🏢',W*0.5,H*0.4,34);
    var e=1-(shuttleT/1.7); var bx=-70+(W+140)*e; emo('🚐',bx,H*0.52,54);
    txt(shuttleDest==='arena'?'🏀 Riding to MO HOTEL ARENA!':(shuttleDest===5?'🚐 Riding to MO KIDS HOTEL!':'🚐 Riding back to MO HOTEL!'),W/2,H*0.3,18,'#fff');
    txt('Wait for the shuttle...',W/2,H*0.37,13,'#dfe');
  }
  function drawElevRide(){
    // elevator doors sliding closed then open across the room
    var e=1-(rideT/1.0); var cover=e<0.5?(e/0.5):(1-(e-0.5)/0.5);
    var half=(IX1-IX0)/2, w=half*cover;
    cx.fillStyle='#9aa3b2'; cx.fillRect(IX0,IY0,w,IY1-IY0); cx.fillRect(IX1-w,IY0,w,IY1-IY0);
    cx.strokeStyle='#6c7686'; cx.lineWidth=3; cx.strokeRect(IX0,IY0,w,IY1-IY0); cx.strokeRect(IX1-w,IY0,w,IY1-IY0);
    if(cover>0.8){ emo('🛗',W/2-34,H*0.42,48); emo('👦',W/2+36,H*0.42,40); txt('Going to '+FLOORS[rideTarget].name+'...',W/2,H*0.52,16,'#fff'); txt('👋 Mo says hi!',W/2,H*0.585,13,'#ffd23f'); }
  }

  function drawArrive(){
    var T=arriveT;
    function L(a,b,u){ u=u<0?0:(u>1?1:u); return a+(b-a)*u; }
    emo('☀️',W*0.13,H*0.10,30); emo('☁️',W*0.62,H*0.09,34); emo('☁️',W*0.87,H*0.15,24);
    // road / ground
    cx.fillStyle='#6b6f78'; cx.fillRect(0,H*0.80,W,H*0.20);
    cx.fillStyle='#8a8f98'; cx.fillRect(0,H*0.80,W,6);
    cx.fillStyle='#f2d24a'; for(var rd=10;rd<W;rd+=46){ cx.fillRect(rd,H*0.90,24,5); }
    emo('🌴',34,H*0.72,56); emo('🌴',W-34,H*0.70,50);
    // the big MO HOTEL building
    var bx=W*0.17,bw=W*0.66,by=H*0.17,bh=H*0.63;
    cx.fillStyle='#efe2c4'; rr(bx,by,bw,bh,12); cx.fill();
    cx.strokeStyle='rgba(120,90,50,.35)'; cx.lineWidth=2; rr(bx,by,bw,bh,12); cx.stroke();
    for(var wy=by+40; wy<by+bh-74; wy+=34){ for(var wx=bx+16; wx<bx+bw-24; wx+=38){
      var lit=(((wx+wy)|0)%3)===0; cx.fillStyle=lit?'#ffe9a8':'#bcd7ef'; rr(wx,wy,24,20,3); cx.fill(); } }
    // big sign on top — sparkles while you "read the sign"
    var reading=(T>=2.4&&T<3.6);
    cx.fillStyle='#b3423a'; rr(W/2-98,by-34,196,30,8); cx.fill();
    txt('MO HOTEL',W/2,by-19,reading?22:19,reading?'#fff1a8':'#ffd23f');
    if(reading){ emo('✨',W/2-88,by-19,16); emo('✨',W/2+88,by-19,16); }
    // door + striped awning
    var dw=72,dh=56,dx=W/2-dw/2,dy=by+bh-dh;
    var aw=104,ax=W/2-aw/2,ay=dy-20;
    cx.save(); rr(ax,ay,aw,20,6); cx.clip();
    for(var s=0;s<aw;s+=14){ cx.fillStyle=(((s/14)|0)%2)?'#f2f2f7':'#c23b34'; cx.fillRect(ax+s,ay,14,20); } cx.restore();
    cx.fillStyle='#c23b34'; for(var sc=0;sc<aw;sc+=14){ cx.beginPath(); cx.moveTo(ax+sc,ay+20); cx.lineTo(ax+sc+7,ay+26); cx.lineTo(ax+sc+14,ay+20); cx.closePath(); cx.fill(); }
    cx.fillStyle='#8fbfe0'; rr(dx,dy,dw,dh,4); cx.fill();
    cx.strokeStyle='#5a7a98'; cx.lineWidth=2; cx.strokeRect(dx,dy,dw,dh); cx.beginPath(); cx.moveTo(W/2,dy); cx.lineTo(W/2,dy+dh); cx.stroke();
    // the taxi arriving
    var road=H*0.83, carx, cary=road, cs=30;
    if(T<1.6){ carx=L(-70,W*0.30,T/1.6); }
    else if(T<3.6){ carx=W*0.30; }
    else if(T<4.8){ var u=(T-3.6)/1.2; carx=L(W*0.30,W*0.5,u); cary=L(road,dy+dh-10,u); cs=L(30,24,u); }
    else { carx=W*0.5; cary=dy+dh-10; cs=24; }
    cx.globalAlpha=0.18; cx.fillStyle='#000'; cx.beginPath(); cx.ellipse(carx,cary+11,cs*0.6,5,0,0,7); cx.fill(); cx.globalAlpha=1;
    emo('🚕',carx,cary,cs);
    if(T>=5.1){ emo('👦',carx-20,cary-2,20); }
    // caption banner — the 5 steps
    var caps=[[0,'🚕 Pull up to the front'],[1.2,'🏨 See the big hotel'],[2.4,'🪧 Read the sign — MO HOTEL!'],[3.6,'⛱️ Drive under the awning'],[4.8,'🚪 Stop at the front door']];
    var cap=caps[0][1], step=0; for(var c=0;c<caps.length;c++){ if(T>=caps[c][0]){ cap=caps[c][1]; step=c; } }
    cx.fillStyle='rgba(0,0,0,.62)'; rr(W/2-184,H-88,368,44,11); cx.fill();
    txt(cap,W/2,H-66,16,'#fff');
    for(var d=0;d<5;d++){ cx.fillStyle=(d<=step)?'#ffd23f':'rgba(255,255,255,.35)'; cx.beginPath(); cx.arc(W/2-32+d*16,H-50,4,0,7); cx.fill(); }
    txt('tap to skip →',W/2,H-26,11,'#cfe');
  }
  function drawMenu(){ cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(0,0,W,H); emo('🏨',W/2,H*0.22,74); txt('MO HOTEL',W/2,H*0.36,42,'#ffd23f'); txt('Walk in all the rooms!',W/2,H*0.43,18,'#fff');
    btn(W/2-110,H*0.50,220,56,'#4fd18b','▶ PLAY',24,'#fff'); btn(W/2-110,H*0.60,220,50,'#e0659a','🎵 MO SONG',20,'#fff');
    txt('Use the joystick to walk around.',W/2,H*0.70,13,'#dfe'); txt('Walk around and see all the rooms.',W/2,H*0.74,13,'#dfe'); txt('🛗 Elevator = floors.  🚐 Shuttle = theme park!',W/2,H*0.78,12,'#ffd'); }

  function draw(){ cx.setTransform(DPR,0,0,DPR,0,0); cx.fillStyle='#16233f'; cx.fillRect(0,0,cvW,cvH); cx.setTransform(DPR*worldScale,0,0,DPR*worldScale,DPR*worldOX,DPR*worldOY);
    var g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2f4a7a'); g.addColorStop(1,'#45689c'); cx.fillStyle=g; cx.fillRect(0,0,W,H);
    if(state==='arrive'){ drawArrive(); return; }
    cx.fillStyle='#b3423a'; rr(IX0-2,IY0-36,IX1-IX0+4,30,8); cx.fill(); txt((floor===5?'🏨 MO KIDS HOTEL':'🏨 MO HOTEL · Floor '+(floor+1)+' · '+FLOORS[floor].name),(IX0+IX1)/2,IY0-21,13,'#fff');
    drawRoam();
    for(var i=0;i<pops.length;i++){ var p=pops[i]; cx.globalAlpha=Math.max(0,Math.min(1,p.life)); cx.fillStyle=p.c; cx.fillRect(p.x-3,p.y-3,6,6); } cx.globalAlpha=1;
    if(state==='menu'){ drawMenu(); return; }
    drawCoins(); drawJoystick();
    if(rideT>0) drawElevRide();
    if(shuttleT>0) drawShuttleRide();
    if(songActive){ cx.fillStyle='rgba(18,18,48,.82)'; rr(12,IY0-2,W-24,70,12); cx.fill(); var bo=Math.abs(Math.sin(Date.now()/160))*6; txt(songWord||'🎵',W/2,IY0+24-bo,28,'#ffd23f'); txt('Mo Hotel, Mo Hotel, never fail at Mo Hotel!',W/2,IY0+54,13,'#fff'); }
    if(msgT>0){ var a=Math.min(1,msgT); cx.globalAlpha=a; cx.fillStyle='rgba(0,0,0,.65)'; rr(W/2-172,H*0.5-22,344,44,11); cx.fill(); txt(msg,W/2,H*0.5,15,'#fff'); cx.globalAlpha=1; } }

  var last=0;
  function loop(t){ var dt=Math.min((t-last)/1000,0.05); last=t; for(var i=pops.length-1;i>=0;i--){ var p=pops[i]; p.life-=dt; if(p.life<=0){pops.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=360*dt; } upd(dt); draw(); requestAnimationFrame(loop); }
  fit(); requestAnimationFrame(loop);

  window._AH={ state:function(){return state;}, floor:function(){return floor;}, here:function(){ var z=zoneAt(px,py); return z?z.key:null; }, pos:function(){return {x:Math.round(px),y:Math.round(py)};}, walkable:function(x,y){return walkable(x,y);}, start:function(){ state='roam'; }, moveTo:function(x,y){ px=x; py=y; var z=zoneAt(px,py); if(z!==inZone){ inZone=z; if(z){ if(z.key==='elev')rideNext(); else if(z.key==='shuttle')shuttleRide(); } } }, rideT:function(){return rideT;}, shuttleT:function(){return shuttleT;} };
})();
</script>
