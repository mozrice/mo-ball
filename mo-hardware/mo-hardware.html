<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MO Hardware Store</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:#3a3a44;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  a.back{position:fixed;top:8px;left:10px;color:#ffd8b0;text-decoration:none;font-size:14px;z-index:5;font-weight:bold;}
  #hud{position:fixed;top:8px;left:0;right:0;text-align:center;font-size:18px;font-weight:bold;color:#ff9f43;pointer-events:none;}
  #bar{position:fixed;bottom:0;left:0;right:0;background:#1a1208ee;padding:6px 6px 8px;z-index:6;}
  #cats{display:flex;justify-content:center;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
  .cat{font-size:16px;background:#5a3a1a;border:2px solid #8a5a2a;border-radius:12px;padding:5px 8px;color:#fff;font-family:inherit;}
  .cat.sel{border-color:#ffd23f;background:#7a4a1a;}
  #items{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;}
  .it{font-size:24px;background:#2a2018;border:2px solid #6a4a2a;border-radius:12px;padding:4px 8px;font-family:inherit;color:#fff;}
  .it.sel{border-color:#ffd23f;background:#4a3418;}
  .act{font-size:13px;font-weight:bold;background:#e0662a;border:none;border-radius:12px;padding:6px 9px;color:#fff;font-family:inherit;}
</style></head>
<body>
<a class="back" href="../games.html">⬅ Games</a>
<div id="hud">🔨 MO'S HARDWARE &nbsp; 📦<span id="cnt">0</span></div>
<canvas id="c"></canvas>
<div id="bar"><div id="cats"></div><div id="items"></div></div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,DPR;
  function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',fit); fit();
  var CATS=[
    {n:'🔨 Tools',items:['🔨','🪛','🔧','🪚','🗜️','🔩','⚙️','🪝','🧰','⛏️']},
    {n:'🧱 Building',items:['🧱','🪵','🚪','🪟','🪜','🛠️','🚽','🛁','🚿','🪠']},
    {n:'🌱 Garden',items:['🌱','🌳','🪴','🌷','🌻','🍅','🧤','🌵','🪨','🐛']},
    {n:'🎨 Paint',items:['🖌️','🪣','🧴','🧽','🎨','🧯','💡','🔦','🔌','🕯️']},
    {n:'🛒 Store',items:['🛒','🏷️','📦','🧾','🛍️','🚚','🏪','🧑‍🔧','💵','📋']}
  ];
  var TILES=[ ['#c8c8c8','#a8a8a8'],['#c8a060','#a07840'],['#7ab0e0','#5a90c0'],['#e0a0a0','#c08080'],['#a0d0a0','#80b080'],['#d0d0d0','#404040'] ];
  var items=[], cat=0, cur=CATS[0].items[0], ti=0, tileSize=44;
  var cats=document.getElementById('cats'), ib=document.getElementById('items');
  CATS.forEach(function(c,i){ var b=document.createElement('button'); b.className='cat'+(i===0?' sel':''); b.textContent=c.n; b.onclick=function(){ cat=i; for(var j=0;j<cats.children.length;j++)if(cats.children[j].classList.contains('cat'))cats.children[j].classList.remove('sel'); b.classList.add('sel'); buildItems(); }; cats.appendChild(b); });
  function addAct(l,fn){ var b=document.createElement('button'); b.className='act'; b.innerHTML=l; b.onclick=fn; cats.appendChild(b); }
  addAct('🔲 Tile Floor',function(){ ti=(ti+1)%TILES.length; });
  addAct('🧽 Erase',function(){ cur='ERASE'; refreshSel(); });
  addAct('🧹 Clear',function(){ items=[]; document.getElementById('cnt').textContent=0; });
  function buildItems(){ ib.innerHTML=''; CATS[cat].items.forEach(function(e){ var b=document.createElement('button'); b.className='it'+(e===cur?' sel':''); b.textContent=e; b.dataset.e=e; b.onclick=function(){ cur=e; refreshSel(); }; ib.appendChild(b); }); }
  function refreshSel(){ var all=ib.querySelectorAll('.it'); for(var i=0;i<all.length;i++)all[i].classList.toggle('sel',all[i].dataset.e===cur); }
  buildItems();
  function place(e){ var t=e.changedTouches?e.changedTouches[0]:e; var r=cv.getBoundingClientRect(); var x=t.clientX-r.left,y=t.clientY-r.top; if(y>H-96||y<52)return;
    if(cur==='ERASE'){ for(var i=items.length-1;i>=0;i--){ if(Math.hypot(items[i].x-x,items[i].y-y)<22){ items.splice(i,1); break; } } }
    else { items.push({x:x,y:y,e:cur}); }
    document.getElementById('cnt').textContent=items.length; }
  var dn=false;
  cv.addEventListener('touchstart',function(e){dn=true;place(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',function(e){if(dn)place(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',function(){dn=false;});
  cv.addEventListener('mousedown',function(e){dn=true;place(e);});
  cv.addEventListener('mousemove',function(e){if(dn)place(e);});
  window.addEventListener('mouseup',function(){dn=false;});
  function loop(){ // tiled floor
    var c1=TILES[ti][0],c2=TILES[ti][1];
    for(var yy=0;yy<H;yy+=tileSize){ for(var xx=0;xx<W;xx+=tileSize){ ctx.fillStyle=((Math.floor(xx/tileSize)+Math.floor(yy/tileSize))%2)?c1:c2; ctx.fillRect(xx,yy,tileSize,tileSize); } }
    ctx.strokeStyle='#0002'; for(var yy2=0;yy2<H;yy2+=tileSize){ ctx.beginPath(); ctx.moveTo(0,yy2); ctx.lineTo(W,yy2); ctx.stroke(); } for(var xx2=0;xx2<W;xx2+=tileSize){ ctx.beginPath(); ctx.moveTo(xx2,0); ctx.lineTo(xx2,H); ctx.stroke(); }
    // store sign banner
    ctx.fillStyle='#e0662a'; ctx.fillRect(0,44,W,26); ctx.fillStyle='#fff'; ctx.font='bold 16px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🔨 MO’S HARDWARE — YOU CAN BUILD IT! 🛠️',W/2,57);
    ctx.textBaseline='middle'; ctx.textAlign='center';
    for(var i=0;i<items.length;i++){ ctx.font='28px sans-serif'; ctx.fillText(items[i].e,items[i].x,items[i].y); }
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
<script>
/* MO MVP SUPERSTAR celebration */
(function(){var busy=false;function celebrate(){if(busy)return;busy=true;var b=document.createElement('div');b.textContent='⭐ MVP SUPERSTAR! ⭐';b.style.cssText='position:fixed;left:0;right:0;top:30%;text-align:center;z-index:99999;font-family:Trebuchet MS,system-ui,sans-serif;font-weight:bold;font-size:30px;color:#fff;text-shadow:0 2px 0 #b47a1a,0 0 20px #ffd23f;pointer-events:none;transition:opacity .5s;';document.body.appendChild(b);var cvs=document.createElement('canvas');cvs.style.cssText='position:fixed;inset:0;z-index:99998;pointer-events:none;';document.body.appendChild(cvs);var x=cvs.getContext('2d');cvs.width=innerWidth;cvs.height=innerHeight;var P=[],C=['#ff5a5a','#ffd23f','#7bff9e','#43c6ff','#ff6ad5','#b06aff'];for(var i=0;i<90;i++)P.push({x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*0.5,vx:(Math.random()-0.5)*3,vy:2+Math.random()*5,c:C[i%C.length],s:5+Math.random()*7,r:Math.random()*6.28});var fr=0;(function anim(){x.clearRect(0,0,cvs.width,cvs.height);for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.r+=0.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s);x.restore();}fr++;if(fr<150)requestAnimationFrame(anim);else{if(cvs.parentNode)cvs.parentNode.removeChild(cvs);}})();try{var a=new(window.AudioContext||window.webkitAudioContext)();[660,880,990,1180].forEach(function(f,i){var o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='square';o.connect(g);g.connect(a.destination);g.gain.value=0.05;o.start(a.currentTime+i*0.11);o.stop(a.currentTime+i*0.11+0.12);});}catch(e){}setTimeout(function(){b.style.opacity='0';setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);busy=false;},600);},1900);}window.MO_MVP=celebrate;})();
</script>
</body></html>
