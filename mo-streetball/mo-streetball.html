<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
var cv=document.getElementById('cv'), cx=cv.getContext('2d');
var W=400,H=640, DPR=Math.min(window.devicePixelRatio||1,2), scale=1;
function fit(){ var ww=window.innerWidth, wh=window.innerHeight; scale=Math.min(ww/W,wh/H); cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px'; cv.width=W*DPR; cv.height=H*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',fit); fit();
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function emoji(ch,x,y,sz){ cx.font=(sz||30)+'px serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(ch,x,y); cx.textBaseline='alphabetic'; }
var AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function bp(f,d,t,v){ var a=ac(); if(!a)return; if(a.state==='suspended')a.resume(); var o=a.createOscillator(),g=a.createGain(); o.type=t||'sine'; o.frequency.setValueAtTime(f,a.currentTime); g.gain.setValueAtTime(v||0.16,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.12)); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.12)+0.02); }
function swishS(){ bp(880,0.08,'triangle',0.14); setTimeout(function(){bp(1180,0.1,'triangle',0.14);},70); }
function clank(){ bp(240,0.12,'square',0.12); }
function block(){ bp(180,0.16,'sawtooth',0.13); }
function fanfare(){ [660,880,990,1180].forEach(function(f,i){ setTimeout(function(){ bp(f,0.14,'triangle',0.16); },i*120); }); }

var JB={x:66,y:H-58,r:44}, AB={x:W-58,y:H-60,r:48}, CB={x:W-150,y:H-60,r:40};
var joyId=null,joyX=0,joyY=0,aId=null;

cv.addEventListener('pointerdown',function(e){ if(ac()&&ac().state==='suspended')ac().resume(); var p=pt(e);
  if(won){ if(p.x>PB.x-PB.w/2&&p.x<PB.x+PB.w/2&&p.y>PB.y-PB.h/2&&p.y<PB.y+PB.h/2){ swishS(); restart(); } return; }
  if(picking){ pickTap(p); return; }
  if(inC(p,CB)){ crossMove(); return; }
  if(inC(p,AB)){ aId=e.pointerId; shoot(); return; }
  if(joyId===null && p.x<W*0.6 && p.y>H*0.42){ joyId=e.pointerId; joyX=p.x; joyY=p.y; } });
cv.addEventListener('pointermove',function(e){ if(e.pointerId===joyId){ var p=pt(e); joyX=p.x; joyY=p.y; } });

window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
function jv(){ if(joyId===null)return {x:0,y:0}; return {x:clamp(joyX-JB.x,-JB.r,JB.r)/JB.r,y:clamp(joyY-JB.y,-JB.r,JB.r)/JB.r}; }

var hoop={x:W/2,y:92};
var mo={x:W/2,y:H-180,step:0}, dir=1;
var def={x:W/2,y:260,step:0};
var ball=null;                 // {t,dur,x,y,sx,sy,make,pts}
var level=1,MAXLV=10,target=3,baskets=0,score=0,oppScore=0,won=false,msg='🏀 STREETBALL! Move Mo, SHOOT in the green power zone!',msgT=3.5,pops=[],t=0,cool=0,power=0.5,pdir=1;
var PB={x:W/2,y:H*0.66,w:200,h:62};
var picking=true, OPPS=[['Daddy','#37b06a','👨'],['Mommy','#c04a8a','👩'],['Rival','#e0453a','🧑']], oppName='Rival', oppCol='#e0453a', crossCool=0, stealT=0;
function isNight(){ return level>=6; }
function d(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function newLevel(){ target=level+2; baskets=0; mo.x=W/2; mo.y=H-180; def.x=W/2; def.y=260; ball=null; cool=0; }
function shoot(){ if(won||ball||cool>0) return; var dist=d(mo,hoop); var arc=145; var pts=dist>arc?3:2; var deep=dist>235; var dunk=dist<62; if(dunk)pts=2;
  var defNear=d(mo,def)<46;
  var q=1-Math.min(1,Math.abs(power-0.5)/0.5);                 // 1 = perfect timing in the green
  var nd=clamp((dist-55)/360,0,1); var makeP=0.28+0.66*q-nd*0.22-(defNear?0.18:0); makeP=clamp(makeP,0.12,0.97);
  if(dunk) makeP=Math.max(makeP,0.92); var make=Math.random()<makeP;
  ball={t:0,dur:0.55,sx:mo.x,sy:mo.y-24,x:mo.x,y:mo.y-24,make:make,pts:pts,defNear:defNear,perfect:q>0.75,deep:deep,dunk:dunk}; cool=0.15; bp(500,0.05,'sine',0.08);
}
function resolveShot(){ var b=ball; ball=null;
  if(b.make){ baskets++; score+=b.pts; swishS(); showMsg((b.dunk?'🔨 DUNK! +':(b.deep?'🔥 DEEP! +':'🏀 SWISH! +'))+b.pts+'  ('+baskets+'/'+target+')'); for(var i=0;i<16;i++) pops.push({x:hoop.x,y:hoop.y,vx:(Math.random()-0.5)*180,vy:-Math.random()*160-30,t:0.8,e:['⭐','✨','🔥','🏀'][i%4]});

}

function pickTap(p){ var bs=pickBtns(); for(var i=0;i<bs.length;i++){ var b=bs[i]; if(p.x>b.x-b.w/2&&p.x<b.x+b.w/2&&p.y>b.y-b.h/2&&p.y<b.y+b.h/2){ oppName=b.o[0]; oppCol=b.o[1]; picking=false; newLevel(); bp(680,0.08); showMsg('🏀 Playing '+oppName+' 1-on-1! SHOOT in the green!'); return; } } }
function drawDef(){ drawBaller(def.x,def.y,oppCol,def.step,mo.x>def.x?1:-1); cx.fillStyle='#fff'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.fillText(oppName.toUpperCase(),def.x,def.y+30); }
function upd(dt){ if(picking) return; t+=dt; if(msgT>0)msgT-=dt; if(cool>0)cool-=dt; if(crossCool>0)crossCool-=dt; if(!ball&&!won){ power+=pdir*2.3*dt; if(power>=1){power=1;pdir=-1;} if(power<=0){power=0;pdir=1;} }
  var v=jv(); var mv=Math.hypot(v.x,v.y); if(!ball && mv>0.15){ mo.x=clamp(mo.x+v.x*185*dt,22,W-22); mo.y=clamp(mo.y+v.y*185*dt,150,H-150); mo.step+=dt*11; if(v.x<-0.1)dir=-1; else if(v.x>0.1)dir=1; }
  // defender chases Mo, speed scales with level
  var dspd=(40+level*9)*dt; var dx=mo.x-def.x, dy=mo.y-def.y, m=Math.hypot(dx,dy)||1; if(m>36){ def.x+=dx/m*dspd; def.y+=dy/m*dspd; } def.step+=dt*8;
  def.x=clamp(def.x,22,W-22); def.y=clamp(def.y,130,H-150);
  if(!ball){ if(d(mo,def)<34){ stealT+=dt; if(stealT>1.4){ stealT=0; mo.x=W/2; mo.y=H-180; def.x=W/2; def.y=260; block(); showMsg('🛑 '+oppName+' poked it loose — keep moving!'); } } else stealT=Math.max(0,stealT-dt*2); }
  if(ball){ ball.t+=dt; var k=Math.min(1,ball.t/ball.dur); ball.x=ball.sx+(hoop.x-ball.sx)*k; var hy=ball.make?hoop.y+4:hoop.y-6; ball.y=ball.sy+(hy-ball.sy)*k - Math.sin(k*Math.PI)*120; if(k>=1) resolveShot(); }
  for(var i=pops.length-1;i>=0;i--){ var p=pops[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=380*dt; p.t-=dt; if(p.t<=0)pops.splice(i,1); }
}
function drawBaller(x,y,col,st,dd){ var b=Math.sin(st)*2; cx.save(); cx.translate(x,y); cx.save(); cx.scale(dd,1);
  cx.fillStyle='#2a2a40'; cx.fillRect(-8,14+b,6,14); cx.fillRect(2,14-b,6,14);
  cx.fillStyle=col; rr(-11,-6,22,22,6); cx.fill();
  cx.fillStyle='#8a5a34'; cx.beginPath(); cx.arc(0,-16,10,0,7); cx.fill();
  cx.fillStyle='#3a2416'; cx.beginPath(); cx.arc(0,-20,9,Math.PI,0); cx.fill();
  cx.fillStyle='#fff'; cx.beginPath(); cx.arc(-3.5,-15,2,0,7); cx.arc(3.5,-15,2,0,7); cx.fill(); cx.fillStyle='#201008'; cx.beginPath(); cx.arc(-3.5,-15,1,0,7); cx.arc(3.5,-15,1,0,7); cx.fill();
  cx.restore(); cx.restore();
}
function draw(){
  // court
  cx.fillStyle='#55565c'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#8a3a2a'; cx.fillRect(0,0,W,70); cx.strokeStyle='#6a2a1e'; cx.lineWidth=1; for(var by=0;by<70;by+=12){ cx.beginPath(); cx.moveTo(0,by); cx.lineTo(W,by); cx.stroke(); for(var bx=((by/12)%2)*18;bx<W;bx+=36){ cx.beginPath(); cx.moveTo(bx,by); cx.lineTo(bx,by+12); cx.stroke(); } }
  cx.fillStyle='rgba(255,255,255,.05)'; for(var sp=0;sp<110;sp++){ cx.fillRect((sp*37%W),74+(sp*53%(H-80)),2,2); }
  cx.strokeStyle='rgba(220,220,220,.16)'; cx.lineWidth=1; for(var fx=0;fx<44;fx+=8){ cx.beginPath(); cx.moveTo(fx,72); cx.lineTo(0,72+fx); cx.stroke(); cx.beginPath(); cx.moveTo(W-fx,72); cx.lineTo(W,72+fx); cx.stroke(); }
  if(isNight()){ cx.fillStyle='rgba(10,14,46,0.5)'; cx.fillRect(0,70,W,H-70); [[42,78],[W-42,78]].forEach(function(L){ var gg=cx.createRadialGradient(L[0],L[1],4,L[0],L[1],170); gg.addColorStop(0,'rgba(255,245,200,0.38)'); gg.addColorStop(1,'rgba(255,245,200,0)'); cx.fillStyle=gg; cx.beginPath(); cx.arc(L[0],L[1],170,0,7); cx.fill(); cx.fillStyle='#ffe27a'; cx.fillRect(L[0]-7,L[1]-5,14,8); }); }
  cx.strokeStyle='rgba(255,255,255,.7)'; cx.lineWidth=3;
  // paint + key
  cx.strokeRect(W/2-54,70,108,150); cx.beginPath(); cx.arc(W/2,220,54,0,Math.PI); cx.stroke();
  // 3pt arc
  cx.beginPath(); cx.arc(W/2,110,150,0.15*Math.PI,0.85*Math.PI); cx.stroke();
  // backboard + hoop
  cx.fillStyle='#fff'; cx.fillRect(W/2-34,58,68,8); cx.strokeStyle='#e0453a'; cx.lineWidth=4; cx.beginPath(); cx.moveTo(W/2-16,72); cx.lineTo(W/2+16,72); cx.stroke();
  cx.strokeStyle='#ff7a1a'; cx.lineWidth=4; cx.beginPath(); cx.ellipse(hoop.x,92,18,6,0,0,7); cx.stroke();
  // net
  cx.strokeStyle='rgba(255,255,255,.8)'; cx.lineWidth=1; for(var n=0;n<7;n++){ var nx=hoop.x-16+n*5.3; cx.beginPath(); cx.moveTo(nx,92); cx.lineTo(hoop.x-8+n*2.6,110); cx.stroke(); }
  // defender then Mo (depth)
  if(def.y<mo.y){ drawDef(); drawMo(); }
  else { drawMo(); drawDef(); }
  // ball (held or in flight)
  if(ball){ cx.fillStyle='#e0821a'; cx.beginPath(); cx.arc(ball.x,ball.y,9,0,7); cx.fill(); cx.strokeStyle='#7a3a00'; cx.lineWidth=1.5; cx.beginPath(); cx.arc(ball.x,ball.y,9,0,7); cx.stroke(); cx.beginPath(); cx.moveTo(ball.x-9,ball.y); cx.lineTo(ball.x+9,ball.y); cx.moveTo(ball.x,ball.y-9); cx.lineTo(ball.x,ball.y+9); cx.stroke(); }
  else { cx.fillStyle='#e0821a'; cx.beginPath(); cx.arc(mo.x+12*dir,mo.y+4,8,0,7); cx.fill(); }
  // pops
  pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.5); emoji(p.e,p.x,p.y,16); cx.globalAlpha=1; });
  // HUD
  cx.fillStyle='rgba(10,18,10,.55)'; rr(8,8,W-16,32,10); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 12px Trebuchet MS'; cx.textAlign='left'; cx.fillText('🏀 Level '+level+'/'+MAXLV,14,30); cx.textAlign='center'; cx.fillStyle='#ffe6b0'; cx.fillText('🪣 '+baskets+'/'+target,W/2,30); cx.textAlign='right'; cx.fillStyle='#ffd23f'; cx.fillText('⭐ '+score,W-14,30);
  if(msgT>0){ cx.globalAlpha=Math.min(1,msgT*1.4); cx.textAlign='center'; cx.fillStyle='#fff'; cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=4; cx.font='bold 15px Trebuchet MS'; cx.strokeText(msg,W/2,H-178); cx.fillText(msg,W/2,H-178); cx.globalAlpha=1; }
  // controls
  var v=jv(); cx.fillStyle='rgba(255,255,255,.16)'; cx.beginPath(); cx.arc(JB.x,JB.y,JB.r,0,7); cx.fill(); cx.fillStyle='rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(JB.x+v.x*JB.r*0.8,JB.y+v.y*JB.r*0.8,18,0,7); cx.fill(); cx.fillStyle='rgba(0,0,0,.4)';cx.font='bold 10px Trebuchet MS';cx.textAlign='center';cx.fillText('MOVE',JB.x,JB.y+JB.r+12);
  cx.fillStyle=aId!==null?'#ff9a3a':'#ff7a1a'; cx.beginPath(); cx.arc(AB.x,AB.y,AB.r,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 16px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('SHOOT',AB.x,AB.y); cx.textBaseline='alphabetic';
  if(!won&&!picking){ cx.fillStyle=crossCool>0?'rgba(120,120,160,.65)':'#7a5ad0'; cx.beginPath(); cx.arc(CB.x,CB.y,CB.r,0,7); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 13px Trebuchet MS'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('CROSS',CB.x,CB.y); cx.textBaseline='alphabetic'; }
  if(picking){ cx.fillStyle='rgba(8,14,20,0.88)'; cx.fillRect(0,0,W,H); cx.textAlign='center'; cx.fillStyle='#ffd23f'; cx.font='bold 25px Trebuchet MS'; cx.fillText('🏀 WHO GUARDS YOU?',W/2,H*0.30); cx.fillStyle='#fff'; cx.font='bold 13px Trebuchet MS'; cx.fillText('Pick who you play 1-on-1',W/2,H*0.355); var bs=pickBtns(); for(var pi=0;pi<bs.length;pi++){ var pb=bs[pi]; cx.fillStyle=pb.o[1]; rr(pb.x-pb.w/2,pb.y-pb.h/2,pb.w,pb.h,14); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 20px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText(pb.o[2]+' '+pb.o[0],pb.x,pb.y); cx.textBaseline='alphabetic'; } }
  if(!won&&!picking){ var mw=184, mx=W/2-mw/2, my=H-128; cx.fillStyle='rgba(0,0,0,.5)'; rr(mx,my,mw,15,7); cx.fill();
    cx.fillStyle='rgba(55,208,106,.55)'; var sz=mw*0.24; rr(mx+mw*0.5-sz/2,my,sz,15,6); cx.fill();
    var pq=1-Math.min(1,Math.abs(power-0.5)/0.5); cx.fillStyle=pq>0.75?'#37d06a':'#ffd23f'; rr(mx+power*mw-4,my-3,8,21,3); cx.fill();
    cx.fillStyle='#fff'; cx.font='bold 10px Trebuchet MS'; cx.textAlign='center'; cx.fillText('POWER — SHOOT in the green!',W/2,my-6); }
  if(won){ cx.fillStyle='rgba(8,14,20,0.85)'; cx.fillRect(0,0,W,H); cx.textAlign='center';
    cx.fillStyle='#ffd23f'; cx.font='bold 32px Trebuchet MS'; cx.fillText('🏆 YOU WIN! 🏆',W/2,H*0.30);
    cx.fillStyle='#fff'; cx.font='bold 16px Trebuchet MS'; cx.fillText('You won all '+MAXLV+' streetball levels!',W/2,H*0.40);
    cx.fillStyle='#ffe6b0'; cx.font='bold 22px Trebuchet MS'; cx.fillText('⭐ '+score+' points',W/2,H*0.49);
    cx.fillStyle='#ff7a1a'; rr(PB.x-PB.w/2,PB.y-PB.h/2,PB.w,PB.h,14); cx.fill(); cx.fillStyle='#fff'; cx.font='bold 22px Trebuchet MS'; cx.textBaseline='middle'; cx.fillText('▶ PLAY AGAIN',PB.x,PB.y); cx.textBaseline='alphabetic';
    pops.forEach(function(p){ cx.globalAlpha=Math.max(0,p.t*1.5); emoji(p.e,p.x,p.y,18); cx.globalAlpha=1; }); }
}
function drawMo(){ drawBaller(mo.x,mo.y,'#3a86e0',mo.step,dir); cx.fillStyle='#fff'; cx.font='bold 9px Trebuchet MS'; cx.textAlign='center'; cx.fillText('MO',mo.x,mo.y+30); }
var last=performance.now();
function frame(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; upd(dt); draw(); requestAnimationFrame(frame); }
newLevel();
requestAnimationFrame(frame);
window._B1={ get level(){return level;}, get baskets(){return baskets;}, get target(){return target;}, get score(){return score;}, get won(){return won;}, setMo:function(x,y){mo.x=x;mo.y=y;}, toHoop:function(){ mo.x=hoop.x; mo.y=hoop.y+70; }, shoot:function(){shoot();}, setPower:function(p){power=p;}, pick:function(i){ var b=OPPS[i]; oppName=b[0]; oppCol=b[1]; picking=false; newLevel(); }, cross:function(){crossMove();}, picking:function(){return picking;}, hasBall:function(){return !ball;}, restart:function(){restart();} };
})();
