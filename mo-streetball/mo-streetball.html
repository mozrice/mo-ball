<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MO STREETBALL 1v1</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#3a3f47;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;font-weight:bold;text-shadow:0 2px 0 #0007;}
  .pill{background:#0008;border-radius:20px;padding:6px 14px;font-size:17px;}
  #kl{position:fixed;bottom:24px;left:3%;width:26%;height:92px;} #kr{position:fixed;bottom:24px;left:31%;width:26%;height:92px;}
  .key{border-radius:20px;border:3px solid #ffffff77;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;background:#0004;}
  #shoot{position:fixed;bottom:24px;right:3%;width:34%;height:92px;border-radius:20px;background:linear-gradient(#ff9f43,#f0722a);border:none;color:#fff;font-weight:bold;font-size:20px;}
  .key:active,#shoot:active{background:#0007;}
  #hint{position:fixed;bottom:126px;left:0;right:0;text-align:center;font-size:14px;color:#ffe;background:#0005;padding:5px;pointer-events:none;}
  #msg{position:fixed;top:36%;left:0;right:0;text-align:center;font-size:38px;font-weight:bold;color:#ffd23f;text-shadow:0 3px 0 #0008;pointer-events:none;opacity:0;transition:opacity .1s;}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#3a3f47dd;text-align:center;}
  #over h1{font-size:38px;margin:0 0 6px;color:#ffd23f;} #over p{font-size:20px;margin:4px;}
  .btn{margin-top:16px;background:linear-gradient(#ff9f43,#f0722a);border:none;color:#fff;font-weight:bold;font-size:22px;padding:14px 30px;border-radius:16px;box-shadow:0 5px 0 #b4541a;font-family:inherit;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="pill">🏀 <span id="score">0</span></div>
  <div class="pill">⏱️ <span id="time">60</span>s</div>
  <div class="pill" id="openp">🔓 <span id="open">Guarded</span></div>
</div>
<div class="key" id="kl">◀</div>
<div class="key" id="kr">▶</div>
<button id="shoot">🏀 HOLD SHOOT</button>
<div id="hint">Tap ◀▶ fast to shake your defender, then HOLD SHOOT & release on GREEN!</div>
<div id="msg"></div>
<div id="over"><h1 id="ot">🏀 GAME!</h1><p id="os"></p><button class="btn" id="again">Run It Back</button></div>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1,GY=0,T=42,G=0.4,GC=0.84;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); GY=H*0.72; }
  addEventListener('resize',resize); resize();
  function beep(f,d,t,v){ try{var a=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());var o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||0.05;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+(d||0.08));o.stop(a.currentTime+(d||0.08)+0.02);}catch(e){} }
  function cheer(){ beep(523,0.1,'square',0.06); setTimeout(function(){beep(784,0.16,'square',0.06);},100); }
  var off, defx, hoop, ball, score, timeLeft, running, holding, meter, gw, msgT, crowd, nowv=0, defLag;
  function reset(){ hoop={x:W/2,y:H*0.2,r:24}; off={x:W/2}; defx=W/2; defLag=0.05; ball={flying:false,x:W/2,y:GY-16,vx:0,vy:0,frame:0,green:false,spin:0}; score=0; timeLeft=60; running=true; holding=false; meter=0; gw=0.06; msgT=0;
    crowd=[]; for(var i=0;i<40;i++) crowd.push({x:Math.random()*W,c:['#ff8a1e','#43c6ff','#ffd23f','#ff6ad5'][Math.floor(Math.random()*4)],j:0});
    document.getElementById('over').style.display='none'; document.getElementById('score').textContent='0'; document.getElementById('time').textContent='60';
    if(!reset._t){ reset._t=setInterval(function(){ if(running){ timeLeft--; document.getElementById('time').textContent=Math.max(0,timeLeft); if(timeLeft<=0) over(); } },1000); } }
  function juke(d){ if(!running||ball.flying)return; off.x=Math.max(W*0.15,Math.min(W*0.85,off.x+d*46)); beep(400,0.05,'square',0.04); }
  document.getElementById('kl').addEventListener('touchstart',function(e){juke(-1);e.preventDefault();},{passive:false}); document.getElementById('kl').addEventListener('mousedown',function(){juke(-1);});
  document.getElementById('kr').addEventListener('touchstart',function(e){juke(1);e.preventDefault();},{passive:false}); document.getElementById('kr').addEventListener('mousedown',function(){juke(1);});
  addEventListener('keydown',function(e){ if(e.key==='ArrowLeft')juke(-1); if(e.key==='ArrowRight')juke(1); if(e.key===' ')startHold(); });
  addEventListener('keyup',function(e){ if(e.key===' ')release(); });
  function startHold(){ if(!running||ball.flying||holding)return; holding=true; meter=0; }
  function release(){ if(!holding)return; holding=false; ball.x=off.x; ball.y=GY-16; var off2=meter-GC; var pf=1+off2*1.4; var perfectVy=(hoop.y-ball.y-0.5*G*T*T)/T; ball.vy=perfectVy*pf; ball.vx=(hoop.x-ball.x)/T; ball.flying=true; ball.frame=0; ball.green=Math.abs(off2)<gw; ball.deep=Math.abs(off.x-W/2)>W*0.28; beep(ball.green?520:300,0.1,'sine',0.05); }
  document.getElementById('shoot').addEventListener('touchstart',function(e){startHold();e.preventDefault();},{passive:false}); document.getElementById('shoot').addEventListener('touchend',function(e){release();e.preventDefault();},{passive:false});
  document.getElementById('shoot').addEventListener('mousedown',startHold); document.getElementById('shoot').addEventListener('mouseup',release);
  document.getElementById('again').onclick=reset;
  function showMsg(m,col){ var e=document.getElementById('msg'); e.textContent=m; e.style.color=col||'#ffd23f'; e.style.opacity=1; msgT=1; }
  function result(made){ if(made){ var pts=ball.deep?3:2; score+=pts; document.getElementById('score').textContent=score; showMsg((ball.deep?'🔥 DEEP 3! +3':'💰 BUCKET! +2'),'#7bff9e'); cheer(); for(var i=0;i<crowd.length;i++)crowd[i].j=1; }
    else { showMsg('🧱 BRICK!','#ff6a6a'); beep(160,0.15,'sawtooth',0.05); }
    ball.flying=false; ball.x=off.x; ball.y=GY-16; defLag=Math.min(0.14,defLag+0.004); }
  function over(){ running=false; document.getElementById('os').innerHTML='You dropped <b>'+score+'</b> points! 🏀'; document.getElementById('over').style.display='flex'; }
  var gap=0;
  function update(dt){
    defx+=(off.x-defx)*defLag*dt; gap=Math.abs(off.x-defx);
    var openness=Math.min(1,gap/(W*0.16)); gw=0.03+openness*0.09;
    document.getElementById('open').textContent = openness>0.7?'WIDE OPEN!':openness>0.35?'Some space':'Guarded';
    if(holding){ meter+=0.02*dt; if(meter>=1){ meter=1; release(); } }
    if(ball.flying){ ball.frame+=dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt; ball.vy+=G*dt; ball.spin+=0.3*dt;
      if(ball.frame>=T){ result(ball.green||Math.abs(ball.y-hoop.y)<18); return; } if(ball.y>GY+30){ result(false); } }
    for(var i=0;i<crowd.length;i++){ if(crowd[i].j>0)crowd[i].j-=0.05*dt; }
    if(msgT>0){ msgT-=0.016*dt; if(msgT<=0)document.getElementById('msg').style.opacity=0; }
  }
  function render(){
    ctx.fillStyle='#4a4f57'; ctx.fillRect(0,0,W,H);
    // chain fence + crowd top
    ctx.fillStyle='#2a2f37'; ctx.fillRect(0,0,W,H*0.12); for(var i=0;i<crowd.length;i++){ var c=crowd[i]; ctx.fillStyle=c.c; ctx.beginPath(); ctx.arc(c.x,20-(c.j>0?c.j*6:0),4,0,6.29); ctx.fill(); }
    ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1; for(var x=0;x<W;x+=16){ ctx.beginPath(); ctx.moveTo(x,H*0.12); ctx.lineTo(x+16,H*0.12+16); ctx.stroke(); }
    // court
    ctx.fillStyle='#5a5f67'; ctx.fillRect(0,H*0.12,W,H);
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(W/2,GY,80,Math.PI,6.29); ctx.stroke();
    // hoop
    ctx.fillStyle='#8a94a0'; ctx.fillRect(hoop.x-4,hoop.y-44,8,-30);
    ctx.fillStyle='#eef3f7'; ctx.fillRect(hoop.x-28,hoop.y-44,56,10); ctx.strokeStyle='#c0392b'; ctx.lineWidth=3; ctx.strokeRect(hoop.x-28,hoop.y-44,56,10);
    ctx.strokeStyle='#ff7b00'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(hoop.x,hoop.y,hoop.r,7,0,0,6.29); ctx.stroke();
    // defender
    drawP(defx,GY,'#8a2be2','D',true);
    // you
    drawP(off.x,GY,'#1a6fd0','MO',false);
    // ball
    if(ball.flying) drawBall(ball.x,ball.y); else { ctx.fillStyle='#e0701f'; ctx.beginPath(); ctx.arc(off.x+18,GY+2+Math.abs(Math.sin(nowv*0.02))*8,8,0,6.29); ctx.fill(); }
    draw2K();
  }
  function draw2K(){ if(ball.flying||!holding && false){} if(ball.flying)return; var mx=off.x+30, my=GY-150, mh=140, mw=18;
    ctx.fillStyle='#0009'; roundRect(mx,my,mw,mh,9); ctx.fill();
    var gy1=my+mh*(1-(GC+gw)), gy2=my+mh*(1-(GC-gw)); ctx.fillStyle='#37d06a'; ctx.fillRect(mx+2,gy1,mw-4,gy2-gy1);
    ctx.fillStyle=holding?'#ffd23f':'#888'; ctx.fillRect(mx+2,my+mh*(1-meter),mw-4,mh*meter);
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; roundRect(mx,my,mw,mh,9); ctx.stroke(); }
  function drawP(x,y,col,label,arms){ ctx.save(); ctx.translate(x,y-20);
    if(arms){ ctx.strokeStyle=col; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-12,-4); ctx.lineTo(-20,-24); ctx.moveTo(12,-4); ctx.lineTo(20,-24); ctx.stroke(); }
    ctx.fillStyle=col; roundRect(-14,-16,28,32,9); ctx.fill();
    ctx.fillStyle='#f6c48a'; ctx.beginPath(); ctx.arc(0,-26,11,0,6.29); ctx.fill(); ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(0,-29,11,Math.PI,6.29); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,0,-1); ctx.restore(); }
  function drawBall(x,y){ var r=13; ctx.save(); ctx.translate(x,y); ctx.rotate(ball.spin); var grd=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.2,0,0,r); grd.addColorStop(0,'#ffb15c'); grd.addColorStop(1,'#e0701f'); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,0,r,0,6.29); ctx.fill(); ctx.strokeStyle='#7a3d10'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,r,0,6.29); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.moveTo(0,-r); ctx.lineTo(0,r); ctx.stroke(); ctx.restore(); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  var last=0;
  function loop(ts){ nowv=ts; if(!last)last=ts; var dt=Math.min(2.4,((ts-last)/16.67)||1); last=ts; if(running) update(dt); render(); requestAnimationFrame(loop); }
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
